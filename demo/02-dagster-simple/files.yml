# files.yml — реестр ОБЩИХ файлов демо блока «Оркестрация ML-пайплайнов на Dagster».
#
# Зачем. Сырьё jaffle shop и status.py должны быть одинаковыми во всех демо: если в одном
# демо витрина построена на других данных, числа на слайдах разойдутся. Копии для этого
# не годятся — они расходятся молча. Файлы связаны ХАРДЛИНКАМИ: один инод, правка в любой
# папке сразу видна в остальных.
#
# ВАЖНО ПРО GIT. Git хардлинков не хранит: при клоне на новой машине получатся обычные
# отдельные файлы с тем же содержимым. Всё продолжит работать, но правка в одной папке
# перестанет доезжать до другой — связь восстанавливается `just demo-files-link` из корня
# репозитория. Проверка целостности — `just demo-files-check` (тест
# 02-dagster-dbt/ml-platform/tests/test_files_registry.py).
#
# owner — та копия, которую считаем канонической при расхождении.
# Сверка: sha256 содержимого; inode приведён как след на момент записи и после клона
# будет другим — это нормально.
#
# Демо 3 в блоке ещё нет. Когда появится, его копии добавляются в те же группы, а
# analytics_dbt/ станет общим между демо 2 и демо 3 (см. analytics_dbt/README.md).

