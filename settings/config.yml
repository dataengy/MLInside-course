# ── Deck generation policy (create-preza-about-de-tool) ─────────────────────
# Курс НЕ ограничивает число слайдов (менеджер, 2026-08): первичен тайминг →
# course_production.lecture. Границы ниже — внутренний гейт генератора.
# Bounds enforced by the skill's validate_content.py before every build.
deck_generation:
  slides_min: 20
  slides_max: 110                 # 2026-09-01: 90→110 — Dagster v2.1: Quick Start развёрнут в 10 шагов, блок dbt по уровням 0→4,
                                  #             сравнение переписано на Airflow 2.x/3.x/Dagster, четыре референс-архитектуры;
                                  #             приложение выросло до 19 слайдов (A1–A13)
                                  # 2026-09-01: 76→90 — Dagster v2: Quick Start, блок dbt и ML lifecycle;
                                  #             справочник сущностей ушёл в приложение 9xx (11 слайдов);
                                  #             сравнение с Airflow разбито надвое — 12 строк не влезали над подвалом
                                  # 2026-08-26: 72→76 — Jinja вглубь: циклы/условия, контекст и отладка через compile, диспетчеризация макросов
                                  # 2026-08-25: 64→72 — моделирование (ER, medallion/EDW, project_evaluator, Data Vault), MV в ClickHouse, микробатчинг, стриминг, права доступа
                                  # 2026-08-25: 58→64 — тулинг (VS Code/IDE), Fusion+Core v2, ещё пакеты, пакеты в CI, slim CI, State/Wizard; SQLMesh сжат с 3 слайдов до 2
                                  # 2026-08-24: 55→58 — блок про dbt-пакеты (DQ, рефакторинг, версии) + переезд двух SQLMesh-слайдов из Dagster-деки
                                  # 2026-08-13: 50→55 — dbt-дека 51+ слайд после ДЗ-секции, Dagster 50→51 под акцент ML-пайплайна
  visuals_default: code-tables    # code-tables | reuse-source | image-pipeline
  provenance:                     # stamped into the FIRST + LAST slide notes
    harness: "Claude Code"
    marker: "— Сгенерировано:"
  # Деки, которые наши ПРАВЯЩИЕ ленты не трогают: предмет ведёт другой лектор, и его
  # содержание — его зона. Запрет висит на единственной точке записи контента
  # (scripts/preza/edit_slides.py::_write), поэтому обойти его случайно нельзя.
  # ЧИТАЮЩИЕ ленты (preza-review, publish, планы блоков записи, presentations-plan)
  # деку по-прежнему видят — исключение про правку, а не про существование.
  editing_excluded:
    - content/preza-apache-airflow-content.yml   # Apache Airflow — предмет Влада Бояджи
  decks:
    - content/preza-dbt-v3-content.yml
    - content/preza-dagster-content.yml        # v1.4 — предыдущая редакция, оставлена для сверки
    - content/preza-dagster-v2-content.yml     # актуальная дека лекции 6
    - content/preza-prefect-content.yml
    - content/preza-cicd-observability-content.yml
    - content/preza-apache-airflow-content.yml
    - content/preza-ogip-content.yml        # OGIP showcase (portfolio artifact, not a lecture)

