# ── settings/reminders.yml — напоминания курса в Todoist (src/course/reminders.py) ────────
# Данные ленты: что напоминать, когда и с каким приоритетом. Мутирующий вход —
# `just course-reminders-apply` (scripts/todoist/upsert_reminders.py); без --apply — план.
# Spec: docs/course-rules.md#напоминания. Правила и сроки — settings/config.yml → course_production.
#
# Идемпотентность: в описании задачи пишется строка `key: <key>`; повторный прогон находит
# задачу по ней и синхронизирует срок/приоритет/лейблы/текст вместо создания дубля
# (см. глоссарий: .ai/AI-glossary.ru.md#ключ-напоминания). Задачу можно переименовать руками.
#
# priority: 4=срочный (p1 в UI) · 3=очень высокий · 2=высокий · 1=обычный.
# Проекты Todoist: free-тариф ограничен 8 активными (см. AI-glossary.en.md#max_projects_limit_reached);
# ёмкость и слияния — `just -f ~/.ai/skills/_scripts/tasks/todoist/Justfile projects-capacity`.

