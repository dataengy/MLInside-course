# ── settings/publish.yml — deck publish pipeline (src/publisher, `just publish-new`) ────
# Non-secret. Spreadsheet id / header row / tab override / column candidates come from
# settings/gsheet.yml via schedule.settings — do NOT restate them here (single source).
# Spec: docs/deck-publish-pipeline.md

telegram:
  slug: mlinside_course        # tg-project-inform.sh routing slug (chat/topic from ~/.ai)
  kind: milestone
  max_upload_mb: 49            # pre-flight guard under tg-send-file.sh's hard 50MB cap
  chat: null                   # null → ~/.ai deck-publish.yml default (MLInside topic 118)
  thread: null

drive:
  folder_id: 1L-Jau_Xl78f_dXA611grdsKnxLUKU5Tp   # just publish-init-drive (2026-08-20)
  folder_name: "MLInside 2026 — decks"
  parent_folder_id: root
  share: anyone_reader         # anyone_reader | none — ensured on every successful upload

sheet:
  columns:                     # header text per written field; dict order = append order
    url: "pptx (GDrive)"
    version: "версия"
    slides: "слайдов"
  link_style: url              # url (plain string) | hyperlink (=HYPERLINK formula)

auth:
  # DEFAULT LANE (Drive) — gcloud user-ADC file (authorized_user JSON) as the token cache.
  # drive.file (NOT full drive): non-sensitive, covers files this app created — its own
  # folder + one file per subject. Full `drive` is restricted and Google blocks it on the
  # gcloud consent screen (2026-08-18). Consequence: find_by_name only sees app-created
  # files, which is exactly what the adopt-on-lost-cursor path needs.
  # `spreadsheets` is NOT here on purpose: it is a *sensitive* scope and the gcloud consent
  # screen blocks it too («This app is blocked», 2026-08-20) — the sheet leg therefore runs
  # on its own lane below. google-auth raises RefreshError when a requested scope was not
  # granted, so this list must match what adc-login actually got.
  scopes:
    - https://www.googleapis.com/auth/drive.file
  token_cache_env: GOOGLE_OAUTH_TOKEN_CACHE
  token_cache_default: ~/.config/gcloud/application_default_credentials.json
  # Drive API refuses user-ADC calls without a quota project, and the ADC file's own
  # quota project (stambul-tts) has the API off. Set here — per-credential, via
  # with_quota_project — so the machine-wide ADC quota project stays untouched (other
  # local projects depend on it). No data lives in this project: it only accounts API
  # usage; it must have drive.googleapis.com enabled.
  quota_project: tg2gcal
  # Env override: $GOOGLE_SERVICE_ACCOUNT_FILE. A service account has no storage quota on a
  # personal Drive, so it can serve the sheet, never the Drive upload.
  service_account_file_env: GOOGLE_SERVICE_ACCOUNT_FILE
  service_account_file: null
  # SHEET LANE — overrides for the sheet leg only (unset keys fall back to the block above).
  # Browser-less: a service-account key, with the schedule sheet shared to its address as
  # Editor. Without it the sheet leg fails in isolation (drive + tg still publish).
  sheet:
    scopes:
      - https://www.googleapis.com/auth/spreadsheets
    # gsheets-reader@for-prodamus-1-494316.iam.gserviceaccount.com — the same key the READ
    # lane uses; the sheet must additionally grant it Editor (it holds Viewer today).
    service_account_file: ~/.secrets/google-sa-for-prodamus-1-494316.json
    quota_project: null          # a service account bills its own project

api:
  # Google отвечает 503/500/429 на здоровый запрос время от времени (наблюдалось на чтении
  # листа 2026-08-25 — повтор прошёл сразу). Без ретрая такой чих неотличим от настоящего
  # отказа: лег пишется `error` в git-tracked `published:`. Ретраятся ТОЛЬКО транзиентные
  # коды — 403 (квота/права) и 404 повторять бессмысленно, это работа для человека.
  retries: 4

state_file: data/.state/deck-publish-state.json
