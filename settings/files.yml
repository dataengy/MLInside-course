# files.yml — provenance of external inputs ingested into data/
#
# ВНИМАНИЕ: ключ `ingested:` генерируется командой `just ingest`
# (preza_gen.ingest) — руками его не править.
#
# Ключ `presentation:` ниже ведётся РУКАМИ и генератором не создаётся.
# ⚠️ `preza_gen.ingest` сейчас перезаписывает файл целиком (`write_text(header + body)`,
# где body — только `{"ingested": …}`), то есть очередной `just ingest` СОТРЁТ раздел
# `presentation`. Пока это не починено, перед `just ingest` сохраняйте раздел, а после —
# возвращайте. Починка на одну строку: читать существующий файл и мержить `ingested`
# в разобранный документ вместо замены документа целиком.
#
# method: hardlink (same inode) | copy (cross-volume fallback) | download (url).
ingested:
  data/source/MLinside-шаблон-презентаций.pptx:
    source: ~/Library/Mobile Documents/com~apple~CloudDocs/_2025-11-ВШЭ_ВНЕШНЕЕ_ОБУЧЕНИЕ/HSU
      & MLInside/MLinside шаблон презентаций.pptx
    method: hardlink
    inode: 246377631
    bytes: 84476
  data/source/NEW_ВШЭ_Семинар9-Практикум-по-dbt.pptx:
    source: ~/Library/Mobile Documents/com~apple~CloudDocs/_2025-11-ВШЭ_ВНЕШНЕЕ_ОБУЧЕНИЕ/_!_HSU_202612/NEW_ВШЭ_Семинар9-Практикум
      по dbt.pptx
    method: hardlink
    inode: 195191955
    bytes: 80108827

# ── презентации: какая версия «та самая» и где разошлись ветки ────────────────────────────
#
# ЗАЧЕМ РАЗДЕЛ. Дека существует в двух видах одновременно, и это её нормальное состояние:
# генератор пересобирает pptx из `content/*-content.yml`, а человек правит готовый pptx
# руками в PowerPoint. Пока обе стороны идут от одной точки — всё хорошо. Но стоит человеку
# начать править версию N, а генератору уйти на N+1, N+2 — получаются ДВЕ разошедшиеся
# линии с общим предком, и слияние приходится делать вручную, слайд за слайдом.
#
# Смысл записи — не архив, а предупреждение: прежде чем править деку руками, посмотрите
# сюда и убедитесь, что правите ту версию, которая объявлена текущей.
#
# ВАЖНО ПРО ПРИРОДУ РАСХОЖДЕНИЯ. Правка, сделанная только в pptx, умирает на следующей
# сборке: генератор соберёт деку из YAML заново и ничего о ней не узнает. Поэтому слияние
# всегда идёт в одну сторону — из ручной деки В КОНТЕНТ, а не наоборот.
#
# ИСКЛЮЧЕНИЕ, 2026-09-02. Ручных линий оказалось ДВЕ, и переносить в контент было нечего до
# тех пор, пока они не сведены между собой. Слияние pptx↔pptx сделано разово скриптом
# `.tmp/graft_slides.py` (`just -f .tmp/Justfile graft-v47man`). Это не отменяет правило
# выше: результат v4.7.5-man всё равно ждёт переноса в контент, просто теперь переносить
# надо из ОДНОГО файла, а не из двух.
#
# ЧЕЛОВЕКОЧИТАЕМЫЙ ВИД этого раздела — `settings/files.md`, он ГЕНЕРИРУЕТСЯ отсюда
# (`just -f .tmp/Justfile files-md`). Правьте YAML, потом перегенерируйте .md.
presentation:

  # Кого открывать и править. Ручная и генераторская головы держатся ОТДЕЛЬНО: пока правки
  # из ручной не уехали в контент, «текущая» у них разная, и путать их нельзя.
  current:
    MLInside_Введение-в-dbt:
      manual: data/source/manual/MLInside_Введение-в-dbt_v4.7.5-man.pptx
      generated: /Users/user/Downloads/_MLInside.2026-08/MLInside_Введение-в-dbt_v4.9.0.pptx

  # Линии развития. Ключ линии проставлен каждому форку в поле `line` — по нему видно
  # родство, которого НЕ видно по номеру версии в имени файла.
  lines:
    A:
      kind: manual
      descr: Основная ручная линия, от неё взята база слияния.
      chain: [v4.7.0+man, v4.7.2-man@source-manual, v4.7.3-man, v4.7.4-man]
    B:
      kind: manual
      descr: >-
        Боковой форк. Номер 4.7.2 в имени вводит в заблуждение: по содержимому линия не
        предшествует v4.7.3, а идёт вбок от общего предка.
      chain: [v4.7.2-man@drafts]
    M:
      kind: manual
      descr: Свод линий A и B, 2026-09-02.
      chain: [v4.7.5-man]
    G:
      kind: generated
      descr: Сборки из content/preza-dbt-v4-content.yml, всегда воспроизводимы командой.
      chain: [v4.9.0]

  # Общий предок ВСЕХ линий — v4.7.0 (126 слайдов): последняя версия, где ручная и
  # генераторская стороны совпадали.
  common_ancestor: v4.7.0

  # ⚠️ КОЛЛИЗИЯ ИМЁН, из-за которой прежняя запись здесь считала два файла одним:
  # `v4.7.2-man` носили ДВА разных файла — 130 слайдов в data/source/manual (линия A) и
