# ──────────────────────────────────────────────────────────────────────────────
# How to read the course schedule sheet (src/schedule). See docs/schedule-gsheet-lane.md.
#
# ВАЖНО: mapping.columns ЗАМЕЩАЕТ встроенный DEFAULT_MAPPING целиком (settings.py::load()
# не мержит по-полевому) — карта колонок здесь всегда повторяется ПОЛНОСТЬЮ, даже там,
# где дефолт уже подходит. Ключевое отличие от дефолта: "тезисы" в accents.
#
# Живой лист (2026-08): заголовки `старая запись | название | тезисы | лектор`.
# "старая запись" (ссылка на прошлогоднюю запись) сознательно НЕ мапится в n:
# свободный текст сломал бы topic-ключ upsert-а. Колонок №/дата/статус на листе нет —
# эти поля просто не резолвятся, это нормально.
# ──────────────────────────────────────────────────────────────────────────────
spreadsheet:
  id: 1cxYGtU36nbmO5DhjtNkm_HMESiNPwoWdd6QY8yb2JaU

read:
  tabs: []              # [] = dump every tab
  max_rows: 500
  max_cols: 40

mapping:
  tab: Sheet1           # реальное имя (just gsheet-tabs, 2026-08-19); лист «mlinside-mlops»
  header_row: 1
  columns:
    n: ["№", "номер", "no", "#", "n"]
    date: ["дата", "date"]
    topic: ["тема", "topic", "название", "лекция", "семинар"]
    owner: ["лектор", "owner", "ответственный", "автор", "преподаватель"]
    status: ["статус", "status"]
    accents: ["тезисы", "акценты", "accents", "ключевые моменты", "содержание", "что рассказать"]
    notes: ["комментарий", "комментарии", "notes", "заметки"]
  accents_split: ["\n", ";", "•"]
  # Тезисы-ячейка — один абзац "1. … 2. … 3. …": резать и по номерным границам
  # (идемпотентно и при настоящих переводах строк; см. mapper._NUMBERED_ITEM).
  accents_split_numbering: true

outputs:
  raw: settings/schedule.yml
  plan: content/presentations.yml
