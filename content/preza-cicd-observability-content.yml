      - всё выше + правило алерта на устаревшую витрину с `for` + Alertmanager с доставкой в Telegram
        (скриншот сообщения) + метрики длительности и числа строк + CI прогоняет dbt build на изменённых
        моделях с артефактом отчёта
    - - '10'
      - 'всё выше + дашборды и datasource через provisioning из репозитория + второй канал доставки или
        маршрутизация по severity + осмысленный SLO по свежести с обоснованием порога + один нетривиальный
        элемент на выбор: self-hosted раннер, экспортер ClickHouse, трассировка через OpenTelemetry или
        мониторинг дрейфа данных'
    col_ratios:
