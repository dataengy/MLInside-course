    rows:
    - - 6–7
      - Prometheus и Grafana подняты в docker-compose; пайплайн отдаёт минимум одну метрику (метка времени
        успешного прогона); есть дашборд хотя бы с двумя панелями; CI-джоба с линтом и dbt parse проходит
        зелёной
