    - 9
  notes: 'Логика та же, что в предыдущих заданиях. **6–7 баллов** — «__поднято и работает__»: стек живой,
    метрика есть, CI зелёный. Это база, и она достижима за вечер.


    **8–9** — появляется то, ради чего мониторинг и делают: !!алерт, который реально доходит до человека!!.
    **10 баллов** — это __воспроизводимость и осмысленность__: конфигурация из репозитория, обоснованный
    SLO и один самостоятельно освоенный элемент. ~~Оценивается не количество панелей, а способность объяснить,
    почему выбран именно такой порог и почему на этот алерт стоит реагировать ночью.~~

    '
