- kind: content
  id: 038-dz-minimalnyj-stek-monitoringa
  title: 'ДЗ: минимальный стек мониторинга + CI'
  code_caption: docker-compose.yml и правило алерта — каркас
  code: "services:\n  prometheus:\n    image: prom/prometheus\n    volumes:\n      - ./prometheus.yml:/etc/prometheus/prometheus.yml\n\
    \      - ./rules:/etc/prometheus/rules\n    ports: [\"9090:9090\"]\n  alertmanager:\n    image: prom/alertmanager\n\
    \    volumes: [\"./alertmanager.yml:/etc/alertmanager/alertmanager.yml\"]\n    ports: [\"9093:9093\"\
    ]\n  grafana:\n    image: grafana/grafana\n    volumes: [\"./provisioning:/etc/grafana/provisioning\"\
    ]\n    ports: [\"3000:3000\"]\n  pushgateway:\n    image: prom/pushgateway      # метрики короткого\
    \ dbt-прогона\n    ports: [\"9091:9091\"]\n\n# rules/dbt.yml\n- alert: DbtMartStale\n  expr: time()\
    \ - max(dbt_run_last_success_timestamp_seconds) > 3600\n  for: 10m\n  labels: { severity: critical\
    \ }\n  annotations: { summary: \"Витрина transactions не обновлялась > 1ч\" }\n"
  bullets:
  - Поднять Prometheus, Alertmanager, Grafana (можно Pushgateway)
  - 'Отдавать метрики пайплайна: успех, длительность, число строк'
  - 'Дашборд Grafana: свежесть, длительность, доля падений'
  - Алерт про устаревшую витрину с доставкой в Telegram
  - 'CI-пайплайн: sqlfluff lint, dbt parse, dbt build на изменённых'
  - 'В отчёт: скриншот дашборда, скриншот алерта, ссылка на прогон CI'
  notes: 'Постановка: берём пайплайн из предыдущих заданий и !!обвешиваем его автоматизацией и мониторингом!!.
    Технически всё поднимается одним `docker-compose up`, поэтому основная работа — не в инфраструктуре,
    а в том, __какие метрики вы решите отдавать__.


    Минимальный набор метрик: **отметка времени успешного прогона**, **длительность** и **число обработанных
    строк**. Первой хватает на самый ценный алерт — про устаревшую витрину. Параллельно собираем **CI**:
    линт SQL, `dbt parse` и сборка изменённых моделей. ~~Платформа CI на ваш выбор — GitLab CI или GitHub
    Actions, это не влияет на оценку.~~

    '
