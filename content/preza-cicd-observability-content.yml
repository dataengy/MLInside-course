    col_ratios: [3, 5, 4]
  notes: |
    Инструменты не конкурируют, а закрывают разные слои. **MLflow** — про __жизненный цикл модели__: эксперименты, версии, реестр. **Evidently** — про данные и дрейф. **Langfuse** и **Arize Phoenix** — про наблюдаемость LLM-приложений: трейсы, стоимость, оценки.

    Практический вывод: !!Prometheus и Grafana остаются общим слоем!! — в них стекаются алерты и инфраструктурные метрики из всех остальных систем. Типовая связка на проекте — специализированный инструмент для качества плюс Prometheus для «жив/не жив» и дежурства. ~~Ниша LLM-инструментов очень быстро меняется, поэтому смотрите на назначение, а не на конкретные имена — они устареют раньше вашего проекта.~~

# ── §9 Домашнее задание ───────────────────────────────────────────────────────
- kind: section
  id: 037-domashnee-zadanie
  title: Домашнее задание
  notes: |
    Финальный блок — практика. Задание !!продолжает ваши предыдущие ДЗ по dbt и Dagster!!.

    Тот же датасет `transactions_db.transactions` в **ClickHouse**, но теперь вокруг пайплайна надо __построить контур автоматизации и наблюдения__.

- kind: content
  id: 038-dz-minimalnyj-stek-monitoringa
  title: 'ДЗ: минимальный стек мониторинга + CI'
  code_caption: 'docker-compose.yml и правило алерта — каркас'
  code: |
    services:
      prometheus:
        image: prom/prometheus
        volumes:
          - ./prometheus.yml:/etc/prometheus/prometheus.yml
          - ./rules:/etc/prometheus/rules
        ports: ["9090:9090"]
      alertmanager:
        image: prom/alertmanager
        volumes: ["./alertmanager.yml:/etc/alertmanager/alertmanager.yml"]
        ports: ["9093:9093"]
      grafana:
        image: grafana/grafana
        volumes: ["./provisioning:/etc/grafana/provisioning"]
        ports: ["3000:3000"]
      pushgateway:
        image: prom/pushgateway      # метрики короткого dbt-прогона
        ports: ["9091:9091"]

    # rules/dbt.yml
    - alert: DbtMartStale
      expr: time() - max(dbt_run_last_success_timestamp_seconds) > 3600
      for: 10m
      labels: { severity: critical }
      annotations: { summary: "Витрина transactions не обновлялась > 1ч" }
  bullets:
  - 'Поднять Prometheus, Alertmanager, Grafana (можно Pushgateway)'
  - 'Отдавать метрики пайплайна: успех, длительность, число строк'
  - 'Дашборд Grafana: свежесть, длительность, доля падений'
  - 'Алерт про устаревшую витрину с доставкой в Telegram'
  - 'CI-пайплайн: sqlfluff lint, dbt parse, dbt build на изменённых'
  - 'В отчёт: скриншот дашборда, скриншот алерта, ссылка на прогон CI'
  notes: |
    Постановка: берём пайплайн из предыдущих заданий и !!обвешиваем его автоматизацией и мониторингом!!. Технически всё поднимается одним `docker-compose up`, поэтому основная работа — не в инфраструктуре, а в том, __какие метрики вы решите отдавать__.

    Минимальный набор метрик: **отметка времени успешного прогона**, **длительность** и **число обработанных строк**. Первой хватает на самый ценный алерт — про устаревшую витрину. Параллельно собираем **CI**: линт SQL, `dbt parse` и сборка изменённых моделей. ~~Платформа CI на ваш выбор — GitLab CI или GitHub Actions, это не влияет на оценку.~~

- kind: table
  id: 039-dz-kriterii-ocenki
  title: 'ДЗ: критерии оценки'
  table:
    headers:
    - Баллы
    - Что должно быть сделано
    rows:
    - - '6–7'
      - 'Prometheus и Grafana подняты в docker-compose; пайплайн отдаёт минимум одну метрику (метка времени успешного прогона); есть дашборд хотя бы с двумя панелями; CI-джоба с линтом и dbt parse проходит зелёной'
    - - '8–9'
      - 'всё выше + правило алерта на устаревшую витрину с `for` + Alertmanager с доставкой в Telegram (скриншот сообщения) + метрики длительности и числа строк + CI прогоняет dbt build на изменённых моделях с артефактом отчёта'
    - - '10'
      - 'всё выше + дашборды и datasource через provisioning из репозитория + второй канал доставки или маршрутизация по severity + осмысленный SLO по свежести с обоснованием порога + один нетривиальный элемент на выбор: self-hosted раннер, экспортер ClickHouse, трассировка через OpenTelemetry или мониторинг дрейфа данных'
    col_ratios: [2, 9]
  notes: |
    Логика та же, что в предыдущих заданиях. **6–7 баллов** — «__поднято и работает__»: стек живой, метрика есть, CI зелёный. Это база, и она достижима за вечер.

    **8–9** — появляется то, ради чего мониторинг и делают: !!алерт, который реально доходит до человека!!. **10 баллов** — это __воспроизводимость и осмысленность__: конфигурация из репозитория, обоснованный SLO и один самостоятельно освоенный элемент. ~~Оценивается не количество панелей, а способность объяснить, почему выбран именно такой порог и почему на этот алерт стоит реагировать ночью.~~

