# ── §N Домашнее задание ───────────────────────────────────────────────────────
- kind: section
  id: 048-domashnee-zadanie
  title: Домашнее задание
  notes: 'Финальный блок — практика. Задание на !!реальном, намеренно «грязном» датасете!!: публичные данные бразильского маркетплейса **Olist**, около 100 тысяч заказов за 2016–2018 годы.


    Половина работы — не написать SQL, а __обойти подводные камни данных__. Они в задании перечислены честно, но обходить их придётся самим.'

- kind: content
  id: 049-dz-vitriny-na-datasete-olist
  title: 'ДЗ: витрины на датасете Olist'
  code_caption: 'Слои проекта — от них можно отталкиваться'
  code: |
    dbt/
      models/
        sources/sources.yml   # 8 источников: заказы, позиции, платежи, отзывы…
        staging/              # приведение типов, чистка, вычисляемые поля
        intermediate/         # ЯВНАЯ гранулярность: заказ и позиция заказа
        marts/                # 6 витрин, каждая отвечает на один вопрос
      macros/                 # минимум один свой макрос
      seeds/                  # справочник, живущий вместе с кодом
      tests/                  # singular-тесты
  bullets:
  - 'Датасет: Olist Brazilian E-Commerce (Kaggle), 99 441 заказ'
  - 'Флага фрода НЕТ — негативный сигнал конструируете сами'
  - 'is_late_delivery, is_bad_review, is_canceled — и правильный знаменатель'
  - 'Слой intermediate обязателен: заказы разворачиваются в позиции 99k → 112k'
  - '≥1 свой макрос, seed, schema.yml с описаниями и тестами'
  - 'dbt docs generate + скриншот DAG в отчёт'
  notes: 'Задание — адаптация семинарской работы по фрод-транзакциям. Тогда в данных лежал готовый флаг `target ∈ {0,1}`, и «плохой исход» был известен заранее. Здесь его !!нет!! — признак проблемного заказа придётся собрать самим из даты доставки, оценки отзыва и статуса. Это и есть главное отличие учебной задачи от рабочей.


    Отдельно продумайте **знаменатель**. Доля просрочек считается только по заказам с непустой датой доставки — а таких 97%, у остальных доставки не было. Доля плохих отзывов — только по заказам с отзывом. __Заказ без отзыва это не «отзыв на ноль баллов»__.


    Слой `intermediate` здесь не роскошь: заказы разворачиваются в позиции, 99 441 против 112 650. Любая метрика «доля заказов…», посчитанная по таблице позиций, окажется завышена в пользу многопозиционных заказов. ~~Полное описание датасета и его ловушек — в DATASET.md репозитория с заданием.~~'

- kind: table
  id: 050-dz-kriterii-ocenki
  title: 'ДЗ: критерии оценки'
  table:
    headers:
    - Баллы
    - Что должно быть сделано
    rows:
    - - '6–7'
      - 'слои source → staging → marts; минимум 2 витрины; свой макрос и его использование; пакеты dbt_utils и/или dbt_date; schema.yml с описаниями и тестами (not_null, unique, accepted_values, unique_combination_of_columns); зелёный dbt build; dbt docs generate'
    - - '8–9'
      - 'всё выше + минимум 4 витрины + слой intermediate с проверкой гранулярности (dbt_utils.equal_rowcount) + seed + dbt_expectations и/или dbt_project_evaluator + минимум 2 singular-теста + dbt source freshness'
    - - '10'
      - 'всё выше + все 6 витрин + unit-тесты (dbt ≥ 1.8) + sqlfluff + .pre-commit-config.yaml + Makefile/Justfile + сборка на двух таргетах (ClickHouse и DuckDB) + CI'
    col_ratios: [2, 9]
  notes: 'Логика та же, что была в прошлых заданиях: **6–7** — «работает и правильно устроено», **8–9** — добавляется всё, ради чего dbt и берут, **10** — инженерная обвязка вокруг проекта.


    Важная оговорка про пакеты. В исходной формулировке на 8–9 баллов требовался **elementary** — он !!не поддерживает ни ClickHouse, ни DuckDB!!, поэтому из задания исключён. **dbt_project_evaluator** не работает на ClickHouse: пакет сам себе противоречит в дефолтах и ломает парсинг всего проекта, даже когда его модели отключены. Поэтому требование сформулировано как «dbt_expectations __и/или__ dbt_project_evaluator (последний — только на DuckDB)».


    Это не придирка к пакетам, а часть задания: __проверять совместимость до того, как строить на пакете свою работу__. ~~Обход для ClickHouse показан в эталонном решении.~~'

