    Для многих других, включая **ClickHouse** и **DuckDB**, — качественные **community**-адаптеры. Ставится нужный адаптер отдельным пакетом (**dbt-postgres**, **dbt-clickhouse**…), и !!один и тот же проект в разумных пределах переносим между платформами!!.'
- kind: section
  id: 026-testirovanie-dokumentaciya
  title: Тестирование, документация, пакеты
  notes: 'Следующий блок — про **качество** и **переиспользование**.


    Как __тестировать данные__, как получать **документацию** почти бесплатно и как подключать готовые **пакеты**, чтобы не изобретать велосипед.'
- kind: content
  id: 027-dokumentirovanie-v-dbt
  title: Документирование в dbt
  image: image45.png
  bullets:
  - 'Документация генерируется автоматически: dbt docs generate'
  - Описания моделей и колонок берутся из schema.yml
  - Строится интерактивный сайт с поиском и DAG/lineage
  - Docs всегда синхронны с кодом — обновляются при каждом run
  - Полезно аналитикам и стейкхолдерам как каталог данных
  notes: 'Документация в dbt — почти **бесплатный бонус**. Вы пишете описания в **schema.yml** рядом с моделями, а !!dbt docs generate!! собирает интерактивный сайт с поиском и графом **lineage**.


    Главное — он __всегда актуален__, потому что генерируется из того же кода. Для аналитиков это фактически **каталог данных**. ~~Полезно и стейкхолдерам.~~'
- kind: content
  id: 028-testirovanie
  title: Тестирование
  image: image48.png
  materials:
  - label: dbt_utils
    url: https://hub.getdbt.com/dbt-labs/dbt_utils/latest/
  - label: dbt_expectations
    url: https://github.com/calogica/dbt-expectations
  - label: unit testing
    url: https://github.com/EqualExperts/dbt-unit-testing
  bullets:
  - 'Generic-тесты: not_null, unique, accepted_values, relationships'
  - Задаются декларативно в schema.yml на колонках
  - Singular-тесты — произвольный SQL, возвращающий «плохие» строки
  - Unit-тесты — проверяют логику модели на фиктивных входах
  - 'Пакеты расширяют набор: dbt_utils, dbt_expectations'
  notes: 'Тесты в dbt бывают двух видов. **Generic** — готовые проверки (**not_null**, **unique**, **accepted_values**, **relationships**), которые вы __декларативно вешаете на колонку__ в schema.yml.


    **Singular** — произвольный SQL, который должен вернуть !!ноль «плохих» строк!!. Плюс относительно новые **unit-тесты** для логики моделей на фиктивных входах. А пакеты (**dbt_utils**, **dbt_expectations**) сильно расширяют арсенал. ~~С них удобно начинать.~~'
- kind: content
  id: 029-generic-testy-kontrakt-v
  title: 'Generic-тесты: контракт в schema.yml'
  code_caption: models/schema.yml
  code: |
    # dbt запустит оба теста для каждой сборки модели
    version: 2
    models:
      - name: stg_orders
        description: Очищенные заказы из сырого слоя
        columns:
          - name: order_id
            tests: [not_null, unique]
  bullets:
  - Generic-тест — готовое правило качества, объявленное в YAML
  - not_null защищает обязательный ключ от пропусков
  - unique проверяет, что ключ не размножился после join/загрузки
  - Для доменов есть accepted_values и relationships
  - Тесты запускаются с dbt build и попадают в результаты CI
  notes: 'Generic-тесты — самый дешёвый способ сделать ожидание от данных !!явным контрактом!!. Вместо отдельного SQL для каждой колонки мы описываем правило рядом с моделью: order_id обязателен и уникален.


    Это ловит не только плохой источник. **unique** часто показывает ошибочный join, когда одна строка заказа неожиданно размножилась; **relationships** ловит ссылку на несуществующего клиента; accepted_values защищает статус от опечатки. __Название теста сообщает, что именно сломалось__, а не просто «витрина красная».


    Тест — часть модели и той же ревьюируемой поставки. ~~Не нужно ждать ночного мониторинга: dbt build и CI остановят изменение до того, как оно попадёт в production.~~'
- kind: content
  id: 030-unit-test-logika-modeli-na
  title: 'Unit-тест: логика модели на фикстурах'
  code_caption: models/schema.yml
  code: |
    # given — минимальный вход для проверки правила агрегации
    unit_tests:
      - name: test_sum_orders
        model: agg_orders
        given:
          - input: ref('stg_orders')
            rows:
              - {customer_id: 1, amount: 100}
              - {customer_id: 1, amount: 200}
        expect:
          rows:
            - {customer_id: 1, total_amount: 300}
  bullets:
  - Unit-тест изолирует модель от настоящей БД и больших таблиц
  - given подменяет вход ref()/source() маленькими строками
  - expect фиксирует ровно тот результат, который нужен бизнесу
  - Хорош для CASE, join, дедупликации и сложных агрегатов
  - 'Запуск быстрый: ошибка видна до полного dbt build'
  notes: 'Unit-тест проверяет не «свежесть» и не общий объём данных, а __логику конкретной модели__. Мы подаём две искусственные строки заказов и заранее записываем ожидаемую агрегацию. Если разработчик поменяет GROUP BY, условие CASE или правило скидки, тест покажет расхождение на маленьком понятном примере.


    Самая полезная привычка — добавлять фикстуру на каждый рискованный крайний случай: null, дубль, отменённый заказ, граница даты. Тогда код становится !!проверяемой спецификацией!!, а не только преобразованием данных.


    Unit-тесты не заменяют generic-тесты: первые отвечают «правильно ли мы считаем?», вторые — «качественны ли реальные данные?». ~~Вместе они дают быстрый сигнал до дорогого прогона на warehouse.~~'
- kind: content
  id: 031-pakety-dbt-podklyuchenie
  title: 'Пакеты dbt: подключение'
  image: image46.jpg
  materials:
  - label: dbt Hub
    url: https://hub.getdbt.com/
  - label: шаблон пакета
    url: https://github.com/dbt-labs/dbt-package-template
  bullets:
  - Пакет = отдельный dbt-проект с макросами/моделями/тестами
  - 'Подключение: packages.yml + dbt deps'
  - 'Каталог: hub.getdbt.com; также git и локальные пути'
  - Свой пакет — чтобы переиспользовать код между проектами
  - Экономят время и стандартизируют практики
  notes: '**Пакет** — это просто другой dbt-проект, который вы подключаете. Прописываете его в **packages.yml**, выполняете !!dbt deps!! — и получаете чужие **макросы**, **тесты** и **модели**.


    Основной каталог — **hub.getdbt.com** (вот он на экране); можно из **git** и локальных путей. Свой пакет — чтобы __переиспользовать код между проектами команды__. ~~Экономят время и стандартизируют практики.~~'
- kind: table
  id: 032-klyuchevye-pakety
  title: Ключевые пакеты
  materials:
  - label: dbt-utils
    url: https://github.com/dbt-labs/dbt-utils
  - label: project-evaluator
    url: https://github.com/dbt-labs/dbt-project-evaluator
  - label: audit-helper
    url: https://github.com/dbt-labs/dbt-audit-helper
  table:
    headers:
    - Пакет
    - Назначение
    rows:
    - - dbt_utils
      - базовые макросы и generic-тесты
    - - dbt_expectations
      - data-quality тесты (Great Expectations)
    - - dbt-date
      - унифицированная работа с датами
    - - audit_helper
      - сравнение моделей при рефакторинге
    - - elementary
      - мониторинг качества и аномалий
    - - project_evaluator
      - аудит структуры проекта
    - - dbtVault / AutomateDV
      - автоматизация Data Vault
    col_ratios:
    - 3
    - 7
  notes: 'Несколько пакетов, которые стоит знать. !!dbt_utils — практически стандарт!!: базовые макросы и generic-тесты. **dbt_expectations** добавляет проверки качества данных.


    **audit_helper** незаменим при __рефакторинге__ (сравнивает старую и новую модель). **elementary** следит за аномалиями, **project_evaluator** проверяет соответствие best-practices, **dbtVault/AutomateDV** — Data Vault. ~~С них удобно начинать.~~'
- kind: content
  id: 033-dbt-utils-v-dele
  title: dbt_utils в деле
  code_caption: models/orders_enriched.sql
  code: |
    -- один стабильный ключ вместо ручной конкатенации
    {{ config(materialized='incremental',
              unique_key='order_key') }}

    select
      {{ dbt_utils.generate_surrogate_key(
           ['order_id', 'customer_id']) }} as order_key,
      -- взять все колонки кроме технической
      {{ dbt_utils.star(from=ref('stg_orders'),
           except=['updated_at']) }},
      -- безопасно сложить nullable-суммы
      {{ dbt_utils.safe_add('amount', 'tax') }}
        as total_amount
    from {{ ref('stg_orders') }}
    {% if is_incremental() %}
      where order_date > (select max(order_date)
                          from {{ this }})
    {% endif %}
  bullets:
  - dbt_utils — самый популярный пакет от dbt Labs
  - Универсальные Jinja-макросы поверх dbt-core
  - surrogate_key, star, safe_add, datediff, pivot…
  - Переносимо между ClickHouse, Postgres, Snowflake
  - Меньше boilerplate, больше переиспользования
  materials:
  - label: dbt-labs/dbt-utils
    url: https://github.com/dbt-labs/dbt-utils
  notes: '**dbt_utils** — !!самый популярный пакет!! экосистемы от dbt Labs. Он даёт __универсальные Jinja-макросы__: generate_surrogate_key для стабильного хеш-ключа, star для выбора всех колонок с исключениями, safe_add для корректной работы с NULL, а также datediff, pivot и десятки других.


    На слайде видно три типовые причины применять пакет. Хеш-ключ не зависит от ручной склейки строк, star помогает не дублировать длинный список полей, а safe_add фиксирует семантику NULL. Это не «магия», поэтому скомпилированный SQL всё ещё надо читать в ревью.


    Главная выгода — **переносимость**: один и тот же проект может компилироваться под __ClickHouse, Postgres и Snowflake__. ~~Пакет уменьшает boilerplate, но команда должна версионировать его и понимать generated SQL при обновлении.~~'
- kind: section
  id: 034-zapusk-v-prodakshene
  title: Запуск в продакшене
  notes: 'Теперь — как всё это запускать не с ноутбука, а __надёжно в продакшене__.


    **Оркестрация**, расписания, изоляция окружений и **CI/CD**.'
- kind: content
  id: 035-kak-zapuskat-dbt-v-prode
  title: Как запускать dbt в проде
  bullets:
  - 'Цель: надёжно и повторяемо выполнять build/run/test'
  - По расписанию или по событию, с логами и алертами
  - Ретраи и идемпотентность запусков
  - 'Изоляция окружений: dev / staging / prod (разные targets)'
  - Окно запуска и SLA на обновление данных
  - Отдельные алерты на падение модели, теста и оркестратора
  - Версионирование и деплой проекта через CI
  notes: 'В продакшене нужна !!надёжность и повторяемость!!: запуск **build/run/test** по расписанию или событию, **логи**, **алерты**, __ретраи и идемпотентность__.


    Обязательно разделяем окружения — **dev / staging / prod** — через разные **targets** в профиле. На уровне процесса важно заранее определить __окно запуска__, какие **алерты** считаются критичными и кто владеет реакцией на сбой.


    И сам проект __деплоится через CI__, а не копируется руками: так конфиг, зависимости и SQL всегда проходят один и тот же путь от ревью до prod. ~~Дальше — чем именно оркеструем.~~'
- kind: content
  id: 036-airflow-dbt-orkestraciya
  title: 'Airflow + dbt: оркестрация через Cosmos'
  code_caption: Концептуальная композиция DAG
  code: |
    # Cosmos читает dbt-проект и создаёт task group
    transform = DbtTaskGroup(
        group_id="dbt_transform",
        project_config=ProjectConfig(dbt_project_path=DBT_DIR),
        profile_config=PROFILE,
    )
    ingest_raw >> transform >> refresh_bi
  bullets:
  - Airflow управляет расписанием, ретраями, сенсорами и внешними системами
  - Cosmos превращает dbt-проект в DbtDag или DbtTaskGroup
  - Можно видеть модели, seeds и snapshots как отдельные задачи
  - Airflow connection маппится в dbt profile — один источник секретов
  - Подходит для workflow ingestion → transform → BI/ML
  materials:
  - label: Cosmos core concepts
    url: https://astronomer.github.io/astronomer-cosmos/getting_started/core-concepts.html
  - label: How Cosmos runs dbt
    url: https://astronomer.github.io/astronomer-cosmos/guides/run_dbt/index.html
  notes: '**Airflow** удобен, когда dbt — не весь процесс, а один шаг большого workflow: сначала забрать файл или дождаться внешнего API, затем построить модели, обновить BI и отправить уведомление. Оркестратор владеет !!расписанием, ретраями, зависимостями и наблюдаемостью между системами!!.


    Библиотека **Cosmos** читает dbt-проект и собирает из него DbtDag либо DbtTaskGroup. В обычном режиме модель, seed или snapshot могут стать отдельной Airflow-задачей: это даёт __точечные ретраи и видимость__, но добавляет overhead, если проект очень большой.


    Важный практический шов — подключение к DWH. Cosmos умеет использовать существующий Airflow connection через profile mapping, поэтому секрет не надо хранить одновременно в двух форматах. ~~Если задача — только SQL-transform без внешних зависимостей, полный Airflow может быть тяжелее, чем сам dbt Cloud или простой scheduler.~~'
- kind: content
  id: 037-dagster-dbt-modeli-kak-data
  title: 'Dagster + dbt: модели как data assets'
  code_caption: defs/dbt_ingest/defs.yaml
  code: |
    # dbt manifest становится набором Dagster assets
    type: dagster_dbt.DbtProjectComponent
    attributes:
      project: '{{ context.project_root }}/dbt'
      select: 'tag:daily'

    # asset selection запускает только нужную часть графа
    dg launch --assets 'key:"orders"+'
  bullets:
  - dagster-dbt представляет каждую dbt-модель как asset с зависимостями
  - Можно выбрать, материализовать и наблюдать часть dbt-графа по asset key
  - Одно lineage объединяет ingestion, dbt, ML и BI, а не только задачи
  - Asset checks связывают результат теста с конкретной моделью
  - Партиции и backfill дают управляемый прогон за исторические окна
  materials:
  - label: Dagster & dbt
    url: https://docs.dagster.io/integrations/libraries/dbt
  - label: dagster-dbt reference
    url: https://docs.dagster.io/integrations/libraries/dbt/reference
  notes: 'У Dagster другая исходная модель: в центре не задача, а !!data asset!! — таблица, файл, модель или feature. Библиотека **dagster-dbt** читает dbt manifest и создаёт assets на уровне отдельных моделей, seeds и snapshots.


    Благодаря этому можно связать dbt-модель не только с соседней SQL-моделью, но и с asset загрузки из Fivetran, обучением ML-модели или публикацией витрины. В UI и API появляется __единый lineage__, а выбор asset запускает только необходимую часть графа.


    Партиции и backfill важны для исторических данных: задаём окно дат, получаем наблюдаемый прогон и не пишем собственный цикл по периодам. ~~Это сильный выбор для asset-oriented платформы; для простого cron-запуска одного dbt-проекта такая модель может быть избыточной.~~'
- kind: content
  id: 038-ci-cd-dlya-dbt
  title: CI/CD для dbt
  materials:
  - label: dbt-checkpoint
    url: https://github.com/dbt-checkpoint/dbt-checkpoint
  - label: SQLFluff
    url: https://github.com/sqlfluff/sqlfluff
  bullets:
  - pre-commit — ловит ошибки до пуша (форматирование, стиль)
  - GitLab CI / GitHub Actions — автопроверка перед merge
  - SQLFluff — линтер и автоформаттер SQL (учитывает Jinja)
  - Slim CI — гоняем только изменённые узлы DAG (state:modified)
  - Быстрее и дешевле, чем прогон всего проекта
  notes: 'CI/CD для dbt устроен как для обычного **кода**. **pre-commit** ловит ошибки ещё до пуша, **CI** (GitLab / GitHub Actions) проверяет изменения перед merge, **SQLFluff** следит за __стилем SQL__ (с учётом Jinja).


    Отдельно — !!Slim CI: прогоняем только изменённые модели и их зависимых!! (**state:modified**), а не весь проект — это сильно экономит **время и деньги**.'
- kind: content
  id: 039-pre-commit-bystraya-zaschita
  title: 'Pre-commit: быстрая защита до push'
  code_caption: .pre-commit-config.yaml
  code: |
    # запускается локально перед созданием коммита
    repos:
      - repo: sqlfluff/sqlfluff
        hooks: [sqlfluff-lint, sqlfluff-fix]
      - repo: dbt-checkpoint/dbt-checkpoint
        hooks: [dbt-compile, dbt-test]
  bullets:
  - Pre-commit даёт разработчику быстрый feedback без ожидания CI
  - SQLFluff проверяет стиль SQL и понимает Jinja-шаблоны
  - dbt compile ловит сломанную ссылку/ref и синтаксис заранее
  - dbt-checkpoint добавляет правила структуры проекта и метаданных
  - 'Хук не заменяет CI: его можно пропустить локально'
  materials:
  - label: pre-commit
    url: https://pre-commit.com/
  - label: SQLFluff
    url: https://docs.sqlfluff.com/
  notes: 'Первый рубеж — **pre-commit**. Он запускается у автора изменения и даёт обратную связь за секунды: форматирование SQL, линт с учётом Jinja, компиляция и проектные проверки. Это уменьшает число бессмысленных CI-перезапусков и делает ревью чище.


    Но локальный хук — удобство, а не гарантия: его можно не установить или обойти. Поэтому !!обязательным источником истины остаётся CI!!. Конфиг хука должен быть версионирован в репозитории, чтобы у всех разработчиков были одинаковые правила.


    Полезное разделение: pre-commit отвечает за __быструю обратную связь__, CI — за независимую проверку в чистом окружении. ~~Не стоит помещать в хук долгий полный dbt build: тогда команда начнёт его отключать.~~'
- kind: content
  id: 040-gitlab-ci-obyazatelnyj-barer
  title: 'GitLab CI: обязательный барьер merge'
  code_caption: .gitlab-ci.yml
  code: |
    # чистое окружение: lint → tests → build
    stages: [lint, test, build]
    lint:
      script: [sqlfluff lint models/, dbt compile]
    test:
      script: [dbt deps, dbt test]
    build:
      # финальный интеграционный прогон моделей и тестов
      script: [dbt build]
  bullets:
  - CI повторяет проверки независимо от рабочей машины автора
  - stages разделяют быстрый lint и более дорогую интеграционную сборку
  - dbt deps фиксирует набор пакетов перед запуском проекта
  - dbt build запускает модели, тесты, seeds и snapshots по выбранному графу
  - Slim CI может ограничить прогон state:modified и downstream
  materials:
  - label: GitLab CI dbt guide
    url: https://docs.getdbt.com/guides/gitlab
  notes: 'Второй рубеж — **GitLab CI** в чистом окружении. Он не доверяет локальным пакетам, переменным или артефактам разработчика: сначала получает зависимости через **dbt deps**, затем проверяет SQL и собирает выбранный граф.


    Разделение на lint, test и build делает ошибку понятной и экономит время: синтаксическая проблема падает раньше тяжёлого warehouse-прогона. __dbt build__ — удобная интеграционная команда, потому что объединяет запуск моделей и их тестов в корректном порядке DAG.


    На больших проектах полный прогон каждый раз слишком дорог. Тогда **Slim CI** выбирает state:modified и зависимые узлы, но production-процесс всё равно должен регулярно проверять полный граф. ~~Цель CI — не «красивый pipeline», а не дать непроверенной логике попасть в main.~~'
- kind: section
  id: 041-dopolnitelnye-vozmozhnosti-i
  title: Дополнительные возможности и тренды
  notes: 'Финальный блок — что ещё умеет dbt за пределами базового SQL, и __куда движется экосистема__.


    **Python-модели**, **Semantic Layer**, интеграция с **ИИ**, альтернативы dbt и платформенные декларативные подходы к трансформациям.'
- kind: content
  id: 042-python-modeli-mikrobatching
  title: Python-модели, микробатчинг, каталоги
  image: image60.png
  materials:
  - label: Python models
    url: https://docs.getdbt.com/docs/build/python-models
  - label: dbt → DataHub
    url: https://docs.datahub.com/docs/generated/ingestion/sources/dbt
  - label: OpenLineage
    url: https://openlineage.io/docs/integrations/dbt/
  bullets:
  - Python-модели — когда SQL неудобен (ML-фичи, сложная логика)
  - Микробатчинг — инкрементальная обработка окнами времени
  - 'Артефакты: manifest.json, catalog.json, run_results.json'
  - Интеграция с Data Catalogs (DataHub, OpenMetadata и др.)
  - Единый проект как источник метаданных и lineage
  notes: 'Несколько продвинутых возможностей. Там, где **SQL** неудобен (например, __ML-фичи__), можно писать **Python-модели**: это особенно полезно для фич-инжиниринга, сложной валидации и сценариев, где библиотека Python уже готова.

    **Микробатчинг** помогает с большими инкрементальными нагрузками: данные обрабатываются небольшими окнами времени, а не одним гигантским прогоном. Это снижает стоимость backfill и делает поведение более предсказуемым для длинных историй.

    А артефакты, которые dbt генерирует — !!manifest.json, catalog.json, run_results.json!! — становятся источником **метаданных** и **lineage** для внешних каталогов (**DataHub**, **OpenMetadata**, **OpenLineage**). ~~В хорошем стеке dbt не просто строит таблицы, а поставляет описание самого проекта наружу.~~'
- kind: content
  id: 043-semantic-layer-metricflow
  title: Semantic Layer / MetricFlow
  image: image62.png
  materials:
  - label: About MetricFlow
    url: https://docs.getdbt.com/docs/build/about-metricflow
  - label: MetricFlow commands
    url: https://docs.getdbt.com/docs/build/metricflow-commands
  bullets:
  - Единое определение метрик — один раз, в коде
  - MetricFlow генерирует корректный SQL по запросу метрики
  - Убирает расхождения метрик между дашбордами
  - Метрики доступны из BI, ноутбуков и через API
  - Консистентность и переиспользование бизнес-логики
  notes: 'Больная тема любой аналитики — когда __«выручка» в двух дашбордах считается по-разному__. !!Semantic Layer решает это: метрика определяется один раз в коде!!, а не переписывается в каждом BI-инструменте.


    Движок **MetricFlow** сам генерирует корректный **SQL** под каждый запрос. Метрики доступны из **BI**, ноутбуков и по **API** — и везде считаются **одинаково**. Это особенно важно, когда одна и та же метрика используется в отчётах, алертах и data products.


    Практический смысл для команды — __одна формула, один владелец, один контур тестирования__. ~~Консистентность и переиспользование бизнес-логики.~~'
- kind: content
  id: 044-dbt-i-ai
  title: dbt и AI
  image: image67.png
  materials:
  - label: dbt Copilot
    url: https://docs.getdbt.com/docs/cloud/dbt-copilot
  - label: dbt MCP
    url: https://github.com/dbt-labs/dbt-mcp
  - label: context7
    url: https://context7.com/
  bullets:
  - dbt Copilot — генерация SQL, тестов, документации, метрик
  - dbt MCP — стандартный доступ LLM/агентов к моделям и метрикам
  - context7 / MCP — подключение IDE и AI к контексту проекта
  - AI ускоряет рутину, но код остаётся ревьюируемым
  notes: 'dbt активно интегрируется с **ИИ**. **dbt Copilot** генерирует **SQL**, **тесты** и **документацию** — это ускоряет рутинную часть работы, но не отменяет ревью и понимание модели человеком.

    !!dbt MCP даёт языковым моделям и агентам стандартный, управляемый доступ!! к вашим моделям и метрикам; **context7** и MCP подключают IDE/AI к __контексту проекта__. Это полезно, когда ассистенту нужно работать не «в вакууме», а с актуальными моделями, тестами и описаниями.

    Важно: ИИ **ускоряет рутину**, но результат — это по-прежнему **код**, который проходит __ревью и тесты__. ~~Самая сильная схема — не автогенерация вместо инженера, а ассистент, который снимает повторяющуюся работу и уменьшает трение.~~'
- kind: table
  id: 045-sqlmesh-i-dbt-upravlenie
  title: 'SQLMesh и dbt: управление изменениями'
  materials:
  - label: SQLMesh plans
    url: https://sqlmesh.readthedocs.io/en/stable/concepts/plans/
  - label: SQLMesh environments
    url: https://sqlmesh.readthedocs.io/en/stable/concepts/environments/
  table:
    headers:
    - Аспект
    - dbt
    - SQLMesh
    rows:
    - - Основной workflow
      - compile / run / build + CI
      - 'plan: diff и требуемые вычисления до применения'
    - - Изоляция разработки
      - targets, схемы и правила окружений
      - 'Virtual Data Environments: snapshots/ссылки на версии моделей'
    - - Влияние изменения
      - selection, state и артефакты dbt
      - plan показывает прямые/косвенные изменения и backfill
    - - Продвижение
      - оркестратор или CI выполняет выбранный граф
      - apply/virtual update; вычисления переиспользуются, где безопасно
    col_ratios:
    - 2
    - 4
    - 4
  notes: '**SQLMesh** — не просто «dbt с другим синтаксисом», а другой центр тяжести: сначала создаётся !!plan изменений!!, который сравнивает локальный проект с окружением, показывает затронутые модели, backfill и предлагает применить результат.


    Главная особенность — **Virtual Data Environments**. Модель получает версию/snapshot, окружение ссылается на набор версий, а уже посчитанные физические данные можно переиспользовать там, где это безопасно. Это даёт изолированный preview без обязательного полного пересчёта всего warehouse.


    У dbt зрелая экосистема, привычные packages и простой workflow **build + CI**; у SQLMesh сильнее акцент на plan/apply, impact analysis и виртуальном продвижении. ~~Выбор зависит от команды и warehouse: это сравнение подходов к изменению данных, а не универсальный рейтинг инструментов.~~'
- kind: content
  id: 046-deklarativnye-transformacii
  title: 'Декларативные трансформации: ещё четыре подхода'
  materials:
  - label: Bruin overview
    url: https://getbruin.com/docs/bruin/overview.html
  - label: Spark Declarative Pipelines
    url: https://docs.databricks.com/aws/en/ldp/
  - label: Lakeflow pipelines
    url: https://docs.databricks.com/aws/en/ldp/concepts/pipelines
  - label: Snowflake Dynamic Tables guide
    url: https://docs.snowflake.com/en/user-guide/dynamic-tables/decision-guide
  bullets:
  - Bruin — один CLI для ingestion, SQL/Python assets, quality checks и lineage в repo
  - Spark Declarative Pipelines (SDP) — SQL/Python для batch и streaming-графов
  - 'Databricks Lakeflow — managed-пайплайны: flows, streaming tables, materialized views'
  - Snowflake Dynamic Tables — SELECT + TARGET_LAG; платформа сама ведёт refresh и порядок DAG
  - 'Выбор: portable dbt/SQLMesh/Bruin или нативные возможности конкретной платформы'
  notes: 'Тренд шире одного dbt: команды всё чаще описывают !!желаемый набор данных и зависимости!!, а не последовательность низкоуровневых задач. **Bruin** объединяет ingestion, SQL/Python-преобразования, quality checks и lineage в репозитории — полезно, когда хочется меньше разрозненных инструментов.


    В Spark-экосистеме **Spark Declarative Pipelines** описывает batch и streaming-пайплайны в SQL или Python. Databricks **Lakeflow** — управляемая реализация этого подхода: платформа анализирует зависимости и оркестрирует flows, streaming tables и materialized views. Это естественно для Delta/streaming-нагрузок, но сильнее привязывает решение к платформе.


    В Snowflake **Dynamic Tables** позволяют определить результат SQL-запросом и TARGET_LAG; Snowflake сам поддерживает порядок refresh и, где возможно, incremental processing. Для процедурной логики, точного cron или сложного MERGE остаются streams/tasks. __dbt выигрывает переносимостью и экосистемой__, нативные средства — меньшим количеством операционного кода внутри своей платформы. ~~Современный стек часто сочетает эти подходы, а не выбирает ровно один.~~'
- kind: content
  id: 047-poleznye-ssylki
  title: Полезные ссылки
