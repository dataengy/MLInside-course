    - - Стоимость
      - Бесплатно
      - Подписка
    col_ratios:
    - 2
    - 4
    - 4
  notes: 'Главное различие: **Core** — бесплатный **CLI**, который вы разворачиваете и __оркеструете сами__; **Cloud** — платная управляемая среда со всем готовым: **веб-IDE**, **планировщик**, **CI**, хостинг документации, роли и доступы.


    Выбор: !!контроль и гибкость (Core) vs скорость старта без инфраструктуры (Cloud)!!. ~~Для обучения и полного контроля берём Core.~~'
- kind: table
  id: 058-gde-pisat-dbt
  title: 'Где писать dbt: CLI, VS Code, браузерные IDE'
  materials:
  - label: dbt VS Code extension
    url: https://docs.getdbt.com/docs/about-dbt-extension
  - label: Power User for dbt
    url: https://github.com/AltimateAI/vscode-dbt-power-user
  - label: SqlDBM + dbt
    url: https://sqldbm.com/sqldbm-plus-dbt/
  table:
    headers:
    - Среда
    - Что даёт
    - Нюанс
    rows:
    - - CLI и любой редактор
      - полный контроль, всё живёт в git
      - нет подсказок по моделям и колонкам
    - - VS Code + Power User
      - автодополнение, compiled SQL, preview, column lineage
      - сторонний пакет (Altimate), AI-функции по ключу
    - - VS Code / Cursor + расширение dbt Labs
      - Fusion, мгновенный парсинг, ошибки до запуска
      - работает с Fusion, не с dbt Core 1.x
    - - Браузерные IDE (dbt Studio, Paradime, Datacoves)
      - среда, планировщик, CI и доки в одном окне
      - 'платформа вендора: цена, лимиты, миграция'
    - - SqlDBM (моделирование схем)
      - ER-модель, из неё генерация dbt YAML прямо в репозиторий
      - слой над проектом, а не замена редактора
    col_ratios:
    - 3
    - 5
    - 4
  notes: |
    Инструмент не влияет на результат — на выходе всё равно **SQL в git**, — но сильно влияет на скорость правок. Голый CLI честен и переносим, однако !!редактор не знает про ваши модели!!: нет автодополнения `ref`, нет подсказки по колонкам, ошибка находится только при запуске.

    Локально это лечится двумя разными расширениями, и их легко перепутать. **Power User** от Altimate — сторонний open-source-пакет поверх обычного dbt Core: автодополнение, скомпилированный SQL, preview запроса, column lineage, AI-функции по ключу. **Официальное расширение dbt Labs** — другое: оно приносит __движок Fusion__ и работает именно с ним, а не с dbt Core 1.x. Это первое, что стоит проверить, если расширение «не видит» проект.

    Браузерные среды дают среду, планировщик, CI и документацию одним куском, но заточены по-разному. **dbt Studio** (бывшая dbt Cloud IDE) — родная среда dbt Labs: автодополнение моделей и колонок, встроенные sqlfmt и SQLFluff, просмотр DAG, git-диффы и разрешение конфликтов, ассистент прямо в редакторе. **Paradime** позиционируют как __«Cursor для данных»__: агент собирает модель и документацию, открывает PR и тянет контекст из Jira, Confluence и таблиц, а на каждый PR показывает !!column-level lineage до дашбордов BI!!. **Datacoves** — managed-платформа на Airflow с VS Code в браузере и упором на корпоративное управление доступом.


    Отдельная строка — **SqlDBM**: это не редактор, а визуальный моделер. Вы рисуете ER-модель, а он генерирует dbt-YAML (колонки, описания, типы, тесты и freshness) и умеет пушить его __прямо в репозиторий проекта__. Полезно там, где модель данных согласуют с архитекторами до написания SQL. ~~Общая плата за платформенные варианты одна — привязка к вендору: цена за место, лимиты и вопрос «как отсюда уехать», который стоит задать до внедрения, а не после.~~
- kind: content
  id: 059-fusion-i-dbt-core-v2
  title: 'Fusion и dbt Core v2.0: движок переписан на Rust'
  materials:
  - label: About Fusion
    url: https://docs.getdbt.com/docs/fusion/about-fusion
  - label: dbt Core v2 is here
    url: https://docs.getdbt.com/blog/dbt-core-v2-is-here
  bullets:
  - 'Fusion — движок на Rust: он разбирает SQL, а не только подставляет Jinja'
  - Мгновенный парсинг, ошибки до запуска, IntelliSense в VS Code и Cursor
  - dbt Core v2.0 собран на том же коде и открыт под Apache 2.0 (alpha, июнь 2026)
  - 'Артефакты в Parquet вместо JSON: метаданные читаются запросом, а не разбором файла'
  - Ветка 1.latest живёт дальше — обновляться прямо сейчас никто не обязан
  notes: |
    Главная новость экосистемы: **dbt переписали на Rust**. Движок Fusion — это наследие покупки SDF, и его принципиальное отличие в том, что он !!понимает SQL, а не только шаблонизирует текст!!. Отсюда мгновенный парсинг больших проектов, ошибки, которые видно __до запуска в хранилище__, и осмысленный IntelliSense в редакторе.

    В июне 2026 dbt Labs выпустили **dbt Core v2.0** — alpha, собранная на том же коде и открытая под **Apache 2.0**; в открытый доступ уехало то, что раньше жило в репозитории dbt-fusion. Отдельно стоит запомнить смену формата артефактов: вместо гигантского `manifest.json` — **Parquet**, который читается запросом. Именно поэтому обновлённые доки и агенты работают с метаданными быстро.

    Практический вывод для команды: __паники не требуется__. Ветка `1.latest` поддерживается, апгрейд не обязателен, а v2 пока alpha — GA обещают позже. ~~Смотреть стоит на две вещи: поддерживается ли ваш адаптер в новом слое (ADBC/Arrow) и переживут ли ваши макросы более строгую спецификацию языка.~~
- kind: section
  id: 009-dbt-core-arhitektura-i-proekt
  title: 'dbt Core: архитектура и проект'
  notes: 'Переходим к ядру.


    Разберём, как устроен **dbt Core** изнутри: __компиляция__, __DAG__, структура проекта, **материализации**, **Jinja** и **команды**. !!Это самый практический блок.!!'
- kind: content
  id: 010-dbt-core-chto-eto-i-arhitektura
  title: 'dbt Core: что это и архитектура'
  image: image33.png
  bullets:
  - 'CLI-приложение: компилирует SQL-модели с Jinja'
  - Автоматически управляет зависимостями и строит DAG
  - Выполняет модели в нужном порядке в целевой БД
  - 'Code-based ELT: модели хранятся как код в git'
  - Артефакты компиляции — в каталоге target/
  notes: '**dbt Core** — приложение командной строки. Вы пишете **SQL**-модели с вставками **Jinja**, а dbt __компилирует их в чистый SQL__, строит **DAG** зависимостей и !!выполняет модели в правильном порядке!! в вашей БД.


    Это **code-based ELT**: модели хранятся как код в **git**, а артефакты компиляции складываются в каталог **target/**. ~~На экране — типичный вывод dbt run: модели выполняются одна за другой.~~'
- kind: content
  id: 011-dbt-kak-kod-struktura-proekta
  title: 'dbt как код: структура проекта'
  image: image30.png
  materials:
  - label: dbt Projects
    url: https://docs.getdbt.com/docs/build/projects
  bullets:
  - models/ — SQL-модели (.sql) + метаданные (schema.yml)
  - dbt_project.yml — главный конфиг проекта
  - profiles.yml — подключение к БД (обычно ~/.dbt/)
  - seeds/, snapshots/, macros/, tests/ — прочие сущности
  - Всё версионируется в git, ревьюится через MR/PR
  notes: 'Проект dbt — это __структурированная папка в git__. В **models/** лежат SQL-файлы и рядом **schema.yml** с описаниями и тестами; есть главный конфиг **dbt_project.yml** и отдельный **profiles.yml** для подключения к БД.


    Поскольку всё это **код**, работают привычные практики: !!ветки, ревью через MR/PR, история изменений!!. ~~На скриншоте — проект dbt в IDE.~~'
- kind: content
  id: 052-sloi-dbt-proekta
  title: 'Слои dbt-проекта: sources → staging → marts'
  materials:
  - label: How we structure our dbt projects
    url: https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview
  bullets:
  - 'Структурирование dbt-проекта: источники (sources) → staging → витрины (marts)'
  - sources — контракт на сырые таблицы, объявленный в YAML
  - 'staging — промежуточные модели: типизация и чистка, 1:1 к источнику'
  - marts — финальные витрины признаков и метрик для BI и ML
  - 'Поток source → staging → (intermediate) → marts — так устроено и ДЗ на Olist'
  notes: 'Слои — это __конвенция структурирования dbt-проекта__, а не требование инструмента. **Sources** объявляют сырые таблицы источников и дают на них контракт (freshness, тесты). **Staging** — промежуточные модели, которые __типизируют и чистят__ данные строго 1:1 к источнику, без бизнес-логики.


    **Marts** — !!финальные витрины признаков!! и метрик: то, что читают BI-инструменты и ML-пайплайны. Между staging и marts при росте проекта появляется слой **intermediate**. Ровно по этой схеме устроено наше ~~домашнее задание на датасете Olist~~ — см. финальные слайды.'
- kind: content
  id: 012-sql-kompilyaciya-obertka-koda
  title: SQL + компиляция (обёртка кода)
  image: image40.png
  bullets:
  - Пишем select-логику модели в models/model.sql
  - ref() и source() задают зависимости вместо хардкода имён
  - dbt компилирует Jinja → чистый SQL под конкретную БД
  - 'И оборачивает в DDL: create view / create table as select'
  - Скомпилированный код — в target/compiled и target/run
  notes: 'Вы пишете только **select** — саму логику. Ссылки на другие модели даёте через !!ref()!! (и **source()** на внешние таблицы), а не хардкодите имена — __именно это позволяет dbt построить граф__.


    При запуске dbt раскрывает **Jinja** в чистый **SQL** под конкретную БД и оборачивает его в **create view** / **create table as select**. ~~Готовый SQL всегда можно посмотреть в папке target/compiled и target/run.~~'
- kind: content
  id: 013-model-skompilirovannyj-sql
  title: Модель → скомпилированный SQL
  code_caption: 'models/stg_orders.sql → target/run/…'
  code: |
    -- model: декларативно задаём физическую форму результата
    {{ config(materialized='table') }}
    -- бизнес-логика остаётся обычным SELECT
    select order_id, customer_id, amount, order_date
    from {{ source('shop', 'orders') }}
    where amount > 0

    -- target/run: dbt подставил relation и добавил DDL
    create table analytics.stg_orders as
    select order_id, customer_id, amount, order_date
    from raw.orders
    where amount > 0;
  bullets:
  - 'Пишем модель как SELECT: без CREATE TABLE и хардкода схемы'
  - config(materialized) выбирает view, table или incremental
  - source() даёт зависимость от внешнего источника и его lineage
  - 'compile превращает Jinja в SQL конкретного адаптера'
  - target/run — лучший способ отладить итоговый запрос
  materials:
  - label: dbt compile
    url: https://docs.getdbt.com/reference/commands/compile
  notes: 'Посмотрите на правую колонку как на два уровня одного и того же артефакта. Сверху — !!то, что пишет разработчик!!: чистый **SELECT** и одна декларация materialized. Снизу — __что реально отправляется в DWH__: dbt уже подставил физическую схему и добавил DDL-обёртку **CREATE TABLE AS**.


    Это важное разделение ответственности. Аналитик формулирует __бизнес-логику__, а dbt вместе с адаптером решает, как именно создать объект в конкретной БД. **source()** и **ref()** не только сокращают SQL: они дают dbt граф зависимостей, поэтому переименование схемы или переход между окружениями не требует править каждый запрос.


    Когда модель ведёт себя неожиданно, не гадаем: запускаем **dbt compile** и открываем target/compiled или target/run. ~~Там можно увидеть итоговый SQL, проверяемый warehouse, и отличить ошибку Jinja/конфига от ошибки самой логики SELECT.~~'
- kind: content
  id: 014-dag-zavisimostej
  title: DAG зависимостей
  image: image37.png
  bullets:
  - DAG — направленный ациклический граф моделей
  - Строится автоматически из ref() между моделями
  - Определяет порядок запуска и распараллеливание
  - 'Даёт lineage: откуда и куда идут данные'
  - Основа для инкрементальных и частичных запусков
  notes: 'Из вызовов **ref()** dbt автоматически строит !!DAG — направленный ациклический граф!! зависимостей. Он определяет __порядок выполнения__ и что можно запускать **параллельно**.


    Бонусом получаем **lineage** — наглядную схему, откуда и куда текут данные; на нём же строятся **инкрементальные** и **частичные** запуски. ~~На картинке — простой граф: staging питает промежуточные модели, а те — витрины.~~'
- kind: table
  id: 015-jinja-i-makrosy
  title: Jinja и макросы
  table:
    headers:
    - Конструкция
    - Пример
    - Назначение
    rows:
    - - '{{ ... }}'
      - '{{ ref(''stg_orders'') }}'
      - выражения и вызовы функций
    - - '{% ... %}'
      - '{% for c in cols %}'
      - управляющие конструкции (if/for/set)
    - - ref()
      - ref('model_b')
      - зависимости между моделями
    - - source()
      - source('raw','orders')
      - ссылка на внешние таблицы
    - - config()
      - '{{ config(materialized=''table'') }}'
      - настройки модели
    - - макросы
      - '{{ my_macro(col) }}'
      - переиспользуемые функции
    col_ratios:
    - 2
    - 4
    - 4
  notes: '**Jinja** — шаблонизатор, который делает SQL __динамическим__. Двойные фигурные скобки — выражения и вызовы функций, процентные — управляющие конструкции (**if/for/set**).


    Ключевые функции: !!ref, source, config!!. А **макросы** — ваши собственные переиспользуемые функции, как в обычном программировании. ~~Это позволяет писать параметризованный, DRY-SQL.~~'
- kind: content
  id: 016-makrosy-na-jinja-dry-dlya-sql
  title: Макросы на Jinja — DRY для SQL
  code_caption: macros/format_currency.sql
  code: |
    -- макрос возвращает SQL-фрагмент, а не значение в Python
    {% macro format_currency(col, decimals=2) -%}
      round({{ col }}, {{ decimals }})
        as {{ col }}_formatted
    {%- endmacro %}

    -- в модели вызов разворачивается при компиляции
    select
      {{ format_currency('total_revenue') }}
    from {{ ref('fct_revenue') }}
  bullets:
  - Макрос — переиспользуемая Jinja-функция
  - '{% macro %} … {% endmacro %}, параметры как в Python'
  - Значения по умолчанию (decimals=2)
  - Вызов {{ ... }} в любой модели проекта
  - DRY — одна логика форматирования на весь проект
  notes: 'Макрос — это !!переиспользуемая функция на Jinja!!, но важно не путать его с UDF в warehouse: он срабатывает __во время компиляции__ и возвращает кусок SQL. Поэтому параметры, значения по умолчанию и ветвления здесь похожи на Python, а результатом станет обычный SQL вашего адаптера.


    В примере col — имя колонки, decimals=2 — дефолт. Вызов **{{ format_currency(''total_revenue'') }}** развернётся в round(total_revenue, 2) as total_revenue_formatted. Это позволяет один раз договориться о формате и не размножать слегка разные выражения по десяткам моделей.


    Макрос оправдан, когда правило действительно __повторяется__ или отличается между СУБД. ~~Не стоит прятать в макрос единственный простой SELECT: такой SQL труднее читать и отлаживать.~~'
- kind: table
  id: 017-materializacii
  title: Материализации
  table:
    headers:
    - Тип
    - Что делает
    - Где хранится
    rows:
    - - view
      - CREATE VIEW при каждом run
      - вьюха в БД
    - - table
      - пересоздаёт таблицу целиком
      - таблица в БД
    - - incremental
      - дозагружает новые/изменённые строки
      - таблица в БД
    - - ephemeral
      - встраивается как CTE в другие модели
      - нет объекта в БД
    col_ratios:
    - 2
    - 5
    - 3
  notes: '**Материализация** — то, во что превращается модель в БД. **view** — представление, всегда свежее, но считается на лету. **table** — физическая таблица: быстрые чтения ценой __полного пересчёта__.


    !!incremental — дозагружает только новое, ключ к большим данным!!. **ephemeral** не создаёт объект, а встраивается в другие модели как **CTE**. ~~Задаётся через config(materialized=...) или dbt_project.yml.~~'
- kind: content
  id: 018-inkrementalnaya-model
  title: Инкрементальная модель
  code_caption: models/orders_incremental.sql
  code: |
    -- unique_key позволяет обновлять изменившийся заказ
    {{ config(
        materialized = 'incremental',
        unique_key   = 'order_id'
    ) }}

    select order_id, customer_id, order_date, total_amount
    from {{ ref('stg_orders') }}

    {% if is_incremental() %}
      -- при повторном запуске читаем только новую дельту
      where order_date > (
          -- this = уже созданная целевая таблица этой модели
          select max(order_date) from {{ this }}
      )
    {% endif %}
  bullets:
  - Первый запуск строит модель полностью; затем включается дельта
  - unique_key нужен адаптеру для корректного merge/обновления строк
  - is_incremental() отделяет стартовую логику от повторного запуска
  - this — ссылка на текущую целевую relation, без имени руками
  - Предикат дельты выбираем по правилам обновления источника
  - Оптимизация расчетов — обновление только новых данных прямо в ClickHouse
  materials:
  - label: Incremental models
    url: https://docs.getdbt.com/docs/build/incremental-models
  notes: 'Инкрементальная модель нужна, когда полный пересчёт уже дорог. На первом запуске dbt создаёт таблицу из всего SELECT, а на следующих выполняет !!только дельту!!. Условие **is_incremental()** делает это различие явным и оставляет один файл модели вместо двух отдельных пайплайнов.


    __unique_key__ — не косметика: это бизнес-идентификатор строки, по которому адаптер может корректно обновить изменившийся заказ. **{{ this }}** указывает на relation самой модели в текущем target, поэтому код не привязан к имени схемы и одинаково работает в dev и prod.


    Самая частая ошибка — фильтровать только по max(order_date), когда старые заказы могут исправляться задним числом. Тогда выбирают lookback-окно, timestamp обновления или стратегию merge. ~~Инкрементальность ускоряет расчёт, но не отменяет продумывание полноты и идемпотентности.~~'
- kind: content
  id: 019-suschnosti-dbt
  title: Сущности dbt
  image: image41.png
  bullets:
  - models — основная логика (SQL/Jinja), строит таблицы/вьюхи
  - sources — декларация внешних таблиц + freshness-проверки
  - seeds — небольшие CSV, загружаемые как таблицы
  - 'snapshots: историзация изменений (SCD2)'
  - tests, macros, exposures — качество, переиспользование, витрины
  notes: 'Кроме **models** в dbt есть и другие сущности. **sources** описывают внешние таблицы и умеют проверять __свежесть данных (freshness)__. **seeds** — маленькие справочники из CSV.


    **snapshots** историзируют изменения по типу !!SCD2!!. Плюс **tests**, **macros** и **exposures** — качество, переиспользование, витрины. ~~Всё это части одного проекта.~~'
- kind: content
  id: 020-sources-kontrakt-i-freshness
  title: 'Sources: контракт и freshness'
  code_caption: models/sources.yml
  code: |
    # raw.orders — внешний объект, который dbt не строит
    version: 2
    sources:
      - name: raw
        tables:
          - name: orders
            freshness:
              # предупредить через 2 ч., упасть через 6 ч.
              warn_after:  {count: 2, period: hour}
              error_after: {count: 6, period: hour}
  bullets:
  - Source — именованный контракт на внешнюю таблицу, а не копия SQL
  - source('raw', 'orders') создаёт lineage от слоя загрузки
  - Freshness проверяет, когда источник в последний раз обновлялся
  - warn — сигнал команде; error — фейл проверки/пайплайна
  - Пороги зависят от SLA данных, а не от удобства запуска dbt
  notes: 'Source описывает объект, который !!dbt не материализует сам!!: таблицу после ingestion, внешний каталог или витрину другой команды. Вместо raw.schema.orders по всему проекту появляется один контракт **source(''raw'', ''orders'')** с документацией, владельцем и проверками.


    Блок freshness отвечает на другой вопрос, чем тесты качества: __насколько свежи данные__. В этом примере через две часа будет предупреждение, а через шесть — ошибка. Правильные интервалы берутся из SLA с владельцем источника: для ежедневного отчёта шесть часов может быть критично, для недельной справочной таблицы — нет.


    Так dbt связывает ingestion и transform без смешивания их обязанностей. ~~Если источник опаздывает, лучше остановить зависимые витрины с понятным сигналом, чем тихо обновить отчёт старыми данными.~~'
- kind: content
  id: 021-snapshots-i-docs-istoriya
  title: 'Snapshots и docs: история + смысл поля'
  code_caption: snapshots/customers_scd.sql · models/_docs.sql
  code: |
    -- snapshot: новая версия строки при смене status
    {% snapshot customers_scd %}
      {{ config(strategy='check', unique_key='id',
                check_cols=['name', 'status']) }}
      select id, name, status, updated_at
      from {{ source('raw', 'customers') }}
    {% endsnapshot %}

    -- docs-блок переиспользуется в schema.yml и dbt docs
    {% docs stg_orders__amount %}
    Сумма заказа после скидок и налогов.
    {% enddocs %}
  bullets:
  - 'Snapshot реализует SCD2: сохраняет версии бизнес-сущности во времени'
  - unique_key определяет объект, а check_cols — что считать изменением
  - dbt добавляет интервалы валидности, чтобы запросить «состояние на дату»
  - Docs-блок хранит одно описание и подставляется в несколько мест
  - Документация становится частью ревьюируемого кода
  notes: 'Snapshot — это механизм !!историзации SCD2!! для случаев, когда источник хранит только актуальную строку. Здесь id определяет клиента, а изменение name или status создаёт новую версию. После запуска можно спросить: «какой статус был у клиента на конец прошлого месяца?» — и ответить без отдельной самописной таблицы истории.


    Важно согласовать список **check_cols**: слишком широкий даёт лишние версии от технических полей, слишком узкий пропускает бизнес-изменения. __Snapshots не заменяют CDC автоматически__; это удобный dbt-слой, когда семантика и объём данных подходят.


    Блок **{% docs %}** решает другую задачу — единый смысл атрибута. Его можно вставить в schema.yml и получить в **dbt docs generate**, поэтому описание меняется вместе с моделью в том же MR. ~~Это особенно ценно для метрик и финансовых полей, где «сумма» без правил расчёта мало что означает.~~'
- kind: content
  id: 022-konfigi-dbt-project-yml-i
  title: 'Конфиги: dbt_project.yml и profiles.yml'
  image: image42.png
  materials:
  - label: dbt_project.yml
    url: https://docs.getdbt.com/reference/dbt_project.yml
  - label: profiles.yml
    url: https://docs.getdbt.com/docs/core/connect-data-platform/profiles.yml
  - label: ClickHouse + dbt
    url: https://clickhouse.com/docs/en/integrations/dbt
  bullets:
  - dbt_project.yml — имя проекта, пути, материализации по умолчанию
  - - Настройки моделей по папкам, vars, hooks
    - 1
  - profiles.yml — подключение к БД (target, host, schema, креды)
  - - Обычно ~/.dbt/profiles.yml; секреты через env_var()
    - 1
  - 'Разделение: логика проекта отдельно от параметров окружения'
  notes: 'Два ключевых конфига. **dbt_project.yml** описывает сам проект: имя, пути, __материализации по умолчанию__, переменные (vars) и hooks.


    **profiles.yml** — подключение к БД, живёт отдельно (обычно в **~/.dbt/**), а секреты подтягиваются через !!env_var()!!. Такое __разделение логики и окружения__ позволяет один и тот же проект гонять в **dev / staging / prod**.'
- kind: content
  id: 023-dbt-project-yml-konfig-proekta
  title: dbt_project.yml — конфиг проекта
  code_caption: dbt_project.yml
  code: |
    name: my_dbt_project
    version: 1.0
    profile: my_profile

    model-paths: ["models"]
    macro-paths: ["macros"]

    models:
      my_dbt_project:
        stg:
          +materialized: view
        core:
          +materialized: table
          +tags: ["daily"]
  bullets:
  - Главный конфиг проекта dbt
  - Имя, версия, профиль подключения
  - Пути к моделям, макросам, сидам
  - Материализация по папкам (stg → view, core → table)
  - Теги, переменные и hooks — тоже здесь
  materials:
  - label: dbt_project.yml reference
    url: https://docs.getdbt.com/reference/dbt_project.yml
  notes: 'Файл **dbt_project.yml** — это !!сердце проекта!!: имя, версия, __профиль подключения__ и пути к моделям, макросам, сидам.


    Самое полезное — задавать **материализацию по папкам**: здесь всё в stg/ строится как **view**, а в core/ — как **table** с тегом daily. ~~Так настройки не дублируются в каждой модели, а живут в одном месте и переопределяются точечно.~~'
- kind: table
  id: 024-osnovnye-komandy-dbt
  title: Основные команды dbt
  materials:
  - label: dbt build
    url: https://docs.getdbt.com/reference/commands/build
  - label: выбор моделей
    url: https://docs.getdbt.com/reference/node-selection/syntax
  table:
    headers:
    - Команда
    - Что делает
    rows:
    - - dbt run
      - компилирует и выполняет модели
    - - dbt build
      - run + test + seed + snapshot в порядке DAG
    - - dbt test
      - тесты данных и unit-тесты
    - - dbt seed
      - загружает CSV из seeds/ как таблицы
    - - dbt snapshot
      - историзация изменений (SCD2)
    - - dbt docs generate
      - генерирует документацию и lineage
    - - --select / --exclude
      - выбор моделей (state:modified и др.)
    col_ratios:
    - 3
    - 7
  notes: 'Команд немного. **dbt run** выполняет модели, **dbt test** гоняет тесты, а !!dbt build делает всё сразу в правильном порядке по DAG!! — это рабочая лошадка.


    Отдельно — **seed**, **snapshot** и **docs generate**. И почти к любой команде можно добавить __--select / --exclude__, чтобы запустить не весь проект, а только нужные модели (**state:modified** и др.). ~~Это основа Slim CI.~~'
- kind: table
  id: 025-adaptery
  title: Адаптеры
  materials:
  - label: About connections
    url: https://docs.getdbt.com/docs/core/connect-data-platform/about-core-connections
  - label: ClickHouse setup
    url: https://docs.getdbt.com/docs/core/connect-data-platform/clickhouse-setup
  table:
    headers:
    - Платформа
    - Пакет
    - Статус
    rows:
    - - PostgreSQL
      - dbt-postgres
      - Trusted
    - - Snowflake
      - dbt-snowflake
      - Trusted
    - - BigQuery
      - dbt-bigquery
      - Trusted
    - - Redshift
      - dbt-redshift
      - Trusted
    - - Databricks
      - dbt-databricks
      - Trusted
    - - ClickHouse
      - dbt-clickhouse
      - Community
    - - DuckDB
      - dbt-duckdb
      - Community
    col_ratios:
    - 4
    - 4
    - 2
  notes: 'dbt работает с БД через **адаптеры**. Для крупных облачных хранилищ есть официальные, __доверенные (Trusted)__ адаптеры.


    Для многих других, включая **ClickHouse** и **DuckDB**, — качественные **community**-адаптеры. Ставится нужный адаптер отдельным пакетом (**dbt-postgres**, **dbt-clickhouse**…), и !!один и тот же проект в разумных пределах переносим между платформами!!.'
- kind: section
  id: 026-testirovanie-dokumentaciya
  title: Тестирование, документация, пакеты
  notes: 'Следующий блок — про **качество** и **переиспользование**.


    Как __тестировать данные__, как получать **документацию** почти бесплатно и как подключать готовые **пакеты**, чтобы не изобретать велосипед.'
- kind: content
  id: 027-dokumentirovanie-v-dbt
  title: Документирование в dbt
  image: image45.png
  bullets:
  - 'Документация генерируется автоматически: dbt docs generate'
  - Описания моделей и колонок берутся из schema.yml
  - Строится интерактивный сайт с поиском и DAG/lineage
  - Docs всегда синхронны с кодом — обновляются при каждом run
  - Полезно аналитикам и стейкхолдерам как каталог данных
  notes: 'Документация в dbt — почти **бесплатный бонус**. Вы пишете описания в **schema.yml** рядом с моделями, а !!dbt docs generate!! собирает интерактивный сайт с поиском и графом **lineage**.


    Главное — он __всегда актуален__, потому что генерируется из того же кода. Для аналитиков это фактически **каталог данных**. ~~Полезно и стейкхолдерам.~~'
- kind: content
  id: 028-testirovanie
  title: Тестирование
  image: image48.png
  materials:
  - label: dbt_utils
    url: https://hub.getdbt.com/dbt-labs/dbt_utils/latest/
  - label: dbt_expectations
    url: https://github.com/metaplane/dbt-expectations
  - label: unit testing
    url: https://github.com/EqualExperts/dbt-unit-testing
  bullets:
  - 'Качество данных: автоматическое тестирование ограничений (уникальность, null, связи) и генерация документации'
  - 'Generic-тесты: not_null, unique, accepted_values, relationships'
  - Задаются декларативно в schema.yml на колонках
  - Singular-тесты — произвольный SQL, возвращающий «плохие» строки
  - Unit-тесты — проверяют логику модели на фиктивных входах
  - 'Пакеты расширяют набор: dbt_utils, dbt_expectations'
  notes: 'Тесты в dbt бывают двух видов. **Generic** — готовые проверки (**not_null**, **unique**, **accepted_values**, **relationships**), которые вы __декларативно вешаете на колонку__ в schema.yml.


    **Singular** — произвольный SQL, который должен вернуть !!ноль «плохих» строк!!. Плюс относительно новые **unit-тесты** для логики моделей на фиктивных входах. А пакеты (**dbt_utils**, **dbt_expectations**) сильно расширяют арсенал. ~~С них удобно начинать.~~'
- kind: content
  id: 029-generic-testy-kontrakt-v
  title: 'Generic-тесты: контракт в schema.yml'
  code_caption: models/schema.yml
  code: |
    # dbt запустит оба теста для каждой сборки модели
    version: 2
    models:
      - name: stg_orders
        description: Очищенные заказы из сырого слоя
        columns:
          - name: order_id
            tests: [not_null, unique]
  bullets:
  - Generic-тест — готовое правило качества, объявленное в YAML
  - not_null защищает обязательный ключ от пропусков
  - unique проверяет, что ключ не размножился после join/загрузки
  - Для доменов есть accepted_values и relationships
  - Тесты запускаются с dbt build и попадают в результаты CI
  notes: 'Generic-тесты — самый дешёвый способ сделать ожидание от данных !!явным контрактом!!. Вместо отдельного SQL для каждой колонки мы описываем правило рядом с моделью: order_id обязателен и уникален.


    Это ловит не только плохой источник. **unique** часто показывает ошибочный join, когда одна строка заказа неожиданно размножилась; **relationships** ловит ссылку на несуществующего клиента; accepted_values защищает статус от опечатки. __Название теста сообщает, что именно сломалось__, а не просто «витрина красная».


    Тест — часть модели и той же ревьюируемой поставки. ~~Не нужно ждать ночного мониторинга: dbt build и CI остановят изменение до того, как оно попадёт в production.~~'
- kind: content
  id: 030-unit-test-logika-modeli-na
  title: 'Unit-тест: логика модели на фикстурах'
  code_caption: models/schema.yml
  code: |
    # given — минимальный вход для проверки правила агрегации
    unit_tests:
      - name: test_sum_orders
        model: agg_orders
        given:
          - input: ref('stg_orders')
            rows:
              - {customer_id: 1, amount: 100}
              - {customer_id: 1, amount: 200}
        expect:
          rows:
            - {customer_id: 1, total_amount: 300}
  bullets:
  - Unit-тест изолирует модель от настоящей БД и больших таблиц
  - given подменяет вход ref()/source() маленькими строками
  - expect фиксирует ровно тот результат, который нужен бизнесу
  - Хорош для CASE, join, дедупликации и сложных агрегатов
  - 'Запуск быстрый: ошибка видна до полного dbt build'
  notes: 'Unit-тест проверяет не «свежесть» и не общий объём данных, а __логику конкретной модели__. Мы подаём две искусственные строки заказов и заранее записываем ожидаемую агрегацию. Если разработчик поменяет GROUP BY, условие CASE или правило скидки, тест покажет расхождение на маленьком понятном примере.


    Самая полезная привычка — добавлять фикстуру на каждый рискованный крайний случай: null, дубль, отменённый заказ, граница даты. Тогда код становится !!проверяемой спецификацией!!, а не только преобразованием данных.


    Unit-тесты не заменяют generic-тесты: первые отвечают «правильно ли мы считаем?», вторые — «качественны ли реальные данные?». ~~Вместе они дают быстрый сигнал до дорогого прогона на warehouse.~~'
- kind: content
  id: 031-pakety-dbt-podklyuchenie
  title: 'Пакеты dbt: подключение'
  image: image46.jpg
  materials:
  - label: dbt Hub
    url: https://hub.getdbt.com/
  - label: шаблон пакета
    url: https://github.com/dbt-labs/dbt-package-template
  bullets:
  - Пакет = отдельный dbt-проект с макросами/моделями/тестами
  - 'Подключение: packages.yml + dbt deps'
  - 'Каталог: hub.getdbt.com; также git и локальные пути'
  - Свой пакет — чтобы переиспользовать код между проектами
  - Экономят время и стандартизируют практики
  notes: '**Пакет** — это просто другой dbt-проект, который вы подключаете. Прописываете его в **packages.yml**, выполняете !!dbt deps!! — и получаете чужие **макросы**, **тесты** и **модели**.


    Основной каталог — **hub.getdbt.com** (вот он на экране); можно из **git** и локальных путей. Свой пакет — чтобы __переиспользовать код между проектами команды__. ~~Экономят время и стандартизируют практики.~~'
- kind: table
  id: 032-klyuchevye-pakety
  title: Ключевые пакеты
  materials:
  - label: dbt Hub
    url: https://hub.getdbt.com/
  - label: dbt-utils
    url: https://github.com/dbt-labs/dbt-utils
  - label: project-evaluator
    url: https://github.com/dbt-labs/dbt-project-evaluator
  table:
    headers:
    - Пакет
    - Назначение
    - Когда брать
    rows:
    - - dbt_utils
      - базовые макросы и generic-тесты
      - сразу, это де-факто стандарт
    - - dbt_expectations
      - data-quality тесты (Great Expectations)
      - когда not_null и unique уже мало
    - - dbt_codegen
      - генерация schema.yml и staging-моделей
      - старт проекта, много источников
    - - dbt-date
      - унифицированная работа с датами
      - много календарной логики, разные СУБД
    - - audit_helper
      - сравнение моделей при рефакторинге
      - миграция и переписывание витрин
    - - elementary
      - мониторинг качества и аномалий
      - появились прод и дежурство
    - - project_evaluator
      - аудит структуры проекта
      - ревью legacy, регулярная гигиена
    - - dbtVault / AutomateDV
      - автоматизация Data Vault
      - если выбрана методология Data Vault
    col_ratios:
    - 3
    - 4
    - 4
  notes: |
    Пакеты, которые стоит знать по именам. Третья колонка тут важнее второй: !!вопрос не «какой пакет лучше», а «в какой момент проекта он окупается»!!.

    **dbt_utils** ставят практически сразу — это __базовые макросы и generic-тесты__, на которые ссылается половина примеров в интернете. **dbt_codegen** полезен на старте: он генерирует `schema.yml` и staging-модели по источникам, когда таблиц десятки и руками это писать долго. **dbt-date** снимает боль разных диалектов дат.

    Дальше — по мере взросления проекта. **dbt_expectations** нужен, когда встроенных тестов уже не хватает и требуются __пороги и распределения__. **audit_helper** включают на время рефакторинга, **elementary** — когда появился прод и дежурный, которому нужны алерты, а **project_evaluator** — когда проект дорос до регулярного аудита структуры. ~~Пакет — это зависимость: каждый добавленный пакет придётся обновлять и объяснять новичку, поэтому берут их по потребности, а не «на всякий случай».~~
- kind: content
  id: 033-dbt-utils-v-dele
  title: dbt_utils в деле
  code_caption: models/orders_enriched.sql
  code: |
    -- один стабильный ключ вместо ручной конкатенации
    {{ config(materialized='incremental',
              unique_key='order_key') }}

    select
      {{ dbt_utils.generate_surrogate_key(
           ['order_id', 'customer_id']) }} as order_key,
      -- взять все колонки кроме технической
      {{ dbt_utils.star(from=ref('stg_orders'),
           except=['updated_at']) }},
      -- безопасно сложить nullable-суммы
      {{ dbt_utils.safe_add('amount', 'tax') }}
        as total_amount
    from {{ ref('stg_orders') }}
    {% if is_incremental() %}
      where order_date > (select max(order_date)
                          from {{ this }})
    {% endif %}
  bullets:
  - dbt_utils — самый популярный пакет от dbt Labs
  - Универсальные Jinja-макросы поверх dbt-core
  - surrogate_key, star, safe_add, datediff, pivot…
  - Переносимо между ClickHouse, Postgres, Snowflake
  - Меньше boilerplate, больше переиспользования
  materials:
  - label: dbt-labs/dbt-utils
    url: https://github.com/dbt-labs/dbt-utils
  notes: '**dbt_utils** — !!самый популярный пакет!! экосистемы от dbt Labs. Он даёт __универсальные Jinja-макросы__: generate_surrogate_key для стабильного хеш-ключа, star для выбора всех колонок с исключениями, safe_add для корректной работы с NULL, а также datediff, pivot и десятки других.


    На слайде видно три типовые причины применять пакет. Хеш-ключ не зависит от ручной склейки строк, star помогает не дублировать длинный список полей, а safe_add фиксирует семантику NULL. Это не «магия», поэтому скомпилированный SQL всё ещё надо читать в ревью.


    Главная выгода — **переносимость**: один и тот же проект может компилироваться под __ClickHouse, Postgres и Snowflake__. ~~Пакет уменьшает boilerplate, но команда должна версионировать его и понимать generated SQL при обновлении.~~'
- kind: content
  id: 053-dq-pakety-expectations-elementary
  title: 'Пакеты качества: dbt_expectations и elementary'
  materials:
  - label: dbt_expectations
    url: https://github.com/metaplane/dbt-expectations
  - label: elementary
    url: https://github.com/elementary-data/elementary
  code_caption: models/schema.yml — проверки поверх generic-тестов
  code: |
    # models/schema.yml — колонки модели
    - name: total_amount
      tests:
        - dbt_expectations.expect_column_values_to_be_between:
            min_value: 0
            max_value: 1000000

    - name: order_date
      tests:
        - dbt_expectations.expect_row_values_to_have_recent_data:
            datepart: day
            interval: 2
        - elementary.volume_anomalies:
            timestamp_column: order_date
  bullets:
  - 'dbt_expectations: пороги, диапазоны и свежесть там, где not_null и unique уже мало'
  - Тесты живут в том же schema.yml и запускаются обычным dbt test
  - 'elementary: те же прогоны плюс история результатов и детект аномалий'
  - Аномалия считается от прошлых прогонов, а не от жёсткого порога в коде
  - Отчёт и алерты уходят дежурному в Slack или Telegram, а не в лог CI
  notes: |
    Два пакета закрывают разные половины качества данных. **dbt_expectations** — это __порты проверок Great Expectations в мир dbt__: диапазоны значений, ожидаемое число строк, свежесть данных, соответствие типу и регулярному выражению. Синтаксис привычный: тест объявляется в `schema.yml` рядом с моделью и запускается обычным `dbt test`, то есть !!новых сущностей в проекте не появляется!!.

    **elementary** решает другую задачу — __наблюдаемость во времени__. Он сохраняет результаты прогонов в служебные таблицы и сравнивает новый прогон с историей: объём строк, доля NULL, распределение значений. Поэтому он ловит то, что нельзя записать порогом заранее: витрина не сломалась, но строк вдруг стало вдвое меньше.

    Практическое правило: **dbt_expectations — про инвариант, который вы знаете**, elementary — про изменение, которого вы не ждали. ~~Оба пакета добавляют время в прогон, поэтому тяжёлые проверки обычно вешают на marts и на ночной run, а не на каждый pull request.~~
- kind: content
  id: 054-audit-helper-i-project-evaluator
  title: 'Рефакторинг под контролем: audit_helper'
  materials:
  - label: audit_helper
    url: https://github.com/dbt-labs/dbt-audit-helper
  - label: project_evaluator
    url: https://github.com/dbt-labs/dbt-project-evaluator
  code_caption: analyses/compare_orders.sql — старая витрина против новой
  code: |
    {% set old = adapter.get_relation(
         database=target.database,
         schema='analytics',
         identifier='fct_orders_legacy') %}

    {{ audit_helper.compare_relations(
         a_relation=old,
         b_relation=ref('fct_orders'),
         primary_key='order_id',
         exclude_columns=['updated_at']) }}

    -- в выводе: сколько строк совпало и
    -- сколько есть только в одной из витрин
  bullets:
  - Рефакторинг витрины — это не «переписал и задеплоил», а доказанная эквивалентность
  - 'compare_relations и compare_column_values: расхождения по строкам и по колонкам'
  - Живёт в analyses/ — результат читаем глазами, ничего не материализуется
  - 'project_evaluator: аудит структуры — модели без тестов, прямые ссылки на source'
  - Оба пакета — разовые проверки на время работ, а не постоянная нагрузка на прод
  notes: |
    Самая частая правка в зрелом проекте — не новая витрина, а !!переписывание старой!!. И главный вопрос ревью здесь один: __данные остались теми же или нет__. **audit_helper** отвечает на него численно: `compare_relations` сопоставляет старое и новое отношение по первичному ключу и показывает, сколько строк совпало, сколько есть только слева и только справа.

    Обратите внимание на две детали. Запрос лежит в `analyses/` — это **скомпилированный, но не выполняемый в графе SQL**, поэтому проверка не превращается в лишнюю модель. И технические колонки вроде `updated_at` исключаются явно: иначе расхождение будет стопроцентным и бесполезным. Если совпадение не 100 %, `compare_column_values` покажет, __в какой именно колонке разошлись значения__.

    Второй пакет из той же серии — **project_evaluator**. Он проверяет не данные, а устройство проекта: модели без тестов и описаний, прямые ссылки на source в обход staging, «многоэтажные» цепочки и rejoin-ы. ~~Его удобно запускать не в каждом CI, а раз в спринт или при приёме чужого legacy-проекта: получается объективный список технического долга вместо спора о вкусах.~~
- kind: content
  id: 055-pakety-versii-i-riski
  title: 'Пакеты: версии, обновление и риски'
  materials:
  - label: packages.yml
    url: https://docs.getdbt.com/docs/build/packages
  - label: dbt deps
    url: https://docs.getdbt.com/reference/commands/deps
  code_caption: packages.yml — версии пинятся, dbt_packages не коммитим
  code: |
    packages:
      - package: dbt-labs/dbt_utils
        version: [">=1.3.0", "<2.0.0"]

      - package: calogica/dbt_expectations
        version: 0.10.4

      - git: https://github.com/org/dbt-internal.git
        revision: v1.2.0      # тег, а не ветка

    # dbt deps  -> dbt_packages/  (в .gitignore)
    # package-lock.yml коммитим: он фиксирует,
    # что реально скачалось
  bullets:
  - Версия пинится диапазоном или тегом — «последняя» ломает сборку в чужой день
  - package-lock.yml коммитим, каталог dbt_packages/ — нет
  - Пакет — это чужой код в вашем проекте, его макросы могут переопределить ваши
  - Транзитивные зависимости конфликтуют по версиям, dbt deps скажет об этом сразу
  - Обновление пакета — отдельный MR с прогоном тестов, а не «заодно с фичей»
  notes: |
    Пакеты — это **зависимости**, и обращаться с ними надо как с зависимостями кода. Версию всегда пиньте: диапазоном (`>=1.3.0, <2.0.0`) или точным значением; для приватных пакетов из git указывайте __тег, а не ветку__, иначе сборка меняется в тот день, когда кто-то запушил в main чужого репозитория. С dbt 1.7 рядом появляется `package-lock.yml` — !!его коммитят, потому что он фиксирует то, что скачалось на самом деле!!, а сам каталог `dbt_packages/` в git не хранят: он воспроизводится командой `dbt deps`.

    Риск, о котором забывают: макросы пакета живут в **одном пространстве имён** с вашими. Пакет может переопределить макрос, а два пакета — потребовать несовместимые версии третьего; `dbt deps` сообщает о конфликте, но выбор остаётся за вами. Поэтому вызов через префикс (`dbt_utils.star`) — не формальность, а способ понимать, чей код исполняется.

    И организационное правило: **обновление пакета — это отдельный merge request** с прогоном тестов и чтением changelog. ~~В major-версиях пакеты меняют сигнатуры макросов, и такая правка, приехавшая «заодно» с продуктовой фичей, превращает разбор падения в археологию.~~
- kind: table
  id: 060-esche-pakety-pod-zadachu
  title: Ещё пакеты и утилиты под задачу
  materials:
  - label: dbt-score (Picnic)
    url: https://github.com/PicnicSupermarket/dbt-score
  - label: dbt-colibri
    url: https://github.com/b-ned/dbt-colibri
  - label: dbt_profiler
    url: https://hub.getdbt.com/data-mie/dbt_profiler/latest/
  table:
    headers:
    - Инструмент
    - Что делает
    - Зачем на практике
    rows:
    - - dbt_profiler
      - 'профиль колонок: NULL, уникальность, min/max'
      - быстрый аудит незнакомого источника
    - - dbt_external_tables
      - файлы в S3/GCS как sources
      - внешний слой без ручного DDL
    - - dbt_artifacts
      - метаданные прогонов в витрины
      - история времени, статусов и падений
    - - dbt-score (pip)
      - линтер метаданных, оценка 0–10
      - гейт на описания, тесты и владельцев
    - - dbt-colibri (pip)
      - column-level lineage из артефактов
      - lineage по колонкам без платформы вендора
    col_ratios:
    - 3
    - 5
    - 4
  notes: |
    Второй эшелон — то, что ставят под конкретную задачу, а не в каждый проект. **dbt_profiler** считает профиль колонок (доля NULL, уникальность, границы) и умеет класть его в документацию: !!это первое, что делаешь с незнакомым источником!!. **dbt_external_tables** описывает файлы в объектном хранилище как обычные `sources`, избавляя от ручного DDL. **dbt_artifacts** складывает метаданные прогонов в витрины — из них потом растут дашборды «сколько шла сборка» и «что падает чаще всего».

    Обратите внимание на пометку **pip** у последних двух. `dbt-score` и `dbt-colibri` — __не dbt-пакеты__: они не ставятся через `packages.yml` и `dbt deps`, а живут как отдельные python-утилиты рядом с проектом и читают его артефакты. Это другой способ подключения и другое место в CI.

    **dbt-score** от Picnic оценивает метаданные модели по правилам и выдаёт балл 0–10 — на этом удобно строить гейт «описания и владельцы обязательны». **dbt-colibri** собирает column-level lineage из уже существующих артефактов и рисует локальный дашборд. ~~Получается тот самый lineage по колонкам, за который обычно платят платформе, — ценой ещё одного шага в пайплайне.~~
- kind: content
  id: 061-pakety-v-ci-i-prode
  title: 'Пакеты в CI и проде: воспроизводимость'
  materials:
  - label: dbt deps
    url: https://docs.getdbt.com/reference/commands/deps
  code_caption: .gitlab-ci.yml — deps как шаг сборки, а не ручное действие
  code: |
    dbt_build:
      image: python:3.12
      cache:                     # не тянем пакеты каждый раз
        key: dbt-deps-$CI_COMMIT_REF_SLUG
        paths: [dbt_packages/]
      before_script:
        - pip install -r requirements.txt
        - dbt deps               # читает package-lock.yml
      script:
        - dbt build --target ci

    # приватный пакет: токен из переменной CI,
    # в packages.yml — только ссылка и тег
  bullets:
  - dbt deps — шаг пайплайна, а не то, что каждый делает у себя руками
  - Кэш dbt_packages экономит минуты, package-lock.yml гарантирует те же версии
  - Приватный пакет тянут по git+тегу с токеном из переменной CI, не из URL в репозитории
  - В docker-образ для прода пакеты кладут на этапе сборки, а не в рантайме
  - Обновление пакетов — отдельный MR со своим прогоном, а не сюрприз в ночном ране
  notes: |
    Пакеты ломают сборку не в разработке, а в CI и проде — потому что там !!никто не помнит, что нужно выполнить `dbt deps`!!. Правило простое: **deps — это шаг пайплайна**. Рядом стоят две оптимизации: кэш каталога `dbt_packages` (минуты на каждом прогоне) и `package-lock.yml`, который гарантирует, что в CI и на ноутбуке приехало __одно и то же__.

    Приватные пакеты — отдельная тема безопасности. В `packages.yml` хранится только ссылка и тег; токен приезжает **переменной окружения CI** и никогда не коммитится в URL. Это ровно тот случай, когда «работает и так» означает утечку в истории git.

    В проде порядок тот же, но жёстче: пакеты ставятся **на этапе сборки образа**, чтобы контейнер не ходил в интернет в рантайме, а обновление пакета оформляется __отдельным merge request__ со своим прогоном тестов. ~~Иначе разбор ночного падения начинается с вопроса «а что у нас вообще изменилось», на который нет ответа.~~
- kind: section
  id: 034-zapusk-v-prodakshene
  title: Запуск в продакшене
  notes: 'Теперь — как всё это запускать не с ноутбука, а __надёжно в продакшене__.


    **Оркестрация**, расписания, изоляция окружений и **CI/CD**.'
- kind: content
  id: 035-kak-zapuskat-dbt-v-prode
  title: Как запускать dbt в проде
  bullets:
  - 'Цель: надёжно и повторяемо выполнять build/run/test'
  - По расписанию или по событию, с логами и алертами
  - Ретраи и идемпотентность запусков
  - 'Изоляция окружений: dev / staging / prod (разные targets)'
  - Окно запуска и SLA на обновление данных
  - Отдельные алерты на падение модели, теста и оркестратора
  - Версионирование и деплой проекта через CI
  notes: 'В продакшене нужна !!надёжность и повторяемость!!: запуск **build/run/test** по расписанию или событию, **логи**, **алерты**, __ретраи и идемпотентность__.


    Обязательно разделяем окружения — **dev / staging / prod** — через разные **targets** в профиле. На уровне процесса важно заранее определить __окно запуска__, какие **алерты** считаются критичными и кто владеет реакцией на сбой.


    И сам проект __деплоится через CI__, а не копируется руками: так конфиг, зависимости и SQL всегда проходят один и тот же путь от ревью до prod. ~~Дальше — чем именно оркеструем.~~'
- kind: content
  id: 036-airflow-dbt-orkestraciya
  title: 'Airflow + dbt: оркестрация через Cosmos'
  code_caption: Концептуальная композиция DAG
  code: |
    # Cosmos читает dbt-проект и создаёт task group
    transform = DbtTaskGroup(
        group_id="dbt_transform",
        project_config=ProjectConfig(dbt_project_path=DBT_DIR),
        profile_config=PROFILE,
    )
    ingest_raw >> transform >> refresh_bi
  bullets:
  - Airflow управляет расписанием, ретраями, сенсорами и внешними системами
  - Cosmos превращает dbt-проект в DbtDag или DbtTaskGroup
  - Можно видеть модели, seeds и snapshots как отдельные задачи
  - Airflow connection маппится в dbt profile — один источник секретов
  - Подходит для workflow ingestion → transform → BI/ML
  materials:
  - label: Cosmos core concepts
    url: https://astronomer.github.io/astronomer-cosmos/getting_started/core-concepts.html
  - label: How Cosmos runs dbt
    url: https://astronomer.github.io/astronomer-cosmos/guides/run_dbt/index.html
  notes: '**Airflow** удобен, когда dbt — не весь процесс, а один шаг большого workflow: сначала забрать файл или дождаться внешнего API, затем построить модели, обновить BI и отправить уведомление. Оркестратор владеет !!расписанием, ретраями, зависимостями и наблюдаемостью между системами!!.


    Библиотека **Cosmos** читает dbt-проект и собирает из него DbtDag либо DbtTaskGroup. В обычном режиме модель, seed или snapshot могут стать отдельной Airflow-задачей: это даёт __точечные ретраи и видимость__, но добавляет overhead, если проект очень большой.


    Важный практический шов — подключение к DWH. Cosmos умеет использовать существующий Airflow connection через profile mapping, поэтому секрет не надо хранить одновременно в двух форматах. ~~Если задача — только SQL-transform без внешних зависимостей, полный Airflow может быть тяжелее, чем сам dbt Cloud или простой scheduler.~~'
- kind: content
  id: 037-dagster-dbt-modeli-kak-data
  title: 'Dagster + dbt: модели как data assets'
  code_caption: defs/dbt_ingest/defs.yaml
  code: |
    # dbt manifest становится набором Dagster assets
    type: dagster_dbt.DbtProjectComponent
    attributes:
      project: '{{ context.project_root }}/dbt'
      select: 'tag:daily'

    # asset selection запускает только нужную часть графа
    dg launch --assets 'key:"orders"+'
  bullets:
  - dagster-dbt представляет каждую dbt-модель как asset с зависимостями
  - Можно выбрать, материализовать и наблюдать часть dbt-графа по asset key
  - Одно lineage объединяет ingestion, dbt, ML и BI, а не только задачи
  - Asset checks связывают результат теста с конкретной моделью
  - Партиции и backfill дают управляемый прогон за исторические окна
  materials:
  - label: Dagster & dbt
    url: https://docs.dagster.io/integrations/libraries/dbt
  - label: dagster-dbt reference
    url: https://docs.dagster.io/integrations/libraries/dbt/reference
  notes: 'У Dagster другая исходная модель: в центре не задача, а !!data asset!! — таблица, файл, модель или feature. Библиотека **dagster-dbt** читает dbt manifest и создаёт assets на уровне отдельных моделей, seeds и snapshots.


    Благодаря этому можно связать dbt-модель не только с соседней SQL-моделью, но и с asset загрузки из Fivetran, обучением ML-модели или публикацией витрины. В UI и API появляется __единый lineage__, а выбор asset запускает только необходимую часть графа.


    Партиции и backfill важны для исторических данных: задаём окно дат, получаем наблюдаемый прогон и не пишем собственный цикл по периодам. ~~Это сильный выбор для asset-oriented платформы; для простого cron-запуска одного dbt-проекта такая модель может быть избыточной.~~'
- kind: content
  id: 038-ci-cd-dlya-dbt
  title: CI/CD для dbt
  materials:
  - label: dbt-checkpoint
    url: https://github.com/dbt-checkpoint/dbt-checkpoint
  - label: SQLFluff
    url: https://github.com/sqlfluff/sqlfluff
  bullets:
  - pre-commit — ловит ошибки до пуша (форматирование, стиль)
  - GitLab CI / GitHub Actions — автопроверка перед merge
  - SQLFluff — линтер и автоформаттер SQL (учитывает Jinja)
  - Slim CI — гоняем только изменённые узлы DAG (state:modified)
  - Быстрее и дешевле, чем прогон всего проекта
  notes: 'CI/CD для dbt устроен как для обычного **кода**. **pre-commit** ловит ошибки ещё до пуша, **CI** (GitLab / GitHub Actions) проверяет изменения перед merge, **SQLFluff** следит за __стилем SQL__ (с учётом Jinja).


    Отдельно — !!Slim CI: прогоняем только изменённые модели и их зависимых!! (**state:modified**), а не весь проект — это сильно экономит **время и деньги**.'
- kind: content
  id: 039-pre-commit-bystraya-zaschita
  title: 'Pre-commit: быстрая защита до push'
  code_caption: .pre-commit-config.yaml
  code: |
    # запускается локально перед созданием коммита
    repos:
      - repo: tconbeer/sqlfmt        # сначала формат
        hooks: [sqlfmt]
      - repo: sqlfluff/sqlfluff      # потом правила
        hooks: [sqlfluff-lint, sqlfluff-fix]
      - repo: dbt-checkpoint/dbt-checkpoint
        hooks: [dbt-compile, dbt-test]
  bullets:
  - Pre-commit даёт разработчику быстрый feedback без ожидания CI
  - 'sqlfmt — форматтер в духе Black: один стиль, спорить не о чем'
  - SQLFluff линтит правила поверх формата и понимает Jinja
  - dbt compile ловит сломанную ссылку/ref и синтаксис заранее
  - dbt-checkpoint добавляет правила структуры проекта и метаданных
  - 'Хук не заменяет CI: его можно пропустить локально'
  materials:
  - label: pre-commit
    url: https://pre-commit.com/
  - label: SQLFluff
    url: https://docs.sqlfluff.com/
  - label: sqlfmt
    url: https://github.com/tconbeer/sqlfmt
  notes: 'Первый рубеж — **pre-commit**. Он запускается у автора изменения и даёт обратную связь за секунды: форматирование SQL, линт с учётом Jinja, компиляция и проектные проверки. Это уменьшает число бессмысленных CI-перезапусков и делает ревью чище.


    Но локальный хук — удобство, а не гарантия: его можно не установить или обойти. Поэтому !!обязательным источником истины остаётся CI!!. Конфиг хука должен быть версионирован в репозитории, чтобы у всех разработчиков были одинаковые правила.


    Про два инструмента в конфиге: они не дублируют друг друга, и порядок важен. **sqlfmt** — форматтер в духе Black: он !!не настраивается!! (кроме длины строки) и просто приводит файл к одному виду, снимая споры о переносах на ревью; он же стоит за кнопкой «Format» в dbt Studio. **SQLFluff** — линтер: он разбирает SQL и проверяет __правила__ (алиасы, регистр ключевых слов, запрет select со звёздочкой), понимая при этом Jinja. Сначала формат, потом правила.


    Полезное разделение: pre-commit отвечает за __быструю обратную связь__, CI — за независимую проверку в чистом окружении. ~~Не стоит помещать в хук долгий полный dbt build: тогда команда начнёт его отключать.~~'
- kind: content
  id: 040-gitlab-ci-obyazatelnyj-barer
  title: 'GitLab CI: обязательный барьер merge'
  code_caption: .gitlab-ci.yml
  code: |
    # чистое окружение: lint → tests → build
    stages: [lint, test, build]
    lint:
      script: [sqlfluff lint models/, dbt compile]
    test:
      script: [dbt deps, dbt test]
    build:
      # финальный интеграционный прогон моделей и тестов
      script: [dbt build]
  bullets:
  - CI повторяет проверки независимо от рабочей машины автора
  - stages разделяют быстрый lint и более дорогую интеграционную сборку
  - dbt deps фиксирует набор пакетов перед запуском проекта
  - dbt build запускает модели, тесты, seeds и snapshots по выбранному графу
  - Slim CI может ограничить прогон state:modified и downstream
  materials:
  - label: GitLab CI dbt guide
    url: https://docs.getdbt.com/guides/gitlab
  notes: 'Второй рубеж — **GitLab CI** в чистом окружении. Он не доверяет локальным пакетам, переменным или артефактам разработчика: сначала получает зависимости через **dbt deps**, затем проверяет SQL и собирает выбранный граф.


    Разделение на lint, test и build делает ошибку понятной и экономит время: синтаксическая проблема падает раньше тяжёлого warehouse-прогона. __dbt build__ — удобная интеграционная команда, потому что объединяет запуск моделей и их тестов в корректном порядке DAG.


    На больших проектах полный прогон каждый раз слишком дорог. Тогда **Slim CI** выбирает state:modified и зависимые узлы, но production-процесс всё равно должен регулярно проверять полный граф. ~~Цель CI — не «красивый pipeline», а не дать непроверенной логике попасть в main.~~'
- kind: content
  id: 062-slim-ci-state-modified
  title: 'Slim CI: пересобираем только изменённое'
  materials:
  - label: dbt CI best practices
    url: https://docs.getdbt.com/best-practices/best-practice-workflows
  - label: defer
    url: https://docs.getdbt.com/reference/node-selection/defer
  code_caption: CI-джоба на merge request
  code: |
    # артефакты последнего прод-прогона
    # лежат в ./artifacts/prod/manifest.json

    dbt build \
      --select state:modified+ \
      --defer \
      --state ./artifacts/prod

    # state:modified+ — изменённые модели
    #                   и все их потомки
    # defer — остальное берём из прода,
    #         не пересобирая
  bullets:
  - 'state:modified+ — изменённые модели и всё, что от них зависит'
  - '--defer со --state: недостающие ссылки читаются из прод-схемы'
  - Нужен свежий manifest.json прод-прогона как артефакт пайплайна
  - Минуты вместо часов и заметно меньше денег за warehouse
  - В платформенных сборках это встроенный режим поверх dbt State
  notes: |
    Наивный CI пересобирает весь проект на каждый merge request. На проекте из сотен моделей это !!часы ожидания и прямые деньги за warehouse!!, причём 95 % работы бессмысленны: изменились две модели.

    **Slim CI** решает это двумя флагами. `--select state:modified+` сравнивает текущий проект с прошлым состоянием и берёт __изменённые модели и всех их потомков__ (плюс в конце — это и есть «и вниз по графу»). А `--defer --state` говорит: всё, чего нет в этой сборке, **брать из прода**, а не пересобирать. Обязательное условие — свежий `manifest.json` последнего прод-прогона, который пайплайн где-то хранит и скачивает.

    Это же состояние лежит в основе **dbt State** в новых версиях: сравнение с прошлым прогоном перестало быть трюком для CI и стало штатной частью движка — на нём же держатся `retry` и отложенные ссылки. ~~В платформенных сборках режим включается галочкой, в самописном CI его придётся собрать самому — но окупается он на первой же неделе.~~
- kind: section
  id: 041-dopolnitelnye-vozmozhnosti-i
  title: Дополнительные возможности и тренды
  notes: 'Финальный блок — что ещё умеет dbt за пределами базового SQL, и __куда движется экосистема__.


    **Python-модели**, **Semantic Layer**, интеграция с **ИИ**, альтернативы dbt и платформенные декларативные подходы к трансформациям.'
- kind: content
  id: 042-python-modeli-mikrobatching
  title: Python-модели, микробатчинг, каталоги
  image: image60.png
  materials:
  - label: Python models
    url: https://docs.getdbt.com/docs/build/python-models
  - label: dbt → DataHub
    url: https://docs.datahub.com/docs/generated/ingestion/sources/dbt
  - label: OpenLineage
    url: https://openlineage.io/docs/integrations/dbt/
  bullets:
  - Python-модели — когда SQL неудобен (ML-фичи, сложная логика)
  - Микробатчинг — инкрементальная обработка окнами времени
  - 'Артефакты: manifest.json, catalog.json, run_results.json'
  - Интеграция с Data Catalogs (DataHub, OpenMetadata и др.)
  - Единый проект как источник метаданных и lineage
  notes: 'Несколько продвинутых возможностей. Там, где **SQL** неудобен (например, __ML-фичи__), можно писать **Python-модели**: это особенно полезно для фич-инжиниринга, сложной валидации и сценариев, где библиотека Python уже готова.

    **Микробатчинг** помогает с большими инкрементальными нагрузками: данные обрабатываются небольшими окнами времени, а не одним гигантским прогоном. Это снижает стоимость backfill и делает поведение более предсказуемым для длинных историй.

    А артефакты, которые dbt генерирует — !!manifest.json, catalog.json, run_results.json!! — становятся источником **метаданных** и **lineage** для внешних каталогов (**DataHub**, **OpenMetadata**, **OpenLineage**). ~~В хорошем стеке dbt не просто строит таблицы, а поставляет описание самого проекта наружу.~~'
- kind: content
  id: 043-semantic-layer-metricflow
  title: Semantic Layer / MetricFlow
  image: image62.png
  materials:
  - label: About MetricFlow
    url: https://docs.getdbt.com/docs/build/about-metricflow
  - label: MetricFlow commands
    url: https://docs.getdbt.com/docs/build/metricflow-commands
  bullets:
  - Единое определение метрик — один раз, в коде
  - MetricFlow генерирует корректный SQL по запросу метрики
  - Убирает расхождения метрик между дашбордами
  - Метрики доступны из BI, ноутбуков и через API
  - Консистентность и переиспользование бизнес-логики
  notes: 'Больная тема любой аналитики — когда __«выручка» в двух дашбордах считается по-разному__. !!Semantic Layer решает это: метрика определяется один раз в коде!!, а не переписывается в каждом BI-инструменте.


    Движок **MetricFlow** сам генерирует корректный **SQL** под каждый запрос. Метрики доступны из **BI**, ноутбуков и по **API** — и везде считаются **одинаково**. Это особенно важно, когда одна и та же метрика используется в отчётах, алертах и data products.


    Практический смысл для команды — __одна формула, один владелец, один контур тестирования__. ~~Консистентность и переиспользование бизнес-логики.~~'
- kind: content
  id: 044-dbt-i-ai
  title: dbt и AI
  image: image67.png
  materials:
  - label: dbt Copilot
    url: https://docs.getdbt.com/docs/cloud/dbt-copilot
  - label: dbt MCP
    url: https://github.com/dbt-labs/dbt-mcp
  - label: context7
    url: https://context7.com/
  bullets:
  - dbt Copilot — генерация SQL, тестов, документации, метрик
  - dbt MCP — стандартный доступ LLM/агентов к моделям и метрикам
  - context7 / MCP — подключение IDE и AI к контексту проекта
  - Расширения приносят MCP прямо в IDE — Power User поднимает свой MCP-сервер
  - Агентные скиллы — повторяемые сценарии поверх MCP, а не копипаста в чат
  - AI ускоряет рутину, но код остаётся ревьюируемым
  notes: 'dbt активно интегрируется с **ИИ**. **dbt Copilot** генерирует **SQL**, **тесты** и **документацию** — это ускоряет рутинную часть работы, но не отменяет ревью и понимание модели человеком.

    !!dbt MCP даёт языковым моделям и агентам стандартный, управляемый доступ!! к вашим моделям и метрикам; **context7** и MCP подключают IDE/AI к __контексту проекта__. Это полезно, когда ассистенту нужно работать не «в вакууме», а с актуальными моделями, тестами и описаниями.

    Важно: ИИ **ускоряет рутину**, но результат — это по-прежнему **код**, который проходит __ревью и тесты__. ~~Самая сильная схема — не автогенерация вместо инженера, а ассистент, который снимает повторяющуюся работу и уменьшает трение.~~'
- kind: content
  id: 065-dbt-state-i-dbt-wizard
  title: 'Куда идёт dbt: State и агент Wizard'
  materials:
  - label: ADE-bench
    url: https://www.getdbt.com/resources/webinars/analytics-data-engineer-bench
  - label: dbt Core v2 roadmap
    url: https://github.com/dbt-labs/dbt-core/blob/main/docs/roadmap/2026-06-announcing-v2.md
  bullets:
  - 'dbt State: сравнение с прошлым прогоном стало частью движка, а не трюком для CI'
  - На нём держатся slim CI, отложенные ссылки (defer) и повторные запуски
  - 'dbt Wizard — агент под цикл аналитической инженерии: разобраться, изменить, проверить'
  - По заявлению dbt Labs — 76 % на ADE-bench, бенчмарке задач дата-инженерии
  - Parquet-артефакты v2 агент читает запросом, а не разбором manifest.json
  notes: |
    Два анонса, которые стоит держать в голове. Первый — **dbt State**: механика «сравнить проект с прошлым состоянием» перестала быть __трюком для CI__ и стала штатной частью движка. Практически это то же самое, что мы разобрали на слайде про slim CI, только быстрее и доступно везде: на состоянии держатся выбор изменённого, `defer` и повторные запуски после падения.

    Второй — **dbt Wizard**, агент, заточенный не под «напиши SQL», а под весь цикл аналитической инженерии: разобраться в чужом проекте, внести правку, проверить результат. Для измерения dbt Labs сделали **ADE-bench** — бенчмарк задач аналитической и дата-инженерии; по их публикации Wizard берёт !!76 % на наборе из 75 задач!!. Цифра вендорская, и относиться к ней стоит как к вендорской, но сам бенчмарк — полезная попытка мерить агентов на реальной работе, а не на олимпиадных задачках.

    Техническая деталь, которая связывает всё это: **Parquet-артефакты** из v2 агент читает __запросом__. ~~Именно поэтому «дать модели контекст проекта» перестаёт означать «скормить ей гигантский manifest.json» — и почему MCP и агентные скиллы вокруг dbt стали работать заметно лучше.~~
- kind: table
  id: 063-sqlmesh-i-dbt-swot
  title: 'SQLMesh против dbt: SWOT'
  materials:
  - label: SQLMesh docs
    url: https://sqlmesh.readthedocs.io
  - label: SQLGlot
    url: https://github.com/tobymao/sqlglot
  table:
    headers:
    - Квадрант
    - Что за этим стоит
    rows:
    - - S — сильные стороны
      - разбор SQL в AST (SQLGlot) и column-level lineage; virtual environments; plan/apply с анализом влияния; инкрементальность и аудиты внутри модели
    - - W — слабые стороны
      - небольшая экосистема пакетов; меньше готовых рецептов и обучения; нишевый рынок найма; интеграции с оркестраторами менее зрелые
    - - O — возможности
      - greenfield-проекты; дешёвые preview-среды на каждый PR; запуск поверх существующего dbt-проекта без переписывания моделей
    - - T — угрозы
      - миграция работающего dbt без явной боли; двойной стек и раздвоение практик в команде; ставка на одного вендора (Tobiko Data)
    col_ratios:
    - 2
    - 8
  notes: |
    Раньше на этом месте было три слайда сравнения — сведём их в один честный SWOT. **Сильные стороны SQLMesh технические и реальные**: он разбирает SQL в синтаксическое дерево через SQLGlot, поэтому знает !!lineage на уровне колонок!! и отличает ломающее изменение от безобидного. Виртуальные среды делают «свою копию хранилища на ветку» дешёвой, а `plan` показывает влияние правки __до__ применения.

    **Слабости — не в технике, а вокруг неё**: пакетов меньше, статей и курсов меньше, нанимать сложнее, интеграции менее обкатаны. Именно это чаще всего и решает исход спора в команде.

    **Возможности** — там, где нет груза legacy: новый проект, дорогие preview-среды, желание получить impact analysis. Причём переходить целиком не обязательно: SQLMesh умеет запускаться __поверх существующего dbt-проекта__ (следующий слайд). **Угрозы** — миграция ради миграции, двойной стек, когда половина команды живёт в одном инструменте, а половина в другом, и зависимость от одного вендора. ~~Практический вывод курса: на greenfield SQLMesh стоит рассматривать всерьёз, а работающий dbt-проект переносят только под конкретную боль, которую можно назвать вслух.~~
- kind: content
  id: 064-sqlmesh-poverh-dbt-proekta
  title: SQLMesh поверх существующего dbt-проекта
  materials:
  - label: SQLMesh + dbt
    url: https://sqlmesh.readthedocs.io/en/stable/integrations/dbt/
  code_caption: из корня рабочего dbt-проекта
  code: |
    pip install "sqlmesh[dbt]"

    sqlmesh init -t dbt   # читает dbt_project.yml
                          # и profiles.yml

    sqlmesh plan dev      # что изменилось и что
                          # придётся пересчитать
    sqlmesh run           # штатные прогоны

    # модели остаются dbt-моделями:
    # тот же SQL с ref() и Jinja
  bullets:
  - 'Проект не переписывается: init читает dbt_project.yml и profiles.yml'
  - Модели, seeds и пакеты (dbt deps) остаются на месте
  - dbt-тесты становятся audits; sqlmesh test — это юнит-тесты запросов
  - 'is_incremental() меняется на sqlmesh_incremental и временные переменные'
  - 'Поддержано не всё: часть jinja-методов и отдельные настройки snapshots'
  notes: |
    Это ответ на главное возражение «у нас уже сто моделей на dbt». SQLMesh умеет работать **как движок поверх вашего dbt-проекта**: `sqlmesh init -t dbt` из корня проекта читает `dbt_project.yml` и `profiles.yml`, забирает модели, seeds и подключения. !!Переписывать SQL не нужно!! — модели остаются dbt-моделями с `ref()` и Jinja, а рядом появляется `sqlmesh.yaml` со своими настройками по умолчанию.

    Что меняется в терминах. dbt-тесты приезжают как **audits**; при этом слово `test` в SQLMesh занято под __юнит-тесты логики запроса__ — это разные вещи, и путаница здесь стоит дорого. Окружения SQLMesh создаёт сам во время `plan`, поэтому хардкодить target в профиле не нужно: профиль указывает на прод, остальное берёт на себя движок.

    Честные ограничения тоже стоит назвать. Инкрементальные блоки `is_incremental()` заменяются на **sqlmesh_incremental** с предопределёнными временными переменными; часть jinja-методов (`debug`, обход `graph.nodes`) недоступна; у snapshots не поддержан `invalidate_hard_deletes=False`; типы seed-колонок иногда приходится указывать явно. ~~Поэтому реалистичный сценарий — не «переезд в пятницу», а параллельный запуск на копии проекта: увидеть plan, оценить impact analysis и уже потом решать.~~
- kind: content
  id: 046-deklarativnye-transformacii
  title: 'Декларативные трансформации: ещё четыре подхода'
  materials:
  - label: Bruin overview
    url: https://getbruin.com/docs/bruin/overview.html
  - label: Spark Declarative Pipelines
    url: https://docs.databricks.com/aws/en/ldp/
  - label: Lakeflow pipelines
    url: https://docs.databricks.com/aws/en/ldp/concepts/pipelines
  - label: Snowflake Dynamic Tables guide
    url: https://docs.snowflake.com/en/user-guide/dynamic-tables/decision-guide
  bullets:
  - Bruin — один CLI для ingestion, SQL/Python assets, quality checks и lineage в repo
  - Spark Declarative Pipelines (SDP) — SQL/Python для batch и streaming-графов
  - 'Databricks Lakeflow — managed-пайплайны: flows, streaming tables, materialized views'
  - Snowflake Dynamic Tables — SELECT + TARGET_LAG; платформа сама ведёт refresh и порядок DAG
  - 'Выбор: portable dbt/SQLMesh/Bruin или нативные возможности конкретной платформы'
  notes: 'Тренд шире одного dbt: команды всё чаще описывают !!желаемый набор данных и зависимости!!, а не последовательность низкоуровневых задач. **Bruin** объединяет ingestion, SQL/Python-преобразования, quality checks и lineage в репозитории — полезно, когда хочется меньше разрозненных инструментов.


    В Spark-экосистеме **Spark Declarative Pipelines** описывает batch и streaming-пайплайны в SQL или Python. Databricks **Lakeflow** — управляемая реализация этого подхода: платформа анализирует зависимости и оркестрирует flows, streaming tables и materialized views. Это естественно для Delta/streaming-нагрузок, но сильнее привязывает решение к платформе.


    В Snowflake **Dynamic Tables** позволяют определить результат SQL-запросом и TARGET_LAG; Snowflake сам поддерживает порядок refresh и, где возможно, incremental processing. Для процедурной логики, точного cron или сложного MERGE остаются streams/tasks. __dbt выигрывает переносимостью и экосистемой__, нативные средства — меньшим количеством операционного кода внутри своей платформы. ~~Современный стек часто сочетает эти подходы, а не выбирает ровно один.~~'
