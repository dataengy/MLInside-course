  - Микробатчинг — инкрементальная обработка окнами времени
  - 'Артефакты: manifest.json, catalog.json, run_results.json'
  - Интеграция с Data Catalogs (DataHub, OpenMetadata и др.)
  - Единый проект как источник метаданных и lineage
  notes: 'Несколько продвинутых возможностей. Там, где **SQL** неудобен (например, __ML-фичи__), можно писать **Python-модели**. **Микробатчинг** помогает с большими инкрементальными нагрузками (обработка окнами времени).


    А артефакты, которые dbt генерирует — !!manifest.json, catalog.json, run_results.json!! — становятся источником **метаданных** и **lineage** для внешних каталогов (**DataHub**, **OpenMetadata**, **OpenLineage**).'
- kind: content
  title: Semantic Layer / MetricFlow
  image: image62.png
  materials:
  - label: About MetricFlow
    url: https://docs.getdbt.com/docs/build/about-metricflow
  - label: MetricFlow commands
    url: https://docs.getdbt.com/docs/build/metricflow-commands
  bullets:
  - Единое определение метрик — один раз, в коде
  - MetricFlow генерирует корректный SQL по запросу метрики
  - Убирает расхождения метрик между дашбордами
  - Метрики доступны из BI, ноутбуков и через API
  - Консистентность и переиспользование бизнес-логики
  notes: 'Больная тема любой аналитики — когда __«выручка» в двух дашбордах считается по-разному__. !!Semantic Layer решает это: метрика определяется один раз в коде!!.


    Движок **MetricFlow** сам генерирует корректный **SQL** под каждый запрос. Метрики доступны из **BI**, ноутбуков и по **API** — и везде считаются **одинаково**. ~~Консистентность и переиспользование бизнес-логики.~~'
- kind: content
