    col_ratios:
    - 3
    - 7
  notes: 'Команд немного. **dbt run** выполняет модели, **dbt test** гоняет тесты, а !!dbt build делает всё сразу в правильном порядке по DAG!! — это рабочая лошадка.


    Отдельно — **seed**, **snapshot** и **docs generate**. И почти к любой команде можно добавить __--select / --exclude__, чтобы запустить не весь проект, а только нужные модели (**state:modified** и др.). ~~Это основа Slim CI.~~'
