  - dbt MCP — стандартный доступ LLM/агентов к моделям и метрикам
  - context7 / MCP — подключение IDE и AI к контексту проекта
  - AI ускоряет рутину, но код остаётся ревьюируемым
  notes: 'dbt активно интегрируется с **ИИ**. **dbt Copilot** генерирует **SQL**, **тесты** и **документацию**. !!dbt MCP даёт языковым моделям и агентам стандартный, управляемый доступ!! к вашим моделям и метрикам; **context7** и MCP подключают IDE/AI к __контексту проекта__.


    Важно: ИИ **ускоряет рутину**, но результат — это по-прежнему **код**, который проходит __ревью и тесты__.'
