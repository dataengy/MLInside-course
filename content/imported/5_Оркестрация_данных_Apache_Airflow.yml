- kind: content
  title: 'Специфика ML-пайплайнов: Почему Airflow «из коробки» мало?'
  notes: ''
  bullets:
  - Экстремальные требования к ресурсам Обучение и тяжелый инференс требуют GPU, терабайты
    RAM и CPU, которых физически нет на стандартной машине с Airflow Scheduler. Ад
    зависимостей Для модели «А» нужен PyTorch 1.13 и CUDA 11, а для модели «Б» — PyTorch
    2.4 и CUDA 12. Если установить их на один воркер Airflow, система сломается. Время
    выполнения ML-задачи могут выполняться часами или днями. Воркер Airflow не должен
    держать процесс активным так долго, рискуя упасть по таймауту.
- kind: content
  title: 'Продвинутый Taskflow API: Ресурсы и Контекст'
  notes: ''
- kind: content
  title: Изоляция окружения через PythonVirtualenvOperator
  notes: ''
  bullets:
  - 'Оверхед: Сборка Docker-образа на каждое мелкое изменение в коде обучения это
    долго Альтернатива: Динамическое создание чистого виртуального окружения (Venv)
    прямо в процессе выполнения DAG'
  code: "from airflow.sdk import dag, task\n\v@dag(dag_id=\"ml_training_isolated\"\
    , schedule=None)\ndef my_pipeline():\n\v\t# Создание изолированного Venv прямо\
    \ на воркере\n\t@task.virtualenv(\n\t\ttask_id=\"train_xgboost\",\n\t\trequirements=[\"\
    xgboost==2.1.0\", \"scikit-learn==1.5.0\", \"mlflow==2.14.0\"],\n\t\tsystem_site_packages=False,\
    \ # Полная изоляция от системных пакетов воркера\n\t\tpython_version=\"3.11\"\
    \ # Airflow 3 позволяет явно указывать версию Python\n\t)\n\tdef train_model():\n\
    \t\timport xgboost as xgb\n\t\timport mlflow\n\t\t# Код обучения модели с фиксацией\
    \ в MLflow...\n\t\tprint(f\"XGBoost version: {xgb.__version__}\")\n\v\ttrain_model()\n\
    \vmy_pipeline()"
- kind: content
  title: Airflow + DockerOperator
  notes: ''
  bullets:
  - 'Стабильность артефакта: Образ собирается один раз в CI/CD — код гарантированно
    выполнится везде одинаково Идеально для On-Premise: Когда у компании нет Kubernetes,
    но есть Docker Swarm или просто мощные выделенные сервера (Celery-воркеры) Свобода
    в технологиях: Внутри контейнера может быть любая версия Python, C++ или CUDA-драйверов.'
  code: "from datetime import datetime\nfrom airflow.sdk import dag, task\n\v@dag(dag_id=\"\
    docker_ml_pipeline\", start_date=datetime(2026, 7, 1), schedule=None)\ndef my_pipeline():\n\
    \v\t# Запуск ML-шага внутри локального Docker-контейнера\n\t@task.docker(\n\t\t\
    task_id=\"train_with_sktime\",\n\t\timage=\"cr.yandex/mlops/sktime-forecasting:v2.1\"\
    ,\n\t\tcontainer_name=\"airflow_sktime_step\",\n\t\tauto_remove=\"force\", # Удалять\
    \ контейнер после падения или успеха\n\t\tnetwork_mode=\"bridge\",\n\t\tdocker_url=\"\
    unix://var/run/docker.sock\", # Монтирование Docker-демона воркера\n\t\tenvironment={\n\
    \t\t\t\"MLFLOW_TRACKING_URI\": \"http://mlflow-server:5000\",\n\t\t\t\"MODEL_VERSION\"\
    : \"v2.1\"\n\t\t}\n\t)\n\tdef run_time_series_training():\n\t\t# Этот Python-код\
    \ упакуется и улетит в Docker-контейнер!\n\t\timport sktime\n\t\tprint(f\"Успешный\
    \ старт обучения TS моделей на sktime {sktime.__version__}\")\n\v\trun_time_series_training()\n\
    \vmy_pipeline()"
- kind: content
  title: Airflow + KubernetesPodOperator
  notes: ''
  bullets:
  - 'Динамическое масштабирование (Autoscaling): Ноды в облаке поднимаются под задачу
    и удаляются после обучения (экономия бюджета) Честное выделение GPU: Гарантированное
    резервирование видеокарт (A100, H100) без конфликтов между тасками Полная свобода
    рантайма: Можно запускать не только Python, но и бинарники на C++, Java или готовые
    CLI-утилиты (например, yolov8 train)'
  code: "# Обучение LLM / Диплёрнинг модели в отдельном Поде\ntrain_llm_step = KubernetesPodOperator(\n\
    \ttask_id=\"train_llm_model\",\n\tname=\"llm-training-pod\",\n\tnamespace=\"ml-workflows\"\
    ,\n\timage=\"cr.yandex/mlops/llm-trainer:v3.0\",\n\tcmds=[\"python3\", \"train.py\"\
    ], # Точка входа внутрь контейнера\n\targuments=[\"--epochs\", \"10\", \"--batch-size\"\
    , \"32\"],\n\t# Таргетинг на специализированные GPU-ноды\n\tnode_selector={\"\
    node-type\": \"gpu-tensor-core\"},\n\ttolerations=[\n\t\tk8s.V1Toleration(key=\"\
    ://nvidia.com\", operator=\"Exists\", effect=\"NoSchedule\")\n\t],\n\t# Лимиты\
    \ и запросы ресурсов уровня Production\n\tcontainer_resources=k8s.V1ResourceRequirements(\n\
    \t\trequests={\"memory\": \"32Gi\", \"cpu\": \"8\"},\n\t\tlimits={\"memory\":\
    \ \"64Gi\", \"cpu\": \"16\", \"://nvidia.com\": \"2\"} # 2x GPU\n\t),\n\t# Безопасность\
    \ и очистка\n\tis_delete_operator_pod=True, # Удалить под из K8s после завершения\n\
    \timage_pull_secrets=[k8s.V1LocalObjectReference(name=\"yc-registry-secret\")]\n\
    )"
- kind: content
  title: Динамические DAG (Dynamic Task Mapping)
  notes: ''
  bullets:
  - Zero-Touch автоматизация Добавление новой модели в продакшен происходит через
    интерфейс MLflow, без коммитов в код Airflow Изолированный скоринг Каждая модель
    инферится в своем собственном потоке/контейнере со своими лимитами A/B Тестирование
    и Ансамбли Идеально для одновременного расчёта предсказаний от моделей-конкурентов
    (Challenger моделей) на одном датасете
  code: "@task\ndef get_active_models_from_mlflow():\n\t# Возвращаем простой список\
    \ словарей (XCom-совместимый)\n\treturn [\n\t\t{\"model_name\": \"demand_forecast_xgb\"\
    , \"version\": 3},\n\t\t{\"model_name\": \"demand_forecast_lightgbm\", \"version\"\
    : 1},\n\t\t{\"model_name\": \"demand_forecast_catboost\", \"version\": 5}\n\t\
    ]\v# Используем virtualenv, чтобы mlflow и зависимости моделей не ломали воркер\
    \ Airflow\n@task.virtualenv(\n\trequirements=[\"mlflow==2.14.0\", \"scikit-learn==1.5.0\"\
    ], \n\tsystem_site_packages=False\n)\ndef run_model_inference(model_info: dict):\n\
    \timport mlflow\n\tname = model_info[\"model_name\"]\n\tver = model_info[\"version\"\
    ]\n\tprint(f\"Скачивание из MLflow: {name} (v{ver})\")\n\treturn f\"Predictions_ready_for_{name}_v{ver}\"\
    \n\v# 1. Получаем динамический список моделей\nmodels_list = get_active_models_from_mlflow()\n\
    # 2. Магия маппинга отлично работает и вместе с @task.virtualenv!\ninference_results\
    \ = run_model_inference.expand(model_info=models_list)"
- kind: content
  title: Облачные операторы (Sagemaker, Vertex AI, AzureML)
  notes: ''
  bullets:
  - 'Zero Infrastructure: Не нужно администрировать кубернетес, настраивать CUDA-драйверы
    на нодах и следить за дисками Serverless GPU: Облако само выделяет мощное GPU-железо
    на время инференса или обучения и полностью гасит его после Airflow как дирижер:
    Airflow не выполняет код, а лишь триггерит облачный джоб, мониторит статус и забирает
    логи'
  code: "from datetime import datetime\nfrom airflow.sdk import dag\nfrom airflow.providers.amazon.aws.operators.sagemaker\
    \ import SageMakerTransformOperator\n\v@dag(dag_id=\"cloud_managed_inference\"\
    , start_date=datetime(2026, 7, 1), schedule=None)\ndef my_pipeline():\n\v\t# Запуск\
    \ пакетного инференса (Batch Transform) напрямую в AWS SageMaker\n\tsagemaker_inference\
    \ = SageMakerTransformOperator(\n\t\ttask_id=\"submit_sagemaker_batch\",\n\t\t\
    config={\n\t\t\t\"TransformJobName\": \"llm-scoring-job-{{ ds_nodash }}\",\n\t\
    \t\t\"ModelName\": \"prod-llm-model-v3\",\n\t\t\t\"MaxConcurrentTransforms\":\
    \ 4,\n\t\t\t\"TransformInput\": {\n\t\t\t\t\"DataSource\": {\"S3DataSource\":\
    \ {\"S3DataType\": \"S3Prefix\", \"S3Uri\": \"s3://my-\t\t\t\t\t\t\tbucket/input-data/\"\
    }}\n\t\t\t},\n\t\t\t\"TransformOutput\": {\"S3OutputPath\": \"s3://my-bucket/predictions/\"\
    },\n\t\t\t\"TransformResources\": {\"InstanceType\": \"ml.p3.2xlarge\", \"InstanceCount\"\
    : 1} \n\t\t\t# Выделение GPU инстанса в AWS\n\t\t},\n\twait_for_completion=True\
    \ # Airflow будет ждать окончания работы джоба в облаке\n)\n\vmy_pipeline()"
- kind: content
  title: 'Управление внешними системами: Hooks и Connections'
  notes: ''
  bullets:
  - 'Главное правило: Разделение кода и секретов Никаких хардкод-паролей: Ключи доступа,
    токены и строки подключения никогда не пишутся в коде DAG Централизованное хранение:
    Все доступы живут в Airflow Connections (или внешних Vault / AWS Secrets Manager)
    Концепция Hooks (Хуки) в Airflow 3 Универсальный интерфейс: Хук - это встроенный
    инструмент для общения с внешним миром (S3, PostgreSQL, MLflow). Автоматизация
    под капотом: Хук сам берет нужные секреты из Connection, открывает сессию, следит
    за пулом соединений и закрывает его.'
  code: "@task\ndef check_production_model_status():\n\t# Инициализируем хук, указывая\
    \ ID подключения к MLflow из интерфейса Airflow\n\t# В коде нет ни IP-адресов,\
    \ ни паролей к серверу!\n\tmlflow_hook = HttpHook(http_conn_id=\"mlflow_tracking_server\"\
    , method=\"GET\")\n\t# Делаем безопасный запрос к REST API MLflow Registry для\
    \ проверки версии модели\n\tresponse = mlflow_hook.run(\n\t\tendpoint=\"/api/2.0/mlflow/registered-models/get-latest-versions\"\
    ,\n\t\tdata={\"name\": \"churn_prediction_llm\", \"stages\": [\"Production\"]}\n\
    \t)\n\tmodel_data = response.json()\n\tprint(f\"Актуальная версия модели в MLflow:\
    \ {model_data['model_versions'][0]['version']}\")\n\treturn model_data"
- kind: content
  title: 'Слайд 28: Триггеры и Сбойные ситуации. Trigger Rules (all_success, one_failed
    и т.д.) для гибкой логики.'
  notes: ''
  bullets:
  - Дефолтное поведение (all_success) Если расчет фичей кликстрима упал, инференс
    заблокируется . Модель не выдаст предсказаний ни для кого Гибкий инференс (all_done)
    Инференс запустится в любом случае. Внутри кода модели мы используем данные за
    вчера и генерируем предсказания на доступных данных
  code: "[ fetch_crm_features ] ──► (Успех \U0001F7E2)  ──┐\n[ fetch_click_features\
    \ ] ──► (СБОЙ \U0001F534)   ├──► [ run_batch_inference ] \v\t\t\t\t\t\t\t\t │\
    \ \t\t↳ trigger_rule = ALL_DONE\n[ fetch_text_features ] ──► (Успех \U0001F7E2\
    ) ──┘\n\n@task(trigger_rule=TriggerRule.ALL_DONE)\ndef run_batch_inference():\n\
    \tprint(\"Запуск модели\")"
- kind: content
  title: 'Airflow в контуре CI/CD: Автоматическое переобучение моделей (Continuous
    Retraining)'
  notes: ''
  code: "@dag(\n\tdag_id=\"automated_model_retraining\",\n\tstart_date=datetime(2026,\
    \ 7, 1),\n\tschedule=None, # DAG запускается только по внешнему API-триггеру\n\
    \tparams={\n\t# Входные параметры от системы мониторинга (например Grafana)\n\t\
    \t\"model_name\": Param(\"churn_prediction_llm\", type=\"string\"),\n\t\t\"current_roc_auc\"\
    : Param(0.72, type=\"number\"),\n\t\t\"threshold\": Param(0.75, type=\"number\"\
    )\n\t}\n)\ndef cice_ml_pipeline():\n\t@task.branch\n\tdef evaluate_metrics(params):\n\
    \t\tcurrent = params[\"current_roc_auc\"]\n\t\tthreshold = params[\"threshold\"\
    ]\n\t\tif current < threshold:\n\t\t\tprint(f\"ROC-AUC ({current}) ниже порога\
    \ ({threshold})\")\n\t\t\treturn \"train_model\" # Переходим к таске train_model\n\
    \t\telse:\n\t\t\tprint(f\"ROC-AUC ({current}) в норме\")\n\t\t\treturn \"skip_retraining\"\
    \ # Переходим к таске-заглушке\n\ncurl -X POST \"http://airflow/api/v1/dags/automated_model_retraining/dagRuns\"\
    \ \\\n-H \"Content-Type: application/json\" \\\n-d '{\"conf\": {\"model_name\"\
    : \"churn_prediction_llm\", \"current_roc_auc\": 0.69}}'"
- kind: content
  title: Data Lineage и OpenLineage в Airflow 3
  notes: ''
  code: "from datetime import datetime\nfrom airflow.sdk import dag, task\nfrom airflow.sdk\
    \ import Asset # Импортируем Asset вместо Dataset!\v# 1. Объявляем физические\
    \ ассеты (входной и выходной)\nraw_user_clicks = Asset(\"s3://ml-bucket/data/raw_clicks.parquet\"\
    )\nmlflow_model_artifact = Asset(\"mlflow://://company.com\")\v@dag(\n\tdag_id=\"\
    ml_lineage_pipeline\", \n\tstart_date=datetime(2026, 7, 1), \n\tschedule=None,\
    \ \n\tcatchup=False\n)\ndef my_pipeline():\n\v\t# 2. Указываем ассеты в inlets\
    \ и outlets для трекинга Lineage\n\t@task(inlets=[raw_user_clicks], outlets=[mlflow_model_artifact])\n\
    \tdef train_model():\n\t\timport mlflow\n\t\tprint(\"Читаем клики из s3, обучаем\
    \ модель и логируем в MLflow Registry\")\n\t\t# Airflow 3 зафиксирует событие\
    \ (Asset Event) обновления mlflow_model_artifact\n\v\ttrain_model()\n\vmy_pipeline()\n\
    \n@dag(\n\tdag_id=\"auto_deploy_model\",\n\tschedule=[mlflow_model_artifact],\
    \ \n\tstart_date=datetime(2026, 7, 1),\n\tcatchup=False\n)"
