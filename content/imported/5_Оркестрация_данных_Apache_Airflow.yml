- kind: content
  title: Что такое Apache Airflow?
  notes: ''
  bullets:
  - 2014 Airbnb Создан Максимом Бошеменом (Maxime Beauchemin) в Airbnb в октябре 2014
    года для управления сложными аналитическими пайплайнами 2016 Apache Incubator
    В 2016 году передан в фонд Apache Software Foundation 2019 Top-Level Project,
    стандарт индустрии
  - Запускает проверку данных
  - Amazon S3
  - Триггерит сбор витрин
  - Отдает команду на расчет
  - Поднимает контейнер с GPU
  - Фиксирует артефакты и метрики
  - Обновляет метаданные
  - Это ОРКЕСТРАТОР Он не обрабатывает данные сам, а говорит другим системам (Spark,
    SQL, Kubernetes), когда и что нужно сделать Workflow as Code Пайплайны описываются
    исключительно на чистом Python, что позволяет использовать Git, CI/CD, код-ревью
    и автотесты
  image: '(pptx: 13 изображени(й) на слайде)'
