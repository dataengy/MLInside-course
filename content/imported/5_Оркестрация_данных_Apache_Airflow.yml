- kind: content
  title: Почему cron не подходит?
  notes: ''
  bullets:
  - 'Нет отслеживания зависимостей Cron запускает задачи только по времени, а не по
    готовности данных Нельзя сказать: «Запусти train.py строго после успешного завершения
    preprocess.py» Сложный перезапуск при сбоях Если упал шаг скрипта посреди ночи,
    придется вручную перезапускать весь скрипт Нет концепции Backfill - невозможно
    одной командой пересчитать пайплайн за прошлый месяц Отсутствие интерфейса и мониторинга
    Статус задач можно узнать только через grep в логах на сервере Нет дашборда, где
    бизнес или тимлид могут увидеть: «Пайплайн сейчас выполнен на 60%» Сложно настроить
    адекватные алерты (в Slack/Telegram) на разные уровни критичности ошибок.'
