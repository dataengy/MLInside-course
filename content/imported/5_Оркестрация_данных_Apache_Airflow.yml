  title: Роль Airflow в MLOps
  notes: ''
  bullets:
  - Сбор и подготовка новых данных Проверка появления свежих логов или транзакций
    за прошедшие сутки (Sensors) Генерация свежих фичей из сырых данных Валидация
    и загрузка Champion-модели Автоматический запрос к Model Registry (MLflow/ClearML)
    для получения актуальной модели с тегом production. Проверка целостности артефактов
    модели перед запуском инференса Batch-скоринг Запуск контейнера со всеми зависимостями
    модель. Параллельный расчет предсказаний для терабайтных датасетов Доставка и
    мониторинг качества (Data Drift) Запись предсказаний в целевую систему - в СУБД
    для бэкенда, в Redis для кэша или аналитическое DWH. Запуск тестов на изменение
    распределения входящих данных (Data Drift) и выходов модели (Prediction Drift)
