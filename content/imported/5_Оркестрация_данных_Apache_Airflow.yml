- kind: section
  title: Основные концепции Airflow
  notes: ''
  bullets:
  - '10'
- kind: content
  title: Что такое DAG?
  notes: ''
  bullets:
  - Directed (Направленный) У задач есть строгая последовательность. Ток идет только
    в одну сторону (например, нельзя запустить скоринг, пока не скачались данные).
    Acyclic (Ациклический) В графе запрещены петли и зацикливания. Шаг «Б» не может
    вернуть управление шагу «А». Если пайплайну нужно запустить что-то заново, Airflow
    создаст новый запуск всего графа, но внутри самого кода петли быть не может. Graph
    (Граф) Набор вершин (в Airflow это наши задачи/таски) и ребер (это связи/зависимости
    между ними).
  image: '(pptx: 1 изображени(й) на слайде)'
- kind: content
  title: 'Архитектура Airflow: Кто за что отвечает?'
  notes: ''
  bullets:
  - Scheduler (Планировщик) Постоянно парсит папку с DAG-ами. Следит за расписанием
    и зависимостями тасок. Если условия выполнены, отправляет задачу на исполнение
    Webserver (Интерфейс) UI для пользователя. Показывает граф, логи, позволяет вручную
    запускать (триггерить) или очищать (clear) таски. Не запускает код пайплайнов
    Metadata Database (База метаданных) Сердце системы (обычно PostgreSQL). Хранит
    статусы тасок, учетные записи пользователей, переменные и историю запусков Executor
    (Исполнитель) Механизм распределения работы. Определяет, как будут запускаться
    задачи (Sequential - по очереди локально, Local - в разных потоках, Celery / Kubernetes
    - на удаленных воркерах) Workers (Воркеры) Непосредственные исполнители (процессы
    или поды), которые забирают таску, выполняют прописанный в ней Python/Bash-код
    и возвращают статус.
  image: '(pptx: 1 изображени(й) на слайде)'
- kind: content
  title: Анатомия простейшего DAG. Пример кода на Python.
  notes: ''
  bullets:
  - Декоратор @dag Задает уникальный dag_id, дату старта (start_date), расписание
    (schedule) и поведение при первом запуске (catchup) Декоратор @task Превращает
    обычную Python-функцию в изолированную задачу Airflow Поток данных (Data Flow)
    Прямая передача аргументов save_predictions(predictions) автоматически выстраивает
    стрелку зависимости между тасками в интерфейсе.
  code: "# В Airflow 3.x+ ВСЕ авторы DAG используют только этот публичный неймспейс\n\
    from datetime import datetime\nfrom airflow.sdk import dag, task # Раньше было:\
    \ from airflow.decorators import \n\v@dag(\n\tdag_id=\"modern_ml_inference_v3\"\
    ,\n\tstart_date=datetime(2026, 7, 1),\n\tschedule=\"@daily\", # Раньше дефолтом\
    \ был 1 день, теперь None\n\tcatchup=False,\n\ttags=[\"mlops\", \"airflow3\"]\n\
    )\ndef ml_pipeline():\n\v\t@task\n\tdef fetch_data():\n\t\t# В Airflow 3.x XCom-данные\
    \ автоматически сериализуются через API\n\t\treturn {\"user_id\": [101, 102],\
    \ \"score\": [0.95, 0.42]}\n\v\t@task\n\tdef save_predictions(data: dict):\n\t\
    \tprint(f\"Airflow 3 Task SDK пишет логи: {data}\")\n\v\t# Поток данных (Data\
    \ Flow) через Taskflow API\n\tpredictions = fetch_data()\n\tsave_predictions(predictions)\n\
    \v# Инициализация DAG\nml_pipeline()"
- kind: content
  title: 'Tasks vs Operators: В чем разница?'
  notes: ''
  bullets:
  - 'Operator (Оператор) - это строительный блок Это готовый Python-класс (шаблон),
    который определяет логику выполнения Пример: BashOperator знает, как выполнить
    bash-команду. DockerOperator знает, как поднять контейнер. Оператор существует
    сам по себе в библиотеках провайдеров, он абстрактен Task (Задача / Таска) - это
    кирпич вашего DAG Это конкретный экземпляр (инстанс) оператора, встроенный в ваш
    граф. У таски всегда есть уникальный task_id, расписание, зависимости от других
    тасок и конкретный контекст исполнения Как это работает в Airflow 3.x (Taskflow
    API)? Когда мы пишем декоратор @task над функцией, Airflow под капотом автоматически
    создает кастомный оператор, а при вызове функции внутри DAG - превращает его в
    Task. Формула: Operator + Контекст DAG + task_id = Task.'
  image: '(pptx: 1 изображени(й) на слайде)'
- kind: content
  title: 'Базовые операторы: BashOperator и PythonOperator'
  notes: ''
  bullets:
  - BashOperator, и PythonOperator выполняют свой код непосредственно на самом воркере
    Airflow, деля с ним общую оперативную память и процессор. Если вы попробуете внутри
    @task запустить обучение тяжелого трансформера или обработку датасета на 100 гигабайт
    в Pandas, вы просто убьете воркер по ошибке Out-of-Memory (OOM)
  code: "# --- BashOperator ---\nfrom airflow.providers.standard.operators.bash import\
    \ BashOperator\n\vrun_script = BashOperator(\n\ttask_id=\"run_dvc_repro\",\n\t\
    bash_command=\"dvc repro artifacts/dvc.yaml\",\n\tenv={\"ENV\": \"PROD\"}\n)\n\
    \n# --- PythonOperator (@task) ---\nfrom airflow.sdk import task\n\v@task(task_id=\"\
    validate_metrics\")\ndef check_metrics(metrics: dict):\n\tif metrics[\"rmse\"\
    ] > 0.5:\n\t\traise ValueError(\"Model degraded!\")\n\treturn \"Metrics OK\""
- kind: content
  title: 'Связи между тасками: Строим граф'
  notes: ''
  bullets:
  - Неявное управление (Implicit via Taskflow API) Стандарт для современного Airflow
    3.x+. Связи выстраиваются автоматически на основе передачи аргументов между функциями
    с декоратором @task.
  - Явное управление (Explicit Dependencies) Используется для операторов (например,
    BashOperator), которые не обмениваются данными напрямую через Python-код. Побитовый
    сдвиг (>> и <<) Стрелка указывает направление потока управления task_A >> task_B
    (А запускает Б) task_B << task_A (Б зависит от А - ухудшает читаемость) task_A.set_downstream(task_B)
    и task_B.set_upstream(task_A) Полные аналоги оператора >>, но используются редко
    из-за громоздкости
  code: "# Способ 1: Явный (через оператор >>)\ndownload_data >> preprocess_data >>\
    \ run_inference\n\v# Способ 2: Неявный (Taskflow API автоматически построит тот\
    \ же граф)\ndata = download_data()\nprocessed_data = preprocess_data(data)\nrun_inference(processed_data)"
- kind: content
  title: Жизненный цикл задачи (Task Lifecycle)
  notes: ''
  bullets:
  - 'Начальные статусы (Планирование) Scheduled: Планировщик определил, что время
    пришло и зависимости таски выполнены Queued: Задача отправлена в очередь исполнителю
    (Executor). Она ждет свободного воркера Активный рантайм Running: Воркер забрал
    задачу и выполняет код (например, считает скоринг) Финальные статусы: 🟢 Success:
    Код отработал без ошибок (вернул exit code 0 или успешно завершил функцию) 🔴 Failed:
    В процессе выполнения упал Exception или закончилась память (OOM) 🟡 Up for Retry:
    Задача упала, но у нее настроены повторные попытки. Она ждет паузы перед возвратом
    в очередь 🟣 Skipped: Задача намеренно пропущена (например, сработало ветвление
    BranchPythonOperator или условие “выходной день”)'
- kind: content
  title: Как работает планировщик (Scheduling)
  notes: ''
  bullets:
  - 'start_date Точка в координатах времени, начиная с которой Airflow берет ваш DAG
    под управление. Правило: Всегда используйте фиксированную дату (например, datetime(2026,
    7, 1)), никогда не ставьте datetime.now() schedule (ранее schedule_interval) Как
    часто запускать пайплайн. Cron-выражения: 30 2 * * * (Каждый день в 02:30) Макросы-ярлыки:
    @daily (Раз в сутки), @hourly (Раз в час), @weekly (Раз в неделю) catchup (Нагон
    прошлого) Булево значение (True/False). Определяет поведение Airflow, если start_date
    находится в прошлом'
  - 'Разница поведения Catchup catchup=True: Airflow увидит “дыру” в истории между
    start_date и сегодняшним днем и начнет последовательно запускать пайплайн за каждый
    пропущенный день из прошлого catchup=False: Airflow просто зафиксирует прошлые
    даты как выполненные и сделает первый реальный запуск только за текущий период.'
- kind: content
  title: 'Проблема Инкрементальности: Логическая дата в Airflow 3.x'
  notes: ''
  bullets:
  - 'Мгновенный первый запуск: На первом таймлайне видно, что DAG RUN 1 стартует ровно
    1 января 2025 года в 00:00 (в день, указанный в start_date). В Airflow 2.x этот
    запуск произошел бы только на следующий день Схлопывание интервалов: На втором
    таймлайне четко показано, что data_interval_start и data_interval_end теперь равны
    по умолчанию и находятся в начальной точке запуска. Старый сдвиг конца интервала
    на следующие сутки зачеркнут красным крестом Переход на logical_date: На третьем
    таймлайне Марк дает прямой совет: “Better to refer to the logical_date instead”
    (Вместо интервалов лучше использовать единый параметр logical_date) Опциональность
    параметров: В самом верху схемы указан еще один инсайд Airflow 3.x - параметры
    start_date и schedule теперь стали необязательными (Optional). DAG можно создавать
    чисто под триггеры от событий или под Data-driven пайплайны (Event-driven).'
  code: "# Паттерн инференса в Airflow 3.x (Стандартный Cron-режим)\n@task\ndef run_batch_scoring(logical_date:\
    \ datetime):\n\tstart_time = logical_date - timedelta(days=1) # Окно данных: вчера\n\
    \tend_time = logical_date # Окно данных: сегодня"
  image: '(pptx: 1 изображени(й) на слайде)'
- kind: content
  title: Обмен данными через XCom (Cross-Communication)
  notes: ''
  bullets:
  - 'XCom (Cross-Communication) это встроенный в Airflow механизм, позволяющий задачам
    обмениваться сообщениями В Airflow 3.x+ при использовании Taskflow API (декоратор
    @task) операторы return и передача аргументов автоматически работают через XCom
    под капотом Жесткие ограничения по объему данных (Трейд-оффы) Данные XCom физически
    сохраняются в базу метаданных Airflow. Максимальный размер одного XCom-сообщения
    зависит от вашей СУБД: PostgreSQL: 1 ГБ (bytea) MySQL: 16 МБ (LONGBLOB) На практике:
    Попытка записать в XCom тяжелый DataFrame на сотни мегабайт переполнит память,
    затормозит и “уронит” общую базу данных оркестратора Правильное решение В XCom
    передаются только ссылки на данные (путь к S3-бакету, ID строки в БД, имя Docker-образа,
    URI модели в MLflow). Сами данные передаются напрямую между хранилищами, минуя
    Airflow.'
  code: "@task\ndef sender(**context):\n\tti = context[\"task_instance\"]\n\tti.xcom_push(key=\"\
    model_metric\", value=0.95)\n\v# Явный PULL во второй таске\n@task\ndef receiver(**context):\n\
    \tti = context[\"task_instance\"]\n\tmetric = ti.xcom_pull(task_ids=\"sender\"\
    , \t\t\tkey=\"model_metric\")\n\n@task(multiple_outputs=True)\ndef get_metrics()\
    \ -> dict:\n\treturn {\"accuracy\": 0.92, \"loss\": 0.15} \v\t# Сохранится как\
    \ два раздельных XCom\n\v@task\ndef check_loss(loss_val: float):\n\tprint(f\"\
    Проверяем только лосс: {loss_val}\")\n\v# Airflow сам вытащит из XCom только ключ\
    \ 'loss'\ncheck_loss(get_metrics()[\"loss\"])\n\n@task(do_xcom_push=False)\ndef\
    \ heavy_logging_task():\nresult = \"Огромный текст лога обучения на 50 мегабайт...\"\
    \nreturn result # Ничего НЕ запишется в базу данных Airflow!"
- kind: section
  title: Airflow для MLOps и Продвинутые фичи
  notes: ''
  bullets:
