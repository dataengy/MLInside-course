# preza-dagster-simple-content.yml — WHAT-файл УПРОЩЁННОЙ деки «Оркестрация ML-пайплайнов
# на Dagster». Альтернатива основной лекции content/preza-dagster-v2-content.yml, не её
# замена. Рендерится теми же настройками (content/build_deck_v3-settings.yml или
# .tmp/dagster_v2_build_settings.yml для черновиков — тот пишет в .tmp/build).
#
# v1.0.0 — 2026-09-04 — первая версия.
#          Чем отличается от v2.2.0 (113 слайдов, три живых демо, MLflow, ML lifecycle):
#          · 50 слайдов вместо 113, приложения нет: всё, что нужно, — в основной линии.
#          · Код почти на каждом слайде — 19 панелей Python, 3 bash, 2 YAML — и каждая
#            панель с построчными комментариями: объясняется смысл строки, а не синтаксис.
#          · Схем 13, все ASCII в код-панели (code_lang: diagram). К каждой схеме в
#            подстрочнике лежит блок «Промпт для генерации схемы» — самодостаточный текст
#            для Claude/ChatGPT, если схему захочется нарисовать картинкой.
#          · URL-ы для подбора картинок — только в подстрочнике («Визуальные опоры»),
#            на слайде их нет: подвал-ссылки (materials) не заполняются намеренно —
#            оформление у целевой презентации своё.
#          · Сравнение — только Airflow 3 + Cosmos против Dagster + dagster-dbt.
#            Колонка Airflow 2.x, эволюция 2→3, Prefect/Kestra/Argo/Kedro — выкинуты.
#          · MLflow — одно упоминание внутри слайда «Обучение, MLflow и продакшен: коротко».
#            Интеграции, три демо, четыре паттерна переобучения, четыре референс-архитектуры,
#            детали ML lifecycle — намеренно нет; про обучение и продакшен — два слайда.
#          · В content/presentations.yml дека НЕ заведена: это альтернативный черновик под
#            ручную вставку в целевую презентацию, публиковать его не надо.
#
# Структура: 50 слайдов, ~61 мин по меткам [~N мин] (эвристика курса — 1.3 мин/слайд).
#   PART 0  001–002  титул, план
#   PART 1  003–006  зачем: три системы без графа → control plane → ассет → ассет vs задача
#   PART 2  007–016  Quick Start кодом: проект, структура, семь шагов
#   PART 3  017–027  Dagster + dbt: тезис, пять уровней, level 0 → level 3
#   PART 4  028–034  расписания, сенсоры, declarative automation, ресурсы, тесты, деплой
#   PART 5  035–036  обучение, MLflow и продакшен — коротко
#   PART 6  037–045  Airflow 3 + Cosmos против Dagster + dagster-dbt
#   PART 7  046–047  когда Dagster нужен и когда нет, итоговая модель
#   PART 8  048–050  ДЗ, критерии, финал
#
# Код: Dagster 1.13.x (`import dagster as dg`, dg CLI, компоненты), dagster-dbt, Airflow 3.x
# (`airflow.sdk`), astronomer-cosmos 1.x. Airflow и Cosmos меняются быстро — перед показом
# сверить с документацией по ссылкам из «Визуальных опор».
#
# Подстрочники: метка [~N мин] в начале; абсолютные часы «10:00–11:30» ставит сборка
# (preza_gen/notes.py) или `just preza-notes apply`, руками их не писать.

