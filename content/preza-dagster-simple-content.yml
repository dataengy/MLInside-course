- kind: content
  id: 039-airflow-3-asset-i-planirovanie-po-assetam
  title: 'Airflow 3: @asset и планирование по ассетам'
  bullets:
  - 'airflow.sdk: ассет стал первоклассной сущностью авторинга'
  - '@asset создаёт ассет, DAG и задачу внутри него — сразу три вещи'
  - Downstream запускается по обновлению ассета, а не по времени
  - 'Классический DAG тоже умеет: schedule по ассету, outlets у задачи'
  code_lang: python
  code: |2
    # Airflow 3: ассет — сущность airflow.sdk
    from airflow.sdk import Asset, asset, dag, task

    # @asset = ассет + DAG + задача внутри него
    @asset(schedule="@daily",
           uri="duckdb://wh/feature_table")
    def feature_table(): ...

    # запуск — по обновлению ассета выше;
    # аргумент с тем же именем = инлет
    @asset(schedule=feature_table)
    def training_dataset(feature_table): ...

    # классический DAG тоже умеет ассеты
    @dag(schedule=[Asset(name="training_dataset")])
    def train_model():
        # задача ОБНОВЛЯЕТ ассет → событие
        @task(outlets=[Asset(name="trained_model")])
        def fit(): ...
        fit()
    train_model()
  notes: |2
    [46:06–47:36 · ~1.5 мин] **Главное:**
    - !!В Airflow 3 ассеты есть и работают; но декоратор — сокращение поверх DAG и задачи, а не самостоятельная единица.!!

    **Рассказ:**
    - `airflow.sdk` — новое пространство имён Airflow 3: DAG, task, asset; задачи больше не ходят в базу метаданных напрямую (Task SDK, Task Execution API).
    - Первый `@asset`: одна функция — и Airflow создаёт ассет, DAG с таким же именем и задачу в нём.
    - В интерфейсе видно все три.
    - Второй: `schedule=feature_table` — запуск по обновлению ассета выше; аргумент с тем же именем — инлет.
    - Нижняя половина — классический стиль: DAG планируется по списку ассетов, задача объявляет `outlets` — «я обновляю этот ассет».
    - Есть операторы `&` и `|` для комбинаций ассетов в расписании и партиционированные ассеты с мапперами — это свежие возможности 3.x.

    **Что важно не перепутать:**
    - `@asset` Airflow и `@dg.asset` Dagster — **разные вещи**: в Airflow за ассетом стоит DAG и задача, у них свой статус; в Dagster ассет — единица сама по себе.

    **Осторожно:**
    - Airflow выпускает минорные версии каждые несколько месяцев; перед показом сверить сигнатуры с документацией по ссылке.

    **Takeaway:**
    - !!Airflow 3 закрыл вопрос «есть ли ассеты»; открыт вопрос «что в центре платформы».!!

    **Переход:**
    - ~~«Разложим по критериям — две таблицы».~~

    **Визуальные опоры:**

    1. https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/assets.html
       Что взять: канонические примеры @asset и schedule по ассету — сверить с нашими.

    2. https://airflow.apache.org/docs/task-sdk/stable/index.html
       Что взять: список того, что импортируется из airflow.sdk.

    3. https://airflow.apache.org/blog/airflow-three-point-oh-is-here/
       Что взять: обзор изменений Airflow 3 — Task SDK, ассеты, бэкфиллы в планировщике.
