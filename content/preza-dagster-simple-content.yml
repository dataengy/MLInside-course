# ── PART 1 · Зачем ───────────────────────────────────────────────────────────────────────
- kind: content
  id: 003-odin-den-mle-tri-sistemy
  title: 'Один день MLE: три системы, ноль общего графа'
  bullets:
  - 'dbt-проект: витрины и признаки, запускается в CI'
  - 'Ноутбук или скрипт: сборка обучающей выборки'
  - 'cron или DAG: обучение и батч-инференс'
  - Вопрос «поменялась колонка — что пересчитать?» ответа не имеет
  code_lang: diagram
  code: |2
     dbt CI          ноутбук           cron
     ──────          ───────           ────
     staging   ?     features    ?     train
     marts           dataset           predict

     ? — связь есть только в голове дежурного
  notes: |2
    [01:24–02:36 · ~1.2 мин] **Главное:**
    - Проблема не в том, что нет планировщика, а в том, что !!никто не знает зависимостей между артефактами!!.

    **Рассказ:**
    - Знакомая картина: dbt гоняется в CI по пушу, признаки собирает скрипт, обучение висит в cron.
    - Каждая система по отдельности работает; ломается на стыке.
    - Симптом один: аналитик поменял колонку в staging-модели — и никто не может сказать, надо ли переобучать модель.
    - Симптом два: «перезапустим всё» — ночью полный пересчёт, потому что это дешевле, чем разбираться.
    - Симптом три: витрина не обновилась, а обучение стартовало и обучилось на вчерашнем.

    **Что важно не перепутать:**
    - Это не претензия к dbt и не к cron: **каждый инструмент делает своё правильно**; нет слоя, который знал бы про все три сразу.

    **Takeaway:**
    - !!Знаки вопроса на схеме — это и есть предмет лекции.!!

    **Переход:**
    - ~~«Dagster устроен так, чтобы этот граф был записан явно. Где он стоит — на следующем слайде».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets
       Что взять: формулировку «assets are the objects your pipelines produce» — ровно про то, чего не хватает на схеме.

    2. https://docs.getdbt.com/docs/build/documentation
       Что взять: скриншот dbt-графа, который заканчивается на витринах, — стрелок дальше нет.

    **Промпт для генерации схемы:**
    - Нарисуй плоскую техническую схему 16:9 без 3D и теней.
    - Три колонки-системы в ряд: «dbt CI» (внутри два узла: staging, marts), «ноутбук» (узлы: features, dataset), «cron» (узлы: train, predict).
    - Между колонками — крупные знаки вопроса, визуально тяжелее подписей систем.
    - Внизу одной строкой подпись: «связь есть только в голове дежурного».
    - Стиль: монохром с одним акцентным цветом для знаков вопроса, подписи на русском, без логотипов.
- kind: content
  id: 004-gde-stoit-dagster-control-plane
  title: 'Где стоит Dagster: control plane над вашим стеком'
  bullets:
  - 'Формула: orchestration + asset graph + observability'
  - Dagster не считает сам — он знает, что и когда пересчитать
  - Вычисления остаются в dbt, sklearn, Spark, Kubernetes
  - Он связывает жизненный цикл артефактов, а не подменяет системы
  code_lang: diagram
  code: |2
     dbt   Spark   sklearn   MLflow   K8s
      │      │        │        │       │
      └──────┴────────┼────────┴───────┘
                      │
                 D A G S T E R
                 control plane

     что существует · из чего получено
     когда пересчитать · что проверить
  notes: |2
    [02:36–03:48 · ~1.2 мин] **Главное:**
    - Dagster — !!control plane!!: слой, который знает про все артефакты и их связи, но сам тяжёлую работу не делает.

    **Рассказ:**
    - Произнести формулу: **orchestration** — что и когда запустить; **asset graph** — что существует и из чего получается; **observability** — что материализовано, когда и каким кодом.
    - Все три части описывают одни и те же объекты; центр формулы — граф ассетов, остальное из него вытекает.
    - Пройти по схеме: dbt считает SQL, sklearn обучает, Spark и Kubernetes дают ресурсы, MLflow помнит эксперименты.
    - Dagster стоит под ними и отвечает на четыре вопроса из нижней строки.

    **Что важно не перепутать:**
    - Dagster **не заменяет** ни одну из систем сверху; если вы ждёте, что он «выполнит обучение», — он лишь запустит ваш код там, где вы скажете.

    **Takeaway:**
    - !!Одна формула на всю лекцию: оркестрация, граф ассетов, наблюдаемость.!!

    **Переход:**
    - ~~«Слово, которое стоит запомнить, ровно одно — ассет. Смотрим, как оно выглядит в коде».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/getting-started/concepts
       Что взять: официальную страницу концепций — там же формула из трёх частей.

    2. https://dagster.io/blog/software-defined-assets
       Что взять: исходный пост про Software-Defined Assets как «control plane для данных».

    **Промпт для генерации схемы:**
    - Плоская техническая схема 16:9.
    - Сверху в ряд пять прямоугольников с подписями: dbt, Spark, sklearn, MLflow, Kubernetes.
    - От каждого вниз линия, все линии сходятся в один широкий прямоугольник внизу с подписью «DAGSTER — control plane».
    - Под ним четыре короткие подписи в две строки: «что существует · из чего получено», «когда пересчитать · что проверить».
    - Нижний блок — единственный цветной, верхние — серые контуры.
    - Без иконок и логотипов, текст на русском.
- kind: content
  id: 005-software-defined-asset-v-kode
  title: 'Software-Defined Asset: код описывает, что должно существовать'
  bullets:
  - 'Ассет — объект, который должен существовать: таблица, файл, модель'
  - Декоратор превращает функцию в описание объекта
  - Зависимость выводится из сигнатуры — стрелки руками не рисуются
  - 'Материализация — акт приведения ассета к описанию'
  code_lang: python
  code: |2
    import dagster as dg   # весь API — под dg

    # ассет = объект, который ДОЛЖЕН существовать
    @dg.asset
    def training_dataset(
        feature_mart,   # ← ассет выше по графу:
    ):                  # ребро — из сигнатуры
        """Обучающая выборка без пропусков."""
        # вернули объект → ассет материализован
        return feature_mart.dropna()
  notes: |2
    [03:48–05:06 · ~1.3 мин] **Главное:**
    - !!Код описывает не «что запустить», а «что должно существовать и из чего».!!

    **Рассказ:**
    - Пройти по строкам: импорт один — `dg`, и весь API живёт под ним.
    - Декоратор: функция становится описанием объекта с именем `training_dataset`.
    - Аргумент `feature_mart` — это не параметр в обычном смысле: это имя другого ассета, и Dagster по нему **сам** строит ребро графа.
    - Тело — обычный Python; никакого API Dagster внутри.
    - `return` — вернули значение, и Dagster записал материализацию: «ассет существует, вот когда и из чего».

    **Что важно не перепутать:**
    - Ассет — **не задача**.
    - Задача заканчивается статусом «успех/падение»; ассет остаётся объектом с историей материализаций.

    **Takeaway:**
    - !!Один декоратор, один аргумент — и граф уже нарисован.!!

    **Переход:**
    - ~~«Разложим отличие ассета от задачи по вопросам — таблица».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/defining-assets
       Что взять: канонический пример `@dg.asset` — можно показать рядом с нашим.

    2. https://dagster.io/blog/software-defined-assets
       Что взять: картинку «asset graph vs task graph» из поста.
- kind: table
  id: 006-asset-protiv-zadachi
  title: Ассет против задачи
  table:
    headers: ['Вопрос', 'Task-centric', 'Asset-centric']
    rows:
    - ['Что описывает код', 'Шаг, который надо выполнить', 'Объект, который должен существовать']
    - ['Единица графа', 'Задача', 'Ассет: таблица, датасет, модель']
    - ['Откуда зависимости', 'Заданы руками между задачами', 'Выведены из аргументов функции']
    - ['«Что пересчитать?»', 'Отвечает дежурный', 'Отвечает граф']
    - ['История запусков', 'Успех или падение задачи', 'Материализации ассета с метаданными']
    - ['Свежесть данных', 'Внешний мониторинг', 'Asset checks и freshness прямо в графе']
    - ['Частичный пересчёт', 'Отдельный запуск', 'Селекция по графу: features+']
    - ['dbt-модель в графе', 'Одна задача dbt build', 'Каждая модель — отдельный ассет']
    col_ratios: [3, 4, 4]
  notes: |2
    [05:06–06:24 · ~1.3 мин] **Главное:**
    - !!Все строки таблицы — про одно: единица графа — объект, а не шаг.!!

    **Рассказ:**
    - Не читать подряд, выбрать три строки.
    - «Что пересчитать»: слева отвечает дежурный, справа — граф; это и есть ответ на знаки вопроса с первого слайда.
    - «Свежесть»: справа проверка — сущность рядом с ассетом, а не внешний мониторинг.
    - «dbt-модель»: слева весь проект — одна задача; справа каждая модель — узел.
    - К этому вернёмся в блоке dbt.

    **Что важно не перепутать:**
    - Task-centric — **не значит устаревший**: для бизнес-процессов без устойчивых артефактов это правильная модель.
    - Разговор про Airflow 3 будет отдельно.

    **Takeaway:**
    - !!Если утром вы спрашиваете «какой объект несвежий», а не «какая задача упала», — вам сюда.!!

    **Переход:**
    - ~~«Хватит теории. Поднимаем Dagster и пишем первый граф».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets
       Что взять: правую колонку в терминах документации.

    2. https://docs.dagster.io/guides/build/ops
       Что взять: левую колонку — как Dagster сам описывает ops/jobs для случаев без артефакта.
# ── PART 2 · Quick Start ─────────────────────────────────────────────────────────────────
- kind: section
  id: 007-quick-start
  title: 'Quick Start: от нуля до графа за 10 минут'
  notes: |2
    [06:24–06:42 · ~0.3 мин] **Рассказ:**
    - Десять слайдов, семь шагов, каждый шаг — панель кода, которую можно повторить у себя.
    - Ничего разворачивать не нужно: ни базы, ни кластера, ни Docker.
- kind: content
  id: 008-shag-0-proekt-i-interfejs
  title: 'Шаг 0: создать проект и поднять интерфейс'
  bullets:
  - Одна команда создаёт проект, вторая поднимает интерфейс
  - Ставится в собственное виртуальное окружение проекта
  - 'dg — современный CLI: создание, проверка, запуск'
  - Ничего разворачивать не нужно — ни базы, ни кластера
  code_lang: bash
  code: |2
    # 1. каркас: pyproject.toml, defs/, .venv
    uvx create-dagster@latest project ml-platform
    cd ml-platform && source .venv/bin/activate

    # 2. UI + демон в одном процессе, без базы
    dg dev              # → http://localhost:3000

    # 3. полезно с первого дня
    dg list defs    # что Dagster видит в проекте
    dg check defs   # проверка определений без UI
  notes: |2
    [06:42–07:54 · ~1.2 мин] **Главное:**
    - !!От пустой папки до интерфейса — две команды и ноль инфраструктуры.!!

    **Рассказ:**
    - `create-dagster` через `uvx` — ставить глобально ничего не надо; проект получает своё окружение.
    - `dg dev` поднимает веб-сервер и демон в одном процессе; состояние — SQLite в папке проекта.
    - Две команды из третьего блока стоит запомнить сразу: `dg list defs` показывает, что Dagster «видит», `dg check defs` ловит ошибки определений без запуска интерфейса — годится для CI.

    **Что важно не перепутать:**
    - `dg` — CLI **разработки**; классический `dagster` остаётся для эксплуатации (миграции инстанса, бэкфиллы).
    - Оба живут рядом.

    **Takeaway:**
    - !!dg dev — весь Dagster на ноутбуке.!!

    **Переход:**
