    - ['Важны происхождение и метаданные', 'В процессе почти нет устойчивых артефактов']
    - ['Много инкрементальных и партиционированных данных', 'Нагрузка в основном Kubernetes-native исполнение']
    - ['Контур новый, писать с нуля', 'Пайплайн маленький, хватает cron или CI']
    - ['Команда понимает модель ассетов', 'Команда не получает ценности от семантики ассетов']
    col_ratios: [5, 5]
  notes: |2
    [55:18–56:36 · ~1.3 мин] **Главное:**
    - !!Правая колонка — не оговорка: есть нагрузки, где Dagster проигрывает, и это надо сказать вслух.!!

    **Рассказ:**
    - Левая колонка — портрет слушателя этой лекции: dbt, данные и ML одним циклом, важно происхождение.
    - Правая — три типовых случая «не надо»: большой Airflow без боли, бизнес-процессы без артефактов, маленький пайплайн на cron.
    - Последняя строка — про людей: если команда не видит ценности в «что существует и из чего», модель ассетов останется лишним слоем.

    **Что важно не перепутать:**
    - «Маленький пайплайн» — это **не** «пять ассетов»; это «нет вопросов про свежесть и пересчёт».
    - Пять ассетов с такими вопросами — уже повод.

    **Takeaway:**
    - !!Если утренний вопрос — «какой объект несвежий», левая колонка; если «какая задача упала» — правая.!!

    **Переход:**
