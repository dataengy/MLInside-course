    - !!Правите одну папку — defs/; всё остальное — каркас.!!

    **Рассказ:**
    - `pyproject.toml` с секцией `[tool.dg]` — признак, что это проект Dagster; так `dg` находит его.
    - `definitions.py` загружает всё из `defs/` — ассеты, проверки, расписания, ресурсы.
