     ml-platform/
     ├── pyproject.toml      # [tool.dg]: проект
     ├── uv.lock
     ├── src/ml_platform/
     │   ├── definitions.py  # вход: собирает defs/
     │   └── defs/           # ← сюда кладём ассеты
