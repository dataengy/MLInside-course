    - Нижняя строка — шесть слов, которых хватает, чтобы читать любой проект на Dagster.

    **Что важно не перепутать:**
    - Ментальная модель — **не архитектура**: в проде за словом «Dagster» стоят четыре сервиса со схемы про деплой.

    **Takeaway:**
