- kind: content
  id: 010-shag-1-pervyj-asset
  title: 'Шаг 1: первый ассет'
  bullets:
  - Один файл в defs/, один декоратор
  - Тело функции — обычный Python без API Dagster
  - 'Группа, вид вычисления, описание — метаданные узла в UI'
  - Появляется в интерфейсе после Reload, перезапуск не нужен
  code_lang: python
  code: |2
    # src/ml_platform/defs/ml.py
    import dagster as dg
    import pandas as pd

    @dg.asset(
        group_name="features",  # папка в UI
        compute_kind="pandas",  # бейдж: чем считаем
        description="Витрина признаков",
    )
    def feature_table() -> pd.DataFrame:
        # тело — обычный Python, без API Dagster
        return pd.read_parquet("features.parquet")
  notes: |2
    [08:54–10:06 · ~1.2 мин] **Главное:**
    - !!Ассет без зависимостей — это функция без аргументов с декоратором.!!

    **Рассказ:**
    - Файл кладём в `defs/`; имя файла роли не играет.
    - Три параметра декоратора — про интерфейс, а не про исполнение: группа собирает узлы в папку, `compute_kind` рисует бейдж, описание видно на карточке.
    - Тело — читаем parquet; Dagster внутри не упоминается, поэтому функцию можно вызвать в тесте как обычную.
    - После сохранения — кнопка Reload в интерфейсе; узел появляется в графе как «никогда не материализованный».

    **Что важно не перепутать:**
    - `group_name` — **не** зависимость и **не** расписание; это только организация экрана.

    **Takeaway:**
    - !!Декоратор — единственное, что отличает ассет от функции.!!

    **Переход:**
    - ~~«Второй ассет зависит от первого. Смотрим, как это записывается».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/defining-assets
       Что взять: канонический пример и таблицу параметров декоратора.

    2. https://docs.dagster.io/guides/build/assets/metadata-and-tags
       Что взять: скриншот карточки ассета с описанием и бейджем compute_kind.
- kind: content
  id: 011-shag-2-zavisimost-argument-funkcii
  title: 'Шаг 2: зависимость — это аргумент функции'
  bullets:
  - Имя аргумента равно имени ассета выше — это и есть ребро
  - Значение приезжает готовым объектом
  - 'Объект передавать не нужно — зависимость через deps'
  - Проверить связность можно, не запуская ничего
  code_lang: python
  code: |2
    @dg.asset(group_name="features")
    def training_dataset(
        feature_table: pd.DataFrame, # ассет выше
    ) -> pd.DataFrame:  # аргумент = ребро графа
        # значение приехало готовым объектом
        df = feature_table.dropna()
        return df[df.split == "train"]

    # объект не нужен (таблица живёт в складе) →
    # зависимость ключом, без аргумента:
    @dg.asset(deps=[feature_table])  # ребро есть,
    def feature_stats():             # значения нет
        ...   # читаем таблицу сами, из склада
  notes: |2
    [10:06–11:36 · ~1.5 мин] **Главное:**
    - !!Два способа объявить ребро: аргумент — когда нужен объект, deps — когда нужен только порядок.!!

    **Рассказ:**
    - Верхняя половина: аргумент `feature_table` совпадает с именем ассета — Dagster сам подставит результат последней материализации.
    - Как он его передаёт — через IO manager; по умолчанию это pickle на диске, в проде — S3 или склад.
    - Код ассета про это не знает.
    - Нижняя половина: `deps=[...]` — ребро есть, значение не передаётся.
    - Так подключают dbt-модели и таблицы склада: они лежат в базе, тащить их через Python бессмысленно.
    - Ребро видно в графе сразу, до первого запуска.

    **Что важно не перепутать:**
    - Ребро **не запускает** пересчёт само по себе; оно лишь описывает порядок и даёт графу знать, что устарело.

    **Takeaway:**
    - !!Стрелки нигде не рисуются — они выводятся из кода.!!

    **Переход:**
    - ~~«Третий ассет — модель. И ничего специально ML-ного в описании нет».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/passing-data-between-assets
       Что взять: разницу между аргументом и deps — прямо по документации.

    2. https://docs.dagster.io/guides/build/io-managers
       Что взять: одну картинку про IO manager — «кто физически носит объект».
- kind: content
  id: 012-shag-3-model-takoj-zhe-asset-plyus-metadannye
  title: 'Шаг 3: модель — такой же ассет, плюс метаданные'
  bullets:
  - Модель описывается тем же декоратором, что и таблица
  - 'MaterializeResult — «ассет готов» плюс метаданные'
  - Числовые метаданные ложатся на график по времени в UI
  - Где физически лежит модель — решаете вы
  code_lang: python
  code: |2
    @dg.asset(group_name="ml",
              compute_kind="sklearn")
    def trained_model(
        training_dataset: pd.DataFrame,
    ) -> dg.MaterializeResult:
        X = training_dataset.drop(columns="target")
        y = training_dataset["target"]
        clf = LogisticRegression().fit(X, y)
        proba = clf.predict_proba(X)[:, 1]
        roc = roc_auc_score(y, proba)
        # где лежит модель — решаем сами
        joblib.dump(clf, "models/clf.joblib")
        # «ассет готов» + метаданные; числа
        # ложатся на график по времени в UI
        return dg.MaterializeResult(metadata={
            "roc_auc": round(float(roc), 4),
            "rows": len(training_dataset),
            "features": len(X.columns),
        })
  notes: |2
    [11:36–13:06 · ~1.5 мин] **Главное:**
    - !!Модель — такой же ассет; метаданные — то, за что вы будете любить интерфейс.!!

    **Рассказ:**
    - Верх функции — обычный sklearn.
    - Сохранение модели — сами: joblib на диск, в проде — S3 или реестр; Dagster не навязывает хранилище.
    - `MaterializeResult` вместо `return clf`: говорим «ассет готов» и прикладываем метаданные.
    - `roc_auc` и `rows` — числа, и интерфейс построит по ним график по материализациям: видно, как метрика менялась от запуска к запуску.

    **Что важно не перепутать:**
    - Метаданные — **не трекинг экспериментов**; для этого есть MLflow, и Dagster хранит на него ссылку.
    - Об этом — один слайд ближе к концу.

    **Takeaway:**
    - !!Три ассета — и это уже мини-пайплайн с историей.!!

    **Переход:**
    - ~~«Пора запустить. Шаг 4 — материализация».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/metadata-and-tags
       Что взять: скриншот графика метаданных по времени — главный визуал слайда.

    2. https://docs.dagster.io/api/dagster/assets#dagster.MaterializeResult
       Что взять: описание MaterializeResult — что можно вернуть кроме метаданных.
- kind: content
  id: 013-shag-4-materializaciya-ui-i-cli
  title: 'Шаг 4: материализация — из интерфейса и из терминала'
  bullets:
  - 'В интерфейсе: выделить ассеты и нажать Materialize'
  - 'Из CLI: та же операция одной командой'
  - Порядок выстраивается по рёбрам графа сам
  - У каждого узла появляется материализация с метаданными
  code_lang: bash
  code: |2
    # В интерфейсе: Assets → выделить → Materialize
    # Из терминала — то же самое:
    dg launch --assets '*'              # весь граф
    dg launch --assets 'trained_model'  # один узел

    # порядок Dagster выстроит по рёбрам сам:
    #   feature_table → training_dataset
    #                 → trained_model
    # и запишет каждому узлу материализацию
    # с метаданными

    # классический CLI — эксплуатация и CI:
    dagster asset materialize \
        --select 'trained_model'
  notes: |2
    [13:06–14:18 · ~1.2 мин] **Главное:**
    - !!Материализация — приведение ассета к описанию; запускать можно что угодно, порядок Dagster выстроит сам.!!

    **Рассказ:**
    - В интерфейсе: выделили узлы — кнопка Materialize; запуск открывается в отдельной вкладке с логом по шагам.
    - `dg launch --assets` — то же из терминала; кавычки обязательны, иначе оболочка развернёт `*`.
    - После запуска на каждом узле — зелёная метка, время и метаданные последней материализации.
    - Классический `dagster asset materialize` полезен в CI и в скриптах эксплуатации.

    **Что важно не перепутать:**
    - Запуск одного узла `trained_model` **не** пересчитывает родителей: он берёт их последние материализации.
    - Про пересчёт «с родителями» — следующий слайд.

    **Takeaway:**
    - !!Одна команда — и граф материализован в правильном порядке.!!

    **Переход:**
    - ~~«Теперь главное — пересчитывать не всё, а нужное».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/getting-started/quickstart
       Что взять: скриншот запуска с логом по ассетам.

    2. https://docs.dagster.io/api/clis/dg-cli/dg-cli-reference
       Что взять: опции `dg launch` — `--assets`, `--partition`, `--job`.
- kind: content
  id: 014-shag-5-selektivnyj-pereschet
  title: 'Шаг 5: селективный пересчёт — синтаксис выборки'
  bullets:
  - 'Плюс означает «и соседи по графу»: справа — вниз, слева — вверх'
  - Выборка по группе, тегу и виду вычисления
  - Изменился ассет наверху — всё ниже помечено устаревшим
  - Пересчитываем только устаревшее, а не весь пайплайн
  code_lang: bash
  code: |2
    # + означает «и соседи по графу»
    dg launch --assets 'feature_table+'  # всё ниже
    dg launch --assets '+trained_model'  # всё выше
    dg launch --assets '+training_dataset+'  # оба
    dg launch --assets 'feature_table++' # 2 ступени

    # селекторы по атрибутам
    dg launch --assets 'group:features'   # группа
    dg launch --assets 'tag:tier=gold'    # тег
    dg launch --assets 'kind:dbt'         # вид

    # сценарий: поменялась витрина наверху →
    # UI пометил всё ниже устаревшим (stale) →
    # пересчитываем ТОЛЬКО устаревшее
  notes: |2
    [14:18–15:48 · ~1.5 мин] **Главное:**
    - !!Селекция по графу — то, ради чего граф записывали: пересчёт становится вопросом к системе, а не решением дежурного.!!

    **Рассказ:**
    - Плюс справа — «и всё ниже», плюс слева — «и всё выше»; два плюса — на две ступени.
    - Тот же синтаксис работает в интерфейсе, в расписаниях и в сенсорах — учится один раз.
    - Селекторы по атрибутам: группа, тег, вид вычисления; для dbt появится `kind:dbt`.
    - Сценарий из комментария — главный: изменили `feature_table`, интерфейс подсветил всё ниже, пересчитали `feature_table+`.

    **Что важно не перепутать:**
    - «Устарел» в интерфейсе — **подсказка**, а не автоматический пересчёт.
    - Автоматика — это отдельный слайд про declarative automation.

    **Takeaway:**
    - !!features+ вместо «перезапустим всё».!!

    **Переход:**
    - ~~«Пересчитали — а данные вообще правильные? Шаг 6 — проверки».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/asset-selection-syntax
       Что взять: полную таблицу синтаксиса — можно вынести на слайд как справку.

    2. https://docs.dagster.io/guides/build/assets/asset-selection-syntax/examples
       Что взять: примеры выборки с картинками графа.
- kind: content
  id: 015-shag-6-asset-check
  title: 'Шаг 6: asset check — проверка рядом с ассетом'
  bullets:
  - Проверка — узел рядом с ассетом, а не отдельный пайплайн
  - Статус проверки виден на карточке ассета
  - 'blocking: упавшая проверка не пускает downstream'
  - Метаданные проверки — тоже на график по времени
  code_lang: python
  code: |2
    @dg.asset_check(
        asset=training_dataset,  # к какому ассету
        blocking=True,   # упала → downstream стоит
    )
    def net_propuskov(
        training_dataset: pd.DataFrame,
    ) -> dg.AssetCheckResult:
        target = training_dataset["target"]
        bad = int(target.isna().sum())
        return dg.AssetCheckResult(
            passed=bad == 0,  # статус на карточке
            # ERROR блокирует, WARN лишь сообщает
            severity=dg.AssetCheckSeverity.ERROR,
            metadata={"propuski": bad},  # на график
        )
  notes: |2
    [15:48–17:18 · ~1.5 мин] **Главное:**
    - !!Проверка — сущность у ассета со своим статусом, а не шаг, чей смысл знаете только вы.!!

    **Рассказ:**
    - Декоратор `asset_check` с параметром `asset` — к чему крепится; функция получает значение ассета.
    - `blocking=True` — упавшая проверка останавливает ветку ниже, а не весь запуск; параллельные ветки идут дальше.
    - `severity=WARN` — проверка сообщает, но не блокирует; для мягких порогов.
    - Метаданные — как у ассета: число `propuski` ложится на график.
    - Проверки запускаются вместе с материализацией или отдельно — из интерфейса.

    **Что важно не перепутать:**
    - Asset check — **про данные**, юнит-тест — **про код**.
    - Про тесты кода — отдельный слайд в блоке про эксплуатацию.

    **Takeaway:**
    - !!Проверка — узел графа со своим статусом и историей.!!

    **Переход:**
    - ~~«Проверка на значение — половина дела. Вторая половина — «данные вообще приехали?». Шаг 7».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/test/asset-checks
       Что взять: скриншот карточки ассета со статусом проверок.

    2. https://docs.dagster.io/api/dagster/asset-checks
       Что взять: параметры декоратора — blocking, severity, additional_deps.
- kind: content
  id: 016-shag-7-svezhest
  title: 'Шаг 7: свежесть — проверка «данные не приехали»'
  bullets:
  - Проверка на значение не ловит ассет, который вообще не обновился
  - Политика свежести объявляется на самом ассете
  - 'Окно: сколько можно не обновляться до WARN и до FAIL'
  - 'Или дедлайн по cron: «к 07:00 должно быть свежим»'
  code_lang: python
  code: |2
    from datetime import timedelta

    # ловит «данные не приехали», а не «упало»:
    # 12 ч без обновления → WARN, 24 ч → FAIL
    fresh = dg.FreshnessPolicy.time_window(
        fail_window=timedelta(hours=24),
        warn_window=timedelta(hours=12),
    )

    @dg.asset(group_name="features",
              freshness_policy=fresh)
    def feature_table() -> pd.DataFrame:
        return pd.read_parquet("features.parquet")

    # регламент: «к 07:00 свежим, данные ≤ 3 ч»
    nightly = dg.FreshnessPolicy.cron(
        deadline_cron="0 7 * * *",
        lower_bound_delta=timedelta(hours=3),
    )
  notes: |2
    [17:18–18:48 · ~1.5 мин] **Главное:**
    - !!Две разные беды: «данные плохие» ловит asset check, «данных нет» ловит свежесть.!!

    **Рассказ:**
    - Сценарий из первого слайда: витрина не обновилась, а обучение стартовало.
    - Проверка на значение здесь молчит — значение старое, но корректное.
    - Политика объявляется на ассете: два окна — предупреждение и провал.
    - Вторая форма — дедлайн по cron: для ночных регламентов естественнее «к семи утра», чем «не старше N часов».
    - Статус свежести виден на узле графа и попадает в общий health ассета; на него можно повесить алерт.

    **Что важно не перепутать:**
    - Политика свежести **не запускает** пересчёт; она только меняет статус.
    - Запуском занимается автоматизация — следующий блок.
    - В старых версиях Dagster это делалось функцией `build_last_update_freshness_checks`; в 1.12+ — политикой на ассете.
    - Перед показом сверить версию.

    **Takeaway:**
    - !!Свежесть — свойство ассета, а не внешний мониторинг.!!

    **Переход:**
    - ~~«Семь шагов сделаны. Теперь — самое частое применение: существующий dbt-проект».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/test/data-freshness-testing
       Что взять: страницу про свежесть — в начале там же ссылка на актуальный API политик.

    2. https://docs.dagster.io/api/dagster/assets
       Что взять: сигнатуру FreshnessPolicy — сверить имена параметров перед показом.
# ── PART 3 · Dagster + dbt ───────────────────────────────────────────────────────────────
- kind: section
  id: 017-dagster-i-dbt
  title: Dagster + dbt
  notes: |2
    [18:48–19:06 · ~0.3 мин] **Рассказ:**
    - Самый практичный блок: у большинства из вас dbt-проект уже есть.
    - Четыре уровня подключения, каждый — кодом, от одного ассета до партиций.
- kind: content
  id: 018-tezis-dbt-graf-prodolzhaetsya-v-ml
  title: 'Тезис: dbt-граф не оборачивается, а продолжается'
  bullets:
  - dbt уже строит DAG — но он заканчивается на витринах
  - Dagster разворачивает его по моделям и продолжает дальше
  - Витрина признаков — единственный стык двух миров
  - Витрина и обученная модель оказываются в одном lineage
  code_lang: diagram
  code: |2
     БЫЛО                СТАЛО
     ───────────────     ────────────────────
     [ dbt DAG ]         raw_orders   ← загрузка
      stg → int → mart      ↓
            ↓ конец      stg_orders   ← dbt
     ноутбук: features      ↓
            ?            int_orders   ← dbt
     cron: train            ↓
                         feature_mart ← dbt, СТЫК
                            ↓
                         training_dataset
                            ↓
                         trained_model

     dbt-граф — ЧАСТЬ asset graph,
     а не соседний workflow
  notes: |2
    [19:06–20:18 · ~1.2 мин] **Главное:**
    - !!Dagster не оборачивает dbt в один шаг — он разворачивает dbt-граф по моделям и продолжает его в ML.!!

    **Рассказ:**
    - Слева — сегодняшнее: dbt-граф есть, но он заканчивается на витринах; дальше знаки вопроса.
    - Справа — та же цепочка, где каждая dbt-модель стала узлом, а `feature_mart` — стык: сверху её делает dbt, снизу её читает обучение.
    - Загрузка `raw_orders` — тоже ассет, и он родитель dbt-источника; как это сшивается — отдельный слайд.
    - Итог: витрина и модель в одном lineage; «поменялась колонка в staging — что переобучать» — вопрос к графу.

    **Что важно не перепутать:**
    - SQL по-прежнему выполняет dbt; Dagster **не переписывает** модели и не читает их код — только манифест.

    **Takeaway:**
    - !!Стык один — витрина признаков; всё остальное — продолжение графа.!!

    **Переход:**
    - ~~«Подключать можно с разной глубиной. Таблица уровней».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: скриншот dbt-моделей в графе Dagster с downstream-ассетами Python.

    2. https://docs.getdbt.com/docs/build/documentation
       Что взять: скриншот dbt-графа, который обрывается на витринах, — левая половина.

    **Промпт для генерации схемы:**
    - Плоская схема 16:9 в две колонки «БЫЛО» и «СТАЛО».
    - Слева: прямоугольник «dbt DAG» с цепочкой stg → int → mart, под ним подпись «конец графа», ниже отдельно «ноутбук: features» и «cron: train», между ними знаки вопроса.
    - Справа одна вертикальная цепочка узлов: raw_orders (подпись «ассет загрузки»), stg_orders, int_orders (подписи «dbt-модель»), feature_mart (подпись «dbt-модель, стык», выделить акцентом), training_dataset, trained_model.
    - Внизу подпись «dbt-граф — часть asset graph, а не соседний workflow».
    - Без логотипов, текст на русском.
- kind: table
  id: 019-chetyre-urovnya-integracii
  title: Уровни интеграции dbt и Dagster
  table:
    headers: ['Уровень', 'Что делаем', 'Что получаем', 'Чего не хватает']
    rows:
    - ['0', 'Один ассет запускает dbt build', 'Расписание и ретраи', 'Граф — чёрный ящик, частичного пересчёта нет']
    - ['1', 'manifest.json → ассеты', 'Каждая модель — отдельный ассет', 'ML-часть всё ещё отдельно']
    - ['2', 'Источники и ML-ассеты вокруг dbt', 'Один сквозной граф от загрузки до модели', 'Нет разрезания по времени']
    - ['3', 'Партиции, тесты как проверки, автоматизация', 'Инкрементальность и качество в графе', 'Один проект, одна команда']
    - ['4', 'Несколько dbt-проектов и code locations', 'Платформа из независимых доменов', 'Нужна дисциплина владения']
    col_ratios: [1, 4, 4, 4]
  notes: |2
    [20:18–21:36 · ~1.3 мин] **Главное:**
    - !!Уровни 0–3 — технология, и мы пройдём их кодом; уровень 4 — организация, его только называем.!!

    **Рассказ:**
    - Уровень 0 — честная точка входа: один ассет, внутри `dbt build`; уже есть расписание и ретраи.
    - Уровень 1 — главный выигрыш за минимальный труд: манифест разворачивается в ассеты, модель — узел.
    - Уровень 2 — то, ради чего MLE вообще сюда пришёл: загрузка и обучение по обе стороны dbt.
    - Уровень 3 — партиции и тесты как проверки: инкрементальность и качество внутри графа.
    - Уровень 4 — несколько проектов и кодовых локаций; нужен, когда появляются несколько команд.

    **Что важно не перепутать:**
    - Уровни — **не этапы внедрения**, которые надо пройти по порядку: большинство команд стартует сразу с первого.

    **Takeaway:**
    - !!Level 1 — это одна команда; дальше решает потребность, а не технология.!!

    **Переход:**
    - ~~«Начнём с нуля — в буквальном смысле».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: обзор интеграции — там видно уровни 1–3 как разделы.

    2. https://docs.getdbt.com/docs/mesh/about-dbt-mesh
       Что взять: строку про уровень 4 со стороны dbt.
- kind: content
  id: 020-level-0-dbt-chernyj-yaschik
  title: 'Level 0: dbt как чёрный ящик'
  bullets:
  - Один ассет запускает dbt build целиком
  - 'Плюс: почти нулевые трудозатраты, расписание и ретраи сразу'
  - 'Минус: весь dbt-проект — один прямоугольник в графе'
  - Частичного пересчёта и model-level lineage нет
  code_lang: python
  code: |2
    from dagster_dbt import DbtCliResource

    @dg.asset(compute_kind="dbt")
    def dbt_project_build(dbt: DbtCliResource):
        # ОДИН ассет = ВЕСЬ dbt-проект.
        # Расписание, ретраи, логи — есть; граф
        # моделей, тесты, частичный пересчёт — нет
        dbt.cli(["build"]).wait()   # run + test

    # defs/resources.py — ресурс регистрируем раз
    @dg.definitions
    def resources():
        return dg.Definitions(resources={
            "dbt": DbtCliResource(
                project_dir="../analytics_dbt"),
        })
  notes: |2
    [21:36–23:06 · ~1.5 мин] **Главное:**
    - !!Уровень 0 — не ошибка, а честная точка входа: за полчаса dbt получает расписание и ретраи.!!

    **Рассказ:**
    - `DbtCliResource` — обёртка над CLI dbt; она приходит аргументом, как любой ресурс.
    - `build`, а не `run`: модели и тесты одним проходом.
    - `.wait()` — дождаться завершения; события внутри нас пока не интересуют.
    - Нижняя часть — регистрация ресурса: функция с `@dg.definitions` в `defs/` возвращает набор ресурсов, загрузчик подхватывает её сам.
    - Минус виден на графе: один узел, за которым сто моделей, и «пересчитать только витрину» невозможно.

    **Что важно не перепутать:**
    - Ресурс `dbt` здесь и на всех следующих слайдах — **один и тот же**; меняется только то, как мы разворачиваем проект.

    **Takeaway:**
    - !!Один ассет — уже оркестрация; но графа внутри ещё нет.!!

    **Переход:**
    - ~~«Чтобы граф появился, Dagster должен узнать про модели. Откуда — manifest.json».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/api/libraries/dagster-dbt#dagster_dbt.DbtCliResource
       Что взять: методы ресурса — cli, wait, stream.

    2. https://docs.dagster.io/guides/build/external-resources
       Что взять: паттерн регистрации ресурсов через @dg.definitions.
- kind: content
  id: 021-manifest-json-otkuda-dagster-znaet-pro-modeli
  title: 'manifest.json: откуда Dagster знает про модели'
  bullets:
  - dbt при компиляции выкладывает описание проекта в manifest.json
  - 'Из него берутся модели, зависимости, тесты, описания и meta'
  - В разработке манифест пересобирается сам, в проде — заранее
  - Манифест обязан попасть в образ вместе с кодом
  code_lang: python
  code: |2
    # src/ml_platform/project.py
    from pathlib import Path
    from dagster_dbt import DbtProject

    ROOT = Path(__file__).resolve().parents[2]

    # всё, что Dagster знает о проекте: где он,
    # где профили, где лежит manifest.json
    dbt_project = DbtProject(
        project_dir=ROOT / "analytics_dbt",
        profiles_dir=ROOT / "analytics_dbt",
    )

    # dev: при `dg dev` пересобрать манифест
    dbt_project.prepare_if_dev()

    # prod / CI: манифест собирается ЗАРАНЕЕ
    # и едет в образ вместе с кодом:
    #   dagster-dbt project prepare-and-package \
    #     --file src/ml_platform/project.py
  notes: |2
    [23:06–24:36 · ~1.5 мин] **Главное:**
    - !!Манифест — общий контракт: dbt его пишет, Dagster читает; ничего другого Dagster про проект не знает.!!

    **Рассказ:**
    - `DbtProject` — один объект на проект; из него берётся `manifest_path` для всех следующих слайдов.
    - `prepare_if_dev` — в `dg dev` пересобрать манифест при старте, чтобы правки моделей были видны без ручного `dbt parse`.
    - В проде эта строка ничего не делает: манифест собирается на этапе сборки образа командой из комментария и кладётся рядом с кодом.
    - Отсюда правило: **манифест — артефакт сборки**, как скомпилированный код.

    **Что важно не перепутать:**
    - Манифест устарел — граф в Dagster **врёт**: новых моделей не видно, удалённые висят.
    - Первое, что проверять при странном графе.

    **Takeaway:**
    - !!Нет манифеста — нет графа; манифест в образе — обязательное условие прода.!!

    **Переход:**
    - ~~«Теперь разворачиваем манифест в ассеты. Сначала — без Python вообще».~~

    **Визуальные опоры:**

    1. https://docs.getdbt.com/reference/artifacts/manifest-json
       Что взять: фрагмент структуры манифеста — nodes, sources, depends_on.

    2. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: раздел про подготовку манифеста в dev и в проде.
- kind: content
  id: 022-level-1-komponent-bez-python
  title: 'Level 1 без Python: компонент в defs.yaml'
  bullets:
  - Компонент описывается в YAML, Python не нужен вообще
  - Одна команда создаёт заготовку из существующего проекта
  - 'select и exclude — обычный синтаксис выборки dbt'
  - Правила именования и группировки задаются тут же
  code_lang: yaml
  code: |2
    # заготовку создаёт одна команда:
    #   dg scaffold defs \
    #     dagster_dbt.DbtProjectComponent \
    #     --project-path ../analytics_dbt
    #
    # src/ml_platform/defs/analytics_dbt/defs.yaml
    type: dagster_dbt.DbtProjectComponent
    attributes:
      project: ../analytics_dbt       # где проект
      # обычная dbt-выборка
      select: "fqn:staging.* fqn:marts.*"
      translation:                # вид в Dagster
        group_name: dbt               # одна группа

    # проверить схему YAML:    dg check yaml
    # во что развернулось:     dg list defs
  notes: |2
    [24:36–25:48 · ~1.2 мин] **Главное:**
    - !!Level 1 — это один YAML-файл: манифест разворачивается в ассеты без строчки Python.!!

    **Рассказ:**
    - Компонент — готовый паттерн с параметрами; `dg scaffold` создаёт заготовку и подставляет путь к проекту.
    - `select` — тот же синтаксис, что в `dbt build --select`; не нужно учить второй.
    - `translation` — как модель выглядит в Dagster: группа, ключ, описание; для простых правил YAML хватает.
    - После `dg check yaml` и `dg list defs` в графе — каждая модель отдельным узлом, `ref()` — ребром.

    **Что важно не перепутать:**
    - Компонент **не запускает** dbt иначе, чем Python-вариант; под капотом тот же `@dbt_assets` и тот же `DbtCliResource`.

    **Takeaway:**
    - !!Одна команда и десять строк YAML — граф dbt-моделей в Dagster.!!

    **Переход:**
    - ~~«То же самое на Python — когда нужна логика, а не только конфигурация».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/components/integrations/dbt-component-tutorial
       Что взять: скриншот графа после подключения компонента.

    2. https://docs.dagster.io/guides/build/components
       Что взять: общую картинку «что такое компонент» — один абзац для подстрочника.
- kind: content
  id: 023-level-1-na-python-dbt-assets
  title: 'Level 1 на Python: @dbt_assets'
  bullets:
  - Один декоратор разворачивает манифест в набор ассетов
  - DbtCliResource выполняет команду и стримит события обратно
  - 'build вместо run + test: модели и тесты одним проходом'
  - Нужен, когда требуется логика, а не только конфигурация
  code_lang: python
  code: |2
    import dagster as dg
    from dagster_dbt import DbtCliResource
    from dagster_dbt import dbt_assets
    from ml_platform.project import dbt_project

    # ОДИН декоратор → N ассетов: по одному
    # на каждую модель из манифеста
    @dbt_assets(manifest=dbt_project.manifest_path)
    def analytics_dbt(
        context: dg.AssetExecutionContext,
        dbt: DbtCliResource,
    ):
        # build, а не run: тесты идут вместе
        # с моделями и приезжают как asset checks.
        # stream(): каждое событие dbt → событие
        # Dagster сразу, а не одним итогом в конце
        yield from dbt.cli(
            ["build"], context=context,
        ).stream()
  notes: |2
    [25:48–27:18 · ~1.5 мин] **Главное:**
    - !!Один декоратор — и каждая модель dbt стала ассетом со своими материализациями и проверками.!!

    **Рассказ:**
    - `@dbt_assets` читает манифест и объявляет по ассету на модель; функция под ним — одна на всех, и она решает, как запускать dbt.
    - `context` передаём в `cli` — тогда dbt получает выборку ровно тех моделей, которые Dagster решил материализовать: пересчёт `feature_mart+` превращается в `dbt build --select ...`.
    - `stream()` — события dbt превращаются в события Dagster по мере выполнения: узлы зеленеют один за другим, а не все разом в конце.
    - `build` — тесты dbt приезжают как asset checks на карточку модели.

    **Что важно не перепутать:**
    - `dbt.cli(...)` — **это не** `subprocess`: он собирает команду с учётом выборки Dagster и разбирает вывод dbt в события.

    **Takeaway:**
    - !!@dbt_assets + build + stream — три слова, в которых весь Level 1.!!

    **Переход:**
    - ~~«Кто решает, как модель называется в Dagster и в какую группу попадает? Translator».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt/dbt-pythonic
       Что взять: канонический пример @dbt_assets — совпадает с нашим.

    2. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: раздел про выборку: как context превращается в --select.
- kind: content
  id: 024-translator-kak-model-stanovitsya-assetom
  title: 'Translator: как модель dbt становится ассетом'
  bullets:
  - Отвечает на три вопроса — как назвать, куда положить, что написать
  - 'Получает узел манифеста, возвращает ключ, группу, описание, теги'
  - По умолчанию ключ — имя модели, группа — одна на проект
  - Свой translator нужен для сшивки с ассетами вне dbt
  code_lang: python
  code: |2
    from dagster_dbt import DagsterDbtTranslator

    class MyTranslator(DagsterDbtTranslator):
        # props — узел manifest.json: name, fqn,
        # description, meta, tags …

        def get_asset_key(self, props):
            # короткий ключ = имя модели
            return dg.AssetKey([props["name"]])

        def get_group_name(self, props):
            # fqn = [проект, папка, …, модель]
            fqn = props.get("fqn") or []
            # группа = папка models/<слой>
            return fqn[1] if len(fqn) > 2 else "dbt"

    @dbt_assets(
        manifest=dbt_project.manifest_path,
        dagster_dbt_translator=MyTranslator(),  # ←
    )
    def analytics_dbt(context, dbt: DbtCliResource):
        yield from dbt.cli(["build"],
                           context=context).stream()
  notes: |2
    [27:18–28:48 · ~1.5 мин] **Главное:**
    - !!Translator — единственное место, где решается, как dbt-узел выглядит в Dagster.!!

    **Рассказ:**
    - На вход каждому методу — словарь узла из манифеста: имя, `fqn`, описание, `meta`, теги.
    - `get_asset_key` — ключ; по умолчанию это имя модели, и для одного проекта этого хватает.
    - `get_group_name` — группа; здесь по папке `models/staging`, `models/marts` — граф раскладывается по слоям.
    - Есть и `get_description`, `get_tags`, `get_metadata` — по одному вопросу на метод; описание из dbt переезжает на карточку ассета и без переопределения.
    - Подключается одним параметром декоратора; компонент делает то же через `translation` в YAML.

    **Что важно не перепутать:**
    - Translator работает **на чтении манифеста**, а не на запуске: поменяли правило — перезагрузили определения, dbt перезапускать не надо.

    **Takeaway:**
    - !!Три метода — три вопроса; свой translator нужен, когда ключи должны совпасть с чужими.!!

    **Переход:**
    - ~~«И вот зачем ключи должны совпадать — Level 2».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/api/libraries/dagster-dbt#dagster_dbt.DagsterDbtTranslator
       Что взять: полный список методов — есть ещё теги, метаданные, владельцы, automation_condition.

    2. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: раздел «Customizing asset keys / groups» — примеры.
- kind: content
  id: 025-level-2-sshivka-klyuchej-cherez-istochniki
  title: 'Level 2: сшивка ключей через источники dbt'
  bullets:
  - Ключ ассета — общее имя, по которому графы сшиваются
  - Источник dbt получает ключ ассета загрузки — и ребро появляется
  - 'Совпали ключи — один связный граф; разошлись — два куска'
  - Translator по умолчанию читает meta.dagster.asset_key сам
  code_lang: yaml
  code: |2
    # analytics_dbt/models/staging/_sources.yml
    sources:
      - name: olist_raw
        tables:
          - name: orders
            meta:
              dagster:
                # translator по умолчанию читает это
                # ← ключ ассета ЗАГРУЗКИ
                asset_key: ["raw_orders"]

    # тот же ключ — у ассета загрузки в Dagster:
    #   @dg.asset(key=dg.AssetKey(["raw_orders"]))
    #   def raw_orders(): ...
    #
    # совпали → ребро raw_orders → stg_orders,
    # граф связный; разошлись → источник висит
    # отдельным узлом без родителя
  notes: |2
    [28:48–30:06 · ~1.3 мин] **Главное:**
    - !!Ключ ассета — общий язык между Python и dbt; совпал — граф один, не совпал — два.!!

    **Рассказ:**
    - У dbt-источника нет кода — это ссылка на таблицу, которую сделал кто-то другой.
    - Этот «кто-то» — ассет загрузки Dagster.
    - `meta.dagster.asset_key` в `_sources.yml` говорит translator'у: «этот источник — вот тот ассет».
    - На стороне Dagster у ассета загрузки тот же ключ — и ребро `raw_orders → stg_orders` появляется само.
    - Верхняя половина графа (загрузка) и середина (dbt) сшиты; нижняя (обучение) сшивается через `deps=[AssetKey("feature_mart")]` — это уже было на слайде про зависимости.

    **Что важно не перепутать:**
    - Сшивка — **по ключу, не по имени таблицы**: `raw.orders` в складе и `raw_orders` в графе — разные вещи, совпадать обязаны ключи.

    **Takeaway:**
    - !!Один ключ в двух местах — единственное, что нужно для сквозного графа.!!

    **Переход:**
    - ~~«Level 3: тесты dbt становятся проверками ассетов».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: раздел про upstream-зависимости dbt-источников — meta.dagster.asset_key.

    2. https://docs.getdbt.com/reference/resource-configs/meta
       Что взять: как dbt хранит meta у источников — доказательство, что это штатный механизм.
- kind: content
  id: 026-level-3-dbt-testy-stanovyatsya-asset-checks
  title: 'Level 3: dbt-тесты становятся asset checks'
  bullets:
  - dbt-тесты грузятся как проверки ассетов — без кода
  - Статус проверки — на карточке модели, история — по времени
  - 'build вместо run: модель и её тесты одним проходом'
  - Упавшая проверка останавливает ветку, а не весь запуск
  code_lang: diagram
  code: |2
     dbt test           asset check
     ───────────        ────────────────────
     not_null       →   проверка ассета
     unique         →   статус у данных
     relationships  →   стоп downstream
     accepted_val.  →   метаданные, история

     dbt build = модель + тесты одним проходом
     stream()  = каждый тест → событие проверки

     включено по умолчанию:
     DagsterDbtTranslatorSettings(
         enable_asset_checks=True)
  notes: |2
    [30:06–31:18 · ~1.2 мин] **Главное:**
    - !!Тесты dbt уже написаны — Dagster просто показывает их как проверки ассетов; писать ничего не надо.!!

    **Рассказ:**
    - Каждый тест из манифеста становится asset check у своей модели: `not_null` на колонке `stg_orders.id` — проверка ассета `stg_orders`.
    - Именно поэтому команда `build`: `run` тесты не запускает, и проверки останутся серыми.
    - `stream()` превращает результат каждого теста в событие — проверка получает статус ровно в момент выполнения.
    - Поведение при падении — как у проверок из Quick Start: ветка ниже останавливается, соседние идут.

    **Что важно не перепутать:**
    - Тесты источников по умолчанию **не** становятся проверками — это отдельная настройка `enable_source_tests_as_checks`.

    **Takeaway:**
    - !!Качество данных в графе — бесплатно, если тесты dbt уже есть.!!

    **Переход:**
    - ~~«Вторая половина Level 3 — время. Партиции».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/dbt/dbt-tests
       Что взять: скриншот проверок на карточке dbt-модели.

    2. https://docs.dagster.io/api/libraries/dagster-dbt#dagster_dbt.DagsterDbtTranslatorSettings
       Что взять: флаги enable_asset_checks и enable_source_tests_as_checks.

    **Промпт для генерации схемы:**
    - Плоская схема 16:9 в две колонки: слева заголовок «dbt test» и четыре строки: not_null, unique, relationships, accepted_values; справа заголовок «asset check» и четыре строки: «проверка ассета», «статус у данных», «стоп downstream», «метаданные, история».
    - Между колонками стрелки слева направо, попарно.
    - Внизу две строки-подписи: «dbt build = модель + её тесты одним проходом» и «stream() = каждый тест → событие проверки».
    - Моноширинный шрифт, один акцентный цвет для стрелок, текст на русском.
- kind: content
  id: 027-level-3-particii-okno-peredaetsya-dbt-peremennoj
  title: 'Level 3: партиции — окно передаётся dbt переменной'
  bullets:
  - Ассет режется по измерению — чаще всего по дате
  - Окно партиции запуска передаётся в dbt через --vars
  - 'Обучающая выборка — диапазон партиций, а не «вся таблица»'
  - Отсюда берётся ответ «на каких данных обучена модель»
  code_lang: python
  code: |2
    import json
    daily = dg.DailyPartitionsDefinition(
        start_date="2026-01-01")

    @dbt_assets(
        manifest=dbt_project.manifest_path,
        partitions_def=daily,   # по дням
        select="fqn:marts.*",   # только витрины
    )
    def daily_marts(context, dbt: DbtCliResource):
        # окно партиции этого запуска → --vars →
        # var('start') / var('end') в SQL модели
        w = context.partition_time_window
        v = {"start": w.start.isoformat(),
             "end": w.end.isoformat()}
        yield from dbt.cli(
            ["build", "--vars", json.dumps(v)],
            context=context,
        ).stream()
  notes: |2
    [31:18–32:48 · ~1.5 мин] **Главное:**
    - !!Партиция — единица пересчёта по времени; для MLE это ответ на вопрос «на каком окне обучено».!!

    **Рассказ:**
    - `DailyPartitionsDefinition` — измерение «день»; тот же объект вешается на Python-ассеты ниже по графу.
    - В `@dbt_assets` партиционируем только витрины (`select`): staging обычно пересчитывается целиком.
    - `partition_time_window` — окно текущего запуска; передаём его в dbt через `--vars`, в SQL читаем `var('start')` и `var('end')` в `where`.
    - Бэкфилл — запуск диапазона партиций одним действием из интерфейса: пересчитать июнь — выбрать 30 партиций.

    **Что важно не перепутать:**
    - Идемпотентность SQL — **ваша** забота: модель обязана перезаписывать своё окно, а не дописывать; Dagster это не проверяет.

    **Takeaway:**
    - !!Окно партиции → var в dbt → диапазон в метаданных модели.!!

    **Переход:**
    - ~~«Граф есть, проверки есть, время есть. Кто всё это запускает по расписанию — следующий блок».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: раздел про партиционированные dbt-ассеты — пример с --vars.

    2. https://docs.dagster.io/guides/build/partitions-and-backfills
       Что взять: скриншот матрицы партиций и бэкфилла из интерфейса.
# ── PART 4 · Расписания, сенсоры, ресурсы, эксплуатация ─────────────────────────────────
- kind: section
  id: 028-raspisaniya-sensory-resursy-ekspluataciya
  title: 'Расписания, сенсоры, ресурсы, тесты, деплой'
  notes: |2
    [32:48–33:06 · ~0.3 мин] **Рассказ:**
    - Обвязка вокруг графа: кто запускает, откуда берутся подключения, как тестировать и что стоит в проде.
    - Семь слайдов, всё кодом и одной схемой.
- kind: content
  id: 029-raspisanie-job-poverh-vyborki-assetov
  title: 'Расписание: джоба поверх выборки ассетов'
  bullets:
  - 'Джоба — именованная выборка ассетов; расписание запускает джобу'
  - 'Выборка — тот же синтаксис, что в dg launch'
  - 'Для dbt — расписание прямо из dbt-выборки'
  - Расписание в defs/ загружается само, регистрировать не надо
  code_lang: python
  code: |2
    # 1) джоба = выборка ассетов; расписание — cron
    daily_features = dg.define_asset_job(
        name="daily_features",
        selection=dg.AssetSelection
            .groups("features").downstream(),
    )
    daily_schedule = dg.ScheduleDefinition(
        job=daily_features,
        cron_schedule="0 3 * * *",  # в 03:00
    )

    # 2) для dbt — прямо из dbt-выборки
    from dagster_dbt import (
        build_schedule_from_dbt_selection)
    nightly = build_schedule_from_dbt_selection(
        [analytics_dbt],       # набор @dbt_assets
        job_name="nightly_marts",
        cron_schedule="0 2 * * *",
        dbt_select="fqn:marts.*",  # синтаксис dbt
    )
  notes: |2
    [33:06–34:36 · ~1.5 мин] **Главное:**
    - !!Расписание запускает не «пайплайн», а выборку ассетов — ту же, что вы писали в dg launch.!!

    **Рассказ:**
    - `define_asset_job` — именованная выборка; здесь группа `features` и всё ниже по графу.
    - `ScheduleDefinition` — cron (таймзона — параметром `execution_timezone`); демон (`dg dev` его уже поднял) тикает и создаёт запуски.
    - Для dbt — вторая форма: выборка в синтаксисе dbt, джоба и расписание за один вызов.
    - Оба объекта лежат в `defs/` верхнего уровня — загрузчик подхватывает их сам.
    - Включается расписание в интерфейсе (Automation → toggle) или `default_status=RUNNING`.

    **Что важно не перепутать:**
    - Cron запускает **по времени**, не по данным: если витрина опоздала, обучение всё равно стартует.
    - Лечится сенсором или условием автоматизации — два следующих слайда.

    **Takeaway:**
    - !!Расписание = cron + выборка ассетов.!!

    **Переход:**
    - ~~«Когда событие приходит снаружи — сенсор».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/automate/schedules
       Что взять: скриншот вкладки Automation с включённым расписанием.

    2. https://docs.dagster.io/api/libraries/dagster-dbt#dagster_dbt.build_schedule_from_dbt_selection
       Что взять: сигнатуру — сверить имена параметров перед показом.
- kind: content
  id: 030-sensor-reakciya-na-sobytie-snaruzhi
  title: 'Сенсор: реакция на событие снаружи, с курсором'
  bullets:
  - Сенсор опрашивает внешний мир и решает, запускать ли
  - 'Курсор — память между тиками: без него дубли или пропуски'
  - 'run_key — один файл, один запуск, даже при повторном тике'
  - SkipReason объясняет в интерфейсе, почему тихо
  code_lang: python
  code: |2
    import os

    @dg.sensor(
        # что запускать: raw_orders и всё ниже
        target=dg.AssetSelection
            .keys("raw_orders").downstream(),
        minimum_interval_seconds=60,   # опрос
    )
    def novyj_fajl(context):
        seen = context.cursor or ""  # память тиков
        files = sorted(f for f in os.listdir("in")
                       if f > seen)
        if not files:
            # видно в UI, почему тихо
            yield dg.SkipReason("новых файлов нет")
            return
        for f in files:
            # один файл — один запуск; повторный
            # тик с тем же run_key дубля не создаст
            yield dg.RunRequest(run_key=f)
        context.update_cursor(files[-1])  # сдвинули
  notes: |2
    [34:36–36:06 · ~1.5 мин] **Главное:**
    - !!Сенсор — для событий, о которых Dagster сам не знает; курсор и run_key — то, что отличает рабочий сенсор от источника дублей.!!

    **Рассказ:**
    - `target` — что запускать; синтаксис выборки тот же.
    - Тело — опрос: что нового с прошлого раза.
    - «Прошлый раз» хранится в курсоре — строка, которую Dagster хранит за вас.
    - `SkipReason` — не ошибка, а объяснение: в интерфейсе видно «новых файлов нет», а не пустой тик.
    - `RunRequest` с `run_key` — идемпотентность: тот же ключ второй раз запуск не создаст.
    - `update_cursor` — последняя строка, и порядок важен: сначала запросы, потом курсор.

    **Что важно не перепутать:**
    - Сенсор **не** обрабатывает событие сам — он только создаёт запуск; логика чтения файла живёт в ассете.

    **Takeaway:**
    - !!Курсор + run_key — без них сенсор работает, но врёт.!!

    **Переход:**
    - ~~«А если событие — внутри графа, «обновился родитель»? Тогда не нужны ни cron, ни сенсор».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/automate/sensors
       Что взять: скриншот вкладки сенсора с историей тиков и SkipReason.

    2. https://docs.dagster.io/guides/automate/sensors/using-cursors
       Что взять: объяснение курсора — один абзац для подстрочника.
- kind: content
  id: 031-declarative-automation-eager-i-on-cron
  title: 'Declarative automation: условие на самом ассете'
  bullets:
  - Вместо «расписание + сенсор» — условие на ассете
  - 'eager: пересчитать, как только обновился любой родитель'
  - 'on_cron: по cron, но только после обновления родителей'
  - Условия комбинируются операторами
  code_lang: python
  code: |2
    # условие — на самом ассете; оценивает сенсор
    # default_automation_condition_sensor (в UI)

    @dg.asset(
        deps=[feature_table],
        # eager: пересчитать, как только обновился
        # любой родитель
        automation_condition=dg.AutomationCondition
            .eager(),
    )
    def training_dataset(): ...

    @dg.asset(
        deps=[training_dataset],
        # on_cron: по пн в 04:00 — но ТОЛЬКО если
        # родители обновились с прошлого тика
        automation_condition=dg.AutomationCondition
            .on_cron("0 4 * * 1"),
    )
    def trained_model(): ...

    # комбинируются: eager() & ~in_progress()
  notes: |2
    [36:06–37:36 · ~1.5 мин] **Главное:**
    - !!Условие автоматизации — ответ на вопрос «когда этот ассет должен обновляться», записанный на самом ассете.!!

    **Рассказ:**
    - `eager` — изменение протаскивается вниз по графу: обновилась витрина — пересчиталась выборка.
    - Это тот самый «пересчитать только устаревшее», но автоматически.
    - `on_cron` — регламент, который ждёт данных: по понедельникам в четыре, но если витрина опоздала — обучение не стартует на старом.
    - Это закрывает риск cron-расписания с позапрошлого слайда.
    - Оценивает условия отдельный сенсор; он выключен по умолчанию — включить в Automation.
    - Операторы `&`, `|`, `~` — условия составные; готовых кирпичей десяток.

    **Что важно не перепутать:**
    - Условие живёт **на ассете**, а не на джобе: переносите ассет в другой проект — правило едет с ним.

    **Takeaway:**
    - !!eager для «протащить вниз», on_cron для «регламент, который ждёт данных».!!

    **Переход:**
    - ~~«Ассеты ходят во внешние системы. Как — ресурсы».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/automate/declarative-automation
       Что взять: канонические примеры eager и on_cron — совпадают с нашими.

    2. https://docs.dagster.io/guides/automate/declarative-automation/customizing-automation-conditions
       Что взять: таблицу кирпичей — in_progress, missing, any_deps_updated.
- kind: content
  id: 032-resursy-odin-kod-raznye-kontury
  title: 'Ресурсы: один код, разные контуры'
  bullets:
  - Внешний мир приходит в ассет параметром, а не импортом
  - 'Поля ресурса валидируются: опечатка в конфиге — до запуска'
  - Контур выбирается при регистрации, код ассета не меняется
  - 'EnvVar: секрет читается при запуске, в логи не попадает'
  code_lang: python
  code: |2
    class Warehouse(dg.ConfigurableResource):
        dsn: str            # поля валидируются
        def read(self, table: str) -> pd.DataFrame:
            return pd.read_sql(
                f"select * from {table}", self.dsn)

    @dg.asset
    def feature_table(warehouse: Warehouse):
        # ресурс приходит АРГУМЕНТОМ:
        # код ассета не знает, какой это контур
        return warehouse.read("mart_features")

    # defs/resources.py — контур выбирается ЗДЕСЬ
    @dg.definitions
    def resources():
        return dg.Definitions(resources={
            # секрет читается при запуске,
            # в снимок и в логи не попадает
            "warehouse": Warehouse(
                dsn=dg.EnvVar("WAREHOUSE_DSN")),
        })
    # dev:  WAREHOUSE_DSN=duckdb:///local.db (.env)
    # prod: та же переменная из хранилища секретов
  notes: |2
    [37:36–39:06 · ~1.5 мин] **Главное:**
    - !!Ресурс — единственный способ, которым ассет трогает внешний мир; поэтому контур меняется без правки ассетов.!!

    **Рассказ:**
    - Класс ресурса — поля и методы; поля проверяются при загрузке определений, не в три часа ночи.
    - Ассет объявляет ресурс аргументом по имени `warehouse` — и получает экземпляр; про DSN он не знает.
    - Регистрация — функция с `@dg.definitions`; здесь и только здесь решается, какой это контур.
    - `EnvVar` — не `os.environ`: значение подставляется в момент запуска, в снимок определений и в логи не попадает.
    - Две последние строки — вся разница dev/prod: одна переменная окружения.

    **Что важно не перепутать:**
    - Ресурс — **не** глобальный клиент, импортированный в модуль: такой клиент нельзя подменить в тесте и нельзя сменить контуром.

    **Takeaway:**
    - !!Ассет + ресурс аргументом = код, который одинаково живёт на ноутбуке и в проде.!!

    **Переход:**
    - ~~«И ровно поэтому его можно тестировать без инфраструктуры».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/external-resources
       Что взять: канонический пример ConfigurableResource с EnvVar.

    2. https://docs.dagster.io/guides/deploy/using-environment-variables-and-secrets
       Что взять: как EnvVar и .env работают в dev и в проде.
- kind: content
  id: 033-lokalnoe-testirovanie-bez-infrastruktury
  title: Локальное тестирование без инфраструктуры
  bullets:
  - Ассет — обычная функция, её можно вызвать напрямую
  - Граф из нескольких ассетов прогоняется в памяти
  - Ресурсы подменяются заглушками — склад и кластер не нужны
  - 'dg check defs ловит опечатки в ключах и ресурсах в CI'
  code_lang: python
  code: |2
    # tests/test_ml.py — ассет это функция
    def test_dataset_ubiraet_propuski():
        df = pd.DataFrame({"target": [1, None],
                           "split": ["train"] * 2})
        assert len(training_dataset(df)) == 1

    class FakeWarehouse(Warehouse):   # заглушка
        def read(self, table):
            return pd.DataFrame({
                "x": [1, 2], "target": [0, 1],
                "split": ["train"] * 2})

    def test_cepochka_celikom():
        # весь граф в памяти: без UI, демона, базы
        result = dg.materialize_to_memory(
            [feature_table, training_dataset,
             trained_model],
            resources={"warehouse":
                       FakeWarehouse(dsn="fake")},
        )
        assert result.success

    # определения целиком, в CI:  dg check defs
  notes: |2
    [39:06–40:36 · ~1.5 мин] **Главное:**
    - !!Три уровня тестов — функция, цепочка в памяти, определения целиком — и ни один не требует поднятого Dagster.!!

    **Рассказ:**
    - Первый тест — ассет как функция: передали DataFrame, проверили результат; Dagster не участвует.
    - Второй — цепочка: `materialize_to_memory` прогоняет три ассета через реальный механизм зависимостей, но хранит значения в памяти.
    - Ресурс подменён наследником — склад не нужен; так же подменяют реестр моделей и API.
    - Третий уровень — `dg check defs` в CI: ловит несуществующий ключ в `deps`, незарегистрированный ресурс, ошибку в компоненте.

    **Что важно не перепутать:**
    - Тест кода **не заменяет** asset check: первый проверяет логику на игрушечных данных, второй — реальные данные на каждом запуске.

    **Takeaway:**
    - !!Пайплайн тестируется как библиотека, потому что он ей и является.!!

    **Переход:**
    - ~~«Локально всё в одном процессе. В проде — четыре части. Схема».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/test/unit-testing-assets-and-ops
       Что взять: примеры прямого вызова и materialize_to_memory.

    2. https://docs.dagster.io/guides/test/testing-partitioned-config-and-jobs
       Что взять: строку про тестирование партиционированных ассетов — если спросят.
- kind: content
  id: 034-iz-chego-sostoit-razvernutyj-dagster
  title: 'Из чего состоит развёрнутый Dagster: dev против prod'
  bullets:
  - 'dev: dg dev — всё в одном процессе, SQLite в папке проекта'
  - 'prod: веб-сервер, демон, база состояния и кодовые локации отдельно'
  - Кодовая локация — независимо деплоящийся набор определений
  - 'Код ассетов не меняется — меняется только регистрация ресурсов'
  code_lang: diagram
  code: |2
     ┌──────────┐ ┌──────────┐ ┌─────────┐
     │Webserver │ │ Daemon   │ │  Code   │
     │UI,GraphQL│ │расписания│ │locations│
     │          │ │сенсоры,  │ │ваш код  │
     │          │ │очередь,BF│ │ (gRPC)  │
     └────┬─────┘ └────┬─────┘ └────┬────┘
          └────────────┴────────────┘
                       │
            ┌──────────────────┐
            │ Dagster Instance │ dagster.yaml
            │ run storage      │ SQLite  в dev
            │ event log        │ Postgres в prod
            │ schedule storage │
            └──────────────────┘

     dev: dg dev = все три сверху в одном процессе
  notes: |2
    [40:36–41:54 · ~1.3 мин] **Главное:**
    - !!В проде четыре части, и три из них — стандартные сервисы; ваш код живёт только в кодовых локациях.!!

    **Рассказ:**
    - Веб-сервер — интерфейс и GraphQL API; он ничего не запускает.
    - Демон — расписания, сенсоры, очередь запусков, бэкфиллы; без него ничего не тикает.
    - Кодовые локации — ваш код, отдельный процесс на gRPC; у каждой свой образ и свои версии библиотек.
    - Падение одной не роняет остальные.
    - Инстанс — общее состояние: запуски, лог событий, расписания; в dev это SQLite, в проде Postgres, настраивается в `dagster.yaml`.
    - `dg dev` поднимает верхние три в одном процессе — поэтому на ноутбуке всё одной командой.

    **Что важно не перепутать:**
    - Границы кодовых локаций должны совпадать с границами **команд**, а не слоёв: локация «dbt» и локация «ML» у одной команды — лишняя сложность.

    **Takeaway:**
    - !!Локально — один процесс; в проде — те же части, разнесённые по сервисам; код тот же.!!

    **Переход:**
    - ~~«Два слайда про то, что мы сознательно оставили за скобками: обучение и продакшен».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/deployment/oss/oss-deployment-architecture
       Что взять: официальную схему архитектуры — сверить с нашей.

    2. https://docs.dagster.io/deployment/oss/deployment-options/kubernetes
       Что взять: как эти четыре части ложатся на Kubernetes — если спросят про прод.

    **Промпт для генерации схемы:**
    - Плоская архитектурная схема 16:9.
    - Верхний ряд — три прямоугольника: «Webserver (UI, GraphQL)», «Daemon (расписания, сенсоры, очередь запусков, бэкфиллы)», «Code locations (ваш код, gRPC)».
    - От всех трёх линии вниз сходятся в один широкий прямоугольник «Dagster Instance» с тремя строками внутри: run storage, event log, schedule storage; справа от него подпись «dagster.yaml · SQLite в dev · Postgres в prod».
    - Под схемой пунктирная рамка вокруг верхних трёх блоков с подписью «dg dev = всё в одном процессе».
    - Акцентным цветом выделить только блок Code locations.
    - Текст на русском, без логотипов.
# ── PART 5 · Обучение, MLflow и продакшен — коротко ─────────────────────────────────────
- kind: content
  id: 035-ml-lifecycle-prodolzhenie-togo-zhe-grafa
  title: 'ML lifecycle — продолжение того же графа'
  bullets:
  - 'Сверху — территория dbt, снизу — территория ML; границы в графе нет'
  - Обучение, оценка, регистрация, инференс — такие же ассеты
  - Каждый узел — объект, который должен существовать
  - Не каждый узел считается внутри процесса Dagster
  code_lang: diagram
  code: |2
     ┌── D A T A ──────────────────┐
     │  raw                        │
     │   ↓                         │
     │  dbt staging                │
     │   ↓                         │
     │  dbt feature mart           │
     └──────────┬──────────────────┘
                ↓
     ┌── M L ───┴──────────────────┐
     │  training dataset           │
     │   ↓                         │
     │  train → evaluate → model   │
     │   ↓                         │
     │  predictions → monitoring   │
     └─────────────────────────────┘
         DAGSTER ASSET GRAPH
  notes: |2
    [41:54–43:06 · ~1.2 мин] **Главное:**
    - !!ML-часть — не отдельный пайплайн, а нижняя половина того же графа; ничего нового для неё учить не надо.!!

    **Рассказ:**
    - Верхняя рамка — то, что мы строили в блоке dbt; нижняя — обучение, оценка, модель, предсказания, мониторинг.
    - Каждый узел снизу — ассет с тем же декоратором, теми же проверками, партициями и условиями автоматизации.
    - Ответ на «поменялась колонка — что переобучать» — это ребро между рамками, `feature mart → training dataset`.
    - Тяжёлое обучение (GPU, Spark) уезжает наружу через Dagster Pipes: граф остаётся здесь, вычисление — там.

    **Что важно не перепутать:**
    - Это **не** ML-платформа: реестр, сервинг и трекинг экспериментов — отдельные системы; Dagster хранит про них ссылку в метаданных.

    **Takeaway:**
    - !!Один граф на данные и модели — единственная причина, по которой MLE нужен оркестратор.!!

    **Переход:**
    - ~~«Как это выглядит в коде и где здесь MLflow — один слайд».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/ml-pipelines
       Что взять: официальный пример ML-пайплайна на ассетах — скриншот графа.

    2. https://docs.dagster.io/guides/build/external-pipelines
       Что взять: одну картинку про Pipes — «граф здесь, вычисление там».

    **Промпт для генерации схемы:**
    - Плоская схема 16:9: две рамки одна над другой.
    - Верхняя с заголовком «DATA»: цепочка raw → dbt staging → dbt feature mart.
    - Нижняя с заголовком «ML»: training dataset → (train → evaluate → model) → predictions → monitoring.
    - Между рамками одна вертикальная стрелка от «dbt feature mart» к «training dataset», выделенная акцентным цветом и подписанная «стык».
    - Под обеими рамками подпись «DAGSTER ASSET GRAPH».
    - Рамки одинаковой ширины, без логотипов, текст на русском.
- kind: content
  id: 036-obuchenie-mlflow-i-prodakshen-korotko
  title: 'Обучение, MLflow и продакшен: коротко'
  bullets:
  - 'Гиперпараметры — dg.Config: задаются из интерфейса, CLI или сенсора'
  - 'MLflow — трекинг и реестр; Dagster хранит ссылку на run, не копию'
  - Оценка и регистрация — отдельные ассеты со шлюзом качества
  - Тяжёлое обучение уезжает наружу через Pipes, граф остаётся здесь
  code_lang: python
  code: |2
    class TrainConfig(dg.Config):  # параметры
        C: float = 1.0   # запуска: UI/CLI/сенсор

    @dg.asset(group_name="ml")
    def trained_model(
        config: TrainConfig,
        training_dataset: pd.DataFrame,
    ):
        X = training_dataset.drop(columns="target")
        y = training_dataset["target"]
        # MLflow — трекинг, Dagster — граф
        with mlflow.start_run() as run:
            clf = LogisticRegression(C=config.C)
            clf.fit(X, y)
            roc = roc_auc_score(
                y, clf.predict_proba(X)[:, 1])
            mlflow.log_metric("roc_auc", roc)
            info = mlflow.sklearn.log_model(
                clf, name="model")
        # downstream берёт URI; Dagster хранит
        # ССЫЛКУ на run, а не копию эксперимента
        return dg.Output(
            {"model_uri": info.model_uri},
            metadata={"run_id": run.info.run_id},
        )
  notes: |2
    [43:06–44:36 · ~1.5 мин] **Главное:**
    - !!Разделение ответственности: Dagster знает граф и «когда», MLflow помнит эксперименты и версии; связь — одна ссылка в метаданных.!!

    **Рассказ:**
    - `dg.Config` — типизированные параметры запуска: поле `C` видно в форме запуска в интерфейсе, задаётся из CLI и из сенсора.
    - Внутри — обычный MLflow: `start_run`, метрика, модель.
    - Dagster в этом не участвует.
    - На выходе два канала: значение для downstream — URI модели; метаданные — `run_id`.
    - Идентификатор запуска MLflow — единственная склейка двух миров.
    - Комментарий внизу — весь остальной lifecycle одной строкой: оценка, шлюз, регистрация, инференс — такие же ассеты; про них подробно — в основной версии лекции.

    **Что важно не перепутать:**
    - Не дублировать: метрики **в MLflow**, в метаданных Dagster — только то, что нужно графу (ссылка на запуск; при желании — одно число для графика).

    **Takeaway:**
    - !!Один run_id в метаданных — и из графа Dagster виден эксперимент, из MLflow — данные, на которых он обучен.!!

    **Переход:**
    - ~~«Теперь самый частый вопрос после лекции: а чем это отличается от Airflow, если он у нас уже есть?».~~

    **Визуальные опоры:**

    1. https://mlflow.org/docs/latest/ml/tracking/
       Что взять: скриншот run'а в MLflow с метрикой — правая половина «двух миров».

    2. https://docs.dagster.io/guides/build/external-pipelines
       Что взять: одну фразу про Pipes — куда уезжает тяжёлое обучение.
