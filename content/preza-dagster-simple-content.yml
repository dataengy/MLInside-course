    - Плоская схема 16:9 в виде дерева каталогов: корень «ml-platform/», ветви «pyproject.toml», «uv.lock», «src/ml_platform/» (внутри «definitions.py» и папка «defs/» с файлами «ml.py», «resources.py»), «tests/».
    - Папку «defs/» выделить единственным акцентным цветом и подписать «сюда кладём ассеты».
    - Справа от дерева стрелка-цикл с подписью: «файл добавили → Reload → ассет в UI».
