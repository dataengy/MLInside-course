- kind: content
  id: 038-odin-pajplajn-dve-mentalnye-modeli
  title: Один пайплайн — две ментальные модели
  bullets:
  - Слева описываем работу, справа — объекты
  - Слева граф соединяем сами, справа он выводится из кода
  - Разница не в возможностях, а в том, что является единицей графа
  - Колонки подписаны моделями, а не продуктами — намеренно
  code_lang: diagram
  code: |2
     TASK-CENTRIC        ASSET-CENTRIC
     ────────────────    ────────────────
     task: run dbt       asset: dbt-модели
        ↓                   ↓
     task: features      asset: features
        ↓                   ↓
     task: train         asset: model
        ↓                   ↓
     task: evaluate      asset: evaluation
        ↓                   ↓
     task: register      asset: registered

     задача → задача     ассет → ассет
     статус: успех/сбой  статус: свежий/устарел
  notes: |2
    [44:54–46:06 · ~1.2 мин] **Главное:**
    - !!Ось сравнения одна: оркестрация работы против оркестрации жизненного цикла объектов.!!

    **Рассказ:**
    - Слева и справа — один и тот же пайплайн, описанный двумя способами.
    - Слева единица графа — работа: «запусти dbt», «обучи», «зарегистрируй»; статус — успех или сбой.
    - Справа единица графа — объект: «модель», «зарегистрированная версия»; статус — свежий или устарел.
    - Строка про dbt: слева одна задача на весь проект (типовой случай, не предел), справа — набор ассетов.
    - Колонки подписаны моделями, потому что **Airflow 3 умеет правую колонку** — вопрос в том, что стоит в центре.

    **Что важно не перепутать:**
    - Не произносить «Airflow ничего не знает о данных» — это было неточно уже для 2.4 и неверно для 3.

    **Takeaway:**
    - !!Сравниваем две модели мышления, а не два лагеря.!!

    **Переход:**
    - ~~«Как правая колонка выглядит в Airflow 3 — кодом».~~

    **Визуальные опоры:**

    1. https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/assets.html
       Что взять: доказательство, что правая колонка доступна и в Airflow 3.

    2. https://docs.dagster.io/guides/build/assets
       Что взять: правую колонку в терминах Dagster.

    **Промпт для генерации схемы:**
    - Плоская схема 16:9: две вертикальные цепочки одинаковой длины рядом.
    - Левая с заголовком «TASK-CENTRIC»: пять прямоугольников «task: run dbt», «task: features», «task: train», «task: evaluate», «task: register», соединённые стрелками вниз.
    - Правая с заголовком «ASSET-CENTRIC»: «asset: dbt-модели», «asset: features», «asset: model», «asset: evaluation», «asset: registered».
    - Парные узлы соединить тонкими серыми горизонтальными линиями.
    - Внизу под колонками две подписи: «задача → задача · статус: успех/сбой» и «ассет → ассет · статус: свежий/устарел».
    - Колонки не подкрашивать в «плохой» и «хороший» цвет.
