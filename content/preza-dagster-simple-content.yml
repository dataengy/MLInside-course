  title: 'Что создалось: структура проекта'
  bullets:
  - 'defs/ — единственная папка, которую вы правите'
  - Всё, что лежит в defs/, загружается автоматически
  - 'definitions.py — точка входа, руками трогать не нужно'
  - Добавили файл — ассет виден в интерфейсе после перезагрузки
  code_lang: diagram
