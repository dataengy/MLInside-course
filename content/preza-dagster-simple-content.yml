- kind: content
  id: 042-cosmos-dbt-proekt-kak-dag-airflow
  title: 'Cosmos: dbt-проект как DAG Airflow'
  bullets:
  - 'Читает тот же manifest.json, что и dagster-dbt'
  - 'Каждая модель — задача run, рядом — задача test'
  - 'Проект, профиль, рендер — три конфига; исполнение — четвёртый'
  - Выпускает ассет Airflow на модель — downstream можно повесить на него
  code_lang: python
  code: |2
    # astronomer-cosmos: dbt-проект → DAG Airflow
    from cosmos import (DbtDag, ProjectConfig,
        ProfileConfig, RenderConfig)
    from cosmos.constants import LoadMode
    from cosmos.constants import TestBehavior

    analytics_dbt = DbtDag(
        dag_id="analytics_dbt",
        project_config=ProjectConfig(
            "/opt/dbt",   # где проект
            manifest_path="target/manifest.json",
        ),
        profile_config=ProfileConfig(  # подключение
            profile_name="analytics",
            target_name="prod",
            profiles_yml_filepath="profiles.yml",
        ),
        render_config=RenderConfig(
            # тот же manifest.json, что у Dagster
            load_method=LoadMode.DBT_MANIFEST,
            select=["path:models/marts"],  # выборка
            # тест — отдельная задача за моделью
            test_behavior=TestBehavior.AFTER_EACH,
        ),
        schedule="@daily",
        start_date=datetime(2026, 1, 1),
    )
  notes: |2
    [50:12–51:42 · ~1.5 мин] **Главное:**
    - !!Cosmos разворачивает тот же манифест в гранулярный DAG: модель — задача, тест — задача рядом; это зрелый инструмент, а не костыль.!!

    **Рассказ:**
    - `DbtDag` — DAG целиком из dbt-проекта; есть и `DbtTaskGroup`, чтобы встроить проект внутрь большего DAG.
    - Три конфига на слайде: проект (где лежит), профиль (как подключаться — файл или Connection Airflow), рендер (что и как разворачивать); четвёртый, `ExecutionConfig`, задаёт, какой бинарник dbt запускать, — опущен для краткости.
    - `RenderConfig` — самое важное: `LoadMode.DBT_MANIFEST` читает готовый манифест (путь к нему — `manifest_path` в `ProjectConfig`), `select` — выборка dbt, `test_behavior` — тесты после каждой модели, после всех или через `build`.
    - Результат в интерфейсе Airflow — группа задач по моделям с рёбрами из `ref()`; частичный перезапуск — по задачам.
    - Cosmos выпускает ассет Airflow на каждую модель, так что планирование по данным поверх dbt тоже доступно.

    **Что важно не перепутать:**
    - Сравнение «Airflow — один шаг dbt build, Dagster — граф моделей» — **неверно**: с Cosmos граф моделей есть и там.

    **Осторожно:**
    - Cosmos меняется быстро; сверить имена параметров с документацией текущей версии.

    **Takeaway:**
    - !!Оба умеют манифест; вопрос — во что превращается узел и куда он ведёт дальше.!!

    **Переход:**
    - ~~«Именно это — на одной схеме».~~

    **Визуальные опоры:**

    1. https://astronomer.github.io/astronomer-cosmos/getting_started/open-source.html
       Что взять: канонический пример DbtDag — сверить с нашим.

    2. https://astronomer.github.io/astronomer-cosmos/configuration/render-config.html
       Что взять: параметры RenderConfig — load_method, select, test_behavior.

    3. https://astronomer.github.io/astronomer-cosmos/configuration/testing-behavior.html
       Что взять: скриншот DAG с парами run/test — главный визуал слайда.
- kind: content
  id: 043-cosmos-protiv-dagster-dbt
  title: Cosmos против dagster-dbt
  bullets:
  - Оба читают один и тот же manifest.json
  - Оба разворачивают проект по моделям, а не в один шаг
  - 'Разница — во что превращается узел: задача или ассет'
  - 'И куда узел продолжается: конец DAG или ML-ассеты'
  code_lang: diagram
  code: |2
                 dbt manifest.json
                        ↓
     ┌──────────────────┬──────────────────┐
     │ COSMOS           │ DAGSTER-DBT      │
     │                  │                  │
     │ узел → задача    │ узел → ассет     │
     │ (+ ассет Airflow)│                  │
     │ тест → задача    │ тест → asset     │
     │                  │        check     │
     │ модель DAG       │ модель графа     │
     │ Airflow          │ ассетов          │
     └────────┬─────────┴────────┬─────────┘
              ↓                  ↓
     конец DAG или         training_dataset
     событие ассета        → trained_model
  notes: |2
    [51:42–52:54 · ~1.2 мин] **Главное:**
    - !!Вход одинаковый — манифест; разница в том, чем становится узел и куда он продолжается.!!

    **Рассказ:**
    - Сверху один вход — манифест; обе колонки одинаковой ширины, и это намеренно.
    - У Cosmos узел — задача внутри DAG: у неё есть запуск и статус; тест — задача рядом; плюс ассет Airflow, чтобы планировать по данным.
    - У dagster-dbt узел — ассет: материализации, метаданные, проверки, партиции — и downstream в виде Python-ассетов.
    - Нижняя строка — практический критерий: если dbt — конечная точка, разница невелика; если граф должен продолжаться в обучение, правая колонка даёт это без склейки.

    **Когда что:**
    - Cosmos — Airflow уже стоит, команда его знает, dbt завершает пайплайн. dagster-dbt — dbt-граф обязан продолжаться в ML-артефакты с проверками и партициями на тех же узлах.

    **Что важно не перепутать:**
    - Не тащить Dagster ради одного dbt-проекта из пяти моделей, который живёт в существующем Airflow.

    **Takeaway:**
    - !!Сравнивать не «умеет ли манифест», а во что превращается узел и куда он ведёт.!!

    **Переход:**
    - ~~«И самый практичный вопрос: а если Airflow уже стоит?».~~

    **Визуальные опоры:**

    1. https://astronomer.github.io/astronomer-cosmos/getting_started/index.html
       Что взять: как Cosmos разворачивает манифест в группу задач — левая колонка.

    2. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: правую колонку — те же узлы как ассеты.

    3. https://docs.getdbt.com/reference/artifacts/manifest-json
       Что взять: общий вход — доказательство, что источник одинаковый.

    **Промпт для генерации схемы:**
    - Плоская схема 16:9.
    - Сверху один прямоугольник «dbt manifest.json», от него развилка на две колонки одинаковой ширины: «COSMOS» и «DAGSTER-DBT».
    - В левой три строки: «узел → задача (+ ассет Airflow)», «тест → задача», «модель DAG Airflow».
    - В правой: «узел → ассет», «тест → asset check», «модель графа ассетов».
    - Под каждой колонкой стрелка вниз: слева к подписи «конец DAG или событие ассета», справа к цепочке «training_dataset → trained_model».
    - Колонки не делать разной высоты или яркости.
    - Текст на русском.
- kind: content
  id: 044-sosuschestvovanie-airflow-ostaetsya-dagster-ryadom
  title: 'Сосуществование: Airflow остаётся, Dagster рядом'
  bullets:
  - Работающий Airflow не мигрируют ради красоты модели
  - 'Типовая схема: новый data/ML-домен в Dagster, старое на месте'
  - 'Связь — событие, а не общий доступ к узлам'
  - 'dagster-airlift: наблюдать, разметить, перенести — по кусочкам'
  code_lang: diagram
  code: |2
     СУЩЕСТВУЮЩАЯ ПЛАТФОРМА
     ──────────────────────────
     Airflow 3
      ├ legacy DAG
      ├ интеграции и выгрузки
      ├ Cosmos: dbt, где он конечен
      └ бизнес-процессы
           │
           ↓ событие / airlift
     НОВЫЙ ДОМЕН DATA + ML
     ──────────────────────────
     Dagster
      ├ ассеты загрузки
      ├ dagster-dbt
      ├ витрины признаков
      └ модели и lifecycle

     один владелец на артефакт
  notes: |2
    [52:54–54:06 · ~1.2 мин] **Главное:**
    - !!Сосуществование — нормальное целевое состояние, а не переходный этап.!!

    **Рассказ:**
    - У большинства компаний Airflow работает и приносит пользу; замена ради модели данных не окупается.
    - Типовая схема: Airflow владеет интеграциями, выгрузками, legacy и бизнес-процессами — и dbt там, где он конечная точка; Dagster берёт новый домен: данные, dbt-граф, который идёт в ML, модели.
    - Связь — событие и статус, не общий доступ к узлам.
    - `dagster-airlift` — официальный путь постепенного переноса: увидеть Airflow внутри Dagster, разметить DAG в ассеты, перенести исполнение задача за задачей, снять со старой стороны.
    - Без дня X.

    **Что важно не перепутать:**
    - Airlift — **инструмент переноса**, а не автоматический конвертер DAG в ассеты: разметку смысла делает человек.
    - У каждого артефакта ровно один владелец-оркестратор; Airflow не пересчитывает то, чем владеет Dagster, и наоборот.

    **Takeaway:**
    - !!Несколько оркестраторов — нормально; несколько хозяев у одного артефакта — нет.!!

    **Переход:**
    - ~~«Сведём блок в три вопроса».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/migration/airflow-to-dagster
       Что взять: карту способов перехода и их предпосылки.

    2. https://docs.dagster.io/migration/airflow-to-dagster/airlift-v1
       Что взять: четыре шага Airlift — наблюдать, разметить, перенести, снять.

    **Промпт для генерации схемы:**
    - Плоская схема 16:9: два прямоугольника-этажа один над другим.
    - Верхний с заголовком «СУЩЕСТВУЮЩАЯ ПЛАТФОРМА · Airflow 3» и списком: legacy DAG, интеграции и выгрузки, Cosmos (dbt, где он конечен), бизнес-процессы.
    - Нижний с заголовком «НОВЫЙ ДОМЕН DATA + ML · Dagster» и списком: ассеты загрузки, dagster-dbt, витрины признаков, модели и lifecycle.
    - Между этажами одна стрелка вниз с подписью «событие / airlift».
    - Внизу подпись «один владелец на артефакт».
    - Без двусторонних стрелок между содержимым этажей.
    - Текст на русском.
- kind: content
  id: 045-sbalansirovannyj-vyvod-tri-voprosa
  title: 'Сбалансированный вывод: три вопроса'
  bullets:
  - Airflow 3 — зрелый универсальный оркестратор, и он умеет ассеты
  - Dagster строит всю платформу вокруг графа ассетов
  - Выбор определяется нагрузкой, тем, что уже стоит, и тем, где кончается dbt
  - Стоимость перехода — отдельный фактор, а не мелочь
  code_lang: diagram
  code: |2
     ЧТО СПРОСИТЬ У СЕБЯ
     ──────────────────────────────
     Что у меня за нагрузка?
       разнородные процессы  → Airflow 3
       data + ML lifecycle   → Dagster

     Что уже стоит?
       большой Airflow → не трогать,
       новый домен     → Dagster рядом

     Где кончается dbt-граф?
       на витринах     → Cosmos хватает
       идёт в обучение → dagster-dbt
  notes: |2
    [54:06–55:18 · ~1.2 мин] **Главное:**
    - !!Правильный вопрос не «кто лучше», а «какая нагрузка, что стоит и где кончается dbt-граф».!!

    **Рассказ:**
    - Три вопроса — готовый алгоритм для разговора с руководителем.
    - Нагрузка: разнородные корпоративные процессы — Airflow; связанный жизненный цикл данных и моделей — Dagster.
    - Существующий парк: большой работающий Airflow — актив, не долг; новый домен — рядом.
    - Третий вопрос — из блока dbt: если граф заканчивается на витринах, Cosmos закрывает задачу; если продолжается в обучение — dagster-dbt даёт это без склейки.
    - Стоимость: переход на Dagster — смена платформы; это другой порядок цены, чем обновление Airflow.

    **Что важно не перепутать:**
    - «Dagster не всегда лучше» — **факт, а не дипломатия**; следующий слайд — про то, когда он не нужен.

    **Takeaway:**
    - !!Три вопроса закрывают выбор лучше любой таблицы.!!

    **Переход:**
    - ~~«Честный слайд: когда Dagster не нужен».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/migration/airflow-to-dagster
       Что взять: цену перехода на другую платформу.

    2. https://airflow.apache.org/docs/apache-airflow/stable/release_notes.html
       Что взять: актуальную версию и свежие изменения — сверить перед выступлением.

    **Промпт для генерации схемы:**
    - Плоская схема 16:9 в виде трёх блоков сверху вниз, у каждого заголовок-вопрос и две ветки ответа со стрелками: «Что у меня за нагрузка?» → «разнородные процессы → Airflow 3» / «data + ML lifecycle → Dagster»; «Что уже стоит?» → «большой Airflow → не трогать» / «новый домен → Dagster рядом»; «Где кончается dbt-граф?» → «на витринах → Cosmos хватает» / «идёт в обучение → dagster-dbt».
    - Ветки не подкрашивать в правильные и неправильные.
    - Внизу одна строка: «стоимость перехода — отдельный фактор».
    - Текст на русском.
# ── PART 7 · Когда Dagster нужен и итоговая модель ──────────────────────────────────────
- kind: table
  id: 046-kogda-dagster-nuzhen-i-kogda-net
  title: Когда Dagster нужен — и когда не нужен
  table:
    headers: ['Особенно хорош, если', 'Не лучший выбор, если']
    rows:
    - ['Платформа построена вокруг dbt', 'Уже работает большой парк Airflow без явной боли']
