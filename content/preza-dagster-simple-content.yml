content:
- kind: title
  id: 001-orkestraciya-ml-pajplajnov-dagster-simple
  title: Оркестрация ML-пайплайнов на Dagster
  subtitle: 'Упрощённая версия: код, схемы, сравнение с Airflow 3 и Cosmos'
  notes: |2
    [00:00–00:42 · ~0.7 мин] **Главное:**
    - Это практикум по коду: почти каждый слайд — панель с кодом или схема, а текст объясняет, что в них происходит.

    **Рассказ:**
    - Поздороваться, назвать себя.
    - Сказать, ради чего лекция: у вас есть !!dbt-проект, признаки и обучение модели!! в трёх разных местах, и никто не знает, что от чего зависит.
    - Dagster — способ записать этот граф явно и спрашивать у него «что пересчитать».
    - Через двадцать минут вы поднимете Dagster у себя и увидите свой dbt-проект в его интерфейсе.

    **Осторожно:**
    - Не обещать «замену Airflow»: сравнению посвящён отдельный блок, и Airflow 3 там выглядит сильно.

    **Переход:**
    - ~~«План короткий, и он весь про практику».~~

    — Сгенерировано: model=claude-fable-5-1 · harness=Claude Code · effort=max · version=v1.0.0 · 2026-09-04
