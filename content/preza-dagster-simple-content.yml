# ── PART 8 · ДЗ и финал ──────────────────────────────────────────────────────────────────
- kind: content
  id: 048-dz-orkestriruem-dbt-proekt-v-dagster
  title: 'ДЗ: оркестрируем dbt-проект в Dagster'
  bullets:
  - 'Датасет прежний: Olist Brazilian E-Commerce в ClickHouse'
  - Обернуть dbt через компонент или @dbt_assets, команда build
  - 'Ресурсы: ClickHouse и dbt, секреты через EnvVar'
  - 'Главное: ингест-ассеты — РОДИТЕЛИ dbt-графа через translator'
  - Расписание, две проверки на сырой слой, сенсор на падение
  - Скриншот графа ассетов и лог успешного запуска — в отчёт
  code_lang: diagram
  code: |2
     orchestration/
       src/olist_orchestration/
         defs/dbt/defs.yaml  # DbtProjectComponent
         translator.py       # ключи источников =
                             # ключи ингест-ассетов
         defs/raw.py         # 8 ассетов CSV → raw.*
         defs/resources.py   # ClickHouse + DbtCli
         defs/checks.py      # проверки сырого слоя
         defs/schedules.py   # витрины по cron
         defs/sensors.py     # приход данных / сбой
       tests/                # materialize_to_memory
     dbt/                    # ваш проект, БЕЗ копий
  notes: |2
    [57:54–59:24 · ~1.5 мин] **Главное:**
    - !!ДЗ — это Level 2 из блока dbt на вашем собственном проекте: загрузка → dbt → проверки, одним графом.!!

    **Рассказ:**
    - Каркас на схеме — не обязательный, а отправная точка; важна не раскладка файлов, а связность графа.
    - Шаг 1: компонент или `@dbt_assets`, команда `build`, ресурсы ClickHouse и dbt с `EnvVar`.
    - Шаг 2 — главный: восемь ингест-ассетов (CSV → raw) обязаны быть **родителями** dbt-источников; для этого — свой translator или `meta.dagster.asset_key`.
    - Висячие источники — минус балл.
    - Шаг 3: расписание на витрины, две проверки на сырой слой, сенсор на падение.
    - В отчёт — скриншот связного графа и лог запуска.

    **Что важно не перепутать:**
    - dbt-проект **не копировать** в папку оркестрации: DbtProject указывает на него по пути.

    **Takeaway:**
    - !!Критерий один — граф связный: от CSV до витрины без разрывов.!!

    **Переход:**
    - ~~«Баллы — таблицей».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: раздел про upstream-источники — ключ к главному пункту ДЗ.

    2. https://docs.dagster.io/integrations/libraries/clickhouse
       Что взять: ресурс ClickHouse — или писать свой на ConfigurableResource.

    **Промпт для генерации схемы:**
    - Плоская схема 16:9 в виде дерева каталогов проекта: корень «orchestration/», внутри «src/olist_orchestration/» с файлами «defs/dbt/defs.yaml» (подпись «DbtProjectComponent»), «translator.py» (подпись «ключи источников = ключи ингест-ассетов», выделить акцентом), «defs/raw.py» (8 ассетов CSV → raw), «defs/resources.py» (ClickHouse + DbtCli), «defs/checks.py», «defs/schedules.py», «defs/sensors.py»; рядом «tests/» и отдельно на том же уровне «dbt/» с подписью «ваш проект, без копий».
    - Моноширинный шрифт, текст на русском.
- kind: table
  id: 049-dz-kriterii-ocenki
  title: 'ДЗ: критерии оценки'
  table:
    headers: ['Баллы', 'Что должно быть сделано']
    rows:
    - ['6–7', 'dbt-проект обёрнут ассетами; ресурсы ClickHouse и dbt настроены; секреты через EnvVar; поднимается dg dev, проходит ручная материализация; граф ассетов виден в интерфейсе']
    - ['8–9', 'всё выше + ингест-ассеты как РЕАЛЬНЫЕ РОДИТЕЛИ dbt-графа через translator или meta.dagster.asset_key (граф связный, без висячих источников) + расписание + минимум две проверки на сырой слой + сенсор на падение + метаданные материализаций']
    - ['10', 'всё выше + сенсор на приход данных (landing-зона или заглушка с задокументированным путём миграции) + dg check defs в CI + один нетривиальный элемент: партиции с выполненным бэкфиллом, политика свежести, declarative automation или запуск в Docker']
    col_ratios: [2, 9]
  notes: |2
    [59:24–60:42 · ~1.3 мин] **Главное:**
    - !!Базовые баллы — за то, что граф поднялся; высокие — за то, что он связный и живёт сам.!!

    **Рассказ:**
    - 6–7: подключили, подняли, материализовали руками — Level 1.
    - 8–9: граф связный (ингест — родители dbt), расписание, проверки, сенсор — Level 2 плюс обвязка.
    - 10: сенсор на приход данных, проверка определений в CI и один элемент по выбору — из тех, что были кодом на слайдах.

    **Что важно не перепутать:**
    - «Граф связный» проверяется **по скриншоту**: если dbt-источники висят без родителей, это 7, а не 9.

    **Takeaway:**
    - !!Всё, что нужно для десяти баллов, было на слайдах кодом.!!

    **Переход:**
    - ~~«Спасибо. Вопросы».~~
