- kind: content
  id: 022-ci-vosem-dzhobov
  title: 'CI: восемь джобов GitHub Actions'
  code_caption: .github/workflows/ci.yml — гейты на каждый push и PR
  code: "jobs:\n  lint                # ruff\n  typecheck           # pyright strict\n  test         \
    \       # unit-тесты\n  e2e                 # реальный прогон; ставит Bruin CLI — гоняет оба primary-движка\n\
    \  bash-lint           # дисциплина shell-скриптов\n  commit-binding      # каждый коммит привязан\
    \ к issue (Refs / Closes #N)\n  structure-validate  # структура репозитория как проверяемый закон\n\
    \  secret-scan         # секреты не проезжают в историю\n"
  bullets:
  - Локальный гейт равен CI-гейту — make check / make ci
  - E2E — не мок, а реальный прогон на сэмпл-данных
  - commit-binding — трассируемость каждого коммита до задачи
  - structure-validate — даже раскладка каталогов под тестом
  notes: 'CI — **восемь джобов**, и состав показателен. Кроме стандартной тройки lint/typecheck/test здесь:
    !!e2e с реальным прогоном обоих primary-движков!! (джоб ставит Bruin CLI), **commit-binding** — каждый
    коммит обязан ссылаться на issue, **structure-validate** — раскладка репозитория проверяется как код,
    и **secret-scan**.


    Идея гейтов: __локально и в CI выполняется одно и то же__ (`make check` / `make ci`), поэтому «у меня
    работало» не является состоянием. Для showcase-проекта это особенно важно: гейты — то, что превращает
    демо в инженерный артефакт. ~~commit-binding — редкий гость даже в продакшен-репозиториях.~~

    '
- kind: section
  id: 023-inzhenernaya-disciplina
  title: Инженерная дисциплина
  notes: 'Блок о том, что отличает этот проект как __портфолио уровня Senior/Staff__: не список технологий,
    а привычки.


    Четыре примера: правило «defer, don''t fake», ADR-след, стандарты с конформанс-тестами и честный деферрал
    целого слоя.

    '
- kind: content
  id: 024-defer-dont-fake
  title: «Defer, don't fake»
  bullets:
  - Недостроенную зависимость нельзя тихо заглушить
  - 'Заглушка обязана быть громкой: warning в логах + запись в techdebt-реестре'
  - Прогон «зелёный, но втайне ничего не сделал» — запрещён
  - Граница построенного всегда видна снаружи
  notes: 'Правило проекта: если строишь поверх ещё не существующей части — !!отложи честно, не имитируй!!.
    Разрешённая форма — **громкая заглушка**: она кричит в логи о том, чего не делает, и оставляет след
    в **techdebt-реестре**. Запрещённая форма — молчаливый no-op, который делает прогон зелёным, ничего
    не выполнив.


    Это правило дорогого стоит именно в demo-проектах, где велик соблазн «казаться готовым». Здесь выбрано
    обратное: __граница между построенным и отложенным всегда наблюдаема__ — по логам, по реестру, по
    issue. Пример на этом же прогоне: DQ-шаг одного из сетапов отгружен как loud-stub — и об этом сказано
    вслух. ~~Следующие три слайда — это же правило в трёх других формах.~~

    '
