- kind: content
  id: 019-prefect-orkestraciya
  title: Prefect 3 — оркестрация всех сетапов
  materials:
  - label: Prefect — документация
    url: https://docs.prefect.io
  code_caption: pipelines/_shared/steps.py — одна фабрика флоу на любой движок
  code: "def make_engine_flow(engine: str, ...) -> Flow:\n    raw_key     = f\"file://ogip/{engine}/raw/rawg__games\"\
    \n    scraped_key = f\"file://ogip/{engine}/raw/scraped\"    # скрейпинг — first-class asset\n   \
    \ core_key    = f\"duckdb://ogip/{engine}/core.game\"\n    fs_key      = f\"duckdb://ogip/{engine}/fs.market_features\"\
    \n    out_key     = f\"file://ogip/{engine}/outputs/games.parquet\"\n    ...\n"
  bullets:
  - Prefect 3 — платформенный оркестратор всех сетапов (ADR-0007)
  - Одна фабрика флоу — движок подставляется параметром
  - Asset-ключи неймспейсятся по движку — lineage не смешивается
  - Скрейпинг — отдельный узел графа, не спрятан внутри ингеста
  notes: 'Оркестрация — **Prefect 3** (ADR-0007). Устройство симметрично компилятору: !!одна фабрика `make_engine_flow`!!,
    в которую движок передаётся параметром — шесть сетапов не означают шесть скопированных пайплайнов.


    Две детали, которые выдают продуманность. Первая: __asset-ключи неймспейсятся по движку__ — когда
    несколько сетапов бегут в одно warehouse, их lineage в UI не слипается. Вторая: **скрейпинг — first-class-ассет**,
    отдельный узел графа с собственной линией происхождения, а не побочный эффект внутри ингеста RAWG.
    ~~Мелочи, но именно на таких мелочах мульти-engine-платформы обычно и разваливаются.~~

    '
