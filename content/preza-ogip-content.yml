content:
- kind: title
  id: 001-ogip-open-games-intelligence-platform
  title: OGIP — Open Games Intelligence Platform
  subtitle: Один spec — три взаимозаменяемых engine-сетапа
  notes: 'Это **showcase-презентация** одного инженерного проекта: **OGIP** — открытая платформа market
    intelligence для игровой индустрии. Продукт платформы — !!ML-ready Parquet-датасеты!!, а главный архитектурный
    ход — единый `spec/`, из которого **генерируются** несколько взаимозаменяемых движков трансформаций.


    Аудитория — __senior-ревьюер по данным и архитектуре__: смотрим не «какие технологии потрогали», а
    **какие решения приняты, чем они доказаны и насколько они обратимы**. Все утверждения в презентации
    проверены по репозиторию на 2026-07-30. ~~Ссылка на код — github.com/dataengy/ogip, встретится на
    слайдах.~~


    — Сгенерировано: model=claude-fable-5 · harness=Claude Code · effort=max · version=v1.0 · 2026-07-30'
- kind: agenda
  id: 002-plan-prezentacii
  title: План
  bullets:
  - 'Продукт: ML-ready Parquet-датасеты по игровому рынку'
  - spec/ — единственный источник истины
  - Компилятор спеки — шесть раннабл engine-проектов
  - 'Три demo-guaranteed команды: dbt, Bruin, Dagster-комбо'
  - Стек и CI-гейты
  - 'Дисциплина: ADR, конформанс-тесты, честные деферралы'
  - Обратимость — смена primary-движка без переписывания
  notes: 'Порядок рассказа — от продукта к архитектуре и от архитектуры к дисциплине. Сначала __что платформа
    отдаёт наружу__ и из каких источников это собрано, затем **дизайн-хребет** — `spec/` и компилятор,
    потом !!три команды, которые гарантированно проходят end-to-end!!.


    Финал — самое интересное для архитектурного ревью: **обратимость решений**. Смена primary-движка в
    этом проекте — задокументированный флип конфига и гейтов, а не переписывание, и мы покажем, почему
    так получилось. ~~Каждый блок опирается на реальные файлы и цифры из репозитория.~~

    '
- kind: section
  id: 003-produkt-i-dannye
  title: Продукт и данные
  notes: 'Первый блок — продуктовый. Прежде чем обсуждать архитектуру, фиксируем, __что именно платформа
    производит__ и из чего.


    Это важно для оценки: все инженерные решения дальше имеют смысл только относительно **продукта — датасетов**
    и **гетерогенных источников**, из которых они собираются.

    '
- kind: content
  id: 004-chto-takoe-ogip
  title: Что такое OGIP
  materials:
  - label: OGIP — GitHub
    url: https://github.com/dataengy/ogip
  bullets:
  - OSS-платформа market intelligence для игровой индустрии
  - 'Продукт — данные: ML-ready Parquet-датасеты для DS/ML/аналитиков'
  - Гетерогенные источники — публичный API плюс четыре скрейпера
  - Целевая планка — production-grade, а не ноутбук с демо
  - 'Код открыт: github.com/dataengy/ogip'
  notes: '**OGIP** — Open Games Intelligence Platform. Домен — игровой рынок: каталог игр, оценки критиков,
    цены консольных изданий, онлайн игроков. Ключевая продуктовая рамка: !!продукт — это датасеты, а не
    дашборд и не API!!. Потребитель — DS/ML-инженер или аналитик, который берёт готовый Parquet и работает
    дальше.


    Такая рамка сразу задаёт критерии качества: __воспроизводимость прогона, контракты на данные, проверки
    качества и наблюдаемая линия происхождения__ важнее красивого фронтенда. Весь код открыт — рекомендую
    смотреть презентацию рядом с репозиторием. ~~Всё, что дальше, можно проверить по ссылке.~~

    '
- kind: content
  id: 005-produkt-ml-ready-parquet
  title: 'Продукт: ML-ready Parquet-датасеты'
  code_caption: outputs/ — контракт с потребителем данных
  code: "outputs/\n  games.parquet            # core.game — каноническая таблица игр\n  market_features.parquet\
    \  # fs.market_features — фичи рынка\n  ml_features.parquet      # итоговая фича-матрица\n  ml_train.parquet\
    \         # train-сплит\n  ml_test.parquet          # test-сплит\n\n# pipelines/_shared/steps.py —\
    \ publish_outputs()\ncounts = {\n    \"games.parquet\":           export_table(wh, \"core.game\",\
    \ ...),\n    \"market_features.parquet\": export_table(wh, \"fs.market_features\", ...),\n}\n"
  bullets:
  - Выход пайплайна — файлы, которые можно отдать в ML как есть
  - games + market_features + ml_train / ml_test
  - Экспорт витрин из DuckDB в Parquet — последний шаг каждого прогона
  - Row counts логируются — успех прогона проверяем по цифрам
  notes: 'Выходной контракт минималистичен и понятен: **games.parquet** — каноническая таблица игр из
    слоя `core`, **market_features.parquet** — фичи рынка из feature-store-слоя `fs`, плюс !!готовые ml_train
    / ml_test сплиты!! для обучения.


    Обратите внимание на последнюю строку буллетов: __каждый прогон возвращает row counts по каждому файлу__.
    Это мелочь, которая дисциплинирует: «пайплайн прошёл» означает не «код не упал», а «выходные датасеты
    действительно наполнены, и вот числа». ~~На сэмпл-данных это по 5 строк — но проверяется весь путь
    до файла.~~

    '
- kind: table
  id: 006-istochniki-api-plus-skrejpery
  title: 'Источники: один API + четыре скрейпера'
  table:
    headers:
    - Источник
    - Тип
    - Как забираем
    - Что даёт
    rows:
    - - RAWG
      - API
      - dlt REST-source
      - каталог игр — спайн платформы
    - - Metacritic
      - скрейпинг
      - JSON-LD парсер
      - оценки критиков (metascore)
    - - OpenCritic
      - скрейпинг
      - HTML/JSON парсер
      - вторая система оценок критиков
    - - SteamCharts
      - скрейпинг
      - HTML-таблицы
      - онлайн игроков — traction
    - - PSN
      - скрейпинг
      - concept-страницы
      - цены консольных изданий
    col_ratios:
    - 2
    - 2
    - 3
    - 4
  notes: 'Источники намеренно **гетерогенные**: один нормальный API (**RAWG**, забирается через **dlt**)
    и !!четыре скрейпера!! с совершенно разной механикой извлечения — JSON-LD, HTML-парсинг, табличные
    страницы. Это честная имитация реального ландшафта: удобного API на всё не бывает.


    Инженерное следствие: __на каждый источник есть ODCS-контракт и своя staging-модель__ — скрейпер без
    контракта в этом проекте считается демо, а не источником. Скрейпинг при этом виден в графе прогона
    как отдельный ассет, а не спрятан внутри загрузки. ~~К контрактам вернёмся в блоке про spec/.~~

    '
- kind: content
  id: 007-sloi-raw-stg-core-fs
  title: 'Слои: raw → stg → core → fs'
  code_caption: 'Линия данных (ADR-0001: имена слоёв — закон, без medallion)'
  code: "raw.rawg__games   raw.metacritic__game   raw.opencritic__game  (+psn, steamcharts)\n     │  \
    \                  │                      │\n     ▼                    ▼                      ▼\n\
    stg_games        stg_metacritic_games    stg_opencritic_games ...\n     └───────────┬────────────────┬─────────────┘\n\
    \                 ▼                ▼\n             core.game     core.critic_reception / traction\
    \ / console_pricing\n                 │                │\n                 └───────┬────────┘\n  \
    \                       ▼\n                fs.market_features  ──►  outputs/*.parquet\n"
  bullets:
  - 'Четыре слоя: raw → stg → core → fs'
  - Никакого «bronze / silver / gold» — имена слоёв зафиксированы ADR-0001
  - Warehouse — DuckDB, весь прогон воспроизводим локально
  - fs — feature-store-слой, вход для ML-шага
  notes: 'Слоёв четыре, и их имена — !!закон проекта, зафиксированный ADR-0001!!: `raw` — как приехало,
    `stg` — типизация и чистка, `core` — доменные сущности и кросс-source модели, `fs` — фичи. **Medallion-лексика
    запрещена сознательно**: bronze/silver/gold ничего не говорят о содержимом слоя.


    Хранилище — **DuckDB**: весь прогон, включая warehouse, живёт локально и воспроизводится одной командой.
    __Кросс-source модели (critic_reception, traction, console_pricing) собирают сигналы разных источников
    вокруг одной игры__ — ради этого источники и матчатся в staging. ~~Схема на слайде — фактическая линия
    зависимостей из spec/.~~

    '
- kind: section
  id: 008-spec-edinstvennyj-istochnik-istiny
  title: spec/ — единственный источник истины
  notes: 'Центральный блок презентации. `spec/` — это __дизайн-хребет платформы__: контракты, SQL-модели
    и стандарты в одном каталоге.


    Всё остальное — dbt-проект, Bruin-проект, SQLMesh-проект — !!производные артефакты!!, которые из этого
    каталога генерируются.

    '
- kind: content
  id: 009-chto-lezhit-v-spec
  title: Что лежит в spec/
  code_caption: spec/ — контракты + модели + стандарты
  code: "spec/\n  contracts/   # ODCS-контракты источников: rawg, metacritic, opencritic,\n          \
    \     # psn, steamcharts, ... (реестр шире активной пятёрки)\n  sql/         # 16 SQL-моделей: raw/\
    \ staging/ core/ fs/\n  dq/          # политика качества данных\n  ODTS/        # Open Declarative\
    \ Transform Spec — стандарт заголовка моделей\n  ODOS/        # Open Declarative Orchestration Spec\
    \ + JSON-schema\n"
  bullets:
  - Один каталог отвечает и за «что за данные», и за «как считаем»
  - ODCS-контракт на каждый источник
  - 16 SQL-моделей с декларативными заголовками
  - Стандарты ODTS / ODOS 0.1 — со спекой, схемой и фикстурами
  notes: '`spec/` собирает в одном месте три вещи: **ODCS-контракты** источников (что нам обещает upstream),
    !!16 SQL-моделей!! по слоям raw/staging/core/fs (как из этого считаются витрины) и **стандарты ODTS/ODOS**
    — формализацию того, как эти модели и оркестрация описываются.


    Смысл для ревью: __нет второго места, где «на самом деле» живёт логика__. Правка модели, контракта
    или проверки качества делается здесь — и только здесь; всё, что исполняется, из этого каталога выводится
    автоматически. ~~Число 16 — фактическое количество .sql-файлов в spec/sql на сегодня.~~

    '
- kind: content
  id: 010-model-sql-plus-odts-zagolovok
  title: Модель = SQL + декларативный заголовок
  materials:
  - label: spec/ в репозитории OGIP
    url: https://github.com/dataengy/ogip/tree/main/spec
  code_caption: spec/sql/staging/stg_metacritic_games.sql — реальный заголовок (ODTS 0.1)
  code: "/* @bruin\nname: staging.stg_metacritic_games\ntype: duckdb.sql\nmaterialization: {type: table}\n\
    depends:\n  - raw.metacritic__game          # ← lineage\ncolumns:\n  - name: slug\n    type: varchar\n\
    \    checks: [{name: not_null}, {name: unique}]     # ← DQ\n  - name: metascore\n    type: integer\n\
    \    checks: [{name: between, args: [0, 100]}]\n@bruin */\nselect slug, name, try_cast(released as\
    \ date) as released_date, ...\nfrom raw.metacritic__game\n"
  bullets:
  - Каждая модель — обычный SQL-файл с декларативной шапкой
  - depends — граф зависимостей (lineage)
  - columns[].checks — проверки качества данных
  - Словарь директив закрыт стандартом ODTS 0.1
  notes: 'Единица спеки — **SQL-файл с декларативным заголовком** в формате ODTS 0.1 (`@bruin`-совместимом).
    Из `depends` строится !!граф зависимостей!!, из `columns[].checks` — !!проверки качества!!, из `owner`/`tags`
    — владение и расписание. На слайде — реальный файл из репозитория, не идеализация.


    Почему это сильный ход: __lineage и DQ перестают быть отдельными системами__, которые могут разъехаться
    с кодом, — они часть той же строки, что и SQL. А закрытый словарь директив (стандарт ODTS 0.1) не
    даёт заголовку мутировать в свалку метаданных. ~~Bruin читает такой файл вообще без перевода — это
    станет важно через три слайда.~~

    '
- kind: content
  id: 011-spec-kompilyator
  title: 'Spec-компилятор: из спеки — раннабл-проекты'
  code_caption: src/ogip/spec_compile — движки генерируются, а не форкаются
  code: "from ogip.spec_compile import (\n    compile_to_dbt,               # spec/sql → models/*.sql\
    \ + schema.yml (+ tests)\n    compile_to_bruin,             # → Bruin-проект (заголовок уже нативный)\n\
    \    compile_to_sqlmesh_over_dbt,  # → SQLMesh поверх сгенерированного dbt\n)\n\n# transform/engines.py\
    \ (докстринг, дословно):\n# \"Each engine project is regenerated from spec/ immediately before\n#\
    \  the run — a stale checkout can never drift from the SSoT.\"\n"
  bullets:
  - Engine-проекты — артефакты рендера, а не исходники (ADR-0005)
  - Регенерация перед каждым запуском — дрейф исключён конструктивно
  - Правка модели делается один раз — в spec/
  - Ручной форк engine-проекта запрещён правилами проекта
  notes: '**Компилятор спеки** — центральная машинерия проекта (ADR-0005). Он рендерит из `spec/` полноценные,
    !!раннабл!! проекты движков: dbt-проект со schema.yml и тестами, Bruin-проект, SQLMesh-варианты. Ключевое
    правило: **сгенерировано — значит не редактируется руками**; ручной форк engine-проекта — нарушение.


    Второе правило видно в докстринге: __каждый engine-проект регенерируется из спеки непосредственно
    перед запуском__. Это конструктивно исключает классовую ошибку мульти-engine-систем — «поправили в
    одном месте, забыли во втором»: устаревшей копии просто не существует к моменту запуска. ~~Есть и
    проверочный скрипт spec-compile-verify, гоняемый в тестах.~~

    '
- kind: table
  id: 012-shest-engine-setapov
  title: Шесть engine-сетапов из одного spec
  table:
    headers:
    - Сетап
    - Как получает spec
    - Статус (ADR-0020)
    rows:
    - - dbt
      - генерируется компилятором
      - primary — гейты по умолчанию
    - - Bruin
      - читает spec/sql нативно — zero translation
      - co-primary — гейты по умолчанию
    - - SQLMesh
      - генерируется компилятором
      - comparison, experimental-флаг
    - - OpenDBT
      - генерируется компилятором
      - experimental
    - - SQLMesh-over-dbt
      - генерируется поверх dbt-рендера
      - experimental
    - - plain SQL
      - runner исполняет spec/sql напрямую
      - experimental
    col_ratios:
    - 3
    - 5
    - 4
  notes: 'Из одной спеки сегодня выводятся !!шесть работающих сетапов трансформаций!!. Два — первоклассные
    (ADR-0020): **dbt** как индустриальный стандарт, который аудитория читает свободно, и **Bruin** как
    zero-translation-путь. Остальные четыре — сравнительные: живы, запускаемы, но за experimental-флагом
    и вне гейтов по умолчанию.


    Зачем держать шесть: это __не коллекционирование движков, а доказательство переносимости спеки__ —
    одна и та же логика реально исполняется принципиально разными раннерами. Сравнительные сетапы при
    этом честно демоутнуты, а не брошены: их e2e включается флагом полной матрицы. ~~Каждая строка таблицы
    — существующий каталог в transform/.~~

    '
- kind: content
  id: 013-dq-proekciya-iz-spec
  title: 'DQ: checks из спеки проецируются в тесты движков'
  code_caption: Один checks — три исполнителя
  code: '# spec/sql/…       checks: [{name: not_null}, {name: unique}]

    #

    # dbt (primary):       schema.yml → tests: [not_null, unique]   ← dbt build

    # Bruin (co-primary):  нативные column checks                   ← bruin run

    # SQLMesh (comparison): audits                                  ← за флагом матрицы

    #

    # покрытие проекции держат тесты: test_to_dbt_dq, test_sqlmesh_audit_coverage

    '
  bullets:
  - Проверки качества описываются один раз — в заголовке модели
  - 'Primary-путь: checks → dbt-тесты (ADR-0019)'
  - Bruin исполняет те же проверки нативно
  - Отдельные unit-тесты следят, что проекция ничего не теряет
  notes: 'Качество данных устроено так же, как всё остальное: !!описано один раз — исполняется везде!!.
    `not_null`, `unique`, `between`, `non_negative` из заголовков моделей компилятор проецирует в **dbt-тесты**
    на primary-пути (ADR-0019), Bruin исполняет их **нативно**, SQLMesh-вариант получает **audits**.


    Тонкое место любой проекции — молчаливая потеря проверок при рендере. Поэтому __полнота проекции сама
    покрыта unit-тестами__: если check из спеки не превратился в тест движка, падает CI, а не продакшен
    через месяц. ~~Это один из лучших примеров «спека — не документация, а исполняемый артефакт».~~

    '
- kind: section
  id: 014-tri-demo-guaranteed-komandy
  title: Три demo-guaranteed команды
  notes: 'Блок доказательств. Три команды, каждая — !!полный E2E-прогон на сэмпл-данных!!: ingestion →
    transform → DQ → ML → publish.


    Все три __зелёные на 2026-07-30__, каждая завершается exit 0 и наполненными outputs. Это и есть «demo-guaranteed»:
    демонстрация не зависит от удачи.

    '
- kind: content
  id: 015-make-run-dbt
  title: make run-dbt — primary
  code_caption: 'prefect-dbt: dlt → сгенерированный dbt-проект → ML → publish'
  code: '$ make run-dbt

    ...

    dbt build: PASS=157 ERROR=0

    outputs: {games: 5, market_features: 5, ml_train: 5}   # сэмпл-данные

    $ echo $?

    0

    '
  bullets:
  - Дефолтный путь платформы — make run ведёт сюда (ADR-0020)
  - dbt-проект отрендерен из spec/ прямо перед запуском
  - PASS=157 — модели плюс спроецированные DQ-тесты, ноль ошибок
  - Полный цикл до Parquet-файлов, не «прогон моделей»
  notes: '**Primary-сетап.** Один `make run-dbt` проходит весь путь: dlt-ингест RAWG, скрейперы, рендер
    dbt-проекта из спеки, `dbt build` со !!157 PASS при нуле ошибок!! — это модели и все спроецированные
    DQ-тесты, — затем ML-шаг и публикация Parquet.


    Выбор dbt как primary — про __аудиторию и экосистему__: это движок, который читает любой data-инженер,
    и на dbt-пути живут самые богатые интеграции (пакеты, project-evaluator, Dagster-компонент). При этом
    сам проект остаётся сгенерированным артефактом — правило «движки не форкаются» действует и для primary.
    ~~Цифры в панели — из реального прогона, а не из README.~~

    '
- kind: content
  id: 016-make-run-bruin
  title: make run-bruin — co-primary, zero translation
  materials:
  - label: Bruin — GitHub
    url: https://github.com/bruin-data/bruin
  code_caption: 'prefect-bruin: dlt → Bruin native → ML → publish'
  code: '$ make run-bruin

    # Bruin исполняет spec/sql КАК ЕСТЬ на DuckDB —

    # ни одной сгенерированной строчки между спекой и запуском

    outputs: {games: 5, market_features: 5, ml_train: 5}

    $ echo $?

    0

    '
  bullets:
  - Спека исполняется нативно — без шага рендера
  - 'Держит компилятор честным: spec обязан оставаться раннабл'
  - Те же column checks исполняются самим Bruin
  - Гейтится наравне с dbt — CI ставит Bruin CLI в e2e-джоб
  notes: '**Co-primary-сетап** и самый концептуально важный: **Bruin** читает `spec/sql` !!без какого-либо
    перевода!! — формат заголовка нативен для него. Между спекой и исполнением нет ни одного сгенерированного
    файла.


    Роль этого пути — __удержание всей конструкции от вырождения__: пока хотя бы один движок исполняет
    спеку напрямую, спека обязана оставаться живым, раннабл-артефактом, а компилятор — точным. Если бы
    остались только генерируемые пути, спека постепенно превратилась бы в «вход генератора», который сам
    по себе никто не проверяет. ~~Поэтому co-primary, а не просто «ещё один движок»: он в гейтах по умолчанию.~~

    '
- kind: content
  id: 017-make-run-dagster-dbt
  title: make run-dagster-dbt — Prefect × Dagster
  code_caption: 'prefect-over-dagster: комбо dlt + dbt под Dagster, обёрнутое Prefect'
  code: '$ make run-dagster-dbt      # алиас → run-over-dagster

    # Prefect (платформенный оркестратор)

    #   └─ Dagster: dlt-ассеты + dbt-модели одним asset-графом

    #        └─ тот же сгенерированный из spec/ dbt-проект

    outputs: {games: 5, market_features: 5, ml_train: 5}

    $ echo $?

    0

    '
  bullets:
  - Третий сетап — альтернативная оркестрация, а не третий движок
  - Prefect оборачивает Dagster-комбо dlt + dbt
  - Доказан на полностью очищенном (wiped) warehouse
  - Один spec обслуживает и Prefect-, и Dagster-мир
  notes: 'Третья команда отвечает на другой вопрос: __переносится ли конструкция между оркестраторами__.
    Внутри Prefect-флоу поднимается **Dagster**-комбо: dlt-ассеты и dbt-модели одним asset-графом — и
    dbt-проект там !!тот же самый, сгенерированный из spec/!!.


    Отдельно важна проверка на **wiped warehouse**: сетап доказан на полностью очищенной базе, то есть
    прогон не паразитирует на состоянии, оставленном соседними сетапами. Плюс на этом пути были найдены
    и починены реальные швы — стейл-рендер профилей внутри Dagster-копии, абсолютные пути. ~~Это типичная
    работа интеграционного слоя, и она сделана, а не замазана.~~

    '
