    ADR-0019  DQ-проекция: checks → тесты движков

    ADR-0020  dbt (primary) + Bruin (co-primary); SQLMesh → comparison

    '
  bullets:
  - Двадцать ADR — каждый разворот курса задокументирован
  - Формат — контекст, решение, последствия, отклонённые альтернативы
  - ADR ссылаются друг на друга — путь решений читается как история
  - Поздние ADR уточняют ранние, не переписывая их задним числом
  notes: 'В репозитории !!двадцать ADR!!, и это не формальность: каждый содержит контекст, решение, последствия
    и — самое ценное для ревью — **отклонённые альтернативы**. Видно, что взвешивалось: Bruin-only отклонён,
    Dagster-по-умолчанию отклонён, и почему.


    Обратите внимание на приём в конце списка: __ADR-0020 уточняет ADR-0004, не переписывая его__ — старое
    решение остаётся принятым «как история», новое фиксирует разворот. Такой след честнее, чем редактирование
    прошлых решений задним числом, и по нему реально восстанавливается эволюция мышления. ~~К ADR-0020
    вернёмся в финальном блоке — это главный экспонат обратимости.~~

    '
- kind: content
  id: 026-odts-odos-standarty
  title: ODTS / ODOS 0.1 — стандарты с конформанс-тестами
  code_caption: Закрытый словарь ODTS 0.1 — и тест, который его держит
  code: "# SPEC.md §3 — closed 0.1 directive vocabulary\n_ODTS_DIRECTIVES = {\"model\", \"kind\", \"owner\"\
    , \"tags\",\n                    \"depends\", \"columns\", \"checks\", \"imports\"}\n\n# src/tests/unit/test_standard_packages.py:\n\
    #  - примеры ODOS валидируются против spec/ODOS/schema.json\n#  - каждый spec/sql/*.sql держится в\
    \ закрытом словаре ODTS 0.1\n"
  bullets:
  - Внутренние форматы оформлены как стандарты — спека, схема, примеры
  - Конформанс — это исполняемые тесты, а не намерения
  - Фикстуры-примеры проверяются той же машинерией, что и боевые файлы
  - Эволюция — через нормативные профили (сейчас 0.1)
  notes: 'Форматы, на которых всё держится, не остались «внутренними соглашениями» — они оформлены как
    **стандарты**: **ODTS** (декларативный заголовок трансформаций) и **ODOS** (декларативная оркестрация),
    каждый со спекой, JSON-схемой и примерами-фикстурами.


    Ключевое слово — !!конформанс-тесты!!: unit-тесты валидируют примеры против схемы и держат каждый
    боевой SQL-файл в закрытом словаре директив 0.1. То есть __стандарт нарушить нельзя молча__ — расширение
    словаря требует осознанной правки и спеки, и теста. Версионирование через нормативные профили оставляет
    место эволюции без поломки существующего. ~~Это уровень зрелости, который обычно появляется в платформенных
    командах, а не в пет-проектах.~~

    '
