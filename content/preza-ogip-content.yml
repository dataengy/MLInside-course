- kind: content
  id: 029-adr-0020-flip
  title: 'ADR-0020: смена primary-движка = флип конфига и гейтов'
  code_caption: Что реально изменилось при развороте SQLMesh → dbt + Bruin
  code: '# было (ADR-0004):  SQLMesh — движок по умолчанию

    # стало (ADR-0020): dbt — primary, Bruin — co-primary


    config/config.yml    дефолтный профиль → prefect-dbt; остальные experimental: true

    Makefile             make run → run-dbt

    spec_compile         DEFAULT_ENGINES = [dbt, bruin]

    CI (e2e)             + установка Bruin CLI; гейт = dbt + bruin

    experimental/        пять демоутнутых Prefect-сабпроектов переехали туда


    # ни одна модель в spec/ не изменилась

    '
  bullets:
  - Смена движка — конфиг, гейты и вайринг, а не rewrite
  - SQLMesh не удалён — стал comparison-сетапом за флагом
  - SQL-модели не тронуты — логика живёт в spec/
  - Разворот задокументирован ADR до исполнения, не после
  notes: 'Конкретика разворота. По ADR-0004 движком по умолчанию был **SQLMesh**; накопившиеся аргументы
    — читаемость для аудитории, богатство dbt-экосистемы, ценность zero-translation-пути — привели к **ADR-0020**:
    dbt primary, Bruin co-primary. Посмотрите на список изменённого: !!конфиг, Makefile-алиас, список
    движков компилятора, CI-гейт!! — и переезд демоутнутых сабпроектов в experimental/.


    Нижняя строка панели — главная: __ни одна SQL-модель не изменилась__. Логика жила в spec/, а «primary»
    всегда был свойством рендера и гейтов, поэтому разворот стоил дни, а не месяцы. SQLMesh при этом не
    выброшен — он остался живым comparison-сетапом. ~~Это и есть проверка архитектуры делом: обратимость
    не задекларирована, а исполнена.~~

