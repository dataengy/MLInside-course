content:
- kind: title
  id: 001-orkestraciya-dannyh-apache
  title: Оркестрация данных (Apache Airflow)
  subtitle: MLInside · 2026
  notes: |
    Приветствие. Сегодня разбираем **Apache Airflow** — самый распространённый оркестратор в дата-инженерии и де-факто отраслевой стандарт последних десяти лет. Если в прошлых семинарах мы писали трансформации в **dbt** и смотрели на asset-ориентированный **Dagster** и Python-first **Prefect**, то Airflow — это !!та база, относительно которой все они себя позиционируют!!.

    План на лекцию — четыре больших блока. Первый: **управление процессами** — архитектура (Scheduler, Worker, Webserver, метабаза), понятие **DAG** и **операторов**. Второй: **расписание и ETL** — регулярный запуск dbt-моделей, сбор сырых данных, подготовка батч-прогнозов. Третий: **передача данных** — ограничения **XCom** и почему между задачами ходят метаданные, а не датафреймы. Четвёртый: **обработка сбоев** — политики `retries` и алерты при падении. ~~Вопросы удобно задавать по ходу.~~

    — Сгенерировано: model=claude-opus-4-8 · harness=Claude Code · effort=max · version=v1.0 · 2026-07-20
- kind: agenda
  id: 002-plan-lekcii
  title: План лекции
  bullets:
  - Контекст и история — зачем появился Airflow
  - 'Архитектура: Scheduler, Worker, Webserver, метабаза, Executor'
  - 'DAG и операторы: TaskFlow API, провайдеры, зависимости'
  - 'Расписание и ETL: cron, catchup, backfill, Assets'
  - Регулярный запуск dbt-моделей и подготовка батч-прогнозов
  - 'Передача данных: XCom, его ограничения и правильные паттерны'
  - 'Обработка сбоев: retries, trigger rules, SLA, алерты'
  - Airflow vs Dagster vs Prefect · Домашнее задание
  notes: |
    Логика лекции — от __устройства__ к __эксплуатации__. Первые два блока отвечают на вопрос «как эта штука вообще работает и из чего состоит»: без понимания разделения на **Scheduler**, **Worker** и **Webserver** невозможно ни отладить пайплайн, ни объяснить, почему задача «висит в очереди».

    Третий и четвёртый блоки — это то, что отличает работающий прод от демо: !!правильная передача данных между задачами!! и !!осмысленная политика повторных попыток!!. Именно на этих двух темах чаще всего ломаются первые продакшн-пайплайны. В конце — честное сравнение с Dagster и Prefect и **домашнее задание**, продолжающее ваш dbt-проект по фрод-транзакциям.
- kind: section
  id: 003-kontekst-istoriya-i-mesto-v
  title: Контекст, история и место в стеке
  notes: |
    Первый блок — вводный и исторический.

    Разберёмся, __какую проблему решал Airflow__ в момент появления, кто его создал, как он прошёл путь от внутреннего инструмента Airbnb до проекта Apache Software Foundation, и почему он до сих пор остаётся стандартом, несмотря на волну новых оркестраторов.
- kind: content
  id: 004-chto-takoe-airflow
  title: Что такое Airflow
  materials:
  - label: Apache Airflow — документация
    url: https://airflow.apache.org/docs/
  - label: Airflow на GitHub
    url: https://github.com/apache/airflow
  bullets:
  - Платформа для программного создания, планирования и мониторинга рабочих процессов
  - 'Ключевая идея: workflow as code — пайплайн описан обычным Python-кодом'
  - Граф задач (DAG) + расписание + исполнение + наблюдаемость
  - Не движок обработки данных — он дирижирует внешними системами
  - Open source, Apache License 2.0, проект ASF верхнего уровня
  code_caption: место Airflow в дата-платформе
  code: |
    ┌──────────┐   ┌──────────┐   ┌──────────┐   ┌──────────┐
    │ источники│ → │  хранилище│ → │   dbt    │ → │ ML/BI    │
    │ API, БД  │   │ CH / S3  │   │ модели   │   │ прогнозы │
    └──────────┘   └──────────┘   └──────────┘   └──────────┘
         ↑              ↑              ↑              ↑
         └──────────────┴─── Airflow ──┴──────────────┘
            расписание · зависимости · retries · алерты
  notes: |
    **Airflow** — это платформа для программного создания, планирования и мониторинга рабочих процессов. Центральный принцип, который стоит запомнить с первой минуты: __workflow as code__. Пайплайн — это не картинка, нарисованная мышкой в веб-интерфейсе, а обычный **Python-модуль**, который лежит в git, проходит code review, покрывается тестами и версионируется как любой другой код.

    Второе, что важно понять сразу: !!Airflow не обрабатывает данные сам!!. Он не считает агрегаты, не джойнит таблицы и не обучает модели — он *дирижирует*: говорит ClickHouse «выполни этот запрос», говорит dbt «прогони эти модели», говорит Python-скрипту «сделай инференс». Данные при этом текут между внешними системами, а через Airflow проходят только команды и метаданные. ~~Эту мысль мы разовьём в блоке про XCom — там она станет практическим правилом.~~
- kind: content
  id: 005-istoriya-i-persony
  title: История и персоны
  materials:
  - label: Maxime Beauchemin — The Rise of the Data Engineer
    url: https://medium.com/free-code-camp/the-rise-of-the-data-engineer-91be18f1e603
  bullets:
  - '2014 — Максим Бошмен (Maxime Beauchemin) создаёт Airflow внутри Airbnb'
  - 'Тот же автор позже создаёт Apache Superset — BI-инструмент'
  - 2016 — проект передан в инкубатор Apache Software Foundation
  - 2019 — статус проекта ASF верхнего уровня
  - '2020 — Airflow 2.0: планировщик HA, TaskFlow API, провайдеры'
  - 'Astronomer — основной коммерческий вендор и главный контрибьютор'
  notes: |
    Airflow родился в **2014 году** внутри Airbnb; автор — **Максим Бошмен**. Контекст важен: Airbnb того времени — это десятки разрозненных cron-задач, между которыми зависимости существовали только в голове у инженеров. Бошмен позже написал эссе «The Rise of the Data Engineer», где сформулировал сам подход: __дата-инженер пишет код, а не кликает мышкой__. Тот же человек позднее создал **Apache Superset**, так что след в отрасли у него двойной.

    Дальше — типичная для успешного OSS траектория: **2016** — инкубатор Apache, **2019** — статус проекта верхнего уровня, **2020** — переломный релиз **Airflow 2.0**. Именно в 2.0 появились высокодоступный планировщик, **TaskFlow API** и вынос интеграций в отдельные пакеты-**провайдеры**. Отдельно отметьте компанию **Astronomer**: это основной коммерческий вендор вокруг Airflow, и большая часть современной разработки идёт с их участием. ~~Помните об этом, когда будете читать «официальные» сравнения оркестраторов.~~
- kind: content
  id: 006-zachem-ne-prosto-cron
  title: Зачем не просто cron
  bullets:
  - 'cron знает только время — он не знает про зависимости между задачами'
  - Нет ретраев, нет истории запусков, нет понятия «упало на третьем шаге»
  - Нет UI, логи разбросаны по машинам, нет единой точки наблюдения
  - Нет backfill — перезапуска за прошлые даты
  - Нет параметризации по интервалу времени
  code_caption: одна и та же задача — cron против Airflow
  code: |
    # cron: надежда и молитва
    0 3 * * * /opt/etl/load.sh && /opt/etl/dbt_run.sh

    # Airflow: явные зависимости, ретраи, история
    load = BashOperator(
        task_id="load",
        bash_command="/opt/etl/load.sh",
        retries=3,
    )
    transform = BashOperator(
        task_id="transform",
        bash_command="dbt run --select marts",
    )
    load >> transform
  notes: |
    Практически каждый дата-пайплайн начинается с **cron** — и это нормально. Проблемы возникают, когда задач становится больше пяти. Cron умеет ровно одно: __запустить команду в указанное время__. Он ничего не знает о том, что задача B должна ждать успеха задачи A; в примере выше зависимость выражена через `&&`, и это работает ровно до первого сбоя.

    Чего конкретно не хватает: !!повторных попыток!!, !!истории запусков!!, !!единого места для логов!!, !!перезапуска за прошлые даты!! и !!параметризации по интервалу!!. Последнее особенно недооценивают: в Airflow задача знает, за какой именно логический интервал она выполняется, поэтому её можно честно перезапустить за прошлый вторник. В cron такой запуск просто обработает «сегодня». ~~Airflow — это, по сути, cron, доросший до промышленной эксплуатации.~~
- kind: section
  id: 007-upravlenie-processami
  title: 'Управление процессами: архитектура'
  notes: |
    Второй блок — **устройство Airflow**.

    Разбираем компоненты: **Scheduler**, **Worker**, **Webserver**, метабаза, **Executor**. Это тот раздел, без которого невозможно отвечать на вопросы «почему задача в статусе queued уже двадцать минут» и «почему я поправил DAG, а в интерфейсе ничего не изменилось».
- kind: content
  id: 008-komponenty-airflow
  title: Компоненты Airflow
  materials:
  - label: Airflow — обзор архитектуры
    url: https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/overview.html
  bullets:
  - 'Scheduler — читает DAG-файлы, решает что и когда запускать'
  - 'Executor — механизм, определяющий где выполняются задачи'
  - 'Worker — процесс, который физически выполняет задачу'
  - 'Webserver — веб-интерфейс и REST API'
  - 'Metadata DB — состояние всего (Postgres или MySQL)'
  - 'DAG-файлы — папка dags/, общая для scheduler и worker'
  code_caption: как компоненты связаны между собой
  code: |
    ┌───────────────────────────────────────────────┐
    │            Metadata DB (PostgreSQL)           │
    │   DAG · DAG Run · Task Instance · XCom · Vars  │
    └───────▲───────────────▲───────────────▲───────┘
            │               │               │
    ┌───────┴──────┐ ┌──────┴──────┐ ┌──────┴──────┐
    │  Scheduler   │ │  Webserver  │ │   Worker    │
    │ + DAG parser │ │   UI / API  │ │  (executor) │
    └───────┬──────┘ └─────────────┘ └──────▲──────┘
            │        очередь задач          │
            └───────────────────────────────┘

    ┌───────────────────────────────────────────────┐
    │   dags/ — общая папка или общий образ         │
    │   видна и планировщику, и всем воркерам       │
    └───────────────────────────────────────────────┘
  notes: |
    Запомните пять компонентов. **Scheduler** — мозг системы: он парсит файлы из папки `dags/`, вычисляет, для каких DAG наступило время запуска, создаёт **DAG Run** и ставит задачи в очередь. **Executor** — не отдельный процесс, а *стратегия*: он определяет, где именно будут выполняться задачи (об этом отдельный слайд). **Worker** — процесс, который берёт задачу из очереди и выполняет её.

    **Webserver** даёт интерфейс и REST API; важно понимать, что !!он ничего не запускает сам!! — он только читает и пишет метабазу. И, наконец, **Metadata DB** — это единственный источник правды о состоянии: какие DAG существуют, какие запуски были, в каком статусе каждая задача. Практическое следствие, которое сэкономит вам часы: __папка `dags/` должна быть одинаково видна и планировщику, и всем воркерам__. Классическая ошибка новичка — обновить DAG только на одной машине и получить `ModuleNotFoundError` на воркере. ~~В Docker-развёртывании это решается общим томом или общим образом.~~
- kind: content
  id: 009-scheduler-kak-on-prinimaet
  title: Scheduler — как он принимает решения
  bullets:
  - Периодически парсит все файлы в dags/ (интервал настраивается)
  - Для каждого DAG считает, наступил ли следующий логический интервал
  - Создаёт DAG Run и переводит задачи в статус scheduled
  - Проверяет зависимости, пулы и лимиты параллелизма
  - Ставит готовые задачи в очередь → queued → running
  - С Airflow 2.0 может работать в нескольких экземплярах (HA)
  code_caption: жизненный цикл состояния задачи
  code: |
    none → scheduled → queued → running → success
                                   │
                                   ├→ up_for_retry → queued → ...
                                   ├→ failed
                                   └→ upstream_failed / skipped
  notes: |
    Планировщик работает **циклами**. В каждом цикле он заново парсит DAG-файлы (по умолчанию — примерно раз в 30 секунд; частота настраивается) и для каждого DAG отвечает на вопрос: наступил ли следующий логический интервал? Если да — создаётся **DAG Run**, а его задачи получают статус `scheduled`.

    Дальше задача проходит цепочку состояний, и здесь кроется самый частый вопрос на проде: __почему задача «висит» в `queued`__. Статус `queued` означает, что планировщик своё дело сделал и задача ждёт свободного воркера. Причины: !!все воркеры заняты!!, !!исчерпан pool!!, !!упёрлись в `max_active_tasks` у DAG или в глобальный `parallelism`!!. Отличайте это от `scheduled` — там задача ещё ждёт выполнения зависимостей. Отдельно отметьте состояние `up_for_retry`: это не провал, это запланированная повторная попытка, к которой мы вернёмся в четвёртом блоке.
- kind: table
  id: 010-executors-gde-vypolnyayutsya
  title: 'Executors: где выполняются задачи'
  table:
    headers:
    - Executor
    - Где выполняется
    - Когда применять
    rows:
    - - LocalExecutor
      - Подпроцессы на машине планировщика
      - Небольшой прод на одной VM, dev-среда
    - - CeleryExecutor
      - Пул воркеров + брокер (Redis / RabbitMQ)
      - 'Классический горизонтально масштабируемый прод'
    - - KubernetesExecutor
      - Отдельный под на каждую задачу
      - K8s-инфраструктура, изоляция зависимостей
    - - SequentialExecutor
      - Одна задача за раз, SQLite
      - Только первое знакомство — не для прода
  notes: |
    **Executor** — это ответ на вопрос «где физически выполнится код задачи». Выбор executor'а определяет всю топологию развёртывания, поэтому это первое архитектурное решение при внедрении Airflow.

    **SequentialExecutor** — то, что вы получите после `pip install apache-airflow` без настройки: одна задача за раз, SQLite вместо Postgres. Годится ровно для того, чтобы посмотреть интерфейс. **LocalExecutor** — честный вариант для небольшого прода: задачи выполняются подпроцессами на той же машине, ограничение — ресурсы одной VM. **CeleryExecutor** — классика горизонтального масштабирования: пул воркеров плюс брокер (обычно Redis). **KubernetesExecutor** поднимает !!отдельный под на каждую задачу!! — дороже по накладным расходам на старт, но даёт изоляцию зависимостей и эластичность. Для учебного проекта берите **LocalExecutor** в Docker Compose: он даёт настоящее поведение прода без лишней инфраструктуры.
- kind: content
  id: 011-ponyatie-dag
  title: Понятие DAG
  materials:
  - label: Airflow — DAGs
    url: https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dags.html
  bullets:
  - 'DAG — Directed Acyclic Graph, направленный ациклический граф'
  - Узлы — задачи, рёбра — зависимости, циклы запрещены
  - Описывается Python-кодом в файле внутри dags/
  - 'DAG — это шаблон; конкретный запуск — DAG Run'
  - Экземпляр задачи в конкретном запуске — Task Instance
  code_caption: минимальный DAG
  code: |
    from airflow import DAG
    from airflow.operators.bash import BashOperator
    import pendulum

    with DAG(
        dag_id="fraud_daily",
        start_date=pendulum.datetime(2026, 1, 1, tz="UTC"),
        schedule="0 3 * * *",
        catchup=False,
        default_args={"retries": 2},
        tags=["mlinside", "fraud"],
    ) as dag:
        extract = BashOperator(
            task_id="extract",
            bash_command="python /opt/etl/extract.py",
        )
        transform = BashOperator(
            task_id="transform",
            bash_command="dbt run --select marts",
        )
        extract >> transform
  notes: |
    **DAG** расшифровывается как *Directed Acyclic Graph* — направленный ациклический граф. Узлы графа — задачи, рёбра — зависимости, а слово «ациклический» означает, что !!цикл запрещён!!: задача не может, прямо или косвенно, зависеть сама от себя. Это не ограничение реализации, а следствие модели: если бы цикл был разрешён, планировщик не смог бы определить порядок выполнения.

    Критически важно различать три сущности. **DAG** — это *шаблон*, описание процесса. **DAG Run** — конкретный запуск этого шаблона за конкретный логический интервал. **Task Instance** — экземпляр конкретной задачи внутри конкретного запуска. Когда в интерфейсе вы перезапускаете «задачу», вы перезапускаете именно Task Instance. Обратите внимание на синтаксис зависимостей: оператор `>>` читается как «затем». Запись `extract >> transform` означает __сначала extract, потом transform__. ~~Это перегруженный битовый сдвиг — да, так и задумано.~~
- kind: content
  id: 012-operatory-iz-chego
  title: Операторы — из чего собираются задачи
  materials:
  - label: Airflow — операторы
    url: https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/operators.html
  bullets:
  - 'Оператор — шаблон одной единицы работы; задача — его экземпляр'
  - 'PythonOperator / @task — выполнить Python-функцию'
  - 'BashOperator — выполнить shell-команду'
  - 'EmptyOperator — точка синхронизации, ничего не делает'
  - 'Sensor — ждёт наступления внешнего события'
  - 'Провайдеры: ClickHouse, S3, Postgres, Docker, Kubernetes, Slack, …'
  code_caption: три типа задач в одном DAG
  code: |
    from airflow.operators.python import PythonOperator
    from airflow.operators.empty import EmptyOperator
    from airflow.sensors.filesystem import FileSensor

    wait = FileSensor(
        task_id="wait_for_dump",
        filepath="/data/landing/tx_{{ ds }}.csv",
        poke_interval=60,
        timeout=60 * 60,
        mode="reschedule",   # не держим слот воркера
    )

    load = PythonOperator(
        task_id="load_to_clickhouse",
        python_callable=load_csv,
        op_kwargs={"date": "{{ ds }}"},
    )

    done = EmptyOperator(task_id="done")

    wait >> load >> done
  notes: |
    **Оператор** — это шаблон единицы работы, а **задача** — его настроенный экземпляр внутри DAG. Базовых операторов немного: `PythonOperator` выполняет функцию, `BashOperator` — команду, `EmptyOperator` не делает ничего и служит точкой синхронизации (удобно, когда нужно свести десять веток в одну).

    Отдельная и очень важная категория — **сенсоры**. Сенсор ждёт наступления внешнего события: появления файла, готовности партиции, ответа API. Здесь есть ловушка, за которую платят реальными деньгами: по умолчанию сенсор !!занимает слот воркера всё время ожидания!!. Если у вас двадцать сенсоров ждут по три часа — воркеры забиты, а полезной работы ноль. Решение указано в коде: `mode="reschedule"` — сенсор освобождает слот между проверками. __Всегда указывайте `timeout` и `mode="reschedule"` для долгих ожиданий.__ Всё остальное — интеграции с внешними системами — живёт в **провайдерах**, отдельных пакетах вида `apache-airflow-providers-*`.
- kind: content
  id: 013-taskflow-api-sovremennyj
  title: TaskFlow API — современный способ писать DAG
  materials:
  - label: Airflow — TaskFlow API
    url: https://airflow.apache.org/docs/apache-airflow/stable/tutorial/taskflow.html
  bullets:
  - 'Декораторы @dag и @task вместо явного конструирования операторов'
  - Зависимости выводятся из передачи аргументов между функциями
  - XCom работает автоматически — через return и параметры
  - Код читается как обычный Python, а не как конфигурация
  - Появился в Airflow 2.0, сегодня — рекомендуемый стиль
  code_caption: тот же пайплайн через TaskFlow
  code: |
    from airflow.decorators import dag, task
    import pendulum

    @dag(
        schedule="0 3 * * *",
        start_date=pendulum.datetime(2026, 1, 1, tz="UTC"),
        catchup=False,
        default_args={"retries": 2},
    )
    def fraud_daily():

        @task
        def extract(ds=None) -> str:
            path = f"s3://landing/tx/{ds}.parquet"
            download(ds, path)
            return path          # → XCom: только путь, не данные

        @task
        def load(path: str) -> int:
            return copy_to_clickhouse(path)   # → число строк

        @task
        def report(rows: int) -> None:
            log.info("loaded %s rows", rows)

        report(load(extract()))   # зависимости выведены сами

    fraud_daily()
  notes: |
    **TaskFlow API** — это то, как Airflow пишут сегодня. Вместо явного создания объектов-операторов вы вешаете декоратор `@task` на обычную функцию, а зависимости между задачами __выводятся автоматически из передачи аргументов__. Строка `report(load(extract()))` одновременно и создаёт три задачи, и объявляет их порядок.

    Обратите особое внимание на то, *что* возвращают функции в примере: `extract` возвращает !!путь к файлу, а не сам файл!!; `load` возвращает !!число строк, а не датафрейм!!. Это не случайность — значения, которые вы возвращаете из `@task`, автоматически уезжают в **XCom**, и через два слайда мы разберём, почему туда нельзя класть тяжёлые объекты. TaskFlow делает передачу данных настолько удобной, что о её цене легко забыть. ~~Считайте этот слайд подготовкой к блоку про XCom.~~
- kind: content
  id: 014-dinamicheskoe-postroenie-zadach
  title: Динамическое построение задач
  bullets:
  - 'Dynamic Task Mapping — число задач определяется во время выполнения'
  - '.expand() создаёт по задаче на каждый элемент списка'
  - Каждая порождённая задача ретраится и логируется независимо
  - Замена циклу for на уровне определения DAG
  - 'Ограничение: число задач известно только после выполнения upstream'
  code_caption: одна задача на каждый источник
  code: |
    @task
    def list_sources() -> list[str]:
        return ["web", "mobile", "partner_api"]

    @task
    def ingest(source: str) -> int:
        return load_source(source)

    @task
    def summarize(counts: list[int]) -> None:
        log.info("total=%s", sum(counts))

    summarize(ingest.expand(source=list_sources()))
  notes: |
    **Dynamic Task Mapping** решает частую задачу: число единиц работы неизвестно на момент написания DAG. Источников может быть три сегодня и семь через месяц. Метод `.expand()` создаёт по отдельной задаче на каждый элемент списка, который вернула вышестоящая задача.

    Практическая ценность здесь не в лаконичности, а в **гранулярности**: каждая порождённая задача имеет !!собственный статус, собственные логи и собственные повторные попытки!!. Если упал только `partner_api`, вы перезапускаете одну задачу, а не весь цикл заново. Сравните с наивным вариантом — циклом `for` внутри одной большой задачи: там падение на третьем источнике означает повтор всех, включая уже успешно загруженные. __Гранулярность задач — это гранулярность восстановления после сбоя.__
- kind: section
  id: 015-raspisanie-i-etl
  title: Расписание и ETL
  notes: |
    Третий блок — **расписание и практический ETL**.

    Разбираем, как Airflow понимает время (и почему это устроено контринтуитивно), что такое `catchup` и **backfill**, как ставить на расписание **dbt**-модели, собирать сырые данные и готовить **батч-прогнозы**.
- kind: content
  id: 016-kak-airflow-ponimaet-vremya
  title: Как Airflow понимает время
  materials:
  - label: Airflow — DAG Runs и расписание
    url: https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dag-run.html
  bullets:
  - 'schedule — cron-выражение, timedelta или пресет (@daily)'
  - 'start_date — начало первого логического интервала'
  - 'logical_date (ранее execution_date) — метка интервала, а не время запуска'
  - 'Запуск происходит в КОНЦЕ интервала — данные должны накопиться'
  - 'Шаблоны {{ ds }}, {{ data_interval_start }} параметризуют задачу'
  code_caption: разница между логической датой и временем запуска
  code: |
    schedule="@daily", start_date=2026-07-01

    интервал 2026-07-01 00:00 ── 2026-07-02 00:00
             │                             │
             logical_date = 2026-07-01      └─ фактический запуск

    # в задаче:
    bash_command="dbt run --vars '{day: {{ ds }}}'"
    #                                     └─ 2026-07-01
  notes: |
    Это слайд, на котором спотыкаются практически все. Airflow оперирует **логическими интервалами**, а не моментами времени. У DAG-запуска есть `logical_date` (в старых версиях — `execution_date`) — это !!метка интервала, за который обрабатываются данные!!, а не время фактического старта.

    Ключевое правило: __запуск происходит в конце интервала__. Ежедневный DAG с интервалом за 1 июля стартует в полночь 2 июля — логика простая: чтобы обработать данные за сутки, эти сутки должны сначала пройти. Отсюда классический вопрос новичка: «я поставил `@daily` и `start_date` на сегодня, почему ничего не запустилось» — потому что интервал ещё не завершился. Практическое следствие: **никогда не используйте `datetime.now()` внутри задачи**. Берите дату из шаблона `{{ ds }}` — тогда задача будет одинаково корректна и при штатном запуске, и при перезапуске за прошлую неделю. ~~Это и есть идемпотентность, о которой отдельный слайд.~~
- kind: content
  id: 017-catchup-i-backfill
  title: catchup и backfill
  bullets:
  - 'catchup=True — при старте догоняет все интервалы от start_date'
  - 'catchup=False — запускается только за последний интервал (обычно то, что нужно)'
  - 'backfill — осознанный перезапуск за диапазон прошлых дат'
  - 'max_active_runs ограничивает число параллельных запусков'
  - Backfill работает корректно только для идемпотентных задач
  code_caption: перезапуск за прошлый период
  code: |
    # CLI: пересчитать неделю
    airflow dags backfill fraud_daily \
        --start-date 2026-07-01 \
        --end-date   2026-07-07

    # защита от лавины при catchup=True
    with DAG(..., catchup=True, max_active_runs=3):
        ...
  notes: |
    Параметр `catchup` — источник самого драматичного первого опыта с Airflow. Если поставить `catchup=True` и `start_date` годичной давности, то при первом включении DAG планировщик честно попытается !!запустить 365 прогонов!!. Поэтому в подавляющем большинстве случаев ставьте `catchup=False`, а исторические данные досчитывайте осознанно, через **backfill**.

    **Backfill** — это управляемый перезапуск за диапазон дат, и это одна из главных причин, по которым выбирают Airflow: возможность честно пересчитать прошлый месяц после того, как нашли ошибку в логике. Но работает он корректно !!только при идемпотентных задачах!!. Если ваша задача делает `INSERT` без предварительной очистки партиции, backfill за неделю просто удвоит данные. Если `catchup=True` действительно нужен — обязательно ограничьте `max_active_runs`, иначе догоняющие запуски положат и метабазу, и целевое хранилище.
- kind: content
  id: 018-idempotentnost-glavnoe
  title: Идемпотентность — главное требование к задаче
  bullets:
  - Повторный запуск за тот же интервал даёт тот же результат
  - 'Плохо: INSERT новых строк без учёта уже загруженных'
  - 'Хорошо: DELETE партиции за {{ ds }} + INSERT, либо MERGE / REPLACE'
  - Без идемпотентности не работают ни retries, ни backfill
  - 'Данные адресуются логической датой, а не «сегодня»'
  code_caption: неидемпотентная и идемпотентная загрузка
  code: |
    -- ПЛОХО: повтор задачи задвоит данные
    INSERT INTO transactions
    SELECT * FROM staging_tx;

    -- ХОРОШО: партиция за интервал перезаписывается целиком
    ALTER TABLE transactions
        DROP PARTITION '{{ ds }}';

    INSERT INTO transactions
    SELECT * FROM staging_tx
    WHERE toDate(event_time) = '{{ ds }}';
  notes: |
    **Идемпотентность** — свойство задачи давать один и тот же результат при повторном запуске за один и тот же интервал. Это не абстрактное академическое требование, а !!фундамент, на котором стоят и повторные попытки, и backfill!!. Подумайте: политика `retries=3` имеет смысл только если повтор безопасен. Если задача при каждом запуске дописывает строки, то три ретрая — это утроенные данные.

    Практический рецепт для колоночных хранилищ вроде ClickHouse — работа партициями: __сначала удаляем партицию за `{{ ds }}`, затем вставляем заново__. В других СУБД это `MERGE`, `INSERT OVERWRITE` или `REPLACE`. Обратите внимание, что во втором примере фильтр берёт дату из шаблона, а не из `now()`, — благодаря этому запуск за прошлый вторник тронет ровно партицию прошлого вторника. ~~Если запомнить с лекции одно правило — пусть это будет правило идемпотентности.~~
- kind: content
  id: 019-regulyarnyj-zapusk-dbt-modelej
  title: Регулярный запуск dbt-моделей
  materials:
  - label: Astronomer Cosmos — dbt в Airflow
    url: https://astronomer.github.io/astronomer-cosmos/
  bullets:
  - 'Способ 1: BashOperator с командой dbt run — просто, но один узел на всё'
  - 'Способ 2: отдельные задачи по слоям (staging → marts) — грубая гранулярность'
  - 'Способ 3: Cosmos — парсит manifest.json и строит задачу на модель'
  - Гранулярность важна для перезапуска и наблюдаемости
  - dbt-зависимости остаются внутри dbt, Airflow отвечает за расписание
  code_caption: простой вариант — dbt одной задачей
  code: |
    dbt_run = BashOperator(
        task_id="dbt_run_marts",
        bash_command=(
            "cd /opt/dbt && "
            "dbt run --select marts "
            "--vars '{run_date: {{ ds }}}'"
        ),
        retries=2,
    )

    dbt_test = BashOperator(
        task_id="dbt_test",
        bash_command="cd /opt/dbt && dbt test --select marts",
    )

    load_raw >> dbt_run >> dbt_test >> train_model
  notes: |
    Связка **Airflow + dbt** — самый частый продакшн-сценарий в дата-инженерии, и он напрямую продолжает наш прошлый семинар. Простейший вариант показан в коде: `BashOperator` вызывает `dbt run`, следом `dbt test`. Этого достаточно для начала и это то, что вы сделаете в домашнем задании.

    Ограничение простого варианта: __весь dbt-проект становится одним узлом графа__. Если из сорока моделей упала одна, Airflow покажет «задача dbt_run упала» — и перезапускать придётся всё. Промежуточное решение — разбить по слоям: отдельная задача на staging, отдельная на marts. Полноценное — библиотека **Cosmos** от Astronomer: она читает `manifest.json` dbt-проекта и разворачивает !!каждую модель в отдельную задачу Airflow!!, сохраняя граф зависимостей dbt. Тогда падение одной модели видно точечно и перезапускается точечно. Цена — усложнение и зависимость от структуры манифеста. ~~Мы подробно сравнивали Cosmos с dagster-dbt на семинаре по Dagster.~~
- kind: table
  id: 020-tri-sposoba-zapuskat-dbt-iz
  title: Три способа запускать dbt из Airflow
  table:
    headers:
    - Подход
    - Гранулярность
    - Плюсы и минусы
    rows:
    - - 'BashOperator: dbt run'
      - Одна задача на весь проект
      - Просто, работает сразу; при сбое перезапуск всего
    - - Задачи по слоям
      - Задача на staging / marts
      - Компромисс; зависимости дублируются вручную
    - - 'Cosmos (manifest.json)'
      - Задача на каждую модель
      - Точный перезапуск и наблюдаемость; сложнее, нужен манифест
    - - 'Docker / K8s Operator'
      - Один контейнер на прогон
      - Изоляция окружения dbt; накладные расходы на старт
  notes: |
    Таблица помогает выбрать осознанно. Главная ось выбора — **гранулярность**: насколько мелко вы хотите видеть и перезапускать работу dbt.

    Для учебного проекта и небольших витрин `BashOperator` полностью достаточен — не усложняйте раньше времени. Разбиение по слоям стоит вводить, когда прогон занимает десятки минут и хочется перезапускать только витрины. **Cosmos** окупается на проектах в сотни моделей, где важно видеть в интерфейсе, какая именно модель упала. Отдельная строка — **Docker/Kubernetes-операторы**: они решают не гранулярность, а !!изоляцию зависимостей!!, что критично, когда версии Python у Airflow и у dbt конфликтуют. __Это, кстати, самая частая причина перехода на контейнерный запуск dbt.__
- kind: content
  id: 021-sbor-syryh-dannyh
  title: Сбор сырых данных
  bullets:
  - 'Landing-зона: сырые данные кладём как есть, без трансформаций'
  - 'Партиционирование по логической дате — путь содержит {{ ds }}'
  - 'Сенсор или API-задача проверяет готовность источника'
  - 'Загрузка в хранилище отдельной задачей — extract и load разделены'
  - Схема и типизация — уже на слое staging в dbt
  code_caption: extract → load → transform по партициям
  code: |
    @task
    def extract(ds=None) -> str:
        """Выгружает сырьё в landing, возвращает путь."""
        dst = f"s3://landing/tx/dt={ds}/part.parquet"
        fetch_api(date=ds, dst=dst)
        return dst

    @task
    def load(src: str, ds=None) -> int:
        """Перезаписывает партицию в ClickHouse."""
        ch.execute(f"ALTER TABLE raw_tx DROP PARTITION '{ds}'")
        return ch.insert_from_s3(src, table="raw_tx")

    dbt = BashOperator(
        task_id="dbt_run",
        bash_command="dbt run --vars '{run_date: {{ ds }}}'",
    )

    load(extract()) >> dbt
  notes: |
    Практический паттерн сбора сырых данных. Первое правило: **landing-зона** — сырые данные складываются !!как есть!!, без преобразований. Причина в том, что если источник завтра перестанет отдавать историю, у вас останется исходник, из которого всё можно пересчитать.

    Второе правило: **партиционирование по логической дате**. Обратите внимание на путь `dt={ds}` — он делает загрузку естественно идемпотентной: повторный запуск перезаписывает ровно одну партицию. Третье: __разделяйте extract и load на отдельные задачи__. Это даёт разные политики ретраев (сетевой extract стоит повторять агрессивнее, чем load) и понятную диагностику: сразу видно, отвалился источник или хранилище. И заметьте, что `extract` возвращает !!путь, а не данные!! — та же дисциплина, к которой мы подходим в следующем блоке.
- kind: content
  id: 022-podgotovka-batch-prognozov
  title: Подготовка батч-прогнозов
  bullets:
  - 'Классический ML-пайплайн: данные → фичи → инференс → витрина'
  - Модель загружается из реестра по версии, а не берётся из памяти
  - Прогнозы пишутся в таблицу с партицией по дате и версией модели
  - Обучение и инференс — обычно разные DAG с разным расписанием
  - Проверка качества данных до инференса дешевле, чем разбор плохих прогнозов
  code_caption: батч-инференс поверх dbt-витрины
  code: |
    @task
    def build_features(ds=None) -> str:
        """Витрина уже собрана dbt — берём срез за интервал."""
        return f"features_daily/dt={ds}"

    @task
    def predict(features_path: str, ds=None) -> int:
        model = registry.load("fraud_clf", stage="production")
        df = read(features_path)
        preds = model.predict(df)
        write_partition(
            table="fraud_scores", ds=ds,
            model_version=model.version, data=preds,
        )
        return len(preds)

    dbt_run >> build_features() >> predict(...)
  notes: |
    Батч-инференс — самый распространённый способ применения ML в продакшне, и Airflow здесь на своём месте. Логика цепочки: **dbt** собирает витрину фичей → задача формирует срез за интервал → задача инференса загружает модель и пишет прогнозы.

    Три вещи, которые отличают учебный пайплайн от рабочего. Первое: __модель загружается из реестра по версии__, а не подхватывается из локального файла — иначе вы не сможете ответить, какая модель дала конкретный прогноз. Второе: в таблицу прогнозов пишется **версия модели** рядом с датой — это делает результат воспроизводимым и позволяет сравнивать версии. Третье: обучение и инференс — !!разные DAG с разным расписанием!!: инференс ежедневный, переобучение — еженедельное или по триггеру дрейфа. Смешивать их в одном DAG — типичная ошибка, из-за которой невозможно перезапустить инференс, не переобучив модель.
- kind: content
  id: 023-assets-raspisanie-po-dannym-a
  title: Assets — расписание по данным, а не по времени
  materials:
  - label: Airflow — Assets (Data-aware scheduling)
    url: https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/datasets.html
  bullets:
  - DAG запускается не по cron, а по факту обновления датасета
  - 'Продюсер объявляет outlets, консюмер — schedule=[asset]'
  - Убирает хрупкие «запусти через час после соседнего DAG»
  - Раньше назывались Datasets, в Airflow 3 — Assets
  - Шаг навстречу asset-ориентированной модели Dagster
  code_caption: продюсер и консюмер связаны датасетом
  code: |
    from airflow.datasets import Dataset

    TX = Dataset("clickhouse://marts/fct_transactions")

    # DAG-продюсер: объявляет, что обновляет датасет
    dbt_run = BashOperator(
        task_id="dbt_run",
        bash_command="dbt run --select marts",
        outlets=[TX],
    )

    # DAG-консюмер: расписание = обновление датасета
    @dag(schedule=[TX], catchup=False)
    def scoring():
        ...
  notes: |
    До появления этой возможности связывание DAG между собой было болезненным: либо `TriggerDagRunOperator`, либо `ExternalTaskSensor`, либо — самый распространённый и самый хрупкий вариант — __«поставим второй DAG на час позже, за час первый точно успеет»__. Последнее ломается ровно в тот день, когда источник отдал данные с задержкой.

    **Assets** (в версиях 2.4–2.x они назывались **Datasets**) переворачивают логику: DAG-продюсер объявляет через `outlets`, что он обновляет некий датасет, а DAG-консюмер указывает `schedule=[TX]` — и запускается !!по факту обновления, а не по часам!!. Это шаг Airflow навстречу asset-ориентированной модели, которую мы разбирали на семинаре по **Dagster**: там граф изначально строится из данных, а не из задач. ~~Полезно понимать это как конвергенцию: оркестраторы движутся к общей модели с разных сторон.~~
- kind: section
  id: 024-peredacha-dannyh-xcom-i-ego
  title: 'Передача данных: XCom и его ограничения'
  notes: |
    Четвёртый блок — **как задачи обмениваются данными**.

    Разбираем **XCom**: что это, где физически хранится, почему туда !!нельзя!! класть датафреймы, и какой паттерн применять вместо этого. Это самая частая архитектурная ошибка в первых продакшн-пайплайнах.
- kind: content
  id: 025-chto-takoe-xcom
  title: Что такое XCom
  materials:
  - label: Airflow — XComs
    url: https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/xcoms.html
  bullets:
  - 'XCom = cross-communication, механизм обмена между задачами'
  - 'Физически — строка в таблице xcom в метабазе Airflow'
  - 'Ключ: dag_id + run_id + task_id + key'
  - 'return из @task автоматически кладёт значение в XCom'
  - 'Явно: ti.xcom_push(...) и ti.xcom_pull(...)'
  code_caption: два способа работы с XCom
  code: |
    # неявно — через TaskFlow
    @task
    def extract() -> str:
        return "s3://landing/tx/dt=2026-07-20/part.parquet"

    @task
    def load(path: str) -> int:   # значение придёт из XCom
        return copy_to_clickhouse(path)

    # явно — через классические операторы
    def _extract(ti, **_):
        ti.xcom_push(key="path", value="s3://...")

    def _load(ti, **_):
        path = ti.xcom_pull(task_ids="extract", key="path")
  notes: |
    **XCom** расшифровывается как *cross-communication* — механизм обмена небольшими значениями между задачами. И вот главный факт, который определяет всё остальное: !!XCom физически хранится строкой в таблице `xcom` метабазы Airflow!!. Не в файле, не в объектном хранилище, не в памяти воркера — в **PostgreSQL**, рядом с состояниями задач и историей запусков.

    Пока это осознано, всё остальное следует автоматически. Значение сериализуется, пишется в базу, при `xcom_pull` читается обратно и десериализуется. В TaskFlow API это происходит **неявно**: то, что вы возвращаете из `@task`, уходит в XCom, а то, что принимает аргументом следующая задача, оттуда извлекается. В классическом стиле — явно, через `xcom_push` и `xcom_pull`. __Удобство TaskFlow — это и его опасность: `return df` выглядит абсолютно естественно и при этом кладёт датафрейм в базу метаданных.__
- kind: content
  id: 026-ogranicheniya-xcom
  title: Ограничения XCom
  bullets:
  - 'Метабаза — не хранилище данных: XCom конкурирует за неё с планировщиком'
  - Есть жёсткий лимит размера значения (зависит от СУБД и бэкенда)
  - Сериализация JSON по умолчанию — датафрейм туда не кладётся честно
  - Раздутая таблица xcom замедляет весь Airflow, включая UI
  - Значения не чистятся автоматически без настроенного retention
  code_caption: антипаттерн и его цена
  code: |
    # ❌ АНТИПАТТЕРН — датафрейм через метабазу
    @task
    def extract() -> pd.DataFrame:
        return pd.read_sql("SELECT * FROM raw_tx", conn)  # 2 ГБ

    @task
    def transform(df: pd.DataFrame) -> pd.DataFrame:
        return df[df.amount > 0]

    # что происходит на самом деле:
    #  1. df сериализуется целиком
    #  2. пишется строкой в PostgreSQL метабазы
    #  3. читается обратно другим воркером
    #  → раздутая метабаза, медленный планировщик, OOM
  notes: |
    Разберём цену антипаттерна по шагам. Задача `extract` возвращает датафрейм на два гигабайта. Airflow добросовестно его сериализует и !!пишет одной строкой в PostgreSQL!!. Затем `transform`, возможно на другом воркере, читает эту строку обратно и десериализует.

    Последствия каскадные. Метабаза раздувается — а это та же база, куда планировщик каждые несколько секунд пишет состояния всех задач; её замедление тормозит **весь** Airflow, включая интерфейс. Воркер держит весь объём в памяти дважды (до и после сериализации) — отсюда OOM. Плюс жёсткий лимит на размер значения, зависящий от СУБД и настроенного бэкенда: обычно вы просто получите ошибку. И отдельная беда: __записи в `xcom` не удаляются сами__ — без настроенной политики очистки таблица растёт бесконечно. ~~Правило простое: если вы написали аннотацию `-> pd.DataFrame` у задачи Airflow, остановитесь.~~
- kind: table
  id: 027-chto-mozhno-i-chego-nelzya
  title: Что можно и чего нельзя передавать через XCom
  table:
    headers:
    - Передавать через XCom
    - Не передавать
    - Как правильно
    rows:
    - - Путь к файлу в S3 / HDFS
      - Сам файл или его содержимое
      - Записать в объектное хранилище, вернуть путь
    - - Имя таблицы или партиции
      - Результат SELECT
      - Материализовать таблицу, вернуть её имя
    - - Число строк, флаг, статус
      - DataFrame, массив numpy
      - Считать в хранилище, вернуть метрику
    - - Версия модели, id запуска
      - Сериализованная модель
      - Реестр моделей, вернуть версию
    - - Небольшой список ключей
      - Список из миллиона id
      - Временная таблица, вернуть её имя
  notes: |
    Эту таблицу стоит держать перед глазами при написании любого DAG. Принцип формулируется одной фразой: __через XCom ходят метаданные, а данные ходят через хранилище__.

    Логика в том, что задачи Airflow могут выполняться на разных машинах, поэтому им нужен общий канал. Общий канал — это !!объектное хранилище или база данных!!, а не метабаза оркестратора. Задача пишет результат в S3 или в таблицу и возвращает **адрес** этого результата; следующая задача по адресу его читает. Побочные выгоды такого подхода — промежуточные результаты сохраняются и доступны для отладки, а память воркера не зависит от объёма данных. Обратите внимание на последнюю строку: даже список идентификаторов, если их миллион, — это данные, а не метаданные. ~~Граница проходит по размеру и по смыслу одновременно.~~
- kind: content
  id: 028-pravilnyj-pattern-peredachi
  title: Правильный паттерн передачи
  bullets:
  - 'Задача пишет результат во внешнее хранилище'
  - 'Возвращает только адрес: путь, имя таблицы, партицию'
  - Следующая задача читает по адресу
  - Адрес детерминирован логической датой — значит идемпотентен
  - 'Для больших XCom-значений существуют кастомные backend’ы'
  code_caption: правильная версия того же пайплайна
  code: |
    # ✅ через XCom едет путь, данные — через S3
    @task
    def extract(ds=None) -> str:
        path = f"s3://staging/tx/dt={ds}/raw.parquet"
        pd.read_sql("SELECT * FROM raw_tx", conn).to_parquet(path)
        return path                      # ~60 байт в метабазе

    @task
    def transform(path: str, ds=None) -> str:
        out = f"s3://staging/tx/dt={ds}/clean.parquet"
        pd.read_parquet(path).query("amount > 0").to_parquet(out)
        return out

    @task
    def load(path: str) -> int:
        return ch.insert_from_s3(path, table="stg_tx")

    load(transform(extract()))
  notes: |
    Сравните этот код с антипаттерном двумя слайдами ранее — структура идентична, изменился только тип возвращаемого значения. Вместо датафрейма возвращается **строка с путём**: примерно шестьдесят байт в метабазе вместо двух гигабайт.

    Обратите внимание на важную деталь: путь содержит `dt={ds}`, то есть __адрес детерминирован логической датой__. Благодаря этому повторный запуск за тот же интервал перезапишет тот же файл — паттерн идемпотентен по построению, и retries с backfill работают корректно. Дополнительный бонус, который недооценивают: промежуточные файлы !!остаются доступными для отладки!! — можно скачать `clean.parquet` за прошлый вторник и посмотреть, что пошло не так. Существуют и кастомные **XCom backend'ы**, которые делают это прозрачно: значение уезжает в S3, а в метабазе остаётся ссылка. Но начинать стоит с явного паттерна — он понятнее и не прячет стоимость.
- kind: section
  id: 029-obrabotka-sboev
  title: Обработка сбоев
  notes: |
    Пятый блок — **что делать, когда падает**. А падать будет.

    Разбираем политики повторных попыток (`retries`, `retry_delay`, экспоненциальная задержка), таймауты, **trigger rules**, **SLA** и настройку **алертов** в Telegram и Mattermost.
- kind: content
  id: 030-politika-povtornyh-popytok
  title: Политика повторных попыток
  materials:
  - label: Airflow — Tasks и параметры повторов
    url: https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/tasks.html
  bullets:
  - 'retries — сколько раз повторить перед окончательным падением'
  - 'retry_delay — пауза перед повтором'
  - 'retry_exponential_backoff — растущая пауза вместо фиксированной'
  - 'max_retry_delay — потолок для растущей задержки'
  - 'execution_timeout — задача не может висеть вечно'
  - 'default_args задаёт политику для всех задач DAG сразу'
  code_caption: политика по умолчанию и точечное переопределение
  code: |
    default_args = {
        "retries": 2,
        "retry_delay": timedelta(minutes=5),
        "execution_timeout": timedelta(hours=1),
    }

    with DAG("fraud_daily", default_args=default_args, ...):

        # сеть капризна — повторяем агрессивнее, с backoff
        extract = PythonOperator(
            task_id="extract",
            python_callable=fetch_api,
            retries=5,
            retry_delay=timedelta(seconds=30),
            retry_exponential_backoff=True,
            max_retry_delay=timedelta(minutes=10),
        )

        # тяжёлый прогон — повторять дорого
        dbt_run = BashOperator(
            task_id="dbt_run",
            bash_command="dbt run --select marts",
            retries=1,
            execution_timeout=timedelta(hours=2),
        )
  notes: |
    Задавайте базовую политику в `default_args` — она применится ко всем задачам DAG — и **переопределяйте точечно** там, где природа сбоя другая. В примере видна главная идея: __разным задачам нужны разные политики__.

    Сетевой `extract` падает от временных причин — таймаут API, разрыв соединения. Его стоит повторять агрессивно (пять попыток), но с **экспоненциальной задержкой**: если внешний сервис лежит, долбить его каждые тридцать секунд бессмысленно и невежливо. Параметр `max_retry_delay` ставит потолок, чтобы задержка не выросла до часов. Тяжёлый `dbt run`, наоборот, повторять дорого — одна попытка, зато с `execution_timeout`, чтобы зависший прогон не занимал слот воркера бесконечно.

    И критическое напоминание: !!ретраи безопасны только для идемпотентных задач!!. Повтор неидемпотентной загрузки не чинит проблему, а множит данные. __Прежде чем ставить `retries=3`, ответьте себе: что произойдёт, если эта задача выполнится трижды.__
- kind: table
  id: 031-kakuyu-politiku-retraev-vybrat
  title: Какую политику ретраев выбрать
  table:
    headers:
    - Тип задачи
    - Политика
    - Почему
    rows:
    - - 'Вызов внешнего API'
      - 'retries=5, backoff, старт 30 с'
      - Сбои временные, но сервис нельзя долбить
    - - 'Загрузка в хранилище'
      - 'retries=3, delay 5 мин'
      - Обычно сеть или блокировка, проходит само
    - - 'Тяжёлый dbt run'
      - 'retries=1, execution_timeout'
      - Повтор дорог; чаще это ошибка в SQL, а не сбой
    - - 'Обучение модели'
      - 'retries=0, алерт'
      - Повтор бессмыслен без разбора причины
    - - 'Сенсор ожидания'
      - 'timeout + mode=reschedule'
      - Ретраи не нужны, нужен предел ожидания
  notes: |
    Общее правило: **чем дороже задача и чем вероятнее, что причина сбоя логическая, тем меньше ретраев**. Повтор лечит !!транзиентные!! сбои — сеть моргнула, база была занята, диск был занят. Он не лечит !!детерминированные!! ошибки: если в SQL опечатка, третья попытка даст ту же опечатку, просто на пятнадцать минут позже.

    Отсюда крайние строки таблицы. Внешний API — максимум ретраев с backoff, потому что там почти все сбои транзиентные. Обучение модели — __ноль ретраев и сразу алерт человеку__: если обучение упало, нужен разбор, а не автоматический повтор часового прогона на GPU. И обратите внимание на строку про сенсоры: им нужны не ретраи, а `timeout` — иначе задача будет ждать вечно и будет считаться живой, хотя данных нет уже сутки. ~~Отсутствие алерта в этом случае страшнее самого сбоя.~~
- kind: content
  id: 032-trigger-rules-chto-delat-s
  title: Trigger rules — что делать с упавшей веткой
  bullets:
  - 'По умолчанию all_success — задача ждёт успеха всех родителей'
  - 'all_done — выполнится независимо от результата (уборка, уведомление)'
  - 'one_failed — сработает, если упал хоть один родитель'
  - 'none_failed_min_one_success — продолжить после ветвления'
  - 'upstream_failed — статус, а не правило: родитель не дал шанса'
  code_caption: задача-уведомитель и задача-уборщик
  code: |
    from airflow.utils.trigger_rule import TriggerRule

    cleanup = PythonOperator(
        task_id="cleanup_tmp",
        python_callable=drop_tmp_tables,
        trigger_rule=TriggerRule.ALL_DONE,   # даже если упало
    )

    alert = PythonOperator(
        task_id="alert_on_failure",
        python_callable=send_telegram,
        trigger_rule=TriggerRule.ONE_FAILED,
    )

    [extract, load, dbt_run] >> cleanup
    [extract, load, dbt_run] >> alert
  notes: |
    **Trigger rule** отвечает на вопрос: при каком состоянии родителей запускать задачу. По умолчанию действует `all_success` — задача ждёт успеха всех вышестоящих, и это правильное поведение для основной цепочки обработки.

    Но два случая требуют другого. Первый — **уборка**: временные таблицы надо удалить !!независимо от того, упал пайплайн или нет!!, для этого `all_done`. Второй — **уведомление о сбое**: задача с `one_failed` сработает, если упал хоть один родитель. Отдельно обратите внимание на статус `upstream_failed`: это не правило, а состояние — оно означает, что задача даже не пыталась выполниться, потому что родитель не дал ей шанса. При разборе инцидента __ищите первую задачу со статусом `failed`, а не море `upstream_failed` после неё__: они лишь следствие.
- kind: content
  id: 033-alerty-pri-padenii
  title: Алерты при падении
  materials:
  - label: Airflow — Callbacks и уведомления
    url: https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/callbacks.html
  bullets:
  - 'on_failure_callback — функция вызывается при падении задачи'
  - 'on_retry_callback, on_success_callback, sla_miss_callback'
  - 'Задаётся в default_args — единая политика на весь DAG'
  - 'В context есть dag_id, task_id, logical_date и ссылка на лог'
  - 'Каналы: Telegram, Mattermost, Slack, PagerDuty, email'
  code_caption: уведомление в Telegram при падении задачи
  code: |
    import requests

    def notify_failure(context) -> None:
        ti = context["task_instance"]
        text = (
            f"🔴 Airflow: задача упала\n"
            f"DAG: {ti.dag_id}\n"
            f"Task: {ti.task_id}\n"
            f"Дата: {context['logical_date']:%Y-%m-%d}\n"
            f"Попытка: {ti.try_number}\n"
            f"Лог: {ti.log_url}"
        )
        requests.post(
            f"https://api.telegram.org/bot{TOKEN}/sendMessage",
            json={"chat_id": CHAT_ID, "text": text},
            timeout=10,
        )

    default_args = {
        "retries": 2,
        "on_failure_callback": notify_failure,
    }
  notes: |
    **Callback** — функция, которую Airflow вызывает при определённом событии. Самый нужный — `on_failure_callback`. Задавайте его в `default_args`, чтобы политика уведомлений была единой для всего DAG, а не расставлялась по задачам вручную.

    Обратите внимание на содержимое сообщения — это не косметика, а определяющий фактор скорости реакции. В контексте доступны `dag_id`, `task_id`, `logical_date`, номер попытки и, что важнее всего, `log_url` — !!прямая ссылка на лог упавшей задачи!!. Сообщение вида «что-то упало» бесполезно: дежурный всё равно пойдёт искать. __Хороший алерт позволяет за один клик попасть в лог.__ Отдельно отметьте `try_number`: если стоит `retries=2`, уведомлять имеет смысл на финальном провале, иначе канал зашумится сообщениями о попытках, которые благополучно прошли со второго раза. Про построение алертинга в Telegram и Mattermost подробнее — в лекции по CI/CD и Observability.
- kind: content
  id: 034-sla-zombi-zadachi-i
  title: SLA, зомби-задачи и наблюдаемость
  bullets:
  - 'SLA — ожидаемая длительность; превышение вызывает sla_miss_callback'
  - '«Задача не упала, но идёт четыре часа вместо двадцати минут» — тоже инцидент'
  - 'Zombie task — процесс воркера умер, метабаза считает задачу живой'
  - 'Планировщик помечает зомби failed по таймауту heartbeat'
  - 'Метрики Airflow отдаются в StatsD / OpenTelemetry → Prometheus'
  - Не забывайте про очистку старых логов и таблицы xcom
  code_caption: SLA и обработка его нарушения
  code: |
    def on_sla_miss(dag, task_list, blocking_task_list, slas, blocking_tis):
        send_telegram(f"🟡 SLA нарушен: {dag.dag_id} / {task_list}")

    with DAG(
        "fraud_daily",
        sla_miss_callback=on_sla_miss,
        default_args={"on_failure_callback": notify_failure},
    ):
        dbt_run = BashOperator(
            task_id="dbt_run",
            bash_command="dbt run --select marts",
            sla=timedelta(minutes=40),   # ожидаемый потолок
        )
  notes: |
    Падение — не единственный вид сбоя, и часто не самый опасный. **SLA** в Airflow — это ожидаемая длительность выполнения; при её превышении вызывается `sla_miss_callback`. Ситуация «задача не упала, но вместо двадцати минут идёт четыре часа» !!не породит ни одного алерта без явно настроенного SLA!!, а прогнозы к утру при этом не появятся.

    Второе явление — **зомби-задачи**. Процесс воркера умер (OOM, убитый под, перезагрузка машины), но в метабазе задача числится `running`. Планировщик отслеживает heartbeat и по таймауту помечает такие задачи как упавшие — но между смертью процесса и обнаружением проходит время, и это стоит учитывать. Наконец, эксплуатационная гигиена: Airflow отдаёт метрики через **StatsD**/**OpenTelemetry**, их стоит завести в **Prometheus** и построить дашборд по длительностям и провалам. И обязательно настройте __очистку старых логов и таблицы `xcom`__ — иначе через полгода метабаза станет узким местом. ~~Оркестратор тоже нуждается в наблюдении.~~
- kind: section
  id: 035-sravnenie-i-itogi
  title: Сравнение и итоги
  notes: |
    Последний содержательный блок.

    Честно сравниваем **Airflow** с **Dagster** и **Prefect**, которые мы разбирали на предыдущих семинарах, и формулируем, когда какой инструмент уместен.
- kind: table
  id: 036-airflow-vs-dagster-vs-prefect
  title: Airflow vs Dagster vs Prefect
  table:
    headers:
    - Критерий
    - Airflow
    - Dagster / Prefect
    rows:
    - - Базовая абстракция
      - Задача в графе (task-centric)
      - 'Dagster: ассет · Prefect: flow/task'
    - - Возраст и зрелость
      - С 2014, отраслевой стандарт
      - 'Dagster с 2018, Prefect с 2018'
    - - Экосистема интеграций
      - Максимальная, сотни провайдеров
      - Меньше, но покрывает основное
    - - Локальная разработка
      - Требует поднятой инфраструктуры
      - 'Dagster: dagster dev · Prefect: просто python'
    - - Типизация и тесты
      - Слабые, задача — чёрный ящик
      - Типы на входах/выходах, тесты проще
    - - Передача данных
      - 'XCom, только метаданные'
      - IO managers / results — данные первичны
    - - Рынок труда
      - Больше всего вакансий и специалистов
      - Растёт, но ниша уже
  notes: |
    Сравнение честное, без маркетинга. Главное различие — **базовая абстракция**. Airflow мыслит __задачами__: «выполни это, потом то». Dagster мыслит __ассетами__: «эта таблица должна существовать и быть свежей». Prefect мыслит __потоками управления__ на чистом Python. Разные модели дают разные удобства: в Dagster проще отвечать на вопрос «откуда взялась эта витрина», в Airflow — «что и когда выполнялось».

    Где Airflow объективно сильнее: !!зрелость!!, !!экосистема провайдеров!! и !!рынок труда!!. Где слабее: локальная разработка требует поднятой инфраструктуры, задача остаётся чёрным ящиком без типов на входах и выходах, а данные приходится гонять в обход оркестратора. Практический вывод для вас: __Airflow надо знать в любом случае__ — он стоит в большинстве компаний, и туда вы придёте работать. Новый проект с нуля стоит осознанно сравнить с Dagster. ~~Напомню, что на семинаре по Dagster мы разбирали и обратный переход — dagster-airlift для миграции с Airflow.~~
- kind: content
  id: 037-horoshie-praktiki
  title: Хорошие практики
  bullets:
  - Идемпотентность каждой задачи — база для retries и backfill
  - 'Через XCom — только метаданные; данные — через хранилище'
  - 'Одна задача — одна ответственность: extract, load и transform отдельно'
  - Никакого «тяжёлого» кода на верхнем уровне DAG-файла
  - 'Явные execution_timeout и sla — молчаливое зависание опаснее падения'
  - 'Подключения и секреты — в Connections/Variables, не в коде'
  - 'catchup=False по умолчанию; backfill — осознанно'
  code_caption: главная ошибка на верхнем уровне DAG-файла
  code: |
    # ❌ выполняется при КАЖДОМ парсинге DAG (каждые ~30 секунд!)
    df = pd.read_sql("SELECT * FROM huge_table", conn)

    with DAG("bad", ...) as dag:
        ...

    # ✅ тяжёлая работа — внутри задачи
    @task
    def load() -> str:
        df = pd.read_sql("SELECT * FROM huge_table", conn)
        ...
  notes: |
    Соберём практики в один чек-лист. Первые три пункта мы разобрали подробно: **идемпотентность**, **метаданные вместо данных в XCom**, **разделение ответственности** между задачами.

    Отдельно остановлюсь на четвёртом, потому что он неочевиден и больно бьёт. Код на верхнем уровне DAG-файла выполняется !!при каждом парсинге DAG планировщиком!! — то есть примерно раз в тридцать секунд, круглосуточно. Запрос к базе, положенный туда «просто чтобы получить список источников», превращается в две с половиной тысячи запросов в сутки и в тормозящий планировщик. __Любая тяжёлая работа должна быть внутри задачи.__

    И последнее: **секреты**. Пароли и токены живут в Connections и Variables (а лучше — во внешнем секрет-бэкенде), а не в коде DAG, который лежит в git. ~~Утёкший в репозиторий пароль от прода — это инцидент, а не мелочь.~~
- kind: content
  id: 038-domashnee-zadanie
  title: Домашнее задание
  bullets:
  - 'Оркестрировать ваш dbt-проект по фрод-транзакциям в Airflow'
  - 'DAG fraud_daily: extract → load → dbt run → dbt test → scoring'
  - 'Расписание ежедневное, catchup=False, задачи идемпотентны по {{ ds }}'
  - 'Через XCom передавать только пути и метрики — никаких датафреймов'
  - 'Политика retries: разная для сетевых и тяжёлых задач'
  - 'on_failure_callback с уведомлением (Telegram или лог с полным контекстом)'
  - 'Сдача: репозиторий с dags/, docker-compose и README со скриншотом графа'
  code_caption: каркас DAG для сдачи
  code: |
    @dag(
        dag_id="fraud_daily",
        schedule="0 3 * * *",
        start_date=pendulum.datetime(2026, 7, 1, tz="UTC"),
        catchup=False,
        default_args={
            "retries": 2,
            "retry_delay": timedelta(minutes=5),
            "on_failure_callback": notify_failure,
        },
        tags=["mlinside", "hw"],
    )
    def fraud_daily():
        raw   = extract()          # → путь
        rows  = load(raw)          # → число строк
        dbt   = run_dbt()          # BashOperator
        tests = test_dbt()
        rows >> dbt >> tests >> scoring()

    fraud_daily()
  notes: |
    Домашнее задание продолжает **ваш dbt-проект по фрод-транзакциям** из девятого семинара — писать модели заново не нужно, нужно поставить их на расписание и обвязать оркестрацией.

    Минимальный контур такой: `extract` забирает сырьё за логическую дату и возвращает путь; `load` перезаписывает партицию в ClickHouse и возвращает число строк; `dbt run` и `dbt test` прогоняют ваши модели; `scoring` считает батч-прогноз по витрине. Поднять Airflow проще всего в **Docker Compose** с `LocalExecutor` — этого достаточно, кластер не нужен.

    На что я буду смотреть в первую очередь: !!идемпотентны ли задачи!! (перезапуск за вчера не должен задваивать данные), !!что именно ездит через XCom!! (пути и метрики — да, датафреймы — нет) и !!осмысленна ли политика ретраев!! (одинаковый `retries=3` на всех задачах — это не политика). __Сдача — ссылка на репозиторий с папкой `dags/`, `docker-compose.yml` и README со скриншотом успешного графа.__
- kind: table
  id: 039-kriterii-ocenki
  title: Критерии оценки
  table:
    headers:
    - Уровень
    - Что сделано
    - Баллы
    rows:
    - - Базовый
      - 'DAG запускается по расписанию, dbt-модели прогоняются, есть retries'
      - 6–7
    - - Продвинутый
      - '+ идемпотентность по {{ ds }}, XCom только с метаданными, dbt test'
      - 8–9
    - - Отличный
      - '+ алерт с контекстом, execution_timeout/SLA, батч-скоринг, README'
      - '10'
  notes: |
    Критерии повторяют логику дбт-задания, чтобы вам было привычно. **Базовый уровень** — работающий DAG на расписании с прогоном dbt и заданными ретраями: этого достаточно, чтобы показать, что вы поняли механику.

    **Продвинутый** требует того, что отличает учебный пайплайн от рабочего: !!идемпотентность по логической дате!! и !!дисциплина XCom!!. Я буду проверять это буквально — попробую перезапустить ваш DAG за прошлую дату и посмотрю, что произошло с данными. **Отличный уровень** добавляет эксплуатационную зрелость: осмысленный алерт со ссылкой на лог, таймауты, батч-скоринг и внятный README. __README с описанием того, как поднять проект, — это не формальность: если я не смогу запустить, я не смогу и оценить.__
