presentations:
- topic: Разработка ML-сервисов и контейнеризация (FastAPI & Docker)
  owner: Влад Бояджи
  accents:
  - 'Проектирование API: Создание легковесных REST API на FastAPI и валидация входящих тензоров/данных
    через Pydantic.'
  - 'Анатомия Docker: Разница между виртуальными машинами и контейнерами. Архитектура Docker (Daemon,
    Client, Images, Containers).'
  - 'Сборка эффективных ML-образов: Написание оптимальных Dockerfile. Использование Multi-stage builds
    для уменьшения веса образа (отдельно сборка зависимостей, отдельно рантайм).'
  - 'Оптимизация под тяжелый ML: Кэширование слоев Docker (pip install), выбор правильных базовых образов
    (Slim vs Alpine, нюансы компиляции C++ библиотек вроде LightGBM/XGBoost).'
  - 'Управление окружением: Работа со сложными зависимостями (CUDA, PyTorch, TensorFlow) внутри контейнера.'
  - 'Docker Compose в ML: Оркестрация локального окружения. Одновременный запуск сервиса с моделью, локальной
    БД и хранилища весов (MinIO/S3).'
  - 'Постоянное хранение данных: Работа с Docker Volumes и Bind Mounts для сохранения логов предсказаний
    и локальных артефактов.'
  content: null
  out_name: null
- topic: Асинхронный стриминг данных (Apache Kafka в ML)
  owner: Влад Бояджи
  accents:
  - 'Концепция событийной архитектуры: Зачем нужен стриминг в ML, отличия от пакетной (batch) обработки.'
  - 'Анатомия Kafka: Темы (Topics), партиции, продюсеры (Producers) и консьюмеры (Consumers).'
  - 'Стриминг признаков: Отправка логов поведения пользователей в реальном времени для расчета динамических
    фичей.'
  - 'Отказоустойчивость: Обработка ошибок при потере соединения и гарантии доставки сообщений.'
  content: null
  out_name: null
- topic: Хранилища данных и MPP-системы (ClickHouse)
  owner: Влад Бояджи
  accents:
  - 'Эволюция хранения: Различия, архитектурные сдвиги и юзкейсы для концепций Data Lake (сырые данные),
    Data Warehouse (структурированные DWH) и Lakehouse (Delta Lake / Iceberg).Парадигмы обработки:'
  - Смена подходов ETL (классический) на ELT (современный подход, где тяжелые трансформации
    переносятся внутрь мощных БД).
  - 'Архитектура MPP (Massively Parallel Processing): Принципы распределенного выполнения запросов, разделение
    данных по узлам (Sharding) и репликация. Почему MPP незаменимы для Big Data.'
  - 'Моделирование данных: Проектирование классических схем «Звезда» (Star Schema) и «Снежинка» (Snowflake
    Schema). Их плюсы, минусы и применимость в аналитических хранилищах.'
  - 'Колоночный подход: Внутреннее устройство ClickHouse. Почему колоночные БД работают в сотни раз быстрее
    построчных (PostgreSQL) на аналитических выборках и подготовке фичей.'
  - 'Оптимизация производительности: Индексы в ClickHouse, выбор правильного ключа сортировки (ORDER BY),
    движки семейства MergeTree, материализованные представления (Materialized Views).'
  - 'Примеры использования в MLOps:'
  - ClickHouse как сверхбыстрое хранилище истории предсказаний и логов для мониторинга.
  - Использование MPP-систем для расчета "тяжелых" батч-фичей на миллиардах строк.
  - Сквозная аналитика качества моделей (стыковка предсказаний с реальными
    бизнес-метриками/таргетами спустя время).
  content: null
  out_name: null
