    **Для MLE:**
    - Цель — `mart_delivery_features` с таргетом `is_late_delivery`.
    - Задача: предсказать, приедет ли заказ позже обещанной даты.

    **Пример:**
    - Признак `customer_seller_distance_km` восстанавливается из geolocation по zip-префиксам покупателя и продавца — координат в заказе нет, но их можно собрать.

    **Осторожно:**
