- kind: content
  id: 060-izmenenie-sql-fichi-eto-izmenenie-ml-sistemy
  title: 'Изменение SQL-признака — это изменение ML-системы'
  bullets:
  - 'Правка одной строки SQL меняет распределение признака'
  - 'Модель, обученная до правки, в проде получает другие данные'
  - 'Значит transformation code требует той же дисциплины, что и код обучения'
  - 'Значит нужен PR, ревью, автотесты и воспроизводимая сборка'
  code_lang: diagram
  code: |2
    изменение SQL-признака
              │
              ↓
           Git PR
              │
              ↓
    dbt parse / compile
              │            # шаблон рендерится?
              ↓
    dbt build --select state:modified+
              │            # изменённое и всё ниже
              ↓
        code review
              │
              ↓
           merge
              │
              ↓
    production dbt build
              │
              ↓
     training pipeline
  notes: |2
    [~1.5 мин] **Главное:** !!SQL-признак — это часть ML-системы!!, а не «просто запрос аналитика». Отсюда всё остальное на слайде.

    **Рассказ:** пройти по цепочке. `dbt parse`/`compile` — самая быстрая проверка: рендерится ли шаблон вообще. Дальше `dbt build --select state:modified+` — собираются только изменённые модели и всё, что от них зависит; это и есть Slim CI. Потом ревью человеком, мердж, прод-сборка, и только затем обучение.

    **Для MLE:** проговорить последствие явно. Вы поправили определение `freight_share` — распределение признака поехало. Модель в проде обучена на старом распределении. Формально ничего не сломалось: тесты зелёные, пайплайн зелёный, метрика деградирует тихо.

    Отсюда практический вывод: !!изменение feature-логики должно триггерить переобучение!!, а не просто доезжать до витрины.

    **Осторожно:** ревью SQL часто воспринимают как формальность — «ну это же просто запрос». Это ровно та же ошибка, из-за которой десять лет назад появился Analytics Engineering.

    **Переход:** ~~«Как это выглядит в конфигах».~~
- kind: content
  id: 061-ci-dlya-dbt
  title: 'CI для dbt: pre-commit и Slim CI'
  bullets:
  - 'pre-commit — быстрая защита до push: формат и линт SQL'
  - 'В CI — чистое окружение и обязательный барьер перед merge'
  - 'state:modified+ пересобирает только изменённое и его потомков'
  - '--defer берёт неизменённые модели из прода, не пересобирая их'
  - 'Артефакты прод-прогона (manifest.json) — вход для сравнения'
  code_caption: .pre-commit-config.yaml · CI job
  code_lang: yaml
  code: |2
    # локально, до коммита
    repos:
      - repo: tconbeer/sqlfmt
        hooks: [sqlfmt]
      - repo: sqlfluff/sqlfluff
        hooks: [sqlfluff-lint]
      - repo: dbt-checkpoint/dbt-checkpoint
        hooks: [dbt-compile, check-model-has-tests]

    # в CI на merge request
    # артефакты прода лежат в ./artifacts/prod
    script:
      - dbt deps
      - dbt build
          --select state:modified+
          --defer --state ./artifacts/prod
  notes: |2
    [~2 мин] **Главное:** два рубежа: дешёвый локальный и обязательный в CI.

    **Разбор кода:** сверху `pre-commit`: формат, линт и `check-model-has-tests` — хук, который !!не пускает модель без тестов!!. Для feature layer это лучшее правило из всех, что можно включить одной строкой.

    Снизу CI. Ключевые флаги: `state:modified+` — изменённые модели и все их потомки; `--defer --state` — всё остальное берём из прода, не пересобирая.

    Не разбирать: где именно хранятся артефакты, у каждой команды свой способ.

    **Для MLE:** экономика простая. Полная сборка витрин на каждый PR может занимать часы. Slim CI сводит проверку к тому, что вы реально тронули, и делает барьер приемлемым по времени — а значит его не отключат.

    **Осторожно:** `state:modified` сравнивает с манифестом прошлого прогона. Если артефакты устарели или потерялись, сравнение молча деградирует и в сборку попадёт не то, что вы ожидали. Обновление артефактов — часть прод-пайплайна.

    **Переход:** ~~«Соберём итоговую картину признаков Olist».~~
- kind: table
  id: 062-priznaki-mart-delivery-features
  title: 'mart_delivery_features: что внутри витрины'
  table:
    headers:
    - Признак
    - Откуда
    - Осторожно
    rows:
    - - item_count, seller_count
      - Свёртка stg_order_items до заказа
      - Считать до join, иначе строки размножатся
    - - total_price, freight_value
      - Суммы позиций заказа
      - 'coalesce(...,0) корректен: «нет позиций» = ноль'
    - - freight_share
      - safe_divide(freight, total)
      - Деление на ноль → NULL, не inf
    - - customer_seller_distance_km
      - geolocation по zip-префиксам, гаверсинус
      - У части заказов координат нет → NULL
    - - product_weight_g
      - Средний вес позиций заказа
      - У 610 товаров категория и вес отсутствуют
    - - order_hour, order_dow
      - Части даты покупки, посчитаны в staging
      - Считать один раз в staging, не в каждой витрине
    - - seller_avg_delay_90d
      - int_seller_delay_history, point-in-time
      - Только завершённые ДО момента покупки
    - - target_is_late
      - stg_orders, сравнение факта с обещанием
      - 'NULL = исход неизвестен, исключать из обучения'
    col_ratios:
    - 4
    - 5
    - 6
  notes: |2
    [~1.5 мин] **Главное:** итоговая витрина одной таблицей — и у каждого признака есть своя ловушка.

    **Рассказ:** не читать всё. Взять три строки с самыми поучительными оговорками: `freight_share` (деление на ноль), `seller_avg_delay_90d` (point-in-time) и `target_is_late` (NULL как третье состояние).

    **Для MLE:** обратите внимание, что колонка «Осторожно» — это по сути !!список тестов, которые надо написать!!. Почти каждая строка превращается в проверку в `_marts__models.yml`.

    **Пример:** «у части заказов координат нет» → тест на долю NULL, а не на их отсутствие. Признак имеет право быть пустым; он не имеет права быть пустым у половины выборки.

    **Осторожно:** не подавать это как «правильный набор признаков». Это иллюстрация того, как выглядит витрина, за которую кто-то отвечает.

    **Переход:** ~~«И финальная картинка».~~
