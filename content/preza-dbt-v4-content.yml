    - Отсюда и sweet spot.
    - Cosmos — когда dbt один из шагов в большом пайплайне, где рядом ingestion, обучение и деплой. dmp-af — когда dbt-проект сам по себе большой, разделён по доменам, и им владеют люди, которым Airflow неинтересен.

    **Для MLE:**
    - Для нашего сценария — ingestion, dbt, обучение, реестр — !!Cosmos подходит лучше!!, потому что dbt здесь честно один шаг из пяти.
