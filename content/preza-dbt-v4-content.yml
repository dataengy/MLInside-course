- kind: content
  id: 050-zachem-airflow-esli-est-dag
  title: 'dbt строит DAG. Зачем тогда Airflow?'
  bullets:
  - 'dbt знает зависимости ТРАНСФОРМАЦИЙ — и только их'
  - 'Production pipeline шире: до dbt есть ingestion, после — обучение'
  - 'Нужны расписание, ретраи, SLA, алерты, backfill по датам'
  - 'Нужна одна точка наблюдаемости на весь путь, а не на его середину'
  - 'Нужны зависимости между командами и системами, а не только между моделями'
  code_lang: diagram
  code: |2
      ingestion
             │
             ↓
      ┌──────────────────────────────────────┐
      │  dbt граф   ←── dbt знает только это │
      └──────────────────────────────────────┘
             │
             ↓
      validation
             │
             ↓
      training
             │
             ↓
      evaluation
             │
             ↓
      registry
             │
             ↓
      deploy / notify
  notes: |2
    [97:06–99:06 · ~2 мин] **Главное:**
    - dbt отвечает за середину пути.
    - Оркестратор отвечает за путь целиком.

    **Рассказ:**
    - Задать вопрос залу и дать паузу: «dbt сам строит DAG и сам знает порядок сборки.
    - Зачем сверху ещё один DAG?» Ответ по схеме: у dbt нет и не должно быть представления о том, что !!до!! него отработала загрузка, а !!после!! него надо обучить модель, посчитать метрики и положить артефакт в реестр.
    - Плюс всё то, что отличает production-запуск от запуска руками: расписание, ретраи с бэкоффом, SLA, алерты, повторный прогон за прошлую дату.

    **Практический смысл:**
    - Практический критерий: как только `dbt build` перестал быть последней командой в вашем пайплайне — нужен оркестратор.

    **Осторожно:**
    - Обратная крайность тоже встречается — описывать зависимости между моделями руками в Airflow.
    - Это дублирование графа, который dbt уже посчитал, и оно расходится с реальностью на первой же правке.

    **Переход:**
    - ~~«Способов соединить их несколько — от совсем простого до зрелого».~~
