    - Это ровно тот список практик, который у Python-кода считается нормой, а у SQL-трансформаций почему-то нет.

    **Рассказ:**
    - Быстро, по строке.
    - Ключевая мысль: !!ни одно из свойств не уникально для dbt!! — уникально то, что все восемь получаешь из коробки, без сборки своей платформы.
