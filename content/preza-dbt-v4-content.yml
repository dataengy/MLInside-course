- kind: content
  id: 017-stg-orders-olist
  title: 'staging: чистка и производные поля'
  bullets:
  - Один источник — одна staging-модель, без соединений
  - Здесь появляются типы, флаги и части даты
  - 'Доставленным считаем по НАЛИЧИЮ даты, а не по статусу'
  - 'NULL там, где «неизвестно» — не подменяем нулём'
  code_caption: models/staging/stg_orders.sql
  code_lang: sql
  code: |2
    {{ config(materialized='view') }}

    select
      order_id,
      customer_id,
      order_status,
      order_purchase_timestamp,
      order_delivered_customer_date,
      order_estimated_delivery_date,

      toHour(order_purchase_timestamp) as order_hour,
      toDayOfWeek(order_purchase_timestamp) as order_dow,

      -- «неизвестно» ≠ «вовремя»
      case
        when order_delivered_customer_date is null
          then null
        when dateDiff('day',
               order_estimated_delivery_date,
               order_delivered_customer_date) > 0
          then 1
        else 0
      end as is_late_delivery

    from {{ source('olist_raw', 'orders') }}
  notes: |2
    [47:36–48:36 · ~1 мин] **Главное:**
    - staging — это место, где сырые данные становятся пригодными к употреблению, и !!единственное место!!, где это делается.

    **Разбор кода:**
    - Показать две вещи.
    - Первая — `toHour`/`toDayOfWeek`: временные признаки считаются один раз здесь, а не в каждой витрине.
    - Вторая — блок `case` с `null`: у 2 965 заказов Olist нет даты доставки, и мы честно ставим NULL.
    - Не разбирать: перечисление колонок сверху.

    **Для MLE:**
    - Это ваш таргет.
    - `is_late_delivery` = 1, если приехало позже обещанного.
    - NULL означает «исход неизвестен» — такие строки из обучающей выборки надо исключать явно, а не молча считать их «вовремя».

    **Пример:**
    - Два заказа в Olist имеют `order_status = 'delivered'` без даты доставки.
    - Если определять доставленность по статусу, они попадут в выборку с непонятным таргетом.

    **Осторожно:**
    - !!Подмена NULL нулём — самая частая тихая ошибка!! на этом слое.
    - Доля просрочек сразу занижается, и модель учится не тому.

    **Переход:**
    - ~~«Дальше — соединения. Это следующий слой».~~
- kind: content
  id: 018-int-order-level-olist
  title: 'intermediate: заказ ровно одной строкой'
  bullets:
  - Позиции сворачиваем ДО соединения — иначе join размножит строки
  - Все соединения LEFT — 775 заказов не имеют позиций
  - Гранулярность названа в имени модели и проверена тестом
  code_caption: models/intermediate/int_order_level.sql
  code_lang: sql
  code: |2
    {{ config(materialized='table') }}

    with items as (
      -- сначала свернули до заказа,
      -- только потом соединяем
      select
        order_id,
        count(*)                  as item_count,
        count(distinct seller_id) as seller_count,
        sum(price)                as items_value,
        sum(freight_value)        as freight_value
      from {{ ref('stg_order_items') }}
      group by order_id
    )

    select
      o.*,
      coalesce(i.item_count, 0)    as item_count,
      coalesce(i.seller_count, 0)  as seller_count,
      coalesce(i.items_value, 0)   as items_value,
      coalesce(i.freight_value, 0) as freight_value,
      d.customer_seller_distance_km
    from {{ ref('stg_orders') }} as o
    left join items as i using (order_id)
    left join {{ ref('int_order_distance') }} as d
           using (order_id)
  notes: |2
    [48:36–50:06 · ~1.5 мин] **Главное:**
    - Одна строка = один заказ.
    - Это утверждение, за которое модель отвечает и которое проверяется тестом.

    **Разбор кода:**
    - Показать CTE `items` и сказать вслух: !!свёртка до соединения!!.
    - Если сначала сджойнить позиции, а потом группировать — заказ из пяти позиций даст пять строк, и любая метрика «по заказам» поедет.
    - Вторая точка — `left join`.
    - Не `inner`.
    - 775 заказов Olist не имеют ни одной позиции; inner тихо выбросил бы их и занизил и выручку, и долю просрочек.
    - Не разбирать: `int_order_distance` — это отдельная модель с формулой гаверсинуса, её содержимое сейчас не важно.

    **Практический смысл:**
    - `coalesce(..., 0)` здесь корректен: «позиций нет» действительно означает ноль позиций.
    - Сравните со слайдом про staging, где ноль был бы ложью.
    - !!Решение про NULL принимается по смыслу поля, а не по привычке.!!

    **Осторожно:**
    - «Размножение строк джойном» — ошибка, которую почти невозможно заметить глазами.
    - Ловится тестом `dbt_utils.equal_rowcount` против `stg_orders`.

    **Переход:**
    - ~~«И наконец витрина признаков».~~
- kind: content
  id: 019-mart-delivery-features-olist
  title: 'feature mart: витрина признаков для обучения'
  code_caption: models/marts/mart_delivery_features.sql
  code_lang: sql
  code: |2
    {{ config(materialized='incremental', unique_key='order_id',
              engine='MergeTree()', order_by='(order_purchase_date, order_id)',
              partition_by='toYYYYMM(order_purchase_date)') }}
    select
      o.order_id,
      toDate(o.order_purchase_timestamp)      as order_purchase_date,

      o.item_count,                              -- размер и стоимость заказа
      o.seller_count,
      o.items_value + o.freight_value         as total_price,
      {{ safe_divide('o.freight_value', 'o.items_value + o.freight_value') }}
                                              as freight_share,

      o.customer_seller_distance_km,             -- география и время
      o.order_hour,
      o.order_dow,

      s.seller_avg_delay_90d,                    -- история продавца КАК БЫЛО на момент заказа
      o.is_late_delivery                      as target_is_late   -- таргет

    from {{ ref('int_order_level') }} as o
    left join {{ ref('int_seller_delay_history') }} as s using (order_id)
    {% if is_incremental() %}
      where o.order_purchase_timestamp >=
            (select max(order_purchase_date) - interval 7 day from {{ this }})
    {% endif %}
  notes: |2
    [50:06–52:06 · ~2 мин] **Главное:**
    - Это уже не «витрина для дашборда».
    - Это !!контракт обучающей выборки!!: колонки, гранулярность, таргет.

    **Разбор кода:**
    - Четыре точки.
    - Первая — `config`: инкрементальная материализация с `unique_key`, движок и ключ сортировки ClickHouse, партиционирование по месяцу.
    - Вторая — блоки признаков, разделённые комментариями: размер заказа, география и время, история продавца.
    - Третья — `target_is_late` названа явно таргетом.
    - Четвёртая — `is_incremental()` с окном в семь дней; к этому мы вернёмся в блоке про инкрементальность.
    - Не разбирать: макрос `safe_divide` — он будет через два блока, сейчас достаточно знать, что он защищает от деления на ноль.

    **Для MLE:**
    - Обратите внимание на комментарий у `seller_avg_delay_90d`: !!«как было на момент заказа»!!.
    - Это point-in-time correctness, и это самая важная строка на слайде.
    - Разберём отдельно.

    **Пример:**
    - Такая витрина одновременно источник training dataset и источник фичей для батч-инференса — один и тот же SQL, никакого расхождения между обучением и продом.

    **Осторожно:**
    - Не класть в feature mart всё подряд «на всякий случай».
    - Каждая колонка — это обязательство поддерживать её в проде.

    **Переход:**
    - ~~«Витрина читает источники. Посмотрим, как источник объявляется и почему это не формальность».~~
- kind: content
  id: 020-sources-kontrakt-i-freshness
  title: 'sources: контракт входа и freshness'
  bullets:
  - source — это объявление внешней таблицы, которую dbt не строит
  - Даёт lineage от сырых данных и единое место для смены схемы
  - 'freshness отвечает на вопрос: данные вообще доехали?'
  - 'dbt source freshness — отдельная команда, её ставят перед сборкой'
  code_caption: models/sources/sources.yml
  code_lang: yaml
  code: |2
    version: 2
    sources:
      - name: olist_raw
        database: olist_raw
        tables:
          - name: orders
            description: >
              Заказ. Одна строка на заказ,
              99 441 всего.
            loaded_at_field: order_purchase_timestamp
            freshness:
              warn_after:  {count: 12, period: hour}
              error_after: {count: 24, period: hour}
            columns:
              - name: order_id
                tests: [not_null, unique]
              - name: order_status
                tests:
                  - accepted_values:
                      values: [delivered, shipped,
                               canceled, unavailable,
                               invoiced, processing]
          - name: order_items
          - name: sellers
  notes: |2
    [52:06–53:06 · ~1 мин] **Главное:**
    - Объявленный source — это !!граница ответственности!!: с этого места и глубже отвечает не dbt, а поставщик данных.

    **Разбор кода:**
    - Показать `freshness` и `loaded_at_field`.
    - Это отдельная проверка: `dbt source freshness` смотрит, насколько свежая максимальная метка в таблице, и падает, если данные не доехали.
    - Не разбирать: `description` и полный список таблиц.

    **Для MLE:**
    - Ставьте freshness перед сборкой признаков.
    - Иначе типичный сценарий: ingestion молча не отработал, dbt честно пересчитал витрину по вчерашним данным, обучение прошло, метрики просели — и вы неделю ищете проблему в модели.

    **Пример:**
    - В Olist датасет статический, поэтому freshness там демонстрационный.
    - В живом проекте окно ставится по SLA поставщика.

    **Осторожно:**
    - freshness — это проверка !!доехали ли данные!!, а не проверка их корректности.
    - Корректность — это тесты, они дальше.

    **Переход:**
    - ~~«Как dbt физически материализует всё это — короткая таблица».~~
- kind: table
  id: 021-materializacii
  title: Материализации и когда какая
  table:
    headers:
    - Материализация
    - Что делает
    - Когда брать в feature layer
    rows:
    - - view
      - Пересоздаёт представление, данные не хранит
      - staging — дёшево, всегда свежо
    - - table
      - Пересоздаёт таблицу целиком при каждом прогоне
      - intermediate и небольшие витрины
    - - incremental
      - Пересчитывает только затронутую часть данных
      - Крупные feature marts с историей
    - - ephemeral
      - Вклеивается в потребителя как CTE, объекта в БД нет
      - Мелкие переиспользуемые куски логики
    - - materialized_view
      - Обновляется движком БД, dbt run не нужен
      - ClickHouse, near-real-time агрегаты
    col_ratios:
    - 3
    - 6
    - 6
  notes: |2
    [53:06–54:06 · ~1 мин] **Главное:**
    - Материализация — это ответ на вопрос «сколько стоит эта модель», а не украшение конфига.

    **Рассказ:**
    - Правило по умолчанию: !!staging — view, intermediate — table, крупные marts — incremental!!.
    - Из этого правила выходят осознанно, а не наоборот.

    **Для MLE:**
    - feature mart почти всегда incremental — история признаков растёт, а пересчитывать её целиком каждую ночь незачем.
    - Но у инкремента есть цена в виде корректности, к этому вернёмся в пятом блоке.

    **Осторожно:**
    - `ephemeral` не создаёт объект в базе — его нельзя ни посмотреть глазами, ни протестировать напрямую.
    - Не делайте ephemeral то, что хотите отлаживать.

    **Переход:**
    - ~~«С устройством разобрались. Теперь — как перестать копипастить SQL».~~
- kind: section
  id: 022-jinja-makrosy-pakety
  title: Jinja, макросы и пакеты
  notes: |2
    [54:06–54:24 · ~0.3 мин] **Главное:**
    - Блок про переиспользование.

    **Рассказ:**
    - «Как перестать копипастить SQL между двадцатью моделями и не превратить проект в магию».
- kind: content
  id: 023-jinja-zachem-full-stack
  title: 'Jinja: от копипасты к переиспользуемому слою'
  image: pic-jinja-target-name.png
  bullets:
  - 'Jinja — шаблонизатор: dbt рендерит модель ДО отправки в базу'
  - 'Отсюда всё: ref(), source(), config(), is_incremental()'
  - 'Цена: SQL в редакторе больше не равен SQL в базе'
  - Поэтому дальше показываем обе половины
  code_lang: diagram
  code: |2
     models/*.sql (SQL + Jinja)
              ↓  dbt compile
     target/compiled/… (чистый SQL)
              ↓  dbt run
     таблица или вью в базе
  notes: |2
    [54:24–55:24 · ~1 мин] **Главное:**
    - Jinja — это !!ещё один шаг сборки!! между вашим файлом и базой.
    - Пока вы это помните, всё остальное просто.

    **Рассказ:**
    - Объяснить схему в три фразы: файл модели — это шаблон; `dbt compile` превращает его в обычный SQL; в базу уезжает результат.
    - `ref()` и `config()` — не магия dbt, а обычные функции Jinja-контекста.
    - Картинка справа — маленький, но показательный пример: `{{ 'order_date' if target.name == 'prod' else 'created_at' }}`.
    - Одна модель, две разные колонки в двух окружениях.
    - В редакторе это не SQL; SQL из этого получится только после компиляции.

    **Практический смысл:**
    - Аналогия — препроцессор или шаблон Helm.
    - Тот же выигрыш и та же опасность: удобно, пока читаемо.

    **Осторожно:**
    - Правильная рамка — это инструмент, который позволяет одному инженеру держать переиспользуемый слой трансформаций, а не «ещё одна возможность dbt».

    **Переход:**
    - ~~«Смотрим на конкретных конструкциях — и сразу на то, во что они компилируются».~~
- kind: content
  id: 024-jinja-var-env-cikl
  title: 'Jinja в деле: исходник и скомпилированный SQL'
  code_caption: 'слева ваш файл, ниже черты — target/compiled при --target dev'
  code_lang: sql
  code: |2
    -- ИСХОДНИК: models/marts/mart_seller_orders.sql
    {% set window = var('train_window_days', 180) %}
    {% set raw_db = env_var('CH_RAW_DB', 'olist_raw') %}

    select
      seller_id
      {%- for st in ['delivered', 'canceled'] %},
      countIf(order_status = '{{ st }}') as orders_{{ st }}
      {%- endfor %}
    from {{ ref('int_order_level') }}
    where order_purchase_timestamp >= now() - interval {{ window }} day
    {% if target.name == 'dev' %}
      limit 10000                 -- в dev не считаем всё
    {% endif %}
    group by seller_id

    -- ────────────────────────  СКОМПИЛИРОВАНО  ────────────────────────

    select
      seller_id,
      countIf(order_status = 'delivered') as orders_delivered,
      countIf(order_status = 'canceled')  as orders_canceled
    from analytics.int_order_level
    where order_purchase_timestamp >= now() - interval 180 day
      limit 10000
    group by seller_id
  notes: |2
    [55:24–57:24 · ~2 мин] **Главное:**
    - Одна и та же модель по-разному собирается в dev и в проде — и это описано в коде, а не в инструкции.
    - Ниже черты видно, !!во что именно она превратилась!!.

    **Разбор кода:**
    - Четыре точки в верхней половине.
    - `var('train_window_days', 180)` — окно обучения стало параметром: поменять его можно флагом `--vars`, не трогая SQL.
    - `env_var('CH_RAW_DB', ...)` — то же самое, но значение приходит из окружения: адрес базы и креды в git не попадают.
    - Цикл `for st in [...]` — два почти одинаковых агрегата пишутся один раз.
    - `if target.name == 'dev'` — в dev-профиле модель собирается на срезе.
    - Дальше — !!нижняя половина, ради которой слайд и сделан!!.
    - Цикла нет: он развернулся в два `countIf`.
    - Условия нет: `target.name` был `dev`, значит `limit` остался.
    - `ref` стал именем таблицы, `var` стал числом 180.
    - **В базу уезжает обычный SQL — никакой Jinja там не существует.** Не разбирать: `{%-` и `-%}` — это управление пробелами, скажите одной фразой «минус съедает пробел» и идите дальше.

    **Для MLE:**
    - Параметризованное окно — это ровно то, что нужно для экспериментов с признаками: собрать витрину на 90 и на 365 днях, не заводя две модели.

    **Пример:**
    - `dbt build --select mart_seller_orders --vars '{train_window_days: 365}'` — и в скомпилированном SQL станет `interval 365 day`.

    **Осторожно:**
    - Значения `var()` идут в SQL как текст.
    - Не подставляйте туда пользовательский ввод.

    **Переход:**
    - ~~«А если один и тот же кусок логики нужен в пяти моделях — это уже макрос».~~
- kind: content
  id: 025-makros-dlya-priznakov
  title: 'Макрос: повторяющаяся логика признака'
  bullets:
  - Макрос возвращает фрагмент SQL, а не значение
  - Хороший кандидат — то, что уже написано дважды
  - 'safe_divide: деление, которое не падает и не даёт inf'
  - 'Ниже черты — во что вызов превратился: обычный case, никакой магии'
  - Поменяли решение про ноль — правка в одном файле, а не в пяти моделях
  code_caption: macros/safe_divide.sql → target/compiled/…
  code_lang: sql
  code: |2
    -- ИСХОДНИК: макрос
    {% macro safe_divide(num, den) -%}
      case when {{ den }} = 0 then null
           else {{ num }} / {{ den }} end
    {%- endmacro %}

    -- и его вызов в витрине признаков
    select order_id,
      {{ safe_divide('freight_value',
                     'total_price') }} as freight_share
    from {{ ref('int_order_level') }}

    -- ────── СКОМПИЛИРОВАНО ──────

    select order_id,
      case when total_price = 0 then null
           else freight_value / total_price
      end as freight_share
    from analytics.int_order_level
  notes: |2
    [57:24–58:54 · ~1.5 мин] **Главное:**
    - Макрос — это !!DRY для SQL!!.
    - Не «продвинутая фича», а способ не разъехаться в определении признака.

    **Разбор кода:**
    - Верхняя половина — тело макроса (обычный `case`, обёрнутый в `{% macro %}`) и его вызов.
    - Нижняя — то, что реально уехало в базу: !!вызов исчез, на его месте стоит развёрнутый case!!.
    - Проговорить вслух: макрос не существует во время выполнения запроса, он существует только во время компиляции.
    - Потом сказать главное: если завтра решим, что при нулевом знаменателе нужен не NULL, а ноль — правка в одном месте, и она автоматически приедет во все модели, которые вызывают макрос.
    - Не разбирать: `-%}` и `{%-`.

    **Практический смысл:**
    - Доля стоимости доставки и отношение просрочки к обещанному сроку — оба признака делят одно на другое, оба ломаются на нуле.
    - Без макроса это два разных `case`, которые через полгода будут вести себя по-разному.

    **Пример:**
    - Та же логика нужна и в staging позиций, и в витрине по категориям.
    - Продублируете — границы разъедутся.

    **Осторожно:**
    - Макрос — не место для бизнес-смысла.
    - `safe_divide` — про арифметику; «что считать просрочкой» должно остаться видимым в модели.

    **Переход:**
    - ~~«Второй полезный класс макросов — ключи и окна».~~
- kind: content
  id: 026-makros-klyuchi-i-okna
  title: 'Макрос: суррогатный ключ и повторяющееся окно'
  bullets:
  - Суррогатный ключ — стабильный хеш от набора колонок
  - Нужен там, где естественного ключа нет — например, заказ × продавец
  - Повторяющееся временное окно тоже стоит вынести в макрос
  - 'Ниже черты видно цену абстракции: пакетный макрос разворачивается в длинный хеш'
  - 'Правило: prefer readable SQL — абстрагируем паттерны, а не каждые три строки'
  code_caption: macros/ → target/compiled/… (ClickHouse)
  code_lang: sql
  code: |2
    -- ИСХОДНИК
    select
      {{ dbt_utils.generate_surrogate_key(
           ['order_id', 'seller_id']) }} as order_seller_key
    from {{ ref('stg_order_items') }}
    where {{ lookback_window('order_purchase_timestamp') }}

    {% macro lookback_window(ts, days=90) -%}
      {{ ts }} >= now() - interval {{ days }} day
    {%- endmacro %}

    -- ────── СКОМПИЛИРОВАНО ──────

    select
      lower(hex(MD5(concat(
        coalesce(cast(order_id  as String), '_dbt_utils_null'), '-',
        coalesce(cast(seller_id as String), '_dbt_utils_null')
      )))) as order_seller_key
    from analytics.stg_order_items
    where order_purchase_timestamp >= now() - interval 90 day
  notes: |2
    [58:54–60:24 · ~1.5 мин] **Главное:**
    - Готовый макрос из пакета выигрывает у самописного не логикой, а !!краевыми случаями!! — NULL, типы, разделитель.

    **Разбор кода:**
    - Верх — два вызова: `generate_surrogate_key` из dbt_utils и свой макрос окна.
    - Низ — во что это развернулось.
    - Обратить внимание на !!длину скомпилированного хеша!!: пакетный макрос честно приводит каждую колонку к строке, подставляет заглушку вместо NULL и склеивает через разделитель.
    - Руками это писать никто не станет, и в этом весь смысл.
    - Второй макрос проще: если завтра «окно наблюдения» станет 120 дней, правка в одном файле, а в скомпилированном SQL поменяется число.
    - Не разбирать: почему именно MD5 и почему `_dbt_utils_null` — это деталь реализации пакета.

    **Практический смысл:**
    - Суррогатный ключ нужен, когда гранулярность составная.
    - В Olist пара «заказ × продавец» естественного ключа не имеет, а группировать по ней надо.

    **Осторожно:**
    - Сформулировать правило вслух и записать его на следующем слайде: !!prefer readable SQL!!.
    - Макрос, который экономит две строки, но требует открыть третий файл, — это чистый убыток.
    - Нижняя половина слайда — как раз аргумент в обе стороны: она и оправдывает макрос, и показывает, что читать после компиляции придётся вот это.

    **Переход:**
    - ~~«И сразу оборотная сторона».~~
- kind: content
  id: 027-granica-magii-jinja
  title: 'Где Jinja начинает вредить'
  bullets:
  - 'Симптом: чтобы понять модель, приходится открывать три файла макросов'
  - 'Симптом: SQL в редакторе не читается вслух'
  - 'Симптом: ошибка компиляции указывает в сгенерированный текст'
  - 'Правило: prefer readable SQL'
  - 'Абстрагируем повторяющиеся инфраструктурные паттерны, а не каждые три строки'
  - 'Инструмент отладки один и тот же: dbt compile → target/compiled/'
  code_lang: diagram
  code: |2
    ХОРОШО                     ПЛОХО
    ──────────────             ──────────────
    safe_divide                вся модель
    surrogate_key              собрана из
    окно наблюдения            вложенных
    кросс-СУБД функции         макросов

    # цена абстракции = сколько
    # файлов надо открыть, чтобы
    # понять один SELECT
  notes: |2
    [60:24–61:24 · ~1 мин] **Главное:**
    - Jinja может сделать SQL слишком магическим, и это реальная стоимость, а не придирка.

    **Рассказ:**
    - Назвать три симптома вслух.
    - Особенно третий: когда шаблон сломан, база жалуется на текст, которого вы не писали.
    - Отсюда правило отладки — !!сначала dbt compile, потом чтение сгенерированного SQL!!, и только потом гипотезы.

    **Практический смысл:**
    - Аналогия — метапрограммирование в Python.
    - Мощно, и ровно поэтому дорого в поддержке.

    **Осторожно:**
    - Не оставлять студента с ощущением «Jinja — зло».
    - Правильный вывод: границу проводят по повторяемости и по читаемости.

    **Переход:**
    - ~~«Часть повторяющихся вещей уже написана за нас — это пакеты».~~
