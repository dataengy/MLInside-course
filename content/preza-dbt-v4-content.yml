      - Как в источнике
      - olist_raw.orders, order_items, sellers
    - - staging
      - 'Типы, переименования, базовые флаги: 1 модель = 1 источник'
      - Как в источнике
      - stg_orders, stg_order_items, stg_sellers
    - - intermediate
      - Соединения и приведение к явной, названной гранулярности
      - Заказ / позиция заказа
      - int_order_level
    - - marts
      - 'Витрины под потребителя: BI-витрины и feature marts'
