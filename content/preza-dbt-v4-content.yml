# preza-dbt-v4-content.yml — WHAT deck: «Трансформация данных и витрины (dbt)».
#
# v4.10.0 — правка v4.9.0: восемь уникальных слайдов из ручной деки v4.7.5-man
#   (свод пяти ручных дек 4.7.x). Пять новыми слайдами — секреты, dbt_project.yml,
#   packages.yml, selectors.yml, Activity Schema; два обогатили существующие — легенда
#   «что уезжает в git» в дереве проекта и имена правил dbt_project_evaluator в заметках;
#   один пропущен как свёрнутая копия трёх других.
#
# v4.9.0 — слайд «Data Mesh в dbt: домены и контракты» сразу за слайдом про exposures,
#   contracts и groups. Отвечает на вопрос, во что groups/access вырастают, когда доменов
#   становится несколько: соответствие идей Data Mesh механизмам dbt, YAML границы домена
#   (group + access: public/private + contract: enforced) и цепочка сквозного примера
#   commerce.orders_public → ml-platform.mart_delivery_features → delivery_delay_model.
#
# v4.8.0 — один слайд в PART 3, следом за «ещё четыре подхода»: «Нужен ли отдельный
#   оркестратор в modern data stack?». Тренд сближения transformation engines, платформ
#   данных и оркестрации: SQLMesh и Bruin несут свой scheduler, Databricks — Lakeflow Jobs,
#   Snowflake — Dynamic Tables. Граница проведена по DAG: внутри одного data DAG оркестрация
#   становится фичей движка, между системами остаётся отдельным слоем. Основной части
#   слайд времени не занимает — метки [~N мин] у него нет.
#
# v4.6.1 — правка v4.6.0: на слайде «Когда простых marts мало» хвост «Рассказа» вынесен
#   в раздел «Формы хранения» — 3NF/EDW и Wide/OBT методологиями моделирования не являются
#   и в одной шкале с Medallion/Kimball/Data Vault стояли не на своём месте.
#
# v4.6.0 — правка v4.5.1: заметки PART 2, PART 3 и «Картинок» разложены по меткам
#   (.tmp/label_appendix_notes.py — ручная карта «абзац → раздел», по одному ярлыку на
#   абзац). Раньше приложения были свободной прозой и потому проходили мимо нормализации;
#   теперь и они идут списком. Ярлыки приложения свои: «Переход» здесь бессмысленен,
#   зато на разделителях частей есть «Что дальше» и «Как пользоваться».
#   Часов приложениям это не добавляет — их ставят только слайдам с меткой [~N мин].
#
# v4.5.1 — правка v4.5.0: буллет начинается с заглавной (notes.capitalize_bullet).
#   Первая фраза раздела раньше продолжала метку в строку, поэтому писалась со строчной;
#   отдельным пунктом это читалось криво. Регистр поднимается только у кириллицы —
#   у латиницы он значащий (`dbt`, `ref()`, `stg_orders`).
#
# v4.5.0 — правка v4.4.0, подстрочник целиком списком:
#   * порог булитирования снят (notes_format.bullets_max_* в настройках сборки) — теперь
#     буллетами идут ВСЕ разделы, а не только короткие;
#   * абзацы-продолжения свёрнуты в свой раздел (.tmp/fold_continuations.py, 77 слайдов),
#     иначе они проходили мимо нормализации и оставались прозой;
#   * в основной части прозой остались только служебные строки происхождения.
#
# v4.4.0 — правка v4.3.0, доработка деки как цельной лекции:
#   * intro: «dbt за 60 секунд» и таймлайн «как появился dbt» (факты сверены с
#     dbt Labs / Snowflake / Fivetran на 2026-09-01); дубли в блоке ELT/AE/Viewpoint сняты;
#   * onboarding: первый проект на dbt Core, dbt_project.yml vs profiles.yml, shift-left;
#   * моделирование: слои DAG отделены от модели данных, таблица паттернов переписана
#     (Medallion — паттерн слоистости, а не методология моделирования сущностей);
#   * Airflow 3 + Cosmos: Dataset→Asset, airflow.sdk, AssetWatcher ≠ ExecutionMode.WATCHER;
#   * формулировки обобщены: «для MLE» осталось там, где речь реально про ML-специфику,
#     остальное — «Практический смысл»;
#   * факты выправлены: ускорение WATCHER, namespace dbt-expectations в приложении.
#
# v4.3.0 — правка v4.2.0, подстрочники докладчика (scripts/preza/notes_fix.py, идемпотентно):
#   * абсолютное время слайда «10:00-11:30» перед меткой [~N мин] — видно, идём ли по плану;
#   * короткий раздел («Главное», «Переход»…) — метка на своей строке и буллеты по
#     предложениям; длинный остаётся прозой;
#   * рендерер больше не схлопывает абзацы заметки: строка → абзац, пустая строка → пустой
#     абзац (сырой \n внутри <a:t> переносом не является, поэтому раньше выходила стена текста).
#
# v4.2.0 — правка v4.1.0: раздел «Картинки» в конце деки (иллюстрации, которым не нашлось
#   места на содержательных слайдах, + дубль жёлтых 🔍-ссылок), «Пакеты в деле» разрезаны
#   на подключение и контракт витрины, реестр картинок в content/preza-dbt-v4-images.yml.
#
# v4.1.0 — правка v4.0.1 по замечаниям к деке:
#   * название деки взято из расписания курса; подзаголовок с титульного снят;
#   * рамка «full-stack data specialist» убрана — аудитория и адресат теперь только MLE/DS;
#   * картинки вместо жёлтых 🔍-ссылок на поиск (см. .tmp/stage_pictures.py — какая откуда);
#   * слайды со схемой И картинкой: схема уезжает под текст в левую колонку (рендерер, R12);
#   * Jinja-слайды показывают ДВА кода — исходный и скомпилированный, разделённые чертой;
#   * блок слоёв развёрнут до четырёх слайдов, включая современные подходы к моделированию;
#   * CI разложен на pre-commit / CI-барьер / Slim CI;
#   * из Part 3 в основную часть подняты и расширены: команды dbt, dbt_project_evaluator, dbt и AI;
#   * добавлены логирование, exposures и agentic-пайплайны;
#   * теория DS/MLE, не привязанная к dbt, вынесена в PART 2 «DS/MLE нюансы».
#
# ДЗ удалено полностью; Olist — сквозной production ML example (delivery-delay prediction).
#
# Notes используют разметку эмфазы (settings.notes_emphasis) + абзацы через пустую строку.
# Каждый содержательный слайд несёт сценарий лектора: главное / рассказ / для MLE / пример /
