    **Рассказ:**
    - Прочитать вслух главный тезис: !!«аналитическая работа — это разработка ПО»!!.
    - Из него выводится всё остальное: раз это разработка, значит нужны версии, ревью, окружения, тесты, документация и переиспользование.
    - В 2016-м это звучало непривычно: SQL-запросы жили в BI-инструменте, в почте и в головах.
    - Показать таблицу слева — она переводит каждый пункт манифеста в конкретный механизм dbt, который мы сегодня разберём.
    - Картинка справа напоминает, между кем этот слой стоит.

