    [~1.5 мин] **Главное:** у лекции сквозная линия — один пример Olist проходит через все блоки.

    **Рассказ:** пройтись по плану за минуту. Подчеркнуть три опорные точки: !!MLOps-смысл концепций dbt!! (третий блок), !!point-in-time correctness!! (пятый) и !!Airflow + Cosmos!! (шестой). Остальное — обвязка вокруг них.

    **Для MLE:** предупредить, что домашнего задания в лекции нет — вместо него сквозной production-пример, который можно повторить у себя.

    **Осторожно:** не обещать «полный справочник по dbt» — часть обзорного материала вынесена в Part 2 в конце деки, к ней можно вернуться самостоятельно.

    **Переход:** ~~«Начнём не с dbt, а с вопроса, кто вообще сегодня делает эту работу».~~
