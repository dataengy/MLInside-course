- kind: content
  id: 060-izmenenie-sql-fichi-eto-izmenenie-ml-sistemy
  title: 'Изменение SQL-признака — это изменение ML-системы'
  bullets:
  - 'Правка одной строки SQL меняет распределение признака'
  - 'Модель, обученная до правки, в проде получает другие данные'
  - 'Значит transformation code требует той же дисциплины, что и код обучения'
  - 'Значит нужен PR, ревью, автотесты и воспроизводимая сборка'
  code_lang: diagram
  code: |2
    изменение SQL-признака
              │
              ↓
           Git PR
              │
              ↓
    dbt parse / compile
              │            # шаблон рендерится?
              ↓
    dbt build --select state:modified+
              │            # изменённое и всё ниже
              ↓
        code review
              │
              ↓
           merge
              │
              ↓
    production dbt build
              │
              ↓
     training pipeline
  notes: |2
    [117:24–118:54 · ~1.5 мин] **Главное:**
    - !!SQL-признак — это часть ML-системы!!, а не «просто запрос аналитика».
    - Отсюда всё остальное на слайде.

    **Рассказ:**
    - Пройти по цепочке.
    - `dbt parse`/`compile` — самая быстрая проверка: рендерится ли шаблон вообще.
    - Дальше `dbt build --select state:modified+` — собираются только изменённые модели и всё, что от них зависит; это и есть Slim CI.
    - Потом ревью человеком, мердж, прод-сборка, и только затем обучение.

    **Для MLE:**
    - Проговорить последствие явно.
    - Вы поправили определение `freight_share` — распределение признака поехало.
    - Модель в проде обучена на старом распределении.
    - Формально ничего не сломалось: тесты зелёные, пайплайн зелёный, метрика деградирует тихо.
    - Отсюда практический вывод: !!изменение feature-логики должно триггерить переобучение!!, а не просто доезжать до витрины.

    **Осторожно:**
    - Ревью SQL часто воспринимают как формальность — «ну это же просто запрос».
    - Это ровно та же ошибка, из-за которой десять лет назад появился Analytics Engineering.

    **Переход:**
    - ~~«Как это выглядит в конфигах».~~
