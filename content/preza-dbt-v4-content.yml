    [12:18–13:48 · ~1.5 мин] **Главное:**
    - Analytics Engineering — это не должность, придуманная вендором, а !!инженерный ответ на то, что трансформации стали production-кодом!!.

    **Рассказ:**
    - Картинка справа делит путь данных на три ответственности.
    - **Data Engineering** приносит данные в хранилище: это E и L из ELT.
    - **Analytics Engineering** отвечает за **T** — трансформации, модель данных, качество.
    - **Analytics / Data Science** работает уже поверх готового слоя.
    - Схема слева — формула роли.
    - Трансформаций в SQL стало много, писали их аналитики, а инженерных практик вокруг SQL не было никаких: ни git-ревью, ни тестов, ни документации, ни объявленных зависимостей.
    - __Analytics Engineering = ELT + практики разработки ПО.__

    **Для MLE:**
    - Запомните формулу — она понадобится через несколько слайдов, когда мы применим её к признакам.

