  notes: |2
    [~1.5 мин] **Главное:** разделение труда возникло не от моды, а от того, что каждый слой требовал своей глубины.

    **Рассказ:** пройтись по строкам по одной фразе. Обратить внимание, что !!данные одни и те же!!, а ответственных шесть — и на каждом стыке появляется очередь: «подожди, пока DE добавит колонку».

    **Для MLE:** типичная история — MLE ждёт витрину от DE, не дожидается и пишет свой pandas-скрипт. Так появляется теневой слой трансформаций, который никто не тестирует.

    **Осторожно:** не подавать таблицу как «устаревшую». В крупных системах это разделение по-прежнему необходимо — оно и дальше будет нужно.

