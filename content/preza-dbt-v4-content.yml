- kind: content
  id: 056-olist-pipeline-airflow-cosmos
  title: 'Пример: Olist end-to-end на Airflow + Cosmos'
  code_lang: diagram
  code: |2
       wait_for_olist_raw                    # сенсор: сырьё доехало
                                      │
                                      ↓
      ┌──────────────────────────────────────────────────────────────┐
      │                     Cosmos  DbtTaskGroup                     │
      │                                                              │
      │  stg_orders     stg_order_items     stg_sellers              │
      │          └───────────┬───────────────────┘                   │
      │                      ↓                                       │
      │             int_order_level                                  │
      │                      ↓                                       │
      │          int_seller_delay_history     # point-in-time        │
      │                      ↓                                       │
      │           mart_delivery_features                             │
      │                      ↓                                       │
      │                 dbt tests             # quality gate         │
      └───────────────────────────────┬──────────────────────────────┘
                                      ↓
                           build_training_dataset
                                      ↓
                            train_delivery_model
                                      ↓
                               evaluate_model  ──→  метрика хуже baseline → STOP
                                      ↓
                               register_model  ──→  deploy / notify
  notes: |2
    [109:06–111:36 · ~2.5 мин] **Главное:**
    - Это финальная форма всего, о чём мы говорили: рамка dbt внутри общего Airflow-пайплайна.

    **Рассказ:**
    - Пройти сверху вниз.
    - Сенсор ждёт, пока приедет сырьё, — это граница с ingestion.
    - Внутри рамки Cosmos развернул наш dbt-граф в задачи; порядок он вывел сам, руками зависимости никто не писал.
    - Тесты — последний узел рамки и одновременно quality gate.
    - Дальше начинается ML-часть: сборка обучающей выборки, обучение, оценка, регистрация, деплой.
    - Отдельно отметить `evaluate_model` — там !!второй барьер!!: если метрика хуже текущего baseline, модель в реестр не едет.

    **Практический смысл:**
    - Узнайте здесь схему из начала лекции.
    - Рамка та же, просто теперь у каждого её узла есть ретраи, логи и своя строчка в интерфейсе Airflow.

    **Пример:**
    - `int_seller_delay_history` стоит между intermediate и витриной именно потому, что это point-in-time модель, и она обязана посчитаться до сборки признаков.

    **Осторожно:**
    - Два барьера — не один.
    - Тесты данных защищают от битого входа; оценка метрики — от плохой модели на нормальном входе.
    - Это разные отказы.

    **Переход:**
    - ~~«Тот же пайплайн кодом».~~
- kind: content
  id: 057-cosmos-dag-celikom
  title: 'Тот же пайплайн кодом'
  code_caption: dags/olist_delivery_model.py
  code_lang: python
  code: |2
    from airflow.decorators import dag, task
    from cosmos import DbtTaskGroup, ProjectConfig, RenderConfig

    @dag(schedule="0 3 * * *", catchup=False, tags=["olist", "ml"])
    def olist_delivery_model():
        wait_raw = FileSensor(task_id="wait_for_olist_raw", filepath=RAW_MARKER)

        transform = DbtTaskGroup(            # весь dbt-граф раскроется в задачи
            group_id="dbt_olist",
            project_config=ProjectConfig(dbt_project_path=DBT_DIR),
            profile_config=PROFILE,
            render_config=RenderConfig(select=["tag:features"]),
        )

        @task
        def train():                         # обучение — уже НЕ dbt
            df = read_features("analytics.mart_delivery_features")
            return fit_and_log(df)           # метрики → tracking

        @task.short_circuit
        def evaluate(run_id: str) -> bool:   # барьер качества модели
            return metrics(run_id)["roc_auc"] >= baseline()

        run = train()
        wait_raw >> transform >> run
        evaluate(run) >> register(run)
  notes: |2
    [111:36–114:06 · ~2.5 мин] **Главное:**
    - Архитектурная идея важнее синтаксиса.
    - Задача этого слайда — показать, что !!весь dbt-слой занимает один объект!!, а не тридцать операторов.

    **Разбор кода:**
    - Четыре точки.
    - Первая — `DbtTaskGroup`: три конфига, и весь граф моделей раскрылся в задачи.
    - Никаких `stg_orders >> int_order_level` руками.
    - Вторая — `@task def train()`: обучение читает готовую витрину и живёт вне dbt.
    - Третья — `@task.short_circuit` на `evaluate`: если метрика хуже baseline, ветка ниже пропускается, и модель не регистрируется.
    - Четвёртая — последние две строки: зависимости между крупными этапами.
    - Не разбирать: `PROFILE`, `RAW_MARKER`, тело `fit_and_log` — это заглушки.

    **Практический смысл:**
    - Обратите внимание на симметрию.
    - Барьер данных — внутри `transform`, его делает `dbt build`.
    - Барьер модели — снаружи, его делает `short_circuit`.
    - Каждый отказ останавливает пайплайн в своей точке.

    **Осторожно:**
    - Синтаксис Airflow меняется между мажорными версиями.
    - Не переписывайте с этого слайда дословно — сверяйтесь с документацией вашей версии.

    **Переход:**
    - ~~«А если у вас не Airflow?»~~
- kind: content
  id: 058-a-esli-dagster
  title: 'А если мы используем Dagster?'
  image: pic-dagster-dbt-assets-job.png
  bullets:
  - 'Ментальная модель: не задачи, а data assets'
  - Модель dbt = asset, манифест → набор ассетов
  - Витрина и обученная модель — один граф
  materials:
