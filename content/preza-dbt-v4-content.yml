                            consistency
  notes: |2
    **ВНЕ ХРОНОМЕТРАЖА**

    **Главное:**
    - Витрина в ClickHouse закрывает !!offline-часть!! feature store и не закрывает online-часть.

    **Рассказ:**
    - Сказать прямо: для очень многих задач offline-части достаточно.
    - Батч-скоринг раз в сутки, еженедельный пересчёт рекомендаций, аналитические ML-задачи — там online-хранилище не нужно вовсе, и заводить Feast ради галочки не стоит.
    - Online-хранилище нужно, когда признак требуется по ключу за миллисекунды в момент запроса пользователя.

    **Для MLE:**
    - Ключевой риск при переходе к online — !!online/offline consistency!!.
    - Тот же признак, посчитанный двумя разными путями, почти гарантированно разойдётся.
    - Это и есть training/serving skew, только теперь на уровне инфраструктуры.

    **Пример:**
    - Если Olist-модель отвечает на вопрос «успеет ли заказ» прямо в момент оформления, `seller_avg_delay_90d` нужен за миллисекунды — и тогда нужен online-слой.
    - Если прогноз считается ночью для всех вчерашних заказов — не нужен.

    **Осторожно:**
    - Не говорить, что «dbt заменяет feature store».
    - Он закрывает часть задач, и честнее это назвать явно.

    **Переход:**
    - ~~«Третий вопрос, который всегда задают: а Python внутри dbt можно?»~~
- kind: content
  id: 951-training-serving-skew
  title: 'Training/serving skew: три источника расхождения'
  code_lang: diagram
  code: |2
     ИСТОЧНИК            КАК ВЫГЛЯДИТ                     ЧЕМ ЛЕЧИТСЯ
     ────────────────    ─────────────────────────────    ───────────────────────
     разный код          train: SQL в витрине             один слой признаков,
                         serve: pandas в сервисе          общий для обеих сторон

     разные данные       train: вся история завершена     time-based split,
                         serve: половина «в пути»         фильтр по факту

     разное время        train: avg по всему окну         верхняя грань по
                         serve: avg по прошлому           моменту предсказания

     ────────────────────────────────────────────────────────────────────────────
     СИМПТОМ:  метрика на валидации хорошая, в проде хуже — и разрыв не сокращается
     ПРОВЕРКА: посчитать признак обоими путями на одних и тех же ключах и сравнить
  notes: |2
    **Главное:**
    - Skew — это не одна проблема, а три разные, и лечатся они по-разному.
    - Спутать их легко, потому что !!симптом у всех один!!: на валидации хорошо, в проде хуже.

    **Разбор:**
    - **Разный код.** Самый частый и самый простой.
    - Признак посчитан в витрине одним SQL, а в сервисе инференса — другим кодом, написанным другим человеком через полгода.
    - Формулы совпадают процентов на девяносто, и вот эти десять процентов и есть разрыв.
    - Лечится ровно тем, о чём была лекция: !!один версионируемый слой признаков, который кормит обе стороны!!.
    - **Разные данные.** Обучающая выборка собрана по завершённым событиям — все заказы доставлены, все исходы известны.
    - В проде половина заказов ещё «в пути», и распределение входа другое.
    - Лечится честным разделением по времени и явным решением, что делать со строками, где исход неизвестен (в Olist это `is_late_delivery is null`).
    - **Разное время.** Самый коварный: агрегат в обучении посчитан по окну «вокруг» события, а в проде — только по прошлому.
    - Это и есть point-in-time из основной части.

    **Практический смысл:**
    - **Практическая проверка**, которую стоит завести один раз и держать: взять сотню ключей, посчитать по ним признаки обоими путями — витриной и продовым кодом — и сравнить.
    - Расхождение больше нуля значит, что один из трёх источников у вас активен.
    - ~~Это дешёвый регрессионный тест, который ловит целый класс проблем до того, как их увидит метрика.~~
- kind: table
  id: 952-utechki-v-priznakah
  title: 'Утечки в признаках: не только point-in-time'
  table:
    headers:
    - Вид утечки
    - Как выглядит
    - Пример на Olist
    - Чем ловить
    rows:
    - - Temporal leakage
      - Признак использует то, что произошло после момента предсказания
      - avg просрочки продавца по всем заказам, включая будущие
      - Верхняя грань в join; бэктест на замороженной дате
    - - Target leakage
      - В признак просочился сам таргет или его производная
      - order_delivered_customer_date в фичах при таргете «просрочка»
      - Ревью списка колонок; аномально высокий ROC AUC
    - - Group leakage
      - Один объект попал и в train, и в valid разными строками
      - Заказы одного продавца разъехались по обеим выборкам
      - Split по группе (seller_id), а не по строке
    - - Preprocessing leakage
      - Статистика для нормализации посчитана по всей выборке
      - 'mean/std расстояния — по train+valid сразу'
      - Считать статистики только на train, применять к valid
    - - Duplicate leakage
      - Одна и та же строка попала в выборку дважды
      - ReplacingMergeTree не схлопнул дубли, читали без FINAL
      - unique-тест на ключ; дедупликация в SELECT
    col_ratios:
    - 3
    - 5
    - 6
    - 5
  notes: |2
    **Главное:**
    - Point-in-time — самая известная утечка, но не единственная.
    - Полезно держать этот список как чек-лист перед тем, как поверить хорошей метрике.

    **Разбор:**
    - **Temporal leakage** мы разобрали в основной части: признак несёт информацию из будущего.
    - **Target leakage** — прямее и обиднее.
    - В витрину попала колонка, из которой таргет выводится напрямую.
    - В Olist это `order_delivered_customer_date`: она в той же строке заказа, и если не выкинуть её из признаков, модель просто прочитает ответ.
    - Симптом узнаваемый — !!ROC AUC около единицы!!.
    - **Group leakage** — про разбиение.
    - Если заказы одного продавца попали и в train, и в valid, модель запомнила продавца, а не выучила закономерность.
    - Для Olist разбивать надо по `seller_id` или по времени, а не случайно по строкам.
    - **Preprocessing leakage** — классика: среднее и стандартное отклонение для нормализации посчитаны по всей выборке, включая валидацию.
    - Формально данные не смешаны, а информация уже перетекла.
    - **Duplicate leakage** — то, о чём был слайд про ClickHouse.
    - `ReplacingMergeTree` схлопывает дубликаты в фоне; прочитали таблицу до схлопывания и без `FINAL` — часть строк попала в выборку дважды и получила двойной вес.

    **Осторожно:**
    - Общее свойство всех пяти: !!ни одна не ловится обычными тестами качества данных!!.
    - `not_null` и `unique` на такой витрине зелёные.
    - ~~Ловятся они ревью, бэктестом и здоровым подозрением к слишком хорошей метрике.~~
- kind: content
  id: 953-kogda-nuzhen-feature-store
  title: 'Feature store: когда он действительно нужен'
  bullets:
  - 'Нужен, когда признак требуется по ключу за единицы миллисекунд в момент запроса'
  - 'Нужен, когда одни и те же признаки переиспользуют несколько команд и моделей'
  - 'Нужен, когда online- и offline-расчёт обязаны совпадать по определению'
  - 'НЕ нужен для батч-скоринга раз в сутки — витрины в хранилище достаточно'
  - 'НЕ нужен, когда модель одна и признаки использует только она'
  - 'Цена: ещё одна система в проде, ещё один источник рассинхрона'
  code_lang: diagram
  code: |2
     ВОПРОС                                     ЕСЛИ «НЕТ» → хватит витрины
     ────────────────────────────────────────   ───────────────────────────
     Нужен ли признак за < 50 мс по ключу?      батч-инференс ночью
     Читают ли эти признаки >1 команды?         своя витрина под задачу
     Расходятся ли online и offline расчёты?    один SQL для обеих сторон
     Есть ли требование к версиям признаков?    git + описание в docs
     Нужен ли реестр с владельцами?             meta.owner в schema.yml

     ─────────────────────────────────────────────────────────────────────
     ЕСТЬ У ВИТРИНЫ В DWH        НЕТ У НЕЁ (пока)
     ────────────────────────    ─────────────────────────
     offline features            online serving, p99 < 10 ms
     training dataset            point lookup по ключу
     батч-инференс               гарантия online/offline consistency
     история признаков           отдельный реестр признаков
     lineage и тесты             материализация в key-value store
  notes: |2
    **Главное:**
    - Витрина в ClickHouse закрывает !!offline-часть!! feature store и не закрывает online-часть.
    - Для очень многих задач этого достаточно, и заводить Feast ради галочки не стоит.

    **Разбор:**
    - **Когда достаточно витрины.** Батч-скоринг раз в сутки, еженедельный пересчёт рекомендаций, аналитические ML-задачи, одна модель на команду.
    - Здесь online-хранилище не нужно вовсе, а вся ценность feature store — переиспользование, версии, владельцы — уже получена из dbt: git, `meta.owner`, описания, тесты.
    - **Когда нужен.** Пять вопросов слева — практический фильтр.
    - Если хоть на один ответ «да», разговор про отдельный слой становится осмысленным.
    - Главный из них первый: признак нужен по ключу за миллисекунды в момент запроса пользователя.
    - Второй по важности — переиспользование между командами: как только один и тот же признак считают в трёх местах, реестр перестаёт быть роскошью.

    **Для MLE:**
    - **Ключевой риск при переходе** — !!online/offline consistency!!.
    - Тот же признак, посчитанный двумя разными путями, почти гарантированно разойдётся.
    - Это тот самый training/serving skew, только теперь на уровне инфраструктуры, и feature store решает его не сам по себе, а если его правильно встроить: одно определение признака, две материализации.

    **Пример:**
    - **Пример на Olist.** Если модель отвечает на вопрос «успеет ли заказ» прямо в момент оформления, `seller_avg_delay_90d` нужен за миллисекунды — тогда нужен online-слой.
    - Если прогноз считается ночью для всех вчерашних заказов — не нужен.

    **Осторожно:**
    - ~~Не говорите, что «dbt заменяет feature store». Он закрывает часть задач, и честнее это назвать явно.~~
