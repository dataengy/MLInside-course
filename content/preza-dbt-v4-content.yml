    **Рассказ:** проговорить критерий каждой строки. SQL — по умолчанию, если задача выражается операциями над таблицами. Python — когда нужна библиотека, которой в SQL нет. Не dbt — когда задача вообще не про трансформацию данных в хранилище.

    **Для MLE:** третья строка — самая полезная. !!Попытка затащить обучение или сервинг в dbt!! — регулярная ошибка команд, которые только что влюбились в инструмент. Обучение живёт в оркестраторе рядом с dbt, а не внутри него.

    **Осторожно:** граница между строками подвижна и зависит от платформы. На ClickHouse вторая строка пока пустая — Python-моделей нет.

    **Переход:** ~~«Раз обучение живёт снаружи — нужен тот, кто соединит dbt и обучение. Переходим к оркестрации».~~
- kind: section
  id: 049-orkestraciya-dbt-i-ml
  title: 'Оркестрация: Airflow, Cosmos, dmp-af'
  notes: |2
    [~0.3 мин] **Главное:** самый длинный блок лекции — соединяем dbt с обучением.

    **Рассказ:** «dbt умеет строить свой DAG. Разберёмся, почему этого недостаточно и что с этим делают в проде».
- kind: content
  id: 050-zachem-airflow-esli-est-dag
  title: 'dbt строит DAG. Зачем тогда Airflow?'
  bullets:
  - 'dbt знает зависимости ТРАНСФОРМАЦИЙ — и только их'
  - 'Production pipeline шире: до dbt есть ingestion, после — обучение'
  - 'Нужны расписание, ретраи, SLA, алерты, backfill по датам'
  - 'Нужна одна точка наблюдаемости на весь путь, а не на его середину'
  - 'Нужны зависимости между командами и системами, а не только между моделями'
  code_lang: diagram
  code: |2
      ingestion
             │
             ↓
      ┌──────────────────────────────────────┐
      │  dbt граф   ←── dbt знает только это │
      └──────────────────────────────────────┘
             │
             ↓
      validation
             │
             ↓
      training
             │
             ↓
      evaluation
             │
             ↓
      registry
             │
             ↓
      deploy / notify
  notes: |2
    [~2 мин] **Главное:** dbt отвечает за середину пути. Оркестратор отвечает за путь целиком.

    **Рассказ:** задать вопрос залу и дать паузу: «dbt сам строит DAG и сам знает порядок сборки. Зачем сверху ещё один DAG?»

    Ответ по схеме: у dbt нет и не должно быть представления о том, что !!до!! него отработала загрузка, а !!после!! него надо обучить модель, посчитать метрики и положить артефакт в реестр. Плюс всё то, что отличает production-запуск от запуска руками: расписание, ретраи с бэкоффом, SLA, алерты, повторный прогон за прошлую дату.

    **Для MLE:** практический критерий: как только `dbt build` перестал быть последней командой в вашем пайплайне — нужен оркестратор.

    **Осторожно:** обратная крайность тоже встречается — описывать зависимости между моделями руками в Airflow. Это дублирование графа, который dbt уже посчитал, и оно расходится с реальностью на первой же правке.

    **Переход:** ~~«Способов соединить их несколько — от совсем простого до зрелого».~~
- kind: table
  id: 051-varianty-integracii-dbt-airflow
  title: 'Интеграция dbt и Airflow: от простого к зрелому'
  table:
    headers:
    - Вариант
    - Как выглядит
    - Плюсы
    - Минусы
    rows:
    - - BashOperator
      - Одна задача, внутри dbt build
      - Просто, прозрачно, отличный старт
      - Весь граф — одна task; гранулярной наблюдаемости нет
    - - Готовые операторы
      - Обёртки над командами dbt
      - Чуть больше контроля над шагами
      - Экосистема менялась, часть проектов заброшена
    - - dbt Cloud / API
      - Airflow дёргает задание в dbt Cloud
      - Нет своей инфраструктуры под dbt
      - Подписка; два места, где живёт расписание
    - - Cosmos
      - dbt-проект → DbtTaskGroup или DbtDag
      - Модель = task, ретраи и логи на модель
      - Airflow надо понимать; парсинг графа стоит времени
    - - dmp-af
      - DAG-и генерируются из dbt-проекта по доменам
      - Расписание описывается в dbt, домены разделены
      - Своя модель мышления; Airflow скрыт от автора
    col_ratios:
    - 3
    - 5
    - 5
    - 5
  notes: |2
    [~2 мин] **Главное:** это лестница, а не список альтернатив. Начинать с первой ступени — нормально.

    **Рассказ:** пройти быстро по первым трём и не задерживаться. `BashOperator` — честный первый шаг: одна строка, работает, понятно. Его недостаток один, но важный: !!весь dbt-граф выглядит в Airflow как одна задача!!. Упало — идите читать логи целиком.

    Про готовые операторы сказать честно: экосистема обёрток вокруг dbt менялась несколько раз, часть старых проектов больше не поддерживается. Проверяйте статус, прежде чем брать.

    Две нижние строки — то, ради чего этот блок. На них и остановимся.

    **Для MLE:** переход с первой ступени на четвёртую делают ровно тогда, когда появляется вопрос «какая именно модель упала и можно ли перезапустить только её».

    **Переход:** ~~«Начнём с Cosmos — это основной рекомендуемый вариант для нашего примера».~~
- kind: content
  id: 052-cosmos
  title: 'Cosmos: Airflow-native оркестрация dbt'
  bullets:
  - Open-source проект Astronomer
  - 'dbt-проект превращается в DbtDag или DbtTaskGroup внутри общего DAG'
