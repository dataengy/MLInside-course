    rows:
    - - dbt run
      - компилирует и выполняет модели
    - - dbt build
      - run + test + seed + snapshot в порядке DAG
    - - dbt test
      - тесты данных и unit-тесты
    - - dbt seed
      - загружает CSV из seeds/ как таблицы
    - - dbt snapshot
      - историзация изменений (SCD2)
    - - dbt docs generate
      - генерирует документацию и lineage
    - - --select / --exclude
      - выбор моделей (state:modified и др.)
    col_ratios:
    - 3
    - 7
  notes: |-
    Команд немного. **dbt run** выполняет модели, **dbt test** гоняет тесты, а !!dbt build делает всё сразу в правильном порядке по DAG!! — это рабочая лошадка.

    Отдельно — **seed**, **snapshot** и **docs generate**. И почти к любой команде можно добавить __--select / --exclude__, чтобы запустить не весь проект, а только нужные модели (**state:modified** и др.). ~~Это основа Slim CI.~~
- kind: table
  id: 905-adaptery
  title: Адаптеры
  materials:
  - label: About connections
    url: https://docs.getdbt.com/docs/core/connect-data-platform/about-core-connections
  - label: ClickHouse setup
    url: https://docs.getdbt.com/docs/core/connect-data-platform/clickhouse-setup
  table:
    headers:
    - Платформа
    - Пакет
    - Статус
    rows:
    - - PostgreSQL
      - dbt-postgres
      - Trusted
    - - Snowflake
      - dbt-snowflake
      - Trusted
    - - BigQuery
      - dbt-bigquery
      - Trusted
    - - Redshift
      - dbt-redshift
      - Trusted
    - - Databricks
      - dbt-databricks
      - Trusted
    - - ClickHouse
      - dbt-clickhouse
      - Community
    - - DuckDB
      - dbt-duckdb
      - Community
    col_ratios:
    - 4
    - 4
    - 2
  notes: |-
    dbt работает с БД через **адаптеры**. Для крупных облачных хранилищ есть официальные, __доверенные (Trusted)__ адаптеры.

    Для многих других, включая **ClickHouse** и **DuckDB**, — качественные **community**-адаптеры. Ставится нужный адаптер отдельным пакетом (**dbt-postgres**, **dbt-clickhouse**…), и !!один и тот же проект в разумных пределах переносим между платформами!!.
- kind: content
  id: 906-makrosy-v-proekte
  title: 'Макросы в проекте: диспетчеризация и границы'
  materials:
  - label: adapter.dispatch
    url: https://docs.getdbt.com/reference/dbt-jinja-functions/dispatch
  code_caption: macros/date_diff.sql — один вызов, разные СУБД
  code: |
    {% macro date_diff_days(a, b) %}
      {{ return(adapter.dispatch('date_diff_days')(a, b)) }}
    {% endmacro %}

    {% macro default__date_diff_days(a, b) %}
      datediff('day', {{ a }}, {{ b }})
    {% endmacro %}

    {% macro clickhouse__date_diff_days(a, b) %}
      dateDiff('day', {{ a }}, {{ b }})
    {% endmacro %}
  bullets:
  - Макросы живут в macros/ и доступны всему проекту без импортов
  - 'adapter.dispatch выбирает реализацию по адаптеру: default__ и clickhouse__'
  - Так один и тот же проект компилируется под несколько СУБД
  - Макросы описываются в YAML наравне с моделями — иначе их никто не найдёт
  - 'Граница простая: макрос ради двух строк вредит читаемости больше, чем помогает'
  notes: |
    Три вещи, которые отличают проектные макросы от случайных вставок. Первое — **место**: каталог `macros/`, откуда они видны всему проекту без импортов; пакеты (`dbt_utils.star`) вызываются с префиксом, и префикс здесь полезен — по нему видно, чей код исполняется.

    Второе — **диспетчеризация**. `adapter.dispatch` выбирает реализацию по текущему адаптеру: `default__` работает везде, `clickhouse__` подменяет её на ClickHouse. Это тот самый механизм, которым пакеты добиваются переносимости, и он же нужен вам, если проект компилируется под несколько хранилищ. Ровно его требует настроить `dbt_project_evaluator` — блок `dispatch`, который мы видели на слайде про него.

    Третье — **описание**. Макрос без документации в YAML не найдёт никто, включая вас через полгода; он просто будет написан заново рядом. И честная граница: !!макрос оправдан, когда логика повторяется и меняется вместе!!. ~~Если это две строки в одном месте — оставьте SQL: скомпилированный текст читать проще, чем цепочку из четырёх макросов, каждый из которых вызывает следующий.~~
- kind: table
  id: 907-medallion-i-edw-sloi
  title: 'Слои: medallion и классический EDW'
  table:
    headers:
    - Medallion
    - Классический EDW
    - Что внутри и где это в dbt
    rows:
    - - Bronze
      - rnd, raw / landing
      - сырое as-is; в dbt это sources, а не модели
    - - Silver
      - stg, ODS / OWS
      - типизация, чистка, дедуп; staging один к одному к источнику
    - - Silver+
      - core, DDS (Kimball)
      - бизнес-сущности, факты и измерения; intermediate
    - - Gold
      - rep / BI, feature store
      - витрины, метрики и фичи для ML; marts
    - - вне слоёв
      - DA, ad-hoc
      - 'песочница аналитика: своя схема, вне основного графа'
    col_ratios:
    - 2
    - 3
    - 6
  notes: |
    Два словаря про одно и то же. **Medallion** (bronze / silver / gold) пришёл из мира Databricks и хорош тем, что его понимают за минуту. **Классическая EDW-раскладка** подробнее: `raw` и `landing` для сырого, `stg` для приведения к типам, `core` или `DDS` для бизнес-сущностей, `rep` и BI-витрины наверху. !!Спорить, какой словарь правильный, бессмысленно — важно, чтобы в команде он был один!!.

    Что действительно важно и одинаково в обоих: **правило одного направления**. Слой читает только то, что ниже, и никогда не тянет из соседа сбоку и не смотрит вверх. Внутри dbt это выражается буквально — `sources` для сырого, `staging` один к одному к источнику, `intermediate` для бизнес-логики, `marts` для витрин.

    Отдельно про два места, которые часто забывают. **Feature store** — не отдельная вселенная, а такой же gold-слой, только потребитель у него ML, а не дашборд. А **песочница аналитика** (`ad-hoc`, `DA`) должна жить в своей схеме __вне основного графа__. ~~Как только ad-hoc-модель становится источником для витрины, слои перестают работать, и починить это позже дороже, чем не допустить.~~
- kind: content
  id: 908-dbt-project-evaluator
  title: 'dbt_project_evaluator: правила слоёв под контролем'
  materials:
  - label: dbt-project-evaluator
    url: https://github.com/dbt-labs/dbt-project-evaluator
  code_caption: подключение и прогон
  code: |
    # packages.yml
    packages:
      - package: dbt-labs/dbt_project_evaluator
        version: [">=0.14.0", "<0.15.0"]

    # dbt_project.yml — для ClickHouse и ряда
    # других адаптеров нужен dispatch
    dispatch:
      - macro_namespace: dbt
        search_order:
          ['dbt_project_evaluator', 'dbt']

    # прогон целиком
    dbt build --select package:dbt_project_evaluator
  bullets:
  - 'Шесть групп правил: граф, тесты, документация, структура, производительность, governance'
  - Ловит нарушения ровно тех договорённостей о слоях, что мы только что проговорили
  - 'Результат — не отчёт в консоли, а fct_-модели и тесты: их можно завалить в CI'
  - int_all_dag_relationships отдаёт весь DAG таблицей — свои проверки пишутся SQL-ом
  - Исключения оформляются seed-ом, а правило остаётся включённым для всех остальных
  notes: |
    Слои и правила из предыдущих слайдов держатся ровно до первого дедлайна: кто-нибудь сходит `join`-ом прямо в `source` мимо staging, и через полгода так сделает половина проекта. **dbt_project_evaluator** — это автоматическая проверка тех самых договорённостей.

    Он проверяет шесть групп правил: **устройство графа** (join в source мимо staging, rejoin уже соединённых сущностей, fanout, модели без потомков), **покрытие тестами и документацией**, **структуру** (именование и раскладка по каталогам), **производительность** (цепочки вьюх там, где нужна таблица) и **governance**. Ставится как обычный пакет; для ClickHouse и ряда адаптеров дополнительно нужен блок `dispatch`.

    Ключевая деталь — !!формат результата!!. Это не текстовый отчёт, который все прочитают один раз: пакет собирает `fct_`-модели с нарушениями и обычные dbt-тесты поверх них, поэтому __его можно поставить в CI и завалить сборку__. Таблица `int_all_dag_relationships` отдаёт весь граф в виде строк, и по ней пишутся собственные правила. ~~А если нарушение осознанное, оно оформляется исключением через seed — правило при этом продолжает действовать для всех остальных моделей, а не отключается целиком.~~
- kind: content
  id: 909-data-vault-i-automatedv
  title: Data Vault и AutomateDV
  materials:
  - label: AutomateDV
    url: https://automate-dv.readthedocs.io/en/latest/macros/
  code_caption: models/vault/hub_customer.sql
  code: |
    {{ config(materialized='incremental') }}

    {{ automate_dv.hub(
         src_pk='CUSTOMER_HK',
         src_nk='CUSTOMER_ID',
         src_ldts='LOAD_DATETIME',
         src_source='RECORD_SOURCE',
         source_model='stg_customer') }}

    -- SQL хаба генерируется по метаданным,
    -- руками он не пишется
  bullets:
  - Hub — бизнес-ключ, Link — связь между ключами, Satellite — атрибуты и их история
  - Новый источник добавляется рядом, а не переписывает существующие таблицы
  - AutomateDV собирает SQL по метаданным, staging считает хеш-ключи и hashdiff
  - 'Satellite обычно incremental: история пишется вставками, без обновлений'
  - Цена подхода — много таблиц и обязательный слой витрин поверх для BI
  notes: |
    **Data Vault** решает конкретную боль: источников много, они меняются, а переделывать схему каждый раз дорого. Модель раскладывается на три вида таблиц — **Hub** (бизнес-ключ), **Link** (связь) и **Satellite** (атрибуты с историей). Ключевое свойство: новый источник !!добавляется рядом новой сателлит-таблицей!!, а существующие не переписываются, и грузиться всё это может параллельно.

    Руками такой SQL никто не пишет. **AutomateDV** (бывший dbtVault) генерирует его по метаданным: в staging-слое считаются хеш-ключи и `hashdiff`, а модель хаба или сателлита — это вызов макроса с описанием полей. Сателлиты обычно `incremental`, потому что история пишется __вставками, а не обновлениями__.

    Честно про цену. Таблиц становится в разы больше, читать их напрямую невозможно, поэтому **поверх обязательно нужен слой витрин** (тот самый Kimball с фактами и измерениями) — иначе BI просто не поедет. ~~Поэтому Data Vault оправдан там, где источников много и они живут своей жизнью; для одного продуктового источника это оверинжиниринг.~~
- kind: content
  id: 910-prava-dostupa-v-dbt
  title: 'Права доступа: что делает dbt, а что DBA'
  materials:
  - label: grants
    url: https://docs.getdbt.com/reference/resource-configs/grants
  code_caption: dbt_project.yml — гранты как конфиг, а не post-hook
  code: |
    models:
      my_project:
        marts:
          +grants:
            select: ['analyst', 'bi_service']

    # без плюса — список заменяет существующий
    # с плюсом (+select) — добавляет к нему
    # применяется после сборки каждой модели
  bullets:
  - 'grants — структурированный конфиг: dbt выдаёт права сам после сборки модели'
  - Плюс перед привилегией добавляет получателей, без плюса — заменяет список
  - На sources, схемы и сам кластер прав dbt не выдаёт — это остаётся за DBA
  - 'Роли разделяем: dev пишет в свою схему, прод-роль ходит только в прод'
  - Пароли и ключи — через env_var в profiles.yml, а не строкой в репозитории
  notes: |
    До версии 1.2 права раздавали `post-hook` с самописным `GRANT`. Теперь есть **конфиг `grants`**: вы объявляете, кому что можно, а dbt !!сам применяет права после сборки модели!! — на нужном диалекте и без ручного SQL. Работает на моделях, seed-ах и снапшотах, объявляется в `dbt_project.yml`, в YAML-свойствах или прямо в модели.

    Одна деталь ломает больше всего сборок: **плюс перед привилегией**. `select:` — заменить список получателей целиком, `+select:` — добавить к унаследованному. Перепутали — и вы молча отобрали доступ у половины BI.

    Важнее понять границу. dbt управляет правами __только на то, что создал сам__. Доступ к сырым источникам, права на схемы, роли и пользователи в ClickHouse или Snowflake — это по-прежнему **работа DBA**, и dbt туда не лезет. Практическое правило: у разработчика своя схема и своя роль, у прода — отдельная, с записью только в прод. ~~А пароли и ключи в `profiles.yml` подставляются через `env_var`: профиль в репозитории должен быть безопасен для чтения любым, у кого есть доступ к коду.~~
- kind: content
  id: 911-pakety-versii-i-riski
  title: 'Пакеты: версии, обновление и риски'
  materials:
  - label: packages.yml
    url: https://docs.getdbt.com/docs/build/packages
  - label: dbt deps
    url: https://docs.getdbt.com/reference/commands/deps
  code_caption: packages.yml — версии пинятся, dbt_packages не коммитим
  code: |
    packages:
      - package: dbt-labs/dbt_utils
        version: [">=1.3.0", "<2.0.0"]

      - package: calogica/dbt_expectations
        version: 0.10.4

      - git: https://github.com/org/dbt-internal.git
        revision: v1.2.0      # тег, а не ветка

    # dbt deps  -> dbt_packages/  (в .gitignore)
    # package-lock.yml коммитим: он фиксирует,
    # что реально скачалось
  bullets:
  - Версия пинится диапазоном или тегом — «последняя» ломает сборку в чужой день
  - package-lock.yml коммитим, каталог dbt_packages/ — нет
  - Пакет — это чужой код в вашем проекте, его макросы могут переопределить ваши
  - Транзитивные зависимости конфликтуют по версиям, dbt deps скажет об этом сразу
  - Обновление пакета — отдельный MR с прогоном тестов, а не «заодно с фичей»
  notes: |
    Пакеты — это **зависимости**, и обращаться с ними надо как с зависимостями кода. Версию всегда пиньте: диапазоном (`>=1.3.0, <2.0.0`) или точным значением; для приватных пакетов из git указывайте __тег, а не ветку__, иначе сборка меняется в тот день, когда кто-то запушил в main чужого репозитория. С dbt 1.7 рядом появляется `package-lock.yml` — !!его коммитят, потому что он фиксирует то, что скачалось на самом деле!!, а сам каталог `dbt_packages/` в git не хранят: он воспроизводится командой `dbt deps`.

    Риск, о котором забывают: макросы пакета живут в **одном пространстве имён** с вашими. Пакет может переопределить макрос, а два пакета — потребовать несовместимые версии третьего; `dbt deps` сообщает о конфликте, но выбор остаётся за вами. Поэтому вызов через префикс (`dbt_utils.star`) — не формальность, а способ понимать, чей код исполняется.

    И организационное правило: **обновление пакета — это отдельный merge request** с прогоном тестов и чтением changelog. ~~В major-версиях пакеты меняют сигнатуры макросов, и такая правка, приехавшая «заодно» с продуктовой фичей, превращает разбор падения в археологию.~~
- kind: table
  id: 912-esche-pakety-pod-zadachu
  title: Ещё пакеты и утилиты под задачу
  materials:
  - label: dbt-score (Picnic)
    url: https://github.com/PicnicSupermarket/dbt-score
  - label: dbt-colibri
    url: https://github.com/b-ned/dbt-colibri
  - label: dbt_profiler
    url: https://hub.getdbt.com/data-mie/dbt_profiler/latest/
  table:
    headers:
    - Инструмент
    - Что делает
    - Зачем на практике
    rows:
    - - dbt_profiler
      - 'профиль колонок: NULL, уникальность, min/max'
      - быстрый аудит незнакомого источника
    - - dbt_external_tables
      - файлы в S3/GCS как sources
      - внешний слой без ручного DDL
    - - dbt_artifacts
      - метаданные прогонов в витрины
      - история времени, статусов и падений
    - - dbt-score (pip)
      - линтер метаданных, оценка 0–10
      - гейт на описания, тесты и владельцев
    - - dbt-colibri (pip)
      - column-level lineage из артефактов
      - lineage по колонкам без платформы вендора
    col_ratios:
    - 3
    - 5
    - 4
  notes: |
    Второй эшелон — то, что ставят под конкретную задачу, а не в каждый проект. **dbt_profiler** считает профиль колонок (доля NULL, уникальность, границы) и умеет класть его в документацию: !!это первое, что делаешь с незнакомым источником!!. **dbt_external_tables** описывает файлы в объектном хранилище как обычные `sources`, избавляя от ручного DDL. **dbt_artifacts** складывает метаданные прогонов в витрины — из них потом растут дашборды «сколько шла сборка» и «что падает чаще всего».

    Обратите внимание на пометку **pip** у последних двух. `dbt-score` и `dbt-colibri` — __не dbt-пакеты__: они не ставятся через `packages.yml` и `dbt deps`, а живут как отдельные python-утилиты рядом с проектом и читают его артефакты. Это другой способ подключения и другое место в CI.

    **dbt-score** от Picnic оценивает метаданные модели по правилам и выдаёт балл 0–10 — на этом удобно строить гейт «описания и владельцы обязательны». **dbt-colibri** собирает column-level lineage из уже существующих артефактов и рисует локальный дашборд. ~~Получается тот самый lineage по колонкам, за который обычно платят платформе, — ценой ещё одного шага в пайплайне.~~
- kind: content
  id: 913-pakety-v-ci-i-prode
  title: 'Пакеты в CI и проде: воспроизводимость'
  materials:
  - label: dbt deps
    url: https://docs.getdbt.com/reference/commands/deps
  code_caption: .gitlab-ci.yml — deps как шаг сборки, а не ручное действие
  code: |
    dbt_build:
      image: python:3.12
      cache:                     # не тянем пакеты каждый раз
        key: dbt-deps-$CI_COMMIT_REF_SLUG
        paths: [dbt_packages/]
      before_script:
        - pip install -r requirements.txt
        - dbt deps               # читает package-lock.yml
      script:
        - dbt build --target ci

    # приватный пакет: токен из переменной CI,
    # в packages.yml — только ссылка и тег
  bullets:
  - dbt deps — шаг пайплайна, а не то, что каждый делает у себя руками
  - Кэш dbt_packages экономит минуты, package-lock.yml гарантирует те же версии
  - Приватный пакет тянут по git+тегу с токеном из переменной CI, не из URL в репозитории
  - В docker-образ для прода пакеты кладут на этапе сборки, а не в рантайме
  - Обновление пакетов — отдельный MR со своим прогоном, а не сюрприз в ночном ране
  notes: |
    Пакеты ломают сборку не в разработке, а в CI и проде — потому что там !!никто не помнит, что нужно выполнить `dbt deps`!!. Правило простое: **deps — это шаг пайплайна**. Рядом стоят две оптимизации: кэш каталога `dbt_packages` (минуты на каждом прогоне) и `package-lock.yml`, который гарантирует, что в CI и на ноутбуке приехало __одно и то же__.

    Приватные пакеты — отдельная тема безопасности. В `packages.yml` хранится только ссылка и тег; токен приезжает **переменной окружения CI** и никогда не коммитится в URL. Это ровно тот случай, когда «работает и так» означает утечку в истории git.

    В проде порядок тот же, но жёстче: пакеты ставятся **на этапе сборки образа**, чтобы контейнер не ходил в интернет в рантайме, а обновление пакета оформляется __отдельным merge request__ со своим прогоном тестов. ~~Иначе разбор ночного падения начинается с вопроса «а что у нас вообще изменилось», на который нет ответа.~~
- kind: content
  id: 914-snapshots-i-docs-istoriya
  title: 'Snapshots и docs: история + смысл поля'
  code_caption: snapshots/customers_scd.sql · models/_docs.sql
  code: |
    -- snapshot: новая версия строки при смене status
    {% snapshot customers_scd %}
      {{ config(strategy='check', unique_key='id',
                check_cols=['name', 'status']) }}
      select id, name, status, updated_at
      from {{ source('raw', 'customers') }}
    {% endsnapshot %}

    -- docs-блок переиспользуется в schema.yml и dbt docs
    {% docs stg_orders__amount %}
    Сумма заказа после скидок и налогов.
    {% enddocs %}
  bullets:
  - 'Snapshot реализует SCD2: сохраняет версии бизнес-сущности во времени'
  - unique_key определяет объект, а check_cols — что считать изменением
  - dbt добавляет интервалы валидности, чтобы запросить «состояние на дату»
  - Docs-блок хранит одно описание и подставляется в несколько мест
  - Документация становится частью ревьюируемого кода
  notes: |-
    Snapshot — это механизм !!историзации SCD2!! для случаев, когда источник хранит только актуальную строку. Здесь id определяет клиента, а изменение name или status создаёт новую версию. После запуска можно спросить: «какой статус был у клиента на конец прошлого месяца?» — и ответить без отдельной самописной таблицы истории.

    Важно согласовать список **check_cols**: слишком широкий даёт лишние версии от технических полей, слишком узкий пропускает бизнес-изменения. __Snapshots не заменяют CDC автоматически__; это удобный dbt-слой, когда семантика и объём данных подходят.

    Блок **{% docs %}** решает другую задачу — единый смысл атрибута. Его можно вставить в schema.yml и получить в **dbt docs generate**, поэтому описание меняется вместе с моделью в том же MR. ~~Это особенно ценно для метрик и финансовых полей, где «сумма» без правил расчёта мало что означает.~~
- kind: content
  id: 915-materialized-views-clickhouse
  title: 'Материализованные представления: ClickHouse'
  materials:
  - label: dbt-clickhouse MV
    url: https://clickhouse.com/docs/integrations/dbt/materialization-materialized-view
  - label: Incremental MV
    url: https://clickhouse.com/docs/materialized-view/incremental-materialized-view
  code_caption: models/marts/mv_visits_daily.sql
  code: |
    {{ config(
        materialized='materialized_view',
        engine='AggregatingMergeTree()',
        order_by='(day, country)',
        catchup=True) }}

    select toDate(ts) as day, country,
           countState()       as visits,
           uniqState(user_id) as users
    from {{ source('raw', 'events') }}
    group by day, country
  bullets:
  - 'В ClickHouse MV — не кэш, а триггер на вставку: агрегат считается в момент INSERT'
  - Приёмник обычно AggregatingMergeTree, и GROUP BY совпадает с его ORDER BY
  - catchup=True сначала догоняет историю, потом создаёт саму MV
  - Refreshable MV пересчитывает всё по расписанию — можно JOIN, но свежесть ниже
  - 'В dbt это materialized_view: одна модель описывает и MV, и таблицу-приёмник'
  notes: |
    Главное недоразумение: в ClickHouse **материализованное представление — это не кэш запроса**, а !!триггер на вставку!!. Данные приезжают в исходную таблицу, MV в этот момент считает свою часть агрегата и кладёт результат в таблицу-приёмник. Читаете вы приёмник, и он всегда актуален по мере вставок.

    Отсюда два правила. Приёмник берут **AggregatingMergeTree** (или SummingMergeTree), а состояния пишут через `-State`-функции — `countState`, `uniqState`; при чтении их сворачивают `-Merge`. И `GROUP BY` в MV должен __совпадать с `ORDER BY`__ приёмника, иначе строки не схлопнутся и таблица распухнет.

    В dbt это отдельная материализация `materialized_view` адаптера ClickHouse: одна модель описывает и представление, и приёмник, а `catchup=True` догоняет историю перед созданием. Отдельно стоят **refreshable MV** — они периодически пересчитывают весь результат, поэтому поддерживают JOIN-ы. ~~Выбор простой: инкрементальная MV — когда нужна свежесть на вставке; refreshable — когда нужны сложные соединения и можно потерпеть задержку.~~
- kind: content
  id: 916-mikrobatching
  title: 'Микробатчинг: инкремент окнами времени'
  materials:
  - label: microbatch
    url: https://docs.getdbt.com/docs/build/incremental-microbatch
  code_caption: models/marts/fct_orders.sql
  code: |
    {{ config(
        materialized='incremental',
        incremental_strategy='microbatch',
        event_time='order_date',
        batch_size='day',
        lookback=3,
        begin='2026-01-01') }}

    select * from {{ ref('stg_orders') }}
    -- фильтр по окну dbt подставит сам:
    -- is_incremental() здесь не нужен
  bullets:
  - Одна большая дельта разбивается на независимые окна по времени
  - batch_size — hour, day (по умолчанию), month или year
  - lookback пересчитывает несколько прошлых окон — для опоздавших событий
  - Упал один батч — перезапускается он, а не весь бэкфилл
  - dbt сам фильтрует upstream-модели, у которых объявлен event_time
  notes: |
    Обычная инкрементальная модель делает **один большой запрос на всю дельту**. Пока данных мало — нормально; на бэкфилле за год это один запрос на миллиарды строк, который !!падает по памяти на девяносто восьмом проценте!! и начинается сначала.

    Стратегия **microbatch** (dbt 1.9) переворачивает это: модель объявляет `event_time`, `batch_size` и начало истории, а dbt сам режет период на окна и выполняет __по запросу на окно__. Предикат подставляется автоматически — писать `is_incremental()` и вручную считать `max(order_date)` больше не нужно.

    Два следствия, ради которых всё затевалось. Первое: **упавший батч перезапускается отдельно**, остальные остаются на месте. Второе: `lookback` заставляет пересчитывать несколько прошлых окон, что закрывает вечную проблему __опоздавших событий__. ~~Плюс dbt автоматически подрезает upstream-модели, у которых тоже объявлен event_time, — граф перестаёт читать лишнее.~~
- kind: content
  id: 917-dbt-i-potokovye-dannye
  title: 'dbt и потоковые данные: где проходит граница'
  materials:
  - label: dbt-risingwave
    url: https://github.com/risingwavelabs/dbt-risingwave
  code_caption: dbt-risingwave — модель как потоковая MV
  code: |
    {{ config(materialized='materialized_view') }}

    select window_start,
           count(*) as orders
    from tumble({{ source('kafka','orders') }},
                order_ts,
                interval '1 minute')
    group by window_start

    -- обновляется само, dbt run не нужен
  bullets:
  - dbt описывает SQL-преобразование; непрерывность обеспечивает движок, а не dbt run
  - 'RisingWave: materialized_view вместо incremental, отдельная материализация sink'
  - Потоковая MV пересчитывается сама — запрос всегда видит свежий результат
  - В Spark и Databricks роль такой модели играют streaming tables поверх Structured Streaming
  - Задача dbt здесь — версии, тесты и доки для потоковых определений
  notes: |
    Вопрос «умеет ли dbt в стриминг» поставлен неточно. dbt — это **генератор SQL и оркестратор графа**, у него нет собственного рантайма; !!непрерывность даёт движок под ним!!, а dbt описывает, что именно считать.

    Практически это выглядит так. В **RisingWave** модель материализуется как `materialized_view` — потоковая MV, которая обновляется сама по мере прихода событий; `incremental` там просто не нужен, а для выгрузки наружу есть материализация `sink`. В экосистеме Spark ту же роль играют **streaming tables** поверх Structured Streaming. В обоих случаях `dbt run` — это __деплой определения__, а не запуск обработки каждую минуту.

    Что остаётся за dbt и ради чего его сюда тащат: потоковые определения попадают в git, получают **тесты, описания и lineage** наравне с батчевыми моделями. ~~Граница проходит по свежести: секунды — стриминговый движок, минуты и часы — микробатчинг из предыдущего слайда, и это дешевле в эксплуатации.~~
- kind: content
  id: 918-semantic-layer-metricflow
  title: Semantic Layer / MetricFlow
  image: image62.png
  materials:
  - label: About MetricFlow
    url: https://docs.getdbt.com/docs/build/about-metricflow
  - label: MetricFlow commands
    url: https://docs.getdbt.com/docs/build/metricflow-commands
  bullets:
  - Единое определение метрик — один раз, в коде
  - MetricFlow генерирует корректный SQL по запросу метрики
  - Убирает расхождения метрик между дашбордами
  - Метрики доступны из BI, ноутбуков и через API
  - Консистентность и переиспользование бизнес-логики
  notes: |-
    Больная тема любой аналитики — когда __«выручка» в двух дашбордах считается по-разному__. !!Semantic Layer решает это: метрика определяется один раз в коде!!, а не переписывается в каждом BI-инструменте.

    Движок **MetricFlow** сам генерирует корректный **SQL** под каждый запрос. Метрики доступны из **BI**, ноутбуков и по **API** — и везде считаются **одинаково**. Это особенно важно, когда одна и та же метрика используется в отчётах, алертах и data products.

    Практический смысл для команды — __одна формула, один владелец, один контур тестирования__. ~~Консистентность и переиспользование бизнес-логики.~~
- kind: content
  id: 919-dbt-i-ai
  title: dbt и AI
  image: image67.png
  materials:
  - label: dbt Copilot
    url: https://docs.getdbt.com/docs/cloud/dbt-copilot
  - label: dbt MCP
    url: https://github.com/dbt-labs/dbt-mcp
  - label: context7
    url: https://context7.com/
  bullets:
  - dbt Copilot — генерация SQL, тестов, документации, метрик
  - dbt MCP — стандартный доступ LLM/агентов к моделям и метрикам
  - context7 / MCP — подключение IDE и AI к контексту проекта
  - Расширения приносят MCP прямо в IDE — Power User поднимает свой MCP-сервер
  - Агентные скиллы — повторяемые сценарии поверх MCP, а не копипаста в чат
  - AI ускоряет рутину, но код остаётся ревьюируемым
  notes: |-
    dbt активно интегрируется с **ИИ**. **dbt Copilot** генерирует **SQL**, **тесты** и **документацию** — это ускоряет рутинную часть работы, но не отменяет ревью и понимание модели человеком.
    !!dbt MCP даёт языковым моделям и агентам стандартный, управляемый доступ!! к вашим моделям и метрикам; **context7** и MCP подключают IDE/AI к __контексту проекта__. Это полезно, когда ассистенту нужно работать не «в вакууме», а с актуальными моделями, тестами и описаниями.
    Важно: ИИ **ускоряет рутину**, но результат — это по-прежнему **код**, который проходит __ревью и тесты__. ~~Самая сильная схема — не автогенерация вместо инженера, а ассистент, который снимает повторяющуюся работу и уменьшает трение.~~
- kind: content
  id: 920-dbt-state-i-dbt-wizard
  title: 'Куда идёт dbt: State и агент Wizard'
  materials:
  - label: ADE-bench
    url: https://www.getdbt.com/resources/webinars/analytics-data-engineer-bench
  - label: dbt Core v2 roadmap
    url: https://github.com/dbt-labs/dbt-core/blob/main/docs/roadmap/2026-06-announcing-v2.md
  bullets:
  - 'dbt State: сравнение с прошлым прогоном стало частью движка, а не трюком для CI'
  - На нём держатся slim CI, отложенные ссылки (defer) и повторные запуски
  - 'dbt Wizard — агент под цикл аналитической инженерии: разобраться, изменить, проверить'
  - По заявлению dbt Labs — 76 % на ADE-bench, бенчмарке задач дата-инженерии
  - Parquet-артефакты v2 агент читает запросом, а не разбором manifest.json
  notes: |
    Два анонса, которые стоит держать в голове. Первый — **dbt State**: механика «сравнить проект с прошлым состоянием» перестала быть __трюком для CI__ и стала штатной частью движка. Практически это то же самое, что мы разобрали на слайде про slim CI, только быстрее и доступно везде: на состоянии держатся выбор изменённого, `defer` и повторные запуски после падения.

    Второй — **dbt Wizard**, агент, заточенный не под «напиши SQL», а под весь цикл аналитической инженерии: разобраться в чужом проекте, внести правку, проверить результат. Для измерения dbt Labs сделали **ADE-bench** — бенчмарк задач аналитической и дата-инженерии; по их публикации Wizard берёт !!76 % на наборе из 75 задач!!. Цифра вендорская, и относиться к ней стоит как к вендорской, но сам бенчмарк — полезная попытка мерить агентов на реальной работе, а не на олимпиадных задачках.

    Техническая деталь, которая связывает всё это: **Parquet-артефакты** из v2 агент читает __запросом__. ~~Именно поэтому «дать модели контекст проекта» перестаёт означать «скормить ей гигантский manifest.json» — и почему MCP и агентные скиллы вокруг dbt стали работать заметно лучше.~~
- kind: table
  id: 921-jinja-swot
  title: 'Jinja: SWOT шаблонного подхода'
  materials:
  - label: Jinja в dbt
    url: https://docs.getdbt.com/docs/build/jinja-macros
  table:
    headers:
    - Квадрант
    - Что за этим стоит
    rows:
    - - S — сильные стороны
      - работает с любым диалектом и любым движком именно потому, что ничего о них не знает; порог входа
        — обычный SQL плюс подстановка; макросы дают DRY и переносимость через dispatch; на Jinja построена
        вся экосистема пакетов dbt
    - - W — слабые стороны
      - 'это подстановка текста: шаблон не знает ни колонок, ни типов, ни границ выражения; ошибку видно
        только в скомпилированном SQL; вложенные макросы быстро перестают читаться; lineage по колонкам
        из текста не выводится'
    - - O — возможности
      - генерация по метаданным — пивоты, AutomateDV, staging из codegen; один проект компилируется под
        несколько СУБД; правила качества и структура проекта описываются один раз
    - - T — угрозы
      - логика уезжает в шаблоны, и проект становится программой, которая печатает SQL; отладка дорожает
        быстрее, чем растёт польза; движки нового поколения строят lineage из разобранного SQL, и текстовый
        слой мешает — включая сам dbt в Fusion
    col_ratios:
    - 2
    - 8
  notes: |
    Соберём разговор про Jinja в один честный SWOT. **Сильная сторона и слабая — это одно и то же свойство**, посмотренное с разных сторон: Jinja !!ничего не знает о SQL!!. Именно поэтому он работает с любым диалектом и любым движком, и именно поэтому он не может подсказать вам ни колонку, ни тип, ни то, что вы разорвали выражение пополам.

    **Возможности** — там, где логика повторяется и описывается метаданными: пивот по значениям из данных, генерация staging через codegen, хабы и сателлиты AutomateDV, единый проект под несколько СУБД. Всё это без шаблонов пришлось бы писать руками или внешним генератором.

    **Угрозы** начинаются, когда шаблонов становится больше, чем SQL. Проект превращается в __программу, которая печатает SQL__: отладка идёт через `target/compiled`, а не через чтение модели, и цена каждого следующего макроса растёт. ~~Второй, более медленный риск — направление индустрии: чтобы строить lineage на уровне колонок, движку нужно разбирать SQL, а не склеивать строки. Об этом следующий слайд.~~
- kind: content
  id: 922-pochemu-drugie-uhodyat-ot-shablonov
  title: Почему другие движки уходят от шаблонов
  materials:
  - label: SQLMesh macros
    url: https://sqlmesh.readthedocs.io/en/stable/concepts/macros/sqlmesh_macros/
  - label: Spark Declarative Pipelines
    url: https://spark.apache.org/docs/latest/declarative-pipelines-programming-guide.html
  code_caption: одно ограничение — текстом и над разобранным SQL
  code: |
    -- dbt + Jinja: подстановка текста
    {% set cutoff = var('cutoff_days', 30) %}
    select * from {{ ref('orders') }}
    where order_date >= current_date - {{ cutoff }}

    -- SQLMesh: макрос над разобранным SQL
    @DEF(cutoff, 30);
    SELECT * FROM orders
    WHERE order_date >= CURRENT_DATE - @cutoff;
  bullets:
  - 'SQLMesh: макросы правят семантическое представление запроса (SQLGlot), а не текст'
  - В его документации претензия прямая — шаблонизатор намеренно ничего не знает о языке, который шаблонизирует
  - 'Spark SDP: датасеты объявлены кодом (.py или .sql), таблицы в цикле — обычный Python, шаблонного
    слоя нет'
  - 'Bruin — контрпример: он как раз на Jinja, со своими start_date/end_date, циклами и условиями'
  - 'Уходят не «все», а те, кто строит lineage по колонкам: для этого SQL надо разбирать'
  notes: |
    Сначала поправка к расхожему тезису: **«все уходят от Jinja» — миф**. Bruin, один из самых заметных новых инструментов, построен ровно на нём: переменные `start_date` и `end_date`, циклы, условия — знакомая картина. Уходят не все, а те, кому мешает конкретное свойство.

    Свойство это — **слепота к SQL**. У SQLMesh макросы правят !!семантическое представление запроса!!, разобранное библиотекой SQLGlot, и поэтому движок сам понимает, подставить ли строковый литерал или идентификатор. В документации претензия сформулирована прямо: шаблонизатор __намеренно ничего не знает о языке, который шаблонизирует__. Показательно, что Jinja там при этом поддержан — его не запрещают, его понижают в статусе.

    **Spark Declarative Pipelines** решают задачу иначе: там нет шаблонного слоя вовсе. Исходники — `.py` или `.sql`, датасеты объявляются кодом через `pyspark.pipelines`, и если нужно создать двадцать похожих таблиц, это обычный питоновский цикл, а не текст с дырками.

    Общий знаменатель — **column-level lineage и анализ влияния**. Чтобы сказать «эта правка ломает вот эту колонку в вон той витрине», движок обязан разобрать SQL. ~~И то же самое сейчас делает сам dbt: Fusion разбирает SQL и вводит строгую спецификацию языка — та же критика, пришедшая изнутри.~~
- kind: table
  id: 923-sqlmesh-i-dbt-swot
  title: 'SQLMesh против dbt: SWOT'
  materials:
  - label: SQLMesh docs
    url: https://sqlmesh.readthedocs.io
  - label: SQLGlot
    url: https://github.com/tobymao/sqlglot
  table:
    headers:
    - Квадрант
    - Что за этим стоит
    rows:
    - - S — сильные стороны
      - разбор SQL в AST (SQLGlot) и column-level lineage; virtual environments; plan/apply с анализом
        влияния; инкрементальность и аудиты внутри модели
    - - W — слабые стороны
      - небольшая экосистема пакетов; меньше готовых рецептов и обучения; нишевый рынок найма; интеграции
        с оркестраторами менее зрелые
    - - O — возможности
      - greenfield-проекты; дешёвые preview-среды на каждый PR; запуск поверх существующего dbt-проекта
        без переписывания моделей
    - - T — угрозы
      - миграция работающего dbt без явной боли; двойной стек и раздвоение практик в команде; ставка на
        одного вендора (Tobiko Data)
    col_ratios:
    - 2
    - 8
  notes: |
    Раньше на этом месте было три слайда сравнения — сведём их в один честный SWOT. **Сильные стороны SQLMesh технические и реальные**: он разбирает SQL в синтаксическое дерево через SQLGlot, поэтому знает !!lineage на уровне колонок!! и отличает ломающее изменение от безобидного. Виртуальные среды делают «свою копию хранилища на ветку» дешёвой, а `plan` показывает влияние правки __до__ применения.

    **Слабости — не в технике, а вокруг неё**: пакетов меньше, статей и курсов меньше, нанимать сложнее, интеграции менее обкатаны. Именно это чаще всего и решает исход спора в команде.

    **Возможности** — там, где нет груза legacy: новый проект, дорогие preview-среды, желание получить impact analysis. Причём переходить целиком не обязательно: SQLMesh умеет запускаться __поверх существующего dbt-проекта__ (следующий слайд). **Угрозы** — миграция ради миграции, двойной стек, когда половина команды живёт в одном инструменте, а половина в другом, и зависимость от одного вендора. ~~Практический вывод курса: на greenfield SQLMesh стоит рассматривать всерьёз, а работающий dbt-проект переносят только под конкретную боль, которую можно назвать вслух.~~
- kind: content
  id: 924-sqlmesh-poverh-dbt-proekta
  title: SQLMesh поверх существующего dbt-проекта
  materials:
  - label: SQLMesh + dbt
    url: https://sqlmesh.readthedocs.io/en/stable/integrations/dbt/
  code_caption: из корня рабочего dbt-проекта
  code: |
    pip install "sqlmesh[dbt]"

    sqlmesh init -t dbt   # читает dbt_project.yml
                          # и profiles.yml

    sqlmesh plan dev      # что изменилось и что
                          # придётся пересчитать
    sqlmesh run           # штатные прогоны

    # модели остаются dbt-моделями:
    # тот же SQL с ref() и Jinja
  bullets:
  - 'Проект не переписывается: init читает dbt_project.yml и profiles.yml'
  - Модели, seeds и пакеты (dbt deps) остаются на месте
  - dbt-тесты становятся audits; sqlmesh test — это юнит-тесты запросов
  - is_incremental() меняется на sqlmesh_incremental и временные переменные
  - 'Поддержано не всё: часть jinja-методов и отдельные настройки snapshots'
  notes: |
    Это ответ на главное возражение «у нас уже сто моделей на dbt». SQLMesh умеет работать **как движок поверх вашего dbt-проекта**: `sqlmesh init -t dbt` из корня проекта читает `dbt_project.yml` и `profiles.yml`, забирает модели, seeds и подключения. !!Переписывать SQL не нужно!! — модели остаются dbt-моделями с `ref()` и Jinja, а рядом появляется `sqlmesh.yaml` со своими настройками по умолчанию.

    Что меняется в терминах. dbt-тесты приезжают как **audits**; при этом слово `test` в SQLMesh занято под __юнит-тесты логики запроса__ — это разные вещи, и путаница здесь стоит дорого. Окружения SQLMesh создаёт сам во время `plan`, поэтому хардкодить target в профиле не нужно: профиль указывает на прод, остальное берёт на себя движок.

    Честные ограничения тоже стоит назвать. Инкрементальные блоки `is_incremental()` заменяются на **sqlmesh_incremental** с предопределёнными временными переменными; часть jinja-методов (`debug`, обход `graph.nodes`) недоступна; у snapshots не поддержан `invalidate_hard_deletes=False`; типы seed-колонок иногда приходится указывать явно. ~~Поэтому реалистичный сценарий — не «переезд в пятницу», а параллельный запуск на копии проекта: увидеть plan, оценить impact analysis и уже потом решать.~~
- kind: content
  id: 925-deklarativnye-transformacii
  title: 'Декларативные трансформации: ещё четыре подхода'
  materials:
  - label: Bruin overview
    url: https://getbruin.com/docs/bruin/overview.html
  - label: Spark Declarative Pipelines
    url: https://docs.databricks.com/aws/en/ldp/
  - label: Lakeflow pipelines
    url: https://docs.databricks.com/aws/en/ldp/concepts/pipelines
  - label: Snowflake Dynamic Tables guide
    url: https://docs.snowflake.com/en/user-guide/dynamic-tables/decision-guide
  bullets:
  - Bruin — один CLI для ingestion, SQL/Python assets, quality checks и lineage в repo
  - Spark Declarative Pipelines (SDP) — SQL/Python для batch и streaming-графов
  - 'Databricks Lakeflow — managed-пайплайны: flows, streaming tables, materialized views'
  - Snowflake Dynamic Tables — SELECT + TARGET_LAG; платформа сама ведёт refresh и порядок DAG
  - 'Выбор: portable dbt/SQLMesh/Bruin или нативные возможности конкретной платформы'
  notes: |-
    Тренд шире одного dbt: команды всё чаще описывают !!желаемый набор данных и зависимости!!, а не последовательность низкоуровневых задач. **Bruin** объединяет ingestion, SQL/Python-преобразования, quality checks и lineage в репозитории — полезно, когда хочется меньше разрозненных инструментов.

    В Spark-экосистеме **Spark Declarative Pipelines** описывает batch и streaming-пайплайны в SQL или Python. Databricks **Lakeflow** — управляемая реализация этого подхода: платформа анализирует зависимости и оркестрирует flows, streaming tables и materialized views. Это естественно для Delta/streaming-нагрузок, но сильнее привязывает решение к платформе.

    В Snowflake **Dynamic Tables** позволяют определить результат SQL-запросом и TARGET_LAG; Snowflake сам поддерживает порядок refresh и, где возможно, incremental processing. Для процедурной логики, точного cron или сложного MERGE остаются streams/tasks. __dbt выигрывает переносимостью и экосистемой__, нативные средства — меньшим количеством операционного кода внутри своей платформы. ~~Современный стек часто сочетает эти подходы, а не выбирает ровно один.~~
