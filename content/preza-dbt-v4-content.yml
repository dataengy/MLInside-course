    highlight: true
  - label: Astronomer guide
    url: https://www.astronomer.io/docs/learn/airflow-dbt
  - label: Cosmos docs
    url: https://astronomer.github.io/astronomer-cosmos/
  code_caption: dags/olist_delivery.py
  code_lang: python
  code: |2
    from cosmos import (
        DbtTaskGroup, ProjectConfig,
        ProfileConfig, RenderConfig,
    )

    transform = DbtTaskGroup(
        group_id="dbt_olist",
        project_config=ProjectConfig(
            dbt_project_path=DBT_DIR),
        profile_config=ProfileConfig(
            profile_name="olist",
            target_name="prod",
            profiles_yml_path=PROFILES),
        render_config=RenderConfig(
            select=["tag:features"]),
    )
  notes: |2
    [~2.5 мин] **Главное:** Cosmos читает ваш dbt-проект и !!раскрывает его в задачи Airflow!! — по задаче на узел графа.

    **Разбор кода:** три конфига. `ProjectConfig` — где лежит dbt-проект. `ProfileConfig` — как подключаться; в проде вместо `profiles_yml_path` обычно используют маппинг на Airflow Connection, чтобы креды жили в Airflow. `RenderConfig` — какую часть графа разворачивать: здесь только модели с тегом `features`.

    Не разбирать: полный список параметров, их много.

    **Для MLE:** практическая выгода конкретная. Упала одна модель — вы видите в интерфейсе Airflow именно её, читаете её лог, перезапускаете именно её. Плюс ретраи и SLA настраиваются на модель, а не на весь проект.

    **Пример:** `select=["tag:features"]` — способ отделить ночную сборку витрин признаков от остальных витрин компании в том же dbt-проекте.

    **Осторожно:** Cosmos парсит dbt-проект, чтобы построить задачи, и это стоит времени на каждом разборе DAG-файла. В больших проектах используют заранее собранный `manifest.json` вместо разбора на лету.

