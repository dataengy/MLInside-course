  notes: |2
    [101:06–102:06 · ~1 мин] **Главное:**
    - Это !!субъективный рейтинг лектора!!, а не отраслевой бенчмарк — колонка так и называется, «Мой балл».
    - Ценность не в цифрах, а в том, что восемь способов разложены по одним и тем же осям.

    **Рассказ:**
    - Таблица читается по колонкам: сложность внедрения, популярность, тренд, контроль над dbt-графом, изоляция исполнения — и итоговый балл.

    Верх таблицы: **Astronomer Cosmos** 9.5 и **Cosmos + Watcher/K8s** 9.3 — оба дают контроль над графом на пять звёзд, различаются изоляцией. **dbt Cloud Provider** 8.4 — просто, но управление уезжает в подписку. **KubernetesPod / ECS / Cloud Run + dbt CLI** 8.0 — отличная изоляция ценой того, что граф снова становится одной задачей.

    Низ: **BashOperator + dbt CLI** 7.0 — честный первый шаг, мы про него говорили; **airflow-dbt-python** 6.5; **custom manifest.json → DAG** 4.5 — полный контроль при сложности 9/10, то есть свой Cosmos, который потом сопровождать вам; **legacy airflow-dbt** 3.0 — не брать.

