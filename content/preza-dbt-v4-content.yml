          - id: check-model-has-all-columns
  notes: |2
    [118:54–120:24 · ~1.5 мин] **Главное:**
    - Это тот самый локальный рубеж из блока про shift left, только теперь !!в виде конфига, который работает у всей команды!!.

    **Разбор кода:**
    - Порядок хуков не случаен — сначала формат, потом правила, потом смысл.
    - `sqlfmt` и `sqlfluff-lint` мы уже обсуждали; новое здесь — `dbt-checkpoint`.
    - `dbt-compile` проверяет, что шаблон рендерится и все `ref` разрешаются.
    - Три следующих хука — про метаданные: у модели есть тесты, есть описание, все колонки описаны.
    - Это те проверки, которых нет ни у одного линтера SQL, потому что они про dbt-проект, а не про язык.

    **Практический смысл:**
    - !!`check-model-has-tests` — то правило, ради которого стоит ставить всё остальное.!! Одна строка в конфиге превращает «мы собирались написать тесты» в «без тестов коммит не пройдёт».
    - Для витрины признаков это дороже любого линтера.

    **Осторожно:**
    - pre-commit можно обойти — `git commit --no-verify`, и хуки не выполнятся.
    - Поэтому он !!не заменяет CI!!, а стоит перед ним.
    - Всё, что действительно обязательно, должно дублироваться в пайплайне.

    **Переход:**
    - ~~«Второй рубеж — обязательный, в чистом окружении».~~
- kind: content
  id: 061b-ci-barrier-actions-gitlab
  title: 'CI-барьер: GitHub Actions и GitLab CI'
  bullets:
  - 'CI повторяет проверки в чистом окружении, независимо от машины автора'
  - 'Стадии: быстрый lint → dbt deps → сборка изменённого с тестами'
  - 'Креды приходят переменными окружения, profiles.yml читает env_var()'
  - 'Собираем в отдельную CI-схему, а не в прод — и убираем её за собой'
  - 'Артефакты прод-прогона (manifest.json) кэшируем как вход для Slim CI'
  - 'Зелёный пайплайн — обязательное условие merge, а не рекомендация'
  materials:
  - label: dbt CI best practices
    url: https://docs.getdbt.com/best-practices/best-practice-workflows
  - label: GitHub Actions
    url: https://docs.github.com/actions
  code_caption: .github/workflows/dbt-ci.yml · .gitlab-ci.yml
  code_lang: yaml
  code: |2
    # ── GitHub Actions ────────────────────────────────
    jobs:
      dbt:
        runs-on: ubuntu-latest
        env:
          CH_HOST:     ${{ secrets.CH_HOST }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD }}
          DBT_TARGET:  ci
        steps:
          - uses: actions/checkout@v4
          - run: pip install -r requirements.txt
          - run: dbt deps
          - run: dbt build --target ci --select state:modified+ \
                           --defer --state ./artifacts/prod

    # ── GitLab CI ─────────────────────────────────────
    stages: [lint, build]
    lint:  {script: [sqlfluff lint models/, dbt compile]}
    build: {script: [dbt deps, dbt build --target ci]}
  notes: |2
    [120:24–122:24 · ~2 мин] **Главное:**
    - CI — это !!обязательный рубеж в чистом окружении!!.
    - Всё, что «у меня работает», проверяется здесь ещё раз, с нуля.

    **Разбор кода:**
    - Две половины делают одно и то же в разных синтаксисах, поэтому разбирать стоит структуру, а не строки.
    - Первое — **секреты**.
    - Пароль и адрес хранилища приходят переменными окружения из хранилища секретов CI; в репозитории лежит только `profiles.yml` с `env_var()`.
    - Ни одна строка кредов не коммитится.
    - Второе — **отдельный target `ci`**.
    - Сборка идёт в свою схему, а не в прод.
    - Это не формальность: без этого упавший PR оставляет мусор в продовой схеме.
    - Третье — **порядок**: `dbt deps` перед сборкой, всегда.
    - Забытый `deps` — самая частая причина «в CI не работает, а локально работает».

    **Практический смысл:**
    - Барьер имеет смысл, только если он блокирующий.
    - Если merge проходит при красном пайплайне, вы платите за CI и не получаете гарантии.

    **Осторожно:**
    - Сборка в CI не должна занимать часы, иначе её отключат первой же спешкой.
    - Как этого добиться — следующий слайд.

    **Переход:**
    - ~~«Как сделать барьер быстрым: собираем только изменённое».~~
- kind: content
  id: 061c-slim-ci
  title: 'Slim CI: пересобираем только изменённое'
  bullets:
  - 'state:modified+ — изменённые модели и всё, что от них зависит'
  - '--defer со --state: недостающие ссылки читаются из прод-схемы'
  - 'Нужен свежий manifest.json прод-прогона как артефакт пайплайна'
  - 'Минуты вместо часов — и барьер перестают отключать «на разок»'
  - 'В dbt v2 сравнение с прошлым состоянием стало частью движка (dbt State)'
  - 'Устаревший манифест деградирует молча — обновлять его должен прод-пайплайн'
  materials:
  - label: Node selection
    url: https://docs.getdbt.com/reference/node-selection/syntax
  - label: defer
    url: https://docs.getdbt.com/reference/node-selection/defer
  code_caption: CI-джоба на merge request
  code_lang: bash
  code: |2
    # артефакты ПРОД-прогона лежат в ./artifacts/prod
    dbt build \
      --select state:modified+ \
      --defer \
      --state ./artifacts/prod

    # state:modified+  изменённое и все потомки
    # --defer          остальное берём из прода

    # варианты селектора по состоянию
    state:modified       # только сами изменения
    state:modified+      # + всё ниже по графу
    1+state:modified+    # + родитель (для тестов)
    state:new            # только новые модели
  notes: |2
    [122:24–124:24 · ~2 мин] **Главное:**
    - Slim CI — это ответ на вопрос «как сделать обязательный барьер таким, чтобы его не отключили».
    - Экономика простая: !!полная сборка витрин на каждый PR занимает часы!!.

    **Разбор кода:**
    - Два флага.
    - `--select state:modified+` — dbt сравнивает текущий проект с манифестом прошлого прогона и берёт изменённые модели плюс всех их потомков.
    - `--defer --state` — всё остальное, чего в CI-схеме нет, читается из прода вместо пересборки.
    - Внизу — варианты селектора.
    - Полезнее всего `1+state:modified+`: он добавляет одного родителя сверху, потому что тесты на связь между слоями иначе не с чем сравнивать.

    **Практический смысл:**
    - Проверка занимает ровно столько, сколько вы реально тронули.
    - Правка одного признака — сборка одной витрины, а не всего проекта.

    **Осторожно:**
    - !!`state:modified` сравнивает с манифестом прошлого прогона.!! Если артефакты устарели или потерялись, сравнение молча деградирует, и в сборку попадёт не то, что вы ожидали.
    - Обновление артефактов — часть прод-пайплайна, а не отдельная забота дежурного.

    **Пример:**
    - В dbt Core v2 механика состояния стала частью движка и работает быстрее — про это есть слайд в Part 3.

    **Переход:**
    - ~~«Раз речь про команды — соберём их в одну таблицу».~~
- kind: table
  id: 061d-osnovnye-komandy-dbt
  title: Основные команды dbt и их полезные модификаторы
  materials:
  - label: dbt build
    url: https://docs.getdbt.com/reference/commands/build
  - label: dbt retry
    url: https://docs.getdbt.com/reference/commands/retry
  - label: выбор моделей
    url: https://docs.getdbt.com/reference/node-selection/syntax
  table:
    headers:
    - Команда
    - Что делает
    - Частые модификаторы
    - Пример
    rows:
    - - dbt build
      - run + test + seed + snapshot в порядке DAG — рабочая лошадка
      - '--select · --exclude · --fail-fast · --full-refresh'
      - dbt build --select tag:features --fail-fast
    - - dbt run
      - только модели, без тестов
      - '--select · --full-refresh · --vars · --threads'
      - dbt run -s mart_delivery_features --full-refresh
    - - dbt test
      - тесты данных и unit-тесты
      - '--select · --store-failures · --severity'
      - dbt test -s mart_delivery_features --store-failures
    - - dbt retry
      - повторяет ПОСЛЕДНИЙ прогон с точки падения, не с начала
      - '--threads · --target'
      - dbt retry
    - - dbt compile
      - рендерит Jinja в SQL, в базу не ходит
      - '--select · --inline'
      - dbt compile -s stg_orders && cat target/compiled/…
    - - dbt source freshness
      - проверяет, доехали ли данные в источники
      - '--select source:olist_raw'
      - dbt source freshness --select source:olist_raw
    - - dbt seed
      - грузит CSV из seeds/ как таблицы
      - '--full-refresh · --select'
      - dbt seed --select country_codes
    - - dbt snapshot
      - историзация изменений (SCD2)
      - '--select · --threads'
      - dbt snapshot --select customers_scd
    - - dbt docs generate
      - собирает сайт документации и lineage
      - '--static · --no-compile'
      - dbt docs generate --static
    - - dbt ls
      - печатает выбранные узлы графа
      - '--select · --output json · --quiet'
      - dbt ls -s +mart_delivery_features --quiet
    col_ratios:
    - 4
    - 6
    - 5
    - 7
  notes: |2
    [124:24–126:54 · ~2.5 мин] **Главное:**
    - Команд немного, и запоминать надо не их, а !!модификаторы!! — почти вся работа с dbt в проде это `--select` плюс один флаг.

    **Рассказ:**
    - Взять четыре строки, остальные студент прочитает.
    - **dbt build** — главная.
    - Она собирает модель и тут же прогоняет её тесты, идя по графу; `--fail-fast` останавливает прогон на первом падении, что в CI экономит минуты.
    - **dbt retry** — недооценённая.
    - Она повторяет !!последний прогон с той точки, где он упал!!, читая `run_results.json`, а не начинает с нуля.
    - На ночной сборке из пятидесяти моделей, упавшей на сорок седьмой, это разница между тремя минутами и часом.
    - Работает без аргументов — состояние берётся из `target/`.
    - **dbt test --store-failures** — записывает нарушившие строки в отдельную таблицу вместо того, чтобы просто сказать «упало N строк».
    - Для отладки признаков это то, что нужно: можно посмотреть глазами, какие именно заказы сломали контракт.
    - **dbt compile** — первый инструмент отладки Jinja, мы им пользовались весь блок про шаблоны.

    **Практический смысл:**
    - Практический набор на каждый день — четыре строки: `dbt build -s <модель>+`, `dbt retry`, `dbt test -s <модель> --store-failures`, `dbt compile -s <модель>`.

    **Осторожно:**
    - `--full-refresh` на инкрементальной витрине признаков за три года — это полный пересчёт истории.
    - Он иногда нужен, но это не «на всякий случай».

    **Переход:**
    - ~~«Отдельно стоит разобрать селекторы — это то, чем вы будете пользоваться чаще всего».~~
- kind: content
  id: 061e-dbt-run-selektory
  title: 'dbt run: селекторы графа'
  image: pic-dbt-run-terminal.png
  code_caption: 'dbt run -s … (то же работает в build / test / ls)'
  code_lang: bash
  code: |2
    dbt run                          # все модели
    dbt run -s my_model              # одна модель
    dbt run -s tag:nightly           # все с тегом
    dbt run -s pkg.some_model        # из пакета
    dbt run -s path/to/models        # каталог
    dbt run -s path/to/my_model.sql  # по файлу

    dbt run -s my_model+             # и все дети
    dbt run -s +my_model             # и все родители
    dbt run -s +my_model+            # родители + дети
    dbt run -s 1+my_model            # глубина 1

    dbt run -s tag:features,+stg_orders   # И
    dbt run -s stg_orders stg_sellers     # ИЛИ
    dbt run --exclude tag:slow            # исключить
  notes: |2
    [126:54–128:54 · ~2 мин] **Главное:**
    - !!Плюс — это направление по графу!!.
    - Справа от имени — вниз, к потребителям; слева — вверх, к источникам.
    - Всё остальное запоминается само.

    **Разбор кода:**
    - Три группы.
    - Первая — способы назвать модель: по имени, по тегу, по пакету, по каталогу, по файлу.
    - Тег — самый практичный: пометьте `tag: features` все модели витрины признаков, и ночная сборка описывается одной строкой.
    - Вторая — граф.
    - `my_model+` собирает модель и всех её потомков: это то, что вы запускаете после правки.
    - `+my_model` — модель и всех её родителей: это то, что вы запускаете, когда собираете витрину с нуля в чистой схеме.
    - `+my_model+` — обе стороны.
    - Цифра перед плюсом ограничивает глубину.
    - Третья — комбинации: пробел работает как ИЛИ, запятая как И, `--exclude` вычитает.
    - Картинка справа — как это выглядит в терминале: dbt печатает, сколько моделей нашёл, какие стартовали, что создано (view или table) и сколько это заняло.
    - !!Строку `Done. PASS=… WARN=… ERROR=… SKIP=…` читают в первую очередь!! — SKIP означает, что выше по графу что-то упало.

    **Практический смысл:**
    - После правки признака запускайте `dbt build -s <модель>+`, а не `dbt build`.
    - Разница — секунды против получаса, и вы точно видите, что именно затронуто.

    **Осторожно:**
    - Тот же синтаксис используется в Slim CI (`state:modified+`), поэтому привычка ставить плюс в правильную сторону окупается дважды.

    **Переход:**
    - ~~«Селекторы дают контроль над сборкой. Теперь — контроль над качеством самого проекта».~~
- kind: content
  id: 061f-kachestvo-proekta
  title: 'Качество проекта: dbt_project_evaluator'
  bullets:
  - 'Шесть групп правил: граф, тесты, документация, структура, производительность, governance'
  - 'Ловит нарушения слоёв — join в source мимо staging, rejoin, fanout, модели без потомков'
  - 'Результат — не отчёт в консоли, а fct_-модели и тесты: их можно завалить в CI'
  - 'int_all_dag_relationships отдаёт весь DAG таблицей — свои правила пишутся SQL-ом'
  - 'Исключения оформляются seed-ом, правило остаётся включённым для остальных'
  - 'Рядом: dbt-score (балл 0–10 за метаданные), elementary (аномалии), audit_helper (диффы витрин)'
  materials:
  - label: dbt-project-evaluator
    url: https://github.com/dbt-labs/dbt-project-evaluator
  - label: dbt-score (Picnic)
    url: https://github.com/PicnicSupermarket/dbt-score
  - label: elementary
    url: https://github.com/elementary-data/elementary
  code_caption: подключение и прогон как part of CI
  code_lang: yaml
  code: |2
    # packages.yml
    packages:
      - package: dbt-labs/dbt_project_evaluator
        version: [">=0.14.0", "<0.15.0"]

    # dbt_project.yml — ClickHouse и ряд адаптеров
    # требуют явного dispatch
    dispatch:
      - macro_namespace: dbt
        search_order: ['dbt_project_evaluator', 'dbt']

    # осознанное исключение — seed, а не отключение правила
    # seeds/dbt_project_evaluator_exceptions.csv
    #   fct_name,column_name,id_to_exclude
    #   fct_source_fanout,child,stg_order_items

    # в CI
    #   dbt build --select package:dbt_project_evaluator
  notes: |2
    [128:54–130:54 · ~2 мин] **Главное:**
    - **dbt_project_evaluator** проверяет !!сам проект так же, как тесты проверяют данные!! — правилами, в CI.

    **Рассказ:**
    - Он проверяет шесть групп правил: **устройство графа** (join в source мимо staging, rejoin уже соединённых сущностей, fanout, модели без потомков), **покрытие тестами и документацией**, **структуру** (именование и раскладка по каталогам), **производительность** (цепочки вьюх там, где нужна таблица) и **governance**.
    - Ключевая деталь — !!формат результата!!.
    - Это не текстовый отчёт, который прочитают один раз: пакет собирает `fct_`-модели с нарушениями и обычные dbt-тесты поверх них, поэтому его можно поставить в CI и __завалить сборку__.
    - Таблица `int_all_dag_relationships` отдаёт весь граф строками, и по ней пишутся собственные правила обычным SQL.
    - Про исключения — важно.
    - Если нарушение осознанное, оно оформляется строкой в seed-е, и правило !!продолжает действовать для всех остальных моделей!!, а не отключается целиком.

    **Практический смысл:**
    - Рядом стоят ещё три инструмента, и они закрывают разное.
    - **dbt-score** (pip, не dbt-пакет) оценивает метаданные модели по правилам и выдаёт балл 0–10 — на этом строят гейт «описания и владельцы обязательны».
    - **elementary** ловит аномалии объёма и свежести и держит историю прогонов.
    - **audit_helper** сравнивает старую и новую версию витрины — это ровно то, что нужно после рефакторинга признака.

    **Осторожно:**
    - Ставить evaluator на зрелый проект без подготовки — значит получить триста нарушений и закрыть вкладку.
    - Правильный ход — включить одну группу правил, починить, включить следующую.

    **Переход:**
    - ~~«Ещё один инструмент отладки, про который вспоминают в три часа ночи, — логи».~~
- kind: content
  id: 061g-logirovanie-v-dbt
  title: '📝 Логирование в dbt'
  bullets:
  - 'Пишется в stdout и в файл logs/dbt.log — путь задаётся --log-path или DBT_LOG_PATH'
  - 'Форматы text · debug · json, отдельно для консоли (--log-format) и файла (--log-format-file)'
  - 'Уровни debug|info|warn|error|none; -d включает DEBUG в консоли'
  - 'JSON-события несут info и data, а также node_info: имя модели, статус, материализация'
  - 'Переменные окружения с префиксом DBT_ENV_CUSTOM_ENV_ автоматически едут в info.extra'
  - 'SQL при отладке смотрим в target/compiled и target/run, все запросы — в logs/dbt.log'
  - 'Чистый вывод для автоматизации: dbt ls --quiet или --log-level warn'
  materials:
  - label: About logs
    url: https://docs.getdbt.com/reference/global-configs/logs
  - label: Events and logs
    url: https://docs.getdbt.com/reference/events-logging
  code_caption: логи как источник данных, а не как простыня в терминале
  code_lang: bash
  code: |2
    # человеку в консоль, машине в файл
    dbt build --log-format text \
              --log-format-file json \
              --log-level info --log-level-file debug \
              --log-path logs/ci

    # разметить прогон, чтобы найти его в json-логах
    export DBT_ENV_CUSTOM_ENV_run_id=$CI_PIPELINE_ID
    export DBT_ENV_CUSTOM_ENV_triggered_by=airflow
    # → попадёт в info.extra каждого события

    # что упало и сколько шло — без чтения простыни
    jq -r 'select(.info.name=="LogModelResult")
           | [.data.node_info.node_name,
              .data.status,
              .data.node_info.node_started_at] | @tsv' \
       logs/ci/dbt.log

    # чистый список моделей для скрипта
    dbt ls --select tag:features --quiet
  notes: |2
    [130:54–132:54 · ~2 мин] **Главное:**
    - Логи dbt — это !!структурированные события, а не текст!!.
    - Как только вы включаете json, прогон становится данными, по которым можно строить дашборд.

    **Разбор кода:**
    - Четыре блока.
    - Первый — разные форматы для человека и для машины.
    - В консоль идёт читаемый `text`, в файл — `json` с уровнем `debug`.
    - Это единственный способ одновременно нормально смотреть за сборкой и иметь полный след для разбора.
    - Второй — !!`DBT_ENV_CUSTOM_ENV_*`!!.
    - Любая переменная окружения с этим префиксом автоматически попадает в `info.extra` каждого события.
    - Отсюда получается связь между прогоном dbt и запуском в оркестраторе: положили туда id пайплайна — и любое падение теперь трассируется до конкретного DAG-рана.
    - Третий — `jq` по json-логу: имя модели, статус, время старта.
    - То же самое, но без ручного чтения.
    - Четвёртый — про автоматизацию: у `dbt ls` с версии 1.5 уровень по умолчанию `INFO`, и в скрипт приезжает шапка.
    - Лечится `--quiet` или `--log-level warn`.

    **Практический смысл:**
    - Три места, куда смотреть при разборе падения.
    - `target/compiled/` — что получилось из шаблона.
    - `target/run/` — что именно ушло в базу вместе с DDL.
    - `logs/dbt.log` — все запросы и ответы движка.
    - В таком порядке.

    **Осторожно:**
    - `--log-level debug` пишет в лог полные тексты запросов.
    - На проде это и объём, и !!возможная утечка значений!! в логи — уровень для файла выбирают осознанно.

    **Переход:**
    - ~~«Ещё несколько возможностей, которые редко попадают в базовый рассказ, но регулярно нужны».~~
- kind: content
