    - Владелец, тип признака, список моделей-потребителей.
    - Когда через полгода кто-то захочет поменять эту колонку, эти три строки скажут, кого предупредить.

    **Осторожно:**
    - `dbt docs` — это сайт по метаданным проекта, а не корпоративный data catalog.
    - Не продавайте его как замену каталогу.

