  notes: |2
    [16:18–18:18 · ~2 мин] **Главное:**
    - !!Табличные, детерминированные и массовые преобразования выносим из ad-hoc pandas в версионируемые SQL-модели; Python оставляем там, где он незаменим!!.

    **TAKEAWAY TO REPEAT:**
    - dbt не заменяет Python; он забирает из Python тот transformation code, который лучше выражается как декларативные операции над таблицами.

    **Рассказ:**
    - Проговорить принцип дословно, он один из двух-трёх, которые студент должен унести.
    - Дальше показать колонки: слева — то, что база делает лучше и дешевле, справа — то, ради чего Python и существует.

    **Для MLE:**
    - Это не про вкус.
    - Перенос агрегации в warehouse убирает выгрузку гигабайтов на ноутбук, даёт lineage и делает расчёт воспроизводимым для инференса.

    **Пример:**
    - В Olist сборка `mart_delivery_features` — это join шести таблиц и агрегации.
    - В pandas это выгрузка 100k заказов и 112k позиций; в dbt — один инкрементальный SELECT.

    **Осторожно:**
    - !!Не утверждать «SQL всегда лучше Python»!!.
    - Градиентный бустинг в SQL не пишут.
    - Речь только о слое подготовки данных.

    **Переход:**
    - ~~«Разберём это сравнение по критериям — по каким именно свойствам ad-hoc скрипт проигрывает».~~
