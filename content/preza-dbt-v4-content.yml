    - Для крупных облачных хранилищ есть официальные, __доверенные (Trusted)__ адаптеры.

    **Разбор:**
    - Для многих других, включая **ClickHouse** и **DuckDB**, — качественные **community**-адаптеры.
    - Ставится нужный адаптер отдельным пакетом (**dbt-postgres**, **dbt-clickhouse**…), и !!один и тот же проект в разумных пределах переносим между платформами!!.
- kind: content
  id: 906-makrosy-v-proekte
  title: 'Макросы в проекте: диспетчеризация и границы'
  materials:
  - label: adapter.dispatch
    url: https://docs.getdbt.com/reference/dbt-jinja-functions/dispatch
  code_caption: macros/date_diff.sql — один вызов, разные СУБД
  code: |
    {% macro date_diff_days(a, b) %}
      {{ return(adapter.dispatch('date_diff_days')(a, b)) }}
    {% endmacro %}

    {% macro default__date_diff_days(a, b) %}
      datediff('day', {{ a }}, {{ b }})
    {% endmacro %}

    {% macro clickhouse__date_diff_days(a, b) %}
      dateDiff('day', {{ a }}, {{ b }})
    {% endmacro %}
  bullets:
  - Макросы живут в macros/ и доступны всему проекту без импортов
  - 'adapter.dispatch выбирает реализацию по адаптеру: default__ и clickhouse__'
  - Так один и тот же проект компилируется под несколько СУБД
  - Макросы описываются в YAML наравне с моделями — иначе их никто не найдёт
  - 'Граница простая: макрос ради двух строк вредит читаемости больше, чем помогает'
  notes: |2
    **Главное:**
    - Три вещи, которые отличают проектные макросы от случайных вставок.
    - Первое — **место**: каталог `macros/`, откуда они видны всему проекту без импортов; пакеты (`dbt_utils.star`) вызываются с префиксом, и префикс здесь полезен — по нему видно, чей код исполняется.

    **Разбор:**
    - Второе — **диспетчеризация**.
    - `adapter.dispatch` выбирает реализацию по текущему адаптеру: `default__` работает везде, `clickhouse__` подменяет её на ClickHouse.
    - Это тот самый механизм, которым пакеты добиваются переносимости, и он же нужен вам, если проект компилируется под несколько хранилищ.
    - Ровно его требует настроить `dbt_project_evaluator` — блок `dispatch`, который мы видели на слайде про него.

    **Осторожно:**
    - Третье — **описание**.
    - Макрос без документации в YAML не найдёт никто, включая вас через полгода; он просто будет написан заново рядом.
    - И честная граница: !!макрос оправдан, когда логика повторяется и меняется вместе!!.
    - ~~Если это две строки в одном месте — оставьте SQL: скомпилированный текст читать проще, чем цепочку из четырёх макросов, каждый из которых вызывает следующий.~~
- kind: content
  id: 909-data-vault-i-automatedv
  title: Data Vault и AutomateDV
  materials:
  - label: AutomateDV
    url: https://automate-dv.readthedocs.io/en/latest/macros/
  code_caption: models/vault/hub_customer.sql
  code: |
    {{ config(materialized='incremental') }}

    {{ automate_dv.hub(
         src_pk='CUSTOMER_HK',
         src_nk='CUSTOMER_ID',
         src_ldts='LOAD_DATETIME',
         src_source='RECORD_SOURCE',
         source_model='stg_customer') }}

    -- SQL хаба генерируется по метаданным,
    -- руками он не пишется
  bullets:
  - Hub — бизнес-ключ, Link — связь между ключами, Satellite — атрибуты и их история
  - Новый источник добавляется рядом, а не переписывает существующие таблицы
  - AutomateDV собирает SQL по метаданным, staging считает хеш-ключи и hashdiff
  - 'Satellite обычно incremental: история пишется вставками, без обновлений'
  - Цена подхода — много таблиц и обязательный слой витрин поверх для BI
  notes: |2
    **Главное:**
    - **Data Vault** решает конкретную боль: источников много, они меняются, а переделывать схему каждый раз дорого.
    - Модель раскладывается на три вида таблиц — **Hub** (бизнес-ключ), **Link** (связь) и **Satellite** (атрибуты с историей).
    - Ключевое свойство: новый источник !!добавляется рядом новой сателлит-таблицей!!, а существующие не переписываются, и грузиться всё это может параллельно.

    **Разбор:**
    - Руками такой SQL никто не пишет.
    - **AutomateDV** (бывший dbtVault) генерирует его по метаданным: в staging-слое считаются хеш-ключи и `hashdiff`, а модель хаба или сателлита — это вызов макроса с описанием полей.
    - Сателлиты обычно `incremental`, потому что история пишется __вставками, а не обновлениями__.

    **Осторожно:**
    - Честно про цену.
    - Таблиц становится в разы больше, читать их напрямую невозможно, поэтому **поверх обязательно нужен слой витрин** (тот самый Kimball с фактами и измерениями) — иначе BI просто не поедет.
    - ~~Поэтому Data Vault оправдан там, где источников много и они живут своей жизнью; для одного продуктового источника это оверинжиниринг.~~
- kind: content
  id: 910-prava-dostupa-v-dbt
  title: 'Права доступа: что делает dbt, а что DBA'
  materials:
  - label: grants
    url: https://docs.getdbt.com/reference/resource-configs/grants
  code_caption: dbt_project.yml — гранты как конфиг, а не post-hook
  code: |
    models:
      my_project:
        marts:
          +grants:
            select: ['analyst', 'bi_service']

    # без плюса — список заменяет существующий
    # с плюсом (+select) — добавляет к нему
    # применяется после сборки каждой модели
  bullets:
  - 'grants — структурированный конфиг: dbt выдаёт права сам после сборки модели'
  - Плюс перед привилегией добавляет получателей, без плюса — заменяет список
  - На sources, схемы и сам кластер прав dbt не выдаёт — это остаётся за DBA
  - 'Роли разделяем: dev пишет в свою схему, прод-роль ходит только в прод'
  - Пароли и ключи — через env_var в profiles.yml, а не строкой в репозитории
  notes: |2
    **Главное:**
    - До версии 1.2 права раздавали `post-hook` с самописным `GRANT`.
    - Теперь есть **конфиг `grants`**: вы объявляете, кому что можно, а dbt !!сам применяет права после сборки модели!! — на нужном диалекте и без ручного SQL.
    - Работает на моделях, seed-ах и снапшотах, объявляется в `dbt_project.yml`, в YAML-свойствах или прямо в модели.

    **Осторожно:**
    - Одна деталь ломает больше всего сборок: **плюс перед привилегией**.
    - `select:` — заменить список получателей целиком, `+select:` — добавить к унаследованному.
    - Перепутали — и вы молча отобрали доступ у половины BI.

    **Практический смысл:**
    - Важнее понять границу. dbt управляет правами __только на то, что создал сам__.
    - Доступ к сырым источникам, права на схемы, роли и пользователи в ClickHouse или Snowflake — это по-прежнему **работа DBA**, и dbt туда не лезет.
    - Практическое правило: у разработчика своя схема и своя роль, у прода — отдельная, с записью только в прод.
    - ~~А пароли и ключи в `profiles.yml` подставляются через `env_var`: профиль в репозитории должен быть безопасен для чтения любым, у кого есть доступ к коду.~~
- kind: content
  id: 911-pakety-versii-i-riski
  title: 'Пакеты: версии, обновление и риски'
  materials:
  - label: packages.yml
    url: https://docs.getdbt.com/docs/build/packages
  - label: dbt deps
    url: https://docs.getdbt.com/reference/commands/deps
  code_caption: packages.yml — версии пинятся, dbt_packages не коммитим
  code: |
    packages:
      - package: dbt-labs/dbt_utils
        version: [">=1.3.0", "<2.0.0"]

      - package: metaplane/dbt_expectations
        version: 0.10.4

      - git: https://github.com/org/dbt-internal.git
        revision: v1.2.0      # тег, а не ветка

    # dbt deps  -> dbt_packages/  (в .gitignore)
    # package-lock.yml коммитим: он фиксирует,
    # что реально скачалось
  bullets:
  - Версия пинится диапазоном или тегом — «последняя» ломает сборку в чужой день
  - package-lock.yml коммитим, каталог dbt_packages/ — нет
  - Пакет — это чужой код в вашем проекте, его макросы могут переопределить ваши
  - Транзитивные зависимости конфликтуют по версиям, dbt deps скажет об этом сразу
  - Обновление пакета — отдельный MR с прогоном тестов, а не «заодно с фичей»
  notes: |2
    **Главное:**
    - Пакеты — это **зависимости**, и обращаться с ними надо как с зависимостями кода.
    - Версию всегда пиньте: диапазоном (`>=1.3.0, <2.0.0`) или точным значением; для приватных пакетов из git указывайте __тег, а не ветку__, иначе сборка меняется в тот день, когда кто-то запушил в main чужого репозитория.
    - С dbt 1.7 рядом появляется `package-lock.yml` — !!его коммитят, потому что он фиксирует то, что скачалось на самом деле!!, а сам каталог `dbt_packages/` в git не хранят: он воспроизводится командой `dbt deps`.

    **Осторожно:**
    - Риск, о котором забывают: макросы пакета живут в **одном пространстве имён** с вашими.
    - Пакет может переопределить макрос, а два пакета — потребовать несовместимые версии третьего; `dbt deps` сообщает о конфликте, но выбор остаётся за вами.
    - Поэтому вызов через префикс (`dbt_utils.star`) — не формальность, а способ понимать, чей код исполняется.

    **Практический смысл:**
    - И организационное правило: **обновление пакета — это отдельный merge request** с прогоном тестов и чтением changelog.
    - ~~В major-версиях пакеты меняют сигнатуры макросов, и такая правка, приехавшая «заодно» с продуктовой фичей, превращает разбор падения в археологию.~~
- kind: content
  id: 911b-packages-yml-i-lock
  title: 'packages.yml и package-lock.yml'
  materials:
  - label: Package management
    url: https://docs.getdbt.com/docs/build/packages
  code_caption: 'пять источников пакета · намерение и факт коммитим оба'
  code_lang: yaml
  code: |2
    packages:
      # 1. dbt Hub — основной способ
      - package: dbt-labs/dbt_utils
        version: [">=1.4.0", "<2.0.0"]

      # 2. git — ТЕГ или коммит, не ветка
      - git: "https://github.com/org/olist_macros.git"
        revision: v0.3.1
        subdirectory: "macros"      # пакет вложен в репозиторий

      # 3. приватный репозиторий
      - private: org/internal_dbt
        provider: "github"          # github | gitlab | ado

      # 4. локальный пакет (монорепо)
      - local: ../olist_internal

      # 5. tarball по URL
      - tarball: https://.../dbt_utils/tar.gz/1.4.1
        name: dbt_utils
  notes: |2
    **Главное:**
    - `packages.yml` — это !!намерение!!, `package-lock.yml` — !!факт!!.
    - Коммитить надо оба, иначе «работает у меня» перестаёт быть проверяемым утверждением.

    **Разбор:**
    - Пять источников, и выбор между ними — не вкусовщина.

    **Hub** — основной путь, версия диапазоном: мажор фиксируем, патчи пускаем. **git** — только тег или сорокасимвольный коммит: ветка означает, что сборка меняется в тот день, когда кто-то запушил в чужой репозиторий. **private** — приватные репозитории через провайдера. **local** — монорепо, пакет рядом в дереве. **tarball** — когда пакет опубликован архивом.

    **Практический смысл:**
    - Обновление пакета — !!осознанный шаг!!: `dbt deps --upgrade`, а потом диффом смотрим, что изменилось в `package-lock.yml`.
    - Пререлизы приезжают только с `install_prerelease: true`.

    **Осторожно:**
    - Для dbt Mesh и кросс-проектных ссылок файл другой — `dependencies.yml`, и Jinja в нём не работает.

    **Когда доставать:**
    - Когда спрашивают «а как подключить свой пакет» или «почему у коллеги собралось, а у меня нет».
- kind: content
  id: 911c-selectors-yml
  title: 'Именованные селекторы: selectors.yml'
  materials:
  - label: YAML selectors
    url: https://docs.getdbt.com/reference/node-selection/yaml-selectors
  code_caption: 'selectors.yml в корне проекта, рядом с dbt_project.yml'
  code_lang: yaml
  code: |2
    selectors:
      - name: nightly
        description: "Ночная сборка без ML-витрин"
        default: true               # для голого dbt build
        definition:
          union:
            - method: path
              value: models
            - exclude:
                - method: tag
                  value: ml_heavy

      - name: ci_slim
        definition:
          method: state
          value: modified
          children: true            # = state:modified+

    # ── как вызывать ───────────────────────────────────────────
    dbt run -s tag:nightly          # выражение
    dbt run --selector nightly      # имя  (dbt <= 1.11)
    dbt run -s selector:nightly     # имя  (dbt 1.12+)
  notes: |2
    **Главное:**
    - Выражение в командной строке одноразовое; `selectors.yml` — то же самое, но !!с именем, в git и под ревью!!.

    **Разбор:**
    - Файл лежит в корне проекта, рядом с `dbt_project.yml`.
    - `nightly` собирает всё из `models`, кроме помеченного тегом `ml_heavy`; `default: true` означает, что голый `dbt build` возьмёт именно его.
    - `ci_slim` — тот самый `state:modified+` из блока про Slim CI, только под именем.

    **Практический смысл:**
    - То, что гоняется ночью, — !!тоже артефакт в git!!.
    - Оркестратор вызывает `--selector nightly`, а не список из сорока имён моделей, и изменение состава ночной сборки проходит через pull request, а не через правку DAG-а.

    **Осторожно:**
    - `-s` / `--select` принимает ВЫРАЖЕНИЕ, а `--selector` — ИМЯ из файла.
    - Флаги разные, и их постоянно путают.
    - В dbt 1.12 появился третий способ — `-s selector:nightly`, — который снимает путаницу, но старую форму не отменяет.

    **Когда доставать:**
    - На вопрос «как не тащить список моделей в оркестратор» и рядом со слайдом про селекторы графа.
- kind: table
  id: 912-esche-pakety-pod-zadachu
  title: Ещё пакеты и утилиты под задачу
  materials:
  - label: dbt-score (Picnic)
    url: https://github.com/PicnicSupermarket/dbt-score
  - label: dbt-colibri
    url: https://github.com/b-ned/dbt-colibri
  - label: dbt_profiler
    url: https://hub.getdbt.com/data-mie/dbt_profiler/latest/
  table:
    headers:
    - Инструмент
    - Что делает
    - Зачем на практике
    rows:
    - - dbt_profiler
      - 'профиль колонок: NULL, уникальность, min/max'
      - быстрый аудит незнакомого источника
    - - dbt_external_tables
      - файлы в S3/GCS как sources
      - внешний слой без ручного DDL
    - - dbt_artifacts
      - метаданные прогонов в витрины
      - история времени, статусов и падений
    - - dbt-score (pip)
      - линтер метаданных, оценка 0–10
      - гейт на описания, тесты и владельцев
    - - dbt-colibri (pip)
      - column-level lineage из артефактов
      - lineage по колонкам без платформы вендора
    col_ratios:
    - 3
    - 5
    - 4
  notes: |2
    **Главное:**
    - Второй эшелон — то, что ставят под конкретную задачу, а не в каждый проект.
    - **dbt_profiler** считает профиль колонок (доля NULL, уникальность, границы) и умеет класть его в документацию: !!это первое, что делаешь с незнакомым источником!!.
    - **dbt_external_tables** описывает файлы в объектном хранилище как обычные `sources`, избавляя от ручного DDL.
    - **dbt_artifacts** складывает метаданные прогонов в витрины — из них потом растут дашборды «сколько шла сборка» и «что падает чаще всего».

    **Осторожно:**
    - Обратите внимание на пометку **pip** у последних двух.
    - `dbt-score` и `dbt-colibri` — __не dbt-пакеты__: они не ставятся через `packages.yml` и `dbt deps`, а живут как отдельные python-утилиты рядом с проектом и читают его артефакты.
    - Это другой способ подключения и другое место в CI.
    - **dbt-score** от Picnic оценивает метаданные модели по правилам и выдаёт балл 0–10 — на этом удобно строить гейт «описания и владельцы обязательны».
    - **dbt-colibri** собирает column-level lineage из уже существующих артефактов и рисует локальный дашборд.
    - ~~Получается тот самый lineage по колонкам, за который обычно платят платформе, — ценой ещё одного шага в пайплайне.~~
- kind: content
  id: 913-pakety-v-ci-i-prode
  title: 'Пакеты в CI и проде: воспроизводимость'
  materials:
  - label: dbt deps
    url: https://docs.getdbt.com/reference/commands/deps
  code_caption: .gitlab-ci.yml — deps как шаг сборки, а не ручное действие
  code: |
    dbt_build:
      image: python:3.12
      cache:                     # не тянем пакеты каждый раз
        key: dbt-deps-$CI_COMMIT_REF_SLUG
        paths: [dbt_packages/]
      before_script:
        - pip install -r requirements.txt
        - dbt deps               # читает package-lock.yml
      script:
        - dbt build --target ci

    # приватный пакет: токен из переменной CI,
    # в packages.yml — только ссылка и тег
  bullets:
  - dbt deps — шаг пайплайна, а не то, что каждый делает у себя руками
  - Кэш dbt_packages экономит минуты, package-lock.yml гарантирует те же версии
  - Приватный пакет тянут по git+тегу с токеном из переменной CI, не из URL в репозитории
  - В docker-образ для прода пакеты кладут на этапе сборки, а не в рантайме
  - Обновление пакетов — отдельный MR со своим прогоном, а не сюрприз в ночном ране
  notes: |2
    **Главное:**
    - Пакеты ломают сборку не в разработке, а в CI и проде — потому что там !!никто не помнит, что нужно выполнить `dbt deps`!!.
    - Правило простое: **deps — это шаг пайплайна**.
    - Рядом стоят две оптимизации: кэш каталога `dbt_packages` (минуты на каждом прогоне) и `package-lock.yml`, который гарантирует, что в CI и на ноутбуке приехало __одно и то же__.

    **Осторожно:**
    - Приватные пакеты — отдельная тема безопасности.
    - В `packages.yml` хранится только ссылка и тег; токен приезжает **переменной окружения CI** и никогда не коммитится в URL.
    - Это ровно тот случай, когда «работает и так» означает утечку в истории git.

    **Практический смысл:**
    - В проде порядок тот же, но жёстче: пакеты ставятся **на этапе сборки образа**, чтобы контейнер не ходил в интернет в рантайме, а обновление пакета оформляется __отдельным merge request__ со своим прогоном тестов.
    - ~~Иначе разбор ночного падения начинается с вопроса «а что у нас вообще изменилось», на который нет ответа.~~
- kind: content
  id: 914-snapshots-i-docs-istoriya
  title: 'Snapshots и docs: история + смысл поля'
  code_caption: snapshots/customers_scd.sql · models/_docs.sql
  code: |
    -- snapshot: новая версия строки при смене status
    {% snapshot customers_scd %}
      {{ config(strategy='check', unique_key='id',
                check_cols=['name', 'status']) }}
      select id, name, status, updated_at
      from {{ source('raw', 'customers') }}
    {% endsnapshot %}

    -- docs-блок переиспользуется в schema.yml и dbt docs
    {% docs stg_orders__amount %}
    Сумма заказа после скидок и налогов.
    {% enddocs %}
  bullets:
  - 'Snapshot реализует SCD2: сохраняет версии бизнес-сущности во времени'
  - unique_key определяет объект, а check_cols — что считать изменением
  - dbt добавляет интервалы валидности, чтобы запросить «состояние на дату»
  - Docs-блок хранит одно описание и подставляется в несколько мест
  - Документация становится частью ревьюируемого кода
  notes: |2
    **Главное:**
    - Snapshot — это механизм !!историзации SCD2!! для случаев, когда источник хранит только актуальную строку.
    - Здесь id определяет клиента, а изменение name или status создаёт новую версию.
    - После запуска можно спросить: «какой статус был у клиента на конец прошлого месяца?» — и ответить без отдельной самописной таблицы истории.

    **Осторожно:**
    - Важно согласовать список **check_cols**: слишком широкий даёт лишние версии от технических полей, слишком узкий пропускает бизнес-изменения.
    - __Snapshots не заменяют CDC автоматически__; это удобный dbt-слой, когда семантика и объём данных подходят.

    **Разбор:**
    - Блок **{% docs %}** решает другую задачу — единый смысл атрибута.
    - Его можно вставить в schema.yml и получить в **dbt docs generate**, поэтому описание меняется вместе с моделью в том же MR.
    - ~~Это особенно ценно для метрик и финансовых полей, где «сумма» без правил расчёта мало что означает.~~
- kind: content
  id: 915-materialized-views-clickhouse
  title: 'Материализованные представления: ClickHouse'
  materials:
  - label: dbt-clickhouse MV
    url: https://clickhouse.com/docs/integrations/dbt/materialization-materialized-view
  - label: Incremental MV
    url: https://clickhouse.com/docs/materialized-view/incremental-materialized-view
  code_caption: models/marts/mv_visits_daily.sql
  code: |
    {{ config(
        materialized='materialized_view',
        engine='AggregatingMergeTree()',
        order_by='(day, country)',
        catchup=True) }}

    select toDate(ts) as day, country,
           countState()       as visits,
           uniqState(user_id) as users
    from {{ source('raw', 'events') }}
    group by day, country
  bullets:
  - 'В ClickHouse MV — не кэш, а триггер на вставку: агрегат считается в момент INSERT'
  - Приёмник обычно AggregatingMergeTree, и GROUP BY совпадает с его ORDER BY
  - catchup=True сначала догоняет историю, потом создаёт саму MV
  - Refreshable MV пересчитывает всё по расписанию — можно JOIN, но свежесть ниже
  - 'В dbt это materialized_view: одна модель описывает и MV, и таблицу-приёмник'
  notes: |2
    **Главное:**
    - Главное недоразумение: в ClickHouse **материализованное представление — это не кэш запроса**, а !!триггер на вставку!!.
    - Данные приезжают в исходную таблицу, MV в этот момент считает свою часть агрегата и кладёт результат в таблицу-приёмник.
    - Читаете вы приёмник, и он всегда актуален по мере вставок.

    **Разбор:**
    - Отсюда два правила.
    - Приёмник берут **AggregatingMergeTree** (или SummingMergeTree), а состояния пишут через `-State`-функции — `countState`, `uniqState`; при чтении их сворачивают `-Merge`.
    - И `GROUP BY` в MV должен __совпадать с `ORDER BY`__ приёмника, иначе строки не схлопнутся и таблица распухнет.

    **Практический смысл:**
    - В dbt это отдельная материализация `materialized_view` адаптера ClickHouse: одна модель описывает и представление, и приёмник, а `catchup=True` догоняет историю перед созданием.
    - Отдельно стоят **refreshable MV** — они периодически пересчитывают весь результат, поэтому поддерживают JOIN-ы.
    - ~~Выбор простой: инкрементальная MV — когда нужна свежесть на вставке; refreshable — когда нужны сложные соединения и можно потерпеть задержку.~~
- kind: content
  id: 916-mikrobatching
  title: 'Микробатчинг: инкремент окнами времени'
  materials:
  - label: microbatch
    url: https://docs.getdbt.com/docs/build/incremental-microbatch
  code_caption: models/marts/fct_orders.sql
  code: |
    {{ config(
        materialized='incremental',
        incremental_strategy='microbatch',
        event_time='order_date',
        batch_size='day',
        lookback=3,
        begin='2026-01-01') }}

    select * from {{ ref('stg_orders') }}
    -- фильтр по окну dbt подставит сам:
    -- is_incremental() здесь не нужен
  bullets:
  - Одна большая дельта разбивается на независимые окна по времени
  - batch_size — hour, day (по умолчанию), month или year
  - lookback пересчитывает несколько прошлых окон — для опоздавших событий
  - Упал один батч — перезапускается он, а не весь бэкфилл
  - dbt сам фильтрует upstream-модели, у которых объявлен event_time
  notes: |2
    **Главное:**
    - Обычная инкрементальная модель делает **один большой запрос на всю дельту**.
    - Пока данных мало — нормально; на бэкфилле за год это один запрос на миллиарды строк, который !!падает по памяти на девяносто восьмом проценте!! и начинается сначала.

    **Разбор:**
    - Стратегия **microbatch** (dbt 1.9) переворачивает это: модель объявляет `event_time`, `batch_size` и начало истории, а dbt сам режет период на окна и выполняет __по запросу на окно__.
    - Предикат подставляется автоматически — писать `is_incremental()` и вручную считать `max(order_date)` больше не нужно.

    **Практический смысл:**
    - Два следствия, ради которых всё затевалось.
    - Первое: **упавший батч перезапускается отдельно**, остальные остаются на месте.
    - Второе: `lookback` заставляет пересчитывать несколько прошлых окон, что закрывает вечную проблему __опоздавших событий__.
    - ~~Плюс dbt автоматически подрезает upstream-модели, у которых тоже объявлен event_time, — граф перестаёт читать лишнее.~~
- kind: content
  id: 917-dbt-i-potokovye-dannye
  title: 'dbt и потоковые данные: где проходит граница'
  materials:
  - label: dbt-risingwave
    url: https://github.com/risingwavelabs/dbt-risingwave
  code_caption: dbt-risingwave — модель как потоковая MV
  code: |
    {{ config(materialized='materialized_view') }}

    select window_start,
           count(*) as orders
    from tumble({{ source('kafka','orders') }},
                order_ts,
                interval '1 minute')
    group by window_start

    -- обновляется само, dbt run не нужен
  bullets:
  - dbt описывает SQL-преобразование; непрерывность обеспечивает движок, а не dbt run
  - 'RisingWave: materialized_view вместо incremental, отдельная материализация sink'
  - Потоковая MV пересчитывается сама — запрос всегда видит свежий результат
  - В Spark и Databricks роль такой модели играют streaming tables поверх Structured Streaming
  - Задача dbt здесь — версии, тесты и доки для потоковых определений
  notes: |2
    **Главное:**
    - Вопрос «умеет ли dbt в стриминг» поставлен неточно. dbt — это **генератор SQL и оркестратор графа**, у него нет собственного рантайма; !!непрерывность даёт движок под ним!!, а dbt описывает, что именно считать.

    **Разбор:**
    - Практически это выглядит так.
    - В **RisingWave** модель материализуется как `materialized_view` — потоковая MV, которая обновляется сама по мере прихода событий; `incremental` там просто не нужен, а для выгрузки наружу есть материализация `sink`.
    - В экосистеме Spark ту же роль играют **streaming tables** поверх Structured Streaming.
    - В обоих случаях `dbt run` — это __деплой определения__, а не запуск обработки каждую минуту.

    **Практический смысл:**
    - Что остаётся за dbt и ради чего его сюда тащат: потоковые определения попадают в git, получают **тесты, описания и lineage** наравне с батчевыми моделями.
    - ~~Граница проходит по свежести: секунды — стриминговый движок, минуты и часы — микробатчинг из предыдущего слайда, и это дешевле в эксплуатации.~~
- kind: content
  id: 918-semantic-layer-metricflow
  title: Semantic Layer / MetricFlow
  image: image62.png
  materials:
  - label: About MetricFlow
    url: https://docs.getdbt.com/docs/build/about-metricflow
  - label: MetricFlow commands
    url: https://docs.getdbt.com/docs/build/metricflow-commands
  bullets:
  - Единое определение метрик — один раз, в коде
  - MetricFlow генерирует корректный SQL по запросу метрики
  - Убирает расхождения метрик между дашбордами
  - Метрики доступны из BI, ноутбуков и через API
  - Консистентность и переиспользование бизнес-логики
  notes: |2
    **Главное:**
    - Больная тема любой аналитики — когда __«выручка» в двух дашбордах считается по-разному__.
    - !!Semantic Layer решает это: метрика определяется один раз в коде!!, а не переписывается в каждом BI-инструменте.

    **Разбор:**
    - Движок **MetricFlow** сам генерирует корректный **SQL** под каждый запрос.
    - Метрики доступны из **BI**, ноутбуков и по **API** — и везде считаются **одинаково**.
    - Это особенно важно, когда одна и та же метрика используется в отчётах, алертах и data products.

    **Практический смысл:**
    - Практический смысл для команды — __одна формула, один владелец, один контур тестирования__.
    - ~~Консистентность и переиспользование бизнес-логики.~~
- kind: content
  id: 920-dbt-state-i-dbt-wizard
  title: 'Куда идёт dbt: State и агент Wizard'
  materials:
  - label: ADE-bench
    url: https://www.getdbt.com/resources/webinars/analytics-data-engineer-bench
  - label: dbt Core v2 roadmap
    url: https://github.com/dbt-labs/dbt-core/blob/main/docs/roadmap/2026-06-announcing-v2.md
  bullets:
  - 'dbt State: сравнение с прошлым прогоном стало частью движка, а не трюком для CI'
  - На нём держатся slim CI, отложенные ссылки (defer) и повторные запуски
  - 'dbt Wizard — агент под цикл аналитической инженерии: разобраться, изменить, проверить'
  - По заявлению dbt Labs — 76 % на ADE-bench, бенчмарке задач дата-инженерии
  - Parquet-артефакты v2 агент читает запросом, а не разбором manifest.json
  notes: |2
    **Главное:**
    - Два анонса, которые стоит держать в голове.
    - Первый — **dbt State**: механика «сравнить проект с прошлым состоянием» перестала быть __трюком для CI__ и стала штатной частью движка.
    - Практически это то же самое, что мы разобрали на слайде про slim CI, только быстрее и доступно везде: на состоянии держатся выбор изменённого, `defer` и повторные запуски после падения.

    **Разбор:**
    - Второй — **dbt Wizard**, агент, заточенный не под «напиши SQL», а под весь цикл аналитической инженерии: разобраться в чужом проекте, внести правку, проверить результат.
    - Для измерения dbt Labs сделали **ADE-bench** — бенчмарк задач аналитической и дата-инженерии; по их публикации Wizard берёт !!76 % на наборе из 75 задач!!.
    - Цифра вендорская, и относиться к ней стоит как к вендорской, но сам бенчмарк — полезная попытка мерить агентов на реальной работе, а не на олимпиадных задачках.

    **Практический смысл:**
    - Техническая деталь, которая связывает всё это: **Parquet-артефакты** из v2 агент читает __запросом__.
    - ~~Именно поэтому «дать модели контекст проекта» перестаёт означать «скормить ей гигантский manifest.json» — и почему MCP и агентные скиллы вокруг dbt стали работать заметно лучше.~~
- kind: table
  id: 921-jinja-swot
  title: 'Jinja: SWOT шаблонного подхода'
  materials:
  - label: Jinja в dbt
    url: https://docs.getdbt.com/docs/build/jinja-macros
  table:
    headers:
    - Квадрант
    - Что за этим стоит
    rows:
    - - S — сильные стороны
      - работает с любым диалектом и любым движком именно потому, что ничего о них не знает; порог входа
        — обычный SQL плюс подстановка; макросы дают DRY и переносимость через dispatch; на Jinja построена
        вся экосистема пакетов dbt
    - - W — слабые стороны
      - 'это подстановка текста: шаблон не знает ни колонок, ни типов, ни границ выражения; ошибку видно
        только в скомпилированном SQL; вложенные макросы быстро перестают читаться; lineage по колонкам
        из текста не выводится'
    - - O — возможности
      - генерация по метаданным — пивоты, AutomateDV, staging из codegen; один проект компилируется под
        несколько СУБД; правила качества и структура проекта описываются один раз
    - - T — угрозы
      - логика уезжает в шаблоны, и проект становится программой, которая печатает SQL; отладка дорожает
        быстрее, чем растёт польза; движки нового поколения строят lineage из разобранного SQL, и текстовый
        слой мешает — включая сам dbt в Fusion
    col_ratios:
    - 2
    - 8
  notes: |2
    **Главное:**
    - Соберём разговор про Jinja в один честный SWOT.
    - **Сильная сторона и слабая — это одно и то же свойство**, посмотренное с разных сторон: Jinja !!ничего не знает о SQL!!.
    - Именно поэтому он работает с любым диалектом и любым движком, и именно поэтому он не может подсказать вам ни колонку, ни тип, ни то, что вы разорвали выражение пополам.

    **Разбор:**
    - **Возможности** — там, где логика повторяется и описывается метаданными: пивот по значениям из данных, генерация staging через codegen, хабы и сателлиты AutomateDV, единый проект под несколько СУБД.
    - Всё это без шаблонов пришлось бы писать руками или внешним генератором.

    **Осторожно:**
    - **Угрозы** начинаются, когда шаблонов становится больше, чем SQL.
    - Проект превращается в __программу, которая печатает SQL__: отладка идёт через `target/compiled`, а не через чтение модели, и цена каждого следующего макроса растёт.
    - ~~Второй, более медленный риск — направление индустрии: чтобы строить lineage на уровне колонок, движку нужно разбирать SQL, а не склеивать строки. Об этом следующий слайд.~~
- kind: content
  id: 922-pochemu-drugie-uhodyat-ot-shablonov
  title: Почему другие движки уходят от шаблонов
  materials:
  - label: SQLMesh macros
    url: https://sqlmesh.readthedocs.io/en/stable/concepts/macros/sqlmesh_macros/
  - label: Spark Declarative Pipelines
    url: https://spark.apache.org/docs/latest/declarative-pipelines-programming-guide.html
  code_caption: одно ограничение — текстом и над разобранным SQL
  code: |
    -- dbt + Jinja: подстановка текста
    {% set cutoff = var('cutoff_days', 30) %}
    select * from {{ ref('orders') }}
    where order_date >= current_date - {{ cutoff }}

    -- SQLMesh: макрос над разобранным SQL
    @DEF(cutoff, 30);
    SELECT * FROM orders
    WHERE order_date >= CURRENT_DATE - @cutoff;
  bullets:
  - 'SQLMesh: макросы правят семантическое представление запроса (SQLGlot), а не текст'
  - В его документации претензия прямая — шаблонизатор намеренно ничего не знает о языке, который шаблонизирует
  - 'Spark SDP: датасеты объявлены кодом (.py или .sql), таблицы в цикле — обычный Python, шаблонного
    слоя нет'
  - 'Bruin — контрпример: он как раз на Jinja, со своими start_date/end_date, циклами и условиями'
  - 'Уходят не «все», а те, кто строит lineage по колонкам: для этого SQL надо разбирать'
  notes: |2
    **Главное:**
    - Сначала поправка к расхожему тезису: **«все уходят от Jinja» — миф**.
    - Bruin, один из самых заметных новых инструментов, построен ровно на нём: переменные `start_date` и `end_date`, циклы, условия — знакомая картина.
    - Уходят не все, а те, кому мешает конкретное свойство.

    **Разбор:**
    - Свойство это — **слепота к SQL**.
    - У SQLMesh макросы правят !!семантическое представление запроса!!, разобранное библиотекой SQLGlot, и поэтому движок сам понимает, подставить ли строковый литерал или идентификатор.
    - В документации претензия сформулирована прямо: шаблонизатор __намеренно ничего не знает о языке, который шаблонизирует__.
    - Показательно, что Jinja там при этом поддержан — его не запрещают, его понижают в статусе.
    - **Spark Declarative Pipelines** решают задачу иначе: там нет шаблонного слоя вовсе.
    - Исходники — `.py` или `.sql`, датасеты объявляются кодом через `pyspark.pipelines`, и если нужно создать двадцать похожих таблиц, это обычный питоновский цикл, а не текст с дырками.

    **Практический смысл:**
    - Общий знаменатель — **column-level lineage и анализ влияния**.
    - Чтобы сказать «эта правка ломает вот эту колонку в вон той витрине», движок обязан разобрать SQL.
    - ~~И то же самое сейчас делает сам dbt: Fusion разбирает SQL и вводит строгую спецификацию языка — та же критика, пришедшая изнутри.~~
- kind: table
  id: 923-sqlmesh-i-dbt-swot
  title: 'SQLMesh против dbt: SWOT'
  materials:
  - label: SQLMesh docs
    url: https://sqlmesh.readthedocs.io
  - label: SQLGlot
    url: https://github.com/tobymao/sqlglot
  table:
    headers:
    - Квадрант
    - Что за этим стоит
    rows:
    - - S — сильные стороны
      - разбор SQL в AST (SQLGlot) и column-level lineage; virtual environments; plan/apply с анализом
        влияния; инкрементальность и аудиты внутри модели
    - - W — слабые стороны
      - небольшая экосистема пакетов; меньше готовых рецептов и обучения; нишевый рынок найма; интеграции
        с оркестраторами менее зрелые
    - - O — возможности
      - greenfield-проекты; дешёвые preview-среды на каждый PR; запуск поверх существующего dbt-проекта
        без переписывания моделей
    - - T — угрозы
      - миграция работающего dbt без явной боли; двойной стек и раздвоение практик в команде; ставка на
        одного вендора (Tobiko Data)
    col_ratios:
    - 2
    - 8
  notes: |2
    **Главное:**
    - Раньше на этом месте было три слайда сравнения — сведём их в один честный SWOT.
    - **Сильные стороны SQLMesh технические и реальные**: он разбирает SQL в синтаксическое дерево через SQLGlot, поэтому знает !!lineage на уровне колонок!! и отличает ломающее изменение от безобидного.
    - Виртуальные среды делают «свою копию хранилища на ветку» дешёвой, а `plan` показывает влияние правки __до__ применения.

    **Осторожно:**
    - **Слабости — не в технике, а вокруг неё**: пакетов меньше, статей и курсов меньше, нанимать сложнее, интеграции менее обкатаны.
    - Именно это чаще всего и решает исход спора в команде.

    **Практический смысл:**
    - **Возможности** — там, где нет груза legacy: новый проект, дорогие preview-среды, желание получить impact analysis.
    - Причём переходить целиком не обязательно: SQLMesh умеет запускаться __поверх существующего dbt-проекта__ (следующий слайд).
    - **Угрозы** — миграция ради миграции, двойной стек, когда половина команды живёт в одном инструменте, а половина в другом, и зависимость от одного вендора.
    - ~~Практический вывод курса: на greenfield SQLMesh стоит рассматривать всерьёз, а работающий dbt-проект переносят только под конкретную боль, которую можно назвать вслух.~~
- kind: content
  id: 924-sqlmesh-poverh-dbt-proekta
  title: SQLMesh поверх существующего dbt-проекта
  materials:
  - label: SQLMesh + dbt
    url: https://sqlmesh.readthedocs.io/en/stable/integrations/dbt/
  code_caption: из корня рабочего dbt-проекта
  code: |
    pip install "sqlmesh[dbt]"

    sqlmesh init -t dbt   # читает dbt_project.yml
                          # и profiles.yml

    sqlmesh plan dev      # что изменилось и что
                          # придётся пересчитать
    sqlmesh run           # штатные прогоны

    # модели остаются dbt-моделями:
    # тот же SQL с ref() и Jinja
  bullets:
  - 'Проект не переписывается: init читает dbt_project.yml и profiles.yml'
  - Модели, seeds и пакеты (dbt deps) остаются на месте
  - dbt-тесты становятся audits; sqlmesh test — это юнит-тесты запросов
  - is_incremental() меняется на sqlmesh_incremental и временные переменные
  - 'Поддержано не всё: часть jinja-методов и отдельные настройки snapshots'
  notes: |2
    **Главное:**
    - Это ответ на главное возражение «у нас уже сто моделей на dbt».
    - SQLMesh умеет работать **как движок поверх вашего dbt-проекта**: `sqlmesh init -t dbt` из корня проекта читает `dbt_project.yml` и `profiles.yml`, забирает модели, seeds и подключения.
    - !!Переписывать SQL не нужно!! — модели остаются dbt-моделями с `ref()` и Jinja, а рядом появляется `sqlmesh.yaml` со своими настройками по умолчанию.

    **Разбор:**
    - Что меняется в терминах. dbt-тесты приезжают как **audits**; при этом слово `test` в SQLMesh занято под __юнит-тесты логики запроса__ — это разные вещи, и путаница здесь стоит дорого.
    - Окружения SQLMesh создаёт сам во время `plan`, поэтому хардкодить target в профиле не нужно: профиль указывает на прод, остальное берёт на себя движок.

    **Осторожно:**
    - Честные ограничения тоже стоит назвать.
    - Инкрементальные блоки `is_incremental()` заменяются на **sqlmesh_incremental** с предопределёнными временными переменными; часть jinja-методов (`debug`, обход `graph.nodes`) недоступна; у snapshots не поддержан `invalidate_hard_deletes=False`; типы seed-колонок иногда приходится указывать явно.
    - ~~Поэтому реалистичный сценарий — не «переезд в пятницу», а параллельный запуск на копии проекта: увидеть plan, оценить impact analysis и уже потом решать.~~
- kind: content
  id: 925-deklarativnye-transformacii
  title: 'Декларативные трансформации: ещё четыре подхода'
  materials:
  - label: Bruin overview
    url: https://getbruin.com/docs/bruin/overview.html
  - label: Spark Declarative Pipelines
    url: https://docs.databricks.com/aws/en/ldp/
  - label: Lakeflow pipelines
    url: https://docs.databricks.com/aws/en/ldp/concepts/pipelines
  - label: Snowflake Dynamic Tables guide
    url: https://docs.snowflake.com/en/user-guide/dynamic-tables/decision-guide
  bullets:
  - Bruin — один CLI для ingestion, SQL/Python assets, quality checks и lineage в repo
  - Spark Declarative Pipelines (SDP) — SQL/Python для batch и streaming-графов
  - 'Databricks Lakeflow — managed-пайплайны: flows, streaming tables, materialized views'
  - Snowflake Dynamic Tables — SELECT + TARGET_LAG; платформа сама ведёт refresh и порядок DAG
  - 'Выбор: portable dbt/SQLMesh/Bruin или нативные возможности конкретной платформы'
  notes: |2
    **Главное:**
    - Тренд шире одного dbt: команды всё чаще описывают !!желаемый набор данных и зависимости!!, а не последовательность низкоуровневых задач.
    - **Bruin** объединяет ingestion, SQL/Python-преобразования, quality checks и lineage в репозитории — полезно, когда хочется меньше разрозненных инструментов.

    **Разбор:**
    - В Spark-экосистеме **Spark Declarative Pipelines** описывает batch и streaming-пайплайны в SQL или Python.
    - Databricks **Lakeflow** — управляемая реализация этого подхода: платформа анализирует зависимости и оркестрирует flows, streaming tables и materialized views.
    - Это естественно для Delta/streaming-нагрузок, но сильнее привязывает решение к платформе.
    - В Snowflake **Dynamic Tables** позволяют определить результат SQL-запросом и TARGET_LAG; Snowflake сам поддерживает порядок refresh и, где возможно, incremental processing.
    - Для процедурной логики, точного cron или сложного MERGE остаются streams/tasks.
    - __dbt выигрывает переносимостью и экосистемой__, нативные средства — меньшим количеством операционного кода внутри своей платформы.
    - ~~Современный стек часто сочетает эти подходы, а не выбирает ровно один.~~
- kind: content
  id: 926-nuzhen-li-otdelnyy-orkestrator
  title: Нужен ли отдельный оркестратор в modern data stack?
  materials:
  - label: SQLMesh scheduler
    url: https://sqlmesh.readthedocs.io/en/stable/guides/scheduling/
  - label: Bruin overview
    url: https://getbruin.com/docs/bruin/overview.html
  - label: Lakeflow Jobs
    url: https://docs.databricks.com/aws/en/jobs/
  - label: Snowflake Dynamic Tables
    url: https://docs.snowflake.com/en/user-guide/dynamic-tables-about
  bullets:
  - 'Оркестрация не исчезает — она всё чаще встраивается в трансформер или платформу'
  - 'SQLMesh и Bruin несут свой scheduler и DAG; Databricks — Lakeflow, Snowflake — Dynamic Tables'
  - 'Внутри одного data DAG отдельный оркестратор всё чаще не нужен'
  - 'Между системами (API, ingestion, Spark, ML, алерты) он остаётся отдельным слоем'
  - 'Event-driven, ветвления, ML/LLM и несколько платформ — по-прежнему за Dagster/Airflow'
  - 'Это death of the mandatory standalone orchestrator, а не death of orchestration'
  code_lang: diagram
  code: |2
     dbt-era                  2026+
     ──────────────────       ────────────────────────────
     Airflow / Dagster        SQLMesh     scheduler + DAG
            ↓                 Bruin       ingestion + DAG
        dbt / SQL             Databricks  Lakeflow Jobs
            ↓                 Snowflake   Dynamic Tables
     склад / lakehouse                ↓
                                склад / lakehouse

     ──────────────────────────────────────────────────────
     ВНУТРИ ОДНОГО DAG    SQL ─→ deps ─→ incremental ─→ cron
            ↓             оркестрация встроена в движок
     МЕЖДУ СИСТЕМАМИ      API ─→ Spark ─→ ML ─→ dbt ─→ alerts
            ↓             Dagster / Airflow / Kestra / Prefect
  notes: |2
    **Главное:**
    - Тезис слайда: !!оркестрация не исчезает — она всё чаще встраивается в transformation engine или в саму платформу данных!!.
    - Классический стек был трёхслойным: Airflow/Dagster сверху, dbt посередине, склад снизу.
    - Новый тренд — слить верхние два слоя.

    **Разбор:**
    - **SQLMesh** — не просто альтернативный движок трансформаций: у него есть __встроенный production-планировщик__, окружения и свой DAG, поэтому внешний оркестратор для локального графа моделей ему не нужен.
    - **Bruin** идёт дальше и совмещает в одном CLI ingestion, трансформации, quality checks и расписание — то есть закрывает и ту часть, ради которой обычно и ставили Airflow.
    - **Databricks** развивает **Lakeflow Jobs** и Lakeflow Pipelines: расписание, зависимости и ретраи живут в платформе, а не в отдельном сервисе.
    - **Snowflake Dynamic Tables** сами выводят порядок обновления из зависимостей и держат свежесть по `TARGET_LAG`; для процедурной логики рядом остаются Tasks.

    **Отдельный orchestrator — нужен ли:**
    - SQLMesh pipeline — часто не нужен.
    - Bruin pipeline — часто не нужен.
    - Databricks-native стек — часто не нужен.
    - Snowflake SQL pipeline — всё реже нужен.
    - Multi-system / сложный workflow — всё ещё нужен.

    **Осторожно:**
    - Формулировать это как «смерть оркестрации» — ошибка: речь про !!смерть обязательного отдельного оркестратора!!, а не про исчезновение Airflow, Dagster или Kestra.
    - И Databricks, и Snowflake сохраняют интеграции с внешними оркестраторами — то есть это convergence и сокращение числа обязательных слоёв, а не вытеснение.

    **Где отдельный слой остаётся ценным:**
    - Гетерогенные и кросс-платформенные workflow.
    - Event-driven оркестрация.
    - Ветвления и сложный control flow.
    - ML-, LLM- и инфраструктурные нагрузки.
    - Координация нескольких независимых пайплайнов и платформ.
    - Enterprise-wide control plane.

    **Направление рынка:**
    - Было (dbt-era): трансформер плюс обязательный внешний оркестратор.
    - Стало (2026+): трансформер или платформа со встроенной оркестрацией.
    - Дальше: внешний оркестратор подключают тогда, когда этого требует сложность workflow, а не по умолчанию.

    **TAKEAWAY TO REPEAT:**
    - Для локального data DAG оркестрация становится __фичей движка__; для гетерогенной платформы она остаётся __отдельным архитектурным слоем__.
- kind: content
  id: 046b-dbt-pandas-i-spark
  title: 'Где исполняется Python: pandas и Spark'
  bullets:
  - 'pandas в dbt-модели — это данные, вытянутые из хранилища В ПАМЯТЬ платформы'
  - 'to_pandas() на витрине признаков за три года — способ убить сессию'
  - 'На Snowflake и BigQuery «pandas» — это Snowpark/BigFrames DataFrame, ленивый'
  - 'Spark (Databricks) — единственный вариант, где Python масштабируется как SQL'
  - 'PySpark-модель исполняется кластером, а не одним узлом — pandas там опция, не норма'
  - 'Правило: агрегации остаются в SQL, Python берёт только то, чего в SQL нет'
  materials:
  - label: Python models
    url: https://docs.getdbt.com/docs/build/python-models
  - label: dbt + Databricks Python
    url: https://docs.getdbt.com/reference/resource-configs/databricks-configs
  code_caption: три диалекта одной модели
  code_lang: python
  code: |2
    # Snowpark — ленивый DataFrame, считает склад
    def model(dbt, session):
        df = dbt.ref("int_order_level")
        return df.group_by("seller_id").agg(
            {"delay_days": "avg"})

    # PySpark (Databricks) — считает кластер
    def model(dbt, session):
        df = dbt.ref("int_order_level")
        return df.groupBy("seller_id").avg("delay_days")

    # pandas — ВСЁ приезжает в память одного узла
    def model(dbt, session):
        pdf = dbt.ref("int_order_level").to_pandas()
        #     ↑ вот здесь и больно
        return (pdf.groupby("seller_id")["delay_days"]
                   .mean().reset_index())
  notes: |2
    [~2 мин] **Главное:**
    - «Python-модель» — это три разные вещи в зависимости от платформы, и различает их !!где физически лежат данные в момент вычисления!!.

    **Разбор кода:**
    - Три блока делают одно и то же — среднюю просрочку по продавцу.
    - Первый, **Snowpark**: `df` — ленивый DataFrame, `group_by` превращается в SQL, считает склад.
    - Данные из хранилища не уезжают.
    - Второй, **PySpark на Databricks**: `df` — распределённый DataFrame, считает кластер.
    - Это единственный из трёх вариантов, где Python масштабируется так же, как SQL.
    - Третий, **pandas**: `to_pandas()` — и вся таблица приезжает в память одного процесса.
    - Для сотни тысяч строк Olist это нормально; для витрины признаков за три года это отказ.

    **Практический смысл:**
    - Отсюда практическое правило, которое стоит записать.
    - !!Агрегации не выносят в pandas.!! pandas берут там, где нужна библиотека, которой нет в SQL, и берут на уже свёрнутых данных — на выходе агрегата, а не на входе.

    **Пример:**
    - Кластеризация продавцов в Olist — это сотни строк после свёртки.
    - Такой pandas безопасен.
    - Тот же KMeans по позициям заказов — это 112 650 строк и растущая история, и его надо считать иначе.

    **Осторожно:**
    - На ClickHouse ни один из трёх блоков не заработает — Python-моделей адаптер не поддерживает.
    - Способ обойти это без смены платформы — следующий слайд.

    **Переход:**
    - ~~«Если Python-моделей нет, а расширить dbt хочется — есть отдельный проект».~~
- kind: content
  id: 047-opendbt
  title: 'OpenDBT: расширение dbt-core без форка'
  bullets:
  - 'Не форк: динамически подменяет классы dbt-core при импорте'
  - 'Локальный Python в моделях — там, где адаптер их не поддерживает'
  - 'EL прямо в dbt через dlt: загрузка из web API как dbt-модель'
  - 'Кастомные адаптеры и свои функции в Jinja-контексте'
  - 'Callbacks на события сборки — хук во внешнюю систему'
  - 'Мультипроектный dbt-mesh и dbt docs внутри Airflow UI'
  - 'Apache 2.0, проект молодой — API двигается быстрее ядра'
  materials:
  - label: memiiso/opendbt
    url: https://github.com/memiiso/opendbt
  - label: OpenDBT docs
    url: https://memiiso.github.io/opendbt/
  - label: dlt (EL внутри модели)
    url: https://dlthub.com/docs/intro
  code_caption: python-таск как обычная модель проекта
  code_lang: python
  code: |2
    # dbt_project.yml
    #   dbt-custom-adapter: opendbt.adapters.ClickHouseAdapter

    # models/marts/mart_seller_cluster.py
    from opendbt import OpenDbtPythonModel

    class Model(OpenDbtPythonModel):
        def model(self, dbt, session):
            dbt.config(materialized="table")
            df = session.sql(
                "select * from analytics.int_order_level"
            ).df()
            df["cluster"] = fit_kmeans(df)
            return df          # исполняется ЛОКАЛЬНО,
                               # а не движком хранилища

    # callback на конец сборки — точка интеграции наружу
    def on_run_end(ctx):
        notify_mlflow(ctx.results)
  notes: |2
    [~2 мин] **Главное:**
    - OpenDBT показывает, во что упираются в границы dbt-core чаще всего, и закрывает эти дыры !!без форка ядра!!.

    **Рассказ:**
    - Ключевая идея проекта — он не переписывает dbt, а динамически расширяет его классы при импорте.
    - Отсюда список возможностей: локальный Python в моделях, EL-загрузка через **dlt** (данные из web API приезжают как обычная dbt-модель), свои адаптеры, коллбэки на события, мультипроектная mesh-схема и встроенный просмотр `dbt docs` прямо в интерфейсе Airflow.

    **Разбор кода:**
    - Две части.
    - Верхняя — python-таск: класс наследует `OpenDbtPythonModel`, метод `model` получает те же `dbt` и `session`, но !!исполняется локально, процессом dbt!!, а не движком хранилища.
    - Именно это снимает ограничение адаптера — на ClickHouse обычных Python-моделей нет, а такая работает.
    - Нижняя — `on_run_end`: коллбэк, который вызывается по завершении сборки.
    - Это готовая точка интеграции: отсюда дёргают обучение, шлют метрики в трекинг или закрывают задачу в оркестраторе.

    **Для MLE:**
    - Самое ценное здесь — !!локальный Python плюс коллбэки!!.
    - Первое даёт escape hatch там, где платформа его не даёт; второе — способ соединить dbt с ML-стеком, не заводя оркестратор ради двух шагов.

    **Осторожно:**
    - Проговорить статус честно.
    - Проект !!молодой!!, Apache 2.0, поддерживается небольшой командой; это не dbt Labs и не стандарт индустрии.
    - Локальное исполнение означает, что данные едут в процесс dbt — со всеми ограничениями по памяти из предыдущего слайда.
    - Перед прод-внедрением проверьте README и совместимость с вашей версией dbt-core.

    **Переход:**
    - ~~«Сведём всё в один решающий слайд: когда SQL, когда Python, а когда вообще не dbt».~~
- kind: table
  id: 053-cosmos-execution-modes
  title: 'Cosmos: где исполняется dbt'
  materials:
  - label: Execution modes
    url: https://astronomer.github.io/astronomer-cosmos/getting_started/execution-modes.html
  table:
    headers:
    - ExecutionMode
    - Где исполняется
    - Когда брать
    rows:
    - - LOCAL
      - На воркере Airflow, в его окружении
      - По умолчанию; простой старт
    - - VIRTUALENV
      - Во временном venv на воркере
      - Конфликт зависимостей dbt и Airflow
    - - DOCKER / KUBERNETES
      - В отдельном контейнере или поде
      - Изоляция окружения, свои ресурсы на задачу
    - - WATCHER
      - Один dbt-процесс, задачи следят за его событиями
      - Крупные проекты — заметно быстрее, чем LOCAL
    col_ratios:
    - 3
    - 6
    - 6
  notes: |2
    [~2 мин] **Главное:**
    - Режим исполнения — это компромисс между изоляцией, скоростью и простотой.

    **Рассказ:**
    - `LOCAL` — самый простой и режим по умолчанию: dbt ставится рядом с Airflow и запускается на воркере.
    - Минус — конфликт зависимостей: dbt и Airflow тянут пересекающиеся библиотеки.
    - `VIRTUALENV` решает это ценой времени на создание окружения.
    - `DOCKER`/`KUBERNETES` дают полную изоляцию и отдельные ресурсы.
    - Отдельно про `WATCHER`.
    - Он появился как экспериментальный и стабилизировался в версии 1.15.
    - Идея: вместо запуска отдельного dbt-процесса на каждую модель Cosmos запускает !!один dbt-прогон!! и создаёт задачи-наблюдатели, которые отражают его события.
    - Так сохраняется гранулярность в интерфейсе, но исчезает накладной расход на перезапуск dbt.

    **Практический смысл:**
    - На витрине признаков из десятков моделей разница во времени сборки заметная.
    - Astronomer заявляет сокращение времени прогона DAG до 80% на проектах со множеством мелких моделей — режим стабилен с Cosmos 1.15.0.

    **Осторожно:**
    - Конкретные цифры зависят от проекта и от версии.
    - Перед выбором режима сверяйтесь с текущей документацией — этот кусок Cosmos активно меняется.

    **Переход:**
    - ~~«Прежде чем уходить от Cosmos — что в этой связке поменял Airflow 3».~~
- kind: content
  id: 054-dmp-af
  title: 'dmp-af: dbt-first оркестрация на Airflow'
  bullets:
  - 'Философия обратная: не Airflow с dbt внутри, а dbt, из которого генерируется Airflow'
  - 'Domain-driven: модели разных доменов разъезжаются по отдельным DAG-ам'
  - 'Расписание описывается в конфигурации dbt-моделей, а не в коде DAG'
  - 'Каждая модель — отдельная задача Airflow, зависимости сохраняются между доменами'
  - 'Date interval Airflow можно использовать внутри dbt-трансформаций'
  - 'Целевой случай — большие доменно-организованные dbt-проекты'
  materials:
  - label: 🔍 скриншот — dmp-af сгенерированные DAG-и
    url: https://www.google.com/search?tbm=isch&q=dmp-af+dbt-af+airflow+generated+dags+screenshot
    highlight: true
  - label: dmp-labs/dmp-af
    url: https://github.com/dmp-labs/dmp-af
  code_caption: dags/dmp_af.py
  code_lang: python
  code: |2
    from dmp_af.dags import compile_dmp_af_dags
    from dmp_af.conf import (
        Config, DbtProjectConfig,
        DbtDefaultTargetsConfig,
    )

    config = Config(
        dbt_project=DbtProjectConfig(
            dbt_project_name="olist",
            dbt_project_path=DBT,
            dbt_models_path=DBT / "models",
            dbt_profiles_path=DBT,
            dbt_target_path=DBT / "target",
            dbt_log_path=DBT / "logs",
            dbt_schema="analytics",
        ),
        dbt_default_targets=DbtDefaultTargetsConfig(
            default_target="prod"),
    )

    dags = compile_dmp_af_dags(
        manifest_path=DBT / "target/manifest.json",
        config=config,
    )
    for name, dag in dags.items():
        globals()[name] = dag
  notes: |2
    [~2 мин] **Главное:**
    - dmp-af переворачивает отношения: !!источником истины становится dbt-проект!!, а DAG-и Airflow — производный артефакт.

    **Разбор кода:**
    - Показать структуру.
    - `Config` описывает, где лежит dbt-проект и какой таргет по умолчанию.
    - `compile_dmp_af_dags` читает `manifest.json` и возвращает словарь готовых DAG-ов, которые кладутся в `globals()` — так Airflow их подхватывает.
    - Не разбирать: полный список путей в `DbtProjectConfig`.

    **Практический смысл:**
    - Главная идея, ради которой этот слайд, — !!аналитик или ML-инженер остаётся в dbt!!.
    - Расписание, домен и таргет он описывает в конфигурации модели; знать Airflow при этом не обязательно.
    - Для команды, где dbt-проект большой и разделён по доменам, это снимает целый класс координационных проблем.

    **Пример:**
    - Отдельно отмечу поддержку date interval: интервал запуска из Airflow пробрасывается внутрь dbt-трансформаций, и партиционированный пересчёт становится штатным сценарием, а не самоделкой.

    **Осторожно:**
    - Важная историческая деталь.
    - Раньше проект был известен как dbt-af от Толоки; !!активная разработка переехала в dmp-labs/dmp-af!!, и ориентироваться надо на этот репозиторий.
    - Отдельного качественного официального видеокурса по dmp-af на момент подготовки лекции найти не удалось — берите README и примеры в репозитории.

    **Переход:**
    - ~~«Сравним их лоб в лоб — но без вывода про победителя».~~
- kind: content
  id: 061i-dbt-i-ai
  title: 'dbt и AI: Copilot, MCP, Wizard'
  bullets:
  - 'dbt Copilot (Cloud) — генерация SQL, тестов, описаний и метрик по проекту'
  - 'dbt MCP — официальный сервер: агент видит модели, метрики, lineage и умеет их запускать'
  - 'dbt Wizard — агент под весь цикл: разобраться, изменить, проверить'
  - 'ADE-bench — бенчмарк задач дата-инженерии; цифра вендорская, но набор полезный'
  - 'Parquet-артефакты v2 агент читает запросом, а не разбором manifest.json'
  - 'Расширения IDE (Power User, dbt Labs) поднимают MCP прямо в редакторе'
  - 'Итог один: AI ускоряет рутину, но код по-прежнему проходит ревью и тесты'
  materials:
  - label: dbt MCP server
    url: https://github.com/dbt-labs/dbt-mcp
  - label: dbt Copilot
    url: https://docs.getdbt.com/docs/cloud/dbt-copilot
  - label: dbt Core v2 roadmap
    url: https://github.com/dbt-labs/dbt-core/blob/main/docs/roadmap/2026-06-announcing-v2.md
  - label: Power User for dbt
    url: https://github.com/AltimateAI/vscode-dbt-power-user
  code_caption: dbt MCP — подключение агента к проекту
  code_lang: json
  code: |2
    {
      "mcpServers": {
        "dbt": {
          "command": "uvx",
          "args": ["--from", "dbt-mcp", "dbt-mcp"],
          "env": {
            "DBT_PROJECT_DIR": "/repo/olist_dbt",
            "DBT_PATH": "/usr/local/bin/dbt",
            "DISABLE_SEMANTIC_LAYER": "true"
          }
        }
      }
    }

    # что получает агент: список моделей и колонок,
    # компиляцию, lineage, запуск dbt build/test,
    # метрики Semantic Layer — вместо угадывания схемы
  notes: |2
    [~2 мин] **Главное:**
    - Полезен не «ИИ, который пишет SQL», а !!ИИ, у которого есть контекст проекта!!.
    - Разница между этими двумя вещами — MCP.

    **Рассказ:**
    - Три уровня.
    - **dbt Copilot** — встроенный ассистент dbt Cloud: генерирует модели, тесты, описания и определения метрик, опираясь на ваш проект.
    - Полезен на рутине — описать сорок колонок руками никто не хочет.
    - **dbt MCP** — официальный сервер от dbt Labs, и для нас самое практичное.
    - Он отдаёт агенту !!структурированный доступ!!: список моделей и колонок, скомпилированный SQL, граф зависимостей, запуск `dbt build` и `dbt test`, метрики Semantic Layer.
    - Без него ассистент угадывает схему по обрывкам файлов; с ним — спрашивает.
    - **dbt Wizard** — агент, заточенный не под «напиши SQL», а под весь цикл аналитической инженерии: разобраться в чужом проекте, внести правку, проверить результат.
    - Для измерения dbt Labs сделали **ADE-bench** — бенчмарк задач дата-инженерии; по их публикации Wizard берёт около 76 % на наборе из 75 задач.
    - Цифра вендорская, относиться к ней стоит соответственно, но сам бенчмарк — полезная попытка мерить агентов на реальной работе.
    - Техническая деталь, которая связывает всё: **Parquet-артефакты** dbt Core v2 агент читает запросом.
    - Именно поэтому «дать модели контекст проекта» перестало означать «скормить гигантский manifest.json».

    **Практический смысл:**
    - Самый окупаемый сценарий — не генерация витрины с нуля, а !!рутина вокруг неё!!: описания колонок, черновики тестов, разбор чужой модели, поиск того, что сломается от правки.

    **Осторожно:**
    - Сгенерированный SQL — это !!код!!, и он проходит ревью, тесты и CI наравне с написанным руками.
    - Особенно тесты: ассистент охотно пишет `not_null` там, где NULL допустим по смыслу.

    **Переход:**
    - ~~«И следующий шаг: агент не как ассистент, а как участник пайплайна».~~
- kind: content
  id: 061j-agentic-data-pipelines
  title: 'Agentic data pipelines: где в них место dbt'
  code_lang: diagram
  code: |2
      ЧЕЛОВЕК: «добавь признак — доля отменённых заказов продавца за 30 дней»
                                      │
                                      ↓
     ┌────────────────────────────────────────────────────────────────────────┐
     │                            А Г Е Н Т                                   │
     │                                                                        │
     │  1. ЧИТАЕТ контекст   ──→  dbt MCP: модели, колонки, lineage, метрики   │
     │  2. ПИШЕТ изменение   ──→  правка .sql + запись теста в schema.yml      │
     │  3. ПРОВЕРЯЕТ себя    ──→  dbt compile · dbt build -s <модель>+         │
     │  4. ЧИТАЕТ результат  ──→  json-логи, run_results.json, тесты           │
     │  5. ЧИНИТ и повторяет ──→  цикл, пока тесты не зелёные                  │
     └────────────────────────────────────┬───────────────────────────────────┘
                                          ↓
                                    Pull Request
                                          │
     ┌────────────────────────────────────┴───────────────────────────────────┐
     │  БАРЬЕРЫ, КОТОРЫЕ АГЕНТ НЕ ПРОХОДИТ САМ                                 │
     │  · code review человеком        · Slim CI: state:modified+ --defer      │
     │  · contract витрины (enforced)  · quality gate перед обучением          │
     └────────────────────────────────────────────────────────────────────────┘

      ПОЧЕМУ ЭТО РАБОТАЕТ ИМЕННО С dbt:  у агента есть ОБРАТНАЯ СВЯЗЬ —
      компиляция, тесты и граф дают проверяемый ответ «получилось / нет»
  notes: |2
    [~2 мин] **Главное:**
    - dbt оказался !!удобной средой для агента!! не из-за AI-функций, а из-за свойства, которое было у него всегда: у каждого действия есть машинно проверяемый результат.

    **Рассказ:**
    - Пройти по циклу на схеме.
    - Агент читает контекст через MCP — не гадает, а спрашивает про модели и колонки.
    - Пишет правку.
    - Дальше !!ключевой шаг!!: он сам себя проверяет — `dbt compile` скажет, рендерится ли шаблон, `dbt build -s модель+` соберёт изменённое с тестами, json-логи и `run_results.json` дадут структурированный ответ, что именно упало.
    - Не «кажется, работает», а красное или зелёное.
    - Именно поэтому агентные сценарии в dbt получаются лучше, чем в произвольном ETL-коде: там нет ни компиляции без запуска, ни графа, ни тестов как первого класса.

    **Для MLE:**
    - Нижний блок — самое важное на слайде.
    - Агент проходит цикл до PR, но !!не проходит барьеры!!: ревью человеком, Slim CI в чистом окружении, контракт витрины и quality gate перед обучением.
    - Эти четыре вещи вы строили всю лекцию — и они же оказываются тем, что делает агента безопасным.
    - Пайплайн без них не станет «агентным», он станет непредсказуемым.

    **Пример:**
    - Практическая формулировка задачи агенту, которая работает: не «сделай витрину», а «добавь признак X, напиши на него тест, убедись, что `dbt build -s mart_delivery_features+` зелёный, покажи диффом, что изменилось только в этой колонке».

    **Осторожно:**
    - Отдельный риск — !!тесты, написанные тем же агентом, что и код!!.
    - Он честно сделает их зелёными.
    - Контракт признака (что в нём допустимо, а что нет) должен приходить от человека — из описания задачи, а не выводиться из данных.

    **Переход:**
    - ~~«Соберём итоговую картину признаков Olist».~~
- kind: section
  id: 990-kartinki
  title: КАРТИНКИ
  notes: |2
    **Главное:**
    - **Не входит в хронометраж лекции.** Склад иллюстраций: сюда сложено то, что собрано для деки, но !!не встало ни на один содержательный слайд!! — на слайдах-кандидатах панель кода занимает всю высоту, и картинка либо не помещается, либо выдавливает текст.

    **Зачем это здесь:**
    - Зачем это в деке, а не в папке: картинка, лежащая рядом со слайдами, переезжает на слайд одним движением в PowerPoint, а лежащая в каталоге — не переезжает никогда.
    - Здесь же продублированы !!жёлтые 🔍-ссылки!! на поиск картинок с тех слайдов, где иллюстрации пока нет: собранные в одном месте, они читаются как список задач, а не как разбросанные по деке пометки.

    **Учёт картинок:**
    - Учёт того, какая картинка где стоит, ведётся в `content/preza-dbt-v4-images.yml`; там же помечается картинка, удалённая или перенесённая вручную, — генератор такую обратно не поставит.
