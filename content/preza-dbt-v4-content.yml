- kind: table
  id: 902-gde-pisat-dbt
  title: 'Где писать dbt: CLI, VS Code, браузерные IDE'
  materials:
  - label: dbt VS Code extension
    url: https://docs.getdbt.com/docs/about-dbt-extension
  - label: Power User for dbt
    url: https://github.com/AltimateAI/vscode-dbt-power-user
  - label: SqlDBM + dbt
    url: https://sqldbm.com/sqldbm-plus-dbt/
  table:
    headers:
    - Среда
    - Что даёт
    - Нюанс
    rows:
    - - CLI и любой редактор
      - полный контроль, всё живёт в git
      - нет подсказок по моделям и колонкам
    - - VS Code + Power User
      - автодополнение, compiled SQL, preview, column lineage
      - сторонний пакет (Altimate), AI-функции по ключу
    - - VS Code / Cursor + расширение dbt Labs
      - Fusion, мгновенный парсинг, ошибки до запуска
      - работает с Fusion, не с dbt Core 1.x
    - - Браузерные IDE (dbt Studio, Paradime, Datacoves)
      - среда, планировщик, CI и доки в одном окне
      - 'платформа вендора: цена, лимиты, миграция'
    - - SqlDBM (моделирование схем)
      - ER-модель, из неё генерация dbt YAML прямо в репозиторий
      - слой над проектом, а не замена редактора
    col_ratios:
    - 3
    - 5
    - 4
  notes: |2
    **Главное:**
    - Инструмент не влияет на результат — на выходе всё равно **SQL в git**, — но сильно влияет на скорость правок.
    - Голый CLI честен и переносим, однако !!редактор не знает про ваши модели!!: нет автодополнения `ref`, нет подсказки по колонкам, ошибка находится только при запуске.

    **Разбор:**
    - Локально это лечится двумя разными расширениями, и их легко перепутать.
    - **Power User** от Altimate — сторонний open-source-пакет поверх обычного dbt Core: автодополнение, скомпилированный SQL, preview запроса, column lineage, AI-функции по ключу.
    - **Официальное расширение dbt Labs** — другое: оно приносит __движок Fusion__ и работает именно с ним, а не с dbt Core 1.x.
    - Это первое, что стоит проверить, если расширение «не видит» проект.
    - Браузерные среды дают среду, планировщик, CI и документацию одним куском, но заточены по-разному.
    - **dbt Studio** (бывшая dbt Cloud IDE) — родная среда dbt Labs: автодополнение моделей и колонок, встроенные sqlfmt и SQLFluff, просмотр DAG, git-диффы и разрешение конфликтов, ассистент прямо в редакторе.
    - **Paradime** позиционируют как __«Cursor для данных»__: агент собирает модель и документацию, открывает PR и тянет контекст из Jira, Confluence и таблиц, а на каждый PR показывает !!column-level lineage до дашбордов BI!!.
    - **Datacoves** — managed-платформа на Airflow с VS Code в браузере и упором на корпоративное управление доступом.
    - Отдельная строка — **SqlDBM**: это не редактор, а визуальный моделер.
    - Вы рисуете ER-модель, а он генерирует dbt-YAML (колонки, описания, типы, тесты и freshness) и умеет пушить его __прямо в репозиторий проекта__.
    - Полезно там, где модель данных согласуют с архитекторами до написания SQL.
    - ~~Общая плата за платформенные варианты одна — привязка к вендору: цена за место, лимиты и вопрос «как отсюда уехать», который стоит задать до внедрения, а не после.~~
- kind: content
  id: 903-fusion-i-dbt-core-v2
  title: 'Fusion и dbt Core v2.0: движок переписан на Rust'
  materials:
  - label: About Fusion
    url: https://docs.getdbt.com/docs/fusion/about-fusion
  - label: dbt Core v2 is here
    url: https://docs.getdbt.com/blog/dbt-core-v2-is-here
  bullets:
  - 'Fusion — движок на Rust: он разбирает SQL, а не только подставляет Jinja'
  - Мгновенный парсинг, ошибки до запуска, IntelliSense в VS Code и Cursor
  - dbt Core v2.0 собран на том же коде и открыт под Apache 2.0 (alpha, июнь 2026)
  - 'Артефакты и в Parquet: метаданные читаются запросом; JSON остаётся для совместимости'
  - Ветка 1.latest живёт дальше — обновляться прямо сейчас никто не обязан
  notes: |2
    **Главное:**
    - Главная новость экосистемы: **dbt переписали на Rust**.
    - Движок Fusion — это наследие покупки SDF, и его принципиальное отличие в том, что он !!понимает SQL, а не только шаблонизирует текст!!.
    - Отсюда мгновенный парсинг больших проектов, ошибки, которые видно __до запуска в хранилище__, и осмысленный IntelliSense в редакторе.

    **Разбор:**
    - В июне 2026 dbt Labs выпустили **dbt Core v2.0** — alpha, собранная на том же коде и открытая под **Apache 2.0**; в открытый доступ уехало то, что раньше жило в репозитории dbt-fusion.
    - Отдельно стоит запомнить новый формат артефактов: рядом с `manifest.json` появился **Parquet**, который читается запросом.
    - JSON никуда не делся — он остаётся для обратной совместимости, и Slim CI по-прежнему работает через него.
    - Именно поэтому обновлённые доки и агенты работают с метаданными быстро.

    **Практический смысл:**
    - Практический вывод для команды: __паники не требуется__.
    - Ветка `1.latest` поддерживается, апгрейд не обязателен, а v2 пока alpha — GA обещают позже.
    - ~~Смотреть стоит на две вещи: поддерживается ли ваш адаптер в новом слое (ADBC/Arrow) и переживут ли ваши макросы более строгую спецификацию языка.~~
