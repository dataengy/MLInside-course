- kind: table
  id: 053-cosmos-execution-modes
  title: 'Cosmos: где исполняется dbt'
  materials:
  - label: Execution modes
    url: https://astronomer.github.io/astronomer-cosmos/getting_started/execution-modes.html
  table:
    headers:
    - ExecutionMode
    - Где исполняется
    - Когда брать
    rows:
    - - LOCAL
      - На воркере Airflow, в его окружении
      - По умолчанию; простой старт
    - - VIRTUALENV
      - Во временном venv на воркере
      - Конфликт зависимостей dbt и Airflow
    - - DOCKER / KUBERNETES
      - В отдельном контейнере или поде
      - Изоляция окружения, свои ресурсы на задачу
    - - WATCHER
      - Один dbt-процесс, задачи следят за его событиями
      - Крупные проекты — заметно быстрее, чем LOCAL
    col_ratios:
    - 3
    - 6
    - 6
  notes: |2
    [~2 мин] **Главное:** режим исполнения — это компромисс между изоляцией, скоростью и простотой.

    **Рассказ:** `LOCAL` — самый простой и режим по умолчанию: dbt ставится рядом с Airflow и запускается на воркере. Минус — конфликт зависимостей: dbt и Airflow тянут пересекающиеся библиотеки. `VIRTUALENV` решает это ценой времени на создание окружения. `DOCKER`/`KUBERNETES` дают полную изоляцию и отдельные ресурсы.

    Отдельно про `WATCHER`. Он появился как экспериментальный и стабилизировался в версии 1.15. Идея: вместо запуска отдельного dbt-процесса на каждую модель Cosmos запускает !!один dbt-прогон!! и создаёт задачи-наблюдатели, которые отражают его события. Так сохраняется гранулярность в интерфейсе, но исчезает накладной расход на перезапуск dbt.

    **Для MLE:** на витрине признаков из десятков моделей разница во времени сборки заметная. Astronomer публиковали замеры порядка сорока процентов ускорения относительно LOCAL на своих бенчмарках.

    **Осторожно:** конкретные цифры зависят от проекта и от версии. Перед выбором режима сверяйтесь с текущей документацией — этот кусок Cosmos активно меняется.

    **Переход:** ~~«Теперь альтернативная философия — dmp-af».~~
- kind: content
  id: 054-dmp-af
  title: 'dmp-af: dbt-first оркестрация на Airflow'
  bullets:
  - 'Философия обратная: не Airflow с dbt внутри, а dbt, из которого генерируется Airflow'
  - 'Domain-driven: модели разных доменов разъезжаются по отдельным DAG-ам'
  - 'Расписание описывается в конфигурации dbt-моделей, а не в коде DAG'
  - 'Каждая модель — отдельная задача Airflow, зависимости сохраняются между доменами'
  - 'Date interval Airflow можно использовать внутри dbt-трансформаций'
  - 'Целевой случай — большие доменно-организованные dbt-проекты'
  materials:
  - label: 🔍 скриншот — dmp-af сгенерированные DAG-и
    url: https://www.google.com/search?tbm=isch&q=dmp-af+dbt-af+airflow+generated+dags+screenshot
    highlight: true
  - label: dmp-labs/dmp-af
    url: https://github.com/dmp-labs/dmp-af
  code_caption: dags/dmp_af.py
  code_lang: python
  code: |2
    from dmp_af.dags import compile_dmp_af_dags
    from dmp_af.conf import (
        Config, DbtProjectConfig,
        DbtDefaultTargetsConfig,
    )

    config = Config(
        dbt_project=DbtProjectConfig(
            dbt_project_name="olist",
            dbt_project_path=DBT,
            dbt_models_path=DBT / "models",
            dbt_profiles_path=DBT,
            dbt_target_path=DBT / "target",
            dbt_log_path=DBT / "logs",
            dbt_schema="analytics",
        ),
        dbt_default_targets=DbtDefaultTargetsConfig(
            default_target="prod"),
    )

    dags = compile_dmp_af_dags(
        manifest_path=DBT / "target/manifest.json",
        config=config,
    )
    for name, dag in dags.items():
        globals()[name] = dag
  notes: |2
    [~2 мин] **Главное:** dmp-af переворачивает отношения: !!источником истины становится dbt-проект!!, а DAG-и Airflow — производный артефакт.

    **Разбор кода:** показать структуру. `Config` описывает, где лежит dbt-проект и какой таргет по умолчанию. `compile_dmp_af_dags` читает `manifest.json` и возвращает словарь готовых DAG-ов, которые кладутся в `globals()` — так Airflow их подхватывает.

    Не разбирать: полный список путей в `DbtProjectConfig`.

    **Для MLE:** главная идея, ради которой этот слайд, — !!аналитик или ML-инженер остаётся в dbt!!. Расписание, домен и таргет он описывает в конфигурации модели; знать Airflow при этом не обязательно. Для команды, где dbt-проект большой и разделён по доменам, это снимает целый класс координационных проблем.

    **Пример:** отдельно отмечу поддержку date interval: интервал запуска из Airflow пробрасывается внутрь dbt-трансформаций, и партиционированный пересчёт становится штатным сценарием, а не самоделкой.

    **Осторожно:** важная историческая деталь. Раньше проект был известен как dbt-af от Толоки; !!активная разработка переехала в dmp-labs/dmp-af!!, и ориентироваться надо на этот репозиторий. Отдельного качественного официального видеокурса по dmp-af на момент подготовки лекции найти не удалось — берите README и примеры в репозитории.

    **Переход:** ~~«Сравним их лоб в лоб — но без вывода про победителя».~~
