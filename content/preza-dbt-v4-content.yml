  notes: |2
    [61:24–62:54 · ~1.5 мин] **Главное:**
    - Это не каталог, а короткий список того, что окупается в feature layer.

    **Рассказ:**
    - По строке, по одной фразе.
    - Начинать всегда с `dbt-utils` — без него живут единицы.
    - Дальше `dbt-expectations` — когда нужны не только «не пусто и уникально», но и диапазоны.
    - `elementary` — когда появляется вопрос «а вчера эта витрина была такого же размера?».

    **Для MLE:**
    - !!Отдельных «ML-пакетов» для dbt, которые стоило бы рекомендовать по умолчанию, нет!! — и не надо их выдумывать.
    - Feature engineering в dbt делается обычным SQL плюс dbt-utils.

    **Осторожно:**
    - Важная деталь про `dbt-expectations`.
    - Оригинальный репозиторий calogica больше не поддерживается — активная разработка переехала в metaplane.
    - Ставьте пакет из namespace `metaplane` на hub.getdbt.com, а не по старым туториалам.

    **Пример:**
    - `audit-helper` особенно полезен именно вам: переписали признак — сравнили строки старой и новой витрины и убедились, что разошлись только те, что должны были.

    **Переход:**
    - ~~«Посмотрим два из них в деле на Olist».~~
- kind: content
  id: 029-pakety-v-dele-na-olist
  title: 'Пакеты в деле: подключение и версии'
  image: pic-dbt-hub-packages.jpg
  bullets:
  - 'hub.getdbt.com — каталог: версии и совместимость'
  - 'Версию пиним диапазоном, а не «последняя»'
  - 'dbt deps скачивает, package-lock.yml фиксирует'
  code_caption: packages.yml
  code_lang: yaml
  code: |2
    packages:
      - package: dbt-labs/dbt_utils
        version: [">=1.3.0", "<2.0.0"]

      - package: metaplane/dbt_expectations
        version: [">=0.10.0", "<0.11.0"]
        # активный форк; calogica заброшен
  notes: |2
    [62:54–63:54 · ~1 мин] **Главное:**
    - Пакет — это !!зависимость!!, и обращаться с ней надо как с зависимостью кода: пинить версию и фиксировать то, что реально скачалось.

    **Разбор кода:**
    - Две записи в `packages.yml`.
    - Версия задана !!диапазоном!!, а не «последней»: так минорные обновления приезжают сами, а мажорные — только осознанно.
    - `dbt deps` их скачивает в `dbt_packages/`, а рядом появляется `package-lock.yml`.
    - Правило: `dbt_packages/` в git __не__ коммитим, `package-lock.yml` — коммитим.
    - Иначе воспроизводимости нет: у вас и в CI приедут разные версии.

    **Практический смысл:**
    - Обратите внимание на комментарий у второй записи.
    - Оригинальный репозиторий `calogica/dbt_expectations` больше не поддерживается — активная разработка переехала в namespace `metaplane`.
    - Ставьте оттуда, а не по старым туториалам.

    **Пример:**
    - Картинка справа — каталог hub.getdbt.com.
    - Там же видно, какие версии пакета совместимы с вашей версией dbt-core; это первое, что стоит проверять перед обновлением.

    **Переход:**
    - ~~«А теперь то, ради чего их ставят, — контракт витрины признаков».~~
- kind: content
  id: 029b-kontrakt-vitriny-na-paketah
  title: 'Контракт витрины признаков на пакетах'
  code_caption: models/marts/_marts__models.yml
  code_lang: yaml
  code: |2
    models:
      - name: mart_delivery_features
        description: Признаки для предсказания просрочки доставки. Гранулярность — заказ.
        tests:
          - dbt_utils.equal_rowcount:
              compare_model: ref('int_order_level')   # джойн не размножил строки
        columns:
          - name: order_id
            tests: [not_null, unique]                 # «одна строка на заказ» машинно

          - name: freight_share
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 0                        # доля по определению 0..1
                  max_value: 1

          - name: seller_avg_delay_90d
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: -30                      # признак имеет право быть NULL,
                  max_value: 120                      # но не имеет права быть абсурдным
                  row_condition: seller_avg_delay_90d is not null

          - name: target_is_late
            tests:
              - accepted_values: {values: [0, 1]}     # NULL сюда не просочится
  notes: |2
    [63:54–65:24 · ~1.5 мин] **Главное:**
    - Пакеты дают тесты, которые вы иначе писали бы руками и, скорее всего, не написали бы.

    **Разбор кода:**
    - Четыре места.
    - Первое — `equal_rowcount` на уровне модели: !!машинная проверка гранулярности!!, ровно та, о которой мы говорили на слайде про intermediate.
    - Второе — `expect_column_values_to_be_between` для доли: 0..1 по определению, тут спорить не о чем.
    - Третье — тот же тест на `seller_avg_delay_90d`, но с `row_condition`.
    - Признак имеет право быть NULL (у первого заказа продавца истории нет), поэтому диапазон проверяем только там, где значение есть.
    - Границы −30..120 дней — это не «правильные» числа, а !!записанное вслух ожидание!!: если завтра появится просрочка в год, тест об этом скажет.
    - Четвёртое — `accepted_values` на таргете.
    - Дешёвая защита от того, что NULL просочился в обучающую выборку и превратился в третий класс.
    - Не разбирать: где лежит `_marts__models.yml` и как dbt его находит.

    **Для MLE:**
    - Этот файл и есть !!контракт обучающей выборки!!.
    - Читать его надо как «что я обещаю модели про эти данные» — и каждое обещание проверяется на каждой сборке.

    **Осторожно:**
    - Не превращать контракт в стену тестов.
    - Проверяйте то, поломка чего реально испортит обучение; остальное — `severity: warn`.

    **Переход:**
    - ~~«Тесты мы уже начали писать. Разберём их системно».~~
