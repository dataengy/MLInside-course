- kind: content
  id: 005-full-stack-data-specialist
  title: Full-stack data specialist
  code_lang: diagram
  materials:
  - label: 🔍 картинка — full-stack data team roles map
    url: https://www.google.com/search?tbm=isch&q=full+stack+data+engineer+roles+map+diagram
    highlight: true
  code: |2
                          FULL-STACK DATA SPECIALIST

        Infra              Data              Analytics             ML
          │                 │                    │                  │
          ↓                 ↓                    ↓                  ↓
       DevOps  ──→   DE   ──→   AE   ──→   DA / BIE   ──→   MLE / MLOps

       source → ingestion → storage → transformations → quality → analytics
              → features → training → orchestration → deployment → monitoring

                                     ↑
                          AI / LLM / AGENTS
                снижают стоимость переключения между слоями стека
  notes: |2
    [~2 мин] **Главное:** LLM и агенты не отменяют роли — они удешевляют !!переключение между слоями!! и повышают leverage сильного generalist-а.

    **Рассказ:** показать верхний ряд — это те же шесть ролей. Показать средний — путь данных от источника до мониторинга. И сказать главное: раньше пройти этот путь целиком было дорого, потому что каждый слой требовал отдельной экспертизы и отдельного человека.

    Сегодня LLM-assisted и agentic-driven разработка резко снижают стоимость работы через несколько слоёв: подсказать синтаксис Terraform, набросать DAG, объяснить план запроса ClickHouse. Стоимость входа в соседний слой упала.

    **Для MLE:** в небольших и средних проектах один сильный специалист с AI-tooling закрывает значительную часть того, что раньше требовало DevOps + DE + AE + DA/BIE + MLE. Это про ваш рынок труда напрямую.

    **Осторожно:** !!не говорить, что LLM «отменяют» профессии или что один человек всегда заменит команду!!. Правильный тезис: на масштабе и в сложных системах глубокие специализации сохраняют ценность, а generalist выигрывает там, где цена координации выше цены глубины.

    **Переход:** ~~«Чтобы работать через несколько слоёв, нужны инструменты, которые дают инженерную дисциплину дёшево. dbt — один из них. Но сначала — откуда он вообще взялся».~~
- kind: content
  id: 006-pochemu-voznik-analytics-engineering
  title: 'Почему возник Analytics Engineering'
  code_lang: diagram
  materials:
  - label: 🔍 картинка — ETL vs ELT architecture
    url: https://www.google.com/search?tbm=isch&q=ETL+vs+ELT+architecture+diagram+cloud+data+warehouse
    highlight: true
  - label: dbt viewpoint
    url: https://docs.getdbt.com/community/resources/viewpoint
  code: |2
    ETL       source ──→ Python / Spark / ETL-движок ──→ warehouse
                         # логика живёт вне хранилища, compute отдельный

    ELT       source ──→ warehouse ──→ SQL-трансформации
                         # облачные DWH дёшевы: считаем рядом с данными

    ANALYTICS ELT  +  software engineering practices
    ENGINEERING
              git · модульность · тесты · документация · CI · lineage · ownership
  notes: |2
    [~1.5 мин] **Главное:** Analytics Engineering — это не должность, придуманная вендором, а !!инженерный ответ на то, что аналитики начали писать production-код!!.

    **Рассказ:** три строки — три эпохи. В **ETL** трансформации жили вне хранилища: отдельный движок, отдельный compute, логика в Python или Spark. Потом появились дешёвые облачные DWH — Snowflake, BigQuery, Redshift, а у нас чаще ClickHouse — и стало выгоднее грузить сырьё как есть и считать внутри базы. Это **ELT**.

    И тут вылезла проблема: SQL-трансформаций стало много, писали их аналитики, а инженерных практик вокруг SQL не было никаких. Ни git-ревью, ни тестов, ни документации, ни зависимостей. Data Engineer при этом не должен становиться бутылочным горлышком для каждой новой витрины.

    __Analytics Engineering = ELT + практики разработки ПО.__ dbt появился именно как инструмент для этого (2016, Fishtown Analytics, ныне dbt Labs).

    **Для MLE:** запомните формулу — она понадобится через слайд, когда мы применим её к признакам.

    **Осторожно:** это не «история компании dbt Labs». Если студент спросит про раунды и продукты — отправить в Part 2.

    **Переход:** ~~«А теперь узнайте в этом описании себя».~~
- kind: content
  id: 007-ta-zhe-problema-u-ml-engineer
  title: У ML Engineer сегодня ровно та же проблема
  bullets:
  - Признаки живут в ноутбуках и ad-hoc скриптах, а не в репозитории
  - 'Один и тот же признак посчитан трижды: в EDA, в обучении, в инференсе'
  - Никто не может сказать, откуда взялась колонка и кто её владелец
  - 'Сломался upstream — узнаём по метрикам модели, а не по тестам данных'
  - Пересчёт training dataset стоит полного скана истории
  - Ревью SQL-логики признака не происходит вообще
  code_lang: diagram
  code: |2
     2016            2025 / 2026
     аналитик        ML engineer
        │                 │
        ↓                 ↓
     production        production
     SQL без           признаки без
     инженерии         инженерии
        │                 │
        ↓                 ↓
     Analytics        ...то же
     Engineering      решение
  notes: |2
    [~1 мин] **Главное:** список слева — это дословно те же симптомы, из-за которых десять лет назад появился Analytics Engineering, только теперь у ML-команды.

    **Рассказ:** прочитать вслух два-три пункта и спросить зал: «у кого так?». Обычно поднимается половина рук. Дальше сказать: у аналитиков это лечили не героизмом, а инструментом. Тот же ход работает и здесь.

    **Для MLE:** !!training/serving skew чаще всего рождается именно тут!! — признак посчитан в ноутбуке одним SQL, а в инференсе другим. Общий версионируемый слой убирает целый класс багов.

    **Пример:** Olist. Признак `seller_avg_delivery_delay` в ноутбуке считается по всей истории, а в проде — по последним 90 дням. Метрика на обучении красивая, в проде — нет.

    **Осторожно:** не обещать, что dbt чинит всё. Он чинит слой трансформаций, не обучение.

    **Переход:** ~~«Что конкретно даёт dbt как инженерный инструмент — восемь пунктов на следующем слайде».~~
- kind: content
  id: 008-chto-daet-dbt-inzhenerno
  title: 'dbt: восемь инженерных свойств слоя трансформаций'
  bullets:
  - 'Version control — SQL-модель лежит в git, как и код обучения'
  - 'Modularity — модель ссылается на модель, а не копирует её текст'
  - 'Testing — данные проверяются контрактом до того, как их увидит модель'
  - 'Documentation — определение признака, владелец, семантика поля'
  - 'Lineage — виден граф: от source до training dataset'
  - 'Incremental — не пересчитываем всю историю признаков'
  - 'CI — изменение SQL проходит ревью и автотесты'
  - 'Orchestration — сборка встраивается в общий production-пайплайн'
  materials:
  - label: What is dbt
    url: https://docs.getdbt.com/docs/introduction
  notes: |2
    [~1 мин] **Главное:** это ровно тот список практик, который у Python-кода считается нормой, а у SQL-трансформаций почему-то нет.

    **Рассказ:** быстро, по строке. Ключевая мысль: !!ни одно из свойств не уникально для dbt!! — уникально то, что все восемь получаешь из коробки, без сборки своей платформы.

    **Для MLE:** именно этот список делает dbt интересным full-stack специалисту. Он позволяет одному человеку держать слой трансформаций инженерным способом, не строя вокруг него отдельную команду.

    **Осторожно:** не превращать в маркетинг. Сказать честно: за это платят вхождением в новую модель мышления и дисциплиной слоёв.

    **Переход:** ~~«И сразу самый частый вопрос: а зачем SQL, если у меня есть pandas?»~~
- kind: content
  id: 009-python-vs-sql-glavnyj-princip
  title: 'Python vs SQL: главный инженерный принцип'
  bullets:
  - 'Табличные, детерминированные, массовые преобразования — в SQL-модели dbt'
  - Они естественно выполняются рядом с данными и версионируются как код
  - 'Python остаётся там, где он действительно нужен'
  code_lang: diagram
  code: |2
    В dbt / SQL              В Python
    ─────────────────        ────────────────────────
    join, агрегации          training, ML-библиотеки
    оконные функции          спец. алгоритмы
    фильтры и чистка         то, что плохо ложится в SQL
    сборка признаков         внешние API
    материализация           сложная процедурная логика

    # правило: считаем рядом с данными, пока это
    # выражается таблично и детерминированно
  notes: |2
    [~2 мин] **Главное:** !!табличные, детерминированные и массовые преобразования выносим из ad-hoc pandas в версионируемые SQL-модели; Python оставляем там, где он незаменим!!.

    **Рассказ:** проговорить принцип дословно, он один из двух-трёх, которые студент должен унести. Дальше показать колонки: слева — то, что база делает лучше и дешевле, справа — то, ради чего Python и существует.

    **Для MLE:** это не про вкус. Перенос агрегации в warehouse убирает выгрузку гигабайтов на ноутбук, даёт lineage и делает расчёт воспроизводимым для инференса.

    **Пример:** в Olist сборка `mart_delivery_features` — это join шести таблиц и агрегации. В pandas это выгрузка 100k заказов и 112k позиций; в dbt — один инкрементальный SELECT.

    **Осторожно:** !!не утверждать «SQL всегда лучше Python»!!. Градиентный бустинг в SQL не пишут. Речь только о слое подготовки данных.

    **Переход:** ~~«Разберём это сравнение по критериям — по каким именно свойствам ad-hoc скрипт проигрывает».~~
- kind: table
  id: 010-adhoc-pandas-vs-dbt-model
  title: 'Ad-hoc Python/pandas vs dbt SQL-модель'
  table:
    headers:
    - Критерий
    - Ad-hoc Python / pandas
    - dbt SQL-модель
    rows:
    - - Воспроизводимость
      - Зависит от окружения и порядка ячеек
      - Один и тот же SQL на одном и том же входе
    - - Где считается
      - На машине автора, после выгрузки
      - Рядом с данными, внутри DWH
    - - Code review
      - Диффы ноутбуков нечитаемы
      - Обычный diff SQL в PR
    - - Lineage
      - Неявная, живёт в голове автора
      - 'Явная: граф ref() и source()'
    - - Тесты
      - Как правило отсутствуют
      - Контракт в schema.yml, падает до обучения
    - - Документация
      - README, если повезёт
      - Описание модели и колонок рядом с кодом
    - - Инкрементальность
      - Свой велосипед на каждый скрипт
      - Материализация incremental из коробки
    - - Оркестрация
      - cron + скрипт
      - Узел общего DAG, retry и алерты
    - - Отладка
      - print и повторный прогон целиком
      - Скомпилированный SQL, логи, артефакты прогона
    col_ratios:
    - 3
    - 5
    - 5
  notes: |2
    [~1.5 мин] **Главное:** проигрывает не Python как язык, а !!ad-hoc-режим!! — скрипт без версии, тестов и графа зависимостей.

    **Рассказ:** не читать всю таблицу. Взять три строки: воспроизводимость, lineage, тесты — и на каждой привести короткий пример из практики. Остальное студент прочитает сам.

    **Для MLE:** обратить внимание на строку «Где считается». Выгрузка в pandas — это ещё и стоимость трафика и памяти, и она растёт линейно с историей.

    **Осторожно:** оговориться, что хорошо оформленный Python-пакет с тестами закрывает половину строк таблицы. Сравнение честное только против ad-hoc-скрипта.

    **Переход:** ~~«Дальше — как это выглядит архитектурно. Это картинка, к которой мы вернёмся четыре раза».~~
