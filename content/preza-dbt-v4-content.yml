- kind: content
  id: 012-skvoznaya-arhitektura
  title: 'Сквозная архитектура: где живёт dbt'
  image: pic-dbt-zone-boundary.png
  image_full: true
  bullets:
  - 'Ingestion остаётся снаружи: dbt не грузит данные в DWH'
  - dbt отвечает за рамку в середине
  - Ниже рамки начинается ML-пайплайн
  - Граница проходит по training dataset
  notes: |2
    [20:06–22:36 · ~2.5 мин] **Главное:**
    - !!dbt отвечает ровно за рамку в середине!! — от sources до feature marts.
    - Всё, что ниже рамки, — уже ML-пайплайн.

    **Рассказ:**
    - Это опорная схема лекции, к ней мы вернёмся ещё три раза, каждый раз обогащая её.
    - Пройти сверху вниз: сырые таблицы Olist приезжают в ClickHouse как есть; dbt объявляет их как **sources**; **staging** приводит типы и считает базовые флаги; **intermediate** собирает заказ в одну строку; **feature marts** — это уже витрина признаков.
    - Дальше начинается ML: обучающая выборка, обучение, реестр моделей, инференс.
    - Картинка справа — реальная схема платформы такого же вида: ingestion слева, storage и transform в середине, serving и BI справа.
    - ~~Её не надо читать целиком.~~ Покажите пальцем, что зона трансформаций занимает середину и по объёму сопоставима со всем остальным.

    **Для MLE:**
    - Обратите внимание, где проходит граница ответственности.
    - Спор «чьё это» решается рамкой: всё в рамке — код в dbt-репозитории, всё под рамкой — ваш training pipeline.

    **Пример:**
    - Задача Olist — предсказать просрочку доставки (`is_late_delivery`).
    - Именно она будет ехать с нами через всю лекцию.

    **Осторожно:**
    - Рамка — не «dbt делает ETL».
    - Ingestion (загрузка CSV в ClickHouse) остаётся снаружи, сверху.

    **Переход:**
    - ~~«Теперь переведём каждое понятие dbt на язык MLOps — это, пожалуй, главный слайд лекции».~~
- kind: content
  id: 013-mlops-smysl-konceptov-dbt
  title: 'MLOps-смысл ключевых концепций dbt'
  code_lang: diagram
  code: |2
     МЕХАНИЗМ dbt          ВОПРОС ML-ЭКСПЛУАТАЦИИ, НА КОТОРЫЙ ОН ОТВЕЧАЕТ
     ─────────────────     ────────────────────────────────────────────────────────────

     source()          ──→ откуда пришли данные для признака и кто за них отвечает
     freshness         ──→ данные за сегодня вообще доехали или витрина пересчиталась зря
     ref()             ──→ граф зависимостей: что сломается, если я поправлю stg_orders
     test              ──→ можно ли сегодня учиться на этой таблице — да или нет
     unit test         ──→ верна ли САМА логика признака, а не только данные под ней
     docs / meta       ──→ что означает delivery_delay_days, кто владелец, кто потребитель
     incremental       ──→ сколько стоит обновить признаки за вчера, а не за три года
     snapshot          ──→ каким был статус заказа на дату, если источник хранит только «сейчас»
     exposure          ──→ какие модели и дашборды сломаются, если я удалю эту витрину
     state:modified    ──→ что именно я тронул в этом PR и что надо пересобрать
     CI                ──→ кто проверил, что новый признак не сломал обучающую выборку
     orchestrator      ──→ когда можно запускать training: после зелёного dbt build

     ─────────────────────────────────────────────────────────────────────────────────
     ИТОГ:  «фича dbt» = машинный ответ на вопрос, который раньше решался перепиской
  notes: |2
    [22:36–25:36 · ~3 мин] **Главное:**
    - Каждая «фича dbt» — это ответ на конкретный вопрос MLOps.
    - Если студент унесёт из лекции один слайд, пусть это будет этот.

    **Рассказ:**
    - Идти по строкам медленно, на каждой давать один вопрос из практики.
    - Полностью зачитывать не нужно — возьмите шесть строк, отмеченных ниже, остальные студент прочитает сам.
    - `source()` — «откуда взялась эта колонка?».
    - Объявленный источник даёт ответ в коде, а не в переписке.
    - `ref()` — «что сломается, если я изменю stg_orders?».
    - Граф отвечает за секунды: `dbt build --select stg_orders+`.
    - `test` — «можно ли учиться на этой таблице сегодня?».
    - Тест — это !!предусловие обучения!!, а не отчёт о качестве.
    - `docs` — «что означает delivery_delay_days и кто владелец?».
    - Определение лежит рядом с кодом и не расходится с ним.
    - `incremental` — «сколько стоит обновить признаки за вчера?».
    - Разница между полным сканом истории и одним днём — это ваш счёт за compute.
    - `orchestrator` — «когда можно запускать обучение?».
    - Ответ: !!когда dbt build прошёл вместе с тестами!!, и никак иначе.

    **Практический смысл:**
    - Это переводная таблица между двумя словарями.
    - Держите её под рукой, когда будете объяснять коллегам, зачем вам dbt.
    - Строки `exposure` и `snapshot` разберём отдельно — они реже на слуху, но закрывают частые вопросы.

    **Осторожно:**
    - Не превращать в перечисление возможностей.
    - Каждая строка — это вопрос, на который раньше не было машинного ответа.

    **Переход:**
    - ~~«Дальше — как это работает изнутри: что dbt на самом деле делает с вашим SQL».~~
- kind: content
  id: 014-chto-takoe-dbt-kompilyaciya
  title: 'Что такое dbt: компиляция, ref() и DAG'
  bullets:
  - 'Модель — это файл .sql с одним SELECT; физическую форму задаёт config()'
  - 'dbt компилирует Jinja → чистый SQL и сам добавляет DDL'
  - 'ref() возвращает имя таблицы и одновременно строит ребро графа'
  - 'Порядок сборки dbt выводит из графа — вручную его никто не пишет'
  - 'Ниже черты — то, что реально уехало в базу: dbt compile покажет это всегда'
  code_caption: models/staging/stg_orders.sql → target/run/…
  code_lang: sql
  code: |2
    -- ИСХОДНИК: только SELECT + декларация формы
    {{ config(materialized='view') }}

    select
      order_id,
      customer_id,
      order_status,
      order_purchase_timestamp
    from {{ source('olist_raw', 'orders') }}

    -- ─────────── СКОМПИЛИРОВАНО ───────────

    create view analytics.stg_orders as
    select
      order_id,
      customer_id,
      order_status,
      order_purchase_timestamp
    from olist_raw.orders;
  notes: |2
    [25:36–27:06 · ~1.5 мин] **Главное:**
    - Вы пишете SELECT и объявляете, чем он должен стать; DDL, порядок и зависимости — забота dbt.

    **Разбор кода:**
    - Черта посередине делит слайд на !!то, что вы написали!!, и !!то, что ушло в базу!!.
    - Показать три вещи.
    - Первое — `config(materialized=...)`: это декларация физической формы, а не команда.
    - Второе — `source('olist_raw', 'orders')` превратился в `olist_raw.orders`.
    - Третье — `create view ... as` вы не писали, dbt дописал сам.
    - Не разбирать: список колонок, он тут только для правдоподобия.

    **Практический смысл:**
    - Аналогия — вы описываете, что должно получиться, а не как это построить.
    - Ровно как в декларативной конфигурации инфраструктуры.

    **Пример:**
    - Посмотреть готовый SQL можно всегда: `dbt compile --select stg_orders`, потом открыть `target/compiled/...`.
    - Это первый инструмент отладки, и дальше в лекции мы будем показывать обе половины на каждом Jinja-слайде.

    **Осторожно:**
    - Типичная ошибка новичка — писать в модели `from analytics.stg_orders` вместо `{{ ref('stg_orders') }}`.
    - Запрос отработает, но !!ребро графа не появится!!, и порядок сборки станет случайным.

    **Переход:**
    - ~~«Прежде чем про слои — заведём проект и посмотрим, из чего он состоит».~~
- kind: content
  id: 014b-dbt-core-za-5-minut
  title: 'dbt Core за 5 минут: от пустой папки до сборки'
  bullets:
  - 'Проект dbt — обычный git-репозиторий из .sql и .yml'
  - 'dbt init создаёт каркас, dbt debug проверяет соединение'
  - 'dbt build = run + test одной командой, в порядке DAG'
  - Это обычные CLI-команды — те же самые в CI и в проде
  - 'target/ — артефакты сборки, в git не коммитятся'
  materials:
  - label: dbt init
    url: https://docs.getdbt.com/reference/commands/init
  - label: dbt-clickhouse
    url: https://github.com/ClickHouse/dbt-clickhouse
  code_caption: первый прогон на ClickHouse
  code_lang: bash
  code: |2
    uv venv && source .venv/bin/activate
    uv pip install dbt-core dbt-clickhouse

    dbt init olist && cd olist
    dbt debug     # соединение и профиль живые?
    dbt build     # run + test в порядке графа
    dbt docs generate && dbt docs serve

    # ── каркас проекта ─────────────────────
    olist/
    ├── dbt_project.yml   # конфигурация
    ├── models/           # stg · int · marts
    ├── macros/  tests/   # Jinja и свои тесты
    ├── packages.yml      # зависимости
    └── target/           # артефакты, не в git
    ~/.dbt/profiles.yml   # соединение, вне git
  notes: |2
    [27:06–29:06 · ~2 мин] **Главное:**
    - !!dbt-проект — это обычный репозиторий с SQL и YAML!!. dbt добавляет к нему компилятор, DAG, тесты, метаданные и материализации.

    **Рассказ:**
    - Порядок команд ровно такой, в каком его проходят в первый раз.
    - `uv pip install dbt-core dbt-clickhouse` — движок и **адаптер** ставятся отдельно: адаптер знает диалект и умеет открывать соединение.
    - `dbt init` задаёт вопросы и создаёт каркас проекта плюс запись в `~/.dbt/profiles.yml`.
    - `dbt debug` — первая команда после любой правки соединения.
    - Она отвечает на вопрос «профиль читается, хост доступен, права есть».
    - `dbt build` — то, чем пользуются каждый день: __run и test одной командой__, в порядке графа.
    - Модель, у которой упал тест, не пускает вниз своих потомков.
    - `dbt docs generate && dbt docs serve` — локальный сайт с описаниями и графом зависимостей.

    **Практический смысл:**
    - Каталог `target/` — рабочая папка, а не результат.
    - `target/compiled/` — во что превратился ваш шаблон.
    - `target/run/` — что реально ушло в базу вместе с DDL.
    - `target/manifest.json` и `run_results.json` — артефакты, которые потом читают Slim CI, каталоги данных и мониторинг.

    **Осторожно:**
    - `dbt init` кладёт креды в `~/.dbt/profiles.yml` в открытом виде.
    - Для командной работы это заменяется на `env_var()` — следующий слайд.

    **Переход:**
    - ~~«Разделим два конфига: что лежит в репозитории и что приходит из окружения».~~
- kind: content
  id: 014b2-struktura-dbt-proekta
  title: Структура dbt-проекта
  materials:
  - label: About dbt projects
    url: https://docs.getdbt.com/docs/build/projects
  code_caption: 'канонический каркас: каждая папка — отдельная ответственность'
  code_lang: diagram
  code: |2
     my_dbt_project/
     ├── dbt_project.yml        конфигурация проекта
     ├── packages.yml           зависимости
     ├── models/
     │   ├── staging/
     │   │   ├── stg_orders.sql
     │   │   └── _sources.yml   объявление источников
     │   ├── intermediate/
     │   │   └── int_order_items.sql
     │   └── marts/
     │       ├── fct_orders.sql
     │       ├── dim_customers.sql
     │       └── _models.yml    тесты и описания
     ├── macros/                Jinja-функции
     ├── tests/                 singular-тесты
     ├── seeds/                 маленькие CSV в git
     ├── snapshots/             история SCD2
     ├── analyses/              SQL «на посмотреть», не строится
     ├── selectors.yml          именованные наборы моделей
     └── .gitignore             target/ dbt_packages/ .env*

     ── что уезжает в git ─────────────────────────────────
     ✓  всё выше: структура, шаблоны, версии
     ✓  ~/.dbt/profiles.yml — только env_var(), без значений
     ✗  .env.secrets — локально, в .gitignore
     ✗  target/, dbt_packages/ — сборочные, ставятся заново
  notes: |2
    [29:06–30:06 · ~1 мин] **Главное:**
    - Каркас проекта — !!не вкусовщина, а конвенция!!: по расположению файла dbt понимает, что это, и половина инструментов экосистемы рассчитывает именно на неё.

    **Разбор:**
    - На предыдущем слайде дерево было урезано до того, что появляется при первом запуске.
    - Здесь — полный набор, включая то, что заводят позже.

    `seeds/` — маленькие CSV, которые версионируются вместе с кодом: справочники, маппинги, списки исключений. `snapshots/` — историзация SCD2 для источников, хранящих только актуальную строку. `analyses/` — SQL, который компилируется, но !!не материализуется!!: место для разовых разборов, которые не должны стать таблицей. `selectors.yml` — именованные наборы моделей, чтобы в CI и в оркестраторе не тиражировать длинные строки селекторов.

    Отдельно про `_sources.yml` и `_models.yml`: подчёркивание в начале — распространённая конвенция, а не требование dbt; она просто держит YAML первым в алфавитном списке рядом с моделями слоя.

    **Практический смысл:**
    - Последняя строка вне дерева — `~/.dbt/profiles.yml`.
    - Она здесь для контраста: всё, что выше, живёт в репозитории и ревьюится, подключения — нет.
    - Об этом следующий слайд.

    **Переход:**
    - ~~«Разделим два конфига: что лежит в репозитории и что приходит из окружения».~~
- kind: content
  id: 014c-proekt-ne-okruzhenie
  title: 'Проект ≠ окружение: два конфигурационных файла'
  bullets:
  - 'dbt_project.yml — что за проект: пути, материализации, теги'
  - 'profiles.yml — куда подключаться; живёт в ~/.dbt, не в git'
  - 'Один проект — несколько target: dev, ci, prod'
  - 'Секреты только через env_var(), ни строки в репозитории'
  - 'В Airflow и Dagster соединение приходит из оркестратора'
  materials:
  - label: dbt_project.yml
    url: https://docs.getdbt.com/reference/dbt_project.yml
  - label: profiles.yml
    url: https://docs.getdbt.com/docs/core/connect-data-platform/profiles.yml
  code_lang: diagram
  code: |2
     В РЕПОЗИТОРИИ        ОКРУЖЕНИЕ · СЕКРЕТЫ
     ─────────────────    ────────────────────
     dbt_project.yml      profiles.yml
     models/              host · port
     macros/  tests/      database · schema
     packages.yml         user · password
     selectors.yml        target: dev/ci/prod
     ─────────────────    ────────────────────
     одинаково у всех     своё у каждого
     ревьюится в PR       из env_var() и CI
  notes: |2
    [30:06–31:36 · ~1.5 мин] **Главное:**
    - !!Один и тот же проект собирается в разные хранилища!!.
    - Всё, что различается между разработчиком, CI и продом, вынесено из репозитория.

    **Рассказ:**
    - `dbt_project.yml` отвечает на вопрос **«что это за проект»**: имя, пути к моделям и макросам, материализации по папкам, теги, переменные.
    - Он ревьюится в PR и одинаков у всех.
    - `profiles.yml` отвечает на вопрос **«куда подключаться»**: адаптер, хост, база, схема, пользователь.
    - По умолчанию лежит в `~/.dbt/`, __вне репозитория__.
    - Связывает их одна строка: `profile:` в `dbt_project.yml` называет профиль, а `--target` выбирает внутри него окружение.
    - В профиле обычно три target: `dev` — своя схема разработчика, `ci` — временная схема пайплайна, `prod` — боевая.

    **Практический смысл:**
    - Варианты, где живёт соединение, по возрастанию зрелости.
    - **Локально** — `~/.dbt/profiles.yml`, руками, только dev-креды.
    - **CI** — тот же файл в репозитории, но все значения через `env_var()`; сами значения приходят из секретов пайплайна.
    - **Cosmos** — `ProfileConfig` с маппингом на Airflow Connection: креды хранит Airflow, dbt их не видит.
    - **Dagster** — ресурс проекта; соединение конфигурируется в дефинишенах Dagster.

    **Осторожно:**
    - !!Захардкоженный пароль в `profiles.yml` — самая частая утечка в dbt-проектах!!.
    - Файл выглядит «локальным», и его коммитят «на минутку».
    - Правило простое: в репозиторий попадает только шаблон с `env_var()`.

    **Переход:**
    - ~~«Осталось понять, в каком порядке ловить ошибки, пока правка ещё на вашей машине».~~
- kind: content
  id: 014c2-sekrety-shablon-i-znacheniya
  title: 'Секреты: шаблон отдельно, значения отдельно'
  materials:
  - label: env_var
    url: https://docs.getdbt.com/reference/dbt-jinja-functions/env_var
  code_caption: 'profiles.yml коммитим · .env.secrets — никогда'
  code_lang: yaml
  code: |2
    # profiles.yml — КОММИТИМ, значений здесь нет
    olist:                        # = profile: olist в dbt_project.yml
      target: "{{ env_var('DBT_TARGET', 'dev') }}"
      outputs:
        dev:
          type: clickhouse
          host: "{{ env_var('DBT_HOST') }}"
          port: "{{ env_var('DBT_PORT','8443') | int }}"
          secure: true
          user: "{{ env_var('DBT_USER') }}"
          password: "{{ env_var('DBT_ENV_SECRET_PASSWORD') }}"
          schema: "{{ env_var('DBT_SCHEMA') }}"
          threads: 4

    # ── .env.secrets — НЕ коммитим, лежит в .gitignore ──────────
    DBT_HOST=<clickhouse-host>
    DBT_USER=<user>
    DBT_ENV_SECRET_PASSWORD=<password>
    DBT_SCHEMA=<dbt_schema>

    # dbt читает только файл с именем .env, поэтому подаём явно:
    set -a && source .env.secrets && set +a
    dbt build --selector nightly
  notes: |2
    [31:36–33:06 · ~1.5 мин] **Главное:**
    - В репозиторий уезжает !!форма, а не содержимое!! — структура, шаблоны и версии да, значения никогда.

    **Разбор кода:**
    - `profiles.yml` целиком состоит из `env_var()`.
    - Один и тот же файл работает на ноутбуке и в CI — разница только в том, кто наполняет окружение: человек через `.env.secrets` или хранилище секретов пайплайна.

    **Осторожно:**
    - Три места, где спотыкаются.

    Имя блока обязано совпадать с `profile:` в `dbt_project.yml`. Не совпало — `Could not find profile named 'olist'`, и сообщение не подсказывает, где именно расхождение.

    Префикс `DBT_ENV_SECRET_` — !!не косметика!!. dbt разрешает такие переменные только в `profiles.yml` и `packages.yml` и маскирует значения в логах; обычная переменная с паролем в лог попадёт.

    `.env.secrets` dbt сам не читает — он знает только файл с именем `.env`. Поэтому переменные подаются в окружение явно, строкой `set -a && source … && set +a`.

    **Переход:**
    - ~~«Теперь главный файл проекта — что в нём вообще есть».~~
- kind: content
  id: 014c3-dbt-project-yml
  title: 'dbt_project.yml — главный файл проекта'
  materials:
  - label: dbt_project.yml
    url: https://docs.getdbt.com/reference/dbt_project.yml
  code_caption: 'идентичность и пути · дефолты материализаций по каталогам'
  code_lang: yaml
  code: |2
    name: olist                     # идентичность
    version: '1.0.0'
    config-version: 2
    profile: olist                  # → profiles.yml
    require-dbt-version: [">=1.8.0", "<2.0.0"]

    model-paths: ["models"]         # пути
    clean-targets: ["target", "dbt_packages"]
    vars:
      lookback_days: 3              # → {{ var('lookback_days') }}
    query-comment: "dbt | {{ target.name }}"

    # ── дефолты материализаций: каталог глубже — сильнее ────────
    models:
      olist:
        +materialized: view         # дефолт для всех
        marts:
          +materialized: table
          +engine: MergeTree()
          ml:
            ml_order_delay_features:
              +materialized: incremental
              +unique_key: [order_id]
  notes: |2
    [33:06–34:36 · ~1.5 мин] **Главное:**
    - Этот файл !!и делает каталог проектом!!.
    - Дефолты живут здесь, исключения — рядом с моделью.

    **Разбор кода:**
    - Верх — идентичность и пути: имя, профиль, требуемая версия dbt, где лежат модели и что чистить.
    - Ниже — `vars` (переменные проекта, видны как `{{ var(...) }}`), хуки и комментарий, который dbt подставляет в каждый запрос: по нему в логах хранилища видно, чей это SQL.

    Нижний блок — самое полезное. Материализации задаются !!по каталогам!!: `view` по умолчанию, `table` в marts, `incremental` для конкретной ML-витрины.

    **Практический смысл:**
    - Приоритет запомнить один раз — __чем ближе к модели, тем сильнее__:

    `config()` в `.sql` > `config:` в `schema.yml` > `dbt_project.yml`.

    Внутри самого файла сильнее более глубокий каталог. А конфиг вашего проекта сильнее конфига установленного пакета — поэтому дефолты пакета можно переопределять, не трогая его код.

    **Переход:**
    - ~~«Осталось понять, в каком порядке ловить ошибки, пока правка ещё на вашей машине».~~
- kind: content
  id: 014d-shift-left
  title: 'Shift left: ловим ошибку до CI'
  materials:
  - label: sqlfmt
    url: https://docs.sqlfmt.com/
  - label: SQLFluff
    url: https://docs.sqlfluff.com/
  code_caption: 'цена ошибки растёт слева направо — ловим как можно левее'
  code_lang: diagram
  code: |2
     ЛОКАЛЬНО, СЕКУНДЫ И МИНУТЫ         ЧТО ЭТО В МИРЕ PYTHON
     ────────────────────────────       ──────────────────────────
     правка .sql / .yml                 правка модуля
            ↓
     sqlfmt · SQLFluff                  black · ruff
            ↓
     dbt parse · dbt compile            проверка типов и импортов
            ↓
     dbt build -s модель+               pytest выбранного модуля
            ↓
     pre-commit                         pre-commit
     ────────────────────────────       ──────────────────────────
     push  →  Slim CI                   CI: обязательный барьер
            ↓
     прод-сборка по расписанию          деплой
     ────────────────────────────       ──────────────────────────
     поймано локально — минута          поймано в проде — инцидент
  notes: |2
    [34:36–36:06 · ~1.5 мин] **Главное:**
    - Порядок проверок — это !!экономика обратной связи!!.
    - Секунда локально стоит дешевле двадцати минут ожидания CI и несравнимо дешевле разбора в проде.

    **Рассказ:**
    - Слева — цикл, который стоит довести до автоматизма.
    - **Формат** — `sqlfmt` без настроек, в духе Black.
    - Спорить о стиле в ревью больше не о чем.
    - **Линт** — `SQLFluff`: правила поверх формата, и он __понимает Jinja__, то есть не спотыкается о `{{ ref(...) }}`.
    - **Компиляция** — `dbt compile` отвечает на вопрос «шаблон вообще рендерится и все `ref` разрешаются».
    - Это самая дешёвая проверка из всех: хранилище не трогается.
    - **Сборка куска** — `dbt build -s модель+`: только правленая модель и её потомки, а не весь проект.
    - **pre-commit** прогоняет всё это автоматически перед коммитом.

    **Практический смысл:**
    - Правая колонка — только для интуиции, а не строгое соответствие.
    - `dbt test` проверяет **данные**, а `pytest` — **код**; ближе всего к pytest стоят dbt unit-тесты.
    - `dbt compile` ловит не типы, а разрешимость ссылок и синтаксис шаблона.
    - Смысл сопоставления один: !!в SQL-слое существует ровно тот же набор рубежей, что и в Python-репозитории!!, и его надо просто включить.

    **Осторожно:**
    - Локальный рубеж !!не заменяет CI!!.
    - `git commit --no-verify` пропускает все хуки, а окружение разработчика всегда чем-то отличается от чистого.
    - Всё обязательное дублируется в пайплайне — разберём его в блоке про CI/CD.

    **Переход:**
    - ~~«Инструмент понятен. Теперь главный вопрос проектирования: как раскладывать сами данные».~~
- kind: content
  id: 015a-kak-modelirovat-dannye
  title: 'Как моделировать данные в dbt: слои ≠ модель'
  image: pic-dbt-layers-flow.png
  bullets:
  - Слои — это DAG сборки, а не модель данных
  - source-conformed → business-conformed
  - intermediate необязателен
  - Модель данных выбирает архитектор, не dbt
  materials:
  - label: How we structure our dbt projects
    url: https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview
  code_lang: diagram
  code: |2
     СЛОИ = DAG            МОДЕЛЬ = СМЫСЛ
     ───────────────────   ──────────────
     src → stg → mart      сущность
     src → stg → int       grain · связи
             → mart        история
     ───────────────────   ──────────────
     int — по нужде        1 модель =
                           1 сущность
  notes: |2
    [36:06–38:06 · ~2 мин] **Главное:**
    - Это два разных решения, и их постоянно путают.
    - !!Слои — про порядок сборки. Модель данных — про смысл строки.!!

    **Рассказ:**
    - Картинка справа — **transformation DAG**, рекомендованная раскладка dbt: `sources → staging → [intermediate] → marts`.
    - Движение идёт от **source-conformed** (как в источнике) к **business-conformed** (как думает бизнес).
    - `staging` — rename, cast, cleanup.
    - Одна модель на один источник.
    - `intermediate` — join, смена гранулярности, pivot и fanout, изоляция сложной логики.
    - `marts` — бизнес-сущности и витрины под потребителя.
    - !!`intermediate` — необязательный слой.!! Для маленького проекта `staging → marts` — это нормально, а не халтура.
    - Он появляется тогда, когда между ними реально есть что делать.
    - Схема слева — вторая, независимая ось.
    - **Модель данных** = сущность + гранулярность + связи + история + контракт потребителя.
    - Ни одно из этих слов не про папки.
    - Базовое правило для простого проекта: **entity-centric marts** — `orders`, `customers`, `sellers`, `mart_delivery_features`.
    - __Одна модель = одна понятная сущность или задача + явно названная grain.__

    **Для MLE:**
    - Ключевой вопрос моделирования формулируется одной фразой: !!что означает одна строка обучающей выборки!!.
    - Заказ?
    - Заказ на момент времени?
    - Пара «заказ × продавец»?
    - Ответ на этот вопрос определяет всю витрину — и он не выводится из раскладки папок.

    **Пример:**
    - Olist.
    - `stg_orders` — source-conformed, схема как в источнике.
    - `int_order_level` — интеграция и смена грануляра: заказ ровно одной строкой.
    - `mart_delivery_features` — consumer-facing витрина, потребитель у неё обучение.

    **Осторожно:**
    - dbt !!не требует!! ни Kimball, ни Data Vault, ни Medallion.
    - Он даёт граф и соглашения об именах; выбор методологии остаётся за архитектором и делается под задачу.

    **Переход:**
    - ~~«Теперь, когда мы разделили структуру DAG и собственно модель данных, разберём ответственность каждого слоя».~~
- kind: table
  id: 015-sloi-dbt-proekta-otvetstvennost
  title: 'Слои dbt-проекта: ответственность каждого'
  materials:
  - label: How we structure our dbt projects
    url: https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview
  table:
