    - Закрыв все строки таблицы своим кодом — граф зависимостей, материализации, тесты, документация, инкремент, — вы !!написали свой dbt!!.
    - И дальше вы его сопровождаете сами: без адаптеров, без пакетов, без сообщества и без человека, который придёт и уже будет это знать.
    - __Свой фреймворк трансформаций окупается только там, где готовый принципиально не подходит,__ а не там, где его лень изучить.

    **Переход:**
