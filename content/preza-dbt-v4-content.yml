- kind: title
  id: 001-dbt-dlya-full-stack-data-specialist
  title: dbt для full-stack data specialist
  subtitle: Слой данных и ML-признаков как инженерный компонент production-системы
  notes: |2
    [~1 мин] **Главное:** это лекция не про «ещё один инструмент аналитика», а про то, как перестать держать подготовку данных и признаков в ad-hoc Python-скриптах.

    **Рассказ:** поздороваться, назвать себя. Сказать прямо: сегодня мы берём один слой ML-системы — !!подготовку данных и признаков!! — и превращаем его в нормальный инженерный компонент: версионируемый, тестируемый, документированный, инкрементальный, оркеструемый.

    **Для MLE:** большая часть боли в проде живёт не в модели, а в данных под ней. dbt — самый дешёвый способ закрыть эту боль инструментами, которые вы уже знаете по коду.

    **Переход:** ~~«Посмотрим план, а потом сразу разберёмся, почему роль дата-специалиста за последние годы изменилась».~~

    — Сгенерировано: model=claude-opus-5 · harness=Claude Code · effort=high · version=v4.0.1 · 2026-08-31
