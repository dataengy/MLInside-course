- kind: title
  id: 001-dbt-dlya-full-stack-data-specialist
  title: Трансформация данных и витрины (dbt)
  image: pic-dbt-logo.png
  notes: |2
    [00:00–01:00 · ~1 мин] **Главное:**
    - Это лекция не про «ещё один инструмент аналитика», а про то, как перестать держать подготовку данных и признаков в ad-hoc Python-скриптах.

    **Рассказ:**
    - Поздороваться, назвать себя.
    - Сказать прямо: сегодня мы берём один слой ML-системы — !!подготовку данных и признаков!! — и превращаем его в нормальный инженерный компонент: версионируемый, тестируемый, документированный, инкрементальный, оркеструемый.

    **Для MLE:**
    - Большая часть боли в проде живёт не в модели, а в данных под ней. dbt — самый дешёвый способ закрыть эту боль инструментами, которые вы уже знаете по коду.

    **Переход:**
    - ~~«Посмотрим план, а потом сразу разберёмся, почему подготовка данных перестала быть чужой зоной ответственности».~~

    — Сгенерировано: model=claude-opus-5 · harness=Claude Code · effort=high · version=v4.10.0 · 2026-09-01
- kind: agenda
  id: 002-plan-lekcii
  title: План лекции
  bullets:
  - 'Что такое dbt, откуда он взялся и зачем понадобился'
  - 'Роли вокруг данных и появление Analytics Engineering'
  - 'Первый проект: два конфига и цикл проверок до CI'
  - 'Моделирование: слои DAG и модель данных — разные решения'
  - 'Jinja, макросы и пакеты: исходник и скомпилированный SQL'
  - 'Тесты, документация, lineage: контракт feature-таблицы'
  - 'Инкрементальность, ClickHouse и point-in-time correctness'
  - 'Границы dbt: где заканчивается SQL и начинается Python'
  - 'Оркестрация: Airflow 3 + Cosmos связывает слой с обучением'
  - 'CI/CD, команды, качество проекта и логи'
  notes: |2
    [01:00–02:30 · ~1.5 мин] **Главное:**
    - У лекции сквозная линия — один пример Olist проходит через все блоки.

    **Рассказ:**
    - Пройти по плану быстро, отметив три опорные точки.
    - Первая треть — что такое dbt, откуда он взялся и как завести первый проект.
    - Середина — моделирование, Jinja, тесты и документация: то, из чего складывается feature layer.
    - Последняя треть — инкрементальность, point-in-time, границы dbt и вывод всего этого в прод через оркестрацию и CI/CD.
    - Сказать, что после основной части в деке есть ещё две: **PART 2 «DS/MLE нюансы»** и **PART 3 «Advanced / Appendix»** — справочник, который остаётся у слушателя.

    **Практический смысл:**
    - Предупредить, что домашнего задания в лекции нет — вместо него сквозной production-пример, который можно повторить у себя.

    **Переход:**
    - ~~«Начнём с того, кто вообще делает трансформации и почему это стало отдельной инженерной ролью».~~
- kind: section
  id: 003-rol-i-analytics-engineering
  title: Роль data-специалиста и появление Analytics Engineering
  notes: |2
    [02:30–02:48 · ~0.3 мин] **Главное:**
    - Вводный блок — контекст, без которого dbt выглядит «инструментом для аналитиков».

    **Рассказ:**
    - Одна фраза: «сначала разберёмся, кто и почему делает подготовку данных сегодня, а уже потом — чем».
- kind: table
  id: 004-kak-razdelilis-obyazannosti
  title: 'Как разделились обязанности: шесть ролей вокруг одних данных'
  table:
    headers:
    - Роль
    - Отвечает за
    - Артефакт
    rows:
    - - DevOps / Platform
      - Инфраструктура, кластеры, доступы, деплой
      - Terraform, Helm, CI-раннеры
    - - Data Engineer
      - Ingestion, хранилище, надёжность потоков
      - Пайплайны загрузки, схемы DWH
    - - Analytics Engineer
      - Трансформации, модель данных, качество
      - SQL-модели, тесты, документация
    - - Data Analyst / BI
      - Метрики, дашборды, интерпретация
      - Отчёты, семантический слой
    - - ML Engineer
      - Признаки, обучение, качество модели
      - Training pipeline, модель в registry
    - - MLOps Engineer
      - Деплой, мониторинг, переобучение
      - Serving, алерты, дрейф-метрики
    col_ratios:
    - 3
    - 5
    - 4
  notes: |2
    [02:48–04:18 · ~1.5 мин] **Главное:**
    - Разделение труда возникло не от моды, а от того, что каждый слой требовал своей глубины.

    **Рассказ:**
    - Пройтись по строкам по одной фразе.
    - Обратить внимание, что !!данные одни и те же!!, а ответственных шесть — и на каждом стыке появляется очередь: «подожди, пока DE добавит колонку».

    **Для MLE:**
    - Типичная история — MLE ждёт витрину от DE, не дожидается и пишет свой pandas-скрипт.
    - Так появляется теневой слой трансформаций, который никто не тестирует.

    **Осторожно:**
    - Не подавать таблицу как «устаревшую».
    - В крупных системах это разделение по-прежнему необходимо — оно и дальше будет нужно.

    **Переход:**
    - ~~«А теперь посмотрим, что с этой картиной сделали LLM и агенты».~~
- kind: content
  id: 005-full-stack-data-specialist
  title: 'Кто делает трансформации: стык, на котором стоит MLE'
  image: pic-roles-de-ae-da.png
  bullets:
  - Между DE и потребителем данных всегда есть слой трансформаций
  - Исторически его вели Analytics Engineer и Data Analyst
  - У ML Engineer тот же слой — потребитель не дашборд, а обучение
  - Выигрывает тот, кто может закрыть этот слой сам
  code_lang: diagram
  code: |2
      DevOps ─→ DE ─→ AE ─→ DA / BI
                       │
                       └──→ MLE / MLOps
                             признаки
                             обучение
  notes: |2
    [04:18–05:48 · ~1.5 мин] **Главное:**
    - Трансформации — это !!общий стык!!, а не чужая зона.
    - Аналитик и ML-инженер стоят на одном и том же слое, просто с разных сторон.

    **Рассказ:**
    - Показать картинку справа: три роли вокруг одних данных — Data Engineer тащит данные, Analytics Engineer их превращает в пригодные, Data Analyst делает из них выводы.
    - Дальше показать схему слева и добавить четвёртую ветку: от того же слоя трансформаций отходит !!MLE!!, и ему нужно ровно то же самое — чистые, названные, проверенные таблицы.

    **Практический смысл:**
    - Практический вывод один.
    - Ждать, пока витрину сделает соседняя команда, — это очередь, а очередь превращается в теневой pandas-скрипт.
    - Уметь закрыть этот слой самому дешевле, чем кажется, если брать готовый инструмент, а не строить платформу.

    **Осторожно:**
    - Не подавать это как «роли отмирают».
    - Разделение труда в крупных системах остаётся необходимым; меняется только стоимость перехода через границу.

    **Переход:**
    - ~~«У аналитиков эта же боль случилась раньше. Посмотрим, чем они её вылечили».~~
- kind: content
  id: 006b-elt-vmesto-etl
  title: 'ELT вместо ETL: почему трансформации переехали в хранилище'
  image: pic-elt-dbt-flow.png
  bullets:
  - Storage и compute разъехались и подешевели
  - Сырьё грузим как есть, переделка — новый SELECT
  - Практики нужны вокруг SQL, а не вокруг движка
  - ETL остаётся там, где сырое класть нельзя
  code_lang: diagram
  code: |2
     ETL   T до загрузки
           ─ схема фиксируется заранее
           ─ переделка = перезагрузка

     ELT   T после загрузки
           ─ сырьё лежит целиком
           ─ переделка = новый SELECT
  notes: |2
    [05:48–07:18 · ~1.5 мин] **Главное:**
    - ELT победил не потому, что «так модно», а потому что !!в облачных хранилищах пересчитать дешевле, чем перезагрузить!!.

    **Рассказ:**
    - Схема слева — вся разница в одной строке: где стоит буква T.
    - В **ETL** трансформация происходит до загрузки, значит схему целевой таблицы надо придумать заранее, и любая ошибка в модели данных лечится повторной загрузкой из источника.
    - В **ELT** сырьё уже лежит в хранилище целиком, и переделка модели — это просто новый SELECT поверх того же сырья.
    - Картинка справа показывает то же самое как архитектуру: источники слева, дальше развилка ELT/ETL, хранилище в центре, а потребители — ML, BI, приложения — справа.
    - Обратите внимание на нижний ряд: **governance, quality, catalog** — это то, что появляется поверх, когда трансформаций становится много.

    **Для MLE:**
    - Для признаков это принципиально.
    - Определение признака меняется чаще, чем схема источника; при ELT смена определения — правка SQL и пересчёт, а не переговоры с командой загрузки.

    **Осторожно:**
    - Не объявлять ETL устаревшим.
    - Там, где нельзя класть сырое (персональные данные, лицензионные ограничения, дорогой объём) или где источник — поток с обогащением на лету, T по-прежнему стоит до загрузки.

    **Переход:**
    - ~~«Теперь — как из этого сдвига вырос конкретный инструмент».~~
- kind: content
  id: 006d-istoriya-dbt
  title: 'Как появился dbt: от ETL к слою трансформаций'
  bullets:
  - 'До облака: T до загрузки, отдельный движок и свой compute'
  - 'Дешёвые облачные DWH сделали ELT дефолтом, а не экзотикой'
  - '2016 — dbt: практики разработки ПО приходят в SQL'
  - '2025–2026 — Rust-движок Fusion и слияние с Fivetran'
  - 'SQLMesh — независимая альтернатива, не часть экосистемы dbt'
  materials:
  - label: dbt Core v2
    url: https://docs.getdbt.com/blog/dbt-core-v2-is-here
  - label: Fivetran + dbt Labs
    url: https://www.getdbt.com/blog/fivetran-dbt-labs-complete-merger-to-create-the-data-infrastructure-for-trusted-ai-agents
  - label: dbt Projects on Snowflake
    url: https://docs.snowflake.com/en/release-notes/2025/other/2025-11-06-dbt-projects-on-snowflake-ga
  code_lang: diagram
  code: |2
     до 2012   ETL · compute вне базы
     2012–16   Redshift · BigQuery · Snowflake
               → ELT становится дешевле ETL
     2016      dbt · Fishtown Analytics
     2019–22   dbt Cloud · Analytics Eng.
               · dbt Labs · dbt Core 1.0
     2025-05   Fusion: движок переписан на Rust
     2025-11   dbt Projects on Snowflake GA
     2026-06   Fivetran + dbt Labs · Core v2.0
  notes: |2
    [07:18–09:18 · ~2 мин] **Главное:**
    - dbt появился не как «ещё один инструмент», а как !!реакция на то, что трансформации переехали внутрь хранилища и остались без инженерных практик!!.

    **Рассказ:**
    - По строкам таймлайна, коротко.
    - **До облачных хранилищ** трансформации считать в базе было дорого: свой compute у ETL-движка, буква T стоит до загрузки.
    - **2012–2016** — Redshift, BigQuery, Snowflake.
    - Хранилище само стало дешёвым вычислителем, и __грузить сырьё как есть стало выгоднее, чем готовить его заранее__.
    - **2016** — dbt в **Fishtown Analytics**: git, ревью, тесты и документация приходят в SQL-разработку.
    - **2019–2022** — коммерческий dbt Cloud, термин **Analytics Engineering**, компания переименована в dbt Labs, вышел **dbt Core 1.0**.

    **Где он сегодня:**
    - **28 мая 2025** — движок **Fusion**: переписан на Rust, разбирает SQL, а не только подставляет Jinja.
    - **6 ноября 2025** — **dbt Projects on Snowflake** в GA: dbt-проект как объект внутри хранилища, со своим CI/CD.
    - **13 октября 2025** объявлено слияние с **Fivetran**, **1 июня 2026** оно завершено; тогда же вышел **dbt Core v2.0** на общем с Fusion Rust-рантайме, по-прежнему под Apache 2.0.

    **Практический смысл:**
    - Для вашего проекта это значит одно — !!dbt Core остаётся открытым и никуда не делся!!.
    - Python-ветка 1.x доступна и обновляется, миграция на v2 — ваше решение, а не срок от вендора.

    **Осторожно:**
    - Две вещи, которые часто путают.
    - **Fusion ≠ отдельный продукт вместо Core.** Это движок, на котором построен dbt Core v2.0; проприетарной остаётся только расширенная сборка бинаря.
    - **SQLMesh — не часть экосистемы dbt.** Это независимый движок другой команды, который умеет читать dbt-проекты.
    - Разбор — в Part 3.

    **Переход:**
    - ~~«У всего этого был манифест, написанный ещё до первой строчки кода».~~
- kind: content
  id: 006a-dbt-za-60-sekund
  title: dbt за 60 секунд
  bullets:
  - 'dbt = data build tool: слой T в ELT, внутри хранилища'
  - 'Модель — это SELECT в .sql; метаданные и тесты — в .yml'
  - 'ref() связывает модели и строит DAG; порядок выводится сам'
  - 'Из того же кода — тесты, документация и метаданные проекта'
  - 'dbt Core — open source CLI; вокруг него платформа и адаптеры'
  - 'Пакеты с hub.getdbt.com добавляют макросы и готовые тесты'
  materials:
  - label: What is dbt
    url: https://docs.getdbt.com/docs/introduction
  code_lang: diagram
  code: |2
     ЧТО ДЕЛАЕТ           ЧЕГО НЕ ДЕЛАЕТ
     ──────────────       ─────────────────
     T в ELT              ingestion — E и L
     SQL + YAML + Jinja   расписание и ретраи
     ref() → DAG          хранение и compute
     тесты · доки         обучение моделей
     метаданные проекта   стриминг из коробки
  notes: |2
    [09:18–10:48 · ~1.5 мин] **Главное:**
    - dbt — это !!компилятор и оркестратор SQL-моделей внутри хранилища!!, а не ещё один ETL-движок.

    **Рассказ:**
    - Расшифровка простая: **data build tool**.
    - Буква **T** из ELT — всё, что происходит с данными после того, как они уже легли в хранилище.
    - Вы пишете `SELECT` в файле `.sql` — не `CREATE TABLE`, не `INSERT`.
    - DDL и порядок сборки dbt берёт на себя.
    - Рядом лежит `.yml`: описания, тесты, теги, владельцы.
    - __Код и метаданные живут в одном репозитории и в одном ревью.__ `ref('stg_orders')` вместо имени таблицы — из этих ссылок dbt выводит **DAG** и сам решает, что за чем строить.
    - Из того же проекта бесплатно получаются документация, lineage и артефакты для внешних систем.
    - **dbt Core** — open-source CLI на Python.
    - Вокруг него коммерческая платформа, адаптеры под СУБД и пакеты на hub.

    **Осторожно:**
    - Правая колонка схемы важнее левой. dbt !!не грузит данные!! — за E и L отвечает ingestion (Airbyte, Kafka, свои скрипты). dbt не «отменяет Python».
    - Декларативный SQL вытесняет ad-hoc процедурную логику !!в табличном слое трансформаций!! — и только там.

    **Переход:**
    - ~~«Теперь — почему такой инструмент вообще понадобился».~~
