  id: 009-python-vs-sql-glavnyj-princip
  title: 'Python vs SQL: главный инженерный принцип'
  bullets:
  - 'ad-hoc Python transformations → SQL/dbt models inside DWH'
  - '…плюс software engineering practices: версии, ревью, тесты'
  - 'Переносим табличное, детерминированное и массовое — и только это'
  - 'Python остаётся там, где он действительно нужен'
  code_lang: diagram
  code: |2
    В dbt / SQL              В Python
    ─────────────────        ────────────────────────
    join, агрегации          training, ML-библиотеки
    оконные функции          спец. алгоритмы
    фильтры и чистка         то, что плохо ложится в SQL
    сборка признаков         внешние API
    материализация           сложная процедурная логика

    # правило: считаем рядом с данными, пока это
