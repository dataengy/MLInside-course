- kind: content
  id: 052-cosmos
  title: 'Cosmos: Airflow-native оркестрация dbt'
  bullets:
  - Open-source проект Astronomer
  - 'dbt-проект превращается в DbtDag или DbtTaskGroup внутри общего DAG'
  - 'Узлы dbt становятся задачами Airflow: модель, тест, снапшот'
  - 'Отсюда ретраи, SLA, алерты и логи на уровне отдельной модели'
  - 'Подключения берутся из Airflow Connections, а не из profiles.yml руками'
  - 'Task group встраивается в пайплайн между ingestion и обучением'
  materials:
  - label: 🔍 скриншот — Cosmos DbtTaskGroup в Airflow UI
    url: https://www.google.com/search?tbm=isch&q=astronomer+cosmos+dbt+task+group+airflow+ui+screenshot
    highlight: true
  - label: Astronomer guide
    url: https://www.astronomer.io/docs/learn/airflow-dbt
  - label: Cosmos docs
    url: https://astronomer.github.io/astronomer-cosmos/
  code_caption: dags/olist_delivery.py
  code_lang: python
  code: |2
    from cosmos import (
        DbtTaskGroup, ProjectConfig,
        ProfileConfig, RenderConfig,
    )

    transform = DbtTaskGroup(
        group_id="dbt_olist",
        project_config=ProjectConfig(
            dbt_project_path=DBT_DIR),
        profile_config=ProfileConfig(
            profile_name="olist",
            target_name="prod",
            profiles_yml_path=PROFILES),
        render_config=RenderConfig(
            select=["tag:features"]),
    )
  notes: |2
    [102:06–104:36 · ~2.5 мин] **Главное:**
    - Cosmos читает ваш dbt-проект и !!раскрывает его в задачи Airflow!! — по задаче на узел графа.

    **TAKEAWAY TO REPEAT:**
    - dbt отвечает за transformation DAG; Airflow отвечает за end-to-end production pipeline.

    **Разбор кода:**
    - Три конфига.
    - `ProjectConfig` — где лежит dbt-проект.
    - `ProfileConfig` — как подключаться; в проде вместо `profiles_yml_path` обычно используют маппинг на Airflow Connection, чтобы креды жили в Airflow.
    - `RenderConfig` — какую часть графа разворачивать: здесь только модели с тегом `features`.
    - Не разбирать: полный список параметров, их много.

    **Практический смысл:**
    - Практическая выгода конкретная.
    - Упала одна модель — вы видите в интерфейсе Airflow именно её, читаете её лог, перезапускаете именно её.
    - Плюс ретраи и SLA настраиваются на модель, а не на весь проект.

    **Пример:**
    - `select=["tag:features"]` — способ отделить ночную сборку витрин признаков от остальных витрин компании в том же dbt-проекте.

    **Осторожно:**
    - Cosmos парсит dbt-проект, чтобы построить задачи, и это стоит времени на каждом разборе DAG-файла.
    - В больших проектах используют заранее собранный `manifest.json` вместо разбора на лету.

    **Переход:**
    - ~~«И что в этой связке изменил Airflow 3».~~
- kind: content
  id: 053b-airflow3-cosmos
  title: 'Airflow 3 + Cosmos + dbt: что изменилось'
  bullets:
  - 'Data-aware scheduling есть с Airflow 2.4 — тогда это был Dataset'
  - 'В Airflow 3 Dataset переименован в Asset; смысл прежний'
  - 'Импорт сменился: from airflow.sdk import Asset'
  - 'Витрина как Asset — обучение стартует по её обновлению, не по cron'
  - 'Внешнее событие — это AssetWatcher, а не расписание'
  - 'Cosmos держит Airflow 3.0 начиная с версии 1.10.0'
  materials:
  - label: Asset-aware scheduling
    url: https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/asset-scheduling.html
  - label: Cosmos compatibility
    url: https://astronomer.github.io/astronomer-cosmos/policy/compatibility-policy.html
  code_caption: 'ingestion asset → dbt/Cosmos → feature asset → обучение'
  code_lang: python
  code: |2
    from airflow.sdk import DAG, Asset
    from cosmos import DbtTaskGroup

    RAW  = Asset("ch://olist/raw_orders")
    FEAT = Asset("ch://olist/mart_delivery")

    with DAG("olist_dbt", schedule=[RAW]):
        dbt = DbtTaskGroup(group_id="dbt", ...)
        ok = EmptyOperator(task_id="ready",
                           outlets=[FEAT])
        dbt >> ok

    with DAG("train_delay", schedule=[FEAT]):
        train()   # по данным, не по cron
  notes: |2
    [104:36–106:36 · ~2 мин] **Главное:**
    - В Airflow 3 расписание перестало быть единственным способом запустить обучение.
    - !!Downstream-DAG подписывается на витрину!!, и Cosmos встраивается в эту цепочку.

    **Рассказ:**
    - Сначала — что НЕ поменялось.
    - **Data-aware scheduling появилось не в Airflow 3, а в Airflow 2.4**, под именем `Dataset`.
    - Идея та же: задача объявляет `outlets`, другой DAG объявляет их своим `schedule`.
    - В **Airflow 3** это переименовано в **Asset** и заметно расширено: появился декоратор `@asset`, партиции ассетов и внешние события.
    - Современный импорт — `from airflow.sdk import Asset`.
    - `Asset` — надмножество старого `Dataset`: те же inlets/outlets работают, плюс новый синтаксис.
    - Разбор кода: `RAW` — ассет ingestion, `FEAT` — витрина признаков.
    - DAG трансформации просыпается по обновлению `RAW`, а DAG обучения — по обновлению `FEAT`.
    - Отдельная задача с `outlets=[FEAT]` после `DbtTaskGroup` — самый переносимый способ объявить «витрина готова»: он не зависит от версии Cosmos.

    **Практический смысл:**
    - Развести два разных механизма, которые звучат похоже.
    - **Внутренняя зависимость по данным** внутри Airflow — это `Asset`: одна задача обновила, другая проснулась.
    - **Внешнее событие** — сообщение в очереди, файл в объектном хранилище — это `AssetWatcher` и event-driven scheduling: Airflow слушает внешний источник и сам обновляет ассет.

    **Осторожно:**
    - Несколько мест, где спотыкаются при переходе.
    - !!Airflow `AssetWatcher` ≠ Cosmos `ExecutionMode.WATCHER`.!! Первое — про источник события.
    - Второе — про то, как Cosmos исполняет dbt внутри одной задачи.
    - Общего только слово.
    - Первая поддержка Airflow 3.0 в Cosmos появилась в **1.10.0**; для Airflow 3.1–3.3 нужен **1.11.3+**, а плагин с dbt-документацией требует Airflow 3.1+.
    - Airflow 3 !!ужесточил формат URI ассетов!!.
    - DAG-и, которые были подписаны на сгенерированные Cosmos `Dataset`-URI, после апгрейда надо перепроверить: изменившийся URI молча означает «ассет никогда не обновляется».
    - В Airflow 3 сменилась модель плагинов; свои UI-расширения вокруг dbt переписываются, а Cosmos показывает dbt docs через внешние view на FastAPI.

    **Переход:**
    - ~~«Теперь альтернативная философия — dmp-af».~~
