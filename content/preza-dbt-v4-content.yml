- kind: content
  id: 037-inkrement-vmesto-polnogo-perescheta
  title: 'Инкремент вместо полного пересчёта'
  bullets:
  - 'Full refresh: пересобираем витрину целиком, читая всю историю'
  - 'Incremental: пересчитываем только то, что могло измениться'
  - 'is_incremental() истинно только когда таблица уже существует'
  - '{{ this }} — сама целевая таблица модели'
  - 'unique_key называет ключ; заменяет строки стратегия, а не он'
  code_caption: models/marts/mart_delivery_features.sql
  code_lang: sql
  code: |2
    {{ config(
        materialized='incremental',
        unique_key='order_id',
        incremental_strategy='append') }}

    select *
    from {{ ref('int_order_level') }}

    {% if is_incremental() %}
      -- учебный вариант: только новее
      -- максимума в самой витрине
      where order_purchase_timestamp > (
        select max(order_purchase_timestamp)
        from {{ this }}
      )
    {% endif %}
  notes: |2
    [77:30–79:30 · ~2 мин] **Главное:**
    - Инкремент — это !!не «только новые строки», а ограниченный пересчёт всего, что могло измениться!!.
    - Именно поэтому в feature layer он почти обязателен: считает деньги и время сборки.

    **TAKEAWAY TO REPEAT:**
    - incremental — это не «только новые строки», а ограниченный пересчёт всех данных, которые могли измениться.

    **Разбор кода:**
    - Три точки.
    - `materialized='incremental'` — материализация.
    - `is_incremental()` — блок работает только при повторных прогонах; при первом запуске и при `--full-refresh` он выключен и модель собирается целиком.
    - `{{ this }}` — ссылка на саму целевую таблицу.
    - Про `unique_key` сказать точно: он !!только называет ключ строки!!.
    - Заменяет ли что-нибудь повторная запись, решает `incremental_strategy` — здесь стоит `append`, и он просто дописывает, никакого upsert тут нет.
    - Не разбирать: сами стратегии — про них на слайде про ClickHouse.

    **Практический смысл:**
    - Посчитайте на пальцах.
    - Витрина признаков за три года — это сотни миллионов строк и джойны.
    - Полный пересчёт каждую ночь стоит часы compute; инкремент за сутки — минуты.
    - Разница уходит прямо в счёт за кластер.

    **Пример:**
    - Первый прогон Olist собирает всю историю; дальше — окно свежих заказов вместо трёх лет.

    **Осторожно:**
    - !!Этот фильтр — учебный, а не production-паттерн!!.
    - Он написан ровно так, как его пишут в первый раз, и ровно так же ломается.
    - Почему — следующий слайд, это важно.

    **Переход:**
    - ~~«Разберём, что именно здесь сломается».~~
- kind: content
  id: 038-lovushka-max-event-time
  title: 'Ловушка: WHERE ts > max(ts)'
  bullets:
  - 'Late arrivals — событие приехало позже, чем произошло'
  - 'Corrections — строку в источнике поправили задним числом'
  - 'Mutable source — статус заказа меняется после вставки'
  - 'Во всех трёх случаях фильтр по максимуму данные просто не увидит'
  - 'Хуже всего: пайплайн зелёный, тесты зелёные, витрина неверна'
  code_lang: diagram
  code: |2
    max(ts) в витрине = 10 марта
                 │
                 ↓
    ┌──────────────────────────────────┐
    │ прогон 11 марта                  │
    │                                  │
    │ заказ от 12 марта   ──→  ✓       │
    │ заказ от 08 марта   ──→  ✗       │
    │   опоздал                        │
    │ правка заказа от 05 ──→  ✗       │
    │   правка задним числом           │
    └──────────────────────────────────┘

    # тесты зелёные: того, чего
    # в таблице нет, проверить нельзя
  notes: |2
    [79:30–81:00 · ~1.5 мин] **Главное:**
    - `WHERE ts > max(ts)` предполагает, что данные приходят строго по возрастанию времени события.
    - !!В проде это почти никогда не так.!!

    **Рассказ:**
    - Три сценария.
    - Первый — опоздание: событие произошло восьмого, а доехало одиннадцатого; максимум в витрине уже двенадцатое, и строка не попадёт никогда.
    - Второй — исправление: заказ пятого марта переоформили, дата события не изменилась, фильтр его не поднимет.
    - Третий — изменяемый источник: у заказа Olist статус и дата доставки !!дописываются позже!!, чем он был создан.
    - Подчеркнуть худшее свойство этой ошибки: она молчаливая.
    - Тесты проверяют то, что в таблице есть; отсутствующие строки они проверить не могут.

    **Для MLE:**
    - Для обучения это означает систематическое смещение.
    - Опоздавшие заказы — это чаще всего именно проблемные заказы.
    - Выбросив их, вы обучаете модель на выборке, где просрочек меньше, чем в реальности.

    **Осторожно:**
    - Не превращать это в «инкремент — зло».
    - Инкремент нужен; неверна конкретная стратегия отбора дельты.

    **Переход:**
    - ~~«Как делать правильно».~~
- kind: content
  id: 039-watermark-lookback-idempotency
  title: 'Watermark, lookback и идемпотентность'
  bullets:
  - Считаем по времени ЗАГРУЗКИ или по окну, а не по максимуму факта
  - 'lookback — перекрываем окно назад, чтобы поднять опоздавшее'
  - 'unique_key + delete+insert — повторный прогон не плодит дубли'
  - 'Идемпотентность: два прогона подряд дают одинаковый результат'
  - 'Партиции: пересобрать день целиком часто дешевле, чем искать дельту'
  code_caption: models/marts/mart_delivery_features.sql
  code_lang: sql
  code: |2
    {{ config(
        materialized='incremental',
        unique_key='order_id',
        incremental_strategy='delete+insert') }}

    select * from {{ ref('int_order_level') }}

    {% if is_incremental() %}
      -- окно с перекрытием: сутки инкремента
      -- плюс lookback на опоздавшие и правки
      where order_purchase_timestamp >=
            (select max(order_purchase_timestamp)
             from {{ this }})
            - interval {{ var('lookback_days', 7) }} day
    {% endif %}
  notes: |2
    [81:00–83:00 · ~2 мин] **Главное:**
    - Дельта считается !!с перекрытием!!, а повторная запись обязана быть безопасной.

    **Разбор кода:**
    - Две строки.
    - `incremental_strategy='delete+insert'` вместе с `unique_key` означает: перед вставкой строки с такими же ключами удаляются.
    - Второй прогон на тех же данных даёт тот же результат — это и есть идемпотентность.
    - И `- interval lookback_days day`: мы сознательно перечитываем последние семь дней, чтобы поднять опоздавшее и исправленное.
    - Не разбирать: как именно ClickHouse исполняет delete+insert.

    **Практический смысл:**
    - lookback — это компромисс, который вы обязаны выбрать осознанно.
    - Семь дней стоят в семь раз дороже одного и покрывают опоздания до недели.
    - Ответ на вопрос «сколько» даёт не интуиция, а !!распределение задержки между временем события и временем загрузки!! в ваших данных.

    **Пример:**
    - Ещё надёжнее — партиционирование.
    - Витрина партиционирована по месяцу; пересобираем затронутые партиции целиком.
    - Никакой дельта-логики, полная воспроизводимость, цена — перечитанная партиция.

    **Осторожно:**
    - Идемпотентность надо проверять.
    - Прогон дважды подряд и сравнение `count()` — минимальный тест, который ловит большинство ошибок инкремента.

    **Переход:**
    - ~~«Теперь про специфику движка — у нас ClickHouse».~~
- kind: table
  id: 040-clickhouse-specifika
  title: 'ClickHouse: что меняется в инкременте'
  materials:
  - label: 🔍 картинка — ClickHouse MergeTree parts and partitions
    url: https://www.google.com/search?tbm=isch&q=clickhouse+mergetree+parts+partitions+diagram
    highlight: true
  - label: dbt-clickhouse
    url: https://github.com/ClickHouse/dbt-clickhouse
  table:
    headers:
    - Что
    - Особенность ClickHouse
    - Что делать в dbt
    rows:
    - - Движок таблицы
      - MergeTree-семейство, нужен ORDER BY
      - 'engine и order_by в config() модели'
    - - UPDATE / DELETE
      - Мутации асинхронные и дорогие
      - Избегать точечных апдейтов; думать партициями
    - - Дедупликация
      - ReplacingMergeTree схлопывает не сразу
      - 'final или явная дедупликация в SELECT'
    - - Стратегии инкремента
      - append, delete+insert, insert_overwrite
      - append — быстро; delete+insert — идемпотентно
    - - Партиции
      - Дешёвый DROP/REPLACE PARTITION
      - 'partition_by + пересборка затронутых партиций'
    - - Materialized view
      - Обновляется движком при вставке, не по dbt run
      - Отдельная материализация, не путать с incremental
    col_ratios:
    - 3
    - 6
    - 6
  notes: |2
    [83:00–85:00 · ~2 мин] **Главное:**
    - Инкремент — это не абстракция, а поведение конкретного движка.
    - В ClickHouse оно заметно своё.

    **TAKEAWAY TO REPEAT:**
    - В ClickHouse думайте affected partitions и idempotency, а не row-by-row updates.

    **Рассказ:**
    - Взять три строки.
    - Первая — обязательный `ORDER BY`: это ключ сортировки, от него зависит скорость чтения.
    - Вторая — мутации: `ALTER ... UPDATE` в ClickHouse асинхронный и дорогой, поэтому !!паттерн «поправим строку» здесь плохо работает!!, а паттерн «перезальём партицию» — хорошо.
    - Третья — `ReplacingMergeTree`: дубликаты схлопываются в фоне, в произвольный момент.
    - До схлопывания вы их видите.

    **Для MLE:**
    - Третья строка — это прямая угроза обучающей выборке.
    - Если читать `ReplacingMergeTree` без `FINAL` и без дедупликации, часть заказов попадёт в выборку дважды.
    - Модель получит удвоенный вес на этих строках, и вы этого не заметите.

    **Пример:**
    - `insert_overwrite` по партициям — часто самый честный вариант для feature mart: пересобрали месяц целиком, результат воспроизводим.

    **Осторожно:**
    - materialized view в ClickHouse — это триггер на вставку, а не «инкрементальная модель dbt».
    - Не смешивать.

    **Переход:**
    - ~~«И теперь главное ML-специфичное ограничение, которое SQL сам по себе не проверяет».~~
- kind: content
  id: 041-point-in-time-correctness
  title: 'Point-in-time correctness: главный ML-риск в feature layer'
  code_lang: diagram
  code: |2
     Ось времени продавца S
     ────────────────────────────────────────────────────────────────────────→
        заказ A        заказ B      ┃  ЗАКАЗ X          заказ C       заказ D
        доставлен      доставлен    ┃  prediction       доставлен     доставлен
        +2 дня         -1 день      ┃  2025-03-01 10:00  +9 дней      +11 дней
                                    ┃
                                    ┃ prediction time
        ←── МОЖНО учитывать ────────┫──────── НЕЛЬЗЯ учитывать ──────────────→

     seller_avg_delay_90d для заказа X   =  среднее по A и B          ✓
                                         ≠  среднее по A, B, C, D     ✗ leakage

     ПРАВИЛО:   feature_timestamp  <=  prediction_timestamp
     ─────────────────────────────────────────────────────────────────────────
     ЧЕМ ЛОВИТЬ                          ЧЕМ НЕ ПОЙМАТЬ
     ─────────────────────────────       ─────────────────────────────
     ревью SQL: есть ли верхняя грань    not_null / unique — зелёные
     подозрительно высокая метрика       accepted_values — зелёный
     backtest на «замороженной» дате     freshness — зелёный
     сравнение train vs прод-инференс    сам факт, что запрос корректен
  notes: |2
    [85:00–88:00 · ~3 мин] **Главное:**
    - !!Правильно посчитанный SQL-агрегат может быть неверным признаком!!.
    - Для ML недостаточно корректной арифметики — нужна корректность по времени.

    **TAKEAWAY TO REPEAT:**
    - Для ML недостаточно правильно посчитать агрегат — он должен быть посчитан только из информации, доступной на момент prediction.

    **Рассказ:**
    - Разобрать пример медленно, он того стоит.
    - Мы предсказываем просрочку заказа X, оформленного первого марта в десять утра.
    - Один из признаков — средняя просрочка этого продавца.
    - Наивный SQL: `avg(delivery_delay_days) group by seller_id`.
    - Он посчитает среднее по всем заказам продавца, которые есть в таблице, — включая заказы C и D, которые завершились !!после!! первого марта.
    - В момент предсказания этой информации не существовало.
    - Модель на такой выборке покажет отличные метрики на валидации и просядет в проде.
    - Классическая утечка: признак несёт информацию из будущего.

    **Для MLE:**
    - Правило формулируется одной строкой и должно висеть у вас перед глазами: !!feature_timestamp <= prediction_timestamp!!.
    - Любой агрегат по истории обязан быть ограничен сверху моментом предсказания.

    **Пример:**
    - В Olist это особенно коварно, потому что `order_delivered_customer_date` дописывается в ту же строку заказа позже.
    - Таблица выглядит так, будто всё было известно сразу.

    **Осторожно:**
    - Нижняя часть схемы — самое практичное на слайде.
    - Утечка !!не ловится обычными dbt-тестами!!: `not_null` и `unique` на такой витрине зелёные, потому что запрос синтаксически корректен и данные целы.
    - Ловится она ревью SQL (ищем верхнюю грань в join-е), аномально хорошей метрикой на валидации и бэктестом на замороженной дате.

    **Переход:**
    - ~~«Смотрим, как это выражается в SQL».~~
- kind: content
  id: 042-pit-na-sql
  title: 'Point-in-time на SQL: история продавца'
  code_caption: models/intermediate/int_seller_delay_history.sql
  code_lang: sql
  code: |2
    {{ config(materialized='table') }}

    with order_seller as (                    -- продавец заказа
      select order_id, min(seller_id) as seller_id
      from {{ ref('stg_order_items') }} group by order_id
    ),
    history as (                              -- ЗАВЕРШЁННЫЕ заказы продавцов
      select os.seller_id,
             o.order_delivered_customer_date                  as done_at,
             dateDiff('day', o.order_estimated_delivery_date,
                             o.order_delivered_customer_date) as delay_days
      from {{ ref('stg_orders') }} as o
      join order_seller as os using (order_id)
      where o.order_delivered_customer_date is not null
    )
    select
      cur.order_id,
      avg(h.delay_days) as seller_avg_delay_90d,
      count(h.done_at)  as seller_orders_90d
    from {{ ref('stg_orders') }} as cur
    join order_seller as cs using (order_id)
    left join history as h on h.seller_id = cs.seller_id
          -- ВОТ ЭТИ ДВЕ СТРОКИ И ЕСТЬ POINT-IN-TIME
          and h.done_at <  cur.order_purchase_timestamp
          and h.done_at >= cur.order_purchase_timestamp - interval 90 day
    group by cur.order_id
  notes: |2
    [88:00–90:00 · ~2 мин] **Главное:**
    - point-in-time — это два условия в JOIN, а не отдельная технология.

    **Разбор кода:**
    - Показать ровно две строки, помеченные комментарием.
    - Верхняя — !!строго раньше момента покупки!!: берём только то, что было известно.
    - Нижняя — окно 90 дней назад: не тащим всю историю, признак должен быть про недавнее поведение.
    - Обратить внимание: ключевое условие стоит на !!дате завершения!! (`done_at`) исторического заказа, а не на дате его покупки.
    - Заказ, купленный в феврале и доставленный в апреле, на первое марта ещё не был завершён — и в среднее входить не должен.
    - Не разбирать: CTE `order_seller` (у заказа может быть несколько продавцов, берём одного) и производительность self-join.
    - На больших объёмах это переписывают через оконные функции или asof-join, идея не меняется.

    **Для MLE:**
    - Именно эту модель и её описание мы видели на слайде про docs.
    - Круг замкнулся: !!ML-свойство признака зафиксировано и в SQL, и в документации!!.

    **Осторожно:**
    - `left join`, а не `inner`.
    - У первого заказа продавца истории нет — признак должен стать NULL, а сам заказ обязан остаться в выборке.
    - `inner join` тихо выбросил бы всех новых продавцов, а это как раз самый рискованный сегмент.

    **Переход:**
    - ~~«Мы дошли до края зоны ответственности dbt. Проговорим границу явно».~~
- kind: content
  id: 042b-activity-schema-odna-tablica
  title: 'Activity Schema: одна таблица, любое окно'
  materials:
  - label: Activity Schema
    url: https://www.activityschema.com/
  code_caption: 'то же point-in-time, но условие переезжает из JOIN внутрь агрегата'
  code_lang: sql
  code: |2
    -- ФАКТ: одна строка = одно событие продавца
    {{ config(materialized='incremental',
              engine='MergeTree()',
              order_by='(entity_id, activity_ts)') }}
    select os.seller_id                    as entity_id,
           o.order_delivered_customer_date as activity_ts,
           'order_delivered'               as activity,
           o.delay_days                    as value
    from {{ ref('stg_orders') }} as o
    join order_seller as os using (order_id)
    where o.order_delivered_customer_date is not null

    -- ── ПРИЗНАК: то же условие, но внутри агрегата ─────────────
    select cur.order_id,
           avgIf(a.value,
                 a.activity_ts <  cur.order_purchase_timestamp
             and a.activity_ts >= cur.order_purchase_timestamp
                                  - interval 90 day)
             as seller_avg_delay_90d
    from {{ ref('stg_orders') }} as cur
    join order_seller as cs using (order_id)
    left join {{ ref('int_seller_activity') }} as a
           on a.entity_id = cs.seller_id
    group by cur.order_id
  notes: |2
    [90:00–91:30 · ~1.5 мин] **Главное:**
    - Activity Schema !!не отменяет point-in-time!! — она меняет форму таблицы, из которой считается признак.

    **TAKEAWAY TO REPEAT:**
    - Дешевеет СЛЕДУЮЩИЙ признак, а не сама корректность.

    **Разбор кода:**
    - Сверху таблица событий — `entity_id`, `activity_ts`, `activity`, `value`: один продавец, один момент, одно событие, одно значение.
    - Снизу тот же самый признак, что на предыдущем слайде, но два условия переехали из `JOIN` внутрь `avgIf`.
    - Сравнить построчно стоит вслух: условия !!дословно те же!! — строго раньше момента покупки и окно в 90 дней назад.

    **Практический смысл:**
    - Что меняется при переходе к этой форме.

    Своя модель под каждый признак — против одной таблицы событий на все признаки. Условие point-in-time в `JOIN` — против условия внутри `avgIf`. Новое окно в 30 дней: правка модели — против ещё одной строки в `select`.

    **Осторожно:**
    - Цена тоже есть.
    - Классическая форма читается сразу, обе грани видны глазом; для Activity Schema нужен словарь — какие вообще бывают `activity`.
    - И повторю главное: !!корректность дешевле не становится!!, условие никуда не делось.

    **Переход:**
    - ~~«Границы разобрали. Дальше — где заканчивается dbt».~~
- kind: section
  id: 043-granicy-dbt
  title: 'Границы: где заканчивается dbt'
  notes: |2
    [91:30–91:48 · ~0.3 мин] **Главное:**
    - Короткий блок про то, чего dbt не делает.

    **Рассказ:**
    - «Три нюанса, из-за которых команды регулярно ошибаются в архитектуре».
- kind: content
  id: 044-dbt-ne-ml-pipeline
  title: 'Нюанс 1: dbt ≠ ML pipeline'
  code_lang: diagram
  code: |2
      ┌──────────────────────────────────┐   ┌──────────────────────────────────┐
      │         D B T  —  Э Т О          │   │     З А   П Р Е Д Е Л А М И      │
      │                                  │   │                                  │
      │  sources · freshness             │   │  model training                  │
      │  staging                         │   │  hyperparameter search           │
      │  intermediate                    │   │  experiment tracking             │
      │  feature marts                   │   │  model registry / versioning     │
      │  tests · docs · lineage          │   │  serving / online inference      │
      │  incremental materialization     │   │  model monitoring, drift         │
      │  snapshots (SCD2)                │   │  retraining policy               │
      │  exposures (что читает витрину)  │   │  A/B и shadow-деплой             │
      └─────────────────┬────────────────┘   └─────────────────┬────────────────┘
                        │                                      ↑
                        └─────────  training dataset  ─────────┘

      КТО СОЕДИНЯЕТ:  оркестратор (Airflow / Dagster) — блок про него дальше
      ГДЕ ГРАНИЦА:    dbt отвечает за ТАБЛИЦЫ, ML-стек — за МОДЕЛЬ
      ЧАСТАЯ ОШИБКА:  тащить обучение в dbt · и наоборот — считать dbt SQL-раннером
  notes: |2
    [91:48–93:18 · ~1.5 мин] **Главное:**
    - dbt отвечает за !!слой трансформации данных и признаков!!.
    - Всё, что про модель, — вне его.

    **Рассказ:**
    - Прочитать оба столбца.
    - Слева — то, что dbt делает хорошо и за что его стоит брать.
    - Справа — то, чего он не делает и делать не должен: обучение, подбор гиперпараметров, трекинг экспериментов, реестр моделей, сервинг, мониторинг качества модели, политика переобучения, A/B.
    - Соединяет их одна стрелка — training dataset.
    - И соединяет физически не dbt, а оркестратор; это следующий блок лекции.

    **Для MLE:**
    - Это полезный слайд для разговора с руководством.
    - Когда предлагают «а давайте всё в dbt», ответ — вот граница, и она проведена по природе задач, а не по вкусу.
    - Формулировка для запоминания в нижней строке: !!dbt отвечает за таблицы, ML-стек — за модель!!.

    **Осторожно:**
    - Ошибка бывает в обе стороны, и вторая встречается чаще.
    - Считать dbt «просто SQL-раннером» и не пользоваться тестами, документацией и графом — значит платить за инструмент и не получать главного.

    **Переход:**
    - ~~«Третий вопрос, который всегда задают: а Python внутри dbt можно?»~~
- kind: content
  id: 046-python-modeli-v-dbt
  title: 'Python-модели в dbt: escape hatch, а не замена SQL'
  bullets:
  - 'Поддержаны на Snowflake (Snowpark), Databricks (PySpark), BigQuery (BigFrames)'
  - 'ClickHouse и Postgres Python-моделей не дают — это ограничение адаптера'
  - 'Модель — функция model(dbt, session), возвращает ровно один DataFrame'
  - 'ref() и source() доступны через объект dbt — модель встаёт в общий DAG'
  - 'Ограничения: только table/incremental, нет view и ephemeral'
  - 'print() не виден, импорт функций между Python-моделями невозможен'
  materials:
  - label: Python models
    url: https://docs.getdbt.com/docs/build/python-models
  code_caption: models/marts/mart_seller_cluster.py
  code_lang: python
  code: |2
    def model(dbt, session):
        dbt.config(materialized="table",
                   packages=["scikit-learn"])

        orders = dbt.ref("int_order_level")

        from sklearn.cluster import KMeans
        pdf = orders.to_pandas()
        pdf["cluster"] = KMeans(
            n_clusters=5, n_init=10
        ).fit_predict(
            pdf[["distance_km", "item_count"]]
        )
        return pdf
  notes: |2
    [93:18–94:48 · ~1.5 мин] **Главное:**
    - Python в dbt — это !!аварийный выход!!, а не альтернативный основной путь.

    **Разбор кода:**
    - Четыре строки.
    - `def model(dbt, session)` — обязательная сигнатура.
    - `dbt.config(packages=[...])` — зависимости объявляются здесь, а не в requirements проекта.
    - `dbt.ref(...)` — тот же граф зависимостей, что и в SQL: Python-модель встаёт в общий DAG наравне с SQL-моделями.
    - `return pdf` — модель обязана вернуть ровно один DataFrame.
    - Не разбирать: параметры KMeans, они тут для правдоподобия.

    **Практический смысл:**
    - И сразу трезвая оговорка.
    - !!На ClickHouse, с которым мы работаем в этом курсе, Python-моделей нет!! — это ограничение адаптера, а не настройка.
    - Поддержка есть у Snowflake, Databricks и BigQuery.
    - Проверяйте страницу конфигурации вашего адаптера, прежде чем закладывать это в архитектуру.

    **Осторожно:**
    - Несколько практичных ограничений.
    - `print()` в логах dbt не появится — код исполняет платформа, а не dbt.
    - Функции из одной Python-модели нельзя импортировать в другую.
    - И материализация только `table` или `incremental` — ни `view`, ни `ephemeral`.

    **Переход:**
    - ~~«Сведём в одну таблицу: когда SQL, когда Python и когда вообще не dbt».~~
- kind: table
  id: 048-when-sql-when-python-when-not-dbt
  title: 'WHEN SQL · WHEN PYTHON · WHEN NOT DBT'
  materials:
  - label: Python models
    url: https://docs.getdbt.com/docs/build/python-models
  - label: About dbt
    url: https://docs.getdbt.com/docs/introduction
  table:
    headers:
    - ''
    - Признак задачи
    - Сигнал «это точно сюда»
    - Примеры из Olist
    - Цена ошибки
    rows:
    - - WHEN SQL
      - Табличное, детерминированное, массовое; выражается операциями над таблицами
      - Вы можете описать результат как SELECT, не думая про порядок строк
      - staging, свёртка позиций до заказа, признаки, point-in-time агрегаты
      - Почти нет — SQL здесь дешевле и переносимее
    - - WHEN PYTHON
      - Нужны ML-библиотеки, спец. алгоритмы или процедурная логика над данными в хранилище
      - 'В SQL пришлось бы эмулировать цикл, обучение или внешнюю функцию'
      - Кластеризация продавцов, эмбеддинги описаний товаров, парсинг адресов
      - Данные едут в память; ломается на объёме, а не на логике
    - - WHEN NOT DBT
      - Обучение, стриминг с низкой задержкой, внешние API, произвольный ETL, сервинг
      - Задача вообще не про создание таблицы в хранилище
      - Обучение модели просрочки, инференс по запросу, забор CSV из внешнего источника
      - 'Самая дорогая: dbt становится плохим оркестратором и плохим сервером'
    col_ratios:
    - 3
    - 6
    - 5
    - 6
    - 5
  notes: |2
    [94:48–96:48 · ~2 мин] **Главное:**
    - Таблица для выбора инструмента, а не для запоминания.
    - Читать её надо по третьей колонке — там сформулирован !!распознаваемый сигнал!!, а не абстрактный критерий.

    **Рассказ:**
    - Проговорить критерий каждой строки.
    - **SQL** — по умолчанию.
    - Сигнал простой: вы можете описать нужный результат как SELECT, не рассуждая о порядке обработки строк.
    - Если можете — пишите SQL, он дешевле, переносимее и попадает в граф.
    - **Python** — когда в SQL пришлось бы эмулировать то, чего в нём нет: обучение, итеративный алгоритм, вызов внешней функции.
    - Сигнал — вы ловите себя на попытке написать цикл.
    - Цена ошибки здесь конкретная: код будет работать на выборке и упадёт на объёме, потому что данные едут в память.
    - **Не dbt** — когда задача не про создание таблицы в хранилище.
    - Это самая дорогая ошибка из трёх: !!попытка затащить обучение или сервинг в dbt!! превращает его в плохой оркестратор и плохой сервер одновременно.
    - Обучение живёт в оркестраторе рядом с dbt, а не внутри него.

    **Практический смысл:**
    - Практическая проверка перед тем, как писать Python-модель — два вопроса.
    - Сколько строк приедет в память и что произойдёт с этим числом через год.
    - Если ответ «столько же» — можно; если «в двадцать раз больше» — ищите SQL-формулировку.

    **Осторожно:**
    - Граница между строками подвижна и зависит от платформы.
    - На ClickHouse вторая строка пока пустая — Python-моделей нет, и остаётся либо OpenDBT с локальным исполнением, либо шаг в оркестраторе.

    **Переход:**
    - ~~«Раз обучение живёт снаружи — нужен тот, кто соединит dbt и обучение. Переходим к оркестрации».~~
