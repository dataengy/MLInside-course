     Community   Platforms   Ecosystem
     issues·PR   Snowflake   Airflow
     adoption    Databricks  Dagster
         │           │           │
         └───────────┼───────────┘
                     ↓
            влияют на roadmap
                     │
                     ↓
       ┌───────────────────────────┐
       │  dbt Labs / maintainers   │ ← FINAL
       │  внутри Fivetran          │   DECISION
       └───────────────────────────┘
                     ↓
              dbt Core roadmap

    # Apache 2.0 ≠ Apache-style governance
    # fork possible ≠ upstream control
  materials:
  - label: dbt Core v2
    url: https://docs.getdbt.com/blog/dbt-core-v2-is-here
  - label: roadmap v2
    url: https://github.com/dbt-labs/dbt-core/blob/main/docs/roadmap/2026-06-announcing-v2.md
  - label: dbt-core
    url: https://github.com/dbt-labs/dbt-core
  notes: |2
    **Главное:**
    - !!Открытая лицензия и открытое управление — разные вещи!!. dbt Core под Apache 2.0, но решение о том, что войдёт в релиз, принимают maintainers вендора.

    **TAKEAWAY TO REPEAT:**
    - dbt Labs controls upstream; the ecosystem shapes its direction.

    **Рассказ:**
    - Схема читается снизу вверх по влиянию и сверху вниз по решению.
    - Сообщество приносит issues, PR и сам факт использования; платформы — Snowflake, Databricks, BigQuery, Iceberg — тянут адаптеры и форматы под себя; экосистема оркестраторов приносит требования к интерфейсам.
    - Всё это формирует roadmap, но !!финальное «да» ставит вендор!!.
    - Astronomer здесь стоит назвать отдельно: он делает Cosmos и очень влияет на то, как dbt живёт в Airflow, но к управлению dbt Core отношения не имеет.

    **Практический смысл:**
    - Право на форк у вас есть, влияния на upstream оно не даёт.
    - Планируя зависимость от ещё не вышедшей фичи, ориентируйтесь на публичный roadmap, а не на обсуждение в issue.

    **Осторожно:**
    - Не превращать это в разговор «продались ли они Fivetran».
    - Вопрос практический: кто решает, что попадёт в следующий минор, и на что вы как пользователь можете повлиять.
