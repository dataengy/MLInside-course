  title: 'Картинка: та же модель после компиляции'
  image: pic-jinja-compiled.png
  bullets:
  - 'target/compiled: макросы развернулись в длинные CAST и CASE'
  - 'Отлаживают именно это, а не исходник из редактора'
  - 'Куда просится: «Где Jinja начинает вредить»'
  - 'Почему не встала: слайд уже показывает свою пару кодов'
  notes: |2
    **Главное:**
    - Та же модель из `target/compiled`: вместо вызовов макросов — развёрнутые `CAST`, `COALESCE` и `CASE` на всю ширину экрана.
    - Показывать её надо !!сразу после предыдущей!!, и лучше молча: разница между двумя скриншотами говорит сама.

    **Когда доставать:**
    - На слайде «Где Jinja начинает вредить», в момент про третий симптом — когда база жалуется на текст, которого вы не писали.
    - Отлаживают вот это, а не то, что в редакторе.

    **Практический смысл:**
    - Отсюда же правило отладки, которое стоит унести: сначала `dbt compile`, потом чтение `target/compiled`, и только потом гипотезы.
    - ~~Куда просилась: тот же слайд. Там уже стоит своя схема «хорошо / плохо», а второй визуал слайд не выдержит.~~
