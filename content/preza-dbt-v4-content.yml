    - Картинка справа — то, во что это превращается: страница модели в `dbt docs` с описанием, списком колонок, их типами, ограничениями и тестами.
    - Всё, что вы написали в YAML, стало навигируемым справочником.
    - Не разбирать: синтаксис `doc()`-блоков.

    **Практический смысл:**
