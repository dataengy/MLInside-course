    **Главное:**
    - Граф зависимостей настоящего dbt-проекта — сотни узлов.
    - Показывать её надо !!не для чтения, а для масштаба!!: одного взгляда достаточно, чтобы вопрос «зачем `ref()`, если можно написать имя таблицы» отпал сам.

    **Когда доставать:**
