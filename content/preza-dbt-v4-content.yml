- kind: content
  id: 033b-lineage-dva-voprosa
  title: 'Lineage: два вопроса и один граф'
  image: pic-dbt-lineage-graph.png
  bullets:
  - Граф строится сам — из ref() и source()
  - '«Откуда взялось» — вверх по графу: +модель'
  - '«Что сломается» — вниз по графу: модель+'
  - exposure добавляет в граф то, что живёт вне dbt
  code_caption: селекторы графа — те же и в docs, и в CI
  code_lang: bash
  code: |2
    # от чего зависит витрина признаков
    dbt ls --select +mart_delivery_features

    # кто пострадает, если её тронуть
    dbt ls --select mart_delivery_features+

    # собрать модель вместе со всем ниже
    dbt build --select stg_orders+
  notes: |2
    [71:42–73:12 · ~1.5 мин] **Главное:**
    - lineage в dbt !!не описывают, его выводят!!.
    - Граф — побочный продукт того, что вы писали `ref()` вместо имени таблицы.

    **Рассказ:**
    - Показать картинку справа — обычный lineage-граф из `dbt docs`: слева источники, дальше staging, справа витрины.
    - Стрелки нарисовал не человек.
    - Дальше два селектора слева, и это главное, что нужно унести.
    - `+Модель` — вверх: от чего она зависит, откуда пришли данные.
    - `Модель+` — вниз: кто её читает и что сломается.
    - Один и тот же синтаксис работает в `dbt ls` для анализа, в `dbt build` для сборки и в CI для Slim CI.

    **Практический смысл:**
    - Третий пункт — про `exposure`.
    - Обученная модель, дашборд или витрина, которую читает внешний сервис, живут вне dbt, и граф про них не знает.
    - Объявленный exposure втаскивает их в тот же граф, и вопрос «кто пострадает» получает полный ответ.
    - Разберём его в блоке дополнительных возможностей.

    **Пример:**
    - Перед правкой `stg_orders` полезно выполнить `dbt ls --select stg_orders+` и увидеть, что от неё зависит семнадцать моделей и одна обучающая выборка.

    **Осторожно:**
    - Граф честен ровно настолько, насколько дисциплинированно писали `ref()`.
    - Одно захардкоженное `from analytics.stg_orders` — и целая ветка графа исчезает, а вместе с ней и порядок сборки.

    **Переход:**
    - ~~«Теперь соберём тесты в барьер перед обучением».~~
- kind: content
  id: 034-quality-gate-pered-obucheniem
  title: 'Quality gate: тесты как предусловие обучения'
  code_lang: diagram
  code: |2
      dbt source freshness          # сырьё за сегодня вообще доехало?
              │
       ┌──────┴──────┐
      НЕТ            ДА
       │              ↓
     STOP        dbt build          # модели собраны И тесты прогнаны по графу
     алерт             │              (модель со сломанным тестом → потомки skip)
                       ↓
                tests passed ?
                       │
       ┌───────────────┴───────────────────┐
      NO                                  YES
       │                                   ↓
       ↓                          build_training_dataset
    STOP + алерт                           │
    training НЕ запускается                ↓
    в проде остаётся                  train_model
    предыдущая версия модели               │
                                           ↓
                                    evaluate_model      # второй барьер:
                                           │              метрика vs baseline
                                           ↓
                                     register_model
     ────────────────────────────────────────────────────────────────────────
     severity: error  →  блокирует сборку   |   severity: warn  →  только лог
  notes: |2
    [73:12–75:12 · ~2 мин] **Главное:**
    - !!Красные тесты обязаны останавливать обучение!!.
    - Не «предупреждать» — останавливать.

    **TAKEAWAY TO REPEAT:**
    - Красный data contract должен остановить training до того, как плохие данные превратятся в плохую модель.

    **Рассказ:**
    - На схеме два барьера и одна проверка перед ними.
    - Сначала `dbt source freshness`: если сырьё не доехало, дальше идти незачем — витрина честно пересчитается по вчерашним данным и никто этого не заметит.
    - Дальше `dbt build`.
    - Это не `dbt run`: команда собирает модель и тут же прогоняет её тесты, идя по графу.
    - Модель, чей тест упал, считается сломанной, и всё, что от неё зависит, !!пропускается!! — это встроенное поведение, его не надо программировать.
    - Дальше решение оркестратора: тесты зелёные → идём в обучение; красные → останавливаемся и шлём алерт, а в проде продолжает работать !!предыдущая версия модели!!.
    - Внизу схемы — второй барьер, `evaluate_model`: даже на чистых данных модель может выйти хуже текущей.
    - Это разные отказы, и точки останова у них разные.

    **Для MLE:**
    - Самый дорогой сценарий в ML-проде — не упавший пайплайн, а !!молча переобученная на битых данных модель!!.
    - Упавший пайплайн заметят за час.
    - Просевшую метрику — через неделю, в лучшем случае.

    **Пример:**
    - ingestion привёз половину заказов за день.
    - Тест `equal_rowcount` красный → training не стартовал → в проде работает вчерашняя модель.
    - Именно это и нужно.

    **Осторожно:**
    - Нижняя строка схемы.
    - Различайте `severity`: часть проверок должна быть `warn`, иначе команда быстро научится игнорировать красное.
    - Блокирующими делайте те, что действительно ломают обучение.

    **Переход:**
    - ~~«Добавим тесты и документацию на нашу сквозную схему».~~
