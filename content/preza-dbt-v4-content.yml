- kind: content
  id: 012-skvoznaya-arhitektura
  title: 'Сквозная архитектура: где живёт dbt'
  code_lang: diagram
  materials:
  - label: 🔍 картинка — modern data stack ELT to ML pipeline
    url: https://www.google.com/search?tbm=isch&q=modern+data+stack+ELT+dbt+to+ML+pipeline+architecture
    highlight: true
  code: |2
      RAW   olist_raw:  orders · order_items · sellers · customers · products
                                             │
    ┌────────────────────────────────────────↓───────────────────────────────────────┐
    │                                D B T   Z O N E                                 │
    │                                                                                │
    │  sources    ──→   staging    ──→   intermediate   ──→   feature marts          │
    │  olist_raw        stg_orders       int_order_level      mart_delivery_features │
    │                   stg_order_items                                              │
    │                   stg_sellers                                                  │
    └────────────────────────────────────────┬───────────────────────────────────────┘
                                             │
                                             ↓
          training dataset ──→ train model ──→ model registry ──→ inference
  notes: |2
    [~2.5 мин] **Главное:** !!dbt отвечает ровно за рамку в середине!! — от sources до feature marts. Всё, что ниже рамки, — уже ML-пайплайн.

    **Рассказ:** это опорная схема лекции, к ней мы вернёмся ещё три раза, каждый раз обогащая её. Пройти сверху вниз: сырые таблицы Olist приезжают в ClickHouse как есть; dbt объявляет их как **sources**; **staging** приводит типы и считает базовые флаги; **intermediate** собирает заказ в одну строку; **feature marts** — это уже витрина признаков. Дальше начинается ML: обучающая выборка, обучение, реестр моделей, инференс.

    **Для MLE:** обратите внимание, где проходит граница ответственности. Спор «чьё это» решается рамкой: всё в рамке — код в dbt-репозитории, всё под рамкой — ваш training pipeline.

    **Пример:** задача Olist — предсказать просрочку доставки (`is_late_delivery`). Именно она будет ехать с нами через всю лекцию.

    **Осторожно:** рамка — не «dbt делает ETL». Ingestion (загрузка CSV в ClickHouse) остаётся снаружи, сверху.

    **Переход:** ~~«Теперь переведём каждое понятие dbt на язык MLOps — это, пожалуй, главный слайд лекции».~~
- kind: content
  id: 013-mlops-smysl-konceptov-dbt
  title: 'MLOps-смысл ключевых концепций dbt'
  code_lang: diagram
  code: |2
    source()        ──→  откуда пришли данные для признака
    ref()           ──→  граф зависимостей и lineage признака
    test            ──→  не запускаем training на сломанной feature-таблице
    docs            ──→  определение признака, владелец, семантика
    incremental     ──→  не пересчитываем всю историю признаков
    CI              ──→  изменение SQL-признака проходит review + автотесты
    orchestrator    ──→  dbt build завершился успешно → запускаем training
  notes: |2
    [~3 мин] **Главное:** каждая «фича dbt» — это ответ на конкретный вопрос MLOps. Если студент унесёт из лекции один слайд, пусть это будет этот.

    **Рассказ:** идти по строкам медленно, на каждой давать один вопрос из практики.

    `source()` — «откуда взялась эта колонка?». Объявленный источник даёт ответ в коде, а не в переписке.

    `ref()` — «что сломается, если я изменю stg_orders?». Граф отвечает за секунды: `dbt build --select stg_orders+`.

    `test` — «можно ли учиться на этой таблице сегодня?». Тест — это !!предусловие обучения!!, а не отчёт о качестве.

    `docs` — «что означает delivery_delay_days и кто владелец?». Определение лежит рядом с кодом и не расходится с ним.

    `incremental` — «сколько стоит обновить признаки за вчера?». Разница между полным сканом истории и одним днём — это ваш счёт за compute.

    `CI` — «кто проверил, что новый признак не сломал витрину?». Ревью SQL становится обязательным, как ревью Python.

    `orchestrator` — «когда можно запускать обучение?». Ответ: !!когда dbt build прошёл вместе с тестами!!, и никак иначе.

    **Для MLE:** это переводная таблица между двумя словарями. Держите её под рукой, когда будете объяснять коллегам, зачем вам dbt.

    **Осторожно:** не превращать в перечисление возможностей. Каждая строка — это вопрос, на который раньше не было машинного ответа.

    **Переход:** ~~«Дальше — как это работает изнутри: что dbt на самом деле делает с вашим SQL».~~
- kind: content
  id: 014-chto-takoe-dbt-kompilyaciya
  title: 'Что такое dbt: компиляция, ref() и DAG'
  bullets:
  - 'Модель — это файл .sql с одним SELECT; физическую форму задаёт config()'
  - 'dbt компилирует Jinja → чистый SQL и сам добавляет DDL'
  - 'ref() возвращает имя таблицы и одновременно строит ребро графа'
  - 'Порядок сборки dbt выводит из графа — вручную его никто не пишет'
  code_caption: models/staging/stg_orders.sql → target/run/…
  code_lang: sql
  code: |2
    -- модель: только SELECT + декларация формы
    {{ config(materialized='view') }}

    select
      order_id,
      customer_id,
      order_status,
      order_purchase_timestamp
    from {{ source('olist_raw', 'orders') }}

    -- target/run: dbt подставил relation
    -- и сам обернул это в DDL
    create view analytics.stg_orders as
    select
      order_id,
      customer_id,
      order_status,
      order_purchase_timestamp
    from olist_raw.orders;
  notes: |2
    [~1.5 мин] **Главное:** вы пишете SELECT и объявляете, чем он должен стать; DDL, порядок и зависимости — забота dbt.

    **Разбор кода:** показать три вещи. Первое — `config(materialized=...)`: это !!декларация физической формы!!, а не команда. Второе — `source('olist_raw', 'orders')` превратился в `olist_raw.orders`. Третье — нижний блок: `create view ... as` вы не писали, dbt дописал сам.

    Не разбирать: список колонок, он тут только для правдоподобия.

    **Для MLE:** аналогия — вы описываете, что должно получиться, а не как это построить. Ровно как в декларативной конфигурации инфраструктуры.

    **Пример:** посмотреть готовый SQL можно всегда: `dbt compile --select stg_orders`, потом открыть `target/compiled/...`. Это первый инструмент отладки.

    **Осторожно:** типичная ошибка новичка — писать в модели `from analytics.stg_orders` вместо `{{ ref('stg_orders') }}`. Запрос отработает, но !!ребро графа не появится!!, и порядок сборки станет случайным.

    **Переход:** ~~«Теперь разложим проект по слоям — кто за что отвечает».~~
