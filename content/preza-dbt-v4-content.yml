    url: https://docs.getdbt.com/docs/build/exposures
  - label: Model contracts
    url: https://docs.getdbt.com/docs/collaborate/govern/model-contracts
  - label: Model access
    url: https://docs.getdbt.com/docs/collaborate/govern/model-access
  code_caption: models/marts/_marts__exposures.yml · контракт витрины
  code_lang: yaml
  code: |2
    exposures:
      - name: delivery_delay_model
        type: ml               # dashboard | notebook | ml | application
        maturity: high
        owner: {name: ML Platform, email: ml@example.com}
        url: https://mlflow.internal/models/delivery_delay
        description: >
          Модель предсказания просрочки. Учится на
          mart_delivery_features, инференс батчем ночью.
        depends_on:
          - ref('mart_delivery_features')
          - ref('int_seller_delay_history')

    models:
      - name: mart_delivery_features
        config: {contract: {enforced: true}}
        access: public
        columns:
          - name: order_id
            data_type: string
            constraints: [{type: not_null}]
  notes: |2
    [132:54–134:54 · ~2 мин] **Главное:**
    - !!exposure — это способ сказать графу про то, что живёт вне dbt!!.
    - Без него граф обрывается на последней витрине, и вопрос «кто сломается» остаётся без машинного ответа.

    **Разбор кода:**
    - Верхний блок — объявление обученной модели как потребителя.
    - `type: ml` (бывают ещё dashboard, notebook, application), владелец с почтой, ссылка на реестр моделей и, главное, `depends_on` — от каких моделей она зависит.
    - Что это даёт практически.
    - Во-первых, exposure появляется в `dbt docs` как узел графа, и по нему видно всю цепочку от сырых таблиц до модели.
    - Во-вторых, работают селекторы: `dbt ls --select +exposure:delivery_delay_model` покажет всё, что нужно собрать перед обучением, а `dbt build --select mart_delivery_features+` теперь честно включает и exposure.
    - Нижний блок — **contract**.
    - `enforced: true` фиксирует схему витрины: типы и ограничения проверяются на сборке, и попытка молча поменять тип колонки падает !!до того!!, как обучение получит другие данные.
    - Для feature mart это дешёвая страховка.

    **Практический смысл:**
    - Три строки `access` и `groups` пригодятся, когда проектов становится больше одного: модель `private` видна только внутри своей группы, `public` — снаружи.
    - Это основа dbt-mesh, но полезно и в одном репозитории — как явная граница «сюда можно ссылаться, сюда нельзя».

    **Осторожно:**
    - exposure — это !!объявление, а не автоматика!!. dbt не проверяет, что модель действительно читает эту витрину; вы отвечаете за то, чтобы `depends_on` соответствовал реальности.
    - Устаревший exposure хуже отсутствующего.

    **Переход:**
    - ~~«Groups и access мы только назвали — посмотрим, во что они вырастают, когда доменов становится несколько».~~
- kind: content
  id: 061h2-data-mesh-domeny-i-kontrakty
  title: 'Data Mesh в dbt: домены и контракты'
  bullets:
  - 'Mesh — не новая модель данных, а разделение dbt-ландшафта по доменам при одном графе'
  - 'domain ownership → groups и отдельные проекты; интерфейс дата-продукта → access: public'
  - 'Внутренние модели → access: private/protected; договор доменов → contract: enforced'
  - 'Зависимости → ref() и project dependencies; discoverability → docs, lineage, metadata'
  - 'Controlled evolution → model versions; потребители вне dbt → exposures'
  - 'Внутри домена реализация свободна, наружу — стабильный public interface'
  - 'Итог: decentralized ownership + explicit contracts + one dependency graph'
  materials:
  - label: Model access
    url: https://docs.getdbt.com/docs/collaborate/govern/model-access
  - label: Project dependencies
    url: https://docs.getdbt.com/docs/collaborate/govern/project-dependencies
  - label: Model versions
    url: https://docs.getdbt.com/docs/collaborate/govern/model-versions
  code_caption: models/_domains.yml · граница домена как код
  code_lang: yaml
  code: |2
    # DOMAIN commerce                 │ DOMAIN ml-platform
    # stg_* → int_*  (private)        │ int_features (private)
    #          ↘ orders_public ──ref()──→ mart_delivery_features
    #            public + contract    │      ↓ exposure: delivery_delay_model

    groups:
      - name: commerce
        owner: {name: Commerce Data}

    models:
      - name: orders_public          # интерфейс домена наружу
        group: commerce
        access: public
        config: {contract: {enforced: true}}

      - name: int_orders_internal    # реализация; наружу не видна
        group: commerce
        access: private

    # Mesh ≠ папки marts по доменам · ≠ один гигантский repo · ≠ микросервисность
  notes: |2
    [134:54–136:54 · ~2 мин] **Главное:**
    - !!dbt Mesh — это не отдельная модель данных, а способ разделить большой dbt-ландшафт между доменными командами, сохранив единый dependency graph и контракты между ними!!.

    **Рассказ:**
    - Классический Data Mesh шире dbt: это ещё и организационная модель, ownership, governance и platform capabilities. dbt закрывает ровно один слой этой картины — !!transformation / analytics layer!!.
    - Зато закрывает машинно.
    - Связка `groups + access + contracts + versions + cross-project refs` превращает границу между командами из договорённости в проверяемый интерфейс: нарушение ловится на сборке, а не на созвоне.
    - Прочитать соответствие по буллетам сверху вниз: слева идея Mesh, справа механизм dbt.

    **Разбор кода:**
    - Схема сверху — два домена и одна стрелка между ними.
    - Внутри `commerce` живут `stg_*` и `int_*`, они `private`; наружу опубликована ровно одна модель `orders_public` с `access: public` и `contract: enforced`.
    - Домен `ml-platform` ссылается на неё через `ref()` и строит свою витрину признаков, а её потребитель — обученная модель — объявлен exposure со вчерашнего слайда.
    - Ниже тот же контур в YAML: `groups` с владельцем, публичная модель с контрактом и внутренняя модель, закрытая `access: private`.
    - Это два десятка строк, но именно они делают границу домена частью кода.

    **Практический смысл:**
    - Правило одно: !!внутри домена команда свободна менять реализацию; наружу она обязана сохранять стабильный public interface!!.
    - В нашем примере это значит, что ML-команда цепляется за `commerce.orders_public`, а не за `stg_*` и `int_*` домена Commerce: `commerce.orders_public → ml-platform.mart_delivery_features → delivery_delay_model`.
    - Переименовали внутреннюю модель у себя — никто не сломался.
    - Меняете публичную — это смена версии, а не тихий коммит.

    **Осторожно:**
    - Data Mesh ≠ папки `marts` по доменам, ≠ один гигантский dbt repo и ≠ обязательная микросервисность.
    - Выигрыш появляется, когда доменов реально несколько и они относительно автономны; для маленького проекта один репозиторий проще и дешевле.
    - И не путать !!dbt Mesh как архитектурный паттерн!! с конкретными коммерческими возможностями dbt Cloud: `groups`, `access`, `contracts` и `versions` есть в dbt Core.
    - Продолжение предыдущего слайда: `groups` и `access` полезны не сами по себе, а когда появляются настоящие организационные границы.

    **Переход:**
    - ~~«А теперь вернёмся к нашей витрине и посмотрим, что в ней получилось».~~
- kind: table
  id: 062-priznaki-mart-delivery-features
  title: 'mart_delivery_features: что внутри витрины'
  table:
    headers:
    - Признак
    - Откуда
    - Осторожно
    rows:
    - - item_count, seller_count
      - Свёртка stg_order_items до заказа
      - Считать до join, иначе строки размножатся
    - - total_price, freight_value
      - Суммы позиций заказа
      - 'coalesce(...,0) корректен: «нет позиций» = ноль'
    - - freight_share
      - safe_divide(freight, total)
      - Деление на ноль → NULL, не inf
    - - customer_seller_distance_km
      - geolocation по zip-префиксам, гаверсинус
      - У части заказов координат нет → NULL
    - - product_weight_g
      - Средний вес позиций заказа
      - У 610 товаров категория и вес отсутствуют
    - - order_hour, order_dow
      - Части даты покупки, посчитаны в staging
      - Считать один раз в staging, не в каждой витрине
    - - seller_avg_delay_90d
      - int_seller_delay_history, point-in-time
      - Только завершённые ДО момента покупки
    - - target_is_late
      - stg_orders, сравнение факта с обещанием
      - 'NULL = исход неизвестен, исключать из обучения'
    col_ratios:
    - 4
    - 5
    - 6
  notes: |2
    [136:54–138:24 · ~1.5 мин] **Главное:**
    - Итоговая витрина одной таблицей — и у каждого признака есть своя ловушка.

    **Рассказ:**
    - Не читать всё.
    - Взять три строки с самыми поучительными оговорками: `freight_share` (деление на ноль), `seller_avg_delay_90d` (point-in-time) и `target_is_late` (NULL как третье состояние).

    **Практический смысл:**
    - Обратите внимание, что колонка «Осторожно» — это по сути !!список тестов, которые надо написать!!.
    - Почти каждая строка превращается в проверку в `_marts__models.yml`.

    **Пример:**
    - «У части заказов координат нет» → тест на долю NULL, а не на их отсутствие.
    - Признак имеет право быть пустым; он не имеет права быть пустым у половины выборки.

    **Осторожно:**
    - Не подавать это как «правильный набор признаков».
    - Это иллюстрация того, как выглядит витрина, за которую кто-то отвечает.

    **Переход:**
    - ~~«И финальная картинка».~~
- kind: content
  id: 063-finalnyj-vizual
  title: 'Итог: где вы стоите'
  code_lang: diagram
  code: |2
                                  RAW DATA
                                     │
                                     ↓
                       DBT DATA / FEATURE LAYER
             versioned · modular · tested · documented ·
                incremental · observable · orchestrated
                                     │
                    ┌────────────────┼────────────────┐
                    ↓                ↓                ↓
             training dataset   batch inference   BI / отчёты
                    │
                    ↓
                                ML PIPELINE
             training ─ evaluation ─ registry ─ serving ─ monitoring
                                     │
                                     ↓
                                PRODUCTION
     ─────────────────────────────────────────────────────────────────────
     ЧТО ВЫ УНОСИТЕ

     1. Подготовка признаков — инженерный слой, а не набор скриптов
     2. Тест — предусловие обучения, а не отчёт о качестве
     3. Point-in-time correctness SQL за вас не проверит
     4. Граница dbt проходит по training dataset
  notes: |2
    [138:24–139:54 · ~1.5 мин] **Главное:**
    - Финальный тезис лекции, произнести его вслух целиком.

    **Рассказ:**
    - !!dbt — не инструмент «для аналитиков» и не замена ML-пайплайна.!! Это способ превратить слой трансформаций и признаков в software-engineered компонент production data/ML-системы: версионируемый, модульный, тестируемый, документированный, инкрементальный, наблюдаемый и оркеструемый.
    - Семь свойств в середине схемы — это ровно те восемь пунктов, с которых мы начинали, только теперь за каждым стоит конкретный механизм, который мы разобрали.
    - Обратить внимание на развилку под слоем: одна и та же витрина кормит !!три разных потребителя!! — обучающую выборку, батч-инференс и обычную аналитику.
    - Это и есть главный аргумент в пользу того, чтобы держать её общей, а не заводить свою в каждом ноутбуке.

    **Для MLE:**
    - Четыре пункта внизу — то, что стоит унести, если всё остальное забудется.
    - Третий проговорить отдельно: !!point-in-time correctness — единственное свойство из этого списка, которое ни один тест не проверит за вас!!.

    **Переход:**
    - ~~«Проверим себя вопросами».~~
