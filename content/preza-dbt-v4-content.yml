    - Замените «аналитическая работа» на «подготовка признаков» — и получите список того, чего вашему feature layer сегодня не хватает.

    **Осторожно:**
    - Viewpoint — исторический документ, а не спецификация продукта.
    - Часть формулировок про «данные доступны всем» плохо стыкуется с требованиями к персональным данным; читать его стоит как манифест, а не как политику доступа.

    **Переход:**
    - ~~«А теперь узнайте в этом описании себя».~~
