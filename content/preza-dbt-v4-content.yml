    - `BashOperator` — честный первый шаг: одна строка, работает, понятно.
    - Его недостаток один, но важный: !!весь dbt-граф выглядит в Airflow как одна задача!!.
    - Упало — идите читать логи целиком.
    - Про готовые операторы сказать честно: экосистема обёрток вокруг dbt менялась несколько раз, часть старых проектов больше не поддерживается.
    - Проверяйте статус, прежде чем брать.
