    **Рассказ:** идти по строкам парами. Заметить, что !!строка «единица исполнения» одинаковая!! — оба разворачивают dbt-граф в задачи Airflow. Различие начинается на строке «владение Airflow»: Cosmos требует, чтобы вы писали DAG сами, dmp-af прячет Airflow от автора моделей.

    Отсюда и sweet spot. Cosmos — когда dbt один из шагов в большом пайплайне, где рядом ingestion, обучение и деплой. dmp-af — когда dbt-проект сам по себе большой, разделён по доменам, и им владеют люди, которым Airflow неинтересен.

    **Для MLE:** для нашего сценария — ingestion, dbt, обучение, реестр — !!Cosmos подходит лучше!!, потому что dbt здесь честно один шаг из пяти. Именно на нём построим пример.

    **Осторожно:** оба проекта развиваются. Перед выбором сверяйтесь с текущей документацией — детали в этой таблице живут не вечно.

