  notes: |2
    [38:06–39:06 · ~1 мин] **Главное:**
    - Таблица отвечает на один вопрос — !!что можно делать в каждом слое, а что нельзя!!.

    **TAKEAWAY TO REPEAT:**
    - `sources → staging → [intermediate] → marts` — это разделение ответственности, а не просто структура каталогов.

    **Рассказ:**
    - Три правила, которые стоит проговорить вслух.
    - В staging — одна модель на один источник, без джойнов: только чистка и типы.
    - В intermediate появляются соединения, и здесь же !!фиксируется гранулярность!! — модель обязана называть, что такое одна её строка.
    - В marts — витрины под конкретного потребителя.
    - Ключевое отличие этой лекции от классического рассказа про dbt: !!marts — это не только BI!!.
    - Feature mart — полноправная витрина, у которой потребитель не дашборд, а обучение.

    **Практический смысл:**
    - Гранулярность — источник самых дорогих ошибок.
    - Заказ и позиция заказа в Olist различаются: 99 441 против 112 650 строк.
    - Посчитаете «среднее по заказам» на позициях — многопозиционные заказы получат больший вес, и признак поедет.

    **Переход:**
    - ~~«Что ломается, когда эти правила нарушают».~~
- kind: content
  id: 015b-pravila-sloev
  title: 'Правила слоёв: что ломается и чем это ловится'
  image: pic-model-layers-principles.jpg
  bullets:
  - mart читает source мимо staging — ломается
  - Джойн в staging — гранулярность поехала
  - Rejoin и fanout — невидимые дубли
  - 'Ловится машинно: dbt_project_evaluator'
  code_lang: diagram
  code: |2
     ПЛОХО                 ХОРОШО
     ───────────────       ───────────────
     mart → source         mart → int
     stg  → join           stg  → 1 источник
     int  → int  → int     явный слой
     view → view → view    table на узле
  materials:
  - label: dbt-project-evaluator
    url: https://github.com/dbt-labs/dbt-project-evaluator
  notes: |2
    [39:06–40:36 · ~1.5 мин] **Главное:**
    - Правила слоёв держатся ровно до первого дедлайна.
    - Поэтому их !!проверяют машинно!!, а не договорённостью.

    **Рассказ:**
    - Пройти по левой колонке схемы — это пять типовых нарушений, каждое из которых встречается в любом проекте старше полугода.
    - `mart → source` — витрина сходила в сырьё напрямую.
    - Работает, пока источник не поменял тип колонки; после этого падает не staging (где это было бы видно), а витрина в проде.
    - `join` в staging — самое дорогое.
    - Гранулярность там никто не проверяет, потому что слой «простой», а строка после джойна уже не одна на заказ.
    - `int → int → int` — цепочка промежуточных моделей без явного смысла.
    - Каждая по отдельности понятна, вместе они нечитаемы.
    - `view → view → view` — вьюха на вьюхе.
    - Для BI-запроса раз в день это ничего не стоит; для витрины признаков, которую читают на каждой сборке обучающей выборки, это часы compute.

    **Практический смысл:**
    - Картинка справа — канонический вид слоёв из документации dbt.
    - Держите её как эталон и сравнивайте со своим `models/`: если каталог не раскладывается на эти три группы, слои у вас на бумаге, а не в проекте.

    **Осторожно:**
    - Нарушение бывает осознанным.
    - Правильный ход — не отключать правило, а оформить исключение (в `dbt_project_evaluator` это seed), чтобы для всех остальных моделей правило продолжало работать.

    **Как это называется в отчёте:**
    - У каждого нарушения из левой колонки есть имя правила, и по нему удобно искать.
    - `mart → source` — `fct_marts_or_intermediate_dependent_on_source`.
    - Джойн источников в staging — `fct_multiple_sources_joined`.
    - Сущность, пришедшая двумя путями, — `fct_rejoining_of_upstream_concepts`.
    - Цепочка вьюх — `fct_chained_views_dependencies`.
    - Запускается это одной строкой: `dbt build --select package:dbt_project_evaluator`, и слой перестаёт быть договорённостью, становясь тестом в CI.

    **Переход:**
    - ~~«Слои — это один способ раскладки. Посмотрим, какие ещё бывают».~~
- kind: table
  id: 015c-kogda-prostyh-marts-malo
  title: Когда простых marts мало
  materials:
  - label: AutomateDV
    url: https://automate-dv.readthedocs.io/en/latest/macros/
  - label: Activity Schema
    url: https://www.activityschema.com/
  table:
    headers:
    - Паттерн
    - Что решает
    - Структура
    - Когда нужен
    rows:
    - - Medallion
      - Уровни зрелости и качества данных
      - bronze → silver → gold
      - Lakehouse, многоступенчатая очистка, общий словарь с соседями
    - - Kimball
      - Аналитическая модель бизнеса
      - Факты и измерения
      - BI и метрики, когда вокруг вас дашборды и отчётность
    - - Data Vault 2.0
      - Интеграция источников и история
      - hub + link + satellite → marts
      - Сложный EDW, много источников, требование аудируемости
    - - Activity / Event
      - Временная модель событий
      - entity + ts + activity
      - Поведенческая аналитика и оконные признаки для ML
    - - 3NF / EDW
      - Нормализованная корпоративная модель
      - Сущности без избыточности
      - Много систем-источников и общий словарь на всю компанию
    - - Wide / OBT
      - Одна таблица под одного потребителя
      - Денормализованная широкая таблица
      - Витрина признаков по форме — это именно OBT
    col_ratios:
    - 3
    - 4
    - 4
    - 6
  notes: |2
    [40:36–42:36 · ~2 мин] **Главное:**
    - Это не конкурс «какой подход правильный», а четыре разных ответа на вопрос !!что считать единицей модели данных!!.
    - Ни один из них не является требованием dbt.

    **Рассказ:**
    - По строкам, по фразе на паттерн.
    - **Medallion** — bronze / silver / gold.
    - Читается за минуту и хорош как общий словарь с соседними командами.
    - Но это !!паттерн слоистости и зрелости, а не методология моделирования сущностей!!: внутри уровня он не говорит ничего.
    - **Kimball** — факты и измерения вокруг бизнес-процесса.
    - Сильная сторона — понятность аналитику; слабая — переделка измерений при изменении источника.
    - **Data Vault 2.0** решает ровно эту боль: hub (бизнес-ключ), link (связь) и satellite (атрибуты с историей) разделены, поэтому новый источник __добавляется рядом новым сателлитом__, а существующие таблицы не переписываются.
    - Руками такой SQL не пишут — его генерирует **AutomateDV** по метаданным.
    - **Activity / Event** — одна широкая таблица активностей: `entity_id`, `ts`, `activity`, полезная нагрузка.
    - Признаки считаются оконными функциями по времени, и !!point-in-time получается почти бесплатно!!: у каждой строки уже есть её собственный момент.
    - В ClickHouse ложится идеально — одна `MergeTree` с `ORDER BY (entity_id, ts)`.

    **Формы хранения:**
    - Две нижние строки таблицы стоят особняком: это не способы моделировать бизнес, а способы класть данные.
    - **3NF / EDW** живёт в корпоративном ядре; **Wide / OBT** — на выходе, под конкретного потребителя.
    - !!Витрина признаков по форме — это ровно OBT!!, и это нормально: денормализация здесь не грех, а требование обучения.

    **Для MLE:**
    - В контексте ClickHouse и признаков выбор сводится к двум строкам.
    - Kimball удобен, когда вокруг вас BI.
    - Activity Schema удобнее, когда вокруг вас события и оконные признаки, — а у ML-задач это чаще так.

    **Осторожно:**
    - Три частых заблуждения, которые стоит назвать вслух.
    - «Medallion — это те же staging / intermediate / marts» — !!нет!!: это разные оси, уровень зрелости и слой DAG не совпадают.
    - «dbt требует звёздную схему» — не требует.
    - «`intermediate` обязателен» — не обязателен.
    - И главное: !!не выбирать подход под красоту схемы!!.
    - Data Vault для одного продуктового источника — оверинжиниринг; Activity Schema для финансовой отчётности — мучение.

    **Переход:**
    - ~~«Посмотрим, что из этого реально стоит взять под ML-витрину».~~
- kind: content
  id: 015d-raw-sloj-i-mle-vitriny
  title: 'Что брать под ML: raw и витрина под задачу'
  code_caption: 'два решения: raw без моделирования · витрина под ОДНУ задачу'
  code_lang: sql
  code: |2
    -- RAW: только объявление, ноль логики
    sources:
      - name: olist_raw          # схема 1:1 с источником
        tables: [orders, order_items, sellers]

    -- ACTIVITY-подобный промежуточный слой: одна строка = одно событие
    {{ config(materialized='incremental',
              engine='MergeTree()',
              order_by='(seller_id, activity_ts)') }}
    select seller_id                        as entity_id,
           order_delivered_customer_date    as activity_ts,
           'order_delivered'                as activity,
           delay_days                       as value
    from {{ ref('stg_orders') }}
    where order_delivered_customer_date is not null

    -- ПРИЗНАК: оконный срез по этой таблице — point-in-time почти бесплатно
    select entity_id,
           avgIf(value, activity_ts <  o.order_purchase_timestamp
                    and activity_ts >= o.order_purchase_timestamp - interval 90 day)
             as seller_avg_delay_90d
    from {{ ref('int_seller_activity') }}
  notes: |2
    [42:36–44:36 · ~2 мин] **Главное:**
    - Два решения, которые определяют всё остальное: !!raw кладём без моделирования!! и !!витрину делаем под задачу, а не про запас!!.

    **Разбор кода:**
    - Три блока.
    - Первый — объявление source: схема один к одному с источником, никакой логики.
    - Второй — промежуточный слой в духе Activity Schema: одна строка = одно событие продавца, ключ сортировки `(entity_id, activity_ts)`.
    - Третий — признак поверх него: оконный срез с ограничением сверху по моменту заказа.
    - Обратить внимание на третий блок: !!условие point-in-time здесь пишется одной строкой!!, потому что у каждого события уже есть его собственный момент.
    - В классической раскладке за это же отвечает отдельная модель с self-join — мы её увидим в блоке про инкрементальность.

    **Для MLE:**
    - Правило про витрину «под задачу» проговорить отдельно.
    - Соблазн собрать одну большую `mart_all_features` есть всегда.
    - Через квартал в ней будет сорок колонок, из которых используются семь, а поддерживать придётся все сорок: каждая — обязательство перед проде.
    - Правильный ход — общий intermediate со всеми событиями и тонкие витрины поверх, по одной на модель.

    **Пример:**
    - Olist — `mart_delivery_features` под задачу просрочки.
    - Появится задача про отток продавцов — это отдельная витрина поверх того же `int_seller_activity`, а не ещё десять колонок в существующей.

    **Осторожно:**
    - raw «как есть» не означает «без контроля».
    - Freshness и тесты на ключи ставятся именно на source — но это проверки, а не преобразования.

    **Переход:**
    - ~~«Смотрим, как это выглядит на Olist целиком».~~
