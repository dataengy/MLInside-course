- kind: title
  id: 001-sovremennaya-orkestraciya-ml
  title: Современная оркестрация ML-пайплайнов
  subtitle: Dagster
  notes: 'Приветствие. Сегодня разбираем **Dagster** — оркестратор, который предложил принципиально другую
    модель: не «запусти задачи в правильном порядке», а !!опиши, какие данные должны существовать!!.


    Цель лекции — понять __архитектуру и все сущности Dagster__, увидеть разницу между **dev** и **prod**,
    глубоко разобрать **интеграцию с dbt**, сравнить с **Airflow**, **Prefect** и другими, и закончить
    домашним заданием. ~~Вопросы удобнее задавать по ходу.~~


    — Сгенерировано: model=claude-fable-5 · harness=Claude Code · effort=max · version=v1.1 · 2026-08-13'
- kind: agenda
  id: 002-plan-lekcii
  title: План лекции
  bullets:
  - Контекст, история и настоящее Dagster
  - 'Архитектура: assets, jobs, schedules, sensors, partitions, backfills'
  - Dev- и prod-режимы, Dagster OSS против Dagster+
  - 'dbt: сценарии интеграции, multi-dbt, сравнение с Airflow + Cosmos'
  - SQLMesh, dlt и Airbyte
  - CLI и MCP
  - Рынок, покупка со стороны Prefect, конкуренты и будущее
  - Домашнее задание
  notes: 'Пройдёмся по плану. Начнём с того, __зачем вообще нужен оркестратор__ и почему после Airflow
    появилось новое поколение инструментов.


    Основная и самая практическая часть — !!сущности Dagster!!: **assets**, **jobs**, **schedules**, **sensors**,
    **partitions**, **backfills**, **code locations**. Затем — **dev vs prod**, блок про **dbt** (это
    ключевая связка для нашего курса), сравнения с конкурентами и **ДЗ**. ~~Держим ориентир на этот план.~~

    '
- kind: section
  id: 003-kontekst-istoriya-i-nastoyaschee
  title: Контекст, история и настоящее
  notes: 'Первый блок — вводный и исторический.


    Разберёмся, __какую боль решает оркестратор__, откуда взялся **Dagster**, кто за ним стоит и в каком
    состоянии проект находится сегодня.

    '
- kind: content
  id: 004-zachem-nuzhen-orkestrator
  title: Зачем нужен оркестратор
  bullets:
  - Пайплайн — это граф зависимостей, а не список скриптов
  - 'Нужны: расписание, повторы, backfill, изоляция, наблюдаемость'
  - cron не знает про зависимости и падения соседей
  - Ручные запуски не воспроизводимы и не документированы
  - 'Оркестратор даёт: DAG, состояние, историю, алерты'
  notes: 'Как только пайплайн перестаёт быть одним скриптом, появляется **граф зависимостей**: загрузка
    → трансформации → витрины → обучение модели. Между шагами возникают отношения «после» и «на основе»,
    и их надо кем-то соблюдать.


    **cron** этого не умеет: он запускает по времени и ничего не знает про то, что предыдущий шаг упал.
    Оркестратор даёт !!зависимости, состояние, повторные запуски, бэкфиллы и наблюдаемость!! из коробки.
    ~~Практически: без оркестратора вы рано или поздно пишете свой плохой оркестратор.~~

    '
- kind: content
  id: 005-mesto-dagster-v-data-i-ml-steke
  title: Место Dagster в data- и ML-стеке
  code_caption: 'Типичный контур: ingestion → transform → serving'
  code: "┌───────────┐   ┌────────────┐   ┌───────────┐   ┌──────────┐\n│  sources  │ → │  ingestion │\
    \ → │    DWH    │ → │  BI / ML │\n│ API, БД,  │   │ dlt,       │   │ClickHouse │   │ DataLens,│\n\
    │ файлы     │   │ Airbyte    │   │ + dbt     │   │ модели   │\n└───────────┘   └────────────┘   └───────────┘\
    \   └──────────┘\n        ▲              ▲               ▲              ▲\n        └──────────────┴───────────────┴──────────────┘\n\
    \                              │\n                    ┌─────────────────────┐\n                  \
    \  │      DAGSTER        │  расписания, зависимости,\n                    │  (оркестрация +     │\
    \  ретраи, партиции, качество,\n                    │   каталог активов)  │  lineage, наблюдаемость\n\
    \                    └─────────────────────┘\n"
  bullets:
  - Dagster не хранит данные — он управляет их производством
  - Видит весь путь от источника до витрины и модели
  - Один граф на ingestion, трансформации и ML
  - Lineage и метаданные — побочный продукт описания
  notes: 'Dagster сам __не хранит и не обрабатывает данные__ — он управляет тем, **что**, **когда** и
    **в каком порядке** производится. Хранилище остаётся за ClickHouse, трансформации за dbt, загрузка
    за dlt или Airbyte.


    Важное отличие от Airflow: Dagster держит !!единый граф активов!! на весь контур — от сырых источников
    до ML-моделей. Поэтому **lineage** и **метаданные** получаются автоматически, а не как отдельный инструмент
    сверху. ~~На схеме видно, что оркестратор — поперечный слой, а не ещё один этаж.~~

    '
- kind: content
  id: 006-istoriya-i-persony
  title: История и персоны
  materials:
  - label: Dagster — GitHub
    url: https://github.com/dagster-io/dagster
  - label: Software-Defined Assets (манифест)
    url: https://dagster.io/blog/software-defined-assets
  bullets:
  - Ник Шрок (Nick Schrock) — сооснователь, до этого сооснователь GraphQL в Facebook
  - 2018 — старт проекта, компания Elementl
  - 2020–2021 — публичные релизы, рост сообщества
  - 2022 — Software-Defined Assets, смена парадигмы
  - 2023 — Elementl переименована в Dagster Labs; Pete Hunt — CEO
  - 2022 — Dagster 1.0, стабильный API
  notes: 'Автор Dagster — **Ник Шрок**, до этого один из создателей **GraphQL** в Facebook. Это важно
    для понимания философии: Шрок пришёл из мира __типизированных схем и деклараций__, и перенёс этот
    подход на данные.


    Ключевой перелом — **2022 год** и концепция !!Software-Defined Assets!!: центральной единицей стала
    не задача, а **актив данных**. Компания **Elementl** в 2023 переименовалась в **Dagster Labs**, CEO
    стал **Pete Hunt** (тоже выходец из Facebook, один из авторов React). ~~Эти имена ещё всплывут в блоке
    про новости рынка.~~

    '
- kind: content
  id: 007-dagster-segodnya
  title: Dagster сегодня
  code_caption: 'Dagster 1.11: dg CLI + Components'
  code: '# современный стартовый путь (1.11+)

    uvx create-dagster project my_project

    cd my_project && dg dev          # поднять UI + инстанс одной командой


    dg list defs                     # что вообще определено в проекте

    dg check defs                    # валидация без запуска

    dg launch --assets stg_transactions

    '
  bullets:
  - Ветка 1.x стабильна, обратная совместимость публичного API
  - '1.11: dg CLI и Components — стабильные'
  - 'Components: переиспользуемые блоки в YAML или Python'
  - Готовые компоненты для dbt, Fivetran, Airbyte, Sling, dlt
  - 'Два издания: OSS (Apache 2.0) и Dagster+ (управляемое)'
  notes: 'Сегодня Dagster — зрелый проект в **ветке 1.x** с обещанием обратной совместимости публичного
    API. Самое заметное недавнее изменение — релиз **1.11**, где стабилизировались !!dg CLI и Components!!.


    **Components** — это переиспользуемые строительные блоки, которые описываются в **YAML или Python**;
    для dbt, Fivetran, Airbyte, Sling и dlt есть готовые. Практический смысл: __типовую интеграцию теперь
    не пишут кодом, а конфигурируют__. ~~Мы вернёмся к Components в блоке про dbt.~~

    '
- kind: section
  id: 008-arhitektura-i-suschnosti
  title: Архитектура и сущности
  notes: 'Главный и самый практический блок лекции.


    Пройдём !!все ключевые сущности Dagster!! по очереди: **assets**, **ops/graphs/jobs**, **schedules**,
    **sensors**, **resources**, **partitions**, **backfills**, **code locations**, **daemon** и **asset
    checks**.

    '
- kind: content
  id: 009-klyuchevaya-ideya-software
  title: Ключевая идея — Software-Defined Assets
  materials:
  - label: 'Манифест: Software-Defined Assets'
    url: https://dagster.io/blog/software-defined-assets
  - label: Документация Dagster
    url: https://docs.dagster.io
  code_caption: Императивно (Airflow) против декларативно (Dagster)
  code: '# Airflow-подход: описываем ЗАДАЧИ и порядок

    extract >> transform >> load

    # оркестратор знает "что запустить", но не знает "что получилось"


    # Dagster-подход: описываем АКТИВЫ — что должно существовать

    import dagster as dg


    @dg.asset

    def raw_transactions() -> None: ...


    @dg.asset(deps=[raw_transactions])

    def stg_transactions() -> None: ...

    # зависимость выводится из кода; граф активов строится сам

    '
  bullets:
  - 'Data-Driven подход: отличие от Airflow — концепция программно-определяемых ассетов (Software-Defined
    Assets)'
  - 'Актив — объект данных: таблица, файл, модель, дашборд'
  - Описываем результат, а не последовательность шагов
  - Граф зависимостей выводится из сигнатур функций
  - Запуск = «материализовать актив» (materialize)
  - Lineage, каталог и метаданные появляются бесплатно
  notes: 'Это !!центральная идея всего Dagster!!. **Актив (asset)** — это объект данных, который должен
    существовать: таблица в ClickHouse, файл в S3, обученная модель, дашборд.


    Вместо «запусти A, потом B» мы говорим «__должна существовать таблица stg_transactions, и она делается
    вот так, на основе вот этого__». Зависимости Dagster выводит сам, а запуск называется **материализацией**.
    Побочный, но огромный бонус — **lineage** и **каталог данных** без отдельного инструмента. ~~Если
    вы поняли этот слайд, дальше всё складывается.~~

    '
- kind: content
  id: 010-asset-kod-metadannye
  title: Asset — код, метаданные, материализация
  code_caption: assets.py — типовой ассет с ресурсом и метаданными
  code: "import dagster as dg\n\n@dg.asset(\n    group_name=\"staging\",              # группа в UI\n\
    \    kinds={\"clickhouse\"},              # иконка/тип в графе\n    description=\"Очищенные транзакции\"\
    ,\n    deps=[\"raw_transactions\"],         # зависимость по имени\n)\ndef stg_transactions(\n   \
    \ context: dg.AssetExecutionContext,\n    ch: ClickHouseResource,            # ресурс — через аргумент\n\
    ) -> dg.MaterializeResult:\n    rows = ch.execute(\"INSERT INTO stg_transactions SELECT ... FROM raw\"\
    )\n    context.log.info(\"loaded %s rows\", rows)\n    return dg.MaterializeResult(\n        metadata={\"\
    rows\": rows, \"preview\": dg.MetadataValue.md(\"...\")}\n    )\n"
  bullets:
  - Функция с декоратором @dg.asset — и это уже узел графа
  - deps задаёт зависимости, ресурсы приходят аргументами
  - MaterializeResult возвращает метаданные в UI
  - 'Метаданные: строки, превью, ссылки, любые значения'
  - Группы и kinds делают большой граф читаемым
  notes: 'Практически ассет — это **обычная Python-функция с декоратором**. Всё остальное — метаданные:
    `group_name` для группировки в UI, `kinds` для иконки, `deps` для явных зависимостей.


    Особое внимание на !!MaterializeResult!!: возвращая метаданные (число строк, превью, ссылку на дашборд),
    вы наполняете **каталог активов**, и в UI по каждой материализации видно, __что именно произошло и
    сколько данных приехало__. ~~Это то, чего в Airflow приходится добиваться руками.~~

    '
- kind: content
  id: 011-ops-graphs-i-jobs
  title: Ops, Graphs и Jobs
  code_caption: 'Императивный слой: когда активов недостаточно'
  code: "import dagster as dg\n\n@dg.op\ndef fetch_api() -> list[dict]: ...\n\n@dg.op\ndef push_to_crm(rows:\
    \ list[dict]) -> None: ...\n\n@dg.graph\ndef sync_crm():\n    push_to_crm(fetch_api())\n\nsync_crm_job\
    \ = sync_crm.to_job(name=\"sync_crm\")\n\n# job поверх активов — «материализовать это подмножество»\n\
    daily_marts_job = dg.define_asset_job(\n    name=\"daily_marts\",\n    selection=dg.AssetSelection.groups(\"\
    marts\"),\n)\n"
  bullets:
  - Op — единица вычисления; Graph — композиция ops
  - Job — то, что реально запускается (по расписанию/сенсору)
  - define_asset_job — job поверх выборки активов
  - Ops нужны, когда результат — не данные (нотификации, вызовы API)
  - Большинство задач в аналитике решается активами
  notes: 'Помимо активов есть **императивный слой**: **op** — единица вычисления, **graph** — их композиция,
    **job** — то, что реально запускается по расписанию или сенсору.


    Правило выбора простое: если результат работы — __данные, которые где-то лежат__, пишите **asset**.
    Если результат — **действие без артефакта** (отправить в CRM, послать уведомление, дёрнуть внешний
    API), уместен **op**. Для активов job создаётся через !!define_asset_job!! с выборкой. ~~В аналитике
    80–90% задач — это активы.~~

    '
- kind: table
  id: 012-asset-ili-op-kak-vybrat
  title: Asset или Op — как выбрать
  table:
    headers:
    - Критерий
    - Asset
    - Op
    rows:
    - - Результат работы
      - объект данных (таблица, файл, модель)
      - действие без артефакта
    - - Модель мышления
      - декларативная («что должно быть»)
      - императивная («что сделать»)
    - - Lineage и каталог
      - да, автоматически
      - нет
    - - Партиции и бэкфилл
      - поддерживаются нативно
      - через конфиг job
    - - Типичный пример
      - dbt-модель, витрина, датасет
      - уведомление, вызов API, cleanup
    col_ratios:
    - 3
    - 4
    - 4
  notes: 'Эта таблица — практический ответ на самый частый вопрос новичка: __«мне писать asset или op?»__.


    Если сомневаетесь — !!пишите asset!!. Вы почти ничего не теряете, но получаете **lineage**, **партиции**,
    **бэкфиллы** и место в **каталоге**. Op остаётся нишевым инструментом для побочных эффектов. ~~Исторически
    ops появились раньше активов, поэтому в старых примерах их много — не копируйте это вслепую.~~


    И ещё один бонус активов — **версионирование данных**: Dagster отслеживает происхождение (**lineage**)
    датасетов и версии моделей — от сырого источника до обученной модели видно, из чего собран каждый
    артефакт.

    '
- kind: content
  id: 013-schedules-zapusk-po-vremeni
  title: Schedules — запуск по времени
  code_caption: schedules.py
  code: "import dagster as dg\n\n# 1) простой вариант — расписание для job\ndaily_schedule = dg.ScheduleDefinition(\n\
    \    name=\"daily_marts_schedule\",\n    job=daily_marts_job,\n    cron_schedule=\"0 3 * * *\",  \
    \        # каждый день в 03:00\n    execution_timezone=\"Europe/Moscow\",\n    default_status=dg.DefaultScheduleStatus.RUNNING,\n\
    )\n\n# 2) гибкий вариант — решаем в коде, что и с каким конфигом запускать\n@dg.schedule(job=daily_marts_job,\
    \ cron_schedule=\"0 3 * * *\")\ndef parametrized_schedule(context: dg.ScheduleEvaluationContext):\n\
    \    day = context.scheduled_execution_time.strftime(\"%Y-%m-%d\")\n    return dg.RunRequest(run_key=day,\
    \ run_config={\"ops\": {\"date\": day}})\n"
  bullets:
  - Расписание = cron + job (+ таймзона)
  - '@dg.schedule позволяет считать конфиг запуска в коде'
  - RunRequest с run_key защищает от дублей
  - default_status включает расписание при деплое
  - Выполняется демоном, а не веб-сервером
  notes: '**Schedule** — это связка «**cron** + **job**». В простом случае достаточно `ScheduleDefinition`;
    когда нужно вычислить конфиг запуска (например, подставить дату), берём декоратор `@dg.schedule`.


    Два практических момента. Первый — !!execution_timezone!!: без него легко получить запуск по UTC и
    расхождение в три часа. Второй — **run_key** в `RunRequest`: он __защищает от дублирующихся запусков__.
    И помните, что расписания исполняет **демон**. ~~Забытый демон — причина №1 «расписание не сработало».~~

    '
- kind: content
  id: 014-sensors-reakciya-na-sobytiya
  title: Sensors — реакция на события
  code_caption: sensors.py — три типовых сенсора
  code: "import dagster as dg\n\n# 1) внешнее событие: появился новый файл\n@dg.sensor(job=ingest_job,\
    \ minimum_interval_seconds=30)\ndef new_file_sensor(context: dg.SensorEvaluationContext):\n    for\
    \ path in list_new_files(since=context.cursor):\n        yield dg.RunRequest(run_key=path, run_config={\"\
    path\": path})\n    context.update_cursor(now_marker())\n\n# 2) реакция на материализацию другого\
    \ актива\n@dg.asset_sensor(asset_key=dg.AssetKey(\"raw_transactions\"), job=stg_job)\ndef on_raw_loaded(context,\
    \ asset_event):\n    yield dg.RunRequest(run_key=str(asset_event.timestamp))\n\n# 3) реакция на статус\
    \ чужого запуска\n@dg.run_status_sensor(run_status=dg.DagsterRunStatus.FAILURE)\ndef alert_on_failure(context):\n\
    \    send_telegram(f\"Упал запуск: {context.dagster_run.run_id}\")\n"
  bullets:
  - 'Сенсор опрашивает мир и решает: запускать или нет'
  - 'Виды: обычный, asset_sensor, run_status_sensor, freshness'
  - Cursor хранит позицию между опросами
  - run_key обеспечивает идемпотентность
  - 'Типовое применение: файлы, очереди, алерты о падениях'
  notes: '**Sensor** — это противоположность расписанию: он не ждёт времени, а __опрашивает внешний мир__
    и решает, нужен ли запуск. Интервал опроса задаётся `minimum_interval_seconds`.


    Три вида покрывают почти всё: обычный сенсор для **внешних событий** (файл, очередь), !!asset_sensor!!
    для реакции на **материализацию другого актива**, и **run_status_sensor** для **алертов о падениях**
    — именно так делают уведомления в Telegram. Ключевые механики — **cursor** (позиция между опросами)
    и **run_key** (идемпотентность). ~~Сенсоры тоже исполняет демон.~~

    '
- kind: table
  id: 015-schedule-ili-sensor
  title: Schedule или Sensor
  table:
    headers:
    - ''
    - Schedule
    - Sensor
    rows:
    - - Триггер
      - время (cron)
      - внешнее событие или состояние
    - - Предсказуемость
      - высокая, известна заранее
      - зависит от внешнего мира
    - - Задержка
      - до следующего тика cron
      - до следующего опроса (секунды)
    - - Состояние между вызовами
      - обычно не нужно
      - cursor
    - - Типовой кейс
      - ночной пересчёт витрин
      - «приехал файл», «упал job»
    col_ratios:
    - 3
    - 4
    - 4
  notes: 'Выбор между ними — это выбор между «__я знаю, когда__» и «__я знаю, после чего__».


    На практике в проде живут **оба**: ночной пересчёт витрин — расписанием, а реакция на прилетевший
    файл и !!алерты о падениях!! — сенсорами. ~~Если начинаете часто опрашивать расписанием каждые пять
    минут «а не появилось ли» — вам нужен сенсор.~~

    '
- kind: content
  id: 016-resources-i-io-managers
  title: Resources и IO managers
  code_caption: resources.py — конфигурируемое подключение + управление хранением
  code: "import dagster as dg\n\nclass ClickHouseResource(dg.ConfigurableResource):\n    host: str\n \
    \   user: str\n    password: str                       # приедет из EnvVar, не из кода\n\n    def\
    \ execute(self, sql: str) -> int: ...\n\nclass ParquetIOManager(dg.ConfigurableIOManager):\n    base_dir:\
    \ str\n\n    def handle_output(self, context, obj):      # как СОХРАНИТЬ результат\n        obj.to_parquet(f\"\
    {self.base_dir}/{context.asset_key.path[-1]}.parquet\")\n\n    def load_input(self, context):    \
    \          # как ПРОЧИТАТЬ для потребителя\n        return pd.read_parquet(f\"{self.base_dir}/{...}.parquet\"\
    )\n\ndefs = dg.Definitions(\n    assets=[stg_transactions],\n    resources={\n        \"ch\": ClickHouseResource(\n\
    \            host=dg.EnvVar(\"CH_HOST\"), user=dg.EnvVar(\"CH_USER\"),\n            password=dg.EnvVar(\"\
    CH_PASSWORD\"),\n        ),\n        \"io_manager\": ParquetIOManager(base_dir=\"data/warehouse\"\
    ),\n    },\n)\n"
  bullets:
  - 'Resource — внешняя зависимость: БД, API, S3, клиент'
  - EnvVar подставляет секреты в рантайме, а не в коде
  - IO manager отвечает за «где лежит результат»
  - Смена окружения = смена ресурсов, код активов не меняется
  - 'Изоляция кода: использование фабрик ресурсов — локальное тестирование пайплайнов без развертывания
    инфраструктуры'
  notes: '**Resource** — это внешняя зависимость: подключение к ClickHouse, S3-клиент, API-токен. Она
    объявляется как класс и передаётся активам **аргументом**, что делает код !!тестируемым!!: в тестах
    подставляем мок.


    **IO manager** отвечает на отдельный вопрос — __где физически лежит результат актива__ и как его прочитает
    следующий актив. Разделение важное: логика в активе, транспорт — в IO-менеджере. И обратите внимание
    на **EnvVar**: секрет читается в рантайме и **не попадает в код**. ~~Именно ресурсы дают dev/prod-разделение,
    о котором поговорим дальше.~~

    '
- kind: content
  id: 051-ml-pajplajn-kak-cepochka-assetov
  title: ML-пайплайн как цепочка зависимых активов
  materials:
  - label: Dagster for ML pipelines
    url: https://docs.dagster.io/guides/build/ml-pipelines
  code_caption: ml_pipeline.py — Загрузка → Препроцессинг → Обучение → Валидация
  code: 'import dagster as dg


    @dg.asset

    def raw_data(ch: ClickHouseResource): ...            # Загрузка


    @dg.asset(deps=[raw_data])

    def preprocessed_features(): ...                     # Препроцессинг


    @dg.asset(deps=[preprocessed_features])

    def trained_model(trainer: TrainerResource): ...     # Обучение


    @dg.asset(deps=[trained_model])

    def validation_report(): ...                         # Валидация

    '
  bullets:
  - ML-пайплайн — описание шагов «Загрузка → Препроцессинг → Обучение → Валидация»
  - Каждый шаг — актив в цепочке зависимых ресурсов
  - Модель и отчёт валидации — такие же активы, как таблицы
  - 'Перезапуск с любого шага: материализуется только хвост цепочки'
  notes: 'Соберём всё вместе на главном сценарии курса. **ML-пайплайн** в Dagster — это описание шагов
    !!«Загрузка → Препроцессинг → Обучение → Валидация»!! как **цепочки зависимых активов**: каждый шаг
    объявляет, от какого артефакта он зависит, а внешние зависимости (БД, трейнер) приходят **ресурсами**.


    Выигрыш по сравнению с task-подходом: __обученная модель и отчёт валидации — полноправные активы__
    с lineage и метаданными. Упала валидация — материализуем только её, без пересчёта всей цепочки. ~~Это
    же ДЗ: оркестрируем dbt-проект Olist, а поверх — шаги обучения.~~

    '
- kind: content
  id: 017-partitions-razrezaem-aktiv-po
  title: Partitions — разрезаем актив по измерению
  code_caption: partitions.py
  code: "import dagster as dg\n\ndaily = dg.DailyPartitionsDefinition(start_date=\"2026-01-01\")\n\n@dg.asset(partitions_def=daily)\n\
    def transactions_daily(context: dg.AssetExecutionContext, ch: ClickHouseResource):\n    day = context.partition_key\
    \                 # '2026-03-14'\n    ch.execute(f\"\"\"\n        INSERT INTO stg_transactions\n \
    \       SELECT * FROM raw.transactions WHERE toDate(ts) = '{day}'\n    \"\"\")\n\n# другие виды разбиения\n\
    regions = dg.StaticPartitionsDefinition([\"msk\", \"spb\", \"ekb\"])\nboth = dg.MultiPartitionsDefinition({\"\
    date\": daily, \"region\": regions})\n"
  bullets:
  - 'Партиция — независимо обрабатываемый срез: день, регион, клиент'
  - 'Виды: Daily/Hourly, Static, Multi, Dynamic'
  - Каждая партиция имеет свой статус материализации
  - Пересчитать можно один день, а не всю таблицу
  - Основа для инкрементальной загрузки и бэкфиллов
  notes: '**Партиция** — это независимо обрабатываемый срез актива: обычно **день**, но бывает регион,
    клиент или их комбинация через `MultiPartitionsDefinition`.


    Практическая ценность огромна: в UI видно !!статус каждой партиции отдельно!!, и если сломался один
    день — пересчитываете **именно его**, а не всю таблицу за два года. Это же основа **инкрементальной
    загрузки**: `context.partition_key` подставляется в фильтр запроса. ~~Партиции — то, ради чего многие
    и переходят на Dagster.~~

    '
- kind: content
  id: 018-backfills-massovyj-pereschet
  title: Backfills — массовый пересчёт истории
  code_caption: Бэкфилл из UI и из CLI
  code: "# пересчитать диапазон партиций одного актива\ndagster asset backfill \\\n    --select transactions_daily\
    \ \\\n    --partition-range 2026-01-01...2026-06-30\n\n# пересчитать целую группу активов\ndagster\
    \ asset backfill --select \"group:marts\" --all-partitions\n"
  bullets:
  - Бэкфилл = массовая материализация набора партиций
  - Запускается из UI (матрица партиций) или из CLI
  - Исполняется демоном, уважает лимиты параллелизма
  - Прогресс и падения видны по каждой партиции
  - 'Частый сценарий: изменилась логика — пересчитать историю'
  notes: '**Backfill** — это массовая материализация набора партиций. Классический повод: __поменялась
    бизнес-логика витрины, и надо пересчитать полгода истории__.


    В Dagster это !!штатная операция!!, а не героический скрипт: в UI выделяете диапазон на матрице партиций,
    и демон запускает их с учётом **лимитов параллелизма**, показывая прогресс и падения __по каждой партиции
    отдельно__. ~~Сравните с бэкфиллом в Airflow, где это исторически было болезненной темой.~~

    '
- kind: content
  id: 019-code-locations-i-workspace
  title: Code locations и workspace
  code_caption: workspace.yaml — несколько независимых кодовых локаций
  code: "load_from:\n  # локация 1: основной проект\n  - python_module:\n      module_name: my_project.definitions\n\
    \      location_name: core\n\n  # локация 2: dbt-проект со своими зависимостями\n  - python_module:\n\
    \      module_name: dbt_project.definitions\n      location_name: dbt\n\n  # локация 3: удалённый\
    \ gRPC-сервер (свой контейнер и образ)\n  - grpc_server:\n      host: dagster-ml-code\n      port:\
    \ 4000\n      location_name: ml\n"
  bullets:
  - Code location — изолированный процесс с кодом и зависимостями
  - У каждой локации свой образ, venv и версия библиотек
  - Ошибка в одной локации не роняет остальные
  - Перезагрузка локации не требует рестарта веб-сервера
  - Основа для мультикомандной работы
  notes: '**Code location** — это изолированный процесс, где живут ваши определения. У каждой локации
    !!свои зависимости и свой образ!!.


    Это решает реальную боль больших проектов: команда ML хочет один набор версий, команда аналитики —
    другой. В Airflow это __исторически сложно__, а здесь локации просто разные процессы. Бонусы: **ошибка
    импорта в одной локации не роняет остальные**, а перезагрузка кода не требует рестарта веб-сервера.
    ~~На больших проектах это ключевая сущность.~~

    '
- kind: content
  id: 020-instance-daemon-webserver
  title: Instance, Daemon, Webserver
  code_caption: Три процесса и dagster.yaml
  code: "┌──────────────┐   ┌──────────────┐   ┌────────────────────┐\n│  Webserver   │   │    Daemon\
    \    │   │   Code locations   │\n│  (UI, GraphQL│   │ расписания,  │   │  ваш код в своих   │\n│ \
    \  запуск рук)│   │ сенсоры,     │   │  процессах (gRPC)  │\n│              │   │ очередь, BF  │ \
    \  │                    │\n└──────┬───────┘   └──────┬───────┘   └─────────┬──────────┘\n       └──────────────────┴─────────────────────┘\n\
    \                          │\n                ┌───────────────────┐\n                │  Dagster Instance\
    \ │  dagster.yaml\n                │  run storage      │  Postgres в проде\n                │  event\
    \ log        │  (SQLite в dev)\n                │  schedule storage │\n                └───────────────────┘\n"
  bullets:
  - Webserver — UI и GraphQL API; раньше назывался Dagit
  - Daemon — расписания, сенсоры, очередь запусков, бэкфиллы
  - 'Instance — общее состояние: запуски, события, расписания'
  - dagster.yaml настраивает хранилища и лимиты
  - В проде хранилище — Postgres, в dev — SQLite
  notes: 'Три процесса, которые надо различать. **Webserver** — это UI и GraphQL API (историческое имя
    — **Dagit**). **Daemon** — фоновый процесс, который исполняет !!расписания, сенсоры, очередь запусков
    и бэкфиллы!!.


    **Instance** — не процесс, а __общее состояние__: где хранятся запуски, лог событий и расписания;
    настраивается в `dagster.yaml`. В деве это SQLite, в проде — **Postgres**. Запомните главное: **без
    запущенного демона не работают ни расписания, ни сенсоры**. ~~Это самая частая ошибка первого прод-деплоя.~~

    '
- kind: content
  id: 021-asset-checks-i-svezhest-dannyh
  title: Asset checks и свежесть данных
  code_caption: checks.py — качество как часть графа
  code: "import dagster as dg\n\n@dg.asset_check(asset=stg_transactions, blocking=True)\ndef no_null_ids(ch:\
    \ ClickHouseResource) -> dg.AssetCheckResult:\n    nulls = ch.scalar(\"SELECT count() FROM stg_transactions\
    \ WHERE id IS NULL\")\n    return dg.AssetCheckResult(\n        passed=(nulls == 0),\n        severity=dg.AssetCheckSeverity.ERROR,\n\
    \        metadata={\"nulls\": nulls},\n    )\n\n@dg.asset_check(asset=stg_transactions)\ndef fresh_enough(ch:\
    \ ClickHouseResource) -> dg.AssetCheckResult:\n    lag_h = ch.scalar(\"SELECT dateDiff('hour', max(ts),\
    \ now()) FROM stg_transactions\")\n    return dg.AssetCheckResult(passed=(lag_h < 24), metadata={\"\
    lag_hours\": lag_h})\n"
  bullets:
  - Проверка привязана к активу и видна в его карточке
  - blocking=True останавливает зависимые активы
  - severity различает WARN и ERROR
  - Проверки свежести ловят «тихо устаревшие» витрины
  - dbt-тесты подтягиваются как asset checks автоматически
  notes: '**Asset check** — это проверка качества, __привязанная к конкретному активу__ и видимая прямо
    в его карточке в UI. Не отдельный джоб «проверить всё», а часть описания актива.


    Два важных параметра. !!blocking=True!! означает, что при провале **зависимые активы не поедут** —
    плохие данные не расползутся по витринам. **severity** разделяет «предупредить» и «остановить». Отдельно
    отмечу **проверки свежести**: они ловят самый коварный класс инцидентов — __витрина не упала, она
    просто тихо перестала обновляться__. ~~Хорошая новость: dbt-тесты Dagster подтягивает как asset checks
    сам.~~

    '
- kind: content
  id: 022-dg-cli-i-components
  title: dg CLI и Components
  materials:
  - label: 'Релиз Dagster 1.11: dg + Components'
    url: https://dagster.io/blog/dagster-1-11-build-me-up-buttercup
  code_caption: defs.yaml — интеграция без единой строчки Python
  code: "# dbt-проект как компонент: описали — получили граф активов\ntype: dagster_dbt.DbtProjectComponent\n\
    \nattributes:\n  project: \"{{ project_root }}/dbt\"\n  select: \"fqn:*\"\n  translation:\n    group_name:\
    \ dbt_marts\n    key: \"target/{{ node.name }}\"\n---\n# рабочий цикл\ndg scaffold defs dagster_dbt.DbtProjectComponent\
    \ dbt_ingest\ndg list defs && dg check defs\ndg dev\n"
  bullets:
  - Component — переиспользуемый блок в YAML или Python
  - Готовые компоненты для dbt, Fivetran, Airbyte, Sling, dlt
  - dg scaffold создаёт заготовку нужного типа
  - dg check валидирует определения без запуска
  - Понижает порог входа для не-инженеров
  notes: '**Components** — самое заметное нововведение ветки 1.11. Идея: __типовую интеграцию не пишут
    кодом, а описывают конфигом__, и Dagster разворачивает её в полноценный граф активов.


    Готовые компоненты уже есть для **dbt**, **Fivetran**, **Airbyte**, **Sling** и **dlt**. Практический
    эффект двойной: во-первых, !!меньше шаблонного кода!!; во-вторых, __аналитик без глубокого Python
    может добавить источник__, отредактировав YAML. **dg check** при этом валидирует определения, не запуская
    пайплайн. ~~Это прямой ответ на упрёк «Dagster слишком инженерный».~~

    '
