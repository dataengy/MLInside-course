- kind: content
  id: 048-dz-orkestriruem-dbt-proekt-v
  title: 'ДЗ: оркестрируем dbt-проект в Dagster'
  code_caption: Каркас проекта — от него можно отталкиваться
  code: "orchestration/\n  src/olist_orchestration/\n    project.py            # DbtProject → ваш dbt-проект\
    \ из ДЗ по dbt\n    translator.py         # источникам dbt — ключи ингест-ассетов\n    assets/raw.py\
    \         # 8 ассетов: CSV → olist_raw.* в ClickHouse\n    assets/dbt.py         # @dbt_assets, команда\
    \ `dbt build`\n    resources.py          # ClickHouseResource + DbtCliResource\n    checks.py    \
    \         # asset checks на сырой слой\n    schedules.py          # ежедневный пересчёт витрин\n \
    \   sensors.py            # приход данных + run_status_sensor на падение\n    definitions.py     \
    \   # Definitions: всё вместе\ndbt/                      # ваш dbt-проект из прошлого ДЗ — БЕЗ копирования\n"
  bullets:
  - 'Датасет прежний: Olist Brazilian E-Commerce в ClickHouse'
  - Обернуть dbt через @dbt_assets, команда build — тесты станут asset checks
  - 'Настроить ресурсы: ClickHouse и dbt, секреты через EnvVar'
  - 'Главное: ингест-ассеты — РОДИТЕЛИ dbt-графа, а не отдельная куча'
  - 'Связка — кастомный DagsterDbtTranslator: те же ключи у источников'
  - Расписание, asset checks на сырой слой, сенсор на падение
  - Скриншот графа активов и лог успешного запуска — в отчёт
  notes: 'Постановка: берём !!ваш dbt-проект из предыдущего задания!! — датасет **Olist** в ClickHouse,
    слои `sources → staging → intermediate → marts` — и ставим его под управление **Dagster**. Каталог
    `dbt/` при этом __не копируется__: Dagster указывает на тот же самый проект.


    Содержательная часть задания — не «обернуть dbt», это делается одним декоратором. Главное — чтобы
    **загрузка данных стала частью графа**. По умолчанию источники dbt превращаются в ассеты без родителей,
    и граф выходит рваным: слева восемь источников из ниоткуда, справа модели. Лечится !!кастомным DagsterDbtTranslator!!,
    который выдаёт источникам dbt __те же ключи__, что у ваших ингест-ассетов — Dagster видит совпадение
    и склеивает половины в один граф.


    Ещё одна мелочь с большим эффектом: команда **`dbt build`**, а не `run`. Тогда тесты dbt приезжают
    в Dagster как **asset checks** — в эталонном решении это 132 проверки, которых не пришлось писать
    руками. ~~Полное решение и текст задания — в репозитории курса, homework/mlinside-hw-olist.~~

    '
- kind: table
  id: 049-dz-kriterii-ocenki
  title: 'ДЗ: критерии оценки'
  table:
    headers:
    - Баллы
    - Что должно быть сделано
    rows:
    - - 6–7
      - dbt-проект обёрнут через @dbt_assets; ресурсы ClickHouse и dbt настроены; секреты через EnvVar;
        поднимается `dagster dev`, проходит ручная материализация; граф активов виден в UI
    - - 8–9
      - всё выше + ингест-ассеты как РЕАЛЬНЫЕ РОДИТЕЛИ dbt-графа через кастомный DagsterDbtTranslator
        (граф связный, без висячих источников) + расписание + минимум два asset check на сырой слой +
        run_status_sensor на падение + метаданные материализаций (row_count и прочее)
    - - '10'
      - 'всё выше + сенсор на приход данных (landing-зона или Kafka-заглушка с задокументированным путём
        миграции) + `dagster definitions validate` в CI + один нетривиальный элемент: партиции с выполненным
        бэкфиллом, запуск в Docker (webserver, daemon, Postgres), declarative automation или вторая code
        location'
    col_ratios:
    - 2
    - 9
  notes: 'Критерии повторяют логику дбт-задания, поэтому ориентироваться просто. **6–7 баллов** — это
    «__работает и правильно устроено__»: dbt обёрнут ассетами, секреты не в коде.


    **8–9** — главный рубеж, и он не про количество кода, а про !!связность графа!!. Если ингест и модели
    живут двумя отдельными кучами — задание не выполнено, сколько бы расписаний вы ни навесили. Проверяется
    это без UI: у каждой `stg_*` в родителях обязан стоять соответствующий ассет сырого слоя.


    **10 баллов** — реакция на события и прод-подобная сборка. Про сенсор на Kafka: урока по ней ещё не
    было, поэтому достаточно __заглушки с зафиксированным контрактом__ — так, чтобы при появлении реального
    брокера менялась только реализация ресурса, а тело сенсора оставалось прежним. ~~Оценивается не объём
    кода, а осмысленность решений — будьте готовы объяснить, почему сделали так.~~

    '
