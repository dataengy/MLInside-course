      - lineage, партиции, тестируемость
      - порог входа, меньше рынок труда
    - - Airflow
      - задачи, DAG
      - зрелость, экосистема, найм
      - данные вне модели, бэкфилл
    - - Prefect
      - обычный Python, потоки
      - гибкость, динамика, низкий порог
