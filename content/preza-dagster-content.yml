    **Kestra** интересен декларативным YAML и языковой независимостью, **Argo Workflows** — это про **контейнеры
    в Kubernetes**, а не про аналитику, и сравнивать его с Dagster напрямую некорректно. **Mage** хорош
    для быстрого старта и небольших команд. !!Dagster выигрывает там, где важны данные как объект!!: lineage,
    партиции, качество. ~~Универсально «лучшего» здесь нет — есть подходящий под задачу и команду.~~

    '
- kind: content
  id: 044-neskolko-orkestratorov-na
  title: Несколько оркестраторов на большом проекте
  code_caption: Типовое разделение зон ответственности
  code: "┌──────────────────────────────────────────────────────────┐\n│  Airflow (legacy)   │  исторические\
    \ DAG-и, интеграции,    │\n│                     │  которые никто не будет переписывать│\n├──────────────────────────────────────────────────────────┤\n\
    │  Dagster            │  аналитический контур: ingest→dbt→  │\n│                     │  витрины→ML-фичи,\
    \ каталог, lineage  │\n├──────────────────────────────────────────────────────────┤\n│  Argo / Kubeflow\
    \    │  тяжёлое обучение моделей на GPU,   │\n│                     │  распределённые задачи в k8s\
    \        │\n└──────────────────────────────────────────────────────────┘\n          связь: события,\
    \ сенсоры, внешние активы\n"
  bullets:
  - Реальность больших компаний — не один оркестратор, а несколько
  - 'Антипаттерн: два оркестратора управляют одними и теми же данными'
  - 'Правильно: явные границы и односторонние триггеры'
  - Dagster умеет наблюдать внешние активы, не запуская их
  - dagster-airlift помогает поэтапной миграции с Airflow
  - Единый слой наблюдаемости важнее единого оркестратора
  notes: 'В больших компаниях !!один оркестратор — это миф!!. Живут одновременно исторический **Airflow**,
    аналитический **Dagster** и k8s-native **Argo** для обучения моделей.


    Главный антипаттерн — __два оркестратора управляют одними и теми же таблицами__: рано или поздно они
    подерутся за один объект. Работающий подход: **явные границы владения** и **односторонние триггеры**
    (события, сенсоры). Отдельно полезно, что Dagster умеет описывать **внешние активы** — наблюдать за
    тем, что производит чужая система, не запуская её. ~~Для поэтапного переезда с Airflow есть dagster-airlift.~~

    '
- kind: table
  id: 045-kak-svyazat-orkestratory
  title: Как связать оркестраторы между собой
  table:
    headers:
    - Способ
    - Как работает
    - Когда уместен
    rows:
    - - Сенсор по событию
      - Dagster ждёт сигнал от чужой системы
      - основной способ, слабая связность
    - - Внешний актив
      - Dagster описывает чужую таблицу
      - нужен сквозной lineage без запуска
    - - Вызов API
      - один дёргает REST/GraphQL другого
      - разовые точечные связи
    - - Общий слой хранения
      - связь через факт появления данных
      - максимально слабая связность
    - - dagster-airlift
      - мост Airflow → Dagster
      - поэтапная миграция
    col_ratios:
    - 3
    - 4
    - 4
  notes: 'Пять рабочих способов связать разные оркестраторы. Предпочтительны !!слабосвязанные!!: **сенсор
    по событию** и **связь через факт появления данных** — они переживают перезапуски и не требуют, чтобы
    обе системы были одновременно живы.


    **Внешний актив** — недооценённая штука: Dagster показывает чужую таблицу в своём графе __только для
    наблюдаемости__, не претендуя ею управлять. Так вы получаете **сквозной lineage** без захвата чужой
    зоны ответственности. ~~Прямые вызовы API работают, но создают жёсткую связность — используйте точечно.~~

    '
- kind: content
  id: 046-kuda-vse-dvizhetsya
  title: Куда всё движется
  bullets:
  - 'Декларативность: описываем состояние, а не шаги'
  - Оркестратор как каталог данных и точка наблюдаемости
  - Сближение оркестрации данных и ML/LLM-пайплайнов
  - AI-агенты как потребители метаданных через MCP
  - 'Консолидация рынка: Prefect + Dagster — первый крупный шаг'
  - Переносимость логики важнее выбора оркестратора
  notes: 'Основной вектор — !!декларативность!!: индустрия уходит от «опиши шаги» к «опиши, каким должно
    быть состояние, а система сама поймёт, что пересчитать». Dagster здесь оказался ранним и точным.


    Второй вектор — **оркестратор становится каталогом и точкой наблюдаемости**, а не просто планировщиком.
    Третий — __сближение data- и ML/LLM-пайплайнов__ в одном графе. И практический вывод, который я хочу,
    чтобы вы унесли: **держите бизнес-логику переносимой** — в dbt-моделях и обычном Python, а не размазанной
    по специфике конкретного оркестратора. ~~Тогда любая консолидация рынка вас не заденет.~~

    '
