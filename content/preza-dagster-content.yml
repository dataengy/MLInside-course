    Но выигрывает не только техника. У **dbt** — __огромная экосистема пакетов, документация, обучение
    и рынок труда__; нового человека вы наймёте за недели, а не месяцы. Поэтому практический совет: **на
    новом greenfield-проекте SQLMesh стоит серьёзно рассмотреть**, а миграцию работающего dbt-проекта
    нужно обосновывать конкретной болью. ~~В нашем курсе мы остаёмся на dbt именно по этой причине.~~

