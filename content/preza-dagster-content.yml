- kind: content
  id: 024-lokalnaya-razrabotka
  title: Локальная разработка
  code_caption: Один процесс, SQLite, мгновенная перезагрузка кода
  code: 'dg dev              # современный путь (1.11+)

    dagster dev         # классический эквивалент

    # → webserver на http://localhost:3000 + встроенный daemon


    # точечные запуски без UI

    dagster asset materialize --select stg_transactions

    dagster job execute -j daily_marts


    # DAGSTER_HOME определяет, где лежит инстанс (dagster.yaml, SQLite)

    export DAGSTER_HOME=$PWD/.dagster

    '
  bullets:
  - dg dev поднимает UI и демон одной командой
  - Хранилище — SQLite в DAGSTER_HOME
  - Код перечитывается без рестарта (кнопка Reload)
  - Ресурсы указывают на локальные/тестовые системы
  - Полноценный UI доступен уже локально
  notes: 'Локально всё запускается !!одной командой!!: `dg dev` (или классический `dagster dev`) поднимает
    **веб-сервер и демон** в одном процессе, состояние кладётся в **SQLite** внутри `DAGSTER_HOME`.


    Ключевое удобство — __в деве доступен ровно тот же UI, что и в проде__: граф активов, история запусков,
    логи, матрица партиций. Изменили код — нажали **Reload** в интерфейсе, рестарт не нужен. ~~Обратите
    внимание на DAGSTER_HOME: без него инстанс будет временным, и история запусков потеряется.~~

    '
- kind: table
  id: 025-dev-protiv-prod
  title: Dev против Prod
  table:
    headers:
    - Аспект
    - Dev
    - Prod
    rows:
    - - Запуск
      - '`dg dev` — один процесс'
      - webserver и daemon раздельно
    - - Хранилище инстанса
      - SQLite локально
      - PostgreSQL
    - - Исполнение запусков
      - в том же процессе
      - Docker или Kubernetes на запуск
    - - Код
      - из рабочей папки, hot reload
      - образ с фиксированной версией
    - - Секреты
      - .env-файл
      - секреты кластера / Vault
    - - Расписания и сенсоры
      - обычно выключены
      - включены, следит демон
    - - Наблюдаемость
      - логи в терминал
      - метрики, алерты, дежурство
    col_ratios:
    - 3
    - 4
    - 4
  notes: 'Главное, что стоит запомнить: !!код активов при переходе в прод не меняется!! — меняется **конфигурация
    ресурсов и инстанса**. В этом и смысл того, что подключения вынесены в ресурсы.


    Три пункта, на которых спотыкаются чаще всего: **SQLite → Postgres** (иначе конкурентные запуски начнут
    блокироваться), **демон должен быть запущен отдельно**, и __секреты приходят из окружения__, а не
    из `.env` в репозитории. ~~Ещё одна классика: забыть default_status и удивляться, что расписания в
    проде выключены.~~

    '
- kind: content
  id: 026-deploj-v-prodakshen
  title: Деплой в продакшен
  materials:
  - label: 'Dagster: деплой'
    url: https://docs.dagster.io/guides/deploy
  code_caption: 'docker-compose: разделение ролей'
  code: "services:\n  dagster-webserver:                 # UI\n    image: my-dagster:1.11\n    command:\
    \ dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml\n    environment: [DAGSTER_HOME=/opt/dagster/home]\n\
    \n  dagster-daemon:                    # расписания, сенсоры, очередь, бэкфиллы\n    image: my-dagster:1.11\n\
    \    command: dagster-daemon run\n    environment: [DAGSTER_HOME=/opt/dagster/home]\n\n  dagster-code-dbt:\
    \                  # кодовая локация как отдельный сервис\n    image: my-dbt-code:2026.07\n    command:\
    \ dagster api grpc -h 0.0.0.0 -p 4000 -m dbt_project.definitions\n\n  postgres:                  \
    \        # run storage + event log\n    image: postgres:16\n"
  bullets:
  - Webserver и daemon — отдельные сервисы (демон обязателен)
  - Кодовые локации — свои образы и свой релизный цикл
  - Postgres хранит запуски, события и расписания
  - В Kubernetes — официальный Helm-чарт, запуск на под
  - Обновление локации не требует остановки UI
  notes: 'В проде роли **разъезжаются по контейнерам**: отдельно **webserver**, отдельно **daemon**, отдельно
    **кодовые локации**, и общий **Postgres** под состояние.


    Самое ценное в этой схеме — !!независимый релизный цикл кодовых локаций!!: команда dbt катит свой
    образ, не трогая ни UI, ни чужой код. В **Kubernetes** есть официальный **Helm-чарт**, где каждый
    запуск — __отдельный под__, что даёт честную изоляцию и лимиты ресурсов. ~~Ещё раз: без сервиса daemon
    расписания и сенсоры молча не работают.~~

    '
