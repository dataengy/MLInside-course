- kind: section
  id: 035-zagruzka-dannyh-cli-i-mcp
  title: Загрузка данных, CLI и MCP
  notes: 'Короткий, но практичный блок: чем **загружать данные** (dlt и Airbyte) и как с Dagster работать
    из **терминала** и из **AI-агента**.


    Обе интеграции загрузки устроены одинаково: __внешний инструмент превращается в активы Dagster__.

    '
- kind: content
  id: 036-dlt-zagruzka-kak-kod
  title: dlt — загрузка как код
  materials:
  - label: dlt docs
    url: https://dlthub.com/docs
  code_caption: 'dagster-dlt: пайплайн dlt превращается в активы'
  code: "import dagster as dg\nfrom dagster_dlt import DagsterDltResource, dlt_assets\nimport dlt\n\n\
    @dlt_assets(\n    dlt_source=sql_database().with_resources(\"transactions\", \"customers\"),\n   \
    \ dlt_pipeline=dlt.pipeline(\n        pipeline_name=\"shop\", destination=\"clickhouse\", dataset_name=\"\
    raw\",\n    ),\n    name=\"shop_ingest\",\n    group_name=\"ingestion\",\n)\ndef shop_assets(context:\
    \ dg.AssetExecutionContext, dlt_res: DagsterDltResource):\n    yield from dlt_res.run(context=context)\n"
  bullets:
  - 'dlt — Python-библиотека для загрузки: source → destination'
  - Схема выводится автоматически, эволюция схемы поддержана
  - Каждый ресурс dlt становится активом Dagster
  - Живёт в одном процессе с оркестратором — нет лишнего сервиса
  - Есть и готовый Component для dlt
  notes: '**dlt** (data load tool) — библиотека, а не сервис: вы описываете **источник** и **приёмник**,
    а dlt сам выводит схему, разбирает вложенный JSON и умеет **эволюцию схемы**.


    Для Dagster это идеальный сосед: !!нет отдельного сервиса!!, всё исполняется в том же процессе, и
    __каждый ресурс dlt становится активом__ — с lineage и партициями наравне с dbt-моделями. ~~Для нашего
    курсового стека связка dlt + dbt + Dagster полностью покрывает ELT.~~

    '
- kind: content
  id: 037-airbyte-konnektory-kak-servis
  title: Airbyte — коннекторы как сервис
  code_caption: 'dagster-airbyte: синхронизации как активы'
  code: "import dagster as dg\nfrom dagster_airbyte import AirbyteCloudWorkspace, load_airbyte_asset_specs\n\
    \nworkspace = AirbyteCloudWorkspace(\n    workspace_id=dg.EnvVar(\"AIRBYTE_WORKSPACE_ID\"),\n    client_id=dg.EnvVar(\"\
    AIRBYTE_CLIENT_ID\"),\n    client_secret=dg.EnvVar(\"AIRBYTE_CLIENT_SECRET\"),\n)\n\nairbyte_specs\
    \ = load_airbyte_asset_specs(workspace)\ndefs = dg.Definitions(assets=[*airbyte_specs, dbt_models])\n\
    # таблицы Airbyte становятся апстримом для dbt-моделей\n"
  bullets:
  - Сотни готовых коннекторов — не надо писать загрузку
  - Отдельный сервис со своей инфраструктурой и UI
  - Dagster триггерит синхронизации и видит их как активы
  - Таблицы Airbyte становятся апстримом dbt-моделей
  - Есть Cloud и OSS-редакции
  notes: '**Airbyte** решает ту же задачу иначе: это **сервис с сотнями готовых коннекторов**. Если нужно
    забрать данные из экзотической SaaS-системы, шансы найти готовый коннектор здесь заметно выше.


    Dagster не подменяет Airbyte, а !!запускает синхронизации и представляет их как активы!!. Ценность
    в том, что __созданные Airbyte таблицы становятся честным апстримом ваших dbt-моделей__ в общем графе.
    Плата — **отдельный сервис**, который надо разворачивать и обслуживать. ~~Правило выбора: dlt — когда
    нужен контроль и лёгкость, Airbyte — когда нужны коннекторы «из коробки».~~

    '
- kind: content
  id: 038-cli-shpargalka
  title: CLI — шпаргалка
  code_caption: Классический dagster и современный dg
  code: "# ── разработка ────────────────────────────────────────────────\ndg dev                    \
    \  # UI + daemon (1.11+); аналог dagster dev\ndg list defs                # что определено в проекте\n\
    dg check defs               # валидация без запуска\ndg scaffold project my_prj  # заготовка проекта\n\
    \n# ── запуск ────────────────────────────────────────────────────\ndagster asset materialize --select\
    \ stg_transactions\ndagster asset materialize --select \"group:marts\"\ndagster job execute -j daily_marts\n\
    dagster asset backfill --select transactions_daily \\\n    --partition-range 2026-01-01...2026-06-30\n\
    \n# ── эксплуатация ──────────────────────────────────────────────\ndagster instance migrate    #\
    \ миграция схемы инстанса при апгрейде\ndagster definitions validate\ndagster-daemon run         \
    \ # демон в проде\n"
  bullets:
  - 'dg — новый CLI: скаффолдинг, валидация, dev-цикл'
  - dagster — классические команды запуска и эксплуатации
  - --select понимает группы, теги и выражения
  - instance migrate обязателен при обновлении версии
  - CLI удобен для CI и отладки без UI
  notes: 'Два CLI сосуществуют: !!dg!! — современный, про **разработку** (скаффолдинг, `list`, `check`,
    `dev`), и **dagster** — классический, про **запуск и эксплуатацию**.


    Отдельно отмечу синтаксис **--select**: он понимает не только имена, но и `group:`, `tag:` и выражения
    — это удобно и в CI, и при разборе инцидента. И запомните !!dagster instance migrate!!: __при обновлении
    версии Dagster схему инстанса надо мигрировать__, иначе сервис не поднимется. ~~Скриншот UI мы не
    приводим — посмотрим живьём на практике.~~

    '
- kind: content
  id: 039-mcp-dagster-i-ai-agenty
  title: MCP — Dagster и AI-агенты
  materials:
  - label: Model Context Protocol
    url: https://modelcontextprotocol.io
  code_caption: Подключение Dagster MCP к агенту
  code: "// ~/.claude/mcp.json — официальный dev-time MCP из dg\n{\n  \"mcpServers\": {\n    \"dagster\"\
    : { \"command\": \"dg\", \"args\": [\"mcp\", \"serve\"] }\n  }\n}\n\n// Что это даёт агенту:\n// \
    \  • понимание структуры проекта и определений\n//   • скаффолдинг компонентов и активов по описанию\n\
    //   • корректная работа с dg CLI\n\n// Отдельно существуют community-серверы для эксплуатации:\n\
    //   list_jobs, list_assets, recent_runs, get_run_info\n"
  bullets:
  - MCP — открытый протокол доступа моделей к инструментам
  - 'Официальный dg[mcp] — про разработку: помогает писать код Dagster'
  - 'Community-серверы — про эксплуатацию: смотреть запуски и активы'
  - Агент получает структуру проекта, а не догадки
  - 'Направление молодое: проверяйте права доступа'
  notes: '**MCP** (Model Context Protocol) — открытый протокол, через который модель получает доступ к
    внешним инструментам. Для Dagster важно различать **два разных класса серверов**.


    !!Официальный dg[mcp] — инструмент времени разработки!!: он помогает агенту __писать корректный код
    Dagster__, скаффолдить компоненты и понимать структуру проекта. **Community-серверы** решают обратную
    задачу — **эксплуатацию**: посмотреть запуски, активы, статусы. Направление быстро меняется, поэтому
    __аккуратнее с правами доступа к проду__. ~~Сверяйтесь с документацией: здесь всё обновляется каждые
    несколько месяцев.~~

    '
