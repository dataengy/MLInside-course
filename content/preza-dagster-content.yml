  notes: '**Cosmos** от Astronomer — хорошее решение _внутри парадигмы Airflow_: он парсит тот же `manifest.json`
    и разворачивает dbt-проект в **TaskGroup**, давая гранулярность до модели.


    Но фундаментальная разница остаётся: у Airflow единица — !!задача!!, а не **актив**. Поэтому lineage
    живёт __в пределах DAG__, dbt-тесты становятся обычными задачами, а бэкфилл привязан к `execution_date`,
    а не к смыслу данных. Честный аргумент в пользу Airflow — **зрелость и рынок труда**. ~~Если Airflow
    у вас уже стоит и работает, Cosmos — разумный шаг, не революция.~~

    '
- kind: content
  id: 033-sqlmesh-alternativa-dbt
  title: SQLMesh — альтернатива dbt
  materials:
  - label: SQLMesh docs
    url: https://sqlmesh.readthedocs.io
  - label: SQLGlot — парсер SQL под капотом
    url: https://github.com/tobymao/sqlglot
  code_caption: 'Модель SQLMesh: инкрементальность и типы в самой модели'
  code: "MODEL (\n  name analytics.stg_transactions,\n  kind INCREMENTAL_BY_TIME_RANGE (time_column ts),\n\
    \  cron '@daily',\n  grain transaction_id,\n  audits (not_null(columns := (transaction_id)))\n);\n\
    \nSELECT transaction_id, customer_id, amount, ts\nFROM raw.transactions\nWHERE ts BETWEEN @start_ds\
    \ AND @end_ds;   -- границы подставит SQLMesh\n"
  bullets:
  - 'Понимает SQL: строит column-level lineage через парсер SQLGlot'
  - 'Virtual data environments: дешёвые изолированные среды'
  - plan/apply показывает, что реально надо пересчитать
  - Инкрементальность и расписание — часть модели
  - Интеграция с Dagster есть, но в основном силами сообщества
  notes: '**SQLMesh** — самый интересный вызов монополии dbt. Его отличие принципиальное: он __не подставляет
    строки шаблоном, а разбирает SQL в синтаксическое дерево__ (через SQLGlot). Отсюда !!column-level
    lineage!! и понимание, какие изменения ломающие, а какие нет.


    Вторая сильная идея — **virtual data environments**: среда создаётся как набор ссылок на уже посчитанные
    таблицы, поэтому «своя копия хранилища для ветки» стоит копейки. `plan/apply` показывает __что именно
    придётся пересчитать__ до применения. ~~Интеграция с Dagster существует, но по зрелости она заметно
    уступает dagster-dbt.~~

    '
