  id: 023-dev-i-prod-rezhimy
  title: Dev- и prod-режимы
  notes: 'Разберём, чем __локальная разработка отличается от продакшена__ и что меняется при деплое.


    И сразу сравним **Dagster OSS** с коммерческим **Dagster+**, чтобы понимать, за что берут деньги.

