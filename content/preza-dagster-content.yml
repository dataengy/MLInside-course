- kind: section
  id: 028-integraciya-s-dbt-scenarii-i
  title: 'Интеграция с dbt: сценарии и практика'
  notes: 'Ключевой для нашего курса блок: **Dagster + dbt** — самая частая связка в аналитических платформах.


    Разберём __как это устроено внутри__, какие бывают **сценарии интеграции**, что делать с **несколькими
    dbt-проектами**, и сравним с **Airflow + Cosmos**.

    '
- kind: content
  id: 029-dagster-dbt-kak-eto-rabotaet
  title: dagster-dbt — как это работает
  materials:
  - label: 'Dagster + dbt: документация интеграции'
    url: https://docs.dagster.io/integrations/libraries/dbt
  - label: dbt docs
    url: https://docs.getdbt.com/docs/introduction
  code_caption: dbt-модели становятся активами Dagster
  code: "from pathlib import Path\nimport dagster as dg\nfrom dagster_dbt import DbtCliResource, DbtProject,\
    \ dbt_assets\n\ndbt_project = DbtProject(project_dir=Path(\"dbt\"))\ndbt_project.prepare_if_dev()\
    \          # соберёт manifest.json в деве\n\n@dbt_assets(manifest=dbt_project.manifest_path)\ndef\
    \ dbt_models(context: dg.AssetExecutionContext, dbt: DbtCliResource):\n    yield from dbt.cli([\"\
    build\"], context=context).stream()\n\ndefs = dg.Definitions(\n    assets=[dbt_models],\n    resources={\"\
    dbt\": DbtCliResource(project_dir=dbt_project)},\n)\n"
  bullets:
  - Источник правды — manifest.json из dbt
  - Каждая dbt-модель превращается в отдельный актив
  - Зависимости ref() становятся рёбрами графа Dagster
  - dbt-тесты подтягиваются как asset checks
  - 'Один общий граф: источники, dbt-модели, ML — вместе'
  notes: 'Механика простая и в этом её сила. Dagster читает !!manifest.json!! — артефакт, который dbt
    генерирует при компиляции, — и разворачивает __каждую dbt-модель в отдельный ассет__, а связи `ref()`
    — в рёбра графа.


    Отсюда два больших следствия. Первое: **гранулярность до модели** — можно перезапустить одну витрину,
    а не весь `dbt run`. Второе: **dbt-тесты становятся asset checks** и видны в UI рядом с активом. И
    главное — dbt-модели живут в !!одном графе!! с загрузкой и ML. ~~`prepare_if_dev()` избавляет от ручного
    `dbt parse` при разработке.~~

    '
- kind: table
  id: 030-scenarii-integracii-dbt-i
  title: Сценарии интеграции dbt и Dagster
  table:
    headers:
    - Сценарий
    - Как устроен
    - Плюсы
    - Минусы
    rows:
    - - Чёрный ящик
      - один op вызывает `dbt build`
      - проще некуда
      - нет lineage, перезапуск только целиком
    - - '@dbt_assets (стандарт)'
      - manifest → активы, стрим событий
      - гранулярность, checks, lineage
      - нужен собранный manifest
    - - Component (YAML)
      - '`DbtProjectComponent` в defs.yaml'
      - минимум кода, низкий порог
      - меньше гибкости при кастомизации
    - - Кастомный translator
      - свой `DagsterDbtTranslator`
      - свои ключи, группы, метаданные
      - больше кода и поддержки
    - - Отдельная code location
      - dbt в своём образе и процессе
      - изоляция зависимостей и релизов
      - сложнее инфраструктура
    col_ratios:
    - 3
    - 4
    - 3
    - 4
  notes: 'Пять сценариев по возрастанию зрелости. **Чёрный ящик** («просто вызови `dbt build` из одного
    op») встречается часто и почти всегда — ошибка: вы теряете __всё, ради чего ставили Dagster__.


    Рабочий стандарт сегодня — !!@dbt_assets!!, а для типовых случаев ещё проще **Component в YAML**.
    **Кастомный translator** нужен, когда надо переопределить ключи активов или подмешать метаданные —
    например, привести имена к вашей схеме. **Отдельная кодовая локация** — выбор больших команд. ~~Начинайте
    со стандарта; усложняйте, только когда упрётесь.~~

    '
- kind: content
  id: 031-multi-dbt-neskolko-dbt-proektov
  title: Multi-dbt — несколько dbt-проектов
  code_caption: Два проекта, разные префиксы ключей, один граф
  code: "from dagster_dbt import DagsterDbtTranslator, dbt_assets\n\nclass PrefixedTranslator(DagsterDbtTranslator):\n\
    \    def __init__(self, prefix: str): self.prefix = prefix\n    def get_asset_key(self, props):  \
    \                  # избегаем коллизий имён\n        return super().get_asset_key(props).with_prefix(self.prefix)\n\
    \n@dbt_assets(manifest=core_manifest,\n            dagster_dbt_translator=PrefixedTranslator(\"core\"\
    ))\ndef core_dbt(context, dbt: DbtCliResource):\n    yield from dbt.cli([\"build\"], context=context).stream()\n\
    \n@dbt_assets(manifest=ml_manifest,\n            dagster_dbt_translator=PrefixedTranslator(\"ml\"\
    ))\ndef ml_dbt(context, dbt_ml: DbtCliResource):\n    yield from dbt_ml.cli([\"build\"], context=context).stream()\n"
  bullets:
  - Несколько @dbt_assets с разными manifest — законно
  - Префиксы ключей спасают от коллизий имён моделей
  - Кросс-проектные зависимости связываются по asset key
  - Альтернатива — по кодовой локации на проект
  - dbt Mesh и Dagster решают одну задачу с разных сторон
  notes: 'Крупные компании почти всегда приходят к **нескольким dbt-проектам**: по доменам или по командам.
    В Dagster это поддерживается прямо: несколько `@dbt_assets` с __разными манифестами__.


    Главная практическая ловушка — !!коллизии имён моделей!! между проектами. Лечится **кастомным translator
    с префиксом ключа**. Дальше самое приятное: Dagster связывает проекты **по ключам активов**, и модель
    из `ml` может честно зависеть от витрины из `core` — __в одном сквозном графе__. ~~Обратите внимание:
    dbt Mesh решает похожую задачу средствами самого dbt; выбирать стоит осознанно, а не оба сразу.~~

    '
