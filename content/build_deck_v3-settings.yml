# build_deck_v3-settings.yml — HOW to render: template, theme, layouts, image box,
# notes emphasis markup. Shared across decks (dbt, MLE, …).

settings:
  template: data/source/MLinside-шаблон-презентаций.pptx
  media_dir: null
  out_dir: data/generated
  theme:
    accent: 2419FF
    white: FFFFFF
    dark: 1A1A1A
    alt: F2F2F7
    font: Corbel
  layouts:
    title: Титульный слайд
    agenda: Title and body
    section: Заголовок и объект
    content: Title and body
    table: Только заголовок
    closing: Section header
  image_box:
    left: 7.35
    top: 1.65
    width: 5.5
    height: 5.0
  # Body bullet sizing (pt by indent level). Bullets-only slides go large to fill the
  # whitespace; slides with an image/code panel keep a narrower, smaller column.
  body_font:
    bullets_only: {0: 26, 1: 21, 2: 18}
    with_image:   {0: 20, 1: 17, 2: 15}
  # Code panels — dark monospace box (GitHub-dark palette).
  code_style: {font: Consolas, size: 11, fg: E6EDF3, bg: 0D1117}
  code_box:      {left: 6.95, top: 1.7, width: 5.95, height: 5.2}   # beside bullets
  code_box_full: {left: 0.55, top: 1.6, width: 12.3, height: 5.45}  # code-only slide
  generation:
    parallel: false   # render requested formats concurrently (ThreadPoolExecutor)
  notes_emphasis:
    '!!…!!': жирный + подчёркнутый — самое важное
    '**…**': жирный — термины и важное
    __…__: подчёркнутый — следующее по важности
    ~~…~~: курсив — второстепенное
