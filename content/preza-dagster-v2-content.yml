#
# v2.0.0 — 2026-09-01 — переработка под MLE/MLOps. Предыдущая дека (v1.4,
#          content/preza-dagster-content.yml, 49 слайдов) была справочником сущностей Dagster:
#          пятнадцать слайдов подряд на assets/ops/jobs/schedules/sensors/resources/partitions/
#          code locations/instance/checks, а первый запускаемый код появлялся на слайде 25.
#          Здесь нарратив строится от вопроса «я MLE/DE — как за 10–15 минут понять Dagster,
#          запустить первый pipeline и увидеть, зачем он нужен вместе с dbt и MLflow?».
#          Три центральных блока: Quick Start (011–020), Dagster + dbt (021–032),
#          ML lifecycle (033–044). Справочник сущностей сжат и вынесен в приложение 9xx,
#          которое в план записи входит отдельным блоком «в запись не идёт».
#
# Структура: 72 записываемых слайда (001–074) + 11 слайдов приложения (900–910) = 83.
#   PART 1  001–010  Проблема и ассет
#   PART 2  011–020  Quick Start
#   PART 3  021–032  Dagster + dbt
#   PART 4  033–044  ML lifecycle
#   PART 5  045–053  MLflow и production-паттерны
