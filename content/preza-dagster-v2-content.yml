- kind: content
  id: 055-a-prostoj-mle-stek
  title: 'A. Простой MLE-стек: одна команда, один контур'
  bullets:
  - dbt, Dagster, обычный Python и трекер экспериментов
  - Всё в одном контуре, без Kubernetes и без внешнего исполнения
  - С этого стоит начинать почти всем
  - Порог входа — один день, потолок — один сервер
  code_lang: diagram
  code: |2
        dbt
         ↓
     признаки
         ↓
     обучение на Python
         ↓
      MLflow

     ↕  D A G S T E R  ↕

     владение: одна команда
     исполнение: один процесс
  notes: |2
    [77:36–78:42 · ~1.1 мин] **Что это:**
    - Минимальный рабочий стек: dbt считает данные и признаки, Python обучает, MLflow помнит эксперименты, Dagster связывает всё в один граф.

    **Главное:**
    - !!Восемьдесят процентов команд закрывают свои задачи этой архитектурой и никогда не идут дальше.!!

    **Рассказ:**
    - Показать, что здесь нет ничего лишнего: четыре компонента и один оркестратор поверх.
    - Обучение идёт !!в том же процессе!!, что и оркестрация; для моделей на табличных данных это нормально.
    - Никакого Kubernetes, никакого внешнего исполнения, никаких кодовых локаций.
    - Сказать честно про потолок: он наступает, когда обучение перестаёт помещаться в машину или когда команд становится больше одной.

    **Когда применять:**
    - Одна команда, один dbt-проект, обучение на CPU или одной видеокарте.
    - Нужен предсказуемый результат за неделю, а не платформа на вырост.

    **Когда не надо:**
    - Когда обучение уже не помещается в одну машину.
    - Когда несколько команд должны деплоиться независимо друг от друга.

    **Граница ответственности:**
    - Dagster владеет всем графом целиком, других оркестраторов в схеме нет.
    - MLflow владеет экспериментами и реестром.

    **Граница отказа:**
    - Единственная точка отказа — тот самый один процесс.
    - Это приемлемо, пока цена простоя измеряется часами, а не минутами.

    **Takeaway:**
    - !!Начинать надо здесь; усложнять — только по конкретной боли.!!

    **Переход:**
    - ~~«Вторая архитектура — та же, но с настоящим хранилищем в центре».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/ml
       Что взять: реализацию именно этого стека в официальном примере.

    2. https://docs.dagster.io/deployment/oss/deployment-options/deploying-dagster-as-a-service
       Что взять: минимальный вариант развёртывания под эту архитектуру.

    3. https://mlflow.org/docs/latest/ml/tracking/
       Что взять: самый простой способ поднять трекер рядом.

    **Схема:**
    - Вертикальная цепочка из четырёх блоков, слева и справа — вертикальные стрелки с подписью Dagster, охватывающие всю цепочку.
    - Внизу — две строки про владение и исполнение.
    - Не добавлять на схему Kubernetes даже пунктиром.
- kind: content
  id: 056-b-warehouse-centric-ml
  title: 'B. Warehouse-centric ML: хранилище в центре'
  bullets:
  - Загрузка, хранилище, dbt, признаки, обучение, трекер
  - Партиции и проверки становятся обязательными, а не опциональными
  - Аналитики и MLE работают в одном графе, но в разных группах
  - Самая частая целевая архитектура для команды из пяти человек
  code_lang: diagram
  code: |2
     dlt / Airbyte
         ↓
     хранилище            ← источник правды
         ↓
       dbt                ← партиции, тесты
         ↓
     витрина признаков
         ↓
     обучение → оценка
         ↓
      MLflow

     ↕  D A G S T E R  ↕
     владение: data-команда + MLE
  notes: |2
    [78:42–79:48 · ~1.1 мин] **Что это:**
    - Та же цепочка, но в центре стоит настоящее хранилище, а загрузка вынесена в отдельный инструмент.

    **Главное:**
    - !!Как только появляется хранилище и несколько источников, партиции и проверки перестают быть опцией.!!

    **Рассказ:**
    - Отличие от архитектуры A в двух местах: сверху появилась загрузка как отдельный слой, и данные теперь живут в хранилище, а не в файлах.
    - Отсюда следует всё остальное: инкрементальность, партиции по суткам, тесты на сырой слой, бэкфиллы.
    - Организационно здесь уже две роли: аналитики владеют dbt-слоем, MLE — витриной признаков и ниже.
    - Граф при этом !!один!!, а группы разные — и это правильная конфигурация.

    **Когда применять:**
    - Несколько источников данных, ежедневный ритм, команда из нескольких человек.
    - Есть отдельные люди, отвечающие за dbt, и отдельные — за модели.

    **Когда не надо:**
    - Если источник один и данные помещаются в файл — архитектура A дешевле.
    - Если обучение требует кластера — нужна архитектура C.

    **Граница ответственности:**
    - Загрузка владеет сырым слоем, dbt — трансформациями, MLE — всем ниже витрины признаков.
    - Dagster остаётся единственным оркестратором для всех трёх зон.

    **Граница отказа:**
    - Отказ загрузки не должен приводить к обучению на старых данных: это ровно тот случай, где нужны проверки свежести.

    **Takeaway:**
    - !!Один граф, разные владельцы групп — это нормальная и целевая конфигурация.!!

    **Переход:**
    - ~~«Третья и четвёртая архитектуры — в приложении, A18. А мы отвечаем на вопрос, когда Dagster вообще не нужен».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/dbt
       Что взять: середину схемы — загрузка, dbt, витрины.

    2. https://docs.dagster.io/integrations/libraries/dlt
       Что взять: верхний слой — загрузка как ассеты.

    3. https://docs.dagster.io/guides/build/partitions-and-backfills/partitioning-assets
       Что взять: обоснование, почему на этой архитектуре партиции обязательны.

    **Схема:**
    - Вертикальная цепочка, где блок «хранилище» визуально крупнее остальных: он источник правды.
    - Справа от dbt-блока — подпись «партиции, тесты».
    - Внизу — строка про совместное владение с разделением по группам.
