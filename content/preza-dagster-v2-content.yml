- kind: title
  id: 001-sovremennaya-orkestraciya-ml
  title: Современная оркестрация ML-пайплайнов
  subtitle: Dagster
  notes: |2
    [00:00–00:42 · ~0.7 мин] **Главное:**
    - Эта лекция — не экскурсия по сущностям Dagster, а ответ на рабочий вопрос MLE.

    **Рассказ:**
    - Поздороваться, назвать себя.
    - Сказать прямо, ради чего лекция: у вас уже есть !!dbt-проект, признаки и обучение модели!! — и они живут в трёх разных местах.
    - Dagster — про то, как собрать это в !!один граф!!, у которого можно спросить «что пересчитать».
    - Через двадцать минут вы поднимете Dagster у себя и увидите свой dbt-проект в его интерфейсе.

    **Осторожно:**
    - Не обещать «замену Airflow»: сравнению посвящён отдельный блок, и вывод там будет сбалансированный — тем более что **Airflow 3** сильно продвинулся в сторону ассетов.

    **Переход:**
    - ~~«Смотрим план — он короткий и весь про практику».~~

    — Сгенерировано: model=claude-opus-5 · harness=Claude Code · effort=high · version=v2.2.0 · 2026-09-01
- kind: agenda
  id: 002-plan-lekcii
  title: План лекции
  bullets:
  - 'Проблема: пайплайн MLE живёт в трёх местах'
  - 'Ассет: что должно существовать, а не что запустить'
  - 'Quick Start: от нуля до графа за 10 минут'
  - 'Dagster + dbt: пять уровней интеграции'
  - 'ML lifecycle: фичи, обучение, оценка, реестр, инференс'
  - MLflow и четыре паттерна переобучения
  - Airflow 2.x, Airflow 3.x и Dagster — честное сравнение
  - Две референс-архитектуры и когда Dagster не нужен
  - Домашнее задание
  - Три живых демо внутри блоков, а не в конце
  notes: |2
    [00:42–01:24 · ~0.7 мин] **Главное:**
    - Три центральных блока — !!Quick Start, dbt и ML lifecycle!!; всё остальное их обслуживает.

    **Рассказ:**
    - Первые десять слайдов — это минимум, чтобы начать: зачем, что такое ассет, где Dagster стоит.
    - Дальше три больших практических блока подряд: **Quick Start**, подключение **существующего dbt-проекта** и полный **ML lifecycle** в одном графе.
    - Потом — сравнения и архитектуры: Airflow двух поколений, два референс-стека и честный слайд «когда Dagster не нужен».
    - Предупредить сразу: в каждом из трёх практических блоков лекция !!уходит с экрана слайдов на живой Dagster!! — это не бонус в конце, а часть объяснения.
    - Справочник по остальным сущностям, соседние оркестраторы и запасные экраны демо вынесены в !!приложение!! в конце — оно для самостоятельного чтения, на записи мы его не проходим.

    **Для MLE:**
    - Если считать по времени, больше половины лекции — это ровно то, что вы будете делать руками в домашнем задании.

    **Переход:**
    - ~~«Начнём с проблемы, которую вы, скорее всего, уже узнаёте».~~
- kind: section
  id: 003-problema-pajplajn-zhivet-v-treh-mestah
  title: 'Проблема: пайплайн живёт в трёх местах'
  notes: |2
    [01:24–01:42 · ~0.3 мин] **Рассказ:**
    - Короткая завязка на две минуты: почему у MLE вообще возникает вопрос оркестрации.
- kind: content
  id: 004-odin-den-mle-i-chto-lomaetsya
  title: 'Один день MLE: три системы, ноль общего графа'
  bullets:
  - 'dbt-проект: витрины и признаки, запускается в CI'
  - 'Ноутбук или скрипт: сборка обучающей выборки'
  - 'cron или Airflow-DAG: обучение и батч-инференс'
  - Вопрос «поменялась колонка — что пересчитать?» ответа не имеет
  code_lang: diagram
  code: |2
     dbt CI          ноутбук           cron
     ──────          ───────           ────
     staging   ?     features    ?     train
     marts           dataset           predict

     ? — связь есть только в голове дежурного
  notes: |2
    [01:42–02:54 · ~1.2 мин] **Главное:**
    - Проблема не в том, что нет планировщика, а в том, что !!никто не знает зависимостей между артефактами!!.

    **Рассказ:**
    - Описать знакомую картину: dbt гоняется в CI по пушу, признаки собирает скрипт, обучение висит в cron.
    - Каждая система по отдельности работает.
    - Ломается на стыке: аналитик поменял одну колонку в staging-модели — и никто не может сказать, надо ли переобучать модель.
    - Второй симптом — «перезапустим всё»: ночью считается полный пересчёт, потому что это дешевле, чем разбираться.
    - Третий — инцидент: витрина не обновилась, а обучение всё равно стартовало и обучилось на вчерашних данных.

    **Для MLE:**
    - Все три симптома — про одно и то же: !!граф зависимостей существует, но нигде не записан!!.
    - Планировщик, который умеет только «запусти в 3:00», эту задачу не решает: он не знает, что чем питается.

    **Что важно не перепутать:**
    - Это не претензия к dbt и не претензия к cron.
    - **Каждый инструмент делает свою работу правильно**; отсутствует общий слой, который знал бы про все три сразу.

    **Takeaway:**
    - !!Знаки вопроса на схеме — это и есть предмет лекции.!!

    **Переход:**
    - ~~«Dagster устроен так, чтобы этот граф был записан явно. Формула — на следующем слайде».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets
       Что взять: формулировку «assets are the objects your pipelines produce» — она ровно про то, чего не хватает на этой схеме.

    2. https://openlineage.io/docs/
       Что взять: картинку разорванного lineage между системами как индустриальную постановку той же проблемы.

    3. https://docs.getdbt.com/docs/build/documentation
       Что взять: скриншот dbt-графа, который заканчивается на витринах, — визуальное доказательство, что дальше стрелок нет.

    **Схема:**
    - Три колонки-системы в ряд, между ними крупные знаки вопроса.
    - Не рисовать Dagster на этом слайде вообще.
    - Знаки вопроса должны быть визуально тяжелее подписей систем — они и есть содержание.
    - Внизу одной строкой: «связь есть только в голове дежурного».
- kind: content
  id: 005-dagster-v-odnoj-formule
  title: Dagster в одной формуле
  bullets:
  - Orchestration — что и когда пересчитать
  - Asset graph — что существует и из чего получается
  - Observability — что материализовано, когда, каким кодом
  - Все три — про одни и те же объекты, а не про три системы
  code_lang: diagram
  code: |2
     DAGSTER = orchestration
             + asset graph
             + observability

       ↑ для data- и ML-пайплайнов
  notes: |2
    [02:54–03:48 · ~0.9 мин] **Главное:**
    - Dagster — это !!orchestration + asset graph + observability!!, и все три части описывают одни и те же объекты.

    **Рассказ:**
    - Произнести формулу вслух и разобрать по частям.
    - **Orchestration** — привычная часть: запустить нужное, в нужном порядке, с ретраями.
    - **Asset graph** — то, чего нет у планировщика задач: явно записанные !!зависимости между артефактами!!, а не между шагами.
    - **Observability** — история: что материализовано, когда, сколько строк, с какой метрикой, каким кодом.
    - Подчеркнуть, что третье бесплатно вытекает из второго: раз объекты названы, историю есть на что вешать.

    **Для MLE:**
    - Слово, которое стоит запомнить, ровно одно — !!ассет!!; остальное приложится.

    **Что важно не перепутать:**
    - Это не три модуля, которые можно включать по отдельности.
    - **Asset graph — центр формулы**, а оркестрация и наблюдаемость из него вытекают.

    **Осторожно:**
    - Не превращать слайд в маркетинг: формула нужна как якорь, к которому мы вернёмся ещё дважды.

    **Takeaway:**
    - !!Одна формула на всю лекцию: оркестрация, граф ассетов, наблюдаемость.!!

    **Переход:**
    - ~~«Формула отвечает на „что это“. Следующий вопрос — „где оно стоит в моём стеке“».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/getting-started/quickstart
       Что взять: первый экран Dagster с графом и панелью материализаций — все три части формулы на одном скриншоте.

    2. https://docs.dagster.io/guides/build/assets
       Что взять: определение ассета своими словами, чтобы формула не звучала как слоган.

    3. https://dagster.io/blog/software-defined-assets
       Что взять: исходную формулировку смены парадигмы от авторов — полезна как цитата.

    **Схема:**
    - Три слова в столбик, знак «плюс» между ними, слева общая скобка.
    - Под скобкой подпись «для data- и ML-пайплайнов».
    - Не добавлять иконок и логотипов: слайд должен читаться за две секунды.
- kind: content
  id: 006-gde-stoit-dagster-control-plane
  title: 'Где стоит Dagster: control plane над вашим стеком'
  bullets:
  - Dagster не считает сам — он знает, что и когда пересчитать
  - Вычисления остаются в dbt, Spark, sklearn, Kubernetes
  - Эксперименты и реестр моделей остаются в MLflow
  - Он связывает жизненный цикл артефактов, а не подменяет системы
  materials:
  - label: Dagster — Assets
    url: https://docs.dagster.io/guides/build/assets
  code_lang: diagram
  code: |2
     dbt   Spark   sklearn   MLflow   K8s
      │      │        │        │       │
      └──────┴────────┼────────┴───────┘
                      │
                 D A G S T E R
                 control plane

     что существует · из чего получено
     когда пересчитать · что проверить
  notes: |2
    [03:48–04:54 · ~1.1 мин] **Главное:**
    - !!Dagster связывает lifecycle артефактов, но не заменяет системы, которые их вычисляют, хранят или исполняют.!!

    **Рассказ:**
    - Показать верхний ряд: это ваш существующий стек, и он никуда не денется.
    - SQL по-прежнему выполняет !!ваш склад через dbt!!, тяжёлое обучение — !!ваш кластер!!, эксперименты — !!MLflow!!.
    - Dagster стоит !!над!! ними и отвечает на четыре вопроса из нижней строки схемы.
    - Сказать, зачем этот слайд стоит так рано: он снимает половину вопросов «а зачем тогда dbt» и «а мы уже используем MLflow».

    **Для MLE:**
    - Если из лекции вы заберёте одну мысль — заберите эту: Dagster — это !!control plane!!, а не вычислитель.
    - Практическое следствие: внедрение не требует переписывать dbt-модели и код обучения.

    **Что важно не перепутать:**
    - «Control plane» не значит «тонкая обёртка».
    - Он **владеет знанием о зависимостях и о том, что устарело**, — это самостоятельная и нетривиальная ответственность.

    **Осторожно:**
    - Не давать здесь ни строчки кода — слайд про !!границу ответственности!!, а не про API.

    **Takeaway:**
    - !!Dagster описывает жизненный цикл артефактов; вычисляют их по-прежнему специализированные системы.!!

    **Переход:**
    - ~~«Теперь третий вопрос: почему это вообще интересно ML-инженеру».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/external-pipelines
       Что взять: картинку «Dagster запускает внешнее исполнение и принимает от него события» — прямое доказательство, что вычисление снаружи.

    2. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: формулировку, что dbt-модели становятся ассетами, а выполняет их dbt.

    3. https://mlflow.org/docs/latest/ml/model-registry/
       Что взять: границу ответственности реестра моделей, чтобы показать, что Dagster в неё не лезет.

    **Схема:**
    - Верхний ряд — пять систем в одну линию, одинакового размера, без иерархии между собой.
    - Под ними одна широкая плашка Dagster; стрелки идут ВНИЗ от систем к плашке и обратно, а не последовательно слева направо.
    - Категорически не рисовать Dagster как ещё один прямоугольник в цепочке — он охватывающий слой.
    - Под плашкой — четыре вопроса мелким шрифтом.
- kind: content
  id: 007-iz-voprosov-v-graf
  title: 'Из «?» в граф: что меняется для MLE'
  bullets:
  - Слева — сегодняшний стек, где стрелки не описаны нигде
  - Справа — тот же путь, но каждый шаг является объектом
  - Появляется ответ на вопрос «что изменилось и что пересчитать»
  - Это единственная выгода, ради которой стоит внедрять оркестратор
  code_lang: diagram
  code: |2
     БЫЛО              СТАЛО
     ──────────        ──────────────────
     dbt               dbt model
      ?                   ↓
     feature mart      feature asset
      ?                   ↓
     training dataset  training dataset
      ?                   ↓
     train             trained model
      ?                   ↓
     MLflow            evaluation
      ?                   ↓
     deployment        registered model
  notes: |2
    [04:54–06:00 · ~1.1 мин] **Главное:**
    - !!Главный вопрос, на который отвечает asset graph: что изменилось и что теперь надо пересчитать.!!

    **Рассказ:**
    - Левая колонка — та же схема, что была два слайда назад, только вытянутая в столбик.
    - Знаки вопроса — это не отсутствие кода.
    - Код есть везде; отсутствует !!запись о том, что от чего зависит!!.
    - Правая колонка — тот же самый путь, но каждый шаг назван и каждая стрелка существует в системе.
    - Произнести главный вопрос вслух и сказать, что вся оставшаяся лекция — про то, как система умеет на него отвечать.

    **Для MLE:**
    - Практический сценарий: аналитик поменял `feature mart` — Dagster показывает, что `training dataset` и всё ниже стали устаревшими.
    - Обратный сценарий: модель ведёт себя странно — по графу поднимаемся вверх и видим, какая версия витрины её кормила.

    **Пример:**
    - В команде из четырёх человек этот вопрос обычно задают в чате словами «а мы точно на свежих фичах учились?».
    - Правая колонка превращает этот вопрос в клик по графу.

    **Что важно не перепутать:**
    - Правая колонка не появляется автоматически от установки Dagster.
    - Она появляется, потому что **вы описали шаги как ассеты** — работа небольшая, но она есть.

    **Takeaway:**
    - !!Ценность оркестратора здесь — не расписание, а способность ответить «что пересчитать».!!

    **Переход:**
    - ~~«Дальше вся лекция крутится вокруг одной схемы. Вот она».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/defining-assets-with-asset-dependencies
       Что взять: пример, где зависимость выводится из аргумента функции, — механика правой колонки.

    2. https://docs.dagster.io/guides/build/assets/asset-selection-syntax/reference
       Что взять: синтаксис выборки вниз и вверх по графу — это и есть операционный ответ на «что пересчитать».

    3. https://docs.dagster.io/guides/build/assets/metadata-and-tags/column-level-lineage
       Что взять: колоночный lineage как самый убедительный вид ответа «что сломается от смены колонки».

    **Схема:**
    - Две колонки одинаковой высоты, левая — с крупными знаками вопроса вместо стрелок, правая — со сплошными стрелками.
    - Между колонками одна широкая стрелка перехода с подписью «описали как ассеты».
    - Не подкрашивать левую колонку в красный: она не «плохая», в ней просто нет записанного графа.
- kind: content
  id: 008-skvoznaya-shema-kursa
  title: Сквозная схема этой лекции
  bullets:
  - Одна архитектура, к которой мы возвращаемся весь оставшийся час
  - Сверху — территория dbt, снизу — территория ML
  - Границы между ними в графе нет
  materials:
  - label: Dagster — Quickstart
    url: https://docs.dagster.io/getting-started/quickstart
  code_lang: diagram
  code: |2
     ┌── D A T A ──────────────────┐
     │  raw                        │
     │   ↓                         │
     │  dbt staging                │
     │   ↓                         │
     │  dbt feature mart           │
     └──────────┬──────────────────┘
                ↓
     ┌── M L ───┴──────────────────┐
     │  training dataset           │
     │   ↓                         │
     │  train → evaluate → model   │
     │   ↓                         │
     │  predictions                │
     └─────────────────────────────┘
         DAGSTER ASSET GRAPH
  notes: |2
    [06:00–07:06 · ~1.1 мин] **Главное:**
    - Это !!одна и та же схема!! на всю лекцию; дальше мы будем только дорисовывать на ней детали.

    **Рассказ:**
    - Провести пальцем сверху вниз: сырые данные, staging в dbt, витрина признаков, обучающая выборка, обучение, оценка, модель, предсказания.
    - Обратить внимание на нижнюю подпись: !!весь этот столбец — один asset graph!!.
    - Сказать, что именно здесь проходит граница, из-за которой лекция вообще существует: обычно dbt-часть живёт в одном инструменте, ML-часть — в другом, и стрелка между `dbt feature mart` и `training dataset` не описана нигде.
    - Пообещать, что к концу лекции на эту схему лягут checks, partitions, MLflow, расписания и внешнее исполнение.

    **Для MLE:**
    - Практический смысл верхней половины: !!признаки — это тоже данные!!, и их удобнее считать в dbt, а не в отдельном скрипте.
    - Практический смысл нижней: !!модель — это тоже артефакт!!, у неё есть зависимости и версия.

    **Что важно не перепутать:**
    - Рамки DATA и ML нарисованы для нас, людей.
    - **В самом графе этой границы нет** — там просто ассеты и рёбра.

    **Takeaway:**
    - !!Одна непрерывная цепочка от сырых данных до предсказаний — и она вся в одном графе.!!

    **Переход:**
    - ~~«Теперь про то единственное понятие, вокруг которого всё это построено».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/ml
       Что взять: официальный пример ML-пайплайна на ассетах — та же цепочка, что на схеме, но в коде.

    2. https://docs.dagster.io/examples/full-pipelines/dbt
       Что взять: верхнюю половину схемы в исполнении документации — dbt-модели как ассеты.

    3. https://docs.dagster.io/guides/build/assets/modeling-etl-pipelines
       Что взять: рекомендации, как резать граф на слои, чтобы схема не превратилась в кашу.

    **Скриншот:**
    - Запустить `dg dev` на учебном проекте, где есть и dbt-модели, и ML-ассеты.
    - Открыть вкладку Assets и переключиться в режим графа.
    - Свернуть все группы, кроме `staging`, `marts` и ML-группы.
    - В кадре должны быть видны обе половины схемы и хотя бы одно ребро между ними.
    - Обрезать левый сайдбар и верхнюю навигацию.
    - Стрелкой выделить ровно одно ребро — от витрины признаков к обучающей выборке.
- kind: section
  id: 009-asset-mentalnaya-model
  title: 'Ассет: ментальная модель'
  notes: |2
    [07:06–07:24 · ~0.3 мин] **Рассказ:**
    - Два слайда на понятие, без которого дальше ничего не сойдётся.
- kind: content
  id: 010-software-defined-assets
  title: Software-Defined Assets — программно-определяемые ассеты
  bullets:
  - 'Ассет — объект, который должен существовать: таблица, файл, модель'
  - Код описывает не «что запустить», а «что должно существовать и из чего»
  - Материализация — акт приведения ассета к описанию
  - Зависимости выводятся из сигнатуры функции, а не рисуются руками
  - 'Data-Driven подход: рассуждаем о данных, а не о шагах'
  materials:
  - label: Dagster — Assets
    url: https://docs.dagster.io/guides/build/assets/defining-assets
  code_lang: python
  code: |2
    import dagster as dg

    @dg.asset
    def training_dataset(
        feature_mart,          # ← зависимость
    ):
        """То, что должно существовать."""
        return feature_mart.dropna()
  notes: |2
    [07:24–08:42 · ~1.3 мин] **Главное:**
    - !!Software-Defined Asset — это описание в коде объекта, который должен существовать, и способа его получить.!!

    **Рассказ:**
    - Прочитать код вслух: функция называется `training_dataset` — это !!имя ассета!!, а не имя шага.
    - Аргумент `feature_mart` — это !!другой ассет!!; из одного этого факта Dagster строит ребро графа.
    - Ничего рисовать не надо.
    - Тело функции — способ получить объект.
    - Сформулировать сдвиг мышления в одной фразе: в оркестраторе задач вы пишете !!что сделать!!, в Dagster — !!что должно существовать!!.
    - Отсюда сразу вытекает **data-driven**-подход: система рассуждает про данные, а не про шаги.

    **Для MLE:**
    - Ассетом может быть не только таблица.
    - Файл модели, отчёт об оценке, версия в реестре, набор батч-предсказаний — всё это объекты, которые должны существовать, значит всё это ассеты.
    - Именно поэтому !!ML-часть графа выглядит так же, как dbt-часть!!.

    **Что важно не перепутать:**
    - Имя функции — это **имя ассета**, а не имя джобы.
    - Переименование функции переименовывает узел графа и рвёт историю материализаций; для стабильных имён есть явный параметр `name`.

    **Осторожно:**
    - Не углубляться в `AssetKey`, группы и `deps=` — это приложение и документация.

    **Takeaway:**
    - !!Пишем объекты и их происхождение, а не последовательность шагов.!!

    **Переход:**
    - ~~«Сравним лоб в лоб с тем, к чему мы привыкли в оркестраторах задач».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/defining-assets
       Что взять: минимальный пример декоратора — совпадает со слайдом, удобно показать как первоисточник.

    2. https://docs.dagster.io/guides/build/assets/defining-assets-with-asset-dependencies
       Что взять: разницу между зависимостью через аргумент и зависимостью через `deps=`.

    3. https://dagster.io/blog/software-defined-assets
       Что взять: авторскую аргументацию, почему смена единицы графа важнее синтаксиса.

    **Скриншот:**
    - Открыть в редакторе файл с двумя ассетами и рядом — вкладку графа в браузере.
    - Свести оба окна в один кадр так, чтобы имя функции в коде и имя узла в графе читались одновременно.
    - Стрелкой соединить аргумент `feature_mart` в сигнатуре с соответствующим ребром на графе.
    - Убрать из кадра всё, кроме этих двух элементов.
- kind: table
  id: 011-asset-protiv-task
  title: Ассет против задачи
  table:
    headers: ['Вопрос', 'Task-centric', 'Asset-centric']
    rows:
    - ['Что описывает код', 'Шаг, который надо выполнить', 'Объект, который должен существовать']
    - ['Единица графа', 'Задача', 'Ассет: таблица, датасет, модель']
    - ['Откуда зависимости', 'Заданы руками между задачами', 'Выведены из аргументов функции']
    - ['«Что пересчитать?»', 'Отвечает дежурный', 'Отвечает граф']
    - ['История запусков', 'Успех или падение задачи', 'Материализации ассета с метаданными']
    - ['Свежесть данных', 'Внешний мониторинг', 'Asset checks и freshness прямо в графе']
    - ['Частичный пересчёт', 'Отдельный запуск', 'Селекция по графу: features+']
    - ['dbt-модель в графе', 'Одна задача dbt build', 'Каждая модель — отдельный ассет']
    col_ratios: [3, 4, 4]
  notes: |2
    [08:42–10:00 · ~1.3 мин] **Главное:**
    - Разница не в синтаксисе, а в том, !!на какой вопрос система умеет отвечать!!.

    **Рассказ:**
    - Идти по строкам, не зачитывая всё подряд; задержаться на трёх.
    - Строка про зависимости: в task-centric модели граф вы рисуете руками, и он может !!разойтись с реальностью!! — код читает одну таблицу, а стрелка нарисована от другой.
    - В asset-centric модели ребро выводится из сигнатуры, расходиться нечему.
    - Строка «что пересчитать»: это тот самый вопрос со слайда про проблему.
    - В левой колонке на него отвечает человек, в правой — граф.
    - Строка про dbt: типичный task-centric DAG видит !!один прямоугольник `dbt build`!!, asset-centric — сотню моделей по отдельности.

    **Для MLE:**
    - Строка про историю запусков — самая недооценённая.
    - «Задача упала» и «у ассета вчера было 3 % пропусков в целевой колонке» — это !!разные уровни знания!! о вашем пайплайне.

    **Что важно не перепутать:**
    - Колонки названы **Task-centric** и **Asset-centric** намеренно, а не «Airflow» и «Dagster».
    - Airflow 3 умеет ассеты, и отдельный блок лекции разбирает это подробно; здесь мы сравниваем **две модели мышления**, а не два продукта.

    **Осторожно:**
    - Не превращать таблицу в обвинение оркестраторов задач: у них есть свои сильные стороны, и мы к ним вернёмся.
    - Правая колонка — это !!другая задача!!, а не более новая версия той же.

    **Takeaway:**
    - !!Меняется единица графа — и вместе с ней меняется набор вопросов, на которые есть ответ.!!

    **Переход:**
    - ~~«Хватит теории. Поднимаем Dagster и смотрим на всё это в браузере».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets
       Что взять: правую колонку целиком — она пересказывает раздел «why assets».

    2. https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/assets.html
       Что взять: подтверждение, что task-centric модель тоже обзавелась ассетами, — чтобы колонка не читалась как «Airflow отстал».

    3. https://docs.dagster.io/guides/build/assets/asset-selection-syntax/reference
       Что взять: конкретику к строке «частичный пересчёт».

    **Схема:**
    - Таблица уже является визуалом; дополнительная картинка не нужна.
    - Если хочется усилить — вынести над таблицей две микро-схемы: цепочку прямоугольников «task → task» и цепочку цилиндров «asset → asset».
    - Не подписывать колонки названиями продуктов.
