- kind: content
  id: 925-a15-podklyuchit-odnoj-komandoj
  title: 'Подключить за одну команду: компонент'
  bullets:
  - Компонент описывается в defs.yaml, без Python вообще
  - Одна команда создаёт заготовку из существующего проекта
  - select и exclude — обычный синтаксис выборки dbt
  - Правила именования и группировки задаются тут же
  materials:
  - label: dbt-компонент — туториал
    url: https://docs.dagster.io/guides/build/components/integrations/dbt-component-tutorial
  code_lang: yaml
  code: |2
    # dg scaffold defs \
    #   dagster_dbt.DbtProjectComponent \
    #   --project-path ../analytics_dbt
    #
    # defs/analytics_dbt/defs.yaml

    type: dagster_dbt.DbtProjectComponent

    attributes:
      project: ../analytics_dbt
      select: "fqn:marts.* fqn:staging.*"
      translation:
        group_name: dbt
  notes: |2
    **Главное:**
    - !!Существующий dbt-проект подключается одной командой и десятью строками YAML.!!

    **Рассказ:**
    - Показать команду скаффолдинга: она создаёт папку определений и файл `defs.yaml`.
    - Разобрать файл: `type` — какой компонент, `attributes` — его настройки.
    - `project` — путь к вашему dbt-проекту; копировать проект внутрь Dagster !!не нужно!!.
    - `select` и `exclude` — тот же синтаксис, что в `dbt build --select`, знакомый аналитикам.
    - `translation` — короткий способ задать правила именования и группировки, не открывая Python.

    **Для MLE:**
    - Это тот самый «первый боевой пайплайн»: вы берёте проект, который уже работает у аналитиков, и не трогаете в нём ни строчки.

    **Что важно не перепутать:**
    - Компоненты — не «упрощённая версия для новичков».
    - Это **штатный декларативный способ описания определений**; на Python можно перейти в любой момент и совмещать оба стиля в одном проекте.

    **Осторожно:**
    - Начиная с Dagster 1.13 состояние компонентов, которые ходят во внешние системы, по умолчанию сохраняется локально, и его надо !!обновлять в CI!! — иначе деплой соберётся на устаревших метаданных.

    **Takeaway:**
    - !!Одна команда, один YAML — и dbt-проект в графе.!!

    **Переход:**
    - ~~«Тот же результат на Python — когда нужна логика, а не конфигурация».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/components/integrations/dbt-component-tutorial
       Что взять: пошаговый туториал — слайд повторяет его сжато.

    2. https://docs.dagster.io/guides/build/components
       Что взять: общее объяснение, что такое компонент и зачем он появился.

    3. https://docs.dagster.io/guides/build/components/state-backed-components
       Что взять: правило про обновление состояния в CI — то, о чём предупреждение в заметке.

    **Скриншот:**
    - Показать три вещи подряд: команда в терминале, созданный `defs.yaml` в редакторе, граф dbt-моделей в браузере.
    - Скомпоновать их вертикально как последовательность.
    - Подписать шаги цифрами 1–2–3.
    - Не выделять ничего рамкой: сама последовательность и есть сообщение.
- kind: content
  id: 926-a15-to-zhe-na-python
  title: 'То же на Python: @dbt_assets'
  bullets:
  - Декоратор разворачивает манифест в набор ассетов
  - DbtCliResource выполняет команду и стримит события обратно
  - 'dbt build вместо run + test: модели и тесты одним проходом'
  - Нужен, когда требуется логика, а не только конфигурация
  materials:
  - label: Dagster & dbt (Pythonic)
    url: https://docs.dagster.io/integrations/libraries/dbt/dbt-pythonic
  code_lang: python
  code: |2
    from dagster_dbt import (
        dbt_assets, DbtCliResource,
    )

    @dbt_assets(
        manifest=dbt_project.manifest_path,
    )
    def analytics_dbt(context, dbt):
        yield from dbt.cli(
            ["build"], context=context,
        ).stream()
  notes: |2
    **Главное:**
    - !!Python-путь даёт то же самое, но позволяет вмешаться в то, как и что запускается.!!

    **Рассказ:**
    - Декоратор `@dbt_assets` принимает путь к манифесту и разворачивает его в набор ассетов.
    - Внутри функции вы сами решаете, какую команду dbt вызвать: `build`, `run`, `test`, с какими аргументами.
    - `stream()` возвращает события по мере выполнения: Dagster узнаёт про каждую модель отдельно, а не только про код возврата процесса.
    - Объяснить, почему `build`, а не `run` + `test`: !!модель и её тесты выполняются одним проходом!!, и проверка привязывается к правильной материализации.

    **Для MLE:**
    - Python-путь нужен, когда команда зависит от контекста: например, при партиционировании в dbt передаётся окно дат.
    - Мы увидим это на слайде про партиции.

    **Что важно не перепутать:**
    - Компонент и `@dbt_assets` — **не взаимоисключающие**.
    - Компонент — декларативная обёртка над тем же механизмом; в одном проекте можно держать и то, и другое.

    **Takeaway:**
    - !!YAML — когда достаточно конфигурации; Python — когда нужна логика.!!

    **Переход:**
    - ~~«Уровень 1 закрыт. Поднимаемся на второй — сквозной граф».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt/dbt-pythonic
       Что взять: канонический пример декоратора и ресурса — он совпадает со слайдом.

    2. https://docs.dagster.io/integrations/libraries/dbt/dagster-dbt
       Что взять: справочник по `DbtCliResource` и его методам.

    3. https://docs.dagster.io/examples/full-pipelines/dbt/dbt-assets
       Что взять: тот же код в контексте целого проекта.

    **Схема:**
    - Две колонки: слева YAML-компонент, справа Python-декоратор, между ними знак равенства с оговоркой «плюс логика».
    - Ниже — общая стрелка вниз в один и тот же asset graph.
    - Не изображать один путь как «продвинутый», а другой как «начальный».
- kind: content
  id: 927-a15-level-2-skvoznoj-graf
  title: 'Level 2: сквозной граф от загрузки до обучения'
  image: pic-dagster-dbt-to-ml.png
  bullets:
  - Целевой уровень MLE — dbt и ML в одном графе
  - Витрина признаков — единственный стык
  code_lang: diagram
  code: |2
     ingestion
        ↓
     dbt source          ← внешний ассет
        ↓
     staging
        ↓
     intermediate
        ↓
     feature mart        ← СТЫК
        ↓
     training dataset
        ↓
     training
  notes: |2
    **Главное:**
    - !!Уровень 2 — то, ради чего MLE читает эту лекцию: непрерывный граф от загрузки до обучения.!!

    **Рассказ:**
    - Пройти цепочку сверху вниз и назвать владельца каждого участка: загрузка — инженер данных, staging и витрины — аналитик, обучающая выборка и модель — вы.
    - Отметить, что !!границы владения остались!!, а граф стал общим.
    - Показать стык: `feature mart` — последняя dbt-модель и первый вход ML-части.
    - Сказать, что технически это одно ребро, а организационно — самое ценное ребро во всей схеме.

    **Для MLE:**
    - После этого уровня на вопрос «модель обучена на свежих данных?» отвечает интерфейс, а не переписка.
    - И наоборот: аналитик видит, что его витрина кого-то кормит, и перед изменением схемы это заметно.

    **Пример:**
    - Аналитик переименовал колонку в витрине.
    - На уровне 1 это заметил бы только упавший скрипт обучения; на уровне 2 связь видна до изменения.

    **Что важно не перепутать:**
    - Сквозной граф **не означает единый запуск**.
    - Части могут материализоваться по разным расписаниям и разными командами — это по-прежнему один граф.

    **Takeaway:**
    - !!Стык dbt и ML перестаёт быть устной договорённостью и становится ребром графа.!!

    **Переход:**
    - ~~«Чтобы это ребро появилось, ключи ассетов должны сойтись. Разбираем, как».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/dbt
       Что взять: официальный сквозной пример — загрузка, dbt, продолжение.

    2. https://docs.dagster.io/examples/full-pipelines/ml
       Что взять: ML-половину той же цепочки.

    3. https://docs.dagster.io/guides/build/assets/modeling-etl-pipelines
       Что взять: рекомендации по слоям, чтобы сквозной граф не превратился в спагетти.

    **Скриншот:**
    - Проект, где есть загрузочные ассеты, dbt-модели и минимум два ML-ассета.
    - Открыть Asset Graph, включить группы и свернуть их до уровня слоёв.
    - В кадре: четыре-пять групп в одну линию и рёбра между ними.
    - Стрелкой выделить ровно одно ребро — от группы витрин к ML-группе.
    - Подписать это ребро «стык, ради которого всё делалось».
- kind: content
  id: 928-a15-sshivka-klyuchej
  title: 'Сшивка ключей: translator и dbt-источники'
  bullets:
  - Ключ ассета — общее имя, по которому графы сшиваются
  - Translator решает, как модель dbt называется в Dagster
  - Источник dbt получает ключ загрузочного ассета — и ребро появляется
  - 'Разошлись ключи — граф распадается на два куска'
  code_lang: yaml
  code: |2
    # models/staging/_sources.yml
    sources:
      - name: olist_raw
        tables:
          - name: orders
            meta:
              dagster:
                asset_key:
                  ["raw", "olist", "orders"]

    # тот же ключ — у ассета загрузки:
    #   @dg.asset(key=["raw","olist","orders"])
  notes: |2
    **Главное:**
    - !!Граф сшивается совпадением ключей ассетов — это единственный механизм, и он же единственная точка отказа.!!

    **Рассказ:**
    - Объяснить, что у каждого ассета есть ключ — путь из сегментов, а не просто имя. dbt-модель по умолчанию получает ключ из своего имени; загрузочный ассет — из своего.
    - Совпали ключи — Dagster видит один и тот же объект и рисует ребро; не совпали — !!два узла-двойника и разорванный граф!!.
    - Показать оба конца: в `_sources.yml` источнику явно назначен ключ, и тот же ключ стоит у загрузочного ассета.
    - Сказать про `DagsterDbtTranslator`: это точка расширения, где можно задать правила именования и группировки для всех моделей сразу, а не по одной.

    **Для MLE:**
    - Это самое частое место, где сквозной граф не получается с первого раза.
    - Симптом: в графе висят «сироты» — источники без родителей.

    **Пример:**
    - В домашнем задании именно это оценивается: ингест-ассеты должны быть !!настоящими родителями!! dbt-графа, а не отдельной кучей рядом.

    **Что важно не перепутать:**
    - Ключ — это **не имя таблицы в базе**.
    - Это идентификатор узла в графе Dagster; он может совпадать с именем таблицы, а может нет.

    **Осторожно:**
    - Менять правила именования на живом проекте больно: у ассетов сменятся ключи и разорвётся история материализаций.
    - Договариваться о схеме имён надо в начале.

    **Takeaway:**
    - !!Один общий язык между загрузкой, dbt и ML — ключ ассета.!!

    **Переход:**
    - ~~«Уровень 2 есть. Дальше — продакшен-семантика: тесты и партиции».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: раздел про `DagsterDbtTranslator` и назначение ключей источникам.

    2. https://docs.dagster.io/guides/build/assets/external-assets
       Что взять: как описать объект, который считает не Dagster, — второй конец сшивки.

    3. https://docs.getdbt.com/docs/build/documentation
       Что взять: место, где в dbt-проекте живут `meta` у источников.

    **Скриншот:**
    - Сделать два снимка одного графа: с разошедшимися ключами и с сошедшимися.
    - На первом видны узлы-сироты без входящих рёбер; на втором — связная цепочка.
    - Подписать «ключи разошлись» и «ключи сошлись».
    - Стрелкой указать на сироту в первом кадре и на появившееся ребро во втором.
- kind: content
  id: 929-a15-level-3-testy-v-checks
  title: 'Level 3: dbt-тесты становятся asset checks'
  image: pic-dagster-dbt-checks.png
  bullets:
  - dbt-тесты грузятся как проверки ассетов
  - Упавшая останавливает ветку, а не весь запуск
  materials:
  - label: dbt-тесты как asset checks
    url: https://docs.dagster.io/examples/full-pipelines/dbt/dbt-tests
  code_lang: diagram
  code: |2
     dbt test          asset check
     ──────────        ─────────────────
     not_null      →   проверка ассета
     unique        →   статус у данных
     relationships →   стоп downstream
     accepted_val  →   метаданные

     dbt build = модель + её тесты
                 одним проходом
  notes: |2
    **Главное:**
    - !!Тесты, которые аналитики уже написали в dbt, становятся проверками графа без единой строки нового кода.!!

    **Рассказ:**
    - Напомнить, что в приличном dbt-проекте тестов уже десятки: `not_null`, `unique`, `relationships`, `accepted_values`.
    - Dagster обнаруживает их при разборе проекта и превращает в проверки, привязанные к соответствующей модели.
    - Результат виден !!на карточке модели!!, рядом с последней материализацией — а не в отдельном отчёте dbt, который никто не открывает.
    - Ключевое поведение: упавшая проверка останавливает ветку графа ниже, а не весь запуск.
    - Напомнить, зачем `dbt build`: модель и её тесты идут одним проходом и привязываются к одной материализации.

    **Для MLE:**
    - Практический выигрыш: !!испорченные данные не доезжают до обучения!!.
    - Это дешевле, чем обнаружить проблему по странной метрике через неделю.

    **Что важно не перепутать:**
    - Проверка **не откатывает** уже записанные данные.
    - Она фиксирует факт и останавливает распространение — уборка остаётся вашей задачей.

    **Осторожно:**
    - Не все тесты одинаково важны.
    - Разделяйте уровни серьёзности: часть проверок должна предупреждать, а не блокировать ветку.

    **Takeaway:**
    - !!Качество данных перестаёт быть отдельным отчётом и становится статусом узла.!!

    **Переход:**
    - ~~«Второй элемент продакшен-семантики — время. Партиции».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/dbt/dbt-tests
       Что взять: как выглядят автоматически созданные проверки в интерфейсе.

    2. https://docs.getdbt.com/docs/build/data-tests
       Что взять: перечень типов тестов dbt — левая колонка схемы.

    3. https://docs.dagster.io/guides/test/asset-checks
       Что взять: уровни серьёзности и поведение downstream — то, о чём предупреждение.

    **Скриншот:**
    - Открыть карточку dbt-модели, у которой есть тесты, вкладку проверок.
    - В кадре: список проверок с именами, совпадающими с именами тестов в dbt-проекте.
    - Рядом врезкой — фрагмент `schema.yml` с этими же тестами.
    - Стрелками связать две-три строки из YAML с соответствующими строками в интерфейсе.
