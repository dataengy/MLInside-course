    - ['Ветки и превью-окружения', 'вручную', 'Branch Deployments из коробки']
    - ['Каталог, поиск, инсайты', 'базовые в интерфейсе', 'расширенные, включая стоимость']
    - ['Доступы и аудит', 'свои средства', 'RBAC, SSO, аудит-лог']
    - ['Алерты и SLA', 'свои интеграции', 'встроенные политики алертов']
    - ['Цена', 'бесплатно', 'подписка']
    col_ratios: [3, 3, 4]
  notes: |2
    **Главное:**
    - Ядро оркестрации в открытой версии полное — платная редакция добавляет эксплуатацию и командную работу, а не возможности графа.

    **Осторожно:**
    - Условия и состав редакций меняются; перед выбором стоит свериться с текущим прайсом на сайте, а не с этим слайдом.
- kind: content
  id: 905-cli-shpargalka
  title: 'CLI: шпаргалка'
  bullets:
  - 'dg — современный CLI: скаффолдинг, валидация, цикл разработки'
  - 'dagster — классические команды запуска и эксплуатации'
  - Выборка понимает группы, теги и выражения по графу
  - Миграция инстанса обязательна при обновлении версии
  - CLI удобен для CI и отладки без интерфейса
  code_lang: bash
  code: |2
    # ── разработка ──────────────────
    dg dev                # UI + демон
    dg list defs          # что есть
    dg check defs         # валидация
    dg scaffold project my_prj
    dg launch --assets 'features+'

    # ── запуск ──────────────────────
    dagster asset materialize \
        --select stg_transactions
    dagster asset materialize \
        --select "group:marts"
    dagster job execute -j daily_marts
    dagster asset backfill \
        --select transactions_daily \
        --partition-range \
          2026-01-01...2026-06-30

    # ── эксплуатация ────────────────
    dagster instance migrate
  notes: |2
    **Главное:**
    - Два семейства команд сосуществуют: `dg` — про проект и разработку, `dagster` — про запуск и эксплуатацию.

    **Как пользоваться:**
    - `dg check defs` стоит поставить в CI: он ловит поломанные определения до деплоя.
    - Синтаксис выборки один и тот же везде — в CLI, в интерфейсе и в расписаниях.
- kind: content
  id: 906-mcp-dagster-i-ai-agenty
  title: 'MCP: Dagster и AI-агенты'
  bullets:
  - 'MCP — открытый протокол доступа моделей к инструментам'
  - 'Официальный сервер из dg — про разработку, помогает писать код'
  - 'Серверы сообщества — про эксплуатацию: смотреть запуски и ассеты'
  - Агент получает структуру проекта, а не догадки
  - 'Направление молодое: проверяйте права доступа'
  materials:
  - label: Model Context Protocol
    url: https://modelcontextprotocol.io
  code_lang: json
  code: |2
    {
      "mcpServers": {
        "dagster": {
          "command": "dg",
          "args": ["mcp", "serve"]
        }
      }
    }
  notes: |2
    **Главное:**
    - Официальный MCP-сервер Dagster решает задачу разработки: агент видит определения проекта и умеет их скаффолдить.

    **Когда применять:**
    - Проект большой, определений много, и агент иначе догадывается о структуре вместо того, чтобы её прочитать.

    **Осторожно:**
    - Серверы для эксплуатации — сторонние.
    - Давать агенту доступ к продовому инстансу стоит только в режиме чтения и осознанно.
- kind: content
  id: 907-dlt-zagruzka-kak-kod
  title: 'dlt: загрузка как код'
  bullets:
  - 'Python-библиотека загрузки: источник → приёмник'
  - Схема выводится автоматически, эволюция схемы поддержана
  - Каждый ресурс dlt становится ассетом Dagster
  - Живёт в одном процессе с оркестратором — без лишнего сервиса
  materials:
  - label: dlt docs
    url: https://dlthub.com/docs
  code_lang: python
  code: |2
    from dagster_dlt import (
        DagsterDltResource, dlt_assets,
    )

    @dlt_assets(
        dlt_source=sql_database()
            .with_resources(
                "transactions", "customers",
            ),
        dlt_pipeline=dlt.pipeline(
            pipeline_name="shop",
            destination="clickhouse",
            dataset_name="raw",
        ),
        name="shop_ingest",
        group_name="ingestion",
    )
    def shop_assets(context, dlt_res):
        yield from dlt_res.run(
            context=context,
        )
  notes: |2
    **Главное:**
    - dlt закрывает верхний узел сквозной схемы — тот самый `ingestion`, от которого идёт стрелка к dbt-источнику.

    **Когда применять:**
    - Источников немного, они API- или SQL-подобные, и заводить отдельный сервис загрузки не хочется.

    **Когда не надо:**
    - Нужны десятки готовых коннекторов к SaaS — это территория Airbyte со следующего слайда.

    **Граница ответственности:**
    - Ключ ассета, который создаёт dlt, должен совпадать с ключом источника dbt — иначе граф останется разорванным.
- kind: content
  id: 908-airbyte-konnektory-kak-servis
  title: 'Airbyte: коннекторы как сервис'
  bullets:
  - Сотни готовых коннекторов — писать загрузку не надо
  - Отдельный сервис со своей инфраструктурой и интерфейсом
  - Dagster триггерит синхронизации и видит их как ассеты
  - Таблицы Airbyte становятся апстримом dbt-моделей
  code_lang: python
  code: |2
    from dagster_airbyte import (
        AirbyteCloudWorkspace,
        load_airbyte_asset_specs,
    )

    workspace = AirbyteCloudWorkspace(
        workspace_id=dg.EnvVar(
            "AIRBYTE_WORKSPACE_ID"),
        client_id=dg.EnvVar(
            "AIRBYTE_CLIENT_ID"),
        client_secret=dg.EnvVar(
            "AIRBYTE_CLIENT_SECRET"),
    )

    specs = load_airbyte_asset_specs(
        workspace,
    )
    defs = dg.Definitions(
        assets=[*specs, dbt_models],
    )
  notes: |2
    **Главное:**
    - Airbyte решает ту же задачу, что dlt, но как отдельный сервис с готовым каталогом коннекторов.

    **Когда применять:**
    - Много SaaS-источников, писать и сопровождать коннекторы самим дороже, чем поднять сервис.

    **Когда не надо:**
    - Источников два-три и оба SQL — тогда dlt дешевле по эксплуатации.

    **Граница отказа:**
    - Синхронизация живёт в Airbyte; Dagster видит её результат как материализацию и на её основе решает, что пересчитывать ниже.
