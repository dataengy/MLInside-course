  title: 'A. Простой MLE-стек: одна команда, один контур'
  bullets:
  - Загрузка, склад, dbt, признаки, обучение, трекинг
  - Dagster проходит через весь стек одним графом
  - С этого стоит начинать почти всем
  code_lang: diagram
  code: |2
     dlt / Airbyte
         ↓
     хранилище
         ↓
       dbt
         ↓
     признаки
         ↓
     обучение на Python
         ↓
      MLflow

     ↕  D A G S T E R  ↕
  notes: |2
    [82:24–83:48 · ~1.4 мин] **Главное:**
    - Это !!стартовая архитектура!!, и она закрывает потребности большинства команд без единого лишнего компонента.

    **Рассказ:**
    - Пройти сверху вниз: коннектор льёт данные, склад хранит, dbt считает витрины и признаки, Python обучает, MLflow ведёт эксперименты.
    - Обратить внимание на двустороннюю стрелку сбоку: Dagster !!не встроен в один слой!!, он пронизывает все.
    - Сказать, чего здесь нет и почему: нет Kubernetes, нет Argo, нет второго оркестратора.
    - Их отсутствие — это фича, а не незрелость.

    **Когда применять:**
    - Одна-две команды, обучение укладывается на обычной машине, данных до десятков терабайт.

    **Когда не надо:**
    - Нужен GPU и распределённое обучение — переходим к архитектуре B.

    **Граница ответственности:**
    - Dagster владеет всем графом целиком; отдельных владельцев кусков здесь нет, и это упрощает жизнь.

    **Граница отказа:**
    - Одна точка отказа на весь контур; для этого масштаба это приемлемая цена простоты.

    **Переход:**
    - ~~«Добавим Kubernetes и GPU».~~
- kind: content
  id: 066-b-production-kubernetes-mlops
  title: 'B. Production MLOps в Kubernetes'
  bullets:
  - Лёгкая часть графа считается в Dagster
  - Тяжёлое обучение уходит в кластер через Pipes
  - Реестр и сервинг остаются самостоятельными системами
  code_lang: diagram
  code: |2
     источники
        ↓
     Dagster → dbt → витрины признаков
        │
        └──── Pipes ────→ Argo / K8s / GPU
                              ↓
                           MLflow
                              ↓
                       реестр моделей
                              ↓
                      платформа сервинга
  notes: |2
    [83:48–85:30 · ~1.7 мин] **Главное:**
    - Отличие от A ровно одно: !!исполнение вынесено из процесса Dagster!!, всё остальное на месте.

    **Рассказ:**
    - Показать развилку: лёгкая часть — загрузка, dbt, витрины — считается там же, где раньше.
    - Тяжёлая уходит вбок через Pipes, возвращается артефактом, и дальше граф продолжается: MLflow, реестр, сервинг.
    - Подчеркнуть, что !!граф не разрывается!!: кусок, выполненный в кластере, всё равно виден в Dagster как материализация с логами и метаданными.
    - Сказать, что Argo здесь — вариант, а не обязательный элемент: `PipesK8sClient` умеет запускать поды сам.

    **Когда применять:**
    - Есть GPU или распределённое обучение; платформа уже в Kubernetes; есть команда, которая её сопровождает.

    **Когда не надо:**
    - Кластер придётся заводить ради одного обучения — это самая дорогая ошибка в этом списке.

    **Граница ответственности:**
    - Dagster — граф и артефакты; Kubernetes — ресурсы и исполнение; реестр — версии и стадии.

    **Граница отказа:**
    - Три независимых контура отказа.
    - Правило: !!каждый отказ должен быть виден на карточке ассета!!, иначе наблюдаемость распадается.

    **Переход:**
    - ~~«И самый крупный масштаб — когда команд много».~~
- kind: content
  id: 067-c-bolshaya-composable-platforma
  title: 'C. Большая композитная платформа'
  bullets:
  - Верхний этаж — события и процессы всей компании
  - Средний — data/ML-граф со своими владельцами
  - Нижний — исполнители и легаси-системы
  code_lang: diagram
  code: |2
     Kestra — платформа и события
        │
        ├── Dagster
        │     data + ML assets
        │       ├── dbt
        │       ├── MLflow
        │       └── пайплайны признаков
        │
        ├── Argo
        │     K8s / GPU-нагрузки
        │
        └── legacy Airflow / внешние

     один оркестратор
     на границу ответственности
  notes: |2
    [85:30–87:12 · ~1.7 мин] **Главное:**
    - !!Один оркестратор на границу ответственности, а не один оркестратор на всё!!.

    **Рассказ:**
    - Пройти по этажам и назвать владельцев: верхний — платформенная команда, средний — data/ML, нижний — инфраструктура и легаси.
    - Подчеркнуть, что каждая ветка — это !!отдельная команда с отдельным релизным циклом!!, и именно это оправдывает три оркестратора, а не техническая красота.
    - Сказать честно: такая схема окупается !!от нескольких десятков инженеров!!.
    - На меньшем масштабе она даёт только накладные расходы.
    - Вернуться к проверочному вопросу из блока про соседей: у каждого ассета здесь ровно один владелец.

    **Когда применять:**
    - Много команд, много доменов, разные релизные циклы, есть кому сопровождать каждый слой.

    **Когда не надо:**
    - Команда одна.
    - Тогда это !!архитектура ради архитектуры!!, и она замедлит всё.

    **Граница ответственности:**
    - Kestra не знает про dbt-модели; Dagster не знает про бизнес-процессы соседей; Argo не знает про lineage.

    **Граница отказа:**
    - Отказ на одном этаже не должен требовать вмешательства на другом.
    - Если требует — границу провели неправильно.

    **Переход:**
    - ~~«Осталось ответить на главный практический вопрос: а вам-то Dagster нужен?».~~
# ── PART 9 · Когда выбирать Dagster ──────────────────────────────────────────────────────
- kind: content
  id: 068-kogda-vybirat-dagster
  title: Когда Dagster подходит, а когда стоит поискать другое
  bullets:
  - 'Критерий один: есть ли у вас данные как объекты с важными зависимостями'
  - Есть — выигрыш от asset-модели окупает порог входа
  - Нет — вы платите за модель, которой не пользуетесь
  - Правая колонка честнее левой — читаем её внимательно
  code_lang: diagram
  code: |2
     ПОДХОДИТ              ПОИЩИТЕ ДРУГОЕ
     ──────────────────    ──────────────
     dbt-heavy платформа   большой парк
     аналитика + ML        Airflow
       вместе              generic-
     важны lineage           автоматизация
       и метаданные        K8s без
     партиции, бэкфиллы      семантики
     data products         динамические
     Python-команда          workflow
     новый контур          команда не
       с нуля                видит пользы
  notes: |2
    [87:12–88:54 · ~1.7 мин] **Главное:**
    - Dagster даёт максимум там, где есть !!dbt и ML в одном жизненном цикле!!; вне этого сценария выигрыш быстро тает.

    **Рассказ:**
    - Пройти левую колонку.
    - Все пункты сводятся к одному: у вас есть !!данные как объекты!!, у них есть зависимости, и эти зависимости важны.
    - Пройти правую и не смягчать.
    - Большой парк Airflow — это годы миграции.
    - Generic-автоматизация вроде «раз в час дёрнуть API и положить файл» не выигрывает от asset-модели ничего.
    - Kubernetes-процессы без семантики данных — это территория Argo.
    - Очень динамические workflow — территория Prefect.
    - Задержаться на последнем пункте правой колонки, он самый честный: если команда !!не видит пользы!! от asset-модели, внедрение провалится независимо от качества инструмента.

    **Осторожно:**
    - Не давать ответ «берите Dagster всегда».
    - Слайд ценен именно правой колонкой.

    **Переход:**
    - ~~«И короткая карта: какая потребность каким инструментом закрывается».~~
