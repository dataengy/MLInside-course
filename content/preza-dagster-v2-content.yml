    - Связка именно с Argo строится поверх этого своими руками.

    **Когда применять:**
    - Нужен GPU, распределённое обучение, контейнерные нагрузки; платформа и так живёт в Kubernetes и Argo в ней уже стоит.

    **Когда не надо:**
    - Argo в компании ещё нет.
    - Тогда ставить его ради обучения — !!лишний слой!!: `PipesK8sClient` запускает под напрямую и закрывает ту же задачу.

    **Граница ответственности:**
    - Dagster решает !!что и когда!! обучать и что считать результатом; Argo решает !!где и на чём!! это выполнить.

    **Граница отказа:**
    - Отказ внутри кластера = ассет не материализован.
    - Ретраи, алерты и «что делать дальше по графу» остаются в Dagster; разбор пода — в Kubernetes.

