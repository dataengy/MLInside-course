    **Осторожно:**
    - ⚠ Главная ошибка этой связки — !!управлять одним жизненным циклом из двух мест!!.
    - Если Kestra дёргает отдельные dbt-модели, а Dagster тоже их пересчитывает, вы получили гонку, а не архитектуру.

    **Переход:**
    - ~~«Следующий сосед — про исполнение в Kubernetes».~~
