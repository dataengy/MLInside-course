    - Один lifecycle — !!один владелец!!.
    - Витрины и модели ведёт Dagster, интеграции и операции — Airflow.

    **Граница отказа:**
    - Падение Airflow не должно останавливать пересчёт витрин, и наоборот; иначе это не два оркестратора, а один с двумя точками отказа.

