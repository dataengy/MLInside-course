- kind: section
  id: 033-ml-lifecycle-kak-asset-graph
  title: ML lifecycle как asset graph
  notes: |2
    [38:54–39:12 · ~0.3 мин] **Рассказ:**
    - Вторая центральная часть: всё, что ниже витрины признаков.
- kind: content
  id: 034-polnyj-lifecycle
  title: Полный жизненный цикл в одном графе
  bullets:
  - От загрузки до мониторинга — одна непрерывная цепочка
  - Мониторинг замыкает круг и запускает переобучение
  - Каждый узел здесь — объект, который должен существовать
  code_lang: diagram
  code: |2
     data ingestion
        ↓
     dbt transformations
        ↓
     feature engineering
        ↓
     training dataset
        ↓
     training  →  evaluation
                     ↓
                model registry
                     ↓
                 deployment
                     ↓
       batch / online inference
                     ↓
                monitoring
                     ↓
          retraining trigger ──┐
     ↑─────────────────────────┘
  notes: |2
    [39:12–40:54 · ~1.7 мин] **Главное:**
    - ML lifecycle — это !!не отдельный процесс рядом с данными!!, а продолжение того же графа вниз и обратно вверх.

    **Рассказ:**
    - Пройти сверху вниз, называя, что происходит на каждом шаге.
    - Верхняя половина — уже знакомая dbt-часть.
    - Задержаться на нижней стрелке обратной связи: мониторинг порождает сигнал, сигнал запускает переобучение, переобучение меняет модель, модель меняет предсказания.
    - Сказать, что именно !!замкнутость!! этого круга отличает работающий MLOps от набора скриптов.
    - Предупредить, что не каждый узел здесь обязан быть ассетом Dagster — следующий слайд ровно про это.

    **Для MLE:**
    - Полезно смотреть на схему как на чек-лист зрелости: у большинства команд она обрывается на `deployment`, а мониторинг и триггер переобучения существуют в виде дежурного с дашбордом.

    **Переход:**
    - ~~«Проведём границу: что здесь ассет, а что — исполнение».~~
- kind: table
  id: 035-chto-asset-a-chto-ispolnenie
  title: Что здесь ассет, а что — исполнение
  table:
    headers: ['Естественно ассет — это артефакт', 'Естественно исполнение — это работа']
