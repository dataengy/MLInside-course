    - ['Версия в реестре моделей', 'Отправка уведомления']
    - ['Набор батч-предсказаний', 'Прогрев кэша, миграция']
    - ['Отчёт мониторинга', 'Любая операция без артефакта на выходе']
    col_ratios: [5, 5]
  notes: |2
    [40:54–42:36 · ~1.7 мин] **Главное:**
    - !!Dagster описывает жизненный цикл и зависимости артефактов; тяжёлую работу выполняют специализированные системы!!.

    **Рассказ:**
    - Дать простой критерий, по которому проходит граница: спросить себя «после этого шага !!остаётся объект!!, на который можно сослаться?».
    - Если да — это ассет: таблица, файл, отчёт, версия в реестре.
    - Если нет, а есть только факт «мы поработали» — это исполнение.
    - Пройти правую колонку и подчеркнуть: обучение на GPU !!не является!! ассетом; ассетом является !!файл модели!!, который после него остался.
    - Отправка уведомления не оставляет артефакта — значит это не ассет, а побочный эффект.

    **Осторожно:**
    - Самая частая ошибка новичка — !!сделать ассетом каждый шаг!!, включая «скачать», «распаковать», «уведомить».
    - Граф раздувается, а пользы нет: у половины узлов нечего пересчитывать.

    **Для MLE:**
    - Практическое следствие: Dagster не должен держать GPU-процесс внутри себя.
    - Он должен !!запустить внешнее исполнение и принять артефакт!!; про механику этого будет отдельный слайд.

    **Переход:**
    - ~~«Теперь соберём канонический ML-пайплайн в этих терминах».~~
- kind: content
  id: 036-zagruzka-preprocessing-obuchenie-validaciya
  title: 'Загрузка → Препроцессинг → Обучение → Валидация'
  bullets:
  - 'Четыре шага — четыре зависимых ресурса в графе'
  - Зависимости описаны сигнатурами, порядок вытекает из них
  - Каждый шаг оставляет объект, который можно пересчитать отдельно
  code_lang: python
  code: |2
    @dg.asset
    def zagruzka(feature_mart):   # из dbt
        return feature_mart

    @dg.asset
    def preprocessing(zagruzka):
        return impute_and_scale(zagruzka)

    @dg.asset
    def obuchenie(preprocessing):
        return fit(preprocessing)

    @dg.asset
    def validaciya(obuchenie, preprocessing):
        return dg.MaterializeResult(
            metadata=evaluate(
                obuchenie, preprocessing,
            ),
        )
  notes: |2
    [42:36–44:18 · ~1.7 мин] **Главное:**
    - Канонический ML-пайплайн — !!Загрузка → Препроцессинг → Обучение → Валидация!! — выражается как цепочка зависимых ресурсов один в один.

    **Рассказ:**
    - Прочитать код сверху вниз: каждый шаг принимает результат предыдущего, и этого достаточно, чтобы цепочка выстроилась.
    - Обратить внимание на первый ассет: он принимает !!витрину из dbt!!, то есть цепочка начинается не с нуля, а продолжает аналитический граф.
    - Обратить внимание на последний: валидация зависит !!сразу от двух!! ассетов — от модели и от данных.
    - Граф это выражает естественно, линейный список шагов — нет.
    - Сказать, что именно так выглядит связка, к которой мы шли всю лекцию.

    **Для MLE:**
    - Практическая ценность в том, что каждый шаг !!пересчитывается отдельно!!.
    - Поменяли способ импутации — запускаем `preprocessing+`, и загрузка не трогается.
    - Поменяли гиперпараметры — запускаем `obuchenie+`, и препроцессинг переиспользуется.

    **Осторожно:**
    - На реальном проекте имена, конечно, английские; здесь они русские, чтобы схема читалась с первого взгляда.

    **Переход:**
    - ~~«Один и тот же код должен работать на ноутбуке и в проде. Это ресурсы».~~
- kind: content
  id: 037-resources-odin-kod-raznye-kontury
  title: 'Ресурсы: один код, разные контуры'
  bullets:
  - Внешний мир приходит в ассет параметром, а не импортом
  - Хранилище, склад, реестр моделей — всё это ресурсы
  - Контур выбирается при сборке Definitions, код не меняется
  materials:
  - label: Dagster — Resources
    url: https://docs.dagster.io/guides/build/external-resources
  code_lang: python
  code: |2
    class Warehouse(dg.ConfigurableResource):
        dsn: str

        def read(self, table): ...

    @dg.asset
    def zagruzka(warehouse: Warehouse):
        return warehouse.read("mart_features")

    defs = dg.Definitions(
        assets=[zagruzka],
        resources={
            "warehouse": Warehouse(
                dsn=dg.EnvVar("DSN"),
            ),
        },
    )
  notes: |2
    [44:18–46:00 · ~1.7 мин] **Главное:**
    - Ресурс — это !!изоляция кода от инфраструктуры!!: ассет не знает, куда он ходит, он только объявляет, что ему нужно.

    **Рассказ:**
    - Разобрать код.
    - `Warehouse` — описание внешней зависимости с типизированной конфигурацией.
    - Ассет получает её !!параметром!!, а не создаёт внутри и не импортирует глобальный клиент.
    - Внизу — сборка: здесь и только здесь решается, какой именно склад подставить.
    - Сказать главное следствие: чтобы перевести пайплайн с продового склада на локальный, !!код ассета менять не надо!! — меняется только `Definitions`.

    **Для MLE:**
    - Сюда же относятся IO managers — отдельный вид ресурсов, который отвечает за то, !!где физически лежат!! возвращаемые ассетами объекты.
    - На старте работает встроенный, который пишет на диск; в проде его меняют на S3 или на склад, и снова без правки ассетов.

    **Осторожно:**
    - Не углубляться в устройство IO managers — для первого проекта хватает того, что они есть и подменяются в одном месте.

    **Переход:**
    - ~~«Когда таких пайплайнов становится много, ресурсы и ассеты начинают производить фабрикой».~~
- kind: content
  id: 038-fabriki-resursov-i-assetov
  title: Фабрики ресурсов и ассетов
  bullets:
  - Функция, которая возвращает ресурс или ассет по параметрам
  - Десять похожих моделей — один код и список конфигураций
  - Правка логики применяется ко всем сразу, а не копипастой
  code_lang: python
  code: |2
    def make_model_asset(name, target, params):

        @dg.asset(name=f"model_{name}")
        def _asset(preprocessing):
            return fit(
                preprocessing,
                target=target, **params,
            )

        return _asset

    model_assets = [
        make_model_asset(n, t, p)
        for n, t, p in MODEL_SPECS
    ]
  notes: |2
    [46:00–47:42 · ~1.7 мин] **Главное:**
    - !!Фабрика ресурсов и ассетов!! — способ описать десять похожих пайплайнов одним куском кода.

    **Рассказ:**
    - Объяснить задачу на живом примере: одна и та же модель обучается по регионам, по продуктовым линейкам или с разными таргетами.
    - Наивный путь — скопировать ассет десять раз; через месяц правку надо вносить в десять мест, и в одном её забудут.
    - Разобрать код: обычная функция, внутри неё определяется ассет, наружу он возвращается.
    - Дальше список конфигураций разворачивается в список ассетов.
    - Подчеркнуть, что в этом нет никакой магии фреймворка — это !!обычное замыкание на Python!!, и работает оно потому, что ассет является объектом, а не записью в конфиге.

    **Для MLE:**
    - Тот же приём применяется к ресурсам: фабрика, которая по имени окружения собирает нужный склад, реестр и хранилище артефактов.
    - Так !!контуры перестают расходиться!! — они собираются одним кодом из разных параметров.

    **Осторожно:**
    - Фабрика ухудшает читаемость графа, если ей злоупотребить.
    - Правило простое: !!фабрика оправдана с третьего повторения!!, не раньше.

    **Переход:**
    - ~~«Раз инфраструктура приходит параметром — пайплайн можно тестировать без неё вообще».~~
- kind: content
  id: 039-lokalnoe-testirovanie-bez-infrastruktury
  title: Локальное тестирование без развёртывания инфраструктуры
  bullets:
  - Ассет — обычная функция, её можно вызвать напрямую
  - Граф из нескольких ассетов прогоняется в памяти
  - Ресурсы подменяются заглушками, склад и кластер не нужны
  - 'Изоляция кода: использование фабрик ресурсов — локальное тестирование пайплайнов без развертывания инфраструктуры'
  code_lang: python
  code: |2
    def test_obuchenie_na_pustyh():
        assert obuchenie(pd.DataFrame(...))

    def test_cepochka_celikom():
        r = dg.materialize_to_memory(
            [zagruzka, preprocessing,
             obuchenie],
            resources={
                "warehouse": FakeWarehouse(),
            },
        )
        assert r.success
  notes: |2
    [47:42–49:24 · ~1.7 мин] **Главное:**
    - !!Локальное тестирование пайплайнов без развёртывания инфраструктуры!! — не лозунг, а прямое следствие того, что ассет является функцией.

    **Рассказ:**
    - Показать первый тест: ассет вызывается напрямую, как обычная функция, никакого раннера вокруг.
    - Показать второй: `materialize_to_memory` прогоняет !!настоящую цепочку!! ассетов, но ничего не пишет на диск и не поднимает демон.
    - Обратить внимание на подмену ресурса: вместо продового склада подставляется заглушка.
    - Это работает именно потому, что склад приходил параметром.
    - Сказать, что тест выполняется за доли секунды и спокойно живёт в CI на каждый пуш.

    **Для MLE:**
    - Сравнить с привычной болью: в оркестраторах задач для проверки DAG часто нужен !!поднятый оркестратор!!, база метаданных и планировщик.
    - Здесь весь пайплайн — это Python-объекты, и тестируются они как Python-объекты.

    **Осторожно:**
    - Это не отменяет интеграционных тестов на настоящем складе.
    - Речь о том, что !!быстрая петля обратной связи!! становится возможной, а не о том, что интеграция не нужна.

    **Переход:**
    - ~~«Теперь про то, ради чего MLE вообще смотрит на lineage: версии».~~
- kind: content
  id: 040-versionirovanie-dannyh-i-modelej
  title: Версионирование данных и версий моделей
  bullets:
  - Происхождение датасета читается из графа, а не восстанавливается
  - История материализаций отвечает «когда и из чего это получено»
  - Версия кода отличает «изменились данные» от «изменился код»
  code_lang: diagram
  code: |2
     ВОПРОС                ГДЕ ОТВЕТ
     ─────────────────     ─────────────
     из чего обучена   →   upstream
     когда собрана     →   материализации
     каким кодом       →   версия кода
     какие метрики     →   метаданные
     что сломается     →   downstream
  notes: |2
    [49:24–51:06 · ~1.7 мин] **Главное:**
    - !!Отслеживание происхождения (lineage) датасетов и версий моделей!! в Dagster — это свойство графа, а не отдельная подсистема, которую надо внедрять.

    **Рассказ:**
    - Пройти по таблице вопросов слева и показать, что у каждого есть механический ответ справа.
    - Задержаться на строке про версию кода: Dagster запоминает, каким кодом получена материализация.
    - Поэтому «модель поехала» разбирается по-другому: сначала смотрим, !!менялся ли код!!, потом — менялись ли данные наверху графа.
    - Сказать, что вопрос из последней строки — обратный: он про влияние, а не про происхождение, и отвечается тем же графом, только в другую сторону.

    **Для MLE:**
    - Это то, что обычно требуют от нас на ревью инцидента и на аудите.
    - Без графа ответ собирается по логам и памяти, с графом — !!открывается карточка ассета!!.

    **Осторожно:**
    - Dagster не хранит сами данные и сами версии моделей.
    - Он хранит !!факты и ссылки!!: где лежит, чем получено, с какими метаданными.
    - Хранилище артефактов и реестр моделей остаются на своих местах.

    **Переход:**
    - ~~«Происхождение — половина дела. Вторая половина — качество».~~
- kind: content
  id: 041-asset-checks-dlya-dannyh-i-modeli
  title: Проверки для данных и для модели
  bullets:
  - Проверка — узел рядом с ассетом, а не отдельный пайплайн
  - Для данных — привычные схемные и бизнес-проверки
  - Для модели — порог метрики как обычная проверка
  code_lang: python
  code: |2
    @dg.asset_check(asset=obuchenie)
    def roc_ne_nizhe_poroga(context):
        roc = last_metadata(context, "roc_auc")
        return dg.AssetCheckResult(
            passed=roc >= 0.75,
            severity=dg.AssetCheckSeverity
                       .ERROR,
            metadata={
                "roc_auc": roc,
                "threshold": 0.75,
            },
        )
  notes: |2
    [51:06–52:30 · ~1.4 мин] **Главное:**
    - Проверка качества модели — это !!такой же узел графа!!, как проверка `not_null` на колонке.

    **Рассказ:**
    - Разобрать код: проверка привязана к конкретному ассету, возвращает результат с уровнем важности и своими метаданными.
    - Обратить внимание на `severity`: `ERROR` останавливает движение вниз по графу, `WARN` только подсвечивает.
    - Сказать, что это даёт единый язык: аналитик описывает качество данных, MLE — качество модели, а смотрят они на !!один и тот же экран!!.

    **Для MLE:**
    - Это техническая основа паттерна «шлюз качества», который мы разберём в блоке про production-паттерны.
    - Идея простая: !!плохая модель не должна доезжать до реестра!!, и решать это должен граф, а не дежурный.

    **Переход:**
    - ~~«Осталось разрезать всё это по времени».~~
- kind: content
  id: 042-partitions-i-backfills-glazami-mle
  title: Партиции и бэкфиллы глазами MLE
  bullets:
  - Признаки считаются посуточно, обучающая выборка — это окно суток
  - Пересчёт истории — штатная операция, а не отдельный скрипт
  - 'Пересчёт фич за квартал и батч-инференс — одна и та же механика'
  code_lang: diagram
  code: |2
     ПАРТИЦИИ              БЭКФИЛЛ
     ─────────────────     ─────────────
     features  d1 d2 d3    выбрать
     dataset   [d1..d30]   диапазон
     model     обучена       ↓
               на d1..d30  пересчёт фич
                             ↓
                           переобучить
                           / доинферить
  notes: |2
    [52:30–54:12 · ~1.7 мин] **Главное:**
    - Партиции и бэкфиллы — !!самая недооценённая часть Dagster для MLE!!, и вот почему.

    **Рассказ:**
    - Показать левую половину: признаки нарезаны по суткам, обучающая выборка — окно из этих суток, модель обучена на конкретном окне.
    - Из этого сразу следует ответ на вопрос «на каких данных обучена вот эта версия»: он !!читается из партиций!!, а не восстанавливается по памяти.
    - Показать правую: бэкфилл — это выбор диапазона и запуск.
    - Ни отдельного скрипта, ни ручного цикла по датам.
    - Перечислить три типовых случая, когда MLE это нужно: нашли ошибку в логике признака и пересчитываем историю; добавили новый признак и достраиваем его назад; получили батч-предсказания за прошлый период.

    **Для MLE:**
    - Отдельно проговорить экономику: без партиций пересчёт истории обычно означает !!полный пересчёт всего!!, потому что резать не по чему.
    - С партициями пересчитывается ровно затронутый диапазон.

    **Осторожно:**
    - Бэкфилл на большом диапазоне — это реальная нагрузка на склад и кластер.
    - Запускать его стоит с ограничением параллелизма, а не «все девяносто дней сразу».

    **Переход:**
    - ~~«Обучение бывает тяжёлым. Его надо уметь вынести наружу».~~
- kind: content
  id: 043-dagster-pipes-tyazheloe-ispolnenie-snaruzhi
  title: 'Dagster Pipes: тяжёлое исполнение снаружи'
  bullets:
  - Dagster запускает внешний процесс и принимает от него события
  - Обучение идёт в поде, в кластере или в отдельном контейнере
  - Обратно приходят логи, метаданные и факт материализации
  materials:
  - label: Dagster Pipes — Kubernetes
    url: https://docs.dagster.io/guides/build/external-pipelines/kubernetes-pipeline
  code_lang: python
  code: |2
    from dagster_k8s import PipesK8sClient

    @dg.asset
    def obuchenie_na_gpu(context, k8s):
        return k8s.run(
            context=context,
            image="registry/trainer:2026",
            base_pod_spec={
                "nodeSelector": {
                    "gpu": "a100",
                },
            },
        ).get_materialize_result()
  notes: |2
    [54:12–55:54 · ~1.7 мин] **Главное:**
    - Pipes — !!официальный механизм!! отдать тяжёлую работу наружу, не теряя наблюдаемости.

    **Рассказ:**
    - Объяснить проблему: обучение на GPU не должно жить внутри процесса Dagster — там другие требования к образу, к железу и к времени жизни.
    - Разобрать код: `PipesK8sClient` запускает под с вашим образом, а Dagster в это время !!слушает его!!.
    - Ключевая деталь: внешний процесс не просто пишет в stdout.
    - Через тонкую библиотеку он !!отправляет обратно!! логи, метаданные и факт материализации — и они попадают на карточку ассета так, будто считались локально.
    - Сказать, что так же выносятся Spark-джобы и любые контейнерные нагрузки.

    **Когда применять:**
    - Обучение требует GPU, много памяти или собственного образа.
    - Вычисление уже живёт в кластере, и переносить его в Dagster незачем.

    **Когда не надо:**
    - Обучение укладывается в минуты на обычной машине — под ради него это лишняя задержка и лишняя точка отказа.

    **Граница ответственности:**
    - Dagster владеет !!графом и артефактом!!; кластер владеет !!исполнением!!.

    **Граница отказа:**
    - Упавший под = не материализованный ассет; ретраи и алерты остаются на стороне Dagster, а диагностика пода — на стороне кластера.

    **Переход:**
    - ~~«Подведём черту под этой частью».~~
- kind: content
  id: 044-granica-lifecycle-protiv-ispolneniya
  title: 'Итог части: lifecycle против исполнения'
  bullets:
  - Dagster описывает зависимости артефактов и их жизненный цикл
  - Тяжёлую работу делают специализированные системы
  - Граница проходит по вопросу «остался ли объект после шага»
  code_lang: diagram
  code: |2
     DAGSTER            ВСЁ ОСТАЛЬНОЕ
     ───────────────    ───────────────
     что существует     как посчитать
     из чего получено   где выполнить
     когда пересчитать  на чём обучить
     что проверить      где хранить

     control plane      data / compute
  notes: |2
    [55:54–57:00 · ~1.1 мин] **Главное:**
    - Одна фраза на всю часть: !!Dagster — control plane, а не вычислитель!!.

    **Рассказ:**
    - Собрать сказанное: мы описали lifecycle от загрузки до мониторинга, провели границу между артефактом и работой, показали ресурсы, фабрики, тестирование, версии, проверки, партиции и вынос исполнения наружу.
    - Всё это складывается в один принцип, который написан на схеме.
    - Сказать, что этот же принцип объяснит следующий блок: почему Dagster !!не заменяет MLflow!!, хотя метрики хранить умеет.

    **Переход:**
    - ~~«Как раз про MLflow — самый частый вопрос на этом месте».~~
