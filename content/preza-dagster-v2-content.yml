- kind: section
  id: 003-problema-pajplajn-zhivet-v-treh-mestah
  title: 'Проблема: пайплайн живёт в трёх местах'
  notes: |2
    [01:36–01:54 · ~0.3 мин] **Рассказ:**
    - Короткая завязка на две минуты: почему у MLE вообще возникает вопрос оркестрации.
- kind: content
  id: 004-odin-den-mle-i-chto-lomaetsya
  title: 'Один день MLE: три системы, ноль общего графа'
  bullets:
  - 'dbt-проект: витрины и признаки, запускается в CI'
  - 'Ноутбук или скрипт: сборка обучающей выборки'
  - 'cron или Airflow-DAG: обучение и батч-инференс'
  - 'Вопрос «поменялась колонка — что пересчитать?» ответа не имеет'
  code_lang: diagram
  code: |2
     dbt CI          ноутбук           cron
     ──────          ───────           ────
     staging   ?     features    ?     train
     marts           dataset           predict

     ? — связь есть только в голове дежурного
  notes: |2
    [01:54–03:18 · ~1.4 мин] **Главное:**
    - Проблема не в том, что нет планировщика, а в том, что !!никто не знает зависимостей между артефактами!!.

    **Рассказ:**
    - Описать знакомую картину: dbt гоняется в CI по пушу, признаки собирает скрипт, обучение висит в cron.
    - Каждая система по отдельности работает.
    - Ломается на стыке: аналитик поменял одну колонку в staging-модели — и никто не может сказать, надо ли переобучать модель.
    - Второй симптом — «перезапустим всё»: ночью считается полный пересчёт, потому что дешевле, чем разбираться.
    - Третий — инцидент: витрина не обновилась, а обучение всё равно стартовало и обучилось на вчерашних данных.

    **Для MLE:**
    - Все три симптома — про одно и то же: !!граф зависимостей существует, но нигде не записан!!.
    - Планировщик, который умеет только «запусти в 3:00», эту задачу не решает — он не знает, что чем питается.

    **Переход:**
    - ~~«Dagster устроен так, чтобы этот граф был записан явно. Формула — на следующем слайде».~~
- kind: content
  id: 005-dagster-v-odnoj-formule
  title: Dagster в одной формуле
  bullets:
  - 'Orchestration — что и когда пересчитать'
  - 'Asset graph — что существует и из чего получается'
  - 'Observability — что материализовано, когда, каким кодом'
  - Всё три — про одни и те же объекты, а не про три системы
  code_lang: diagram
  code: |2
     DAGSTER = orchestration
             + asset graph
             + observability

       ↑ для data- и ML-пайплайнов
  notes: |2
    [03:18–04:24 · ~1.1 мин] **Главное:**
    - Dagster — это !!orchestration + asset graph + observability!! для data/ML-пайплайнов, и все три части описывают одни и те же объекты.

    **Рассказ:**
    - Произнести формулу вслух и разобрать по частям.
    - **Orchestration** — привычная часть: запустить нужное, в нужном порядке, с ретраями.
    - **Asset graph** — то, чего нет у планировщика задач: явно записанные !!зависимости между артефактами!!, а не между шагами.
    - **Observability** — история: что материализовано, когда, сколько строк, какой метрикой, каким кодом.
    - Подчеркнуть, что третье бесплатно вытекает из второго: раз объекты названы, историю есть на что вешать.

    **Осторожно:**
    - Не превращать в маркетинг.
    - Слово, которое стоит запомнить, ровно одно — !!ассет!!; остальное приложится.

    **Переход:**
    - ~~«Дальше вся лекция крутится вокруг одной схемы. Вот она».~~
- kind: content
  id: 006-skvoznaya-shema-kursa
  title: Сквозная схема этой лекции
  bullets:
  - Одна архитектура, к которой мы возвращаемся весь оставшийся час
  - Сверху — территория dbt, снизу — территория ML
  - Границы между ними в графе нет
  materials:
  - label: Dagster — Quickstart
    url: https://docs.dagster.io/getting-started/quickstart
  code_lang: diagram
  code: |2
     ┌── D A T A ──────────────────┐
     │  raw                        │
     │   ↓                         │
     │  dbt staging                │
     │   ↓                         │
     │  dbt feature mart           │
     └──────────┬──────────────────┘
                ↓
     ┌── M L ───┴──────────────────┐
     │  training dataset           │
     │   ↓                         │
     │  train → evaluate → model   │
     │   ↓                         │
     │  predictions                │
     └─────────────────────────────┘
         DAGSTER ASSET GRAPH
  notes: |2
    [04:24–05:48 · ~1.4 мин] **Главное:**
    - Это !!одна и та же схема!! на всю лекцию; дальше мы будем только дорисовывать на ней детали.

    **Рассказ:**
    - Провести пальцем сверху вниз: сырые данные, staging в dbt, витрина признаков, обучающая выборка, обучение, оценка, модель, предсказания.
    - Обратить внимание на нижнюю подпись: !!весь этот столбец — один asset graph!!.
    - Сказать, что именно здесь проходит граница, из-за которой лекция вообще существует: обычно dbt-часть живёт в одном инструменте, ML-часть — в другом, и стрелка между `dbt feature mart` и `training dataset` не описана нигде.
    - Пообещать, что к концу лекции на эту схему лягут checks, partitions, MLflow, расписания и внешнее исполнение.

    **Для MLE:**
    - Практический смысл верхней половины: !!признаки — это тоже данные!!, и их удобнее считать в dbt, а не в отдельном скрипте.
    - Практический смысл нижней: !!модель — это тоже артефакт!!, у неё есть зависимости и версия.

    **Переход:**
    - ~~«Прежде чем запускать — одна честная оговорка: что Dagster делает, а что не делает».~~
- kind: content
  id: 007-chto-dagster-delaet-i-chego-net
  title: Что Dagster делает — и чего не делает
  bullets:
  - Знает зависимости и пересчитывает только нужное
  - Хранит метаданные, историю материализаций и lineage
  - Управляет партициями и бэкфиллами, реагирует на события
  - Не считает сам — вычисления остаются в dbt, Spark, sklearn
  code_lang: diagram
  code: |2
     ДЕЛАЕТ                 НЕ ЗАМЕНЯЕТ
     ──────────────────     ──────────────────
     зависимости            dbt
     запуск нужного         Spark
     материализации         MLflow
     metadata / lineage     Kubernetes
     partitions/backfills   feature store
     реакцию на события

     связывает их lifecycle, а не подменяет
  notes: |2
    [05:48–07:12 · ~1.4 мин] **Главное:**
    - !!Dagster не заменяет dbt, Spark, MLflow, Kubernetes и feature store — он связывает их lifecycle!!.

    **Рассказ:**
    - Пройти левый столбец: знает зависимости, запускает нужное, отслеживает материализации, хранит метаданные и происхождение, режет данные на партиции и умеет пересчитывать историю, реагирует на события.
    - Пройти правый и произнести главную оговорку лекции: SQL по-прежнему выполняет !!ваш склад через dbt!!, тяжёлое обучение — !!ваш кластер!!, эксперименты — !!MLflow!!.
    - Сказать, зачем этот слайд стоит так рано: он снимает половину вопросов «а зачем тогда dbt» и «а мы уже используем MLflow».

    **Осторожно:**
    - Не давать здесь ни строчки кода — слайд про !!границу ответственности!!, а не про API.

    **Для MLE:**
    - Если из лекции вы заберёте одну мысль — заберите эту: Dagster — это !!control plane!!, а не вычислитель.

    **Переход:**
    - ~~«Теперь про то единственное понятие, вокруг которого всё это построено».~~
- kind: section
  id: 008-asset-mentalnaya-model
  title: 'Ассет: ментальная модель'
  notes: |2
    [07:12–07:30 · ~0.3 мин] **Рассказ:**
    - Два слайда на понятие, без которого дальше ничего не сойдётся.
- kind: content
  id: 009-software-defined-assets
  title: Software-Defined Assets — программно-определяемые ассеты
  bullets:
  - 'Ассет — объект, который должен существовать: таблица, файл, модель'
  - Код описывает не «что запустить», а «что должно существовать и из чего»
  - 'Материализация — акт приведения ассета к описанию'
  - Зависимости выводятся из сигнатуры функции, а не рисуются руками
  materials:
  - label: Dagster — Assets
    url: https://docs.dagster.io/guides/build/assets
  code_lang: python
  code: |2
    import dagster as dg

    @dg.asset
    def training_dataset(
        feature_mart,          # ← зависимость
    ):
        """То, что должно существовать."""
        return feature_mart.dropna()
  notes: |2
    [07:30–09:12 · ~1.7 мин] **Главное:**
    - !!Software-Defined Asset — это описание в коде объекта, который должен существовать, и способа его получить!!.

    **Рассказ:**
    - Прочитать код вслух: функция называется `training_dataset` — это !!имя ассета!!, а не имя шага.
    - Аргумент `feature_mart` — это !!другой ассет!!; из одного этого факта Dagster строит ребро графа.
    - Ничего рисовать не надо.
    - Тело функции — способ получить объект.
    - Сформулировать сдвиг мышления в одной фразе: в оркестраторе задач вы пишете !!что сделать!!, в Dagster — !!что должно существовать!!.
    - Отсюда сразу вытекает `data-driven`-подход: система рассуждает про данные, а не про шаги.

    **Для MLE:**
    - Ассетом может быть не только таблица.
    - Файл модели, отчёт об оценке, версия в реестре, набор батч-предсказаний — всё это объекты, которые должны существовать, значит всё это ассеты.
    - Именно поэтому !!ML-часть графа выглядит так же, как dbt-часть!!.

    **Осторожно:**
    - Не углубляться в `AssetKey`, группы и `deps=` — это приложение и документация.

    **Переход:**
    - ~~«Сравним лоб в лоб с тем, к чему мы привыкли в оркестраторах задач».~~
- kind: table
  id: 010-asset-protiv-task
  title: Ассет против задачи
  table:
    headers: ['Вопрос', 'Task-centric (Airflow)', 'Asset-centric (Dagster)']
    rows:
    - ['Что описывает код', 'Шаг, который надо выполнить', 'Объект, который должен существовать']
    - ['Единица графа', 'Задача', 'Ассет: таблица, датасет, модель']
    - ['Откуда зависимости', 'Заданы руками через оператор >>', 'Выведены из аргументов функции']
    - ['«Что пересчитать?»', 'Отвечает дежурный', 'Отвечает граф']
    - ['История запусков', 'Успех или падение задачи', 'Материализации ассета с метаданными']
    - ['Свежесть данных', 'Внешний мониторинг', 'Asset checks и freshness прямо в графе']
    - ['Частичный пересчёт', 'Отдельный DAG или ручной запуск', 'Селекция по графу: features+']
    - ['dbt-модель в графе', 'Одна задача dbt build', 'Каждая модель — отдельный ассет']
    col_ratios: [3, 4, 4]
  notes: |2
    [09:12–10:54 · ~1.7 мин] **Главное:**
    - Разница не в синтаксисе, а в том, !!на какой вопрос система умеет отвечать!!.

    **Рассказ:**
    - Идти по строкам, не зачитывая всё подряд; задержаться на трёх.
    - Строка про зависимости: в Airflow граф вы рисуете руками и он может !!разойтись с реальностью!! — код читает одну таблицу, а стрелка нарисована от другой.
    - В Dagster ребро выводится из сигнатуры, разойтись нечему.
    - Строка «что пересчитать»: это тот самый вопрос со слайда про проблему.
    - В левой колонке на него отвечает человек, в правой — граф.
    - Строка про dbt: в Airflow типичный DAG видит !!один прямоугольник `dbt build`!!, в Dagster — сотню моделей по отдельности.
    - Это и есть разница между «запустили dbt» и «знаем, что из чего получилось».

    **Осторожно:**
    - Не превращать таблицу в обвинение Airflow — у него есть свои сильные стороны, и отдельный блок про это будет.
    - Правая колонка — это !!другая задача!!, а не более новая версия той же.

    **Переход:**
    - ~~«Хватит теории. Поднимаем Dagster и смотрим на всё это в браузере».~~
# ── PART 2 · Quick Start ─────────────────────────────────────────────────────────────────
- kind: section
  id: 011-quick-start
  title: 'Quick Start: от нуля до графа за 10 минут'
  notes: |2
    [10:54–11:12 · ~0.3 мин] **Рассказ:**
    - Дальше семь шагов, каждый — одна команда или один экран.
    - Всё воспроизводимо дома по этим же слайдам.
- kind: content
  id: 012-shag-0-podnyat-dagster
  title: 'Шаг 0: поднять Dagster'
  bullets:
  - Одна команда создаёт проект, вторая поднимает интерфейс
  - Ставится в собственное виртуальное окружение проекта
  - Ничего разворачивать не нужно — ни базы, ни кластера
  materials:
  - label: Dagster — Quickstart
    url: https://docs.dagster.io/getting-started/quickstart
  code_lang: bash
  code: |2
    uvx create-dagster@latest \
        project ml-platform
    cd ml-platform
    source .venv/bin/activate

    dg dev        # → localhost:3000
  notes: |2
    [11:12–12:18 · ~1.1 мин] **Главное:**
    - Между «ничего нет» и работающим интерфейсом — !!две команды и меньше минуты!!.

    **Рассказ:**
    - Прочитать команды.
    - `uvx` ставит и запускает генератор проекта одним вызовом — глобально ничего не устанавливается.
    - `dg` — это !!современный CLI Dagster!!; проектные команды идут через него.
    - `dg dev` поднимает локально всё сразу: веб-интерфейс, демон расписаний и локальное хранилище состояния.
    - Сказать вслух то, ради чего слайд стоит именно здесь: !!на этом шаге нет ни Docker, ни Kubernetes, ни базы!!.

    **Осторожно:**
    - Если у слушателя нет `uv` — есть `pip`-вариант: `create-dagster project`, затем `pip install --editable . --group dev`.
    - Не тратить на это время на записи, просто упомянуть.

    **Переход:**
    - ~~«Проект пустой. Пишем первый ассет».~~
- kind: content
  id: 013-shag-1-pervyj-asset
  title: 'Шаг 1: первый ассет'
  bullets:
  - Один файл в defs/, один декоратор
  - Функция возвращает объект — Dagster считает его материализованным
  - Появляется в интерфейсе сразу, перезапуск не нужен
  code_lang: python
  code: |2
    # src/ml_platform/defs/assets.py
    import dagster as dg
    import pandas as pd

    @dg.asset
    def raw_orders() -> pd.DataFrame:
        return pd.read_csv("data/orders.csv")
  notes: |2
    [12:18–13:24 · ~1.1 мин] **Главное:**
    - Ассет — это !!обычная Python-функция с декоратором!!, никакого фреймворка вокруг неё нет.

    **Рассказ:**
    - Показать путь файла: всё, что лежит в `defs/`, подхватывается автоматически — регистрировать вручную ничего не надо.
    - Имя функции стало !!именем ассета!!.
    - Возвращаемое значение Dagster сохранит сам и запишет факт материализации.
    - Обратить внимание на то, чего в коде НЕТ: нет DAG-объекта, нет `default_args`, нет `schedule_interval`.
    - Пока это просто описание объекта.

    **Для MLE:**
    - Эту функцию можно вызвать из `pytest` напрямую, как обычную функцию, — к этому вернёмся в блоке про тестирование.

    **Переход:**
    - ~~«Один ассет — не граф. Добавим зависимость».~~
- kind: content
  id: 014-shag-2-zavisimost-assetov
  title: 'Шаг 2: зависимость между ассетами'
  bullets:
  - 'Аргумент функции — это имя ассета, от которого мы зависим'
  - Граф собирается сам, стрелки нигде не объявляются
  - 'Получилась цепочка: raw_orders → features → model'
  code_lang: python
  code: |2
    @dg.asset
    def features(raw_orders):
        return build_features(raw_orders)

    @dg.asset
    def model(features):
        return train(features)

    # raw_orders → features → model
  notes: |2
    [13:24–14:30 · ~1.1 мин] **Главное:**
    - !!Граф — это следствие сигнатур!!, а не отдельная структура, которую надо поддерживать.

    **Рассказ:**
    - Показать пальцем: `features` принимает `raw_orders`, `model` принимает `features`.
    - Всё, цепочка построена.
    - Сказать, почему это важнее, чем кажется: граф !!не может разойтись с кодом!!, потому что он и есть код.
    - В оркестраторе задач стрелки живут отдельно от тела задачи и рассинхронизируются на первом же рефакторинге.

    **Осторожно:**
    - Не уходить в `deps=[...]` и `AssetIn` — они нужны, когда данные передаются не через возвращаемое значение; это приложение.

    **Переход:**
    - ~~«Открываем браузер и материализуем».~~
- kind: content
  id: 015-shag-3-materialize
  title: 'Шаг 3: материализация'
  bullets:
  - 'В интерфейсе: выделить ассеты и нажать Materialize'
  - 'Из CLI: та же операция одной командой'
  - Dagster сам выстроит порядок по графу
  code_lang: bash
  code: |2
    # весь граф
    dg launch --assets '*'

    # только модель и всё, от чего она зависит
    dg launch --assets 'model'
  notes: |2
    [14:30–15:36 · ~1.1 мин] **Главное:**
    - Материализация — это !!запуск нужной части графа!!, а не «запуск DAG».

    **Рассказ:**
    - Показать оба пути: кнопка в интерфейсе для разработки и `dg launch` для скриптов и CI.
    - Обратить внимание: мы !!нигде не указывали порядок!!.
    - Просим `model` — Dagster сам поймёт, что сначала нужны `raw_orders` и `features`.
    - Сказать, что на этом шаге у слушателя дома уже есть работающий пайплайн из трёх шагов.

    **Пример:**
    - На демонстрации стоит запустить дважды: второй раз показать, что материализации накапливаются в истории.

    **Переход:**
    - ~~«Но запустить мало — надо, чтобы после запуска что-то осталось. Метаданные».~~
- kind: content
  id: 016-shag-4-metadannye-materializacii
  title: 'Шаг 4: метаданные материализации'
  bullets:
  - К каждой материализации прикрепляются произвольные метаданные
  - Число строк, метрика модели, превью, ссылка — что угодно
  - Метаданные видны в истории и строят графики по времени
  materials:
  - label: Dagster — Asset metadata
    url: https://docs.dagster.io/guides/build/assets/metadata-and-tags
  code_lang: python
  code: |2
    @dg.asset
    def model(features):
        clf, roc = train(features)
        return dg.MaterializeResult(
            metadata={
                "roc_auc": roc,
                "rows": len(features),
                "model_uri": save(clf),
            }
        )
  notes: |2
    [15:36–17:00 · ~1.4 мин] **Главное:**
    - Метаданные превращают историю запусков в !!историю данных и моделей!!.

    **Рассказ:**
    - Разобрать код: возвращаем не объект, а `MaterializeResult` с произвольным словарём.
    - Показать, что туда кладут на практике: количество строк, ключевую метрику, ссылку на артефакт, превью таблицы.
    - Сказать, что интерфейс !!строит по числовым метаданным график по времени!! — то есть `roc_auc` каждого переобучения становится наблюдаемым бесплатно.

    **Для MLE:**
    - Это первая точка, где Dagster начинает выглядеть как ML-инструмент, а не как планировщик.
    - Метрика лежит !!рядом с данными, из которых она получена!!, а не в отдельной системе.
    - Оговориться сразу: это !!не замена MLflow!! — про разделение ответственности будет отдельный блок.

    **Переход:**
    - ~~«Метаданные накопились. Теперь то, ради чего всё затевалось, — происхождение».~~
- kind: content
  id: 017-shag-5-pereschitat-tolko-nuzhnoe
  title: 'Шаг 5: пересчитать только нужное'
  bullets:
  - Селекция по графу вместо перезапуска всего пайплайна
  - '+ справа — всё, что ниже по течению; + слева — всё, что выше'
  - Тот самый ответ на вопрос «что пересчитать»
  code_lang: bash
  code: |2
    # features и всё ниже: model
    dg launch --assets 'features+'

    # model и всё выше по графу
    dg launch --assets '+model'

    # только features
    dg launch --assets 'features'
  notes: |2
    [17:00–18:06 · ~1.1 мин] **Главное:**
    - Селекция по графу — это !!ответ на вопрос со слайда про проблему!!, и стоит он одну строку.

    **Рассказ:**
    - Разобрать синтаксис: плюс справа — «и всё, что от этого зависит», плюс слева — «и всё, от чего это зависит».
    - Проговорить рабочий сценарий: поменялась логика признаков — запускаем `features+`, и модель пересчитается, а сырые данные нет.
    - Сказать, что тот же синтаксис знаком тем, кто пишет `dbt run -s model+`.
    - Это не совпадение — идея одна.

    **Для MLE:**
    - Практический выигрыш измеряется деньгами и временем: !!ночной полный пересчёт!! заменяется пересчётом затронутого куска.

    **Переход:**
    - ~~«Всё это накапливает историю. Смотрим, что видно в интерфейсе».~~
- kind: content
  id: 018-shag-6-lineage-v-ui
  title: 'Шаг 6: происхождение и версии в интерфейсе'
  bullets:
  - 'Граф ассетов: что из чего получено — это и есть lineage'
  - 'История материализаций: когда, чем, с какими метаданными'
  - Версионирование данных и версий моделей — свойство графа, а не отдельный инструмент
  code_lang: diagram
  code: |2
     ЧТО ВИДНО ПО КАЖДОМУ АССЕТУ
     ───────────────────────────
     upstream / downstream   ← происхождение
     последняя материализация
     метаданные и их динамика
     версия кода
     статус проверок
  notes: |2
    [18:06–19:30 · ~1.4 мин] **Главное:**
    - !!Отслеживание происхождения (lineage) датасетов и версий моделей!! — это не отдельный продукт, а то, что получается само, когда объекты названы.

    **Рассказ:**
    - На демонстрации открыть карточку ассета `model` и показать по пунктам: слева зависимости, справа потребители, ниже история материализаций с метаданными.
    - Сказать, что именно это отвечает на вопросы аудита: !!на каких данных обучена вот эта версия модели!! и !!какие витрины пострадают, если сломается вот этот источник!!.
    - Отметить версию кода: Dagster запоминает, каким кодом получена материализация, поэтому «модель изменилась, потому что изменился код» отличимо от «изменились данные».

    **Для MLE:**
    - Это тот самый пункт, ради которого lineage вообще нужен MLE: !!связь версии модели с версией обучающей выборки!! перестаёт быть устной договорённостью.

    **Переход:**
    - ~~«Осталось соединить это с реальным dbt-проектом — и получится боевой пайплайн».~~
- kind: content
  id: 019-shag-7-pervyj-boevoj-pajplajn
  title: 'Шаг 7: первый боевой пайплайн'
  bullets:
  - Подключаем существующий dbt-проект одной командой
  - dbt-модели становятся ассетами и встают в один граф с ML
  - Дальше в лекции — этот же граф, но подробно
  materials:
  - label: Dagster & dbt (Component)
    url: https://docs.dagster.io/integrations/libraries/dbt
  code_lang: bash
  code: |2
    dg scaffold defs \
       dagster_dbt.DbtProjectComponent \
       --project-path ../analytics_dbt

    dg dev   # dbt-модели уже в графе
             # рядом с features и model
  notes: |2
    [19:30–20:54 · ~1.4 мин] **Главное:**
    - Подключение !!существующего!! dbt-проекта — это одна команда, а не переписывание проекта.

    **Рассказ:**
    - Показать команду: указываем путь к обычному dbt-проекту, который у команды уже есть.
    - После этого в графе появляются !!все модели проекта по отдельности!!, а не один прямоугольник.
    - Соединить с предыдущими шагами: `features` теперь может принимать не CSV, а витрину из dbt — и стрелка между аналитикой и ML появится в графе сама.
    - Сказать, что подробности этой команды (что такое компонент, манифест, чем это отличается от Python-варианта) — весь следующий блок.

    **Осторожно:**
    - Не начинать здесь разбор `defs.yaml` — это слайд про !!результат!!, а не про устройство.

    **Переход:**
    - ~~«Подведём итог Quick Start — и честно скажем, что мы намеренно не трогали».~~
- kind: content
  id: 020-chek-list-povtorit-doma
  title: 'Итог Quick Start: что вы уже умеете'
  bullets:
  - 'Поднять Dagster, написать ассет, связать ассеты, материализовать'
  - 'Прикрепить метаданные, пересчитать часть графа, увидеть lineage'
  - 'Подключить существующий dbt-проект'
  - 'Отложено сознательно: ресурсы, IO managers, code locations, деплой'
  code_lang: diagram
  code: |2
     ОТЛОЖЕНО — И ГДЕ ВЕРНЁМСЯ
     ─────────────────────────────────
     resources / фабрики   → ML lifecycle
     IO managers           → ML lifecycle
     partitions/backfills  → dbt и ML
     code locations        → эксплуатация
     деплой, Instance      → приложение
  notes: |2
    [20:54–22:00 · ~1.1 мин] **Главное:**
    - Всё перечисленное сверху !!воспроизводится дома за 10–15 минут!! по этим же слайдам.

    **Рассказ:**
    - Пройти чек-лист сверху и предложить слушателю поставить галочки.
    - Отдельно проговорить нижний блок: ресурсы, IO managers, code locations и деплой мы !!не забыли, а отложили!!.
    - Объяснить почему: они не нужны, чтобы получить первый работающий граф, и на старте только мешают.
    - Показать правую схему: у каждого отложенного пункта есть адрес, где мы к нему вернёмся.

    **Осторожно:**
    - Не оставлять ощущение, что Quick Start — это игрушка.
    - Пайплайн из шага 7 !!уже боевой!! по структуре; ему не хватает только продакшен-обвязки.

    **Переход:**
    - ~~«Начинаем с dbt — для большинства из вас это точка входа».~~
# ── PART 3 · Dagster + dbt ───────────────────────────────────────────────────────────────
- kind: section
  id: 021-dagster-i-dbt
  title: Dagster + dbt
  notes: |2
    [22:00–22:18 · ~0.3 мин] **Рассказ:**
    - Центральный блок лекции: для большинства команд Dagster заходит именно отсюда.
- kind: content
  id: 022-dbt-dag-chast-bolshego-grafa
  title: 'Главный тезис: dbt-граф становится частью большего графа'
  bullets:
  - dbt уже строит DAG — но он заканчивается на витринах
  - Dagster не оборачивает dbt, а продолжает его граф
  - 'Витрина и обученная модель оказываются в одном lineage'
  code_lang: diagram
  code: |2
     БЫЛО              СТАЛО
     ──────────        ──────────────────
     [ dbt DAG ]       stg → int → mart
         ↓                     ↓
     отдельный         training dataset
     workflow                  ↓
     для ML                  model

     dbt DAG — ЧАСТЬ asset graph,
     а не соседний workflow
  notes: |2
    [22:18–23:42 · ~1.4 мин] **Главное:**
    - !!dbt-граф становится частью более широкого asset graph, а не остаётся отдельным workflow!!.

    **Рассказ:**
    - Показать левую половину: типовая схема, где dbt — чёрный ящик, за которым начинается «что-то другое».
    - Показать правую: тот же dbt, но его модели стоят в графе поодиночке, и от последней витрины стрелка идёт дальше — в обучающую выборку и в модель.
    - Произнести ключевое различие: !!Dagster не запускает dbt, он продолжает его граф!!.
    - Практическое следствие — вопрос «что сломается, если поменять эту колонку» получает ответ, который !!включает модель!!, а не обрывается на витрине.

    **Для MLE:**
    - Это ровно та стрелка, которой не хватало на слайде про проблему.
    - После неё аналитик видит, что его правка задевает ML, а MLE видит, из каких моделей выросли его признаки.

    **Переход:**
    - ~~«Разложим этот граф подробно — от источника до модели».~~
- kind: content
  id: 023-ot-ingestion-do-modeli
  title: От источника до модели — один граф
  bullets:
  - dbt-источник — точка, где граф начинается
  - staging и intermediate — территория аналитики
  - Витрина признаков — стык, дальше начинается ML
  code_lang: diagram
  code: |2
     ingestion
        ↓
     dbt source          ← внешний ассет
        ↓
     staging
        ↓
     intermediate
        ↓
     feature mart        ← СТЫК
        ↓
     training dataset
        ↓
     model
  notes: |2
    [23:42–25:06 · ~1.4 мин] **Главное:**
    - Это та же сквозная схема лекции, только с явно названными слоями dbt.

    **Рассказ:**
    - Пройти сверху вниз, называя владельцев: загрузка — инженер данных, `staging` и `intermediate` — аналитический инженер, `feature mart` — общая зона, ниже — MLE.
    - Задержаться на подписи «СТЫК»: именно здесь чаще всего проходит организационная граница, и именно её обычно не видно ни в одном инструменте.
    - Сказать, что все следующие слайды блока — про то, как каждый уровень этой схемы появляется в Dagster.

    **Для MLE:**
    - Практический совет: !!считать признаки в dbt, а не в скрипте!!, пока они выражаются SQL.
    - Тогда они получают тесты, документацию, версионирование и попадают в этот граф бесплатно.

    **Осторожно:**
    - Не утверждать, что все признаки надо считать в dbt.
    - Эмбеддинги, оконные агрегаты на Python, всё, что требует библиотек, — остаётся ассетами на Python, и это нормально.

    **Переход:**
    - ~~«Интеграция бывает разной глубины. Пять уровней — от заглушки до продакшена».~~
- kind: table
  id: 024-pyat-urovnej-integracii
  title: Пять уровней интеграции dbt и Dagster
  table:
    headers: ['Уровень', 'Что делаем', 'Что получаем', 'Чего не хватает']
    rows:
    - ['0', 'Один ассет запускает dbt build', 'Расписание и ретраи', 'Граф — чёрный ящик, частичного пересчёта нет']
    - ['1', 'manifest.json → @dbt_assets', 'Каждая модель — отдельный ассет', 'ML-часть всё ещё отдельно']
    - ['2', 'Источники и ML-ассеты вокруг dbt', 'Один сквозной граф от raw до модели', 'Нет разрезания по времени']
    - ['3', 'Партиции, asset checks, автоматизация', 'Инкрементальность и качество в графе', 'Один проект, одна команда']
    - ['4', 'Несколько dbt-проектов и code locations', 'Платформа из независимых доменов', 'Нужна дисциплина владения']
    col_ratios: [1, 4, 4, 4]
  notes: |2
    [25:06–26:48 · ~1.7 мин] **Главное:**
    - Интеграцию не надо делать «сразу правильно» — она !!наращивается уровнями!!, и каждый уровень уже приносит пользу.

    **Рассказ:**
    - Пройти по строкам как по дорожной карте.
    - Уровень 0 — то, с чего начинают почти все: ассет, который вызывает `dbt build`.
    - Работает, но граф — один прямоугольник.
    - Сказать прямо, почему это !!тупик!!: нельзя пересчитать одну ветку, нельзя увидеть, какая модель сломалась, нельзя связать витрину с моделью.
    - Уровень 1 — разворачиваем манифест, и сотня моделей появляется в графе поодиночке.
    - Это самый большой скачок за наименьшие деньги.
    - Уровень 2 — вокруг dbt появляются ассеты источников сверху и ML-ассеты снизу; получается сквозной граф.
    - Уровни 3 и 4 — уже про эксплуатацию: время и масштаб.

    **Для MLE:**
    - Если ваша команда сегодня на нуле — целиться надо в !!уровень 2!!: именно он даёт связь витрины с моделью, ради которой всё затевается.

    **Переход:**
    - ~~«Разберём, что делает переход с нулевого уровня на первый. Это манифест».~~
- kind: content
  id: 025-manifest-json-serdce-integracii
  title: 'manifest.json: откуда Dagster знает про модели'
  bullets:
  - dbt при компиляции выкладывает описание проекта в manifest.json
  - Из него Dagster получает модели, зависимости, тесты, описания
  - 'В разработке манифест пересобирается сам, в CI — заранее'
  materials:
  - label: dagster-dbt — reference
    url: https://docs.dagster.io/integrations/libraries/dbt/reference
  code_lang: python
  code: |2
    from dagster_dbt import DbtProject

    dbt_project = DbtProject(
        project_dir="../analytics_dbt",
    )

    # dev: пересобрать манифест на лету
    dbt_project.prepare_if_dev()

    # CI/prod: dagster-dbt project
    #          prepare-and-package
  notes: |2
    [26:48–28:12 · ~1.4 мин] **Главное:**
    - `manifest.json` — !!единственный источник знаний Dagster о вашем dbt-проекте!!.

    **Рассказ:**
    - Объяснить, что это такое: dbt при компиляции описывает сам себя в JSON — список моделей, их зависимости, тесты, описания, теги, метаданные из `schema.yml`.
    - Dagster читает этот файл и разворачивает из него граф ассетов.
    - Ничего дублировать в Python не нужно.
    - Разобрать две строчки кода: `prepare_if_dev()` пересобирает манифест при каждом старте `dg dev`, чтобы правки в SQL были видны сразу.
    - В проде так делать нельзя — компиляция долгая, поэтому манифест собирается !!в CI!! командой `dagster-dbt project prepare-and-package` и уезжает в образ.

    **Осторожно:**
    - Это самая частая ошибка эксплуатации: манифест собран на сборке, а модели с тех пор поменялись.
    - Правило простое — !!манифест собирается тем же пайплайном, что и образ!!.

    **Переход:**
    - ~~«Теперь два способа это подключить. Сначала короткий».~~
- kind: content
  id: 026-minimalnaya-integraciya-component
  title: 'Минимальная интеграция: компонент'
  bullets:
  - Компонент описывается в defs.yaml, без Python вообще
  - Одна команда создаёт заготовку из существующего проекта
  - select и exclude — обычный синтаксис выборки dbt
  materials:
  - label: Dagster & dbt with components
    url: https://docs.dagster.io/guides/build/components/integrations/dbt-component-tutorial
  code_lang: yaml
  code: |2
    # dg scaffold defs \
    #    dagster_dbt.DbtProjectComponent \
    #    --project-path ../analytics_dbt
    #
    # defs/analytics_dbt/defs.yaml

    type: dagster_dbt.DbtProjectComponent

    attributes:
      project: ../analytics_dbt
      select: "fqn:marts.* fqn:staging.*"
  notes: |2
    [28:12–29:54 · ~1.7 мин] **Главное:**
    - Самый короткий путь от «есть dbt-проект» до «он в графе» — !!один YAML-файл!!.

    **Рассказ:**
    - Показать команду в комментарии: она создаёт этот файл сама, руками его писать не нужно.
    - Разобрать содержимое: `type` — какой компонент, `attributes` — его параметры.
    - `project` — путь к обычному dbt-проекту.
    - `select` — !!тот же синтаксис выборки, что в `dbt run -s`!!; им можно взять в граф не весь проект, а нужные слои.
    - Сказать, что компоненты — это то, что Dagster объявил стабильным в линии 1.12, и сегодня это !!рекомендуемая точка входа!!.

    **Для MLE:**
    - Практическая ценность в том, что этот файл может завести аналитик, не трогая Python.
    - Граница между «аналитика» и «платформа» проходит по конфигу, а не по коду.

    **Осторожно:**
    - Компонент кэширует манифест — при смене структуры проекта его надо пересобрать.
    - Это ровно тот же разговор, что на предыдущем слайде.

    **Переход:**
    - ~~«Когда YAML перестаёт хватать, есть Python-вариант. Он же — то, что под капотом».~~
- kind: content
  id: 027-to-zhe-na-python-dbt-assets
  title: 'То же на Python: @dbt_assets'
  bullets:
  - Декоратор разворачивает манифест в набор ассетов
  - DbtCliResource выполняет команду и стримит события обратно
  - 'dbt build вместо run + test: модели и тесты одним проходом'
  code_lang: python
  code: |2
    from dagster_dbt import (
        dbt_assets, DbtCliResource,
    )

    @dbt_assets(
        manifest=dbt_project.manifest_path,
    )
    def analytics_dbt(context, dbt):
        yield from dbt.cli(
            ["build"], context=context,
        ).stream()
  notes: |2
    [29:54–31:18 · ~1.4 мин] **Главное:**
    - Четыре строки Python делают то же, что компонент, но дают !!полный контроль!!.

    **Рассказ:**
    - Разобрать построчно.
    - `@dbt_assets` разворачивает манифест в набор ассетов — по одному на модель.
    - `DbtCliResource` — ресурс, который умеет вызывать dbt CLI; он же отвечает за то, где живёт профиль и как передаются переменные.
    - `.stream()` — важная деталь: события dbt приходят !!по мере выполнения!!, поэтому в интерфейсе модели зеленеют по одной, а не все разом в конце.
    - Отдельно про `build`: он выполняет модель и её тесты вместе, поэтому упавший тест останавливает ветку !!до того!!, как на плохих данных построится витрина.

    **Осторожно:**
    - Не показывать `run` + `test` как рабочий вариант.
    - Разделение на два прохода — это как раз то, из-за чего плохие данные успевают уехать вниз по графу.

    **Переход:**
    - ~~«Имена, группы и владельцы ассетов настраиваются отдельной точкой расширения».~~
- kind: content
  id: 028-dagster-dbt-translator
  title: 'DagsterDbtTranslator: как модель становится ассетом'
  bullets:
  - Одна точка расширения решает, как назвать и разметить ассет
  - Ключ ассета, группа, описание, владельцы, теги, метаданные
  - 'Здесь же задаётся условие автоматизации для dbt-моделей'
  code_lang: python
  code: |2
    class Translator(DagsterDbtTranslator):

        def get_group_name(self, props):
            return props["fqn"][1]   # папка

        def get_automation_condition(
            self, props,
        ):
            return dg.AutomationCondition\
                     .eager()
  notes: |2
    [31:18–32:42 · ~1.4 мин] **Главное:**
    - Транслятор — !!единственное место!!, где решается, как dbt-сущность выглядит в Dagster.

    **Рассказ:**
    - Объяснить задачу: у dbt свои имена и своя структура папок, у Dagster — свои ключи ассетов и группы.
    - Транслятор их сшивает.
    - Показать первый метод: раскладываем модели по группам по имени папки, и граф в интерфейсе сразу перестаёт быть кашей.
    - Показать второй: здесь же можно !!сразу выдать всем dbt-моделям условие автоматизации!!, и они начнут пересчитываться при обновлении источников — про это будет отдельный блок.
    - Перечислить остальное коротко: описание, владельцы, теги, произвольные метаданные.

    **Для MLE:**
    - Самый практичный метод для нас — тот, что задаёт !!ключ ассета!!.
    - Именно совпадением ключей сшиваются графы разных проектов; к этому вернёмся на слайде про multi-dbt.

    **Переход:**
    - ~~«Разберёмся, где граф начинается: это dbt-источники».~~
- kind: content
  id: 029-dbt-sources-i-vneshnie-assety
  title: 'dbt-источники: где начинается граф'
  bullets:
  - Источник dbt становится внешним ассетом в графе
  - Совпадение ключей сшивает загрузку и трансформации
  - Так стрелка от dlt или Airbyte доходит до модели
  code_lang: yaml
  code: |2
    # models/staging/_sources.yml
    sources:
      - name: olist_raw
        tables:
          - name: orders
            meta:
              dagster:
                asset_key:
                  ["raw", "olist", "orders"]
  notes: |2
    [32:42–34:06 · ~1.4 мин] **Главное:**
    - Источник dbt — !!точка стыковки!! между тем, кто данные привёз, и тем, кто их преобразует.

    **Рассказ:**
    - Объяснить механику: dbt-источник сам ничего не считает, он лишь объявляет «эта таблица существует».
    - Dagster превращает его во внешний ассет — узел без кода, у которого могут быть материализации.
    - Разобрать `meta.dagster.asset_key`: мы явно называем ключ.
    - Если ассет с таким же ключом создаёт пайплайн загрузки, !!два графа сшиваются в один!!.
    - Сказать, зачем это нужно: без этого шага граф начинается с `staging`, и вопрос «данные вообще приехали?» остаётся снаружи.

    **Пример:**
    - Типовая связка: `dlt` или Airbyte кладут таблицу и материализуют ассет `raw/olist/orders`, dbt-источник объявляет тот же ключ, дальше идут `staging`, витрина и модель.
    - Одна непрерывная цепочка от коннектора до предсказаний.

    **Переход:**
    - ~~«Теперь качество: у dbt уже есть тесты, и они не пропадают».~~
- kind: content
  id: 030-dbt-testy-stanovyatsya-asset-checks
  title: dbt-тесты становятся asset checks
  bullets:
  - Тесты из dbt-проекта грузятся как проверки ассетов автоматически
  - Проверка видна на карточке модели рядом с материализацией
  - Упавшая проверка останавливает ветку графа, а не весь запуск
  code_lang: diagram
  code: |2
     dbt test          asset check
     ──────────        ─────────────────
     not_null      →   проверка ассета
     unique        →   статус у данных
     relationships →   стоп downstream

     dbt build = модель + её тесты
                 одним проходом
  notes: |2
    [34:06–35:30 · ~1.4 мин] **Главное:**
    - Тесты, которые у вас уже написаны, !!становятся проверками графа!! без единой строчки кода.

    **Рассказ:**
    - Сказать факт: `dagster-dbt` грузит dbt-тесты как asset checks !!по умолчанию!! начиная с версии 0.23; отключается это флагом, а не включается.
    - Показать, что меняется: раньше упавший тест был красной строкой в логе, теперь это !!статус на карточке конкретной модели!!.
    - Объяснить, почему это важнее косметики: проверка привязана к ассету, значит система знает, что вниз по графу пускать нельзя.

    **Для MLE:**
    - Дотянуть мысль до модели: если `not_null` на колонке признака упал, то !!переобучение не должно стартовать!!.
    - В графе это выражается само; в связке «cron + скрипт» это надо было писать руками и обычно не писали.

    **Переход:**
    - ~~«Следующий уровень — время. Партиции поверх инкрементальных моделей».~~
- kind: content
  id: 031-partitions-poverh-inkrementalnyh-modelej
  title: Партиции поверх инкрементальных моделей
  bullets:
  - Ассет режется по измерению — чаще всего по дате
  - Окно партиции передаётся в dbt переменными
  - 'Пересчитать один день — обычная операция, а не спецоперация'
  code_lang: python
  code: |2
    daily = dg.DailyPartitionsDefinition(
        "2024-01-01",
    )

    @dbt_assets(
        manifest=dbt_project.manifest_path,
        partitions_def=daily,
    )
    def daily_dbt(context, dbt):
        w = context.partition_time_window
        v = f'{{"start":"{w.start}"}}'
        yield from dbt.cli(
            ["build", "--vars", v],
            context=context,
        ).stream()
  notes: |2
    [35:30–37:12 · ~1.7 мин] **Главное:**
    - Партиция превращает «пересчитать за вчера» из ручной операции в !!выбор ячейки в интерфейсе!!.

    **Рассказ:**
    - Разобрать код: объявляем суточную нарезку, из контекста достаём окно и отдаём его в dbt переменными.
    - В самой модели это обычный инкрементальный `where` по этим переменным — dbt-часть остаётся привычной.
    - Показать, что появляется в интерфейсе: у ассета возникает !!сетка партиций!!, где видно, какие дни посчитаны, какие нет и какие посчитаны устаревшим кодом.

    **Для MLE:**
    - Для нас это ключевой инструмент, и вот почему.
    - Признаки почти всегда считаются !!на суточной сетке!!, а обучающая выборка — это окно из таких суток.
    - Когда обе стороны разрезаны одинаково, вопрос «на каких днях обучена модель» становится проверяемым, а не устным.

    **Осторожно:**
    - Партиции стоит вводить тогда, когда данные действительно инкрементальны.
    - На маленьком проекте они добавят сложности, ничего не ускорив.

    **Переход:**
    - ~~«Последний уровень — когда dbt-проект не один».~~
- kind: content
  id: 032-multi-dbt-i-dbt-mesh
  title: 'Несколько dbt-проектов: mesh против оркестрации'
  bullets:
  - 'Каждый проект — своя code location, свой деплой, своя команда'
  - Графы сшиваются совпадением ключей ассетов через источники
  - dbt Mesh решает задачу внутри dbt, Dagster — поверх любых систем
  code_lang: diagram
  code: |2
     code location A    code location B
     ───────────────    ───────────────
     dbt: core          dbt: marketing
     stg → int → mart ─→ source → mart
                                ↓
                        code location C
                        features → model

     ключ ассета — общий язык
     между проектами
  notes: |2
    [37:12–38:54 · ~1.7 мин] **Главное:**
    - На масштабе граф собирается !!из независимо деплоящихся кусков!!, а склеивает их общий ключ ассета.

    **Рассказ:**
    - Объяснить, что такое code location одной фразой: независимо загружаемый и независимо деплоящийся набор определений.
    - Свой репозиторий, свои зависимости, свой релизный цикл.
    - Показать на схеме: проект `core` отдаёт витрину, проект `marketing` объявляет её своим источником с тем же ключом — стрелка появляется, хотя проекты не знают друг о друге.
    - Сравнить с dbt Mesh: он решает ту же задачу !!внутри dbt!! через зависимости проектов и контракты моделей.
    - Сформулировать границу: dbt Mesh отвечает за !!совместимость SQL-контрактов!!, Dagster — за !!исполнение и наблюдаемость!! поверх всего, включая не-dbt узлы.
    - Это не конкуренты; на большой платформе обычно работают вместе.

    **Осторожно:**
    - Не начинать с этой конфигурации.
    - Несколько code locations оправданы, когда есть !!несколько команд с разными релизными циклами!!; иначе это лишняя операционная нагрузка.

    **Переход:**
    - ~~«dbt-часть графа собрана. Спускаемся ниже — туда, где начинается ML».~~
