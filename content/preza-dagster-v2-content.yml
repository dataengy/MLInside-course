    - ['Data и ML lifecycle вместе', 'Возможно, вручную', 'Заметно лучше, чем в 2.x', 'Естественный основной сценарий']
    - ['Экосистема и найм', 'Очень большая', 'Очень большая и растущая', 'Меньше']
    col_ratios: [3, 4, 4, 4]
  notes: |2
    [73:18–74:48 · ~1.5 мин] **Главное:**
    - !!Основные различия сместились в сторону повседневной работы: во что превращается dbt, как проверяется качество и как тестируется код.!!

    **Рассказ:**
    - Строка про dbt — самая практичная, и ей посвящён отдельный следующий слайд, поэтому здесь только назвать.
    - Строка про тесты: в Dagster проверка — !!сущность, привязанная к ассету!!, со своим статусом; в Airflow это по-прежнему шаг, чей смысл известен вам, а не системе.
    - Строка про локальную разработку: Task SDK в Airflow 3 заметно улучшил изоляцию задач, но проверить !!цепочку!! на ноутбуке в Dagster всё ещё проще.
    - Строка про универсальные процессы — важна для честности: если вам нужно оркестрировать выгрузки, интеграции и бизнес-операции, Airflow силён в этом и остаётся силён.
    - Последняя строка — про рынок труда, и её нельзя пропускать: это реальный фактор выбора, а не мелочь.

    **Для MLE:**
    - Если ваша работа — data и ML в одном контуре, предпоследняя строка перевешивает почти всё остальное.
    - Если вы обслуживаете сотню разнородных корпоративных процессов — не перевешивает.

    **Что важно не перепутать:**
    - «Меньше экосистема» — **не то же самое, что «мало интеграций»**.
    - Интеграций у Dagster много; речь про размер рынка труда и количество готовых ответов в интернете.

    **Takeaway:**
    - !!Выбор определяется вашим типом нагрузки, а не строчкой «кто современнее».!!

    **Переход:**
    - ~~«Самая обсуждаемая строка — dbt. Разберём её без карикатур».~~

    **Визуальные опоры:**

    1. https://astronomer.github.io/astronomer-cosmos/
       Что взять: строку про dbt со стороны Airflow.

    2. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: ту же строку со стороны Dagster.

    3. https://openlineage.io/docs/
       Что взять: строку про происхождение — общий стандарт, которым пользуются оба.

    **Схема:**
    - Таблица достаточна.
    - Если нужен акцент — подсветить строку «во что превращается модель dbt», потому что именно её разбирает следующий слайд.
    - Не добавлять итоговую строку с оценкой.
- kind: content
  id: 052-sosuschestvovanie-i-airlift
  title: 'Сосуществование и миграция: dagster-airlift'
  bullets:
  - Рабочий Airflow не мигрируют из-за концептуальной красоты
  - Типовая схема — новое в Dagster, старое остаётся на месте
  - 'Airlift даёт постепенный путь: наблюдать, потом переносить'
  - Миграция идёт задача за задачей, без общего дня X
  materials:
  - label: Dagster — Airlift
    url: https://docs.dagster.io/integrations/libraries/airlift
  code_lang: diagram
  code: |2
     СУЩЕСТВУЮЩАЯ ПЛАТФОРМА
     ──────────────────────────
     Airflow
      ├ legacy DAG
      ├ интеграции и выгрузки
      ├ generic-процессы
      └ операционный парк
           │
           ↓ событие / airlift
     НОВЫЙ ДОМЕН DATA + ML
     ──────────────────────────
     Dagster
      ├ ингест-ассеты
      ├ dbt
      ├ витрины признаков
      └ модели и lifecycle
  notes: |2
    [74:48–76:06 · ~1.3 мин] **Главное:**
    - !!Не мигрировать работающий Airflow только потому, что Dagster концептуально красивее.!!

    **Рассказ:**
    - Начать с честного утверждения: у большинства компаний Airflow работает и приносит пользу; замена ради модели данных экономически не оправдана.
    - Типовая схема сосуществования: Airflow остаётся владельцем интеграций, выгрузок, legacy-DAG и общекорпоративных процессов; Dagster берёт !!новый домен!! — данные, dbt и ML.
    - Связь между ними — событие и статус, а не общий доступ к одним и тем же узлам.
    - Про Airlift: это официальный набор инструментов для постепенного перехода.
    - Порядок шагов у него понятный: сначала !!увидеть!! Airflow-инстанс внутри Dagster, потом !!разметить!! DAG в ассеты, потом !!перенести!! исполнение задача за задачей, потом снять со старой стороны.
    - Подчеркнуть главное свойство: миграция идёт !!по кусочкам!!, без общего дня X и без остановки платформы.

    **Когда применять:**
    - Когда data/ML-домен растёт и уже болит от отсутствия графа артефактов, а остальная платформа — нет.
    - Когда нужно доказать пользу на одном домене, прежде чем принимать решение по всей компании.

    **Когда не надо:**
    - Когда единственный аргумент — «Dagster современнее».
    - Когда в компании нет людей, готовых поддерживать вторую платформу.

    **Граница ответственности:**
    - У каждого артефакта ровно один владелец-оркестратор.
    - Airflow не должен пересчитывать то, чем владеет Dagster, и наоборот.

    **Граница отказа:**
    - Отказ Airflow не должен приводить к неопределённому состоянию ассетов Dagster: связь идёт через события, и потерянное событие должно быть повторяемым.

    **Что важно не перепутать:**
    - Airlift — **инструмент интеграции и постепенного переноса**, а не автоматический конвертер DAG в ассеты.
    - Разметку смысла делает человек.

    **Takeaway:**
    - !!Сосуществование — нормальное целевое состояние, а не переходный этап.!!

    **Переход:**
    - ~~«Сведём блок в один сбалансированный вывод».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/migration/airflow-to-dagster
       Что взять: карту способов перехода и их предпосылки.

    2. https://docs.dagster.io/migration/airflow-to-dagster/airlift-v1
       Что взять: четыре шага Airlift — наблюдать, разметить, перенести, снять.

    3. https://pypi.org/project/dagster-airlift/
       Что взять: текущий статус и версию библиотеки — фактура быстро устаревает.

    **Схема:**
    - Два прямоугольника-этажа, соединённые одной стрелкой вниз, подписанной «событие».
    - В каждом прямоугольнике — список того, чем он владеет.
    - Не рисовать двусторонних стрелок между содержимым: слайд про раздельное владение.
- kind: content
  id: 053-sbalansirovannyj-vyvod
  title: Сбалансированный вывод
  bullets:
  - Airflow — зрелый универсальный оркестратор рабочих процессов
  - Airflow 3 заметно продвинулся в сторону данных и ассетов
  - Dagster строит всю платформу вокруг графа ассетов
  - Выбор определяется типом нагрузки и стоимостью перехода
  code_lang: diagram
  code: |2
     ЧТО СПРОСИТЬ У СЕБЯ
     ──────────────────────────────
     Что у меня за нагрузка?
       разнородные процессы → Airflow
       data + ML lifecycle  → Dagster

     Что уже стоит?
       большой Airflow → не трогать,
       новый домен → рядом

     Какая версия Airflow?
       2.x → разрыв заметный
       3.x → разрыв меньше, считать
             по конкретным нуждам
  notes: |2
    [76:06–77:18 · ~1.2 мин] **Главное:**
    - !!Правильный вопрос не «кто лучше», а «какая у меня нагрузка, что уже стоит и какая версия».!!

    **Рассказ:**
    - Пройти три вопроса схемы по очереди — это готовый алгоритм для разговора с руководителем.
    - Первый вопрос про нагрузку: разнородные корпоративные процессы — сильная сторона Airflow; связанный жизненный цикл данных и моделей — сильная сторона Dagster.
    - Второй про существующий парк: большой работающий Airflow — это актив, а не долг.
    - Третий про версию: если у вас Airflow 2 — разрыв заметный; если Airflow 3 — считать надо по конкретным потребностям, а не по общим словам.
    - Отдельно назвать стоимость перехода: для Airflow 3 переход с 2.x — эволюция внутри одной платформы, переход на Dagster — !!смена платформы!!, и это разные по цене решения.

    **Для MLE:**
    - Если решение не ваше, а вы просто хотите нормальный граф для своего домена — берите вариант «рядом», а не «вместо».

    **Что важно не перепутать:**
    - «Dagster не всегда лучше» — **не дипломатическая формулировка, а факт**.
    - Есть нагрузки, где он проигрывает; честный слайд про это будет в конце лекции.

    **Takeaway:**
    - !!Три вопроса — нагрузка, существующий парк, версия — закрывают выбор лучше любой таблицы.!!

    **Переход:**
    - ~~«Prefect, Kestra, Argo и Kedro разобраны в приложении, A17. А мы собираем всё в архитектуры».~~

    **Визуальные опоры:**

    1. https://airflow.apache.org/docs/apache-airflow/stable/installation/upgrading_to_airflow3.html
       Что взять: цену перехода 2.x → 3.x — она нужна для третьего вопроса.

    2. https://docs.dagster.io/migration/airflow-to-dagster
       Что взять: цену перехода на другую платформу.

    3. https://airflow.apache.org/docs/apache-airflow/stable/release_notes.html
       Что взять: актуальную версию и свежие изменения — обязательно сверить перед выступлением.

    **Схема:**
    - Три вопроса-блока сверху вниз, у каждого две-три ветки ответа.
    - Ветки не подкрашивать в «правильные» и «неправильные».
    - Внизу — одна строка про стоимость перехода как отдельный фактор.
