- kind: content
  id: 901-ops-graphs-i-jobs
  title: 'Ops, graphs и jobs: когда ассета мало'
  bullets:
  - 'Op — единица вычисления, graph — композиция операций'
  - 'Job — то, что реально запускается по расписанию или сенсору'
  - define_asset_job — джоба поверх выборки ассетов
  - Операции нужны, когда на выходе нет артефакта
  - Большинство задач аналитики решается ассетами
  code_lang: python
  code: |2
    @dg.op
    def fetch_api() -> list[dict]: ...

    @dg.op
    def push_to_crm(rows) -> None: ...

    @dg.graph
    def sync_crm():
        push_to_crm(fetch_api())

    sync_crm_job = sync_crm.to_job(
        name="sync_crm",
    )

    # джоба поверх ассетов
    daily_marts_job = dg.define_asset_job(
        name="daily_marts",
        selection=dg.AssetSelection
                    .groups("marts"),
    )
  notes: |2
    **Главное:**
    - Операции — это то, что осталось от «до-ассетной» модели Dagster, и они по-прежнему нужны там, где артефакта нет.

    **Когда применять:**
    - Выгрузка в CRM, отправка уведомления, вызов внешнего API — на выходе нет объекта, который стоило бы пересчитывать.

    **Когда не надо:**
    - Если после шага остаётся таблица или файл — это ассет.
    - Оформлять его операцией значит терять происхождение и частичный пересчёт.

    **Осторожно:**
    - Джоба поверх выборки ассетов (`define_asset_job`) — это НЕ то же самое, что граф операций.
    - Первое — «материализовать вот эти ассеты», второе — «выполнить вот эти шаги».
- kind: content
  id: 902-instance-daemon-webserver
  title: 'Из чего состоит развёрнутый Dagster'
  bullets:
  - 'Веб-сервер — интерфейс и GraphQL API'
  - 'Демон — расписания, сенсоры, очередь запусков, бэкфиллы'
  - 'Инстанс — общее состояние: запуски, события, расписания'
  - dagster.yaml настраивает хранилища и лимиты
  - 'В проде хранилище — Postgres, в разработке — SQLite'
  code_lang: diagram
  code: |2
     ┌──────────┐ ┌──────────┐ ┌─────────┐
     │Webserver │ │ Daemon   │ │  Code   │
     │UI,GraphQL│ │расписания│ │locations│
     │          │ │сенсоры,  │ │ваш код  │
     │          │ │очередь,BF│ │ (gRPC)  │
     └────┬─────┘ └────┬─────┘ └────┬────┘
          └────────────┴────────────┘
                       │
            ┌──────────────────┐
            │ Dagster Instance │ dagster
            │ run storage      │  .yaml
            │ event log        │ Postgres
            │ schedule storage │  в проде
            └──────────────────┘
  notes: |2
    **Главное:**
    - `dg dev` держит все три роли в одном процессе; в проде они разъезжаются по отдельным сервисам.

    **Рассказ:**
    - Демон обязателен: без него не работают ни расписания, ни сенсоры, ни очередь запусков, ни бэкфиллы.
    - Веб-сервер можно перезапускать без потери состояния — состояние живёт в инстансе.
    - Кодовые локации общаются с ядром по gRPC и поэтому могут иметь собственные зависимости.

    **Осторожно:**
    - При обновлении версии Dagster нужна миграция схем инстанса — команда есть в шпаргалке по CLI.
- kind: content
  id: 903-deploj-v-prodakshen
  title: Деплой в продакшен
  bullets:
  - Веб-сервер и демон — отдельные сервисы, демон обязателен
  - Кодовые локации — свои образы и свой релизный цикл
  - Postgres хранит запуски, события и расписания
  - 'В Kubernetes — официальный Helm-чарт, запуск на под'
  - Обновление локации не требует остановки интерфейса
  materials:
  - label: 'Dagster: деплой'
    url: https://docs.dagster.io/guides/deploy
  code_lang: yaml
  code: |2
    services:
      dagster-webserver:      # интерфейс
        image: my-dagster:1.13
        command: dagster-webserver
                 -h 0.0.0.0 -p 3000
                 -w workspace.yaml

      dagster-daemon:         # расписания,
        image: my-dagster:1.13  # сенсоры,
        command: dagster-daemon run

      dagster-code-dbt:       # кодовая
        image: my-dbt-code:2026.09
        command: dagster api grpc
                 -h 0.0.0.0 -p 4000
                 -m dbt_project.definitions

      postgres:               # состояние
        image: postgres:16
  notes: |2
    **Главное:**
    - Минимальный прод — это четыре сервиса; в Kubernetes то же самое разворачивает официальный Helm-чарт.

    **Когда применять:**
    - Compose годится для небольшой установки и стенда.
    - Kubernetes — когда нужен запуск на под и изоляция нагрузок.

    **Осторожно:**
    - Манифест dbt должен собираться тем же пайплайном, что и образ кодовой локации, иначе граф разойдётся с проектом.
