    - Сказать, что подстрочник каждого слайда содержит ссылки на официальную документацию по теме.

    **Переход:**
    - ~~«Вопросы?».~~

    — Сгенерировано: model=claude-opus-5 · harness=Claude Code · effort=high · version=v2.2.0 · 2026-09-01
# ── ПРИЛОЖЕНИЕ · справочно, в запись не идёт ─────────────────────────────────────────────
# Слайды ниже стоят ПОСЛЕ closing и намеренно БЕЗ метки [~N мин]: notes_format.scope: main
# заканчивает хронометраж на слайде 064, поэтому часы им не проставляются.
- kind: section
  id: 900-prilozhenie
  title: 'ПРИЛОЖЕНИЕ · справочник'
  notes: |2
    **Рассказ:**
    - Дальше — справочник по всему, что не поместилось в лекцию: A1–A18.
    - На записи этот блок не проходим; он для самостоятельного чтения и для ответов на вопросы после лекции.
    - A1–A13 — справочник по сущностям: операции и джобы, расписания и сенсоры, ресурсы и IO managers, партиции, бэкфиллы, кодовые локации, устройство инстанса, dev против prod, открытая версия против облачной, CLI, MCP, загрузка данных, мульти-оркестраторные паттерны.
    - A14–A16 — !!screenshot fallback для трёх живых демо!!: если интерфейс не поднялся, лекция идёт по этим слайдам без потери смысла.
    - A17 — соседние оркестраторы, A18 — детали сравнения с Airflow и ещё две референс-архитектуры.
- kind: content
  id: 901-a1-ops-graphs-jobs
  title: 'A1. Ops, graphs и jobs: когда ассета мало'
  bullets:
  - 'Op — единица вычисления, graph — композиция операций'
  - 'Job — то, что реально запускается по расписанию или сенсору'
  - define_asset_job — джоба поверх выборки ассетов
  - Операции нужны, когда на выходе нет артефакта
  - Большинство задач аналитики и ML решается ассетами
  materials:
  - label: Dagster — Ops
    url: https://docs.dagster.io/guides/build/ops
  code_lang: python
  code: |2
    @dg.op
    def fetch_api() -> list[dict]: ...

    @dg.op
    def push_to_crm(rows) -> None: ...

    @dg.graph
    def sync_crm():
        push_to_crm(fetch_api())

    sync_crm_job = sync_crm.to_job(
        name="sync_crm",
    )

    # джоба поверх ассетов
    daily_marts_job = dg.define_asset_job(
        name="daily_marts",
        selection=dg.AssetSelection
                    .groups("marts"),
    )
  notes: |2
    **Главное:**
    - !!Операция — это работа без артефакта на выходе; если артефакт есть, пишите ассет.!!

    **Рассказ:**
    - `op` — императивная единица вычисления, `graph` — их композиция, `job` — то, что запускается.
    - Пример на слайде — синхронизация с внешней CRM: после неё в вашем контуре не остаётся объекта, о котором осмысленно спросить «он свежий?».
    - Нижняя часть — противоположный случай: `define_asset_job` создаёт джобу поверх выборки ассетов, и это самый частый способ дать расписанию конкретную цель.

    **Что важно не перепутать:**
    - Ассеты тоже исполняются джобами — просто джоба создаётся автоматически.
    - Явная джоба нужна, когда цель запуска надо назвать и переиспользовать.

    **Когда применять:**
    - Уведомления, синхронизации, прогревы кэша, миграции — всё, после чего не остаётся артефакта.

    **Когда не надо:**
    - Не заворачивать в операции то, что производит таблицу или модель: вы потеряете граф и историю.
- kind: content
  id: 902-a1-asset-ili-op
  title: 'A1. Ассет или операция: дерево решений'
  bullets:
  - Первый вопрос — остаётся ли после шага объект
  - Второй — надо ли спрашивать про его свежесть
  - Третий — надо ли пересчитывать его отдельно
  - Три «да» — это ассет, три «нет» — это операция
  code_lang: diagram
  code: |2
     После шага остаётся объект?
          │нет → OP
          │да
          ↓
     Спрашиваем «он свежий?»
          │нет → OP
          │да
          ↓
     Пересчитываем отдельно?
          │нет → часть другого ассета
          │да
          ↓
         ASSET

     сомневаешься → ASSET
  notes: |2
    **Главное:**
    - !!Три вопроса закрывают выбор между ассетом и операцией в девяноста процентах случаев.!!

    **Рассказ:**
    - Первый вопрос отсекает уведомления и прогревы.
    - Второй отсекает промежуточные значения, которые нигде не хранятся.
    - Третий — про гранулярность: если объект никогда не пересчитывают отдельно, он часть соседнего ассета, а не самостоятельный узел.
    - Правило по умолчанию: при сомнении выбирайте ассет — он даёт больше, а стоит примерно столько же.

    **Что важно не перепутать:**
    - Слишком мелкая нарезка вредна не меньше слишком крупной.
    - Граф из двухсот узлов, из которых сто девяносто никогда не запускаются отдельно, читать невозможно.
- kind: table
  id: 903-a2-raspisaniya-protiv-sensorov
  title: 'A2. Расписания против сенсоров'
  table:
    headers: ['Признак', 'Schedule', 'Sensor']
    rows:
    - ['Что запускает', 'Наступление времени', 'Внешнее состояние или событие']
    - ['Как работает', 'cron-выражение', 'Периодический опрос с курсором']
    - ['Типовой случай', 'Ночной регламент витрин', 'Появился файл в landing-зоне']
    - ['Предсказуемость', 'Полная', 'Зависит от внешней системы']
    - ['Риск', 'Данные ещё не приехали', 'Пропуск или дубль без курсора']
    - ['Чем заменяется', 'AutomationCondition.on_cron', 'AutomationCondition.eager']
    - ['Нужен демон', 'Да', 'Да']
    col_ratios: [3, 4, 4]
  notes: |2
    **Главное:**
    - !!Расписание отвечает на «когда», сенсор — на «в ответ на что»; оба требуют работающего демона.!!

    **Рассказ:**
    - Строка про риск — самая практичная: у расписания риск обучиться на несвежих данных, у сенсора — пропустить событие или обработать его дважды.
    - Курсор в сенсоре ровно для этого и существует.
    - Строка «чем заменяется» — про современный путь: условия автоматизации покрывают большую часть случаев обоих механизмов и делают это декларативно.

    **Что важно не перепутать:**
    - Сенсор — **не подписка на событие**, а периодический опрос.
    - Ожидать реакции быстрее интервала опроса не стоит.

    **Когда не надо:**
    - Не заводить сенсор там, где событие целиком внутри графа: там достаточно условия автоматизации.
- kind: content
  id: 904-a3-resursy
  title: 'A3. Ресурсы и внедрение зависимостей'
  bullets:
  - Ресурс — объект доступа к внешней системе, приходящий параметром
  - ConfigurableResource описывает его поля и валидирует их
  - EnvVar откладывает чтение секрета до момента использования
  - Разные контуры — разные экземпляры при одинаковом коде
  materials:
  - label: Dagster — Resources
    url: https://docs.dagster.io/guides/build/external-resources
  code_lang: python
  code: |2
    class ModelRegistry(dg.ConfigurableResource):
        uri: str
        token: str

        def register(self, path, name): ...

    defs_dev = dg.Definitions(
        assets=all_assets,
        resources={
            "registry": ModelRegistry(
                uri="http://localhost:5000",
                token="dev",
            ),
        },
    )

    defs_prod = dg.Definitions(
        assets=all_assets,
        resources={
            "registry": ModelRegistry(
                uri=dg.EnvVar("MLFLOW_URI"),
                token=dg.EnvVar("MLFLOW_TOKEN"),
            ),
        },
    )
  notes: |2
    **Главное:**
    - !!Ресурсы — единственное место, где код знает про адреса и секреты внешних систем.!!

    **Рассказ:**
    - Поля ресурса типизированы и валидируются при загрузке определений: опечатка в конфигурации ловится на старте, а не в три часа ночи.
    - `EnvVar` не читает переменную сразу: значение подставляется в момент использования и не попадает ни в снимок определений, ни в логи.
    - Два блока `Definitions` внизу — это и есть весь механизм переносимости между контурами.

    **Что важно не перепутать:**
    - Ресурс — не синглтон: экземпляры создаются на запуск, и это то, что делает их подменяемыми в тестах.

    **Осторожно:**
    - Не класть в ресурс бизнес-логику: как только внутрь заезжает трансформация, тестируемость теряется.
- kind: content
  id: 905-a3-io-managers
  title: 'A3. IO managers: где физически лежат данные'
  bullets:
  - IO manager решает, куда записать и откуда прочитать значение ассета
  - Меняется отдельно от кода ассета — тот про хранение не знает
  - Локально файлы, в проде S3 или таблицы склада
  - Для dbt и внешних систем IO manager не нужен вовсе
  materials:
  - label: Dagster — IO managers
    url: https://docs.dagster.io/guides/build/io-managers
  code_lang: python
  code: |2
    # ассет ничего не знает о хранении
    @dg.asset
    def features(raw):
        return transform(raw)

    # где лежит — решает Definitions
    defs = dg.Definitions(
        assets=[features],
        resources={
            "io_manager":
                S3PickleIOManager(
                    s3_bucket="ml-artifacts",
                ),
        },
    )
  notes: |2
    **Главное:**
    - !!IO manager отделяет вычисление от хранения: ассет возвращает объект, а куда он ляжет — решает конфигурация.!!

    **Рассказ:**
    - По умолчанию значения складываются в файлы рядом с проектом — этого достаточно для разработки.
    - В проде подставляется хранилище: объектное, файловое или таблицы склада.
    - Для dbt-моделей IO manager не участвует вообще: данные пишет dbt в склад, Dagster фиксирует только факт и метаданные.
    - То же для Pipes: артефакт создаёт внешний процесс.

    **Что важно не перепутать:**
    - IO manager — **не про большие данные**.
    - Если ассет возвращает датафрейм на десять гигабайт, проблема не в менеджере, а в том, что вы гоняете данные через процесс оркестратора.

    **Когда не надо:**
    - Не писать собственный IO manager, пока не исчерпаны штатные: это одна из самых частых преждевременных сложностей.
- kind: content
  id: 906-a4-particii
  title: 'A4. Партиции: виды и выбор'
  bullets:
  - Daily и Hourly — время, самый частый случай
  - 'Static — фиксированный список: регионы, категории, страны'
  - Dynamic — список меняется во время работы
  - Multi — пересечение двух измерений, растёт как произведение
  materials:
  - label: Dagster — Partitions
    url: https://docs.dagster.io/guides/build/partitions-and-backfills/partitioning-assets
  code_lang: python
  code: |2
    daily = dg.DailyPartitionsDefinition(
        start_date="2026-01-01",
    )

    regions = dg.StaticPartitionsDefinition(
        ["ru", "eu", "us"],
    )

    # пересечение: день × регион
    both = dg.MultiPartitionsDefinition({
        "date": daily,
        "region": regions,
    })

    @dg.asset(partitions_def=both)
    def features(context):
        k = context.partition_key
        ...
  notes: |2
    **Главное:**
    - !!Партиция — это разрез ассета по измерению; статус хранится по каждому разрезу отдельно.!!

    **Рассказ:**
    - Временные партиции покрывают почти все случаи в аналитике и ML.
    - Статические удобны для фиксированных справочников; динамические — когда список приходит из данных.
    - Multi — мощно и опасно: тридцать дней на десять регионов это уже триста партиций, а на сто регионов — три тысячи.
    - Сопоставление партиций между соседними ассетами настраивается отдельно: суточные признаки могут собираться в месячную обучающую выборку.

    **Осторожно:**
    - Не начинать с Multi.
    - Сначала одно измерение, и только когда его перестанет хватать — второе.
- kind: content
  id: 907-a5-bekfilly
  title: 'A5. Бэкфиллы: пересчёт истории'
  bullets:
  - Бэкфилл — запуск набора партиций одним действием
  - Запускается из интерфейса, CLI или программно
  - Параллелизм обязательно ограничивать, иначе ляжет склад
  - Идемпотентность обеспечиваете вы, а не оркестратор
  materials:
  - label: Dagster — Backfills
    url: https://docs.dagster.io/guides/build/partitions-and-backfills/backfilling-data
  code_lang: bash
  code: |2
    # из CLI: диапазон партиций
    dagster asset backfill \
      --select features_daily \
      --partition-range \
        2026-01-01...2026-06-30

    # ограничение одновременности —
    # в dagster.yaml или тегами запуска
    #   run_queue:
    #     max_concurrent_runs: 4
  notes: |2
    **Главное:**
    - !!Бэкфилл — обычная операция над диапазоном; вся сложность в параллелизме и идемпотентности.!!

    **Рассказ:**
    - В интерфейсе бэкфилл виден сеткой партиций со статусами — это лучший способ следить за прогрессом.
    - Ограничение одновременности задаётся глобально в конфигурации инстанса или тегами конкретного запуска.
    - Идемпотентность — ваша ответственность: если модель дописывает строки вместо перезаписи окна, повторный бэкфилл продублирует данные.

    **Осторожно:**
    - Бэкфилл на несколько тысяч партиций без ограничений — самый надёжный способ уронить склад.
    - Начинать с малого диапазона и смотреть на нагрузку.
- kind: content
  id: 908-a6-kodovye-lokacii
  title: 'A6. Кодовые локации'
  bullets:
  - Локация — независимо деплоящийся набор определений
  - Свои зависимости, свой образ, свой релизный цикл
  - Падение одной локации не роняет остальные
  - Границы локаций должны совпадать с границами команд
  materials:
  - label: Dagster — Workspaces
    url: https://docs.dagster.io/guides/build/projects/workspaces
  code_lang: yaml
  code: |2
    # workspace.yaml
    load_from:
      - grpc_server:
          host: dbt-code
          port: 4000
          location_name: analytics

      - grpc_server:
          host: ml-code
          port: 4000
          location_name: ml_platform

    # у каждой локации свой образ
    # и свои версии библиотек
  notes: |2
    **Главное:**
    - !!Кодовая локация — граница деплоя и изоляции, а не способ навести порядок в папках.!!

    **Рассказ:**
    - Каждая локация живёт в своём процессе и общается с веб-сервером по gRPC.
    - Отсюда две главные выгоды: несовместимые зависимости в разных локациях и независимые релизы.
    - Граф при этом остаётся общим: ассеты из разных локаций связываются совпадением ключей.

    **Что важно не перепутать:**
    - Разделение на локации — **организационное решение**.
    - Технически всё работало бы и в одной; выигрыш появляется, когда появляются разные владельцы.

    **Когда не надо:**
    - Одной команде с одним проектом вторая локация не нужна.
- kind: content
  id: 909-a7-instans-demon-webserver
  title: 'A7. Из чего состоит развёрнутый Dagster'
  bullets:
  - 'Веб-сервер — интерфейс и GraphQL API'
  - 'Демон — расписания, сенсоры, очередь запусков, бэкфиллы'
  - 'Инстанс — общее состояние: запуски, события, расписания'
  - dagster.yaml настраивает хранилища и лимиты
  - 'В проде хранилище — Postgres, в разработке — SQLite'
  materials:
  - label: Dagster — архитектура OSS
    url: https://docs.dagster.io/deployment/oss/oss-deployment-architecture
  code_lang: diagram
  code: |2
     ┌──────────┐ ┌──────────┐ ┌─────────┐
     │Webserver │ │ Daemon   │ │  Code   │
     │UI,GraphQL│ │расписания│ │locations│
     │          │ │сенсоры,  │ │ваш код  │
     │          │ │очередь,BF│ │ (gRPC)  │
     └────┬─────┘ └────┬─────┘ └────┬────┘
          └────────────┴────────────┘
                       │
            ┌──────────────────┐
            │ Dagster Instance │ dagster
            │ run storage      │  .yaml
            │ event log        │ Postgres
            │ schedule storage │  в проде
            └──────────────────┘
  notes: |2
    **Главное:**
    - !!Без запущенного демона не работают ни расписания, ни сенсоры, ни бэкфиллы — интерфейс при этом выглядит здоровым.!!

    **Рассказ:**
    - Веб-сервер отдаёт интерфейс и API; он не запускает работу сам.
    - Демон — единственный компонент, который инициирует запуски по времени и событиям.
    - Инстанс — это не процесс, а конфигурация и хранилища: где лежат запуски, события и расписания.
    - `dagster.yaml` — файл, который всё это связывает; там же лимиты одновременности и настройки очереди.

    **Что важно не перепутать:**
    - «Расписание не сработало» почти всегда означает «демон не запущен» или «расписание не включено».
    - Это первое, что надо проверять.
- kind: table
  id: 910-a8-dev-protiv-prod
  title: 'A8. Dev против prod'
  table:
    headers: ['Аспект', 'Разработка', 'Продакшен']
    rows:
    - ['Запуск', 'dg dev — всё в одном процессе', 'Веб-сервер и демон отдельно']
    - ['Состояние', 'SQLite в папке проекта', 'Postgres']
    - ['Код', 'Локальные файлы', 'Кодовые локации в своих образах']
    - ['Секреты', 'Файл .env', 'Хранилище секретов через EnvVar']
    - ['Манифест dbt', 'prepare_if_dev при старте', 'Собран заранее и в образе']
    - ['Ресурсы', 'Заглушки и локальные адреса', 'Реальные системы']
    - ['Данные', 'Сэмпл или одна партиция', 'Полный объём']
    col_ratios: [3, 4, 4]
  notes: |2
    **Главное:**
    - !!Отличаются конфигурация и окружение; код ассетов между колонками не меняется.!!

    **Рассказ:**
    - Каждая строка — это то, что задаётся снаружи кода: ресурсами, переменными окружения, сборкой образа.
    - Строка про манифест — самая частая причина «в проде dbt-ассетов нет».
    - Строка про данные — про дисциплину: разработка на полном объёме превращает цикл правки в часы.

    **Что важно не перепутать:**
    - `dg dev` — не уменьшенный прод, а отдельный режим без отказоустойчивости и изоляции.
- kind: table
  id: 911-a9-oss-protiv-plus
  title: 'A9. Открытая версия против облачной'
  table:
    headers: ['Возможность', 'OSS (Apache 2.0)', 'Dagster+']
    rows:
    - ['Ядро оркестрации', 'полностью', 'полностью']
