    - ['Sensor', 'По внешнему событию', 'Триггер живёт вне Dagster', 'Хватает условия по графу']
    - ['Проверка свежести', 'Постоянно как условие', 'Важно поймать «данные не приехали»', 'Нет договорённости об SLA']
    col_ratios: [3, 4, 4, 4]
