    - Не зачитывать таблицу как приговор.
    - У неё нет строки «итого».

    **Takeaway:**
    - !!Разрыв в понятиях сократился; разрыв в том, вокруг чего построена платформа, — нет.!!

    **Переход:**
    - ~~«Вторая половина таблицы — про данные, dbt и повседневную работу».~~

