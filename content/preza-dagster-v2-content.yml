    - Верхние строки — реальные альтернативы: вы выбираете что-то одно.
    - Средние — соседи по этажам: Kestra выше, Argo ниже.
    - Нижние три — !!дополняющие!!: Kedro структурирует код, MLflow ведёт эксперименты, dbt считает SQL.
