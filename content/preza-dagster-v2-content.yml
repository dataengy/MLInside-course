# preza-dagster-v2-content.yml — WHAT-файл деки «Современная оркестрация ML-пайплайнов (Dagster)».
# Рендерится через content/build_deck_v3-settings.yml (или .tmp/dagster_v2_build_settings.yml
# для черновиков — тот пишет в .tmp/build и не будит publish-хук).
#
# v2.2.0 — 2026-09-01 — три live-demo checkpoint внутри нарратива.
#          Что изменилось против v2.1.0:
#          · В трёх практических блоках появились демо-слайды-якоря: 017 (Quick Start, ~6 мин),
#            026 (Dagster + dbt, ~9 мин — главное демо лекции) и 042 (MLflow / MLOps, ~6.5 мин).
#            Все три идут на ОДНОМ подготовленном demo-проекте, граф которого прирастает:
#            feature_table → training_dataset → trained_model, затем synthetic-витрина
#            заменяется настоящим dbt-графом, затем цепочка продолжается до registered_model.
#          · Демо не добавили лекции времени: они ЗАМЕНИЛИ слайдовое объяснение. Слайды, чьё
#            содержание теперь показывается вживую, не удалены, а перенесены в приложение как
#            screenshot fallback — A14 (шаги 4–7 Quick Start), A15 (уровни 2–3 dbt),
#            A16 (MLflow-связка и детали lifecycle).
#          · Подстрочник каждого демо-слайда несёт маркеры DEMO START / DEMO END, состояние
#            «до демо», пронумерованные действия с ожидаемым результатом, ссылку на запасные
#            слайды и явный план возврата к слайдам. Полный сценарий — docs/dagster-demo-runbook.md.
#          · Живого демо Airflow нет намеренно (низкий teaching ROI, слишком много контура):
#            вместо него слайд 049 «Один пайплайн в трёх интерфейсах» — один склеенный кадр 3:1
#            из скриншотов ОДНОГО логического пайплайна в Airflow 2, Airflow 3 и Dagster.
#          · Чтобы уложиться в потолок лекции (settings/config.yml → course_production.lecture
#            .duration_min: [50, 90]), в приложение переехали также соседние оркестраторы (A17)
#            и детали сравнения с Airflow плюс две референс-архитектуры (A18).
#            Итог: 98.0 → ~89 мин при трёх демо внутри.
#          · Реестр картинок — content/preza-dagster-v2-images.yml; все кадры демо и триптих
#            заведены как `wanted`, снимать их по брифам из блоков «Визуальные опоры».
#
# v2.1.0 — 2026-09-01 — уплотнение основной лекции + богатое приложение + визуальные опоры.
#          Что изменилось против v2.0.0:
#          · Вводная сжата до трёх ответов: что такое Dagster (формула), где он стоит
#            (control plane) и почему это интересно MLE (из «?» в граф).
#          · Quick Start развёрнут в законченный mini-tutorial из десяти шагов на MLE-лексике
#            (feature_table → training_dataset → trained_model), а не на raw_orders.
#          · Блок dbt перестроен по уровням 0→4: у каждого уровня свой слайд и свой выигрыш.
#          · В ML-часть добавлены сквозной практический пайплайн и слайд про то, что именно
#            пересчитывается при трёх типах изменений (данные / препроцессинг / гиперпараметры).
#          · Сравнение с Airflow полностью переписано на ТРИ продукта — Airflow 2.x, Airflow 3.x
#            и Dagster. Airflow 3.3 несёт assets, @asset, asset-aware и event-driven scheduling,
#            партиционированные ассеты с мапперами; изображать его «не знающим про данные»
#            больше нельзя. Сравнение Cosmos и dagster-dbt переписано без strawman.
#          · Референс-архитектур стало четыре (добавлена warehouse-centric).
#          · Приложение выросло с 11 до 19 слайдов и покрывает A1–A13 из плана.
#          · В подстрочник каждого содержательного слайда добавлены разделы «Для MLE»,
#            «Что важно не перепутать», «Takeaway» и блок «Визуальные опоры» — три ссылки
#            на официальные источники плюс бриф скриншота или схемы, чтобы картинку можно
#            было воспроизвести руками, не используя чужое изображение.
#
# v2.0.0 — 2026-09-01 — переработка под MLE/MLOps. Предыдущая дека (v1.4,
#          content/preza-dagster-content.yml, 49 слайдов) была справочником сущностей Dagster;
#          здесь нарратив строится от вопроса «я MLE/DE — как за 10–15 минут понять Dagster,
#          запустить первый pipeline и увидеть, зачем он нужен вместе с dbt и MLflow?».
#
# Структура: 64 записываемых слайда (001–064) + 49 слайдов приложения (900–948) = 113.
#   PART 1  001–011  Проблема и роль Dagster
#   PART 2  012–019  Quick Start — шаги 0–3 и 8–9 слайдами, 4–7 в DEMO 1 (017)
#   PART 3  020–028  Dagster + dbt, уровни 0→1 слайдами, 2→3 в DEMO 2 (026)
#   PART 4  029–039  ML lifecycle
#   PART 5  040–047  MLflow (DEMO 3 — 042) и четыре паттерна переобучения
#   PART 6  048–053  Airflow 2.x, Airflow 3.x и Dagster; 049 — триптих скриншотов
#   PART 7  054–056  Две референс-архитектуры
#   PART 8  057–060  Решение, итоговая модель, эксплуатация
#   PART 9  061–064  ДЗ и финал
#   ПРИЛОЖЕНИЕ 900–948 — A1…A18, хронометража не несёт
#     A1–A13  900–918  справочник по сущностям Dagster
#     A14     919–923  screenshot fallback для DEMO 1
#     A15     924–929  screenshot fallback для DEMO 2
#     A16     930–936  screenshot fallback для DEMO 3 + детали lifecycle
#     A17     937–942  оркестраторы рядом (Prefect, Kestra, Argo, Kedro)
#     A18     943–948  детали сравнения с Airflow + ещё две референс-архитектуры
#
# ТРИ ДЕМО — один общий demo-проект, граф прирастает слева направо:
#   DEMO 1 (017)  feature_table → training_dataset → trained_model
#   DEMO 2 (026)  sources → staging → intermediate → feature mart → training_dataset → trained_model
#   DEMO 3 (042)  … → trained_model → evaluation → registered_model
# Принцип демо: НЕ демонстрировать набор текста — демонстрировать изменение состояния системы
# и семантику графа. Сценарий, состояние «до», expected result и pre-flight — в
# docs/dagster-demo-runbook.md; каждому демо соответствует запасной раздел приложения.
#
# Сквозная схема деки повторяется и обрастает деталями на 008 → 026 → 030 → 042 → 055–056:
#   raw → dbt staging → dbt feature mart → training dataset → train → evaluate → model
#
# РАЗМЕТКА ПОДСТРОЧНИКА. Эмфаза — конвенция settings.notes_emphasis, а не HTML:
#   !!…!!  — жирный + подчёркнутый (центральная мысль слайда)
#   **…**  — жирный (термин, ключевое утверждение)
#   __…__  — подчёркнутый
#   ~~…~~  — курсив (реплика перехода, оговорка)
# HTML-теги рендерер не разбирает и вывел бы их в заметку буквально.
#
# Каждый записываемый слайд несёт сценарий лектора и оценку [~N мин]. Слайды интеграций и
# референс-архитектур дополнительно несут четыре метки границ: Когда применять / Когда не надо /
# Граница ответственности / Граница отказа.
# Часы проставляет scripts/preza/notes_fix.py apply — руками их не пишем.
# Слайды приложения намеренно без [~N мин] и стоят ПОСЛЕ closing: notes_format.scope: main
# заканчивает хронометраж на слайде 064 и приложения не трогает.
# Хронометраж демо-слайда РАВЕН длительности демо: лектор стоит на нём всё время показа,
# поэтому арифметика часов остаётся честной и notes_fix.py ничего не ломает.

