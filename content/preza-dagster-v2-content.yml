- kind: section
  id: 012-quick-start
  title: 'Quick Start: от нуля до графа за 10 минут'
  notes: |2
    [10:00–10:18 · ~0.3 мин] **Рассказ:**
    - Дальше десять шагов, каждый — одна команда или один экран.
    - Шаги 0–3 разбираем по коду на слайдах, шаги 4–7 показываю !!вживую в интерфейсе!!, шаги 8–9 снова на слайдах.
    - Всё воспроизводимо дома по этим же слайдам, без базы и без кластера.
- kind: content
  id: 013-shag-0-podnyat-dagster
  title: 'Шаг 0: создать проект и поднять интерфейс'
  bullets:
  - Одна команда создаёт проект, вторая поднимает интерфейс
  - Ставится в собственное виртуальное окружение проекта
  - Ничего разворачивать не нужно — ни базы, ни кластера
  materials:
  - label: Dagster — Quickstart
    url: https://docs.dagster.io/getting-started/quickstart
  code_lang: bash
  code: |2
    uvx create-dagster@latest \
        project ml-platform
    cd ml-platform
    source .venv/bin/activate

    dg dev        # → localhost:3000
  notes: |2
    [10:18–11:30 · ~1.2 мин] **Главное:**
    - !!От нуля до работающего интерфейса — две команды и меньше минуты.!!

    **Рассказ:**
    - `create-dagster` — отдельный маленький CLI, который создаёт каркас проекта; `uvx` запускает его без установки.
    - Он же заводит виртуальное окружение и кладёт туда `dagster` и `dg`.
    - `dg` ставится !!в окружение проекта!!, а не глобально — это осознанное решение авторов, чтобы версия CLI совпадала с версией библиотеки.
    - `dg dev` поднимает веб-сервер и демон в одном процессе; состояние — SQLite в папке проекта.

    **Для MLE:**
    - Никакого Postgres, Docker и Kubernetes на этом этапе не нужно.
    - Это важно: порог входа у Dagster ниже, чем принято думать про оркестраторы.

    **Что важно не перепутать:**
    - `dg dev` — это **режим разработки**, а не продакшен-развёртывание.
    - В проде веб-сервер и демон запускаются отдельными сервисами, а состояние лежит в Postgres; про это есть слайд в приложении.

    **Осторожно:**
    - Если в аудитории спросят про `pip`: команда та же, но без `uvx` — `create-dagster project ml-platform` после установки пакета.

    **Takeaway:**
    - !!Порог входа — две команды; всё остальное можно откладывать.!!

    **Переход:**
    - ~~«Интерфейс пустой. Наполняем его — первый ассет».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/getting-started/quickstart
       Что взять: точные команды и первый экран — слайд повторяет их дословно.

    2. https://docs.dagster.io/api/clis/create-dagster
       Что взять: полный список ключей `create-dagster`, если спросят про шаблоны проекта.

    3. https://docs.dagster.io/guides/build/projects/creating-projects
       Что взять: структуру созданного проекта — где лежат `defs/` и `pyproject.toml`.

    **Скриншот:**
    - Открыть терминал, выполнить обе команды подряд, дождаться строки со ссылкой на localhost:3000.
    - Оставить в кадре три-четыре последние строки вывода, включая адрес.
    - Рядом или ниже — окно браузера с пустым проектом Dagster.
    - Обрезать всё, что выше приглашения оболочки.
    - Рамкой выделить адрес localhost:3000 в терминале и тот же адрес в строке браузера.
- kind: content
  id: 014-shag-1-pervyj-asset
  title: 'Шаг 1: ассет feature_table'
  bullets:
  - Один файл в defs/, один декоратор
  - Функция возвращает объект — Dagster считает его материализованным
  - Появляется в интерфейсе сразу, перезапускать процесс не нужно
  code_lang: python
  code: |2
    # src/ml_platform/defs/ml.py
    import dagster as dg
    import pandas as pd

    @dg.asset
    def feature_table() -> pd.DataFrame:
        """Витрина признаков."""
        return pd.read_parquet(
            "data/features.parquet",
        )
  notes: |2
    [11:30–12:42 · ~1.2 мин] **Главное:**
    - !!Ассет — обычная функция Python с декоратором; ничего больше на этом шаге не нужно.!!

    **Рассказ:**
    - Файл кладётся в папку `defs/` — Dagster сам находит там определения, регистрировать их вручную не надо.
    - Декоратор `@dg.asset` превращает функцию в узел графа.
    - Имя узла — имя функции: `feature_table`.
    - Возвращаемое значение Dagster считает содержимым ассета и по умолчанию сохраняет через IO manager; на этом шаге про IO managers говорить не нужно.
    - Обновить вкладку в браузере — узел уже там.

    **Для MLE:**
    - Мы намеренно начинаем не с `raw_orders`, а с !!витрины признаков!!: это та точка, где ваш рабочий день реально начинается.
    - Сигнатура с типом `-> pd.DataFrame` не обязательна, но полезна: по ней читается, что за объект получится.

    **Пример:**
    - Если признаки у вас уже считает dbt — на этом шаге можно временно читать выгруженный parquet, а на шаге про dbt заменить его настоящим ассетом.

    **Что важно не перепутать:**
    - Функция описывает **как получить объект**, а не «что запустить по расписанию».
    - Расписания на этом шаге нет вообще, и ассет всё равно полноценно существует.

    **Takeaway:**
    - !!Файл в defs/, декоратор, функция — и в графе появился первый узел.!!

    **Переход:**
    - ~~«Один узел — это ещё не граф. Добавляем зависимость».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/defining-assets
       Что взять: канонический вид первого ассета и объяснение, что делает декоратор.

    2. https://docs.dagster.io/guides/build/projects/project-structure
       Что взять: почему файл лежит именно в `defs/` и как работает автозагрузка.

    3. https://docs.dagster.io/examples/full-pipelines/ml/data-ingestion
       Что взять: как в официальном ML-примере выглядит самый первый ассет цепочки.

    **Скриншот:**
    - В интерфейсе открыть вкладку Assets сразу после добавления файла.
    - В кадре — один узел `feature_table` с серым статусом «никогда не материализовался».
    - Рядом показать правую панель с описанием, взятым из docstring.
    - Обрезать навигацию сверху; сайдбар можно оставить, он показывает, что ассет один.
    - Стрелкой связать docstring в коде и текст описания в панели.
- kind: content
  id: 015-shag-2-training-dataset
  title: 'Шаг 2: training_dataset зависит от feature_table'
  bullets:
  - Аргумент функции — это имя ассета, от которого мы зависим
  - Ребро графа появляется само, стрелки нигде не объявляются
  - Проверить связность можно, не запуская ничего
  code_lang: python
  code: |2
    @dg.asset
    def training_dataset(
        feature_table: pd.DataFrame,
    ) -> pd.DataFrame:
        df = feature_table.dropna()
        return df[df.split == "train"]

    # feature_table → training_dataset
  notes: |2
    [12:42–13:54 · ~1.2 мин] **Главное:**
    - !!Зависимость объявляется аргументом функции — граф собирается из кода, а не рисуется отдельно.!!

    **Рассказ:**
    - Аргумент называется ровно так же, как ассет выше: `feature_table`.
    - Этого достаточно, чтобы Dagster построил ребро и понял порядок выполнения.
    - Никакого оператора связи, никакого отдельного файла с описанием DAG.
    - Обновить граф в браузере: два узла и стрелка между ними.
    - Сказать, что именно отсюда берётся честность графа: !!ребро и передача данных — это один и тот же факт!!.

    **Для MLE:**
    - Именно это свойство закрывает классическую беду: граф в оркестраторе показывает одно, а код читает другое.
    - Здесь такое рассинхронизировать физически труднее.

    **Что важно не перепутать:**
    - Есть второй способ объявить зависимость — параметр `deps=`, когда данные передаются не через возвращаемое значение, а лежат в хранилище.
    - Он нужен для dbt и внешних систем; на Quick Start мы его сознательно не трогаем.

    **Осторожно:**
    - Если аргумент назван иначе, чем ассет, Dagster на старте скажет, что такого ассета нет.
    - Это хорошая ошибка: она ловится до запуска.

    **Takeaway:**
    - !!Имя аргумента — это и есть стрелка графа.!!

    **Переход:**
    - ~~«Третий узел — и в графе появляется модель».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/defining-assets-with-asset-dependencies
       Что взять: оба способа объявления зависимости рядом — через аргумент и через `deps=`.

    2. https://docs.dagster.io/guides/build/assets/passing-data-between-assets
       Что взять: что физически происходит с возвращаемым значением между двумя ассетами.

    3. https://docs.dagster.io/guides/build/assets/modeling-etl-pipelines
       Что взять: рекомендации по гранулярности — сколько работы класть в один ассет.

    **Скриншот:**
    - Вкладка Assets, режим графа, два узла и стрелка.
    - В кадре обязательно должно быть видно направление стрелки.
    - Рядом врезкой — три строки кода с аргументом `feature_table`.
    - Стрелкой соединить аргумент в коде с ребром на графе.
- kind: content
  id: 016-shag-3-trained-model
  title: 'Шаг 3: trained_model зависит от training_dataset'
  bullets:
  - Модель — такой же ассет, как таблица
  - Цепочка из трёх узлов уже описывает мини-пайплайн
  - Ничего специфически «ML-ного» в описании нет
  code_lang: python
  code: |2
    @dg.asset
    def trained_model(
        training_dataset: pd.DataFrame,
    ):
        X = training_dataset.drop(
            columns=["target"],
        )
        y = training_dataset["target"]
        return fit_model(X, y)

    # feature_table → training_dataset
    #               → trained_model
  notes: |2
    [13:54–15:06 · ~1.2 мин] **Главное:**
    - !!Модель описывается тем же декоратором, что и таблица, — и это главный концептуальный выигрыш Dagster для MLE.!!

    **Рассказ:**
    - Прочитать код: на входе обучающая выборка, на выходе обученная модель.
    - Обратить внимание, что в описании нет ничего про ML: ни специального типа ассета, ни отдельного API.
    - Модель попадает в тот же граф, что и данные, и получает ту же историю материализаций.
    - Показать граф из трёх узлов и сказать, что это уже полноценный пайплайн.

    **Для MLE:**
    - Практическое следствие: !!lineage модели получается бесплатно!!.
    - Как только модель — узел графа, вопрос «на каких данных она обучена» становится вопросом «что у неё выше по течению».

    **Что важно не перепутать:**
    - Возврат объекта модели прямо из функции хорош для учебного примера.
    - В проде вы почти наверняка **сохраните модель во внешнее хранилище или реестр**, а из ассета вернёте метаданные и ссылку; к этому мы придём в блоке про MLflow.

    **Осторожно:**
    - Не начинать здесь разговор про сериализацию и IO managers — это уводит от главного за десять минут.

    **Takeaway:**
    - !!Обученная модель — обычный ассет, а не особая сущность.!!

    **Переход:**
    - ~~«Три узла описаны. Дальше — не слайд: переключаюсь на Dagster и считаю их вживую».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/ml/model-training
       Что взять: официальный пример ассета обучения — сравнить со слайдом почти построчно.

    2. https://docs.dagster.io/examples/full-pipelines/ml/evaluation-deployment
       Что взять: как в том же примере устроены оценка и передача модели дальше.

    3. https://docs.dagster.io/guides/build/assets/defining-assets
       Что взять: подтверждение, что для модели не нужен никакой особый декоратор.

    **Скриншот:**
    - Граф из трёх узлов в одну линию, слева направо.
    - Раскрасить или подписать третий узел как модель — например, тегом kind.
    - В кадре не должно быть ничего, кроме цепочки и её подписей.
    - Стрелкой отметить, что тип третьего узла отличается от первых двух только смыслом, а не механикой.
- kind: content
  id: 017-demo-1-quick-start
  title: 'DEMO 1 · Шаги 4–7 вживую: материализация, граф, метаданные, пересчёт'
  bullets:
  - Код уже написан — смотрим не на набор текста, а на состояние системы
  - Материализуем граф и читаем метаданные последней материализации
  - Меняем данные наверху — и видим, что именно устарело ниже
  - Пересчитываем только устаревшее, а не весь пайплайн
  materials:
  - label: Dagster — Quickstart
    url: https://docs.dagster.io/getting-started/quickstart
  code_lang: diagram
  code: |2
     НА ЭКРАНЕ
     ──────────────────────────
     feature_table
          ↓
     training_dataset
          ↓
     trained_model

     dg dev → localhost:3000
  notes: |2
    [15:06–21:06 · ~6 мин] **DEMO START**

    **Состояние до демо:**
    - Проект `ml-platform` уже создан, окружение активировано, три ассета из шагов 1–3 лежат в `defs/ml.py`.
    - `dg dev` !!уже запущен!! до начала записи, вкладка `localhost:3000` открыта на Asset Graph.
    - Граф ещё ни разу не материализован — все три узла серые.
    - Это нарочно: первый зелёный цвет должен появиться на глазах у зрителя.
    - Файл `data/features.parquet` лежит рядом; второй его вариант (с изменённой строкой) подготовлен как `data/features.v2.parquet`.

    **Действия и ожидаемый результат:**
    - 1.
    - Показать окно с `dg dev` в терминале и вкладку браузера → веб-интерфейс отвечает, слева список ассетов из трёх имён.
    - 2.
    - Открыть Asset Graph → три узла и две стрелки; сказать вслух, что стрелки !!нигде не объявлялись!! — они выведены из аргументов функций.
    - 3.
    - Кликнуть по узлу `training_dataset` → карточка ассета: описание, upstream, история пустая.
    - 4.
    - Materialize all → узлы зеленеют по очереди сверху вниз; в журнале события идут !!по ассетам!!, а не по абстрактным шагам.
    - 5.
    - Открыть карточку `trained_model` → метаданные последней материализации: `roc_auc`, `rows`, `features`; переключиться на вкладку с графиком метрики по времени.
    - 6.
    - В терминале подменить `data/features.parquet` на второй вариант → вернуться в браузер, обновить граф.
    - 7.
    - Показать, что `feature_table` и всё ниже помечено устаревшим → произнести главный вопрос лекции: «что пересчитать» теперь спрашивают у графа.
    - 8.
    - Выполнить `dg launch --assets 'feature_table+'` → пересчитались три узла; затем `dg launch --assets 'training_dataset'` → пересчитался ровно один.

    **Осторожно:**
    - Ничего не печатать руками, кроме двух команд `dg launch` — код меняется подменой файла, а не редактированием на камеру.
    - Не открывать вкладки Runs, Schedules, Sensors и Deployment: расписания, партиции и деплой в этой части лекции ещё не введены.
    - Не заходить в настройки инстанса — там видны пути и версии, которые сейчас только отвлекут.

    **Если не работает:**
    - Приложение **A14** — те же четыре экрана слайдами: материализация, asset graph, метаданные, селективный пересчёт.
    - Порядок рассказа по слайдам тот же, что по пунктам выше; хронометраж при этом сокращается примерно вдвое.

    **Takeaway:**
    - !!Мы не запускали задачи — мы просили объекты; порядок и объём работы вывел граф.!!

    **DEMO END**

    **Возврат:**
    - ~~Следующий слайд — «Шаг 8: проверки и происхождение». Продолжаем с того, что граф уже материализован и на экране.~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/getting-started/quickstart
       Что взять: эталонный вид первого экрана — с ним сверяется то, что зритель увидит в демо.

    2. https://docs.dagster.io/guides/build/assets/asset-selection-syntax/reference
       Что взять: синтаксис `имя+` и `+имя`, чтобы команды в демо не выглядели магией.

    3. https://docs.dagster.io/guides/build/assets/metadata-and-tags
       Что взять: как выглядит карточка ассета с метаданными и графиком числовой метрики.

    **Схема:**
    - Три узла в столбик, стрелки вниз, под ними строка запуска — ровно то, что будет на экране в браузере.
    - Не рисовать здесь интерфейс: слайд служит опорой на время демо, а не его заменой.
- kind: content
  id: 018-shag-8-checks-i-lineage
  title: 'Шаг 8: проверки и происхождение'
  bullets:
  - Проверка — узел рядом с ассетом, а не отдельный пайплайн
  - Упавшая проверка останавливает ветку, а не весь запуск
  - Происхождение читается по графу вверх, без внешнего каталога
  materials:
  - label: Dagster — Asset checks
    url: https://docs.dagster.io/guides/test/asset-checks
  code_lang: python
  code: |2
    @dg.asset_check(asset=training_dataset)
    def net_propuskov(training_dataset):
        bad = training_dataset["target"] \
                  .isna().sum()
        return dg.AssetCheckResult(
            passed=bad == 0,
            metadata={"propuski": int(bad)},
        )
  notes: |2
    [21:06–22:18 · ~1.2 мин] **Главное:**
    - !!Проверка живёт рядом с ассетом и отвечает за его качество, а не за успех запуска.!!

    **Рассказ:**
    - Показать декоратор и объяснить связь: проверка привязана к конкретному ассету параметром `asset=`.
    - В интерфейсе она видна !!на карточке ассета!!, рядом с историей материализаций, а не в отдельном разделе.
    - Результат — не только «прошла или нет», но и метаданные: сколько именно пропусков.
    - Про lineage: подняться по графу от модели вверх и показать, что происхождение читается без всякого внешнего каталога данных.

    **Для MLE:**
    - Проверка на данных и проверка на метрике модели описываются !!одинаково!!.
    - Порог ROC-AUC — такая же проверка, как «нет пропусков в целевой колонке»; к этому вернёмся в ML-блоке.

    **Что важно не перепутать:**
    - Asset check — это **не unit-тест**.
    - Unit-тест проверяет код на фиктивных данных до запуска; check проверяет **фактический результат** после материализации.
    - Нужны оба.

    **Осторожно:**
    - Не обещать, что упавшая проверка автоматически откатит данные.
    - Она останавливает ветку и поднимает флаг; что делать дальше — ваше решение.

    **Takeaway:**
    - !!Качество данных и происхождение — свойства графа, а не отдельные системы.!!

    **Переход:**
    - ~~«Подводим итог Quick Start».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/test/asset-checks
       Что взять: определение проверки, уровни серьёзности и поведение downstream.

    2. https://docs.dagster.io/guides/build/assets/metadata-and-tags/column-level-lineage
       Что взять: самый наглядный вид происхождения — до уровня колонок.

    3. https://docs.dagster.io/guides/test/data-contracts
       Что взять: как проверки складываются в контракт на данные, если аудитория спросит про SLA.

    **Скриншот:**
    - Довести проверку до падения — например, подсунуть данные с пропусками.
    - Открыть карточку ассета `training_dataset`, вкладку с проверками.
    - В кадре: красный статус проверки, её имя и метаданные с числом пропусков.
    - Ниже или рядом — граф, где узлы ниже по течению не запустились.
    - Стрелкой связать красную проверку и остановленную ветку графа.
- kind: content
  id: 019-shag-9-itog-quick-start
  title: 'Шаг 9: что вы получили за десять минут'
  bullets:
  - Ассет, зависимость, материализация, метаданные, граф
  - Селективный пересчёт, проверки, происхождение
  - Всё это — без базы, кластера и деплоя
  - Отложено сознательно — и мы знаем, где к этому вернёмся
  code_lang: diagram
  code: |2
     УЖЕ УМЕЕТЕ          ОТЛОЖЕНО
     ─────────────────   ────────────────
     ассет               ops / graphs
     зависимость         jobs
     материализация      IO managers
     метаданные          code locations
     asset graph         деплой, демон
     частичный пересчёт  расписания
     проверки            партиции
     происхождение       ресурсы

     всё справа — дальше по лекции
     или в приложении
  notes: |2
    [22:18–23:36 · ~1.3 мин] **Главное:**
    - !!За десять минут вы получили работающий граф и семь понятий; всё остальное можно доучивать по мере надобности.!!

    **Рассказ:**
    - Пройти левый столбец и убедиться, что каждое слово было на экране, а не только в рассказе.
    - Пройти правый и честно сказать: этого мы не показывали намеренно.
    - Ресурсы, партиции и расписания появятся в ML-блоке, потому что там они нужны по делу.
    - Операции, IO managers, кодовые локации и деплой лежат в приложении в конце деки.

    **Для MLE:**
    - Это тот объём, который стоит воспроизвести дома !!до!! домашнего задания.
    - Дальше в лекции мы к этой же цепочке подключим настоящий dbt-проект и разложим ML-часть.

    **Что важно не перепутать:**
    - «Отложено» не значит «не нужно в проде».
    - Кодовые локации и деплой обязательно понадобятся — просто **не в первый час знакомства**.

    **Takeaway:**
    - !!Минимальный работающий Dagster — это восемь понятий, а не весь его API.!!

    **Переход:**
    - ~~«Теперь подключаем к этому графу ваш настоящий dbt-проект».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/getting-started/quickstart
       Что взять: границу официального быстрого старта — она примерно совпадает с левым столбцом.

    2. https://docs.dagster.io/examples/full-pipelines/etl-pipeline
       Что взять: следующий шаг обучения, который логично посоветовать слушателям на дом.

    3. https://github.com/dagster-io/skills
       Что взять: официальный набор навыков для ассистентов — полезно тем, кто пишет код с ИИ.

    **Схема:**
    - Два столбца-чек-листа: слева галочки, справа — часы или многоточия.
    - Не изображать правый столбец как «сложное»: подписать «дальше по лекции или в приложении».
    - Внизу одна строка-обещание, куда именно вернёмся.
# ── PART 3 · Dagster + dbt ───────────────────────────────────────────────────────────────
- kind: section
  id: 020-dagster-i-dbt
  title: Dagster + dbt
  notes: |2
    [23:36–23:54 · ~0.3 мин] **Рассказ:**
    - Второй центральный блок лекции: как подключить уже существующий dbt-проект и что это даёт по шагам.
- kind: content
  id: 021-dbt-graf-chast-bolshego-grafa
  title: 'Главный тезис: dbt-граф становится частью большего графа'
  bullets:
  - dbt уже строит DAG — но он заканчивается на витринах
  - Dagster не оборачивает dbt, а продолжает его граф
  - Витрина и обученная модель оказываются в одном lineage
  code_lang: diagram
  code: |2
     БЫЛО              СТАЛО
     ──────────        ──────────────────
     [ dbt DAG ]       stg → int → mart
         ↓                     ↓
     отдельный         training dataset
     workflow                  ↓
     для ML                  model

     dbt DAG — ЧАСТЬ asset graph,
     а не соседний workflow
  notes: |2
    [23:54–25:06 · ~1.2 мин] **Главное:**
    - !!dbt-граф не оборачивается в один шаг, а продолжается ассетами ML — это и есть весь смысл интеграции.!!

    **Рассказ:**
    - Напомнить, что dbt сам по себе — уже граф, и очень хороший.
    - Проблема в том, что он !!заканчивается на витринах!!: дальше dbt не знает и знать не должен.
    - Типичная интеграция с оркестратором делает из всего dbt-проекта один прямоугольник «запусти dbt build».
    - Dagster делает иначе: каждая модель становится отдельным узлом, и к ним можно !!подцепить ML-ассеты!!.
    - Показать пальцем стрелку от `mart` к `training dataset` — вот ради неё вся эта часть лекции.

    **Для MLE:**
    - Это ответ на вопрос «зачем мне оркестратор, если dbt и так строит граф».
    - Затем, что ваш граф на витрине не заканчивается.

    **Что важно не перепутать:**
    - Это не «Dagster умеет, а другие не умеют».
    - Развернуть манифест в отдельные узлы умеют и другие интеграции — **разница в том, во что именно эти узлы превращаются и как они продолжаются дальше**; отдельный слайд в блоке про Airflow разбирает это честно.

    **Takeaway:**
    - !!Ценность не в запуске dbt, а в том, что его граф продолжается в ML.!!

    **Переход:**
    - ~~«Интеграцию удобно разложить на пять уровней. Сначала карта, потом каждый по отдельности».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: формулировку «dbt models as assets» из первого абзаца.

    2. https://docs.getdbt.com/docs/build/documentation
       Что взять: скриншот dbt-графа, который обрывается на витринах, — левая половина схемы.

    3. https://docs.dagster.io/examples/full-pipelines/dbt
       Что взять: правую половину — тот же граф, продолженный дальше.

    **Схема:**
    - Слева — чёрный прямоугольник с подписью «dbt DAG» и одной стрелкой вниз в пустоту.
    - Справа — та же цепочка, но развёрнутая в отдельные узлы, и стрелка, уходящая в ML-часть.
    - Не рисовать Dagster отдельным узлом ни слева, ни справа: он — плоскость, на которой лежат оба графа.
- kind: table
  id: 022-pyat-urovnej-integracii
  title: Пять уровней интеграции dbt и Dagster
  table:
    headers: ['Уровень', 'Что делаем', 'Что получаем', 'Чего не хватает']
    rows:
    - ['0', 'Один ассет запускает dbt build', 'Расписание и ретраи', 'Граф — чёрный ящик, частичного пересчёта нет']
    - ['1', 'manifest.json → ассеты', 'Каждая модель — отдельный ассет', 'ML-часть всё ещё отдельно']
    - ['2', 'Источники и ML-ассеты вокруг dbt', 'Один сквозной граф от загрузки до модели', 'Нет разрезания по времени']
    - ['3', 'Партиции, asset checks, автоматизация', 'Инкрементальность и качество в графе', 'Один проект, одна команда']
    - ['4', 'Несколько dbt-проектов и code locations', 'Платформа из независимых доменов', 'Нужна дисциплина владения']
    col_ratios: [1, 4, 4, 4]
  notes: |2
    [25:06–26:36 · ~1.5 мин] **Главное:**
    - !!Интеграция наращивается уровнями; целевой уровень для MLE — второй, а не пятый.!!

    **Рассказ:**
    - Прочитать таблицу как лестницу, а не как список опций.
    - Уровень 0 стоит почти ноль усилий и уже решает задачу «запускать по расписанию» — но граф остаётся чёрным ящиком.
    - Уровень 1 — !!самый выгодный шаг!!: одна команда, и сотня моделей становится сотней узлов.
    - Уровень 2 — то, ради чего MLE вообще здесь: dbt и ML в одном графе.
    - Уровень 3 — продакшен-семантика: партиции, тесты как проверки, автоматика.
    - Уровень 4 — платформа: несколько проектов, несколько команд.
    - Сказать прямо: на уровне 4 не надо оказываться раньше, чем этого требует организация.

    **Для MLE:**
    - Если в вашей команде один dbt-проект — уровни 2 и 3 закрывают всё, а четвёртый вам просто не нужен.

    **Что важно не перепутать:**
    - Колонка «чего не хватает» — не список недостатков Dagster.
    - Это **список того, что вы ещё не сделали** на этом уровне.

    **Takeaway:**
    - !!Ставьте себе целью уровень 2; уровень 1 достигается за одну команду.!!

    **Переход:**
    - ~~«Начнём снизу — с уровня ноль, чтобы честно показать, чего он не даёт».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: официальный путь входа — он соответствует уровню 1.

    2. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: перечень возможностей, распределённый по нашим уровням 2–3.

    3. https://docs.dagster.io/integrations/libraries/dbt/dbt-patterns
       Что взять: типовые схемы организации проектов — материал для уровня 4.

    **Схема:**
    - Лестница из пяти ступеней снизу вверх, у каждой — короткая подпись выигрыша.
    - Отметить ступень 2 как целевую для этой лекции.
    - Не рисовать ступень 4 как «вершину»: подписать её «нужна не всем».
- kind: content
  id: 023-level-0-chernyj-yaschik
  title: 'Level 0: dbt как чёрный ящик'
  bullets:
  - Один ассет или одна операция запускает dbt build целиком
  - Плюс — почти нулевые трудозатраты, расписание и ретраи сразу
  - Минус — весь dbt-проект остаётся одним прямоугольником
  - Частичного пересчёта и model-level lineage нет
  code_lang: diagram
  code: |2
     Dagster asset
          ↓
       dbt build
          ↓
     [ вся сотня моделей ]

     ПЛЮС     быстро, почти бесплатно
     МИНУС    один прямоугольник
              нет model-level графа
              нет частичного пересчёта
  notes: |2
    [26:36–27:36 · ~1 мин] **Главное:**
    - !!Уровень 0 честно работает, но не даёт ничего сверх расписания и ретраев.!!

    **Рассказ:**
    - Показать самый простой вариант: ассет, внутри которого вызывается `dbt build`.
    - Признать его достоинства: делается за десять минут, ничего не ломает, сразу даёт регламент и повторные попытки.
    - Назвать цену: в графе один узел вместо сотни.
    - Значит, нельзя пересчитать одну модель, нельзя увидеть, какая именно упала, нельзя связать конкретную витрину с ML-ассетом.

    **Для MLE:**
    - Практический вывод: уровень 0 подходит как !!первый день!! миграции, а не как целевое состояние.
    - Переход на уровень 1 стоит одну команду — задерживаться на нуле смысла нет.

    **Что важно не перепутать:**
    - Уровень 0 — это не «неправильно».
    - Для маленького проекта из пяти моделей он может остаться **достаточным навсегда**.

    **Takeaway:**
    - !!Чёрный ящик даёт расписание, но не даёт графа.!!

    **Переход:**
    - ~~«Достаточно одной команды, чтобы ящик стал прозрачным».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt/dagster-dbt
       Что взять: описание `DbtCliResource` — как выглядит самый простой вызов.

    2. https://docs.getdbt.com/reference/artifacts/manifest-json
       Что взять: доказательство, что описание проекта существует, — то, чем уровень 0 не пользуется.

    3. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: контраст с уровнем 1 на той же странице.

    **Схема:**
    - Один крупный прямоугольник с подписью `dbt build`, внутри — мелкая сетка неразличимых узлов.
    - Стрелка сверху от Dagster, стрелка снизу — в никуда.
    - Не подписывать этот вариант словом «плохо»; подписать «дёшево и слепо».
- kind: content
  id: 024-level-1-manifest-v-assety
  title: 'Level 1: манифест разворачивается в ассеты'
  bullets:
  - Каждая dbt-модель становится отдельным ассетом
  - 'ref() превращается в ребро графа: зависимости берутся из проекта'
  - Описания, теги и meta переезжают в метаданные ассета
  - Самый большой выигрыш за минимальный дополнительный труд
  materials:
  - label: Dagster & dbt
    url: https://docs.dagster.io/integrations/libraries/dbt
  code_lang: diagram
  code: |2
     manifest.json
          ↓
      dagster-dbt
          ↓
     stg_orders   ─→ int_orders ─→ mart
     stg_items    ─┘

     ref()        → ребро графа
     dbt test     → asset check
     description  → описание ассета
     meta / tags  → метаданные
  notes: |2
    [27:36–28:48 · ~1.2 мин] **Главное:**
    - !!Одна команда превращает сотню dbt-моделей в сотню узлов с зависимостями, описаниями и тестами.!!

    **Рассказ:**
    - Показать, что источник знания — !!не парсинг SQL!!, а официальный артефакт dbt: манифест.
    - Каждый `ref()` в проекте уже описывает зависимость; Dagster просто читает её.
    - Описания моделей из `schema.yml` становятся описаниями ассетов — документация переносится сама.
    - Тесты становятся проверками — про это будет отдельный слайд.
    - Сказать главное про экономику: !!это самый выгодный шаг во всей интеграции!! — усилий почти столько же, сколько на уровне 0, а выигрыш несопоставим.

    **Для MLE:**
    - После этого шага вы впервые видите, какая конкретно модель питает ваши признаки.
    - До этого шага у вас была только папка с SQL.

    **Что важно не перепутать:**
    - Dagster **не переписывает и не исполняет SQL сам**.
    - Он строит граф из манифеста, а выполняет модели по-прежнему dbt.

    **Осторожно:**
    - Не обещать, что имена ассетов совпадут с вашими ожиданиями по умолчанию.
    - Правила именования настраиваются — про это слайд про сшивку ключей.

    **Takeaway:**
    - !!Максимум выигрыша на единицу усилия во всей интеграции — здесь.!!

    **Переход:**
    - ~~«Раз всё держится на манифесте — разберёмся, что это такое и когда он появляется».~~

    **Визуальные опоры:**

    1. https://docs.getdbt.com/reference/artifacts/manifest-json
       Что взять: состав манифеста — узлы, зависимости, тесты, описания.

    2. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: картинку «dbt-проект в Asset Graph» — результат этого шага.

    3. https://docs.dagster.io/examples/full-pipelines/dbt/dbt-assets
       Что взять: рабочий пример развёртывания манифеста в ассеты.

    **Скриншот:**
    - Взять учебный dbt-проект с десятком моделей и подключить его к Dagster.
    - Открыть Asset Graph, включить группировку по папкам dbt.
    - В кадре: staging-слой, промежуточный слой и витрины с реальными рёбрами между ними.
    - Обрезать сайдбар; масштаб подобрать так, чтобы имена моделей читались.
    - Рамкой выделить одну модель и стрелкой — её описание в правой панели, взятое из schema.yml.
- kind: content
  id: 025-manifest-json
  title: 'manifest.json: откуда Dagster знает про модели'
  bullets:
  - dbt при компиляции выкладывает описание проекта в manifest.json
  - Из него берутся модели, зависимости, тесты, описания и meta
  - 'В разработке манифест пересобирается сам, в CI — заранее'
  - Манифест обязан попасть в образ вместе с кодом
  materials:
  - label: dbt — manifest.json
    url: https://docs.getdbt.com/reference/artifacts/manifest-json
  code_lang: python
  code: |2
    from dagster_dbt import DbtProject

    dbt_project = DbtProject(
        project_dir="../analytics_dbt",
    )

    # dev: пересобрать манифест на лету
    dbt_project.prepare_if_dev()

    # CI/prod: собрать заранее
    #   dagster-dbt project
    #     prepare-and-package
  notes: |2
    [28:48–30:00 · ~1.2 мин] **Главное:**
    - !!Манифест — единственный источник знаний Dagster о вашем dbt-проекте; в проде он должен быть собран заранее.!!

    **Рассказ:**
    - Манифест — это JSON, который dbt пишет при `parse`, `compile` или `build`: полный список узлов, их зависимостей, тестов и метаданных.
    - В разработке `prepare_if_dev()` пересобирает его при старте, чтобы граф не отставал от кода.
    - В CI и в проде так делать !!нельзя!!: сборка манифеста при старте процесса — это лишняя задержка и зависимость от доступности склада.
    - Поэтому существует отдельная команда упаковки, которую запускают на этапе сборки образа.

    **Для MLE:**
    - Практический симптом «манифеста нет»: Dagster стартует, а dbt-ассетов в графе не видно.
    - Это первая вещь, которую надо проверять.

    **Пример:**
    - Типовая ошибка в CI: образ собран, а `target/manifest.json` в него не попал, потому что `target/` в `.dockerignore`.
    - Граф пустой, логи чистые.

    **Что важно не перепутать:**
    - Манифест описывает **проект**, а не результаты запуска.
    - Он говорит, какие модели существуют, но не говорит, свежие ли данные.

    **Takeaway:**
    - !!Нет манифеста в образе — нет dbt-графа в проде.!!

    **Переход:**
    - ~~«Манифест есть. Дальше переключаюсь на Dagster и показываю живьём, во что он разворачивается».~~

    **Визуальные опоры:**

    1. https://docs.getdbt.com/reference/artifacts/manifest-json
       Что взять: структуру артефакта и перечень того, что в нём есть.

    2. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: раздел про подготовку манифеста в dev и в CI — точные команды.

    3. https://docs.dagster.io/examples/full-pipelines/dbt/managing-the-project
       Что взять: практику упаковки проекта вместе с манифестом.

    **Схема:**
    - Две дорожки: верхняя «dev» — код меняется, манифест пересобирается при старте; нижняя «CI/prod» — манифест собирается на этапе сборки образа и едет внутри него.
    - Показать образ как контейнер, внутри которого лежат и код, и манифест.
    - Отметить крестиком неверный вариант: прод собирает манифест при старте.
- kind: content
  id: 026-demo-2-dagster-dbt
  title: 'DEMO 2 · Главное демо: dbt-граф внутри Dagster'
  bullets:
  - Тот же проект, но synthetic feature_table заменён настоящим dbt-графом
  - Каждая dbt-модель — отдельный ассет Dagster, ref() — ребро графа
  - dbt-тесты приезжают как asset checks на карточку своей модели
  - Витрина признаков смыкается с обучением в одном сквозном графе
  materials:
  - label: Dagster — dbt integration
    url: https://docs.dagster.io/integrations/libraries/dbt
  code_lang: diagram
  code: |2
     НА ЭКРАНЕ
     ──────────────────────────
     sources
        ↓
     dbt staging
        ↓
     dbt intermediate
        ↓
     dbt feature mart
        ↓
     training_dataset
        ↓
     trained_model
  notes: |2
    [30:00–39:00 · ~9 мин] **DEMO START**

    **Состояние до демо:**
    - Тот же проект `ml-platform`; рядом лежит рабочий dbt-проект на DuckDB — источники, staging, intermediate и витрина признаков.
    - `dbt parse` !!уже выполнен!!, `target/manifest.json` свежий: собирать манифест на камеру нельзя, это ожидание без содержания.
    - Ассет `feature_table` из демо 1 удалён; вместо него `training_dataset` зависит от витрины из dbt.
    - `DagsterDbtTranslator` уже написан и работает — живьём его !!не пишем!!, показываем только результат его работы.
    - `dg dev` запущен, граф материализован один раз, чтобы у узлов была история.

    **Действия и ожидаемый результат:**
    - 1.
    - Показать `DbtProject` и `@dbt_assets` — !!десять строк!!, больше для подключения ничего не нужно.
    - 2.
    - Открыть Asset Graph → dbt-модели видны как отдельные узлы Dagster, а не одним чёрным ящиком.
    - 3.
    - Открыть исходник модели витрины и показать `ref()` → вернуться в граф и показать то же самое ребро: **одна и та же зависимость, записанная один раз**.
    - 4.
    - Кликнуть по узлу dbt-модели → карточка: SQL-код, описание из `schema.yml`, история материализаций.
    - 5.
    - Открыть вкладку проверок этой модели → `not_null` и `unique` из dbt приехали как !!asset checks!!, каждая со своим статусом.
    - 6.
    - Сломать данные в источнике так, чтобы `not_null` упал, материализовать ветку → проверка красная, ветка ниже не поехала, соседние ветки живы.
    - 7.
    - Вернуть данные, показать шов `dbt feature mart → training_dataset` — !!ребро между двумя мирами, а не между двумя расписаниями!!.
    - 8.
    - Выполнить селективный пересчёт вниз по течению от витрины и показать, что dbt и Python-часть отработали одним запуском, в правильном порядке.
    - 9.
    - Показать роль `DagsterDbtTranslator` на готовом коде: имена ассетов, группы, ключи — рассказать, чем он управляет, и не редактировать его.

    **Осторожно:**
    - Не запускать `dbt run` из терминала параллельно: в DuckDB файл заблокируется, и демо встанет.
    - Не показывать полный dbt-граф на сотню моделей — на экране должно быть столько узлов, сколько читается с одного взгляда.
    - Не уходить в объяснение самого dbt: лекция про Dagster, dbt здесь в роли источника графа.

    **Если не работает:**
    - Приложение **A15** — пять слайдов с теми же экранами: подключение одной командой, `@dbt_assets` на Python, сквозной граф, сшивка ключей, тесты как проверки.

    **Takeaway:**
    - !!dbt-граф не оборачивается в задачу — он становится частью одного большого графа, у которого можно спросить «что пересчитать».!!

    **DEMO END**

    **Возврат:**
    - ~~Следующий слайд — «Уровень 3: партиции и версия модели». Продолжаем с того, что сквозной граф уже собран и виден.~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: эталонный скриншот dbt-моделей как ассетов Dagster — с ним сверяется картинка в демо.

    2. https://docs.dagster.io/guides/test/asset-checks
       Что взять: как проверка выглядит на карточке ассета, чтобы зритель узнал экран в демо.

    3. https://docs.getdbt.com/reference/dbt-jinja-functions/ref
       Что взять: формулировку, что `ref()` объявляет зависимость, — она и превращается в ребро графа.

    **Схема:**
    - Шесть узлов в столбик; первые четыре — dbt, последние два — Python.
    - Между четвёртым и пятым узлом — единственное место, где меняется мир; выделить только этот стык.
- kind: content
  id: 027-level-3-particii-i-versiya-modeli
  title: 'Level 3: партиции и вопрос «на каких данных обучена модель»'
  bullets:
  - Ассет режется по измерению — чаще всего по дате
  - Окно партиции передаётся в dbt переменными
  - Обучающая выборка — это диапазон партиций, а не «вся таблица»
  - Отсюда берётся ответ про конкретную версию модели
  code_lang: python
  code: |2
    daily = dg.DailyPartitionsDefinition(
        "2026-01-01",
    )

    @dbt_assets(
        manifest=dbt_project.manifest_path,
        partitions_def=daily,
    )
    def daily_dbt(context, dbt):
        w = context.partition_time_window
        v = f'{{"start":"{w.start}"}}'
        yield from dbt.cli(
            ["build", "--vars", v],
            context=context,
        ).stream()
  notes: |2
    [39:00–40:30 · ~1.5 мин] **Главное:**
    - !!Партиции дают ответ на главный аудиторский вопрос: на каких именно данных обучена вот эта версия модели.!!

    **Рассказ:**
    - Партиция — это разрез ассета по измерению; для данных почти всегда по дате.
    - Dagster хранит статус !!по каждой партиции отдельно!!: видно, какие дни посчитаны, какие пропущены.
    - В dbt окно передаётся переменными, а инкрементальная модель использует их в условии.
    - Дальше главное для MLE: обучающая выборка — это !!окно партиций!!, и это окно записано в графе.
    - Значит, у версии модели есть не только метрика, но и точный перечень данных, на которых она обучалась.

    **Для MLE:**
    - Цепочка, которую стоит произнести вслух: витрина признаков за 2026-08-31 → окно обучающей выборки → версия модели.
    - Это ровно то, что просят на любом аудите и в любом разборе инцидента.

    **Пример:**
    - Модель в проде ведёт себя странно.
    - По графу видно: в окне обучения три дня были пересчитаны позже остальных, после исправления бага в загрузке.

    **Что важно не перепутать:**
    - Партиции в Dagster — **свойство ассета**, а не свойство запуска.
    - Отсюда и берётся возможность спросить «что посчитано за 12 марта» спустя год.

    **Осторожно:**
    - Партиции — не бесплатное улучшение.
    - Они требуют, чтобы dbt-модель действительно была инкрементальной и корректно обрабатывала переданное окно.

    **Takeaway:**
    - !!Версия модели становится проверяемым фактом, а не записью в чате.!!

    **Переход:**
    - ~~«Последний уровень — когда dbt-проектов становится несколько».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/partitions-and-backfills/partitioning-assets
       Что взять: виды партиций и как статус хранится по каждой.

    2. https://docs.dagster.io/examples/full-pipelines/dbt/dbt-assets-incremental
       Что взять: рабочий пример инкрементальной dbt-модели под партициями.

    3. https://docs.dagster.io/guides/build/partitions-and-backfills/defining-dependencies-between-partitioned-assets
       Что взять: как окно суток превращается в окно обучения — сопоставление партиций.

    **Скриншот:**
    - Открыть карточку партиционированного ассета, вкладку с партициями.
    - В кадре — сетка дней со статусами: посчитано, пропущено, в работе.
    - Оставить видимой шкалу дат.
    - Рамкой выделить диапазон, соответствующий окну обучения одной версии модели.
    - Стрелкой связать этот диапазон с карточкой модели, если помещается в кадр.
- kind: content
  id: 028-level-4-multi-dbt
  title: 'Level 4: несколько проектов, code locations и dbt Mesh'
  bullets:
  - Каждый проект — своя кодовая локация, свой деплой, своя команда
  - Графы сшиваются совпадением ключей через источники
  - dbt Mesh решает задачу внутри dbt, Dagster — поверх любых систем
  - Уровень нужен организации, а не технологии
  code_lang: diagram
  code: |2
     code location A    code location B
     ───────────────    ───────────────
     dbt: core          dbt: marketing
     stg → int → mart ─→ source → mart
                                ↓
                        code location C
                        features → model

     ключ ассета — общий язык
     между проектами
  notes: |2
    [40:30–41:42 · ~1.2 мин] **Главное:**
    - !!Несколько dbt-проектов сшиваются теми же ключами ассетов, но требуют явной договорённости о владении.!!

    **Рассказ:**
    - Кодовая локация — независимо деплоящийся набор определений со своим окружением и своим релизным циклом.
    - Каждая команда владеет своей локацией и своим dbt-проектом.
    - Сшивка — тем же механизмом, что и на уровне 2: источник одного проекта получает ключ витрины другого.
    - Про dbt Mesh: он решает ту же задачу !!внутри dbt!! — межпроектные ссылки, версии моделей, контракты.
    - Разница в охвате: Mesh связывает dbt-проекты между собой, Dagster связывает dbt с загрузкой, ML и всем остальным.
    - Это не конкуренты: Mesh описывает контракт, Dagster — исполнение и наблюдаемость.

    **Для MLE:**
    - Если вы один MLE в компании с одним dbt-проектом — этот слайд можно спокойно забыть.
    - Он понадобится, когда команд станет три.

    **Что важно не перепутать:**
    - Разделение на локации — **организационное решение**, а не способ ускорить пайплайн.
    - Технически всё работало бы и в одной локации.

    **Takeaway:**
    - !!Границы кодовых локаций должны совпадать с границами команд, а не с границами схем в складе.!!

    **Переход:**
    - ~~«Блок dbt закрыт. Дальше — ML lifecycle целиком».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/projects/workspaces
       Что взять: определение кодовой локации и как их объединяет рабочее пространство.

    2. https://docs.getdbt.com/best-practices/how-we-mesh/mesh-1-intro
       Что взять: постановку задачи dbt Mesh — чтобы сравнение было корректным.

    3. https://docs.getdbt.com/docs/collaborate/govern/about-model-governance
       Что взять: контракты и версии моделей — то, чего Dagster не делает.

    **Схема:**
    - Три прямоугольника-локации, у каждого своя рамка и подпись команды-владельца.
    - Рёбра между локациями рисовать пунктиром и подписывать «общий ключ ассета».
    - Не изображать одну локацию главной: они равноправны.
# ── PART 4 · ML lifecycle ────────────────────────────────────────────────────────────────
- kind: section
  id: 029-ml-lifecycle-kak-asset-graph
  title: ML lifecycle как asset graph
  notes: |2
    [41:42–42:00 · ~0.3 мин] **Рассказ:**
    - Третий центральный блок и самый длинный: весь жизненный цикл модели как продолжение того же графа.
- kind: content
  id: 030-polnyj-lifecycle
  title: Полный жизненный цикл в одном графе
  bullets:
  - От загрузки до мониторинга — одна непрерывная цепочка
  - Мониторинг замыкает круг и запускает переобучение
  - Каждый узел здесь — объект, который должен существовать
  - Не каждый прямоугольник вычисляется внутри процесса Dagster
  code_lang: diagram
  code: |2
     data ingestion
        ↓
     dbt transformations
        ↓
     feature engineering
        ↓
     training dataset
        ↓
     training  →  evaluation
                     ↓
                model registry
                     ↓
                 deployment
                     ↓
       batch / online inference
                     ↓
                monitoring
                     ↓
          retraining trigger ──┐
     ↑─────────────────────────┘
  notes: |2
    [42:00–43:42 · ~1.7 мин] **Главное:**
    - !!Весь ML lifecycle описывается одним графом ассетов и замыкается в цикл через мониторинг.!!

    **Рассказ:**
    - Пройти цепочку сверху вниз, называя каждый узел одним словом; не углубляться, детали будут дальше.
    - Обратить внимание на нижнюю стрелку: !!мониторинг возвращает нас к обучению!!, и это то, что отличает ML-пайплайн от ETL.
    - Сказать, что схема выглядит одинаково почти в любой компании — меняются только инструменты в прямоугольниках.
    - Сразу сделать честную оговорку, которая будет темой следующего слайда: !!не каждый прямоугольник обязан вычисляться внутри процесса Dagster!!.

    **Для MLE:**
    - Ценность цикла в том, что он описан целиком.
    - Обычно первая половина живёт в оркестраторе, вторая — в отдельных скриптах и головах, и стык «мониторинг → переобучение» не автоматизирован вообще.

    **Что важно не перепутать:**
    - «Deployment» на этой схеме — **узел графа, а не сервинг**.
    - Dagster может инициировать выкладку и зафиксировать её факт, но держать онлайн-эндпоинт — не его работа.

    **Осторожно:**
    - Не обещать, что вся схема внедряется сразу.
    - На практике её проходят снизу вверх кусками, и это нормально.

    **Takeaway:**
    - !!ML lifecycle — это цикл, и он целиком выразим как граф артефактов.!!

    **Переход:**
    - ~~«Теперь главная развилка: где здесь ассет, а где просто работа».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/ml
       Что взять: официальную реализацию верхней половины цикла на ассетах.

    2. https://docs.dagster.io/examples/full-pipelines/ml/evaluation-deployment
       Что взять: как оценка и выкладка выражены ассетами.

    3. https://mlflow.org/docs/latest/ml/model-registry/
       Что взять: границу реестра моделей — где заканчивается Dagster и начинается MLflow.

    **Схема:**
    - Один вертикальный поток с обратной стрелкой снизу вверх, замыкающей цикл.
    - Обратную стрелку сделать визуально самой заметной: она и есть содержание слайда.
    - Не рисовать Dagster прямоугольником в цепочке — подписать всю схему как один asset graph.
- kind: table
  id: 031-chto-asset-a-chto-ispolnenie
  title: Что здесь ассет, а что — исполнение
  table:
    headers: ['Ассет — то, что остаётся', 'Исполнение — то, что происходит']
    rows:
    - ['Таблица в хранилище', 'Обучение на GPU']
    - ['Витрина признаков', 'Kubernetes Job']
    - ['Обучающая выборка', 'Spark-джоба']
    - ['Файл модели', 'Распределённое обучение']
    - ['Отчёт об оценке', 'Операция деплоя']
    - ['Версия в реестре моделей', 'Отправка уведомления']
    - ['Набор батч-предсказаний', 'Прогрев кэша, миграция']
    - ['Отчёт мониторинга', 'Любая операция без артефакта на выходе']
    col_ratios: [5, 5]
  notes: |2
    [43:42–45:24 · ~1.7 мин] **Главное:**
    - !!Граница простая: остался ли после шага объект, о котором осмысленно спросить «он свежий?».!!

    **Рассказ:**
    - Дать критерий до чтения таблицы: если после шага !!остался объект!!, у которого есть версия и свежесть — это ассет.
    - Если осталось только событие «мы это сделали» — это исполнение.
    - Пройти по левому столбцу: у каждой строки можно спросить «а какой он сейчас?».
    - Пройти по правому: у обучения на GPU нельзя спросить «оно свежее?» — свежей может быть только модель, которая из него получилась.
    - Сформулировать общий вывод: **Dagster — про lifecycle, а не про исполнение**.

    **Для MLE:**
    - Практический вопрос из зала: «а обучение — это ассет?».
    - Ответ: ассет — это !!обученная модель!!; обучение — способ её получить, и оно может физически идти где угодно.
    - Разделение колонок — это разделение слов «что» и «как»: слева — что существует, из чего получено, когда пересчитать, что проверить, какая версия; справа — как вычислить, где выполнить, на каком железе, где хранить, как масштабировать.

    **Пример:**
    - Отправка письма об окончании обучения — не ассет.
    - А вот отчёт мониторинга, который лежит и который можно сравнить со вчерашним, — ассет.

    **Что важно не перепутать:**
    - Правый столбец **не «вне Dagster»**.
    - Dagster запускает и наблюдает эти операции; просто они не становятся узлами графа данных.

    **Takeaway:**
    - !!Dagster — lifecycle/control plane; исполнение остаётся специализированным системам.!!

    **Переход:**
    - ~~«Разложим ML-часть на четыре шага из программы курса».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/ops
       Что взять: определение операции — правый столбец в терминах Dagster.

    2. https://docs.dagster.io/integrations/external-pipelines
       Что взять: механизм, которым правый столбец запускается снаружи.

    3. https://docs.dagster.io/guides/build/assets/external-assets
       Что взять: пограничный случай — объект есть, а считает его не Dagster.

    **Схема:**
    - Две колонки; над левой — иконка «объект, который лежит», над правой — «действие, которое произошло».
    - Между колонками вертикальная линия с подписью-критерием: «осталось ли что-то, у чего есть свежесть».
    - Не подписывать правую колонку как «не поддерживается»: она поддерживается, просто иначе.
- kind: content
  id: 032-zagruzka-preprocessing-obuchenie-validaciya
  title: 'Загрузка → Препроцессинг → Обучение → Валидация'
  bullets:
  - Описание шагов как цепочки зависимых ресурсов
  - Зависимости описаны сигнатурами, порядок вытекает из них
  - Каждый шаг оставляет объект, который можно пересчитать отдельно
  - Валидация зависит и от модели, и от данных — граф это выражает
  code_lang: python
  code: |2
    @dg.asset
    def zagruzka(feature_mart):   # из dbt
        return feature_mart

    @dg.asset
    def preprocessing(zagruzka):
        return impute_and_scale(zagruzka)

    @dg.asset
    def obuchenie(preprocessing):
        return fit(preprocessing)

    @dg.asset
    def validaciya(obuchenie, preprocessing):
        return dg.MaterializeResult(
            metadata=evaluate(
                obuchenie, preprocessing,
            ),
        )
  notes: |2
    [45:24–47:12 · ~1.8 мин] **Главное:**
    - !!Четыре шага ML-пайплайна описываются как цепочка зависимых ресурсов, и порядок вытекает из зависимостей.!!

    **Рассказ:**
    - Прочитать код сверху вниз, называя шаги словами из программы курса: загрузка, препроцессинг, обучение, валидация.
    - Первый шаг цепляется за витрину из dbt — это тот самый стык, о котором говорили в блоке dbt.
    - Обратить внимание на последний ассет: у него !!два входа!! — модель и препроцессинг.
    - Так и должно быть: валидация нуждается и в модели, и в подготовленных данных, и граф это честно выражает.
    - Подчеркнуть, что нигде не написано «выполнить в таком порядке»: порядок вычислен.

    **Для MLE:**
    - Каждый шаг — отдельный объект, значит каждый можно !!пересчитать отдельно!!.
    - Поменяли только препроцессинг — обучение и валидация устарели, загрузка нет.
    - Это ровно то, что мы видели на Quick Start, только на реальном пайплайне.

    **Пример:**
    - Имена ассетов здесь намеренно даны транслитом, чтобы совпадать с формулировкой из программы.
    - В своём проекте называйте их так, как принято у вас, — механика от этого не меняется.

    **Что важно не перепутать:**
    - Разбиение на четыре шага — **не догма**.
    - Слишком мелкое дробление даёт граф, в котором ничего не видно; слишком крупное лишает частичного пересчёта.
    - Ориентир: узел — это то, что имеет смысл пересчитывать отдельно.

    **Takeaway:**
    - !!Цепочка зависимых ресурсов — это буквально четыре функции с правильными аргументами.!!

    **Переход:**
    - ~~«Теперь то же самое, но целиком и с ветвлением».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/ml/model-training
       Что взять: официальный аналог шагов обучения и валидации.

    2. https://docs.dagster.io/guides/build/assets/defining-assets-with-asset-dependencies
       Что взять: случай с двумя входами — как у валидации на слайде.

    3. https://docs.dagster.io/guides/build/assets/modeling-etl-pipelines
       Что взять: рекомендации по гранулярности — ответ на вопрос «сколько шагов делать».

    **Скриншот:**
    - Открыть Asset Graph с этими четырьмя узлами.
    - Кадр должен показать, что в валидацию входят две стрелки, а не одна.
    - Свернуть всё остальное, оставить только эту подсеть.
    - Стрелкой выделить второй вход валидации и подписать «валидация зависит и от данных тоже».
- kind: content
  id: 033-prakticheskij-ml-pajplajn
  title: Практический ML-пайплайн целиком
  bullets:
  - Слева граф начинается витриной dbt, справа заканчивается реестром
  - Ветвление на оценке — валидационная выборка приходит сбоку
  - Регистрация модели — такой же узел, как всё остальное
  - Это тот граф, который вы будете собирать в домашнем задании
  code_lang: diagram
  code: |2
     dbt_feature_mart
           ↓
     training_dataset
           ↓
      preprocessing
           ↓
      trained_model
           ├──────────┐
           ↓          ↓
      evaluation ← validation_dataset
           ↓
     registered_model
  notes: |2
    [47:12–48:54 · ~1.7 мин] **Главное:**
    - !!Реальный ML-граф — это семь узлов и одно ветвление; ничего экзотического в нём нет.!!

    **Рассказ:**
    - Провести по схеме слева направо и сверху вниз.
    - Начало — витрина dbt, то есть чужая территория, к которой мы просто подключаемся.
    - Ветвление: оценка получает и модель, и !!отдельную валидационную выборку!!.
    - Это важная деталь: валидационная выборка — самостоятельный ассет, а не переменная внутри функции обучения.
    - Финал — регистрация модели: узел, у которого есть версия и метаданные.
    - Сказать, что этот граф почти совпадает с тем, что требуется в домашнем задании.

    **Для MLE:**
    - Выделение `validation_dataset` в отдельный ассет — не педантизм.
    - Оно даёт возможность !!переоценить старую модель на новой валидации!! без переобучения, что на практике нужно постоянно.

    **Пример:**
    - Пришли данные за новый месяц.
    - Пересчитали только `validation_dataset` и `evaluation` — узнали, деградировала ли модель, не потратив ни минуты GPU.

    **Что важно не перепутать:**
    - `registered_model` — **узел, отражающий факт регистрации**, а не копия модели внутри Dagster.
    - Сама модель лежит в реестре; в графе живёт ссылка и версия.

    **Takeaway:**
    - !!Оценку стоит отделять от обучения — тогда её можно повторять дёшево.!!

    **Переход:**
    - ~~«А теперь самое практичное: что именно пересчитывается при разных изменениях».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/examples/full-pipelines/ml/evaluation-deployment
       Что взять: как официальный пример разделяет оценку и выкладку.

    2. https://docs.dagster.io/guides/build/assets/defining-assets-with-asset-dependencies
       Что взять: механику ветвления с двумя входами.

    3. https://mlflow.org/docs/latest/ml/model-registry/
       Что взять: что именно означает «зарегистрированная версия модели».

    **Схема:**
    - Вертикальный поток с одним боковым входом справа на уровне оценки.
    - Валидационную выборку рисовать сбоку, а не в основной цепочке, — она приходит из другой ветки.
    - Подписать первый узел как «территория dbt», остальные — как «территория ML».
    - Не добавлять на схему MLflow: он появится через два слайда.
- kind: content
  id: 034-chto-pereschitat-tri-izmeneniya
  title: 'Что пересчитывать: три типа изменений'
  bullets:
  - Поменялся препроцессинг — устаревает он и всё ниже
  - Поменялись гиперпараметры — устаревает модель и оценка
  - Поменялась dbt-модель — устаревает вся ML-ветка ниже стыка
  - Граф отвечает на это сам, вручную ничего перечислять не надо
  code_lang: diagram
  code: |2
     ИЗМЕНЕНИЕ            ЧТО УСТАРЕЛО
     ──────────────────   ──────────────
     preprocessing        preprocessing+
     код шага               model, eval

     гиперпараметры       trained_model+
     обучения               eval, registry

     dbt feature mart     всё ниже стыка
     схема или данные       dataset → …

     dbt-тест упал        ветка стоит,
                          вниз не идёт
  notes: |2
    [48:54–50:30 · ~1.6 мин] **Главное:**
    - !!Три типовых изменения дают три разных зоны пересчёта, и определяет их граф, а не человек.!!

    **Рассказ:**
    - Разобрать по строкам, каждый раз показывая пальцем на предыдущей схеме, докуда доходит волна.
    - Первый случай: правка препроцессинга — устаревает он сам и всё ниже; витрина и обучающая выборка не трогаются.
    - Второй: поменяли гиперпараметры — устарела модель и всё, что от неё зависит; данные целы.
    - Третий: изменилась dbt-модель — волна проходит через стык и накрывает !!всю ML-ветку!!.
    - Четвёртый случай особый: упал dbt-тест — вниз ничего не идёт вообще, ветка стоит.
    - Сформулировать вывод: это и есть практический смысл единого графа — !!зона поражения вычисляется, а не угадывается!!.

    **Для MLE:**
    - Именно этот слайд стоит показать руководителю, если нужно обосновать внедрение.
    - Экономия времени GPU здесь измерима.

    **Пример:**
    - Ночной полный пересчёт стоил три часа.
    - После разметки графа типичная правка задевает два узла из семи и укладывается в двадцать минут.

    **Что важно не перепутать:**
    - Dagster определяет, что ассет **устарел**, а не что он «неправильный».
    - Решение о пересчёте по-прежнему принимает человек — либо правило автоматизации, которое человек написал.

    **Осторожно:**
    - Не обещать, что система отличит косметическую правку кода от смысловой.
    - Изменение версии кода — это факт, а не суждение.

    **Takeaway:**
    - !!Зона пересчёта — производная графа, а не решение дежурного.!!

    **Переход:**
    - ~~«Чтобы всё это работало и локально, и в проде, нужны ресурсы».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/asset-versioning-and-caching
       Что взять: как именно вычисляется устаревание — по версии кода и по данным.

    2. https://docs.dagster.io/guides/build/assets/asset-selection-syntax/examples
       Что взять: выражения выборки, которыми зоны из таблицы запускаются на пересчёт.

    3. https://docs.dagster.io/guides/automate/declarative-automation
       Что взять: как те же зоны превращаются в автоматические запуски.

    **Схема:**
    - Три копии одного и того же графа в ряд; в каждой подсвечена своя зона поражения.
    - Подписи над копиями: «правка кода шага», «правка гиперпараметров», «правка витрины».
    - Использовать один цвет подсветки во всех трёх — сравнивать надо площадь, а не оттенок.
- kind: content
  id: 035-resursy-odin-kod-raznye-kontury
  title: 'Ресурсы: один код, разные контуры'
  bullets:
  - Внешний мир приходит в ассет параметром, а не импортом
  - Хранилище, склад, реестр моделей — всё это ресурсы
  - Контур выбирается при сборке Definitions, код не меняется
  - Секреты приходят из окружения, а не лежат в репозитории
  materials:
  - label: Dagster — Resources
    url: https://docs.dagster.io/guides/build/external-resources
  code_lang: python
  code: |2
    class Warehouse(dg.ConfigurableResource):
        dsn: str

        def read(self, table): ...

    @dg.asset
    def zagruzka(warehouse: Warehouse):
        return warehouse.read("mart_features")

    defs = dg.Definitions(
        assets=[zagruzka],
        resources={
            "warehouse": Warehouse(
                dsn=dg.EnvVar("DSN"),
            ),
        },
    )
  notes: |2
    [50:30–52:00 · ~1.5 мин] **Главное:**
    - !!Ресурс — это внедрение зависимости: внешний мир приходит в ассет параметром, и его можно подменить.!!

    **Рассказ:**
    - Показать, что ассет !!не импортирует!! соединение с базой и не создаёт его сам.
    - Он объявляет, что ему нужен объект типа `Warehouse`, и получает его снаружи.
    - Конкретный экземпляр собирается в `Definitions` — это единственное место, где знают про адреса и пароли.
    - `EnvVar` откладывает чтение секрета до момента использования: значение не попадает ни в снимок определений, ни в логи.
    - Отсюда прямое следствие: dev, staging и prod отличаются !!только сборкой Definitions!!, а код ассетов один и тот же.

    **Для MLE:**
    - Это то, что делает пайплайн переносимым между ноутбуком и продом без ветвлений `if env == "prod"` внутри кода.

    **Что важно не перепутать:**
    - Ресурс — это **не глобальная переменная и не синглтон**.
    - У каждого запуска свои экземпляры, и именно поэтому их легко подменить в тесте.

    **Осторожно:**
    - Не класть в ресурс бизнес-логику.
    - Его дело — доступ к внешней системе; как только внутрь заезжает трансформация, тестируемость теряется.

    **Takeaway:**
    - !!Код ассета не должен знать, в каком он контуре.!!

    **Переход:**
    - ~~«Когда таких ассетов становится десять, помогает фабрика».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/external-resources
       Что взять: определение ресурса и способ его объявления.

    2. https://docs.dagster.io/guides/operate/configuration/using-environment-variables-and-secrets
       Что взять: правильную работу с секретами через `EnvVar`.

    3. https://docs.dagster.io/guides/build/external-resources/configuring-resources
       Что взять: как одна и та же конфигурация раскладывается на разные контуры.

    **Схема:**
    - Один блок кода посередине, от него две стрелки вниз к двум разным `Definitions`: dev и prod.
    - Подписать, что различаются только правые блоки, а левый общий.
    - Не рисовать `if` и ветвлений внутри кода — это антипаттерн, который слайд как раз убирает.
- kind: content
  id: 036-fabriki-resursov-i-assetov
  title: Фабрики ресурсов и ассетов
  bullets:
  - Функция, которая возвращает ресурс или ассет по параметрам
  - Десять похожих моделей — один код и список конфигураций
  - Правка логики применяется ко всем сразу, а не копипастой
  - Конфигурация может приходить из YAML, а не из Python
  materials:
  - label: Dagster — Asset factories
    url: https://docs.dagster.io/guides/build/assets/creating-asset-factories
  code_lang: python
  code: |2
    def make_model_asset(name, target, params):

        @dg.asset(name=f"model_{name}")
        def _asset(preprocessing):
            return fit(
                preprocessing,
                target=target, **params,
            )

        return _asset

    model_assets = [
        make_model_asset(n, t, p)
        for n, t, p in MODEL_SPECS
    ]
  notes: |2
    [52:00–53:18 · ~1.3 мин] **Главное:**
    - !!Фабрика — обычная функция, возвращающая ассет; она убирает копипасту и делает граф данными, а не текстом.!!

    **Рассказ:**
    - Разобрать код: внешняя функция принимает параметры, внутренняя — это сам ассет, декоратор навешивается динамически.
    - Имя задаётся явно через `name=`, иначе все ассеты назывались бы `_asset`.
    - Список `MODEL_SPECS` — источник правды о том, сколько моделей у нас есть.
    - Ключевая мысль: !!граф теперь описывается данными!!, и добавление одиннадцатой модели — это строка в списке, а не копия файла.

    **Для MLE:**
    - Типичный случай: одна и та же архитектура обучается на десять регионов или на пять горизонтов прогноза.
    - Без фабрики это десять почти одинаковых файлов, которые расходятся через месяц.

    **Пример:**
    - Понадобилось добавить логирование метрики во все модели.
    - С фабрикой — одна правка в теле `_asset`; без неё — десять правок и один забытый файл.

    **Что важно не перепутать:**
    - Фабрика — **это не динамический граф во время выполнения**.
    - Ассеты создаются при загрузке определений; на момент запуска граф уже статичен и полностью известен.

    **Осторожно:**
    - Не увлекаться: фабрика, которая генерирует ассеты по результатам запроса в базу, делает граф непредсказуемым и трудно отлаживаемым.

    **Takeaway:**
    - !!Изоляция кода начинается с того, что похожие ассеты порождаются, а не копируются.!!

    **Переход:**
    - ~~«И главное следствие ресурсов и фабрик — всё это тестируется на ноутбуке».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/creating-asset-factories
       Что взять: канонический вид фабрики — почти совпадает со слайдом.

    2. https://docs.dagster.io/guides/build/assets/defining-dependencies-with-asset-factories
       Что взять: как связывать порождённые ассеты между собой.

    3. https://docs.dagster.io/guides/build/components/building-pipelines-with-components/using-template-variables
       Что взять: декларативный вариант той же идеи — конфигурация в YAML.

    **Схема:**
    - Слева — список конфигураций (строки таблицы), справа — сгенерированный веер одинаковых узлов графа.
    - Между ними — прямоугольник «фабрика».
    - Подписать: «добавить модель — добавить строку слева».
- kind: content
  id: 037-lokalnoe-testirovanie
  title: Локальное тестирование без развёртывания инфраструктуры
  bullets:
  - Ассет — обычная функция, её можно вызвать напрямую
  - Граф из нескольких ассетов прогоняется в памяти
  - Ресурсы подменяются заглушками, склад и кластер не нужны
  - 'Изоляция кода: использование фабрик ресурсов — локальное тестирование пайплайнов без развертывания инфраструктуры'
  materials:
  - label: Dagster — Unit testing
    url: https://docs.dagster.io/guides/test/unit-testing-assets-and-ops
  code_lang: python
  code: |2
    def test_obuchenie_na_pustyh():
        assert obuchenie(pd.DataFrame(...))

    def test_cepochka_celikom():
        r = dg.materialize_to_memory(
            [zagruzka, preprocessing,
             obuchenie],
            resources={
                "warehouse": FakeWarehouse(),
            },
        )
        assert r.success
  notes: |2
    [53:18–54:54 · ~1.6 мин] **Главное:**
    - !!Пайплайн проверяется на ноутбуке за секунды: ни склада, ни кластера, ни поднятого Dagster.!!

    **Рассказ:**
    - Первый тест — самый простой: ассет это функция, её можно вызвать напрямую и проверить результат.
    - Второй интереснее: `materialize_to_memory` прогоняет !!цепочку ассетов!! целиком, не записывая ничего на диск.
    - Ресурсы подменяются заглушкой: вместо настоящего склада — `FakeWarehouse`, который отдаёт три строки.
    - Именно ради этого мы делали ресурсы параметрами, а не импортами.
    - Сказать прямо: это то, чего почти никогда не бывает у оркестраторов задач, где для проверки нужен поднятый контур.

    **Для MLE:**
    - Практический эффект — тесты пайплайна в обычном CI, рядом с тестами модели, за секунды.
    - Ошибка в связке ассетов ловится до деплоя.

    **Пример:**
    - Переименовали колонку в препроцессинге и забыли поправить обучение.
    - Тест цепочки падает локально; без него это выяснилось бы в ночном запуске.

    **Что важно не перепутать:**
    - Такой тест проверяет **логику и связность**, а не качество данных в проде.
    - Качество прода проверяют asset checks — это разные инструменты, и нужны оба.

    **Осторожно:**
    - Заглушка должна быть достаточно честной.
    - `FakeWarehouse`, который всегда отдаёт идеальные данные, пропустит ровно те ошибки, ради которых тест писался.

    **Takeaway:**
    - !!Проверка пайплайна не требует развёртывания инфраструктуры — это следствие ресурсов и фабрик.!!

    **Переход:**
    - ~~«Тесты защищают код. Версионирование защищает данные и модели».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/test/unit-testing-assets-and-ops
       Что взять: оба приёма — прямой вызов и `materialize_to_memory`.

    2. https://docs.dagster.io/guides/build/external-resources/testing-configurable-resources
       Что взять: правильный способ подменять ресурсы в тестах.

    3. https://docs.dagster.io/guides/test
       Что взять: общую карту видов тестирования в Dagster — куда попадает каждый вид.

    **Скриншот:**
    - Терминал с запуском `pytest` по этим двум тестам.
    - В кадре — время выполнения (должно быть меньше секунды) и зелёный результат.
    - Рядом врезкой — фрагмент кода теста с подменой ресурса.
    - Стрелкой связать `FakeWarehouse` в тесте и отсутствие сетевых обращений в выводе.
- kind: content
  id: 038-versionirovanie-dannyh-i-modelej
  title: Версионирование данных и версий моделей
  bullets:
  - Происхождение датасета читается из графа, а не восстанавливается
  - История материализаций отвечает «когда и из чего это получено»
  - Версия кода отличает «изменились данные» от «изменился код»
  - 'Отслеживание происхождения (lineage) датасетов и версий моделей'
  code_lang: diagram
  code: |2
     ВОПРОС                ГДЕ ОТВЕТ
     ─────────────────     ─────────────
     из чего обучена   →   upstream
     когда собрана     →   материализации
     каким кодом       →   версия кода
     какие метрики     →   метаданные
     на каком окне     →   партиции
     что сломается     →   downstream
  notes: |2
    [54:54–56:24 · ~1.5 мин] **Главное:**
    - !!Отслеживание происхождения датасетов и версий моделей — это свойство графа, а не отдельно внедряемый каталог.!!

    **Рассказ:**
    - Прочитать таблицу как список вопросов, которые задают на разборе инцидента.
    - «Из чего обучена» — подъём вверх по графу.
    - «Когда собрана» — история материализаций конкретного ассета.
    - «Каким кодом» — версия кода, которую Dagster фиксирует при материализации; именно она отличает !!изменились данные!! от !!изменился код!!.
    - «Какие метрики» — метаданные, о которых был Quick Start.
    - «На каком окне» — партиции из блока dbt.
    - «Что сломается» — спуск вниз по графу.
    - Сформулировать: все шесть ответов лежат в одном месте и не требуют внешнего каталога данных.

    **Для MLE:**
    - Связка, ради которой это всё: !!версия модели ↔ версия датасета ↔ версия кода!!.
    - Без неё воспроизводимость обучения остаётся обещанием.

    **Пример:**
    - Метрика упала.
    - Смотрим: данные те же, версия кода сменилась вчера — значит виновата правка, а не входные данные.
    - Разбор занимает минуту вместо дня.

    **Что важно не перепутать:**
    - Dagster хранит **факты и ссылки**, а не сами исторические данные.
    - Если склад перезаписал таблицу на месте, вернуть вчерашнюю версию Dagster не сможет — это задача хранилища.

    **Takeaway:**
    - !!Воспроизводимость обучения складывается из трёх версий: данных, кода и модели.!!

    **Переход:**
    - ~~«Дальше — как в тот же граф встраивается качество».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/asset-versioning-and-caching
       Что взять: механику версий кода и данных.

    2. https://docs.dagster.io/guides/build/assets/metadata-and-tags/column-level-lineage
       Что взять: самый убедительный вид происхождения — до колонок.

    3. https://openlineage.io/docs/
       Что взять: отраслевой стандарт lineage, если спросят про обмен с внешним каталогом.

    **Скриншот:**
    - Открыть карточку модели, вкладку материализаций, развернуть одну запись.
    - В кадре: время, версия кода, метаданные и ссылки на upstream.
    - Рядом — свёрнутый вид графа с подсвеченным путём вверх от этой модели.
    - Стрелками связать три элемента: запись материализации, версию кода и путь вверх по графу.
- kind: content
  id: 039-granica-lifecycle-protiv-ispolneniya
  title: 'Итог части: lifecycle против исполнения'
  bullets:
  - Dagster описывает зависимости артефактов и их жизненный цикл
  - Тяжёлую работу делают специализированные системы
  - Граница проходит по вопросу «остался ли объект после шага»
  code_lang: diagram
  code: |2
     DAGSTER            ВСЁ ОСТАЛЬНОЕ
     ───────────────    ───────────────
     что существует     как посчитать
     из чего получено   где выполнить
     когда пересчитать  на чём обучить
     что проверить      где хранить
     какая версия       как масштабировать

     control plane      data / compute
  notes: |2
    [56:24–57:36 · ~1.2 мин] **Главное:**
    - !!Dagster = lifecycle/control plane; всё, что справа, остаётся за специализированными системами.!!

    **Рассказ:**
    - Это та же мысль, что была на шестом слайде, но теперь она подкреплена тремя блоками практики.
    - Прочитать левый столбец как список вопросов, на которые отвечает граф.
    - Прочитать правый как список вопросов, на которые отвечает ваша инфраструктура.
    - Сказать, что путаница между столбцами — источник большинства неудачных внедрений: от оркестратора начинают ждать вычислений или хранения.

    **Для MLE:**
    - Практический критерий выбора: если вам нужен ответ из левого столбца — Dagster уместен.
    - Если только из правого — вам нужен не оркестратор.

    **Takeaway:**
    - !!Слева — «что», справа — «как»; смешивать их дорого.!!

    **Переход:**
    - ~~«Прямое следствие этой границы — почему Dagster не конкурирует с MLflow».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets
       Что взять: левый столбец в терминах документации.

    2. https://docs.dagster.io/integrations/external-pipelines
       Что взять: правый столбец и способ до него дотянуться.

    3. https://docs.dagster.io/guides/build/io-managers
       Что взять: строку «где хранить» — почему это отдельная ответственность.

    **Схема:**
    - Две колонки, разделённые вертикальной линией; над линией подпись «граница ответственности».
    - Внизу — два ярлыка: «control plane» и «data / compute».
    - Не рисовать стрелок между колонками: слайд про разделение, а не про взаимодействие.
# ── PART 5 · MLflow и паттерны переобучения ──────────────────────────────────────────────
- kind: section
  id: 040-dagster-i-mlflow
  title: 'Dagster + MLflow: оркестрация встречает трекинг'
  notes: |2
    [57:36–57:54 · ~0.3 мин] **Рассказ:**
    - Четыре слайда про то, почему это не конкуренты, и как они склеиваются одной ссылкой.
- kind: table
  id: 041-razdelenie-otvetstvennosti
  title: Разделение ответственности
  table:
    headers: ['Dagster отвечает за', 'MLflow отвечает за']
    rows:
    - ['Жизненный цикл артефактов', 'Эксперименты']
    - ['Зависимости между ними', 'Запуски и их параметры']
    - ['Расписания и события', 'Метрики запуска']
    - ['Партиции и бэкфиллы', 'Артефакты запуска']
    - ['Ретраи и обработку отказов', 'Реестр моделей и стадии']
    - ['Происхождение и версии кода', 'Сравнение прогонов между собой']
    - ['Материализации и их метаданные', 'Историю одного эксперимента']
    col_ratios: [5, 5]
  notes: |2
    [57:54–59:12 · ~1.3 мин] **Главное:**
    - !!Dagster не заменяет MLflow: один отвечает за граф артефактов, другой — за историю экспериментов.!!

    **Рассказ:**
    - Прочитать колонки как ответы на два разных вопроса.
    - Левая отвечает на «что существует, из чего получено и когда пересчитать».
    - Правая — на «какой прогон дал какую метрику при каких параметрах и где лежит его артефакт».
    - Показать, что пересечение есть ровно одно: обе системы что-то знают про метрики.
    - Но знают по-разному: Dagster видит !!метрику как метаданные материализации!!, MLflow — как измерение внутри эксперимента, сравнимое с сотней других прогонов.

    **Для MLE:**
    - Практический критерий: перебор гиперпараметров, сравнение сотни прогонов, выбор лучшего — это MLflow.
    - Ответ «на каких данных обучена продовая версия» — это Dagster.

    **Что важно не перепутать:**
    - Реестр моделей — **не в Dagster**.
    - Dagster может инициировать регистрацию и хранить ссылку на версию, но стадии, аннотации и переходы живут в реестре.

    **Осторожно:**
    - Не пытаться выразить эксперименты ассетами.
    - Ассет — это то, что должно существовать в одном экземпляре; сто прогонов перебора — это не сто ассетов.

    **Takeaway:**
    - !!Дублировать функциональность не надо — надо склеить две системы одной ссылкой.!!

    **Переход:**
    - ~~«Как именно склеить — показываю вживую: одна ссылка в метаданных, и два мира сходятся».~~

    **Визуальные опоры:**

    1. https://mlflow.org/docs/latest/ml/tracking/
       Что взять: терминологию трекинга — эксперимент, прогон, параметры, метрики.

    2. https://mlflow.org/docs/latest/ml/model-registry/
       Что взять: что именно реестр умеет и чего Dagster не делает.

    3. https://docs.dagster.io/guides/build/assets/metadata-and-tags
       Что взять: левую колонку — метаданные материализации как ответ Dagster.

    **Схема:**
    - Два круга Эйлера с очень маленьким пересечением, подписанным «метрики».
    - В пересечении — стрелка-ссылка, а не общая функциональность.
    - Не изображать одну систему поверх другой: они соседи, а не слои.
- kind: content
  id: 042-demo-3-mlflow
  title: 'DEMO 3 · Lifecycle до реестра: Dagster и MLflow в одном графе'
  bullets:
  - Граф продолжается вправо — оценка и регистрация тоже ассеты
  - Метаданные материализации несут ссылку в MLflow, а не копию метрик
  - Меняем гиперпараметр — и видим, какая часть lifecycle устарела
  - Пересчитываем только её; витрина и данные не трогаются
  materials:
  - label: MLflow — Model Registry
    url: https://mlflow.org/docs/latest/ml/model-registry/
  code_lang: diagram
  code: |2
     НА ЭКРАНЕ
     ──────────────────────────
     dbt feature mart
          ↓
     training_dataset
          ↓
     trained_model
          ↓
     evaluation
          ↓
     registered_model
  notes: |2
    [59:12–65:42 · ~6.5 мин] **DEMO START**

    **Состояние до демо:**
    - Тот же граф, что в демо 2, продолжен вправо: `evaluation` и `registered_model`.
    - MLflow поднят !!локально, с файловым хранилищем!!; вкладка с его интерфейсом открыта заранее.
    - Обучение в демо-проекте занимает !!секунды!! — маленькая выборка, простая модель; долгого обучения на записи быть не должно.
    - Один прогон уже сделан вчерашней датой: нужна история, чтобы было с чем сравнивать.
    - Гиперпараметр вынесен в одну строку конфигурации — менять его на камеру ровно одним движением.

    **Действия и ожидаемый результат:**
    - 1.
    - Запустить ветку обучения от `training_dataset` вниз → три узла зеленеют, обучение занимает секунды.
    - 2.
    - Открыть карточку `trained_model` → метаданные материализации: `mlflow_run_id`, `model_uri`, метрика.
    - 3.
    - Кликнуть по ссылке `model_uri` → открывается !!тот самый run в MLflow!!; показать, что это один и тот же идентификатор.
    - 4.
    - Открыть карточку `registered_model` → `model_version`; сказать, что версией владеет MLflow, а Dagster хранит !!ссылку, а не копию!!.
    - 5.
    - Подняться по графу вверх от модели до dbt-источников — происхождение читается без внешнего каталога.
    - 6.
    - Изменить гиперпараметр в конфигурации → обновить граф: устарели `trained_model`, `evaluation`, `registered_model`, а витрина и `training_dataset` !!остались свежими!!.
    - 7.
    - Запустить пересчёт устаревшего → три узла, не шесть; в MLflow появился новый run рядом со старым.
    - 8.
    - Сравнить два run по метрике в MLflow и вернуться в Dagster — сказать, что вопрос «на каких данных обучена эта версия» теперь решается кликом вверх по графу.

    **Осторожно:**
    - Не открывать вкладки MLflow с чужими экспериментами — на экране должно быть ровно два run.
    - Не переобучать «по-настоящему»: если обучение занимает больше десяти секунд, демо разваливается.
    - Не обещать автоматической выкатки — промоушен разбирается отдельным паттерном дальше по лекции.

    **Если не работает:**
    - Приложение **A16** — MLflow в метаданных ассета, разделение ответственности и вопрос «какая версия на каких данных».

    **Takeaway:**
    - !!Изменение upstream или кода само определяет область lifecycle, которую действительно надо пересчитать.!!

    **DEMO END**

    **Возврат:**
    - ~~Следующий слайд — раздел «Четыре паттерна переобучения». Продолжаем с того, что пересчёт мы пока запускали руками.~~

    **Визуальные опоры:**

    1. https://mlflow.org/docs/latest/ml/model-registry/
       Что взять: экран версии модели в реестре — то, куда ведёт ссылка из метаданных ассета.

    2. https://docs.dagster.io/guides/build/assets/metadata-and-tags
       Что взять: как метаданные материализации отображаются на карточке ассета и в истории.

    3. https://docs.dagster.io/guides/build/assets/asset-selection-syntax/reference
       Что взять: выборку вниз по течению от изменённого узла — механика седьмого шага демо.

    **Схема:**
    - Пять узлов в столбик; правые три подсвечены как «то, что устареет от смены гиперпараметра».
    - Слева от нижних узлов — маленькая отсылка к MLflow, показывающая, что версия живёт снаружи.
- kind: section
  id: 043-patterny-pereobucheniya
  title: Четыре паттерна переобучения
  notes: |2
    [65:42–66:00 · ~0.3 мин] **Рассказ:**
    - Cron — только первый из четырёх, и на практике самый редкий в зрелых командах.
- kind: content
  id: 044-pattern-po-vremeni
  title: 'Паттерн 1: переобучение по времени'
  bullets:
  - Раз в неделю или в месяц — независимо от того, что случилось
  - Условие автоматизации ждёт обновления всего, что выше
  - Самый простой паттерн и самый частый старт
  - Риск — обучиться на несвежих данных, если они опоздали
  materials:
  - label: Dagster — Declarative automation
    url: https://docs.dagster.io/guides/automate/declarative-automation
  code_lang: python
  code: |2
    # по cron, но ТОЛЬКО после
    # обновления зависимостей
    obuchenie = dg.AssetSpec(
        "obuchenie",
        automation_condition=dg
            .AutomationCondition
            .on_cron("0 3 * * 1"),
    )

    # классическое расписание
    dg.ScheduleDefinition(
        name="ezhenedelnoe_pereobuchenie",
        target=dg.AssetSelection
                 .assets("obuchenie")
                 .upstream(),
        cron_schedule="0 3 * * 1",
    )
  notes: |2
    [66:00–67:06 · ~1.1 мин] **Главное:**
    - !!`on_cron` отличается от обычного расписания тем, что ждёт свежести зависимостей, а не только времени.!!

    **Рассказ:**
    - Разобрать оба варианта в коде.
    - Нижний — привычное расписание: наступило три часа ночи понедельника — запускай.
    - Верхний — условие автоматизации: наступило три часа ночи !!и!! всё, от чего зависит обучение, обновилось после прошлого раза.
    - Разница появляется ровно в тот день, когда загрузка опоздала на два часа: обычное расписание обучит модель на вчерашних данных, условие подождёт.
    - Сказать, что это самый частый первый паттерн и с него нормально начинать.

    **Для MLE:**
    - Недельный ритм подходит, когда данные меняются медленно, а стоимость обучения высока.
    - Если данные меняются каждый день, время — плохой триггер.

    **Что важно не перепутать:**
    - `on_cron` — **не «запускать почаще»**.
    - Это «не запускать раньше, чем данные готовы»; он скорее откладывает, чем ускоряет.

    **Takeaway:**
    - !!Время как триггер годится, только если зависимости проверяются вместе с ним.!!

    **Переход:**
    - ~~«Второй паттерн: триггером становятся сами данные».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/automate/declarative-automation/customizing-automation-conditions/customizing-on-cron-condition
       Что взять: точную семантику `on_cron` и как её подстраивать.

    2. https://docs.dagster.io/guides/automate/schedules/defining-schedules
       Что взять: классическое расписание для сравнения.

    3. https://docs.dagster.io/guides/automate/declarative-automation/automation-condition-reference
       Что взять: полный перечень условий — пригодится и на следующих слайдах.

    **Схема:**
    - Ось времени с отметками запуска; над ней — два ряда.
    - Верхний ряд: обычное расписание запустилось в срок, но данные ещё не приехали (закрашенный кружок пустой).
    - Нижний ряд: условие подождало и запустилось позже, когда данные готовы.
    - Подписать разницу одной фразой: «одинаковый cron, разный результат».
- kind: content
  id: 045-pattern-po-dannym
  title: 'Паттерн 2: переобучение по данным'
  bullets:
  - Триггером становится появление новой партиции, а не время суток
  - eager протаскивает изменение вниз по графу автоматически
  - Сенсор нужен, когда событие приходит извне Dagster
  - Проверка свежести ловит «данные не приехали» отдельно
  materials:
  - label: Dagster — Sensors
    url: https://docs.dagster.io/guides/automate/sensors
  code_lang: python
  code: |2
    features = dg.AssetSpec(
        "features",
        automation_condition=dg
            .AutomationCondition.eager(),
    )

    @dg.sensor(
        target=dg.AssetSelection
                 .assets("features"),
    )
    def novaya_particiya(context):
        for day in novye_dni(context.cursor):
            yield dg.RunRequest(
                partition_key=day,
            )
  notes: |2
    [67:06–68:12 · ~1.1 мин] **Главное:**
    - !!Данные, а не часы: `eager` протаскивает обновление вниз по графу, сенсор ловит событие снаружи.!!

    **Рассказ:**
    - Два механизма на одном слайде, и они решают разные половины задачи.
    - `eager` работает !!внутри графа!!: как только обновился родитель, потомок помечается к пересчёту и запускается.
    - Сенсор работает !!на границе графа!!: он опрашивает внешний мир — появился файл, пришло сообщение, обновилась таблица — и порождает запросы на запуск.
    - Курсор в сенсоре — способ не обрабатывать одно и то же дважды.
    - Сформулировать правило: если источник события внутри Dagster — берите условие; если снаружи — сенсор.

    **Для MLE:**
    - Для ежедневных признаков это правильный паттерн: обучение стартует, когда сутки досчитались, а не когда пробило три ночи.

    **Что важно не перепутать:**
    - `eager` **не значит «мгновенно и всегда»**.
    - Если родитель обновляется каждые пять минут, eager внизу графа сожжёт вам кластер; для частых источников он не подходит.

    **Осторожно:**
    - Сенсор опрашивает внешний мир с интервалом — это не подписка на событие.
    - Ожидать реакции быстрее интервала не стоит.

    **Takeaway:**
    - !!Триггер по данным точнее триггера по времени, но требует аккуратности с частотой.!!

    **Переход:**
    - ~~«Третий паттерн — самый интересный для ML: реакция на качество».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/automate/declarative-automation/customizing-automation-conditions/customizing-eager-condition
       Что взять: точное поведение `eager` и как его ограничивать.

    2. https://docs.dagster.io/guides/automate/sensors/using-sensors
       Что взять: устройство сенсора и роль курсора.

    3. https://docs.dagster.io/guides/automate/asset-sensors
       Что взять: частный случай — реакция на материализацию другого ассета.

    **Схема:**
    - Слева граф с волной, идущей сверху вниз, — это `eager`.
    - Справа внешний прямоугольник «файл / очередь / таблица» со стрелкой в верхний узел графа — это сенсор.
    - Подписать границу графа пунктиром: сенсор снаружи, условие внутри.
- kind: content
  id: 046-pattern-po-kachestvu
  title: 'Паттерн 3: переобучение по качеству и дрейфу'
  bullets:
  - Мониторинг считает метрику на проде — это тоже ассет
  - Проверка на нём решает, нужно ли переобучение
  - Между обучением и реестром стоит шлюз качества
  - Не прошла — прод не трогаем, старая модель остаётся
  code_lang: diagram
  code: |2
     батч-предсказания
          ↓
     отчёт мониторинга      ← ассет
          ↓
     проверка дрейфа
          ├─ норма  → ничего не делаем
          └─ дрейф  → переобучение
                         ↓
                     оценка
                         ↓
                  порог метрики
                    ├─ не прошла → стоп,
                    │   алерт, прод цел
                    └─ прошла → регистрация
  notes: |2
    [68:12–69:18 · ~1.1 мин] **Главное:**
    - !!Два шлюза в одном паттерне: один решает, надо ли переобучать, второй — можно ли выкатывать.!!

    **Рассказ:**
    - Верхняя половина: отчёт мониторинга — это !!обычный ассет!!, который считается по продовым предсказаниям.
    - На нём стоит проверка: расходится ли распределение признаков или упало ли качество.
    - Дрейф обнаружен — запускается переобучение; не обнаружен — ничего не происходит, и это нормальный исход.
    - Нижняя половина — шлюз качества: между обучением и регистрацией стоит проверка порога.
    - Не прошла — ветка останавливается, !!в проде остаётся старая модель!!, приходит алерт.
    - Подчеркнуть: «ничего не делать» — это правильный и частый результат работы пайплайна.

    **Для MLE:**
    - Это тот паттерн, который отличает зрелый MLOps от «переобучаем по понедельникам на всякий случай».
    - Он экономит и деньги, и риск.

    **Что важно не перепутать:**
    - Дрейф данных **не равен падению качества**.
    - Распределение может уехать без ущерба для метрики, и наоборот; лучше иметь обе проверки.

    **Осторожно:**
    - Порог, зашитый константой, со временем начинает либо блокировать всё, либо не блокировать ничего.
    - Брать его от текущей продовой версии.

    **Takeaway:**
    - !!Автоматическое переобучение без шлюза качества опаснее ручного.!!

    **Переход:**
    - ~~«Четвёртый паттерн — тот, где решение остаётся за человеком».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/test/asset-checks
       Что взять: механику проверки как шлюза, останавливающего ветку.

    2. https://docs.dagster.io/examples/best-practices/asset-health-monitoring
       Что взять: практику мониторинга состояния ассетов.

    3. https://docs.dagster.io/guides/observe/alerts
       Что взять: как из упавшей проверки получается уведомление.

    **Схема:**
    - Вертикальная цепочка с двумя развилками; обе развилки рисовать одинаково, чтобы читалась симметрия.
    - Ветку «ничего не делаем» не делать тупиковой и серой — подписать «нормальный исход».
    - Ветку «прод цел» выделить: это главное свойство паттерна.
- kind: content
  id: 047-pattern-s-podtverzhdeniem
  title: 'Паттерн 4: переобучение с подтверждением человека'
  bullets:
  - Пайплайн доводит модель до кандидата и останавливается
  - Человек сравнивает кандидата с продовой версией и решает
  - Промоушен — отдельный шаг, запускаемый вручную
  - Обязателен там, где цена ошибочной выкатки высока
  code_lang: diagram
  code: |2
     авто до кандидата
     ─────────────────────────
     данные → обучение → оценка
                            ↓
                    candidate_model
                            ↓
                  ┌── ЖДЁМ ЧЕЛОВЕКА ──┐
                  │  сравнение с prod  │
                  │  проверка на срезах│
                  └─────────┬──────────┘
                            ↓
                  promotion (вручную)
                            ↓
                     prod version
  notes: |2
    [69:18–70:18 · ~1 мин] **Главное:**
    - !!Автоматизировать надо подготовку решения, а не само решение.!!

    **Рассказ:**
    - Пайплайн работает автоматически до кандидата: данные, обучение, оценка, отчёт.
    - Дальше он !!намеренно останавливается!!.
    - Человек смотрит сравнение с текущей продовой версией, проверяет качество на важных срезах, учитывает то, чего нет в метрике.
    - Промоушен оформляется отдельным шагом, который запускается вручную — в интерфейсе или через реестр моделей.
    - Сказать, где это обязательно: скоринг, медицина, всё, где ошибочная выкатка стоит дорого и не откатывается мгновенно.

    **Для MLE:**
    - Ценность в том, что человек тратит время !!только на решение!!, а не на подготовку данных для решения.
    - Всё, что можно посчитать, уже посчитано.

    **Что важно не перепутать:**
    - Ручное подтверждение — **не признак незрелости процесса**.
    - Это осознанный выбор границы автоматизации, и в регулируемых областях он обязателен.

    **Takeaway:**
    - !!Граница автоматизации проходит там, где начинается ответственность за последствия.!!

    **Переход:**
    - ~~«Таблица выбора между этими механизмами лежит в приложении, A16. А мы переходим к сравнению с Airflow».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/automate/declarative-automation/migrating-from-sensors
       Что взять: как отделять автоматическую часть графа от запускаемой вручную.

    2. https://mlflow.org/docs/latest/ml/model-registry/
       Что взять: механику стадий и переходов — место, где живёт промоушен.

    3. https://docs.dagster.io/guides/build/jobs/asset-jobs
       Что взять: как оформить ручной шаг отдельной джобой с кнопкой.

    **Схема:**
    - Автоматическая часть — сплошной линией, ручная — пунктиром, между ними явный «стоп-барьер».
    - Внутри барьера перечислить, что именно человек смотрит.
    - Не рисовать человека как узкое место: подписать барьер «решение, а не работа».
- kind: section
  id: 048-airflow-i-dagster
  title: 'Airflow 2.x, Airflow 3.x и Dagster'
  notes: |2
    [70:18–70:36 · ~0.3 мин] **Рассказ:**
    - Восемь слайдов на честное сравнение.
    - Главное предупреждение сразу: Airflow 2 и Airflow 3 — это две разные истории, и мерить их одной меркой нельзя.
- kind: content
  id: 049-odin-pajplajn-tri-interfeysa
  title: Один пайплайн в трёх интерфейсах
  bullets:
  - Один и тот же логический пайплайн, снятый в трёх системах
  - Отличие от Airflow — не в возможностях, а в единице графа
  - Слева и в центре единицей графа остаётся задача
  - Справа единицей графа является объект, который надо получить
  - Живого демо Airflow нет намеренно — инфраструктуры много, пользы мало
  materials:
  - label: Airflow 3 — Assets
    url: https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/assets.html
  - label: 🔍 Скриншоты Airflow 2 / Airflow 3 / Dagster для триптиха
    url: https://www.google.com/search?q=airflow+3+assets+graph+view+screenshot
    highlight: true
  code_lang: diagram
  code: |2
     ОДИН ПАЙПЛАЙН, ТРИ ЭКРАНА
     ──────────────────────────
     AIRFLOW 2      task-centric
     AIRFLOW 3      task + asset
     DAGSTER        asset-centric

     единица графа:
     задача · задача+объект · объект
  notes: |2
    [70:36–71:48 · ~1.2 мин] **Главное:**
    - !!Разница не в возможностях, а в том, что система считает единицей графа.!!

    **Рассказ:**
    - На слайде три скриншота одного и того же логического пайплайна: загрузка, преобразования, обучение, оценка, регистрация.
    - Слева Airflow 2: на экране список задач и их запусков; данные в этой картине — побочный результат.
    - В центре Airflow 3: те же задачи, но рядом появились ассеты, и планирование умеет опираться на них.
    - Справа Dagster: на экране сразу объекты, а задач как отдельной сущности в интерфейсе не видно.
    - Сказать честно: разрыв в понятиях !!сильно сократился!!, и сравнивать надо по тому, что стоит в центре экрана, а не по спискам возможностей.

    **Для MLE:**
    - Практический критерий выбора простой: на какой вопрос вы чаще отвечаете утром — «какая задача упала» или «какой объект несвежий».
    - Первый вопрос лучше обслуживает task-centric интерфейс, второй — asset-centric.

    **Что важно не перепутать:**
    - Три экрана — **не бенчмарк**.
    - Это иллюстрация модели, а не измерение производительности, надёжности или стоимости эксплуатации.

    **Осторожно:**
    - Не делать живое демо Airflow: два поднятых контура ради одного экрана — плохой обмен времени на пользу.
    - Скриншоты обязаны быть с !!одного и того же логического пайплайна!!, иначе сравнение нечестное.

    **Takeaway:**
    - !!Выбирайте не по списку функций, а по тому, что у системы стоит в центре экрана.!!

    **Переход:**
    - ~~«Теперь то же самое по критериям — двумя таблицами».~~

    **Визуальные опоры:**

    1. https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/assets.html
       Что взять: экран ассетов Airflow 3 — центральный кадр триптиха.

    2. https://airflow.apache.org/docs/apache-airflow/2.10.5/ui.html
       Что взять: классический Graph View Airflow 2 — левый кадр триптиха.

    3. https://docs.dagster.io/guides/build/assets
       Что взять: Asset Graph Dagster — правый кадр триптиха.

    **Схема:**
    - Один склеенный кадр 3:1 из трёх скриншотов, снятых в одинаковом масштабе и с одинаковой шириной окна.
    - Под каждым кадром — одна подпись: название системы и единица графа.
    - Не подкрашивать левый кадр в красный и правый в зелёный: слайд сравнивает модели, а не назначает победителя.
    - Пока кадра нет, слайд работает на диаграмме и на подстрочнике; жёлтая ссылка в подвале — напоминание снять его.
