- kind: content
  id: 063-odin-orkestrator-na-granicu-otvetstvennosti
  title: Один оркестратор на границу ответственности
  bullets:
  - Не использовать два оркестратора для одного жизненного цикла
  - У каждого куска графа должен быть единственный владелец
  - 'Связь между ними — событие и статус, а не общий доступ к узлам'
  code_lang: diagram
  code: |2
     ПЛОХО                 ХОРОШО
     ──────────────────    ──────────────
     A и B оба дёргают     A владеет
     одни и те же модели   своим куском
       → гонки             B — своим
       → двойной пересчёт
       → непонятно,        A ─событие→ B
         кто виноват       B ─статус──→ A

                           одна точка
                           правды
  notes: |2
    [80:42–82:06 · ~1.4 мин] **Главное:**
    - !!Один оркестратор на границу ответственности, а не один оркестратор на всё!! — и уж точно не два на один и тот же жизненный цикл.

    **Рассказ:**
    - Показать левую половину: два оркестратора управляют одними и теми же объектами.
    - Перечислить, что из этого выходит: гонки, двойной пересчёт, расхождение расписаний и невозможность понять, чей запуск сломал витрину.
    - Показать правую: у каждого куска один владелец, а взаимодействие сведено к двум вещам — !!послать событие!! и !!вернуть статус!!.
    - Сформулировать проверочный вопрос для любой мультиоркестраторной схемы: !!«кто владелец вот этого конкретного ассета?»!!.
    - Если ответ «оба» — схема неверна.

    **Осторожно:**
    - Мультиоркестраторная архитектура оправдана !!границей!!: другая команда, другая зона ответственности, другой релизный цикл.
    - Она не оправдана вкусом: «эта штука удобнее для расписаний».

    **Переход:**
    - ~~«Сложим всё сказанное в три конкретных стека».~~
