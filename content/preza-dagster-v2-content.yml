    - Таблица — сама по себе визуал.
    - Если нужен акцент, подсветить не колонку, а две строки: «asset-native авторинг» и «партиции».
    - Не окрашивать колонку Dagster в «хороший» цвет: слайд обязан читаться как сравнение, а не как реклама.
