    - Читать правую колонку внимательнее левой — она честнее и полезнее.
    - Первая строка справа — самая частая: работающий Airflow без конкретной боли менять не надо.
    - Третья строка справа — самая недооценённая: если в процессе не остаётся устойчивых артефактов, вся модель ассетов вам просто не пригодится.
    - Четвёртая: если нагрузка — это запуск контейнеров в кластере без семантики данных, вам нужен движок исполнения, а не asset graph.
    - Пятая: пайплайн из трёх шагов раз в неделю прекрасно живёт в CI, и оркестратор здесь — лишняя система.
    - Шестая — про людей: модель ассетов требует изменения способа думать, и если команда его не принимает, инструмент не заработает.

    **Для MLE:**
    - Если вы попадаете в левую колонку по трём строкам из шести — считайте, что аргументов достаточно.
    - Если по одной — скорее всего, вам хватит того, что уже есть.

    **Что важно не перепутать:**
    - Правая колонка — **не список недостатков Dagster**.
    - Это список ситуаций, где его сильные стороны не окупаются.

    **Осторожно:**
    - Не заканчивать блок на левой колонке.
    - Слайд ценен именно правой половиной, и её надо проговорить вслух.

    **Takeaway:**
    - !!Нет данных как объектов с зависимостями — нет причины платить за asset-модель.!!

    **Переход:**
    - ~~«И карта на случай, если вы попали в правую колонку».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets
       Что взять: описание сценариев, где модель ассетов даёт выигрыш, — левая колонка.

    2. https://airflow.apache.org/blog/airflow-three-point-oh-is-here/
       Что взять: аргументы за то, чтобы остаться на Airflow 3, — первая строка справа.

    3. https://argo-workflows.readthedocs.io/en/latest/
       Что взять: четвёртую строку справа — где нужен движок исполнения, а не оркестратор данных.

    **Схема:**
    - Две колонки одинакового веса; не делать левую крупнее или ярче.
    - Над таблицей — один вопрос-критерий крупным шрифтом.
    - Не использовать зелёный и красный: обе колонки одинаково валидны.
- kind: table
  id: 058-nuzhda-instrument
  title: 'Карта: потребность → инструмент'
  table:
    headers: ['Потребность', 'Смотреть в сторону', 'Отношение к Dagster']
    rows:
    - ['Data/ML-ассеты и их жизненный цикл', 'Dagster', '—']
    - ['Большой парк корпоративных процессов', 'Airflow', 'Альтернатива или сосед']
    - ['Динамические Python-процессы', 'Prefect', 'Альтернатива или сосед']
    - ['Кросс-системные событийные процессы', 'Kestra', 'Этажом выше']
    - ['Kubernetes- и GPU-нагрузки', 'Argo', 'Исполнитель под Dagster']
    - ['Каркас ML-проекта', 'Kedro', 'Дополняет']
    - ['Эксперименты и реестр моделей', 'MLflow', 'Дополняет']
    - ['SQL-трансформации', 'dbt', 'Дополняет']
    col_ratios: [4, 3, 3]
  notes: |2
    [81:18–82:36 · ~1.3 мин] **Главное:**
    - !!Половина строк в этой таблице — не конкуренты Dagster, а его соседи или дополнения.!!

    **Рассказ:**
    - Читать по третьей колонке: она и есть содержание слайда.
    - Только две строки помечены как альтернативы, и обе с оговоркой «или сосед».
    - Три строки — прямые дополнения: dbt считает, MLflow помнит, Kedro структурирует.
    - Одна строка — этаж выше, одна — этаж ниже.
    - Сформулировать вывод: вопрос «Dagster или X» корректен гораздо реже, чем кажется.

    **Для MLE:**
    - Эта таблица — готовый ответ на типовое возражение «у нас уже есть MLflow, зачем нам ещё и Dagster».
    - Ответ: MLflow не отвечает на вопрос «что пересчитать».

    **Что важно не перепутать:**
    - «Дополняет» **не значит «обязательно ставить оба»**.
    - Это значит, что они не конкурируют за одну и ту же работу.

    **Takeaway:**
    - !!Правильный вопрос почти всегда «что чем дополнить», а не «что чем заменить».!!

    **Переход:**
    - ~~«И финальная ментальная модель — то, что стоит унести с собой».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: пример строки «дополняет» в официальной формулировке.

    2. https://mlflow.org/docs/latest/ml/tracking/
       Что взять: границу MLflow — вторую строку «дополняет».

    3. https://docs.prefect.io/
       Что взять: строку про динамические процессы со стороны самого Prefect.

    **Схема:**
    - Таблица достаточна.
    - Если нужен акцент — подсветить третью колонку целиком, потому что именно она несёт сообщение.
    - Не рисовать «квадрант» с осями: он навяжет ложное упорядочивание.
- kind: content
  id: 059-itogovaya-mentalnaya-model
  title: Итоговая ментальная модель
  bullets:
  - dbt делает трансформации, ML-фреймворк обучает
  - MLflow помнит эксперименты и версии моделей
  - Kubernetes даёт вычислительные ресурсы
  - Dagster знает, что существует, из чего и когда пересчитать
  code_lang: diagram
  code: |2
     dbt          трансформации
     sklearn/XGB  обучение
     MLflow       эксперименты, реестр
     Kubernetes   вычислительные ресурсы

     D A G S T E R   знает:

         ЧТО существует
         ИЗ ЧЕГО получилось
         КОГДА пересчитать
         ЧТО проверить
  notes: |2
    [82:36–84:00 · ~1.4 мин] **Главное:**
    - !!Dagster интересен MLE не как планировщик, а как единый граф жизненного цикла между данными и ML-артефактами.!!

    **Рассказ:**
    - Прочитать верхний блок: каждая строка — система, которая делает свою работу и делает её хорошо.
    - Ни одну из них Dagster не заменяет — это та же мысль, что была на шестом слайде, и теперь она подкреплена всей лекцией.
    - Прочитать нижний блок медленно, по одному вопросу: !!что существует!!, !!из чего получилось!!, !!когда пересчитать!!, !!что проверить!!.
    - Сказать, что это исчерпывающий список того, за что отвечает оркестратор в этой модели, и он не такой уж длинный.
    - Закончить формулировкой ценности для MLE: расписание можно получить и от cron; !!единый граф между data и ML нельзя получить ниоткуда!!.

    **Для MLE:**
    - Если через месяц вы забудете всю лекцию, кроме этого слайда, — этого достаточно, чтобы принять правильное решение о внедрении.

    **Что важно не перепутать:**
    - Четыре вопроса — **это и весь Dagster**.
    - Всё остальное — сущности, интерфейсы, CLI — существует ради ответов на них.

    **Takeaway:**
    - !!Оркестратор ценен не запуском по расписанию, а знанием о происхождении и устаревании артефактов.!!

    **Переход:**
    - ~~«Осталось два слова про эксплуатацию — и домашнее задание».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets
       Что взять: нижний блок в терминах документации.

    2. https://dagster.io/blog/software-defined-assets
       Что взять: исходную формулировку той же мысли от авторов.

    3. https://docs.dagster.io/guides/build/assets/asset-versioning-and-caching
       Что взять: третий вопрос — как система понимает, что пора пересчитать.

    **Схема:**
    - Верхний блок — четыре строки-системы, нижний — четыре вопроса крупным шрифтом.
    - Вопросы набрать заметно крупнее названий систем: они и есть вывод.
    - Не добавлять стрелок между блоками — это не процесс, а разделение ролей.
# ── PART 10 · Эксплуатация, сжато ────────────────────────────────────────────────────────
- kind: content
  id: 060-ekspluataciya-korotko
  title: Эксплуатация в двух словах
  bullets:
  - 'Разработка: dg dev поднимает всё локально одной командой'
  - 'Прод: веб-сервер, демон, база состояния, кодовые локации отдельно'
  - Кодовая локация — независимо деплоящийся набор определений
  - Подробности — в приложении в конце этой деки
  code_lang: diagram
  code: |2
     DEV                   PROD
     ──────────────────    ──────────────
     dg dev                webserver
     всё в одном             UI и API
       процессе            daemon
     SQLite на диске         расписания,
     код рядом               сенсоры,
                             очередь
                           Postgres
                             состояние
                           code locations

     код ассетов не меняется —
     меняется Definitions
  notes: |2
    [84:00–85:12 · ~1.2 мин] **Главное:**
    - !!Между ноутбуком и продом меняется сборка Definitions, а не код ассетов.!!

    **Рассказ:**
    - Слева то, что вы видели на Quick Start: одна команда, один процесс, SQLite.
    - Справа то, что бывает в проде: веб-сервер отдельно, демон отдельно, состояние в Postgres, код в отдельных сервисах-локациях.
    - Демон — обязательная часть: без него не работают ни расписания, ни сенсоры, ни очередь запусков, ни бэкфиллы.
    - Ключевая мысль внизу: !!код ассетов при этом переезде не меняется!!, потому что внешний мир приходит через ресурсы.
    - Сказать, что подробности — схема развёртывания, docker-compose, Kubernetes, сравнение открытой и облачной версий — лежат в приложении.

    **Для MLE:**
    - Знать это устройство полезно, но самому его поднимать вам, скорее всего, не придётся.
    - Достаточно понимать, почему расписание не сработало: чаще всего не запущен демон.

    **Что важно не перепутать:**
    - `dg dev` — **не «прод в маленьком масштабе»**.
    - Это отдельный режим; для эксплуатации у него нет ни отказоустойчивости, ни изоляции.

    **Takeaway:**
    - !!Переносимость даётся ресурсами: один код, разные Definitions.!!

    **Переход:**
    - ~~«И домашнее задание — оно про ровно то, что мы разбирали».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/deployment/oss/oss-deployment-architecture
       Что взять: правую половину схемы в официальном виде.

    2. https://docs.dagster.io/guides/build/projects/workspaces
       Что взять: понятие кодовой локации и рабочего пространства.

    3. https://docs.dagster.io/deployment/oss/deployment-options/running-dagster-locally
       Что взять: левую половину — что именно делает `dg dev`.

    **Схема:**
    - Две колонки; в левой один блок, в правой — четыре, соединённые с общей базой состояния.
    - Внизу — общая строка про неизменность кода ассетов.
    - Не рисовать переход между колонками стрелкой миграции: это не миграция, а разные конфигурации.
# ── PART 11 · ДЗ и финал ─────────────────────────────────────────────────────────────────
- kind: section
  id: 061-domashnee-zadanie
  title: Домашнее задание
  notes: |2
    [85:12–85:30 · ~0.3 мин] **Рассказ:**
    - Задание ровно про то, что разбирали: подключить существующий dbt-проект и сделать граф связным.
- kind: content
  id: 062-dz-orkestriruem-dbt-proekt
  title: 'ДЗ: оркестрируем dbt-проект в Dagster'
  bullets:
  - 'Датасет прежний: Olist Brazilian E-Commerce в ClickHouse'
  - Обернуть dbt через компонент или @dbt_assets, команда build
  - 'Ресурсы: ClickHouse и dbt, секреты через EnvVar'
  - 'Главное: ингест-ассеты — РОДИТЕЛИ dbt-графа, а не отдельная куча'
  - 'Связка — кастомный DagsterDbtTranslator: те же ключи у источников'
  - Расписание, проверки на сырой слой, сенсор на падение
  - Скриншот графа ассетов и лог успешного запуска — в отчёт
  code_lang: diagram
  code_caption: Каркас проекта — от него можно отталкиваться
  code: |2
    orchestration/
      src/olist_orchestration/
        defs/dbt/defs.yaml  # DbtProject-
                            # Component
        translator.py       # ключи
                            # источников
        defs/raw.py         # 8 ассетов
                            # CSV → raw.*
        resources.py        # ClickHouse
                            # + DbtCli
        checks.py           # сырой слой
        schedules.py        # витрины
        sensors.py          # приход/сбой
    dbt/                    # ваш проект
                            # БЕЗ копий
  notes: |2
    [85:30–87:06 · ~1.6 мин] **Главное:**
    - !!Главный критерий задания — связность графа: ингест-ассеты должны быть настоящими родителями dbt-моделей.!!

    **Рассказ:**
    - Пройти по списку и на каждом пункте назвать слайд, где это разбиралось.
    - Обёртка dbt — блок про уровни 1 и компонент.
    - Ресурсы и секреты — блок про ресурсы.
    - Связность через translator — слайд про сшивку ключей; это самый сложный и самый оцениваемый пункт.
    - Проверки и расписание — блоки про asset checks и автоматизацию.
    - Подчеркнуть требование про !!отсутствие копий dbt-проекта!!: он подключается по пути, а не копируется внутрь.
    - Сказать, что скриншот графа — не формальность: по нему сразу видно, связный граф или нет.

    **Для MLE:**
    - Если успеваете только часть — делайте связность графа, она весит больше остального.

    **Что важно не перепутать:**
    - Ингест-ассеты должны быть **родителями** dbt-моделей, а не просто существовать рядом.
    - Висящие источники — самая частая ошибка в этом задании.

    **Takeaway:**
    - !!Связный граф от CSV до витрины — это и есть задание.!!

    **Переход:**
    - ~~«Критерии — на следующем слайде, они разложены по баллам».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: способ подключения проекта — первый пункт задания.

    2. https://docs.dagster.io/integrations/libraries/dbt/reference
       Что взять: раздел про translator и ключи источников — ключевой пункт.

    3. https://docs.dagster.io/guides/operate/configuration/using-environment-variables-and-secrets
       Что взять: правильную работу с секретами через `EnvVar`.

    **Скриншот:**
    - Показать образец правильного результата: связный граф от загрузочных ассетов до витрин.
    - Рядом — образец неправильного: те же узлы, но источники висят без родителей.
    - Подписать оба «зачёт» и «незачёт по связности».
    - Стрелкой указать на висящий источник в неправильном варианте.
- kind: table
  id: 063-dz-kriterii-ocenki
  title: 'ДЗ: критерии оценки'
  table:
    headers: ['Баллы', 'Что должно быть сделано']
    rows:
    - ['6–7', 'dbt-проект обёрнут ассетами; ресурсы ClickHouse и dbt настроены; секреты через EnvVar; поднимается dg dev, проходит ручная материализация; граф ассетов виден в интерфейсе']
    - ['8–9', 'всё выше + ингест-ассеты как РЕАЛЬНЫЕ РОДИТЕЛИ dbt-графа через кастомный DagsterDbtTranslator (граф связный, без висячих источников) + расписание + минимум две проверки на сырой слой + сенсор на падение + метаданные материализаций']
    - ['10', 'всё выше + сенсор на приход данных (landing-зона или заглушка с задокументированным путём миграции) + валидация определений в CI + один нетривиальный элемент: партиции с выполненным бэкфиллом, запуск в Docker, declarative automation или вторая кодовая локация']
    col_ratios: [2, 9]
  notes: |2
    [87:06–88:36 · ~1.5 мин] **Главное:**
    - !!Разница между «работает» и «связно» — это два балла; разница между «связно» и «продакшен-подобно» — ещё два.!!

    **Рассказ:**
    - Прочитать первую строку: это порог, на котором проект просто запускается и виден.
    - Вторая строка — то, ради чего задание существует: !!связность графа!! и продакшен-элементы вокруг неё.
    - Третья — нетривиальный элемент на выбор; каждый из четырёх вариантов разбирался в лекции.
    - Отдельно предупредить: сенсор на приход данных можно сделать заглушкой, но путь миграции к настоящему источнику должен быть задокументирован.

    **Для MLE:**
    - Если выбирать нетривиальный элемент — партиции с выполненным бэкфиллом дают больше всего понимания на единицу усилий.

    **Что важно не перепутать:**
    - Балл ставится за **связный граф**, а не за количество написанных файлов.
    - Десять ассетов без рёбер оцениваются ниже, чем пять связанных.

    **Takeaway:**
    - !!Читайте вторую строку как основное задание, первую — как порог.!!

    **Переход:**
    - ~~«На этом всё. Вопросы?».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/test/asset-checks
       Что взять: требование про две проверки на сырой слой.

    2. https://docs.dagster.io/guides/build/partitions-and-backfills/backfilling-data
       Что взять: рекомендуемый нетривиальный элемент — партиции и бэкфилл.

    3. https://docs.dagster.io/api/clis/dg-cli/dg-cli-reference
       Что взять: команду проверки определений — пункт про валидацию в CI.

    **Схема:**
    - Три ступени с подписями баллов; каждая ступень включает предыдущую.
    - Выделить вторую ступень как основную цель задания.
    - Не изображать третью как недостижимую.
