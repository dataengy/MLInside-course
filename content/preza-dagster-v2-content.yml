    [66:36–68:00 · ~1.4 мин] **Главное:**
    - Выбор механизма — это выбор !!источника сигнала!!: часы, граф или внешний мир.

    **Рассказ:**
    - Пройти таблицу как решающее дерево, не зачитывая все ячейки.
    - Первая развилка: сигнал приходит по времени или по данным?
    - Если по времени — `ScheduleDefinition` для жёсткого регламента и `on_cron`, если данные могут опаздывать.
    - Если по данным — `eager`, когда сигнал внутри графа, и сенсор, когда сигнал снаружи: файл в бакете, сообщение в очереди, вебхук.
    - Проверка свежести стоит особняком: это не столько запуск, сколько !!договорённость об SLA!!, выраженная в графе.

    **Для MLE:**
    - Практический рецепт для типовой ML-платформы: dbt-часть на `eager`, обучение на `on_cron`, батч-инференс на сенсоре от появления новых данных.

