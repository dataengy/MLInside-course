- kind: content
  id: 931-a16-mlflow-v-metadannyh-asseta
  title: 'MLflow в метаданных ассета: одна ссылка склеивает два мира'
  bullets:
  - Обучение внутри ассета открывает прогон MLflow
  - Идентификатор прогона и ссылка на модель уезжают в метаданные
  - С карточки ассета — прямой переход в эксперимент
  - Регистрация версии тоже фиксируется в метаданных
  materials:
  - label: '🔍 Снять: метаданные с mlflow_run_id и model_uri рядом с тем же run в MLflow'
    url: https://mlflow.org/docs/latest/ml/tracking/
    highlight: true
  - label: MLflow — Tracking
    url: https://mlflow.org/docs/latest/ml/tracking/
  code_lang: python
  code: |2
    @dg.asset
    def obuchenie(preprocessing):
        with mlflow.start_run() as run:
            clf, roc = fit(preprocessing)
            mlflow.log_metric("roc_auc", roc)
            info = mlflow.sklearn.log_model(
                clf, name="model",
            )
            mv = mlflow.register_model(
                info.model_uri, "olist_delay",
            )
        return dg.MaterializeResult(metadata={
            "mlflow_run_id": run.info.run_id,
            "model_uri": info.model_uri,
            "model_version": mv.version,
            "roc_auc": roc,
        })
  notes: |2
    **Главное:**
    - !!Четыре ключа в метаданных материализации связывают граф Dagster и историю MLflow в один навигируемый путь.!!

    **Рассказ:**
    - Разобрать код по блокам: открываем прогон, обучаем, логируем метрику, сохраняем модель, регистрируем версию.
    - Всё это — !!обычный код MLflow!!, никакой специальной интеграции здесь нет и не нужно.
    - Ключевая строка — возврат `MaterializeResult`: идентификатор прогона, ссылка на модель, номер версии и метрика уезжают в метаданные ассета.
    - С этого момента с карточки ассета можно перейти в конкретный прогон, а из прогона — понять, какая материализация его породила.

    **Для MLE:**
    - Отдельно сказать про библиотеку `dagster-mlflow`: она существует и живёт, но написана в старом стиле ресурсов.
    - Прямой вызов `mlflow`, как на слайде, !!проще и честнее!! — вы точно понимаете, что происходит.

    **Что важно не перепутать:**
    - Регистрация модели прямо в ассете обучения годится для учебного примера.
    - В проде между обучением и регистрацией почти всегда стоит **шлюз качества** — про него следующий блок.

    **Осторожно:**
    - Не логировать в метаданные весь объект модели.
    - Метаданные — это ссылки и числа; артефакты живут в MLflow.

    **Takeaway:**
    - !!Интеграция с трекером — это четыре ключа в метаданных, а не отдельная подсистема.!!

    **Переход:**
    - ~~«Ради какого вопроса всё это делалось — на следующем слайде».~~

    **Визуальные опоры:**

    1. https://mlflow.org/docs/latest/ml/tracking/
       Что взять: API `start_run`, `log_metric`, `log_model` — совпадает со слайдом.

    2. https://docs.dagster.io/integrations/libraries/mlflow
       Что взять: официальную библиотеку интеграции и её ограничения.

    3. https://docs.dagster.io/guides/build/assets/metadata-and-tags/adding-attributes-to-assets
       Что взять: как выводить ссылки в метаданных кликабельными.

    **Скриншот:**
    - Открыть карточку ассета обучения с метаданными последней материализации.
    - Рядом — окно MLflow с тем же самым прогоном, открытым по `run_id` из метаданных.
    - В кадре: одинаковый идентификатор прогона в обоих окнах.
    - Стрелкой соединить `mlflow_run_id` в Dagster и заголовок прогона в MLflow.
- kind: content
  id: 932-a16-versiya-i-dannye
  title: 'Главный вопрос: какая модель, из каких данных'
  bullets:
  - Вопрос звучит на каждом разборе инцидента и на каждом аудите
  - Ответ собирается из двух систем по одной ссылке
  - Dagster даёт происхождение, MLflow — параметры и артефакт
  - Без связки ответ приходится восстанавливать по памяти
  code_lang: diagram
  code: |2
     prod model v7
          ↓ model_version
     MLflow run abc123
          ↓ mlflow_run_id
     материализация obuchenie
          ↓ upstream
     training_dataset  (окно d1..d30)
          ↓ upstream
     dbt feature mart  (партиции)
          ↓ upstream
     raw / источники

     путь читается за 30 секунд
  notes: |2
    **Главное:**
    - !!«Какая версия модели в проде была обучена каким прогоном на каких данных» — вопрос, на который связка отвечает за полминуты.!!

    **Рассказ:**
    - Прочитать схему снизу вверх и сверху вниз, показывая, что путь работает в обе стороны.
    - Сверху вниз: взяли версию из реестра, по метаданным нашли прогон, по прогону — материализацию, дальше поднялись по графу до источников.
    - Снизу вверх: в источнике нашли ошибку — спустились и увидели, какие версии моделей ей отравлены.
    - Подчеркнуть: !!ни одного шага здесь не делается вручную!!, каждый переход — это ссылка.

    **Для MLE:**
    - Это тот самый ответ, ради которого стоит потратить день на разметку графа.
    - Обычно на этот вопрос отвечают археологией по логам и чату.

    **Пример:**
    - Регуляторный вопрос: «покажите, на каких данных обучена модель, отказавшая клиенту в марте».
    - Со связкой — три клика; без неё — неделя и оговорки.

    **Что важно не перепутать:**
    - Связка работает только если данные **версионируются или партиционируются**.
    - Если склад перезаписывает витрину на месте и истории нет, путь оборвётся на предпоследнем шаге.

    **Takeaway:**
    - !!Воспроизводимость — это связный путь от версии модели до сырых данных.!!

    **Переход:**
    - ~~«Осталось решить, когда всё это запускать. Четыре паттерна».~~

    **Визуальные опоры:**

    1. https://mlflow.org/docs/latest/ml/model-registry/
       Что взять: верхнюю часть пути — версии и стадии модели.

    2. https://docs.dagster.io/guides/build/assets/asset-versioning-and-caching
       Что взять: среднюю часть — как материализация связана с версией кода и данных.

    3. https://docs.dagster.io/guides/build/partitions-and-backfills/partitioning-assets
       Что взять: нижнюю часть — окно партиций как точное описание данных.

    **Схема:**
    - Вертикальная цепочка из шести звеньев; подписи на стрелках — это имена полей и связей, а не действия.
    - Слева от цепочки — подпись «MLflow» на верхних двух звеньях, «Dagster» на остальных.
    - Стрелки сделать двусторонними: путь читается в обе стороны.
- kind: content
  id: 933-a16-proverki-dlya-dannyh-i-modeli
  title: Проверки для данных и для модели
  bullets:
  - Проверка — узел рядом с ассетом, а не отдельный пайплайн
  - Для данных — привычные схемные и бизнес-проверки
  - Для модели — порог метрики как обычная проверка
  - Уровень серьёзности решает, останавливать ветку или предупредить
  materials:
  - label: Dagster — Asset checks
    url: https://docs.dagster.io/guides/test/asset-checks
  code_lang: python
  code: |2
    @dg.asset_check(asset=obuchenie)
    def roc_ne_nizhe_poroga(context):
        roc = last_metadata(context, "roc_auc")
        return dg.AssetCheckResult(
            passed=roc >= 0.75,
            severity=dg.AssetCheckSeverity
                       .ERROR,
            metadata={
                "roc_auc": roc,
                "threshold": 0.75,
            },
        )
  notes: |2
    **Главное:**
    - !!Порог метрики модели описывается ровно тем же способом, что и «нет пропусков в колонке».!!

    **Рассказ:**
    - Напомнить, что проверки мы уже видели на Quick Start; здесь показываем ML-случай.
    - Проверка привязана к ассету обучения и читает метрику из метаданных последней материализации.
    - `severity` решает судьбу ветки: `ERROR` останавливает распространение вниз, предупреждение — только поднимает флаг.
    - Метаданные проверки не менее важны, чем её результат: в них видно !!фактическое и пороговое значение!!, а не только слово «упало».

    **Для MLE:**
    - Это самый дешёвый способ не выкатить в прод модель хуже текущей.
    - Одна проверка между обучением и регистрацией закрывает целый класс инцидентов.

    **Что важно не перепутать:**
    - Проверка **не выбирает лучшую из двух моделей**.
    - Она отвечает «годится / не годится» по фиксированному критерию; сравнение прогонов между собой — работа трекера экспериментов.

    **Осторожно:**
    - Жёсткий порог, зашитый числом, устаревает.
    - На практике порог берут из метаданных текущей продовой версии, а не из константы в коде.

    **Takeaway:**
    - !!Один язык качества для таблиц и для моделей — это и есть смысл asset checks.!!

    **Переход:**
    - ~~«Время в графе: партиции и бэкфиллы глазами ML-инженера».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/test/asset-checks
       Что взять: уровни серьёзности и поведение ветки при падении.

    2. https://docs.dagster.io/guides/automate/declarative-automation/automating-asset-checks
       Что взять: как проверки запускаются автоматически, а не только вместе с материализацией.

    3. https://docs.dagster.io/guides/test/data-contracts
       Что взять: как набор проверок оформляется в контракт с потребителем.

    **Скриншот:**
    - Провести обучение с заведомо низкой метрикой, чтобы проверка упала.
    - Открыть карточку ассета обучения, вкладку проверок, развернуть упавшую.
    - В кадре: имя проверки, красный статус, метаданные с фактическим и пороговым значением.
    - Рядом — граф, где узел регистрации не запустился.
    - Стрелкой связать упавшую проверку и незапустившийся узел.
- kind: content
  id: 934-a16-particii-i-bekfilly
  title: Партиции и бэкфиллы глазами MLE
  bullets:
  - Признаки считаются посуточно, обучающая выборка — это окно суток
  - Пересчёт истории — штатная операция, а не отдельный скрипт
  - Пересчёт фич за квартал и батч-инференс — одна и та же механика
  - Параллелизм бэкфилла надо ограничивать, иначе ляжет склад
  materials:
  - label: Dagster — Backfills
    url: https://docs.dagster.io/guides/build/partitions-and-backfills/backfilling-data
  code_lang: diagram
  code: |2
     ПАРТИЦИИ              БЭКФИЛЛ
     ─────────────────     ─────────────
     features  d1 d2 d3    выбрать
     dataset   [d1..d30]   диапазон
     model     обучена       ↓
               на d1..d30  пересчёт фич
                             ↓
                           переобучить
                           / доинферить
  notes: |2
    **Главное:**
    - !!Бэкфилл — обычная операция над диапазоном партиций, а не героический одноразовый скрипт.!!

    **Рассказ:**
    - Слева: признаки нарезаны по суткам, обучающая выборка собирается из окна суток, модель обучена на этом окне.
    - Справа: бэкфилл — это выбрать диапазон и запустить пересчёт.
    - Показать три сценария, которые делаются !!одной и той же механикой!!: пересчитать историю фич после исправления бага, переобучить на расширенном окне, догнать батч-инференс за пропущенные дни.
    - Отдельно предупредить про параллелизм: бэкфилл на девяносто дней запустит девяносто материализаций, и без ограничения одновременности это уложит склад.

    **Для MLE:**
    - Разница между «есть партиции» и «нет партиций» видна именно в момент инцидента.
    - Без них пересчёт истории — это скрипт, который пишется в панике и больше никогда не используется.

    **Пример:**
    - Нашли ошибку в расчёте признака месячной давности.
    - С партициями: выбрать тридцать дней, ограничить параллелизм четырьмя, запустить, наблюдать сетку.
    - Без партиций: полный пересчёт всего и надежда.

    **Что важно не перепутать:**
    - Бэкфилл **не гарантирует идемпотентности сам по себе**.
    - Если dbt-модель дописывает строки вместо перезаписи окна, повторный пересчёт продублирует данные.

    **Takeaway:**
    - !!Партиции превращают пересчёт истории из подвига в рутину.!!

    **Переход:**
    - ~~«Осталась тяжёлая часть — обучение, которое не помещается в процесс Dagster».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/partitions-and-backfills/backfilling-data
       Что взять: как запускается бэкфилл и что видно в интерфейсе.

    2. https://docs.dagster.io/examples/best-practices/partition-backfill-strategies
       Что взять: стратегии бэкфилла и рекомендации по параллелизму.

    3. https://docs.dagster.io/guides/operate/managing-concurrency
       Что взять: конкретные способы ограничить одновременность — прямо к предупреждению.

    **Скриншот:**
    - Запустить бэкфилл на десять-пятнадцать партиций.
    - Открыть страницу бэкфилла с сеткой партиций в процессе выполнения.
    - В кадре: часть партиций зелёная, часть в работе, часть в очереди.
    - Оставить видимым счётчик одновременных запусков.
    - Рамкой выделить настройку параллелизма.
- kind: content
  id: 935-a16-dagster-pipes
  title: 'Dagster Pipes: тяжёлое исполнение снаружи'
  bullets:
  - Dagster запускает внешний процесс и принимает от него события
  - Обучение идёт в поде, в кластере или в отдельном контейнере
  - Обратно приходят логи, метаданные и факт материализации
  - Граница «lifecycle против исполнения» здесь становится кодом
  materials:
  - label: Dagster Pipes — Kubernetes
    url: https://docs.dagster.io/integrations/external-pipelines/kubernetes-pipeline
  code_lang: python
  code: |2
    from dagster_k8s import PipesK8sClient

    @dg.asset
    def obuchenie_na_gpu(context, k8s):
        return k8s.run(
            context=context,
            image="registry/trainer:2026",
            base_pod_spec={
                "nodeSelector": {
                    "gpu": "a100",
                },
            },
        ).get_materialize_result()
  notes: |2
    **Главное:**
    - !!Тяжёлое обучение живёт снаружи, а Dagster остаётся владельцем факта «модель материализовалась».!!

    **Рассказ:**
    - Проблема очевидна: обучение на GPU не должно идти внутри процесса оркестратора.
    - Pipes решает её честно: Dagster запускает внешний процесс, а тот !!сообщает обратно!! логи, метаданные и факт материализации.
    - Обратный канал — главное отличие от «просто запустить контейнер и посмотреть код возврата».
    - В коде на слайде — запуск пода в Kubernetes; есть такие же клиенты для подпроцесса, Databricks, EMR, Glue и других.
    - Внутри контейнера ваш скрипт пишет метаданные через маленькую библиотеку — код обучения при этом остаётся обычным Python.

    **Для MLE:**
    - Это ровно та граница, о которой был слайд «ассет против исполнения».
    - Здесь она превращается в конкретный вызов.

    **Что важно не перепутать:**
    - Pipes — **не удалённое выполнение кода Dagster**.
    - Внешний процесс запускается своими средствами и своим образом; Dagster даёт ему контекст и слушает поток событий.

    **Осторожно:**
    - Если внешний процесс не отправляет событий, вы получите ассет без метаданных и без понимания, что там произошло.
    - Инструментирование скрипта — обязательная часть работы.

    **Takeaway:**
    - !!Оркестратор не обязан быть местом, где выполняется тяжёлая работа.!!

    **Переход:**
    - ~~«Подведём итог этой части одной схемой».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/external-pipelines/using-dagster-pipes
       Что взять: полную схему обратного канала — что и как передаётся.

    2. https://docs.dagster.io/integrations/external-pipelines/kubernetes-pipeline
       Что взять: точный вид клиента для Kubernetes, как на слайде.

    3. https://docs.dagster.io/integrations/external-pipelines
       Что взять: перечень поддерживаемых сред исполнения — ответ на вопрос «а у нас EMR».

    **Схема:**
    - Слева процесс Dagster, справа под в кластере, между ними две стрелки в разные стороны.
    - Стрелку «наружу» подписать «контекст и запуск», стрелку «внутрь» — «логи, метаданные, материализация».
    - Обратная стрелка должна быть визуально не слабее прямой: она и есть суть Pipes.
- kind: table
  id: 936-a16-avtomatizaciya-chto-vybrat
  title: 'Автоматизация: что выбрать'
  table:
    headers: ['Механизм', 'Когда запускается', 'Брать, когда', 'Не брать, когда']
    rows:
    - ['ScheduleDefinition', 'Строго по cron', 'Нужен предсказуемый регламент', 'Данные приходят неравномерно']
    - ['AutomationCondition.on_cron', 'По cron, но после обновления зависимостей', 'Ночной регламент и данные с опозданием', 'Реакция нужна немедленно']
    - ['AutomationCondition.eager', 'Сразу за обновлением выше по графу', 'Изменение надо протащить вниз', 'Источник обновляется слишком часто']
    - ['Sensor', 'По внешнему событию', 'Триггер живёт вне Dagster', 'Хватает условия по графу']
    - ['Asset check как шлюз', 'Вместе с материализацией', 'Нельзя пускать плохое вниз', 'Нет договорённости о критерии']
    - ['Ручной запуск', 'По решению человека', 'Цена ошибки высока', 'Событие рутинное и частое']
    col_ratios: [3, 4, 4, 4]
  notes: |2
    **Главное:**
    - !!Выбор механизма определяется источником события, а не привычкой к cron.!!

    **Рассказ:**
    - Читать таблицу справа налево: сначала колонка «не брать, когда» — она честнее.
    - Обычное расписание — самое понятное и самое хрупкое: оно ничего не знает про готовность данных.
    - `on_cron` — расписание, которое умеет ждать; это разумная замена обычному почти везде.
    - `eager` — быстрая реакция, но опасен на частых источниках.
    - Сенсор — единственный вариант, когда событие приходит извне.
    - Проверка как шлюз и ручной запуск — не про «когда запускать», а про «пускать ли дальше», и это тоже часть автоматизации.

    **Для MLE:**
    - Практическая рекомендация: начинать с `on_cron`, добавлять шлюз качества, и только потом усложнять до сенсоров и `eager`.

    **Что важно не перепутать:**
    - Механизмы **не взаимоисключающие**.
    - В одном графе нормально иметь и расписание на витринах, и `eager` на признаках, и ручной промоушен модели.

    **Takeaway:**
    - !!Сначала ответьте, что является событием; механизм выберется сам.!!

    **Переход:**
    - ~~«Теперь — самый ожидаемый блок. Сравнение с Airflow, и оно будет честным».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/automate
       Что взять: карту всех механизмов автоматизации — она соответствует строкам таблицы.

    2. https://docs.dagster.io/guides/automate/declarative-automation/automation-condition-reference
       Что взять: точную семантику каждого условия.

    3. https://docs.dagster.io/guides/observe/asset-freshness-policies
       Что взять: политику свежести — дополнение к таблице, если спросят про SLA.

    **Схема:**
    - Таблица самодостаточна; при желании — дерево решений из трёх вопросов над ней.
    - Первый вопрос: событие внутри графа или снаружи.
    - Второй: нужна ли задержка до готовности данных.
    - Третий: нужен ли человек в контуре.
