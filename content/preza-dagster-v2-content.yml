- kind: section
  id: 937-a17-orkestratory-ryadom
  title: A17 · Оркестраторы рядом
  notes: |2
    **Рассказ:**
    - Про каждого соседа отвечаем на четыре вопроса: что это, где граница, когда сочетать и когда сочетание — перебор.
- kind: content
  id: 938-a17-dagster-i-prefect
  title: 'Prefect: динамические процессы и факт сделки'
  bullets:
  - Prefect — оркестрация обычного Python с упором на динамику
  - Сегодня это две разные модели, а не один продукт
  - 'Факт: Prefect объявила покупку Dagster Labs 13 июля 2026'
  - Имя, открытая лицензия и роадмап Dagster сохраняются
  materials:
  - label: Prefect приобретает Dagster
    url: https://dagster.io/blog/prefect-is-acquiring-dagster
  code_lang: diagram
  code: |2
     СЕГОДНЯ — две модели
     ──────────────────────────
     Dagster → ассеты,
               data lifecycle
     Prefect → динамические
               Python-workflow

     ГИПОТЕЗА (не продукт!)
     ──────────────────────────
     Dagster ─trigger→ Prefect
     lifecycle         динамика
             ←──event──┘
          материализация
  notes: |2
    **Что это:**
    - Prefect — оркестратор, построенный вокруг обычного Python-кода: функции превращаются в потоки и задачи, граф может меняться во время выполнения.

    **Главное:**
    - !!Сегодня это две отдельные модели оркестрации; объединённого продукта не существует, и выдавать гипотезу за факт нельзя.!!

    **Рассказ:**
    - Сначала факт, который уже задают в вопросах: **13 июля 2026 Prefect объявила о приобретении Dagster Labs**; объединённая компания работает под именем Prefect с августа 2026.
    - Имя Dagster, его открытая лицензия и роадмап при этом сохраняются, миграция пользователей не требуется.
    - Дальше — граница между продуктами, как она выглядит сегодня: Dagster силён там, где есть !!устойчивые артефакты!! и вопрос «что пересчитать»; Prefect — там, где граф !!рождается во время выполнения!!.
    - Нижнюю половину схемы явно назвать гипотезой: так связка выглядела бы, если бы её строили сегодня руками.

    **Когда применять:**
    - Сочетать имеет смысл, когда часть работы принципиально динамическая: число шагов зависит от данных, обход дерева, ветвление по результату.

    **Когда не надо:**
    - Держать два оркестратора ради одного динамического куска — почти всегда перебор.
    - В Dagster есть динамическое ветвление и порождение партиций; сначала стоит проверить, хватает ли их.

    **Граница ответственности:**
    - Артефакт принадлежит одному из двух, а не обоим.
    - Dagster владеет ассетами и решает, когда их пересчитать; Prefect владеет выполнением динамической части.

    **Граница отказа:**
    - Если динамический поток упал, Dagster обязан узнать об этом событием и не считать ассет материализованным.
    - Молчаливый отказ на границе — худший сценарий связки.

    **Что важно не перепутать:**
    - Сделка **не означает**, что Dagster превращается в Prefect или наоборот.
    - На момент подготовки лекции это два продукта с двумя моделями.

    **Takeaway:**
    - !!Факты сделки — отдельно, гипотезы о будущем продукте — отдельно.!!

    **Переход:**
    - ~~«Следующий сосед стоит этажом выше — Kestra».~~

    **Визуальные опоры:**

    1. https://dagster.io/blog/prefect-is-acquiring-dagster
       Что взять: официальную формулировку сделки — цитировать её, а не пересказы.

    2. https://docs.prefect.io/v3/concepts/flows
       Что взять: модель потоков и задач — верхнюю правую часть схемы.

    3. https://docs.dagster.io/guides/build/ops/dynamic-graphs
       Что взять: динамические возможности самого Dagster — аргумент против преждевременной связки.

    **Схема:**
    - Верхний блок — две колонки-модели; нижний — гипотетическая связка, обязательно с явной подписью «гипотеза».
    - Нижний блок нарисовать пунктиром или бледнее верхнего.
    - Не изображать объединённый логотип или общий продукт.
- kind: content
  id: 939-a17-dagster-i-kestra
  title: 'Kestra: платформа событий этажом выше'
  bullets:
  - Kestra — декларативная YAML-оркестрация событий и разноязыких задач
  - Работает как общая платформа процессов всей компании
  - Dagster внутри неё — владелец data- и ML-домена
  - Границу проводят по этажам, а не по функциям
  materials:
  - label: Kestra — концепции
    url: https://kestra.io/docs/concepts
  code_lang: diagram
  code: |2
                    Kestra
          события и платформа целиком
                      │
         ┌────────────┼────────────┐
         ↓            ↓            ↓
      Dagster       Spark      внешние
     data/ML-граф    job       системы
         │
         ↓
     dbt → features → model
  notes: |2
    **Что это:**
    - Kestra — оркестратор, где процессы описываются декларативно в YAML, а задачи могут быть на любом языке; сильная сторона — события и кросс-системные процессы.

    **Главное:**
    - !!Граница между Kestra и Dagster проходит по этажам: платформа процессов сверху, граф данных и моделей внутри.!!

    **Рассказ:**
    - Показать схему сверху вниз: Kestra видит всю компанию — от загрузки файлов до бизнес-процессов и уведомлений.
    - Dagster внутри неё — !!один домен!!, но домен со своей внутренней структурой: граф ассетов, партиции, проверки.
    - Ключевая мысль: они не конкурируют за одну и ту же работу, потому что решают задачи разного масштаба.

    **Когда применять:**
    - Когда в компании уже есть общая событийная платформа и data/ML — лишь один из её потребителей.
    - Когда процессы выходят далеко за пределы данных: интеграции, документооборот, уведомления.

    **Когда не надо:**
    - Если вся ваша оркестрация — это данные и модели, второй этаж не нужен вообще.
    - Kestra ради одного data-домена — лишняя система в эксплуатации.

    **Граница ответственности:**
    - Kestra запускает домен и получает от него статус; !!внутрь графа ассетов она не лезет!!.
    - Решение «какой ассет пересчитать» остаётся за Dagster.

    **Граница отказа:**
    - Отказ Kestra не должен оставлять ассеты в неопределённом состоянии.
    - Запуск домена обязан быть повторяемым: повторное событие не должно ломать данные.

    **Что важно не перепутать:**
    - Kestra — **не «более простой Dagster»**.
    - Это инструмент другого масштаба и другой задачи.

    **Takeaway:**
    - !!Этажи, а не функции: платформа процессов сверху, граф артефактов внутри.!!

    **Переход:**
    - ~~«Следующий — этажом ниже. Argo и тяжёлое исполнение».~~

    **Визуальные опоры:**

    1. https://kestra.io/docs/concepts
       Что взять: модель процессов и триггеров Kestra — верхний блок схемы.

    2. https://kestra.io/docs
       Что взять: перечень типов задач — доказательство кросс-системности.

    3. https://docs.dagster.io/guides/build/jobs/asset-jobs
       Что взять: способ дать внешней системе одну кнопку запуска домена.

    **Схема:**
    - Дерево: один узел сверху, три ветки вниз, у левой ветки — собственное поддерево.
    - Подписать, что поддерево — внутреннее устройство домена, невидимое верхнему этажу.
    - Не рисовать стрелок из Kestra внутрь поддерева.
- kind: content
  id: 940-a17-dagster-i-argo
  title: 'Argo Workflows: исполнитель тяжёлых нагрузок'
  bullets:
  - Argo — контейнерные рабочие процессы, родные для Kubernetes
  - Официальный механизм внешнего исполнения Dagster — Pipes
  - Связка именно с Argo — паттерн сообщества, не готовый продукт
  - Оправдан на GPU, распределённом обучении и больших контейнерах
  materials:
  - label: Dagster Pipes
    url: https://docs.dagster.io/integrations/external-pipelines
  code_lang: diagram
  code: |2
     Dagster
       ├─ dbt / features   (свой процесс)
       └─ trigger training
                ↓
          Argo Workflows   ← community
                ↓
          Kubernetes / GPU
                ↓
          артефакт модели
                ↓
             Dagster
                ↓
       оценка / регистрация
  notes: |2
    **Что это:**
    - Argo Workflows — движок контейнерных процессов внутри Kubernetes: каждый шаг это под, масштабирование и планирование отдаёт кластер.

    **Главное:**
    - !!Dagster решает «что и когда», Argo — «где и на чём»; официальной интеграции между ними нет, есть Pipes и паттерн сообщества.!!

    **Рассказ:**
    - Сразу сказать про статус, чтобы никого не подвести: !!официальной интеграции Dagster с Argo Workflows не существует!!.
    - Официальный механизм внешнего исполнения — Dagster Pipes, и для Kubernetes есть готовый клиент.
    - Связка именно с Argo делается руками поверх этого механизма и встречается в сообществе.
    - Дальше — сама схема: лёгкая часть графа считается в процессе Dagster, тяжёлое обучение уходит в кластер, артефакт возвращается, оценка и регистрация идут снова в Dagster.

    **Когда применять:**
    - Когда обучение требует GPU, распределённых воркеров или тяжёлых образов.
    - Когда в компании уже есть зрелая Kubernetes-практика и Argo используется другими командами.

    **Когда не надо:**
    - Если обучение помещается в один процесс на обычной машине — Argo добавит только сложность.
    - Если Kubernetes у вас нет, начинать надо не с Argo.

    **Граница ответственности:**
    - Dagster владеет фактом «модель материализовалась» и её метаданными.
    - Argo владеет тем, как именно этот факт был получен: под, ресурсы, ретраи на уровне кластера.

    **Граница отказа:**
    - Упавший под обязан превратиться в событие для Dagster, а не в тишину.
    - Ассет без обратного канала — самый опасный вид внешнего исполнения.

    **Что важно не перепутать:**
    - Argo Workflows и Argo CD — **разные продукты**.
    - Речь про первый.

    **Takeaway:**
    - !!Внешнее исполнение — это Pipes; конкретный движок под ним вы выбираете сами.!!

    **Переход:**
    - ~~«Последний сосед — не оркестратор вовсе. Kedro».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/external-pipelines/kubernetes-pipeline
       Что взять: официальный клиент Pipes для Kubernetes — единственное, что здесь официально.

    2. https://argo-workflows.readthedocs.io/en/latest/workflow-concepts/
       Что взять: модель шагов и подов Argo — средний блок схемы.

    3. https://docs.dagster.io/integrations/external-pipelines/using-dagster-pipes
       Что взять: устройство обратного канала — то, без чего связка небезопасна.

    **Схема:**
    - Вертикальная цепочка, в которой средний участок визуально «вынесен наружу» — рамкой другого стиля.
    - Обратную стрелку от кластера к Dagster сделать заметной.
    - Подписать участок Argo словом «сообщество», чтобы это читалось и без голоса.
- kind: content
  id: 941-a17-dagster-i-kedro
  title: 'Kedro: каркас ML-проекта, а не оркестратор'
  bullets:
  - Kedro задаёт структуру проекта, конвенции и каталог данных
  - Он не отвечает за расписания, партиции и наблюдаемость
  - Есть плагин сообщества, разворачивающий Kedro в Dagster
  - Часто проще писать ML-ассеты сразу на Dagster
  materials:
  - label: Kedro — деплой в Dagster
    url: https://docs.kedro.org/en/stable/deploy/supported-platforms/dagster/
  code_lang: diagram
  code: |2
     Kedro              Dagster
     ───────────────    ───────────────
     структура          оркестрация
     ML-проекта
     nodes / pipelines  ассеты и граф
     data catalog       расписания
     конвенции репо     наблюдаемость

     kedro-dagster: плагин сообщества
     nodes/pipelines → assets/ops/jobs
  notes: |2
    **Что это:**
    - Kedro — каркас для ML-проектов: структура репозитория, конвенции именования, каталог данных, узлы и пайплайны.

    **Главное:**
    - !!Kedro и Dagster решают разные задачи: один про то, как устроен проект, другой про то, как он живёт в проде.!!

    **Рассказ:**
    - Прочитать колонки: слева — дисциплина внутри репозитория, справа — жизненный цикл в эксплуатации.
    - Kedro даёт то, чего Dagster не даёт: единообразие структуры проекта в команде data scientists.
    - Dagster даёт то, чего нет у Kedro: расписания, партиции, проверки, историю материализаций, интерфейс.
    - Про плагин: `kedro-dagster` — сторонний проект сообщества, разворачивающий узлы и пайплайны Kedro в сущности Dagster.
    - Честно сказать: он поддерживает определённые диапазоны версий обеих сторон, и это нужно проверять перед использованием.

    **Когда применять:**
    - Когда у вас уже есть большой Kedro-проект и переписывать его нет смысла.
    - Когда команда ценит конвенции Kedro и не хочет от них отказываться.

    **Когда не надо:**
    - Начинать новый проект с обоих сразу — почти всегда лишнее.
    - Если проекта на Kedro ещё нет, ассеты Dagster закрывают ту же потребность в структуре меньшим числом сущностей.

    **Граница ответственности:**
    - Kedro владеет структурой кода и каталогом данных внутри проекта.
    - Dagster владеет расписанием, состоянием и наблюдаемостью снаружи.

    **Граница отказа:**
    - Плагин — сторонний; при обновлении любой из двух сторон связка может отвалиться.
    - Закреплять версии обязательно.

    **Что важно не перепутать:**
    - Kedro — **не конкурент Dagster один к одному**.
    - Вопрос «Kedro или Dagster» поставлен неправильно; правильный — «нужен ли мне отдельный каркас проекта».

    **Takeaway:**
    - !!Каркас проекта и оркестратор — разные слои; совмещать их стоит только при наличии уже написанного Kedro.!!

    **Переход:**
    - ~~«И общее правило для всех соседей сразу».~~

    **Визуальные опоры:**

    1. https://docs.kedro.org/en/stable/
       Что взять: понятия узлов, пайплайнов и каталога данных — левая колонка.

    2. https://docs.kedro.org/en/stable/deploy/supported-platforms/dagster/
       Что взять: официальную страницу Kedro про деплой в Dagster.

    3. https://github.com/gtauzin/kedro-dagster
       Что взять: текущий статус плагина и поддерживаемые версии — обязательно сверить.

    **Схема:**
    - Две колонки-списка, между ними вертикальная черта «границa слоя».
    - Внизу — мостик-плагин, нарисованный пунктиром как стороннее решение.
    - Не изображать конкуренцию стрелками друг в друга.
- kind: content
  id: 942-a17-odin-orkestrator-na-granicu
  title: Один оркестратор на границу ответственности
  bullets:
  - Не использовать два оркестратора для одного жизненного цикла
  - У каждого артефакта должен быть единственный владелец
  - Связь между системами — событие и статус, а не общий доступ
  - Правило действует и для Airflow, и для Kestra, и для Argo
  code_lang: diagram
  code: |2
     ПЛОХО                 ХОРОШО
     ──────────────────    ──────────────
     A и B оба дёргают     A владеет
     одни и те же модели   своим куском
       → гонки             B — своим
       → двойной пересчёт
       → непонятно,        A ─событие→ B
         кто виноват       B ─статус──→ A

                           одна точка
                           правды
  notes: |2
    **Главное:**
    - !!Один lifecycle — один владелец; два оркестратора, управляющих одним артефактом, — это гарантированный инцидент.!!

    **Рассказ:**
    - Это общее правило для всего предыдущего блока, и оно важнее любой отдельной интеграции.
    - Левая колонка: две системы считают одни и те же модели.
    - Результат — гонки, двойной пересчёт, невозможность понять, кто виноват, и главное — !!нет одной точки правды!! о состоянии данных.
    - Правая колонка: границы владения проведены явно, взаимодействие идёт через событие и статус.
    - Сформулировать проверочный вопрос для любой архитектуры: !!кто владелец вот этого артефакта!!.
    - Если на него нет однозначного ответа, архитектура ещё не готова.

    **Для MLE:**
    - Самый частый случай нарушения — «мы оставили старый cron на всякий случай».
    - Через месяц никто не помнит, что он есть, и данные пересчитываются дважды.

    **Что важно не перепутать:**
    - Правило про **владение артефактом**, а не про количество систем в компании.
    - Три оркестратора — нормально, если у каждого свой непересекающийся набор артефактов.

    **Takeaway:**
    - !!Проверочный вопрос к любой схеме: кто единственный владелец этого артефакта?!!

    **Переход:**
    - ~~«Соберём всё сказанное в четыре референс-архитектуры».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/external-assets
       Что взять: как корректно отразить в графе объект, которым владеет другая система.

    2. https://docs.dagster.io/guides/build/projects/workspaces
       Что взять: границы владения внутри самого Dagster — кодовые локации.

    3. https://docs.dagster.io/migration/airflow-to-dagster/airlift-v1
       Что взять: пример явной передачи владения при миграции.

    **Схема:**
    - Слева — две системы со стрелками в один общий узел, узел подсвечен как конфликтный.
    - Справа — те же две системы с непересекающимися зонами и одной стрелкой-событием между ними.
    - Подписать правую схему словами «одна точка правды».
# ── PART 8 · Референс-архитектуры ────────────────────────────────────────────────────────
- kind: section
  id: 943-a18-airflow-i-arhitektury
  title: 'A18 · Airflow: детали сравнения и ещё две архитектуры'
  notes: |2
    **Как пользоваться:**
    - Диаграмма двух ментальных моделей — fallback для слайда с триптихом, если скриншоты снять не удалось.
    - Эволюция модели Airflow 2 → 3 → Dagster и разбор Cosmos против dagster-dbt — для тех, кто пришёл из Airflow.

    **Что дальше:**
    - Две референс-архитектуры, не вошедшие в основную часть: тяжёлый Kubernetes-контур и корпоративное сосуществование оркестраторов.
- kind: content
  id: 944-a18-dve-mentalnye-modeli
  title: Один пайплайн — две ментальные модели
  bullets:
  - Слева описываем работу, справа — объекты
  - Слева граф соединяем сами, справа он выводится из кода
  - Разница не в возможностях, а в том, что является единицей графа
  code_lang: diagram
  code: |2
     TASK-CENTRIC       ASSET-CENTRIC
     ───────────────    ───────────────
     task: run dbt      asset: dbt-модели
        ↓                  ↓
     task: features     asset: features
        ↓                  ↓
     task: train        asset: model
        ↓                  ↓
     task: evaluate     asset: evaluation
        ↓                  ↓
     task: register     asset: registered

     задача → задача    ассет → ассет
  notes: |2
    **Главное:**
    - !!Ось сравнения одна: workflow/task-centric оркестрация против asset-centric оркестрации жизненного цикла.!!

    **Рассказ:**
    - Слева и справа — один и тот же пайплайн, описанный двумя способами.
    - Слева единица графа — !!работа!!: «запусти dbt», «обучи», «зарегистрируй».
    - Справа единица графа — !!объект!!: «dbt-модели», «модель», «зарегистрированная версия».
    - Обратить внимание на строку про dbt: слева одна задача на весь проект, справа — набор ассетов; но подчеркнуть, что это про типовой случай, а не про предел возможностей.
    - Сформулировать ось честно: вопрос не «кто мощнее», а !!что является единицей графа!!.

    **Для MLE:**
    - Практическое следствие уже разбирали: от единицы графа зависит, на какие вопросы система умеет отвечать.

    **Что важно не перепутать:**
    - Колонки подписаны моделями, а не продуктами, и это важно именно здесь.
    - **Airflow 3 умеет ассеты**, поэтому «слева Airflow, справа Dagster» было бы враньём; следующие слайды разбирают это подробно.

    **Осторожно:**
    - Не произносить фразу «Airflow ничего не знает о данных».
    - Она была неточной уже для Airflow 2.4 с датасетами и просто неверна для Airflow 3.

    **Takeaway:**
    - !!Сравниваем две модели мышления, а не два лагеря.!!

    **Переход:**
    - ~~«А теперь посмотрим, как эта ось менялась во времени».~~

    **Визуальные опоры:**

    1. https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/assets.html
       Что взять: доказательство, что правая колонка доступна и в Airflow 3.

    2. https://docs.dagster.io/guides/build/assets
       Что взять: правую колонку в терминах Dagster.

    3. https://airflow.apache.org/blog/airflow-three-point-oh-is-here/
       Что взять: официальное описание сдвига в Airflow 3 — контекст для следующего слайда.

    **Схема:**
    - Две вертикальные цепочки рядом, одинаковой длины, соединённые попарно тонкими серыми линиями.
    - Подписывать колонки терминами моделей, не логотипами.
    - Внизу — одна строка про единицу графа.
- kind: content
  id: 945-a18-evolyuciya-modeli
  title: 'Как менялась модель: Airflow 2 → Airflow 3 → Dagster'
  bullets:
  - Airflow 2 — task-centric с добавленной data-aware моделью Datasets
  - Отличие от Airflow сегодня — не в наличии ассетов, а в их роли
  - Airflow 3 переименовал Datasets в Assets и заметно усилил их
  - Dagster с самого начала строит модель вокруг графа ассетов
  - Разрыв в понятиях сильно сократился — сравнивать надо аккуратнее
  materials:
  - label: Airflow 3 — Assets
    url: https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/assets.html
  code_lang: diagram
  code: |2
     AIRFLOW 2.x
     задачи в основе
     + Datasets (с 2.4)
     data-aware расписание
            │
            ↓ эволюция
     AIRFLOW 3.x
     задачи + ассеты
     @asset, asset-aware
     event-driven, партиции
            │
            ~ сравнение
     DAGSTER
     граф ассетов — основная
     модель всей платформы
  notes: |2
    **Главное:**
    - !!Airflow 3 сильно сократил концептуальный разрыв: спор больше не про «есть ассеты или нет».!!

    **Рассказ:**
    - Airflow 2: в основе DAG и задачи; в версии 2.4 появились **Datasets** — объекты, опознаваемые по URI, и расписание, зависящее от их обновления.
    - Это уже была data-aware модель, но !!надстроенная над задачами!!, а не заменяющая их.
    - Airflow 3: Datasets переименованы в **Assets**, появился декоратор `@asset`, планирование по ассетам с логическими операторами, событийное планирование через наблюдателей, а в свежих версиях — !!партиционированные ассеты с мапперами!!.
    - Отдельно назвать архитектурный сдвиг: пространство имён `airflow.sdk`, Task SDK и Task Execution API — задачи больше не ходят в базу метаданных напрямую.
    - Dagster: строит программную модель вокруг ассетов с самого начала, и остальная платформа — проверки, партиции, автоматизация, каталог — устроена вокруг них же.
    - Произнести главный вывод вслух: разница теперь не в наличии ассетов, а в том, !!насколько граф ассетов является центральной моделью всей платформы!!.

    **Для MLE:**
    - Практический вывод для выбора: если у вас уже стоит Airflow 3, честный вопрос звучит не «мигрировать ли», а «достаточно ли мне асcетов Airflow для моего сценария».

    **Что важно не перепутать:**
    - Декоратор `@asset` в Airflow — **не то же самое**, что `@dg.asset` в Dagster.
    - В Airflow это сокращение: он создаёт ассет, DAG и задачу внутри него; в Dagster ассет — самостоятельная единица, DAG вокруг него не появляется.

    **Осторожно:**
    - Всё в этом блоке быстро устаревает.
    - Airflow выпускает минорные версии каждые несколько месяцев; перед показом деки стоит сверить формулировки с документацией.

    **Takeaway:**
    - !!Вопрос сместился с «есть ли ассеты» на «насколько всё вокруг них построено».!!

    **Переход:**
    - ~~«Разложим это по критериям. Таблица на три продукта, две части».~~

    **Визуальные опоры:**

    1. https://airflow.apache.org/docs/apache-airflow/2.10.5/authoring-and-scheduling/datasets.html
       Что взять: документацию Datasets для Airflow 2 — верхний блок схемы в первоисточнике.

    2. https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/assets.html
       Что взять: средний блок — `@asset`, `AssetAlias`, партиционированные ассеты и мапперы.

    3. https://airflow.apache.org/blog/airflow-three-point-oh-is-here/
       Что взять: обзор архитектурных изменений — Task SDK, Task Execution API, бэкфиллы в планировщике.

    **Схема:**
    - Три блока в столбик; между первым и вторым — стрелка «эволюция», между вторым и третьим — знак сравнения, а не стрелка.
    - Это важно: Dagster не является следующей версией Airflow, и стрелка вниз читалась бы именно так.
    - Ширину блоков сделать одинаковой; не увеличивать нижний.
- kind: content
  id: 946-a18-cosmos-protiv-dagster-dbt
  title: Cosmos против dagster-dbt
  bullets:
  - Оба читают один и тот же manifest.json
  - Оба разворачивают dbt-проект по моделям, а не в один шаг
  - Разница — во что превращаются узлы и куда они продолжаются
  - Вопрос не «кто умеет манифест», а «что дальше по графу»
  materials:
  - label: Astronomer Cosmos
    url: https://astronomer.github.io/astronomer-cosmos/
  code_lang: diagram
  code: |2
     dbt manifest
          ↓
     ┌──────────────┬──────────────┐
     │ Cosmos       │ dagster-dbt  │
     │              │              │
     │ узлы → tasks │ узлы → assets│
     │ (+ assets    │              │
     │  в Airflow 3)│              │
     │              │              │
     │ модель DAG   │ модель графа │
     │ Airflow      │ ассетов      │
     └──────────────┴──────────────┘
  notes: |2
    **Главное:**
    - !!Вопрос не «кто умеет развернуть манифест» — умеют оба; вопрос, во что превращаются узлы и как они продолжаются в ML.!!

    **Рассказ:**
    - Сразу снять карикатуру: сравнение «Airflow — это один шаг `dbt build`, Dagster — граф моделей» !!неверно!!.
    - Cosmos читает тот же манифест и строит гранулярный граф: модель становится задачей, тесты — задачами рядом, всё это собирается в группу задач.
    - В Airflow 3 Cosmos дополнительно умеет выпускать ассеты, так что планирование по данным поверх dbt тоже доступно.
    - Реальная разница в том, чем становится узел.
    - У Cosmos это !!задача внутри DAG!!: у неё есть запуск и статус выполнения.
    - У dagster-dbt это !!ассет!!: у него есть материализации, метаданные, проверки, партиции и downstream в виде ML-ассетов.
    - Отсюда практический критерий: если ваш dbt-граф должен продолжаться в обучение и модель, вторая колонка даёт это без склейки; если dbt — конечная точка, разница гораздо меньше.

    **Когда применять:**
    - Cosmos — когда Airflow уже стоит, команда его знает, и dbt является финальной точкой пайплайна. dagster-dbt — когда dbt-граф обязан продолжаться в ML-артефакты и нужны проверки и партиции на тех же узлах.

    **Когда не надо:**
    - Не тащить Dagster ради одного dbt-проекта из пяти моделей, который прекрасно живёт в существующем Airflow.
    - Не строить самодельный парсер манифеста ни в одном из двух случаев.

    **Граница ответственности:**
    - SQL в обоих случаях выполняет dbt; оркестратор владеет только графом и расписанием.
    - Манифест собирается на стороне dbt-проекта и является общим контрактом.

    **Граница отказа:**
    - Нет манифеста — нет графа: одинаково для обоих.
    - Упавший тест: у Cosmos это упавшая задача, у dagster-dbt — упавшая проверка ассета, останавливающая ветку.

    **Что важно не перепутать:**
    - Cosmos — **зрелый и широко используемый проект**, а не костыль.
    - Сравнение честное только тогда, когда это сказано вслух.

    **Takeaway:**
    - !!Сравнивать надо не «умеет ли манифест», а во что превращается узел и куда он ведёт дальше.!!

    **Переход:**
    - ~~«Дальше — самый практичный вопрос: а если Airflow уже стоит?».~~

    **Визуальные опоры:**

    1. https://astronomer.github.io/astronomer-cosmos/getting_started/index.html
       Что взять: как Cosmos разворачивает манифест в группу задач — левая колонка схемы.

    2. https://docs.dagster.io/integrations/libraries/dbt
       Что взять: правую колонку — те же узлы как ассеты.

    3. https://docs.getdbt.com/reference/artifacts/manifest-json
       Что взять: общий источник для обоих — доказательство, что вход одинаковый.

    **Схема:**
    - Один общий вход сверху — манифест, от него развилка на две колонки одинаковой ширины.
    - Внизу каждой колонки показать, что происходит дальше: у левой — конец DAG, у правой — стрелка в ML-ассеты.
    - Не рисовать левую колонку короче или бледнее: разница в продолжении, а не в качестве.
- kind: content
  id: 947-a18-c-tyazhelyj-kubernetes-ml
  title: 'C. Тяжёлый Kubernetes-ML: обучение уезжает в кластер'
  bullets:
  - Лёгкая часть графа считается в Dagster
  - Тяжёлое обучение уходит в кластер через Pipes
  - Реестр и сервинг остаются самостоятельными системами
  - Появляется вторая система, а с ней — вторая точка отказа
  code_lang: diagram
  code: |2
     источники
        ↓
     Dagster → dbt → витрины признаков
        │              (что и когда)
        └──── Pipes ────→ Argo / K8s / GPU
                              (где и на чём)
                              ↓
                           MLflow
                              ↓
                       реестр моделей
                              ↓
                      платформа сервинга
  notes: |2
    **Что это:**
    - Архитектура для случая, когда обучение требует GPU или распределённых воркеров и физически не может идти в процессе оркестратора.

    **Главное:**
    - !!Dagster отвечает на «что и когда», кластер — на «где и на чём»; граница проходит по Pipes.!!

    **Рассказ:**
    - Верхняя часть схемы не изменилась: те же источники, dbt и витрины признаков.
    - Изменилась нижняя: обучение вынесено наружу и запускается через внешнее исполнение.
    - Подписи на схеме — это и есть граница владения: !!что и когда!! против !!где и на чём!!.
    - Дальше цепочка идёт в трекер, реестр и платформу сервинга — каждая из них самостоятельная система, а не часть Dagster.

    **Когда применять:**
    - Обучение на GPU, распределённое обучение, большие образы, отдельные квоты на ресурсы.
    - В компании есть люди, которые умеют эксплуатировать Kubernetes.

    **Когда не надо:**
    - Если обучение помещается в один процесс, эта архитектура добавит только точек отказа.
    - Если Kubernetes используется только ради этой задачи, стоимость эксплуатации не окупится.

    **Граница ответственности:**
    - Dagster владеет фактом материализации модели и её метаданными.
    - Кластер владеет ресурсами, планированием подов и ретраями на своём уровне.
    - Реестр владеет версиями и стадиями.

    **Граница отказа:**
    - Каждый отказ в кластере обязан вернуться событием.
    - Если обратный канал не настроен, вы получите ассет, про который ничего не известно, — это худшее состояние из возможных.

    **Takeaway:**
    - !!Выносить наружу стоит только то, что действительно не помещается внутрь.!!

    **Переход:**
    - ~~«И последняя — корпоративный случай с несколькими оркестраторами».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/integrations/external-pipelines/kubernetes-pipeline
       Что взять: механику границы между Dagster и кластером.

    2. https://docs.dagster.io/deployment/oss/deployment-options/kubernetes
       Что взять: как в этой архитектуре разворачивается сам Dagster.

    3. https://mlflow.org/docs/latest/ml/model-registry/
       Что взять: нижнюю часть схемы — реестр и переход к сервингу.

    **Схема:**
    - Горизонтальный разрыв посередине: верх — процесс Dagster, низ — кластер.
    - Через разрыв — двусторонняя стрелка Pipes с подписями «контекст» и «события».
    - Подписи «что и когда» / «где и на чём» разместить прямо у соответствующих половин.
- kind: content
  id: 948-a18-d-korporativnoe-sosuschestvovanie
  title: 'D. Корпоративное сосуществование: несколько оркестраторов'
  bullets:
  - Верхний этаж — события и процессы всей компании
  - Средний — data/ML-граф со своими владельцами
  - Нижний — исполнители и легаси-системы
  - Правило одно — один оркестратор на границу ответственности
  code_lang: diagram
  code: |2
     Kestra / Airflow — события,
     legacy, корпоративные процессы
        │
        ↓ событие
     Dagster
        data + ML assets
          ├── dbt
          ├── витрины признаков
          ├── MLflow
          └── модели
        │
        ↓ Pipes
     Argo / K8s — тяжёлое исполнение

     один оркестратор
     на границу ответственности
  notes: |2
    **Что это:**
    - Архитектура большой компании, где data/ML — только один из доменов, а вокруг уже работают другие системы.

    **Главное:**
    - !!Три этажа, три зоны владения, и ни одного артефакта с двумя хозяевами.!!

    **Рассказ:**
    - Верхний этаж — то, что уже стоит: корпоративные процессы, интеграции, legacy-DAG.
    - Средний — ваш домен: данные, dbt, признаки, модели.
    - Нижний — исполнители: кластер, GPU, тяжёлые контейнеры.
    - Стрелки между этажами подписаны: сверху приходит !!событие!!, вниз уходит !!внешнее исполнение!!.
    - Ни на одном этаже никто не залезает в чужие артефакты.
    - Сказать, что это не «идеальная» архитектура, а !!реалистичная!!: так выглядит компания, которая не переписывала всё с нуля.

    **Когда применять:**
    - Большая организация, несколько платформенных команд, уже работающий Airflow или Kestra.
    - Data/ML-домен растёт и требует собственной модели.

    **Когда не надо:**
    - Небольшой команде такая схема даёт три системы вместо одной без единого выигрыша.
    - Не строить её «на вырост»: этажи должны появляться по мере появления владельцев.

    **Граница ответственности:**
    - Каждый этаж владеет своим набором артефактов и своей зоной ответственности.
    - Пересечений быть не должно: это главный критерий приёмки такой архитектуры.

    **Граница отказа:**
    - Отказ верхнего этажа не должен ронять средний: запуск домена обязан быть повторяемым.
    - Отказ нижнего обязан быть виден среднему как событие, а не как тишина.

    **Takeaway:**
    - !!Несколько оркестраторов — нормально; несколько хозяев у одного артефакта — нет.!!

    **Переход:**
    - ~~«Теперь честный слайд: когда Dagster не нужен».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/migration/airflow-to-dagster/airlift-v1/federation
       Что взять: официальный сценарий федерации между Airflow и Dagster.

    2. https://kestra.io/docs/concepts
       Что взять: верхний этаж — модель событий и процессов.

    3. https://docs.dagster.io/integrations/external-pipelines
       Что взять: нижний этаж — механику внешнего исполнения.

    **Схема:**
    - Три горизонтальные полосы одинаковой высоты; стрелки только между соседними полосами.
    - Подписать каждую стрелку типом взаимодействия, а не направлением.
    - Не рисовать сквозных стрелок с верхнего этажа на нижний.
