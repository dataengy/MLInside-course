# ── PART 10 · Эксплуатация, сжато ────────────────────────────────────────────────────────
- kind: content
  id: 070-ekspluataciya-korotko
  title: 'Эксплуатация в двух словах'
  bullets:
  - 'Разработка: dg dev поднимает всё локально одной командой'
  - 'Прод: веб-сервер, демон, база состояния, кодовые локации отдельно'
  - 'Кодовая локация — независимо деплоящийся набор определений'
  - Подробности — в приложении в конце этой деки
  code_lang: diagram
  code: |2
     DEV                   PROD
     ──────────────────    ──────────────
     dg dev                webserver
     всё в одном             UI и API
       процессе            daemon
     SQLite на диске         расписания,
     код рядом               сенсоры,
                             очередь
                           Postgres
                             состояние
                           code locations

     код ассетов не меняется —
     меняется Definitions
  notes: |2
    [90:18–91:42 · ~1.4 мин] **Главное:**
    - Из dev в прод переезжает !!конфигурация, а не код ассетов!! — это прямое следствие ресурсов.

    **Рассказ:**
    - Показать левую колонку: `dg dev` — это один процесс, который внутри себя держит всё, включая локальное состояние.
    - Показать правую: в проде те же роли разъезжаются по отдельным сервисам.
    - Веб-сервер отдаёт интерфейс, демон крутит расписания и сенсоры, Postgres хранит состояние, кодовые локации живут отдельными сервисами.
    - Объяснить, зачем разделять кодовые локации: у каждой !!свои зависимости и свой релизный цикл!!, поэтому команда обновляет свой кусок, не трогая чужой и не роняя интерфейс.
    - Сказать, что весь остальной справочник по эксплуатации — деплой, устройство инстанса, сравнение открытой версии с облачной, полная шпаргалка по CLI и работа с MCP — лежит в !!приложении в конце деки!!, и он для самостоятельного чтения.

    **Осторожно:**
    - Не разворачивать здесь Docker Compose и Helm.
    - На первом проекте это преждевременно, а на втором вы прочитаете документацию.

    **Переход:**
    - ~~«Домашнее задание — и оно ровно про то, что мы сегодня разобрали».~~
