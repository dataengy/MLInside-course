# ── PART 6 · Dagster против Airflow ──────────────────────────────────────────────────────
- kind: section
  id: 054-dagster-protiv-airflow
  title: Dagster против Airflow
  notes: |2
    [68:00–68:18 · ~0.3 мин] **Рассказ:**
    - Сравниваем не по списку фич, а на нашем же пайплайне.
- kind: content
  id: 055-odin-pajplajn-dve-mentalnye-modeli
  title: Один пайплайн — две ментальные модели
  bullets:
  - Слева описываем работу, справа — объекты
  - Слева граф рисуем руками, справа он выводится из кода
  - 'Вопрос «что пересчитать» отвечается только справа'
  code_lang: diagram
  code: |2
     AIRFLOW            DAGSTER
     ───────────────    ───────────────
     task: run dbt      asset: dbt-модели
        ↓                  ↓
     task: features     asset: features
        ↓                  ↓
     task: train        asset: model
        ↓                  ↓
     task: evaluate     asset: evaluation
        ↓                  ↓
     task: register     asset: registered

     задача → задача    ассет → ассет
  notes: |2
    [68:18–70:00 · ~1.7 мин] **Главное:**
    - Один и тот же пайплайн, но слева система знает !!порядок работ!!, а справа — !!состав данных!!.

    **Рассказ:**
    - Провести по левой колонке: пять задач, стрелки нарисованы руками, каждая задача — «сделай».
    - Провести по правой: пять ассетов, стрелки выведены из кода, каждый — «должно существовать».
    - Задать один и тот же вопрос обеим колонкам: «поменялась колонка в staging — что пересчитать?».
    - Слева ответ невозможен в принципе: `run dbt` — !!один прямоугольник!!, система не знает, какие модели внутри и что от них зависит.
    - Справа ответ механический: селекция по графу.
    - Задать второй вопрос: «на каких данных обучена вот эта модель?».
    - Слева — по логам, справа — по upstream.

    **Осторожно:**
    - Не изображать левую колонку как ошибку.
    - Airflow решает !!другую задачу!! — «выполнить произвольные работы в правильном порядке», и решает её очень хорошо.

    **Переход:**
    - ~~«Разложим по критериям — и честно, а не в одни ворота».~~
