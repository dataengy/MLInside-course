#   PART 7  058–063  Оркестраторы рядом
#   PART 8  064–067  Референс-архитектуры
#   PART 9  068–069  Когда выбирать Dagster
#   PART 10 070      Эксплуатация, сжато
#   PART 11 071–074  ДЗ и финал
#   ПРИЛОЖЕНИЕ 900–910 — справочно, хронометража не несёт
#
# Сквозная схема деки повторяется и обрастает деталями на 006 → 023 → 034 → 055 → 065–067:
#   raw → dbt staging → dbt feature mart → training dataset → train → evaluate → model → predictions
#
# Notes используют разметку эмфазы (settings.notes_emphasis) + абзацы через пустую строку.
# Каждый записываемый слайд несёт сценарий лектора (Главное / Рассказ / Для MLE / Пример /
