    **Когда применять:**
    - Kedro уже принят в команде и в нём написан рабочий код.

    **Когда не надо:**
    - Проект начинается с нуля и Kedro в команде нет.
    - Тогда Kedro поверх Dagster — это !!второй способ описывать одно и то же!! и лишний слой абстракции.

    **Граница ответственности:**
    - Kedro владеет !!структурой кода!!, Dagster — !!исполнением и наблюдаемостью!!.

    **Граница отказа:**
    - Плагин — сторонний, и его совместимость с версиями обеих сторон надо проверять при обновлении.

