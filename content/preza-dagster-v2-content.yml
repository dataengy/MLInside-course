- kind: content
  id: 072-dz-orkestriruem-dbt-proekt-v-dagster
  title: 'ДЗ: оркестрируем dbt-проект в Dagster'
  bullets:
  - 'Датасет прежний: Olist Brazilian E-Commerce в ClickHouse'
  - 'Обернуть dbt через компонент или @dbt_assets, команда build'
  - 'Ресурсы: ClickHouse и dbt, секреты через EnvVar'
  - 'Главное: ингест-ассеты — РОДИТЕЛИ dbt-графа, а не отдельная куча'
  - 'Связка — кастомный DagsterDbtTranslator: те же ключи у источников'
  - 'Расписание, проверки на сырой слой, сенсор на падение'
  - Скриншот графа ассетов и лог успешного запуска — в отчёт
  code_lang: diagram
  code_caption: Каркас проекта — от него можно отталкиваться
  code: |2
    orchestration/
      src/olist_orchestration/
        defs/dbt/defs.yaml  # DbtProject-
                            # Component
        translator.py       # ключи
                            # источников
        defs/raw.py         # 8 ассетов
                            # CSV → raw.*
        resources.py        # ClickHouse
                            # + DbtCli
        checks.py           # сырой слой
        schedules.py        # витрины
        sensors.py          # приход/сбой
    dbt/                    # ваш проект
                            # БЕЗ копий
  notes: |2
    [92:00–93:42 · ~1.7 мин] **Главное:**
    - Задание не про «обернуть dbt» — это одна строка.
    - Оно про то, чтобы !!загрузка стала частью графа!!.

    **Рассказ:**
    - Постановка: берём !!ваш dbt-проект из предыдущего задания!! — датасет Olist в ClickHouse, слои `sources → staging → intermediate → marts` — и ставим его под управление Dagster.
    - Каталог `dbt/` при этом __не копируется__: Dagster указывает на тот же самый проект.
    - Объяснить, в чём подвох.
    - По умолчанию источники dbt превращаются в ассеты !!без родителей!!, и граф выходит рваным: слева восемь источников из ниоткуда, справа модели.
    - Лечится кастомным `DagsterDbtTranslator`, который выдаёт источникам dbt __те же ключи__, что у ваших ингест-ассетов — Dagster видит совпадение и склеивает половины в один граф.
    - Ещё одна мелочь с большим эффектом: команда `dbt build`, а не `run`.
    - Тогда тесты dbt приезжают в Dagster как проверки ассетов — в эталонном решении это 132 проверки, которых не пришлось писать руками.

    **Осторожно:**
    - Компонент из блока про dbt подходит для обёртки, но переопределение транслятора удобнее делать в Python-варианте.
    - Допустимы оба пути.

    **Переход:**
    - ~~«Критерии — на следующем слайде; полное задание в репозитории курса».~~
