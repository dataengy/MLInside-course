- kind: content
  id: 920-a14-shag-4-materialize
  title: 'Шаг 4: материализовать'
  image: pic-dagster-run-log.png
  bullets:
  - 'В интерфейсе: выделить ассеты и нажать Materialize'
  - 'Из CLI: та же операция одной командой'
  - Dagster сам выстроит порядок по графу
  code_lang: bash
  code: |2
    # весь граф
    dg launch --assets '*'

    # только модель и всё,
    # от чего она зависит
    dg launch --assets '+trained_model'
  notes: |2
    **Главное:**
    - !!Материализация — это акт приведения ассета к описанию; порядок вычисляет граф, а не вы.!!

    **Рассказ:**
    - Показать кнопку в интерфейсе и ту же операцию из терминала.
    - Подчеркнуть, что мы !!нигде не задавали порядок!!: он выведен из рёбер.
    - Первый запуск пройдёт по всем трём узлам; в интерфейсе видно, как они по очереди зеленеют.
    - Обратить внимание на журнал запуска: события идут по ассетам, а не по абстрактным шагам.

    **Для MLE:**
    - Знак `+` слева от имени — «и всё, от чего это зависит».
    - Это самая частая команда в повседневной работе: пересчитать модель вместе с её данными.

    **Что важно не перепутать:**
    - «Материализовать» не всегда значит «записать файл».
    - Для dbt-модели материализация — это выполненный SQL в складе; **Dagster фиксирует факт и метаданные**, а не обязательно хранит данные у себя.

    **Takeaway:**
    - !!Вы просите объект, а не запускаете шаги.!!

    **Переход:**
    - ~~«Теперь самое интересное — что мы за это получили в интерфейсе».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/getting-started/quickstart
       Что взять: описание кнопки Materialize и её эквивалента в CLI.

    2. https://docs.dagster.io/api/clis/dg-cli/dg-cli-reference
       Что взять: точный синтаксис `dg launch` и его ключей.

    3. https://docs.dagster.io/guides/build/assets/asset-selection-syntax/reference
       Что взять: полную грамматику выборки, включая `+` слева и справа.

    **Скриншот:**
    - Открыть страницу запуска сразу после материализации всех трёх ассетов.
    - В кадре — временная шкала запуска с тремя шагами и их длительностями.
    - Обязательно оставить видимыми имена ассетов в журнале.
    - Обрезать нижнюю часть с подробными логами, если она занимает больше трети кадра.
    - Рамкой выделить порядок выполнения — он совпадает с топологией графа.
- kind: content
  id: 921-a14-shag-5-asset-graph
  title: 'Шаг 5: посмотреть asset graph'
  image: pic-dagster-asset-graph.png
  bullets:
  - Граф — карта того, что существует, а не картинка запуска
  - У узла свой статус, история и метаданные
  code_lang: diagram
  code: |2
     ЧТО ВИДНО НА ГРАФЕ
     ──────────────────────────
     узлы      что должно быть
     рёбра     из чего получено
     статус    свежий / устарел
               / не собирался
     клик      история узла
     фильтр    группа, тег, вид

     граф живёт между запусками
  notes: |2
    **Главное:**
    - !!Asset graph — постоянная карта состояния, а не визуализация одного запуска.!!

    **Рассказ:**
    - Это самое важное отличие интерфейса от привычного «списка DAG и их запусков».
    - Граф существует !!всегда!!, даже если сегодня ничего не запускалось.
    - Цвет узла отвечает на вопрос «этот объект свежий?», а не «задача упала?».
    - Клик по узлу открывает его историю: когда собирался, чем, с какими метаданными.
    - Фильтры по группам и тегам — то, чем реально пользуются, когда узлов становится сотни.

    **Для MLE:**
    - Отсюда вы отвечаете на утренний вопрос «что вчера не досчиталось» за один взгляд, а не чтением логов.

    **Что важно не перепутать:**
    - Серый узел не означает ошибку.
    - Он означает **«этот объект ещё не материализовался»** — состояние, а не отказ.

    **Осторожно:**
    - Не пытаться показать в аудитории граф из тысячи узлов: на проекторе он нечитаем.
    - Показывать свернутые группы.

    **Takeaway:**
    - !!Граф отвечает на вопрос «что у меня сейчас есть», а не «что вчера запускалось».!!

    **Переход:**
    - ~~«Узлы есть. Добавим к ним содержание — метаданные».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/operate/webserver
       Что взять: обзор интерфейса и названия вкладок — чтобы называть их так же, как документация.

    2. https://docs.dagster.io/guides/build/assets/metadata-and-tags/kind-tags
       Что взять: значки видов на узлах — они делают граф читаемым.

    3. https://docs.dagster.io/guides/build/assets/asset-selection-syntax/examples
       Что взять: примеры выборок, которые повторяют то, что вы делаете мышью.

    **Скриншот:**
    - Открыть Asset Graph на проекте, где есть все три узла и хотя бы одна группа.
    - Дождаться, пока все узлы будут зелёными после материализации.
    - В кадре: граф целиком плюс легенда статусов.
    - Свернуть левый сайдбар, чтобы граф занимал большую часть ширины.
    - Рамкой выделить один узел и стрелкой — его статус, чтобы связать цвет со смыслом.
- kind: content
  id: 922-a14-shag-6-metadannye
  title: 'Шаг 6: добавить метаданные'
  image: pic-dagster-asset-metadata.png
  bullets:
  - К материализации крепятся любые метаданные
  - Числовые ложатся на график по времени
  materials:
  - label: Dagster — Asset metadata
    url: https://docs.dagster.io/guides/build/assets/metadata-and-tags
  code_lang: python
  code: |2
    @dg.asset
    def trained_model(training_dataset):
        clf, roc = fit(training_dataset)
        return dg.MaterializeResult(
            metadata={
                "roc_auc": roc,
                "rows": len(training_dataset),
                "features": len(
                    training_dataset.columns,
                ),
            },
        )
  notes: |2
    **Главное:**
    - !!Метаданные превращают материализацию из факта «отработало» в факт «получилось вот такое».!!

    **Рассказ:**
    - `MaterializeResult` — способ вернуть не только объект, но и всё, что мы хотим о нём знать.
    - Ключи произвольные; значения — числа, строки, ссылки, таблицы, markdown.
    - Числовые метаданные Dagster умеет откладывать !!на график по времени!!: у вас бесплатно появляется история ROC-AUC по всем переобучениям.
    - Показать карточку ассета с метаданными последнего запуска и вкладку с графиком.

    **Для MLE:**
    - Это тот минимум, который отделяет «пайплайн работает» от «я понимаю, что он произвёл».
    - Три ключа — метрика, число строк, число признаков — окупаются в первый же инцидент.

    **Пример:**
    - Метрика упала с 0.81 до 0.62 — на графике видно, что это случилось в тот же день, когда число строк упало вдвое.
    - Диагноз ставится за секунды.

    **Что важно не перепутать:**
    - Метаданные — это **не замена MLflow**.
    - Здесь мы храним «что получилось у ассета», а сравнение экспериментов, параметры и артефакты остаются в трекере; отдельный блок это разбирает.

    **Takeaway:**
    - !!Три строки метаданных дают историю качества модели без единого дашборда.!!

    **Переход:**
    - ~~«Теперь ломаем что-нибудь наверху и смотрим, что Dagster предложит пересчитать».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/metadata-and-tags
       Что взять: перечень поддерживаемых типов метаданных — от чисел до markdown-превью.

    2. https://docs.dagster.io/guides/build/assets/metadata-and-tags/table-metadata
       Что взять: как показать схему и превью таблицы прямо на карточке ассета.

    3. https://docs.dagster.io/guides/build/assets/metadata-and-tags/asset-observations
       Что взять: способ записать наблюдение без материализации — пригодится для мониторинга.

    **Скриншот:**
    - Материализовать модель два-три раза с разными данными, чтобы появилась история.
    - Открыть карточку ассета `trained_model`, вкладку с материализациями.
    - Развернуть блок метаданных последней материализации.
    - Рядом — график значения `roc_auc` по времени.
    - В кадре: метаданные и график одновременно; всё остальное обрезать.
    - Стрелкой связать ключ `roc_auc` в метаданных с точкой на графике.
- kind: content
  id: 923-a14-shag-7-selective-recomputation
  title: 'Шаг 7: поменяли upstream — пересчитываем только нужное'
  image: pic-dagster-stale-graph.png
  bullets:
  - Изменился ассет наверху — всё ниже устарело
  - Селекция по графу вместо перезапуска всего
  code_lang: bash
  code: |2
    # изменили feature_table
    # → всё ниже помечено устаревшим

    # пересчитать его и всё ниже
    dg launch --assets 'feature_table+'

    # только модель и её данные
    dg launch --assets '+trained_model'

    # ровно один узел
    dg launch --assets 'training_dataset'
  notes: |2
    **Главное:**
    - !!Селективный пересчёт — практическая причина, ради которой всё это и строилось.!!

    **Рассказ:**
    - Сделать изменение вживую: поменять содержимое витрины признаков или код ассета.
    - Обновить граф — узлы ниже помечены как устаревшие.
    - Dagster !!не запускает ничего сам!! в этот момент: он показывает состояние и ждёт решения (автоматика будет отдельным блоком).
    - Разобрать три команды: `имя+` — вниз по течению, `+имя` — вверх, голое имя — ровно один узел.
    - Произнести главное: раньше на вопрос «что пересчитать» отвечал дежурный, теперь отвечает граф.

    **Для MLE:**
    - Отдельно проговорить дорогой случай: если обучение стоит час на GPU, разница между «пересчитать всё» и «пересчитать нужное» — это деньги.

    **Пример:**
    - Поменяли только `preprocessing` — устарели `trained_model` и `evaluation`, но не витрина признаков и не обучающая выборка.
    - Пересчёт занимает минуты вместо часов.

    **Что важно не перепутать:**
    - Пометка «устарел» не означает, что данные испорчены.
    - Она означает, что **выше по течению что-то изменилось после последней материализации** — решение принимаете вы.

    **Осторожно:**
    - Не обещать, что Dagster сам поймёт «изменение косметическое».
    - Он видит факт изменения кода или данных, а не его смысл.

    **Takeaway:**
    - !!Граф отвечает на вопрос «что пересчитать» — точно и без дежурного.!!

    **Переход:**
    - ~~«Осталось два штриха: проверки и происхождение».~~

    **Визуальные опоры:**

    1. https://docs.dagster.io/guides/build/assets/asset-selection-syntax/reference
       Что взять: полную грамматику селекции — она пригодится и в CI, и в бэкфиллах.

    2. https://docs.dagster.io/guides/build/assets/asset-versioning-and-caching
       Что взять: механику, по которой Dagster решает, что ассет устарел.

    3. https://docs.dagster.io/guides/automate/declarative-automation
       Что взять: как то же самое условие превращается в автоматический запуск.

    **Скриншот:**
    - До и после в одном кадре: слева граф со всеми зелёными узлами, справа тот же граф после правки, где два узла помечены устаревшими.
    - Оба снимка делать в одинаковом масштабе и с одинаковой рамкой.
    - Подписать снимки «до правки» и «после правки».
    - Стрелкой показать, что пометка распространилась вниз по течению, а не на весь граф.
- kind: section
  id: 924-a15-dbt-ekran-za-ekranom
  title: 'A15 · dbt-интеграция: экран за экраном'
  notes: |2
    **Как пользоваться:**
    - Это screenshot fallback для DEMO 2 — главного демо лекции.
    - Пять слайдов закрывают всё, что показывается вживую, кроме роли транслятора: подключение, `@dbt_assets`, сквозной граф, сшивка ключей, тесты как проверки.

