- kind: content
  id: 047-mlflow-v-metadannyh-asseta
  title: 'MLflow в метаданных ассета: одна ссылка склеивает два мира'
  bullets:
  - Обучение внутри ассета открывает прогон MLflow
  - Идентификатор прогона и ссылка на модель уезжают в метаданные
  - 'С карточки ассета — прямой переход в эксперимент'
  code_lang: python
  code: |2
    @dg.asset
    def obuchenie(preprocessing):
        with mlflow.start_run() as run:
            clf, roc = fit(preprocessing)
            mlflow.log_metric("roc_auc", roc)
            info = mlflow.sklearn.log_model(
                clf, name="model",
            )
            mv = mlflow.register_model(
                info.model_uri, "olist_delay",
            )
        return dg.MaterializeResult(metadata={
            "mlflow_run_id": run.info.run_id,
            "model_uri": info.model_uri,
            "model_version": mv.version,
            "roc_auc": roc,
        })
  notes: |2
    [58:42–60:24 · ~1.7 мин] **Главное:**
    - Связка держится на !!одной ссылке!!: идентификатор прогона MLflow лежит в метаданных материализации.

    **Рассказ:**
    - Разобрать код: внутри ассета открывается обычный прогон MLflow, туда логируются метрика и модель, модель регистрируется в реестре.
    - Наружу, в метаданные ассета, уезжают четыре вещи: `run_id`, ссылка на модель, номер версии в реестре и ключевая метрика.
    - Показать, что это даёт в обе стороны.
    - Из Dagster: с карточки ассета видно, какой прогон её породил и какая версия зарегистрирована.
    - Из MLflow: по `run_id` понятно, какой материализацией и на каких данных это получено — потому что у материализации есть upstream.
    - Схема связи: витрина признаков → ассет обучения → прогон MLflow → ассет оценки → реестр моделей → деплой.

    **Когда применять:**
    - В команде уже есть MLflow и в нём живёт история экспериментов.
    - Нужен аудит «эта версия в проде обучена вот на этих данных».

    **Когда не надо:**
    - Модель одна, переобучается раз в квартал и сравнивать нечего — тогда метаданных Dagster достаточно, а MLflow добавит инфраструктуры без выигрыша.

    **Граница ответственности:**
    - Dagster владеет !!расписанием, зависимостями и фактом материализации!!; MLflow владеет !!экспериментом, артефактом и реестром!!.

    **Граница отказа:**
    - Недоступный MLflow должен ронять ассет, а не молча пропускать логирование — иначе появится версия модели без следа в реестре.

    **Осторожно:**
    - В `dagster-mlflow` есть готовый ресурс `mlflow_tracking`, но он написан в старом стиле ресурсов.
    - Прямой вызов, как здесь, проще и не привязывает вас к его версии.

    **Переход:**
    - ~~«Теперь соберём типовые production-паттерны — их всего четыре».~~
- kind: section
  id: 048-production-mlops-patterny
  title: Production-паттерны MLOps
  notes: |2
    [60:24–60:42 · ~0.3 мин] **Рассказ:**
    - Четыре паттерна, которые закрывают почти всё, что нужно от переобучения в проде.
- kind: content
  id: 049-pattern-scheduled-retraining
  title: 'Паттерн 1: переобучение по расписанию'
  bullets:
  - Ночью пересчитываются данные, признаки и модель
  - Условие автоматизации ждёт обновления всего, что выше
  - Самый простой паттерн и самый частый старт
  code_lang: python
  code: |2
    # декларативно: раз в сутки, но
    # после обновления зависимостей
    obuchenie = dg.AssetSpec(
        "obuchenie",
        automation_condition=dg
            .AutomationCondition
            .on_cron("0 3 * * *"),
    )

    # или классическое расписание
    dg.ScheduleDefinition(
        name="nochnoe_pereobuchenie",
        target=dg.AssetSelection
                 .assets("obuchenie")
                 .upstream(),
        cron_schedule="0 3 * * *",
    )
  notes: |2
    [60:42–62:06 · ~1.4 мин] **Главное:**
    - `on_cron` отличается от обычного cron одной важной деталью: он ждёт, !!пока обновится всё, от чего ассет зависит!!.

    **Рассказ:**
    - Разобрать оба варианта.
    - Верхний — декларативный: мы говорим «этот ассет должен пересчитываться раз в сутки», и система сама решает, когда именно.
    - Нижний — привычный: расписание на выборку ассетов.
    - Объяснить разницу на сценарии: если витрина признаков приехала с опозданием, обычный cron в три ночи запустит обучение !!на вчерашних данных!!.
    - `on_cron` дождётся обновления зависимостей и запустится позже.
    - Модель не обучится на устаревшем срезе.

    **Когда применять:**
    - Данные приходят регулярно, деградация модели предсказуема, ночного окна хватает.

    **Когда не надо:**
    - Обучение стоит дорого, а данные меняются редко — тогда переобучение по календарю жжёт деньги без пользы.

    **Переход:**
    - ~~«Отсюда естественный шаг: обучать не по часам, а по данным».~~
- kind: content
  id: 050-pattern-data-driven-retraining
  title: 'Паттерн 2: переобучение по данным'
  bullets:
  - Триггером становится появление новой партиции, а не время суток
  - Проверка свежести ловит «данные не приехали» до обучения
  - eager протаскивает изменение вниз по графу автоматически
  code_lang: python
  code: |2
    features = dg.AssetSpec(
        "features",
        automation_condition=dg
            .AutomationCondition.eager(),
    )

    @dg.sensor(
        target=dg.AssetSelection
                 .assets("features"),
    )
    def novaya_particiya(context):
        for day in novye_dni(context.cursor):
            yield dg.RunRequest(
                partition_key=day,
            )
  notes: |2
    [62:06–63:48 · ~1.7 мин] **Главное:**
    - Событийный запуск — это !!главное преимущество asset-модели в проде!!: система реагирует на данные, а не на календарь.

    **Рассказ:**
    - Разобрать два механизма.
    - `eager` — декларативный: «обновись, как только обновилось что-то выше по графу».
    - Сенсор — императивный: код периодически смотрит наружу и сам решает, что запустить; курсор нужен, чтобы не обрабатывать одно и то же дважды.
    - Соединить с проверками из прошлой части: !!проверка свежести!! на витрине ловит ситуацию «источник молчит» до того, как запустится обучение.
    - Сформулировать цепочку паттерна: новая партиция → проверка → обучение.

    **Когда применять:**
    - Данные приходят неравномерно; важно обучиться сразу, как приехал новый срез.

    **Когда не надо:**
    - Источник дребезжит и обновляется десятки раз в час — `eager` превратится в поток лишних запусков.
    - Тогда нужен `on_cron`, который соберёт изменения в одно окно.

    **Осторожно:**
    - Не вешать `eager` на весь граф разом.
    - Это самый быстрый способ получить !!лавину запусков!! на первом же массовом обновлении источника.

    **Переход:**
    - ~~«Обучились — но выпускать в прод пока нельзя. Нужен шлюз».~~
- kind: content
  id: 051-pattern-quality-gate
  title: 'Паттерн 3: шлюз качества'
  bullets:
  - Между обучением и реестром стоит проверка метрики
  - Не прошла — ветка останавливается, старая модель остаётся в проде
  - Прошла — регистрация и деплой идут дальше по графу
  code_lang: diagram
  code: |2
     obuchenie
        ↓
     ocenka
        ↓
     проверка порога метрики
        ├─ не прошла → стоп, алерт,
        │              прод не трогаем
        └─ прошла    → регистрация
                       → деплой
  notes: |2
    [63:48–65:12 · ~1.4 мин] **Главное:**
    - Шлюз качества делает !!невозможным!! попадание плохой модели в прод — не по договорённости, а по устройству графа.

    **Рассказ:**
    - Показать развилку на схеме.
    - Между обучением и реестром стоит проверка — та самая `asset_check` с порогом метрики из прошлой части.
    - Проговорить обе ветки.
    - Не прошла: ассет регистрации !!не материализуется!!, в проде остаётся предыдущая версия, приходит алерт.
    - Прошла: граф едет дальше сам, без ручного подтверждения.
    - Сказать, чем это отличается от привычного «смотрим метрику на дашборде»: там прод защищает !!внимательность дежурного!!, здесь — !!топология графа!!.

    **Когда применять:**
    - Всегда, когда переобучение автоматическое.
    - Автоматическое обучение без шлюза — это автоматическая деградация прода.

    **Когда не надо:**
    - Единственный случай — когда порог невозможно сформулировать.
    - Тогда шлюзом становится человек, но это !!осознанное решение!!, а не забытая проверка.

    **Осторожно:**
    - Порог по одной метрике легко обмануть.
    - На практике в шлюз кладут несколько условий: метрику, размер выборки и сравнение с текущей продовой версией.

    **Переход:**
    - ~~«Последний паттерн — про историю».~~
- kind: content
  id: 052-pattern-backfill
  title: 'Паттерн 4: бэкфилл'
  bullets:
  - Выбираем диапазон исторических партиций
  - Пересчитываем признаки, дальше — обучение или батч-инференс
  - Одна механика на три разных рабочих сценария
  code_lang: diagram
  code: |2
     исторические партиции d1 … d90
              ↓
     пересчёт признаков
     (ограничить параллелизм!)
              ↓
        ┌─────┴─────┐
        ↓           ↓
     батч-       переобучение
     инференс    на новом окне
  notes: |2
    [65:12–66:36 · ~1.4 мин] **Главное:**
    - Бэкфилл — это !!одна механика на три сценария!!, которые обычно решают тремя разными скриптами.

    **Рассказ:**
    - Назвать сценарии.
    - Первый: нашли ошибку в логике признака — пересчитываем историю.
    - Второй: добавили новый признак — достраиваем его назад, чтобы обучающее окно было полным.
    - Третий: нужны предсказания за прошлый период — прогоняем батч-инференс по историческим партициям.
    - Показать на схеме, что во всех трёх случаях это !!выбор диапазона и запуск!!, а дальше расходится только хвост.
    - Отдельно проговорить восклицательный знак в скобках: бэкфилл на девяносто дней без ограничения параллелизма кладёт склад.

    **Когда применять:**
    - Данные партиционированы и логика действительно изменилась.

    **Когда не надо:**
    - Данные не партиционированы: тогда «бэкфилл» превращается в полный пересчёт, и никакого выигрыша нет.

    **Переход:**
    - ~~«Три способа запускать — как выбрать между ними».~~
