    - !!Dagster не заменяет MLflow!! — они отвечают на разные вопросы, и пересечение у них меньше, чем кажется.

    **Рассказ:**
    - Сформулировать разделение одной парой фраз.
    - Dagster отвечает на вопрос !!«что и когда должно пересчитаться»!!.
    - MLflow отвечает на вопрос !!«какой из двухсот прогонов оказался лучше и почему»!!.
    - Пройти по строкам: слева всё про граф, время и отказы; справа всё про эксперимент и сравнение.
    - Признать честно, где пересечение есть: метрики можно положить и туда, и туда.
    - Дать практическое правило: !!метрики для сравнения экспериментов!! — в MLflow, !!метрики как характеристика материализации!! — в метаданных Dagster.

    **Осторожно:**
    - Не советовать «выбрать что-то одно».
    - Это соседи, а не альтернативы; типичная зрелая связка использует оба.

    **Переход:**
