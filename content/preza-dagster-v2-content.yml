    - ['Алерты и SLA', 'свои интеграции', 'встроенные политики алертов']
    - ['Цена', 'бесплатно', 'подписка']
    col_ratios: [3, 3, 4]
  notes: |2
    **Главное:**
    - !!Ядро оркестрации в открытой версии полное; платят за эксплуатацию, доступы и наблюдаемость.!!

    **Рассказ:**
    - Ни одна возможность из лекции — ассеты, проверки, партиции, автоматизация, dbt, Pipes — не требует облачной версии.
    - Платная часть — про то, чего вам иначе пришлось бы строить самим: превью-окружения на ветку, ролевую модель, аудит, алерты, отчёты по стоимости.
    - Отдельно назвать скрытую статью расходов открытой версии: время инженеров на эксплуатацию.

    **Осторожно:**
    - Состав тарифов меняется чаще, чем документация по API.
    - Перед принятием решения сверять с текущей страницей цен.
- kind: content
  id: 912-a10-cli
  title: 'A10. CLI: современный поток dg'
  bullets:
  - 'dg — современный CLI: создание, скаффолдинг, проверка, запуск'
  - 'dagster — классические команды запуска и эксплуатации'
  - Выборка понимает группы, теги и выражения по графу
  - Миграция инстанса обязательна при обновлении версии
  materials:
  - label: dg CLI — справочник
    url: https://docs.dagster.io/api/clis/dg-cli/dg-cli-reference
  code_lang: bash
  code: |2
    # ── создание и разработка ───────
    uvx create-dagster@latest \
        project ml-platform
    dg dev                # UI + демон
    dg list defs          # что есть
    dg check defs         # валидация
    dg scaffold defs \
       dagster_dbt.DbtProjectComponent \
       --project-path ../analytics_dbt
    dg launch --assets 'features+'

    # ── эксплуатация ────────────────
    dagster asset materialize \
        --select "group:marts"
    dagster asset backfill \
        --select features_daily \
        --partition-range \
          2026-01-01...2026-06-30
    dagster instance migrate
  notes: |2
    **Главное:**
    - !!`dg check defs` в CI ловит большую часть ошибок конфигурации до деплоя.!!

    **Рассказ:**
    - `create-dagster` создаёт проект, `dg` живёт внутри его окружения и делает всё остальное.
    - `dg list defs` показывает, что вообще загрузилось, — первая команда при отладке «почему ассета нет».
    - `dg check defs` — валидация определений; ставится в CI и стоит почти ничего.
    - Классические команды `dagster` никуда не делись и по-прежнему нужны для эксплуатации.
    - `dagster instance migrate` обязателен при обновлении версии, иначе схема хранилища разойдётся с кодом.

    **Что важно не перепутать:**
    - `dg` ставится **в окружение проекта**, а не глобально: версия CLI обязана совпадать с версией библиотеки.
- kind: content
  id: 913-a11-mcp
  title: 'A11. MCP: официальный и от сообщества'
  bullets:
  - 'MCP — открытый протокол доступа моделей к инструментам'
  - 'Официальный сервер Dagster+ — про работу с облачным развёртыванием'
  - 'Серверы сообщества — про открытую версию и эксплуатацию'
  - Есть также официальный набор навыков для ассистентов
  - 'Направление молодое: проверяйте права доступа'
  materials:
  - label: Dagster+ MCP
    url: https://docs.dagster.io/guides/labs/dagster-mcp
  code_lang: json
  code: |2
    {
      "mcpServers": {
        "dagster": {
          "command": "dg",
          "args": ["mcp", "serve"]
        }
      }
    }
  notes: |2
    **Главное:**
    - !!Различайте официальный сервер для Dagster+ и решения сообщества для открытой версии — это разные вещи с разными правами.!!

    **Рассказ:**
    - Официальный сервер даёт ассистенту доступ к информации и действиям в облачном развёртывании; на момент подготовки лекции он недоступен организациям в европейском регионе.
    - Для открытой версии существуют серверы сообщества — они закрывают эксплуатационные сценарии: посмотреть запуски, логи, ассеты, запустить джобу.
    - Отдельно: у Dagster есть официальный репозиторий навыков для кодовых ассистентов — он помогает писать определения, а не управлять развёрнутой системой.

    **Осторожно:**
    - Агент с правом запускать джобы — это агент с правом потратить ваш бюджет на вычисления.
    - Начинать надо с прав только на чтение.
- kind: content
  id: 914-a12-dlt
  title: 'A12. dlt: загрузка как код'
  bullets:
  - 'Python-библиотека загрузки: источник → приёмник'
  - Схема выводится автоматически, эволюция схемы поддержана
  - Каждый ресурс dlt становится ассетом Dagster
  - Живёт в одном процессе с оркестратором — без лишнего сервиса
  materials:
  - label: dlt — документация
    url: https://dlthub.com/docs/intro
  code_lang: python
  code: |2
    from dagster_dlt import (
        DagsterDltResource, dlt_assets,
    )

    @dlt_assets(
        dlt_source=sql_database()
            .with_resources(
                "transactions", "customers",
            ),
        dlt_pipeline=dlt.pipeline(
            pipeline_name="shop",
            destination="clickhouse",
            dataset_name="raw",
        ),
        name="shop_ingest",
        group_name="ingestion",
    )
    def shop_assets(context, dlt_res):
        yield from dlt_res.run(
            context=context,
        )
  notes: |2
    **Главное:**
    - !!dlt — библиотека, а не сервис: загрузка становится обычными ассетами в том же процессе.!!

    **Рассказ:**
    - Каждый ресурс источника превращается в отдельный ассет — значит загрузка попадает в тот же граф, что dbt и ML.
    - Ключи этих ассетов надо согласовать с источниками dbt — тогда граф будет связным от API до модели.
    - Главное преимущество перед сервисным подходом: нет отдельной системы в эксплуатации.

    **Когда не надо:**
    - Когда нужны сотни готовых коннекторов к SaaS-системам: писать их руками дороже, чем поднять сервис.
- kind: content
  id: 915-a12-airbyte
  title: 'A12. Airbyte: коннекторы как сервис'
  bullets:
  - Сотни готовых коннекторов — писать загрузку не надо
  - Отдельный сервис со своей инфраструктурой и интерфейсом
  - Dagster триггерит синхронизации и видит их как ассеты
  - Таблицы Airbyte становятся апстримом dbt-моделей
  materials:
  - label: Dagster & Airbyte
    url: https://docs.dagster.io/integrations/libraries/airbyte
  code_lang: python
  code: |2
    from dagster_airbyte import (
        AirbyteCloudWorkspace,
        load_airbyte_asset_specs,
    )

    workspace = AirbyteCloudWorkspace(
        workspace_id=dg.EnvVar(
            "AIRBYTE_WORKSPACE_ID"),
        client_id=dg.EnvVar(
            "AIRBYTE_CLIENT_ID"),
        client_secret=dg.EnvVar(
            "AIRBYTE_CLIENT_SECRET"),
    )

    specs = load_airbyte_asset_specs(
        workspace,
    )
    defs = dg.Definitions(
        assets=[*specs, dbt_models],
    )
  notes: |2
    **Главное:**
    - !!Airbyte остаётся владельцем загрузки; Dagster видит её результат как внешние ассеты и продолжает граф.!!

    **Рассказ:**
    - Спецификации ассетов загружаются из рабочего пространства Airbyte, а не описываются руками.
    - Дальше действует то же правило сшивки: ключи должны совпасть с источниками dbt.
    - Цена решения — отдельный сервис в эксплуатации; выигрыш — коннекторы, которые не надо писать.

    **Граница ответственности:**
    - Airbyte владеет расписанием синхронизаций внутри себя.
    - Если запускать синхронизацию из Dagster, надо выключить её расписание в Airbyte — иначе два хозяина у одного артефакта.
- kind: content
  id: 916-a13-multi-orkestratornye-patterny
  title: 'A13. Мульти-оркестраторные паттерны'
  bullets:
  - 'Airflow — legacy, интеграции, корпоративные процессы'
  - 'Dagster — данные, dbt и ML lifecycle'
  - 'Argo — тяжёлое исполнение в Kubernetes'
  - 'Kestra — событийный слой над всем этим'
  - Правило одно — один lifecycle, один владелец артефакта
  code_lang: diagram
  code: |2
     СЛОЙ                ВЛАДЕЕТ
     ─────────────────   ──────────────────
     Kestra              события компании
     Airflow             legacy, интеграции
     Dagster             data + dbt + ML
     Argo / K8s          исполнение

     ЗАПРЕЩЕНО
     ─────────────────────────────────────
     два оркестратора независимо
     управляют одним materialized artifact
  notes: |2
    **Главное:**
    - !!Нельзя допускать, чтобы два оркестратора независимо управляли одним и тем же материализованным артефактом.!!

    **Рассказ:**
    - Слои сами по себе не проблема: в крупной компании их естественно несколько.
    - Проблема возникает ровно тогда, когда у артефакта появляется второй хозяин: гонки, двойной пересчёт, невозможность понять, чьё состояние истинно.
    - Проверочный вопрос к любой схеме: назовите единственного владельца вот этого артефакта.
    - Если ответа нет — схема не готова, независимо от того, сколько в ней инструментов.

    **Граница отказа:**
    - Взаимодействие между слоями должно идти событиями, а повторная доставка события не должна ломать данные.
- kind: table
  id: 917-obzor-rynka
  title: 'Обзор рынка: кто есть кто'
  table:
    headers: ['Инструмент', 'Модель', 'Сильная сторона', 'Слабая сторона']
    rows:
    - ['Dagster', 'ассеты, декларативно', 'lineage, партиции, тестируемость', 'порог входа, уже рынок труда']
    - ['Airflow 2.x', 'задачи и DAG, Datasets сверху', 'зрелость, экосистема, найм', 'данные надстроены над задачами']
    - ['Airflow 3.x', 'задачи и ассеты', 'ассеты, события, Task SDK', 'модель шире и оттого сложнее']
    - ['Prefect', 'обычный Python, потоки', 'гибкость, динамика, низкий порог', 'слабее каталог и происхождение']
    - ['Kestra', 'декларативный YAML', 'язык-независимость, простой старт', 'моложе, меньше сообщество']
    - ['Argo Workflows', 'контейнеры в Kubernetes', 'масштаб, kubernetes-native', 'далёк от аналитики, нет ассетов']
    col_ratios: [3, 3, 4, 4]
  notes: |2
    **Главное:**
    - !!Airflow 2 и Airflow 3 занимают в этой таблице разные строки — и это не формальность.!!

    **Рассказ:**
    - Таблица нужна для быстрой ориентации, а не для выбора: выбор делается по типу нагрузки, а не по столбцу «сильная сторона».
    - Строка Airflow 3 отличается от строки Airflow 2 принципиально: там появились ассеты, событийное планирование и новая модель исполнения задач.
    - Слабая сторона Airflow 3 сформулирована честно: платформа стала шире, а значит и сложнее в освоении.

    **Осторожно:**
    - Рынок оркестраторов двигается быстро.
    - Перед показом деки сверять формулировки с текущей документацией каждого продукта.
