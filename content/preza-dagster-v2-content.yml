    **Рассказ:**
    - Описать Kedro нейтрально: набор конвенций для ML-проекта — узлы, пайплайны, каталог данных, предсказуемая структура репозитория.
    - Это про дисциплину кода.
    - Dagster — про то, когда всё это запускается, что от чего зависит и что видно снаружи.
