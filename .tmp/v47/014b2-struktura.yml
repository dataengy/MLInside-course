- kind: content
  id: 014b2-struktura-dbt-proekta
  title: Структура dbt-проекта
  materials:
  - label: About dbt projects
    url: https://docs.getdbt.com/docs/build/projects
  code_caption: 'канонический каркас: каждая папка — отдельная ответственность'
  code_lang: diagram
  code: |2
     my_dbt_project/
     ├── dbt_project.yml        конфигурация проекта
     ├── packages.yml           зависимости
     ├── models/
     │   ├── staging/
     │   │   ├── stg_orders.sql
     │   │   └── _sources.yml   объявление источников
     │   ├── intermediate/
     │   │   └── int_order_items.sql
     │   └── marts/
     │       ├── fct_orders.sql
     │       ├── dim_customers.sql
     │       └── _models.yml    тесты и описания
     ├── macros/                Jinja-функции
     ├── tests/                 singular-тесты
     ├── seeds/                 маленькие CSV в git
     ├── snapshots/             история SCD2
     ├── analyses/              SQL «на посмотреть», не строится
     └── selectors.yml          именованные наборы моделей

     ~/.dbt/profiles.yml        окружение и подключения, ВНЕ git
  notes: |2
    [~1 мин] **Главное:** каркас проекта — !!не вкусовщина, а конвенция!!: по расположению файла dbt понимает, что это, и половина инструментов экосистемы рассчитывает именно на неё.

    **Разбор:** на предыдущем слайде дерево было урезано до того, что появляется при первом запуске. Здесь — полный набор, включая то, что заводят позже.

    `seeds/` — маленькие CSV, которые версионируются вместе с кодом: справочники, маппинги, списки исключений. `snapshots/` — историзация SCD2 для источников, хранящих только актуальную строку. `analyses/` — SQL, который компилируется, но !!не материализуется!!: место для разовых разборов, которые не должны стать таблицей. `selectors.yml` — именованные наборы моделей, чтобы в CI и в оркестраторе не тиражировать длинные строки селекторов.

    Отдельно про `_sources.yml` и `_models.yml`: подчёркивание в начале — распространённая конвенция, а не требование dbt; она просто держит YAML первым в алфавитном списке рядом с моделями слоя.

    **Практический смысл:** последняя строка вне дерева — `~/.dbt/profiles.yml`. Она здесь для контраста: всё, что выше, живёт в репозитории и ревьюится, подключения — нет. Об этом следующий слайд.

    **Переход:** ~~«Разделим два конфига: что лежит в репозитории и что приходит из окружения».~~
