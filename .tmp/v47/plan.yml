# Перенос правок из снимка 19:37 ручной деки v4.7.0+man (корзина).
# Шесть изменений; перестановка вступления сделана двумя move.
- {op: sub, count: 1,
   find: "  id: 001-dbt-dlya-full-stack-data-specialist\n  title: Трансформация данных и витрины (dbt)",
   replace: "  id: 001-dbt-dlya-full-stack-data-specialist\n  title: Трансформация данных и витрины (dbt)\n  image: pic-dbt-logo.png"}

# вступление: было AE → 60 секунд → ELT → история → Viewpoint
