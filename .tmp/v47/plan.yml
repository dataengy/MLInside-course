- {op: move, id: 006a-dbt-za-60-sekund,                 after: 006d-istoriya-dbt}
- {op: move, id: 006-pochemu-voznik-analytics-engineering, after: 006c-dbt-viewpoint}

# AE: буллеты заменены формулировкой автора
