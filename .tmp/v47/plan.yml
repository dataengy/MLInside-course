  count: 1
  find: "  - 'DE приносит данные в хранилище: E и L'\n  - Analytics Engineer отвечает за T\n  - Аналитик и DS — поверх готового слоя\n  - 'Формула: ELT + практики разработки ПО'"
  replace: "  - 'Упрощённое разделение ответственности:'\n  - 'Data Engineering — E и L: доставка в хранилище'\n  - 'Analytics Engineering — T, модель данных, качество'\n  - 'Аналитика, BI, DS и MLE — поверх готового слоя'"

