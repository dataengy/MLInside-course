- kind: content
  id: 014c-proekt-ne-okruzhenie
  title: 'Проект ≠ окружение: два конфигурационных файла'
  bullets:
  - 'dbt_project.yml — что за проект: пути, материализации, теги'
  - 'profiles.yml — куда подключаться; живёт в ~/.dbt, не в git'
  - 'Один проект — несколько target: dev, ci, prod'
  - 'Секреты только через env_var(), ни строки в репозитории'
  - 'В Airflow и Dagster соединение приходит из оркестратора'
  materials:
  - label: dbt_project.yml
    url: https://docs.getdbt.com/reference/dbt_project.yml
  - label: profiles.yml
    url: https://docs.getdbt.com/docs/core/connect-data-platform/profiles.yml
  code_lang: diagram
  code: |2
     В РЕПОЗИТОРИИ        ОКРУЖЕНИЕ · СЕКРЕТЫ
     ─────────────────    ────────────────────
     dbt_project.yml      profiles.yml
     models/              host · port
     macros/  tests/      database · schema
     packages.yml         user · password
     selectors.yml        target: dev/ci/prod
     ─────────────────    ────────────────────
     одинаково у всех     своё у каждого
     ревьюится в PR       из env_var() и CI
  notes: |2
    [~1.5 мин] **Главное:** !!один и тот же проект собирается в разные хранилища!!. Всё, что различается между разработчиком, CI и продом, вынесено из репозитория.

    **Рассказ:**

    - `dbt_project.yml` отвечает на вопрос **«что это за проект»**: имя, пути к моделям и макросам, материализации по папкам, теги, переменные. Он ревьюится в PR и одинаков у всех.
    - `profiles.yml` отвечает на вопрос **«куда подключаться»**: адаптер, хост, база, схема, пользователь. По умолчанию лежит в `~/.dbt/`, __вне репозитория__.
    - Связывает их одна строка: `profile:` в `dbt_project.yml` называет профиль, а `--target` выбирает внутри него окружение.
    - В профиле обычно три target: `dev` — своя схема разработчика, `ci` — временная схема пайплайна, `prod` — боевая.

    **Практический смысл:** варианты, где живёт соединение, по возрастанию зрелости.

    - **Локально** — `~/.dbt/profiles.yml`, руками, только dev-креды.
    - **CI** — тот же файл в репозитории, но все значения через `env_var()`; сами значения приходят из секретов пайплайна.
    - **Cosmos** — `ProfileConfig` с маппингом на Airflow Connection: креды хранит Airflow, dbt их не видит.
    - **Dagster** — ресурс проекта; соединение конфигурируется в дефинишенах Dagster.

    **Осторожно:** !!захардкоженный пароль в `profiles.yml` — самая частая утечка в dbt-проектах!!. Файл выглядит «локальным», и его коммитят «на минутку». Правило простое: в репозиторий попадает только шаблон с `env_var()`.

    **Переход:** ~~«Осталось понять, в каком порядке ловить ошибки, пока правка ещё на вашей машине».~~
