- kind: content
  id: 006a-dbt-za-60-sekund
  title: dbt за 60 секунд
  bullets:
  - 'dbt = data build tool: слой T в ELT, внутри хранилища'
  - 'Модель — это SELECT в .sql; метаданные и тесты — в .yml'
  - 'ref() связывает модели и строит DAG; порядок выводится сам'
  - 'Из того же кода — тесты, документация и метаданные проекта'
  - 'dbt Core — open source CLI; вокруг него платформа и адаптеры'
  - 'Пакеты с hub.getdbt.com добавляют макросы и готовые тесты'
  materials:
  - label: What is dbt
    url: https://docs.getdbt.com/docs/introduction
  code_lang: diagram
  code: |2
     ЧТО ДЕЛАЕТ           ЧЕГО НЕ ДЕЛАЕТ
     ──────────────       ─────────────────
     T в ELT              ingestion — E и L
     SQL + YAML + Jinja   расписание и ретраи
     ref() → DAG          хранение и compute
     тесты · документация обучение моделей
     метаданные проекта   стриминг из коробки
  notes: |2
    [~1.5 мин] **Главное:** dbt — это !!компилятор и оркестратор SQL-моделей внутри хранилища!!, а не ещё один ETL-движок.

    **Рассказ:**

    - Расшифровка простая: **data build tool**. Буква **T** из ELT — всё, что происходит с данными после того, как они уже легли в хранилище.
    - Вы пишете `SELECT` в файле `.sql` — не `CREATE TABLE`, не `INSERT`. DDL и порядок сборки dbt берёт на себя.
    - Рядом лежит `.yml`: описания, тесты, теги, владельцы. __Код и метаданные живут в одном репозитории и в одном ревью.__
    - `ref('stg_orders')` вместо имени таблицы — из этих ссылок dbt выводит **DAG** и сам решает, что за чем строить.
    - Из того же проекта бесплатно получаются документация, lineage и артефакты для внешних систем.
    - **dbt Core** — open-source CLI на Python. Вокруг него коммерческая платформа, адаптеры под СУБД и пакеты на hub.

    **Осторожно:** правая колонка схемы важнее левой.

    - dbt !!не грузит данные!! — за E и L отвечает ingestion (Airbyte, Kafka, свои скрипты).
    - dbt не «отменяет Python». Декларативный SQL вытесняет ad-hoc процедурную логику !!в табличном слое трансформаций!! — и только там.

    **Переход:** ~~«Теперь — почему такой инструмент вообще понадобился».~~
