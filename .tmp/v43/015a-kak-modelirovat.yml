- kind: content
  id: 015a-kak-modelirovat-dannye
  title: 'Как моделировать данные в dbt: слои ≠ модель'
  image: pic-dbt-layers-flow.png
  bullets:
  - Слои — это DAG трансформаций, а не модель данных
  - 'Движение слоёв: source-conformed → business-conformed'
  - 'intermediate необязателен: join, re-grain, pivot/fanout'
  - dbt даёт DAG и соглашения — модель данных выбирает архитектор
  materials:
  - label: How we structure our dbt projects
    url: https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview
  code_lang: diagram
  code: |2
     СЛОИ — ЭТО DAG        МОДЕЛЬ — ЭТО СМЫСЛ
     ───────────────────   ──────────────────
     просто                сущность
      src → stg → mart     grain
     сложно                связи
      src → stg → int      история
              → mart       контракт
     ───────────────────   ──────────────────
     intermediate —        одна модель =
     по необходимости      одна сущность
                           + своя grain
  notes: |2
    [~2 мин] **Главное:** это два разных решения, и их постоянно путают. !!Слои — про порядок сборки. Модель данных — про смысл строки.!!

    **Рассказ:**

    - Картинка справа — **transformation DAG**, рекомендованная раскладка dbt: `sources → staging → [intermediate] → marts`. Движение идёт от **source-conformed** (как в источнике) к **business-conformed** (как думает бизнес).
    - `staging` — rename, cast, cleanup. Одна модель на один источник.
    - `intermediate` — join, смена гранулярности, pivot и fanout, изоляция сложной логики.
    - `marts` — бизнес-сущности и витрины под потребителя.
    - !!`intermediate` — необязательный слой.!! Для маленького проекта `staging → marts` — это нормально, а не халтура. Он появляется тогда, когда между ними реально есть что делать.
    - Схема слева — вторая, независимая ось. **Модель данных** = сущность + гранулярность + связи + история + контракт потребителя. Ни одно из этих слов не про папки.
    - Базовое правило для простого проекта: **entity-centric marts** — `orders`, `customers`, `sellers`, `mart_delivery_features`. __Одна модель = одна понятная сущность или задача + явно названная grain.__

    **Для ML/MLOps:** ключевой вопрос моделирования формулируется одной фразой: !!что означает одна строка обучающей выборки!!. Заказ? Заказ на момент времени? Пара «заказ × продавец»? Ответ на этот вопрос определяет всю витрину — и он не выводится из раскладки папок.

    **Пример:** Olist. `stg_orders` — source-conformed, схема как в источнике. `int_order_level` — интеграция и смена грануляра: заказ ровно одной строкой. `mart_delivery_features` — consumer-facing витрина, потребитель у неё обучение.

    **Осторожно:** dbt !!не требует!! ни Kimball, ни Data Vault, ни Medallion. Он даёт граф и соглашения об именах; выбор методологии остаётся за архитектором и делается под задачу.

    **Переход:** ~~«Теперь, когда мы разделили структуру DAG и собственно модель данных, разберём ответственность каждого слоя».~~
