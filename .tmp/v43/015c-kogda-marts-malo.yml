  notes: |2
    [~2 мин] **Главное:** это не конкурс «какой подход правильный», а четыре разных ответа на вопрос !!что считать единицей модели данных!!. Ни один из них не является требованием dbt.

    **Рассказ:** по строкам, по фразе на паттерн.

    - **Medallion** — bronze / silver / gold. Читается за минуту и хорош как общий словарь с соседними командами. Но это !!паттерн слоистости и зрелости, а не методология моделирования сущностей!!: внутри уровня он не говорит ничего.
    - **Kimball** — факты и измерения вокруг бизнес-процесса. Сильная сторона — понятность аналитику; слабая — переделка измерений при изменении источника.
    - **Data Vault 2.0** решает ровно эту боль: hub (бизнес-ключ), link (связь) и satellite (атрибуты с историей) разделены, поэтому новый источник __добавляется рядом новым сателлитом__, а существующие таблицы не переписываются. Руками такой SQL не пишут — его генерирует **AutomateDV** по метаданным.
    - **Activity / Event** — одна широкая таблица активностей: `entity_id`, `ts`, `activity`, полезная нагрузка. Признаки считаются оконными функциями по времени, и !!point-in-time получается почти бесплатно!!: у каждой строки уже есть её собственный момент. В ClickHouse ложится идеально — одна `MergeTree` с `ORDER BY (entity_id, ts)`.
    - За кадром остались ещё два: **3NF / EDW** — нормализованная корпоративная модель, и **Wide / OBT** — одна денормализованная таблица под потребителя. Витрина признаков — это по форме как раз OBT.

    **Для ML/MLOps:** в контексте ClickHouse и признаков выбор сводится к двум строкам. Kimball удобен, когда вокруг вас BI. Activity Schema удобнее, когда вокруг вас события и оконные признаки, — а у ML-задач это чаще так.

    **Осторожно:** три частых заблуждения, которые стоит назвать вслух.

    - «Medallion — это те же staging / intermediate / marts» — !!нет!!: это разные оси, уровень зрелости и слой DAG не совпадают.
    - «dbt требует звёздную схему» — не требует.
    - «`intermediate` обязателен» — не обязателен.
    - И главное: !!не выбирать подход под красоту схемы!!. Data Vault для одного продуктового источника — оверинжиниринг; Activity Schema для финансовой отчётности — мучение.

    **Переход:** ~~«Посмотрим, что из этого реально стоит взять под ML-витрину».~~
