# preza-dbt-v4-content.yml — WHAT deck: «Трансформация данных и витрины (dbt)».
#
# v4.4.0 — правка v4.3.0, доработка деки как цельной лекции:
#   * intro: «dbt за 60 секунд» и таймлайн «как появился dbt» (факты сверены с
#     dbt Labs / Snowflake / Fivetran на 2026-09-01); дубли в блоке ELT/AE/Viewpoint сняты;
#   * onboarding: первый проект на dbt Core, dbt_project.yml vs profiles.yml, shift-left;
#   * моделирование: слои DAG отделены от модели данных, таблица паттернов переписана
#     (Medallion — паттерн слоистости, а не методология моделирования сущностей);
#   * Airflow 3 + Cosmos: Dataset→Asset, airflow.sdk, AssetWatcher ≠ ExecutionMode.WATCHER;
#   * формулировки обобщены: «для MLE» осталось там, где речь реально про ML-специфику,
#     остальное — «Практический смысл»;
#   * факты выправлены: ускорение WATCHER, namespace dbt-expectations в приложении.
#
# v4.3.0 — правка v4.2.0, подстрочники докладчика (scripts/preza/notes_fix.py, идемпотентно):
#   * абсолютное время слайда «10:00-11:30» перед меткой [~N мин] — видно, идём ли по плану;
#   * короткий раздел («Главное», «Переход»…) — метка на своей строке и буллеты по
#     предложениям; длинный остаётся прозой;
#   * рендерер больше не схлопывает абзацы заметки: строка → абзац, пустая строка → пустой
#     абзац (сырой \n внутри <a:t> переносом не является, поэтому раньше выходила стена текста).
#
# v4.2.0 — правка v4.1.0: раздел «Картинки» в конце деки (иллюстрации, которым не нашлось
#   места на содержательных слайдах, + дубль жёлтых 🔍-ссылок), «Пакеты в деле» разрезаны
#   на подключение и контракт витрины, реестр картинок в content/preza-dbt-v4-images.yml.
#
# v4.1.0 — правка v4.0.1 по замечаниям к деке:
#   * название деки взято из расписания курса; подзаголовок с титульного снят;
#   * рамка «full-stack data specialist» убрана — аудитория и адресат теперь только MLE/DS;
#   * картинки вместо жёлтых 🔍-ссылок на поиск (см. .tmp/stage_pictures.py — какая откуда);
#   * слайды со схемой И картинкой: схема уезжает под текст в левую колонку (рендерер, R12);
#   * Jinja-слайды показывают ДВА кода — исходный и скомпилированный, разделённые чертой;
#   * блок слоёв развёрнут до четырёх слайдов, включая современные подходы к моделированию;
#   * CI разложен на pre-commit / CI-барьер / Slim CI;
#   * из Part 3 в основную часть подняты и расширены: команды dbt, dbt_project_evaluator, dbt и AI;
#   * добавлены логирование, exposures и agentic-пайплайны;
#   * теория DS/MLE, не привязанная к dbt, вынесена в PART 2 «DS/MLE нюансы».
#
# ДЗ удалено полностью; Olist — сквозной production ML example (delivery-delay prediction).
#
# Notes используют разметку эмфазы (settings.notes_emphasis) + абзацы через пустую строку.
