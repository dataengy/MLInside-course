    [~1.5 мин] **Главное:** Analytics Engineering — это не должность, придуманная вендором, а !!инженерный ответ на то, что трансформации стали production-кодом!!.

    **Рассказ:** картинка справа делит путь данных на три ответственности. **Data Engineering** приносит данные в хранилище: это E и L из ELT. **Analytics Engineering** отвечает за **T** — трансформации, модель данных, качество. **Analytics / Data Science** работает уже поверх готового слоя.

    Схема слева — формула роли. Трансформаций в SQL стало много, писали их аналитики, а инженерных практик вокруг SQL не было никаких: ни git-ревью, ни тестов, ни документации, ни объявленных зависимостей. __Analytics Engineering = ELT + практики разработки ПО.__

    **Для MLE:** запомните формулу — она понадобится через несколько слайдов, когда мы применим её к признакам.

    **Осторожно:** это не «история компании dbt Labs». Как именно появился инструмент — через два слайда, отдельным таймлайном.

    **Переход:** ~~«Сначала разберём, почему трансформации вообще переехали внутрь хранилища».~~
