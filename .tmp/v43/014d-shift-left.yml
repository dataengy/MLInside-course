- kind: content
  id: 014d-shift-left
  title: 'Shift left: ловим ошибку до CI'
  materials:
  - label: sqlfmt
    url: https://docs.sqlfmt.com/
  - label: SQLFluff
    url: https://docs.sqlfluff.com/
  code_caption: 'цена ошибки растёт слева направо — ловим как можно левее'
  code_lang: diagram
  code: |2
     ЛОКАЛЬНО, СЕКУНДЫ И МИНУТЫ         ЧТО ЭТО В МИРЕ PYTHON
     ────────────────────────────       ──────────────────────────
     правка .sql / .yml                 правка модуля
            ↓
     sqlfmt · SQLFluff                  black · ruff
            ↓
     dbt parse · dbt compile            проверка типов и импортов
            ↓
     dbt build -s модель+               pytest выбранного модуля
            ↓
     pre-commit                         pre-commit
     ────────────────────────────       ──────────────────────────
     push  →  Slim CI                   CI: обязательный барьер
            ↓
     прод-сборка по расписанию          деплой
  notes: |2
    [~1.5 мин] **Главное:** порядок проверок — это !!экономика обратной связи!!. Секунда локально стоит дешевле двадцати минут ожидания CI и несравнимо дешевле разбора в проде.

    **Рассказ:** слева — цикл, который стоит довести до автоматизма.

    - **Формат** — `sqlfmt` без настроек, в духе Black. Спорить о стиле в ревью больше не о чем.
    - **Линт** — `SQLFluff`: правила поверх формата, и он __понимает Jinja__, то есть не спотыкается о `{{ ref(...) }}`.
    - **Компиляция** — `dbt compile` отвечает на вопрос «шаблон вообще рендерится и все `ref` разрешаются». Это самая дешёвая проверка из всех: хранилище не трогается.
    - **Сборка куска** — `dbt build -s модель+`: только правленая модель и её потомки, а не весь проект.
    - **pre-commit** прогоняет всё это автоматически перед коммитом.

    **Практический смысл:** правая колонка — только для интуиции, а не строгое соответствие.

    - `dbt test` проверяет **данные**, а `pytest` — **код**; ближе всего к pytest стоят dbt unit-тесты.
    - `dbt compile` ловит не типы, а разрешимость ссылок и синтаксис шаблона.
    - Смысл сопоставления один: !!в SQL-слое существует ровно тот же набор рубежей, что и в Python-репозитории!!, и его надо просто включить.

    **Осторожно:** локальный рубеж !!не заменяет CI!!. `git commit --no-verify` пропускает все хуки, а окружение разработчика всегда чем-то отличается от чистого. Всё обязательное дублируется в пайплайне — разберём его в блоке про CI/CD.

    **Переход:** ~~«Инструмент понятен. Теперь главный вопрос проектирования: как раскладывать сами данные».~~
