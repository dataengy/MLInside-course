  notes: |2
    [~1 мин] **Главное:** таблица отвечает на один вопрос — !!что можно делать в каждом слое, а что нельзя!!.

    **Рассказ:** три правила, которые стоит проговорить вслух. В staging — одна модель на один источник, без джойнов: только чистка и типы. В intermediate появляются соединения, и здесь же !!фиксируется гранулярность!! — модель обязана называть, что такое одна её строка. В marts — витрины под конкретного потребителя.

    Ключевое отличие этой лекции от классического рассказа про dbt: !!marts — это не только BI!!. Feature mart — полноправная витрина, у которой потребитель не дашборд, а обучение.

    **Практический смысл:** гранулярность — источник самых дорогих ошибок. Заказ и позиция заказа в Olist различаются: 99 441 против 112 650 строк. Посчитаете «среднее по заказам» на позициях — многопозиционные заказы получат больший вес, и признак поедет.

    **Переход:** ~~«Что ломается, когда эти правила нарушают».~~
