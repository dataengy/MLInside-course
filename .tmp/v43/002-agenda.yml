- kind: agenda
  id: 002-plan-lekcii
  title: План лекции
  bullets:
  - 'Что такое dbt, откуда он взялся и зачем понадобился'
  - 'Роли вокруг данных и появление Analytics Engineering'
  - 'Первый проект: два конфига и цикл проверок до CI'
  - 'Моделирование: слои DAG и модель данных — разные решения'
  - 'Jinja, макросы и пакеты: исходник и скомпилированный SQL'
  - 'Тесты, документация, lineage: контракт feature-таблицы'
  - 'Инкрементальность, ClickHouse и point-in-time correctness'
  - 'Границы dbt: Python-модели, OpenDBT, когда не dbt'
  - 'Оркестрация: Airflow 3 + Cosmos, dmp-af, Dagster'
  - 'CI/CD, команды, качество проекта, логи и dbt + AI'
  notes: |2
    [~1.5 мин] **Главное:** у лекции сквозная линия — один пример Olist проходит через все блоки.

    **Рассказ:** пройти по плану быстро, отметив три опорные точки. Первая треть — что такое dbt, откуда он взялся и как завести первый проект. Середина — моделирование, Jinja, тесты и документация: то, из чего складывается feature layer. Последняя треть — инкрементальность, point-in-time, границы dbt и вывод всего этого в прод через оркестрацию и CI/CD.

    Сказать, что после основной части в деке есть ещё две: **PART 2 «DS/MLE нюансы»** и **PART 3 «Advanced / Appendix»** — справочник, который остаётся у слушателя.

    **Практический смысл:** предупредить, что домашнего задания в лекции нет — вместо него сквозной production-пример, который можно повторить у себя.

    **Переход:** ~~«Начнём с того, кто вообще делает трансформации и почему это стало отдельной инженерной ролью».~~
