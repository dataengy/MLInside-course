- kind: content
  id: 029-pakety-v-dele-na-olist
  title: 'Пакеты в деле: подключение и версии'
  image: pic-dbt-hub-packages.jpg
  bullets:
  - 'hub.getdbt.com — каталог: версии и совместимость'
  - 'Версию пиним диапазоном, а не «последняя»'
  - 'dbt deps скачивает, package-lock.yml фиксирует'
  code_caption: packages.yml
  code_lang: yaml
  code: |2
    packages:
      - package: dbt-labs/dbt_utils
        version: [">=1.3.0", "<2.0.0"]

      - package: metaplane/dbt_expectations
        version: [">=0.10.0", "<0.11.0"]
        # активный форк; calogica заброшен
  notes: |2
    [~1 мин] **Главное:** пакет — это !!зависимость!!, и обращаться с ней надо как с зависимостью кода: пинить версию и фиксировать то, что реально скачалось.

    **Разбор кода:** две записи в `packages.yml`. Версия задана !!диапазоном!!, а не «последней»: так минорные обновления приезжают сами, а мажорные — только осознанно. `dbt deps` их скачивает в `dbt_packages/`, а рядом появляется `package-lock.yml`.

    Правило: `dbt_packages/` в git __не__ коммитим, `package-lock.yml` — коммитим. Иначе воспроизводимости нет: у вас и в CI приедут разные версии.

    **Для MLE:** обратите внимание на комментарий у второй записи. Оригинальный репозиторий `calogica/dbt_expectations` больше не поддерживается — активная разработка переехала в namespace `metaplane`. Ставьте оттуда, а не по старым туториалам.

    **Пример:** картинка справа — каталог hub.getdbt.com. Там же видно, какие версии пакета совместимы с вашей версией dbt-core; это первое, что стоит проверять перед обновлением.

    **Переход:** ~~«А теперь то, ради чего их ставят, — контракт витрины признаков».~~
