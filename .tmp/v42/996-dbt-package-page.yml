    Карточка пакета на hub.getdbt.com: сниппет для `packages.yml`, README, список версий и — самое важное — !!требования к версии dbt-core!!.

    **Когда доставать:** на слайде «Пакеты: версии, обновление и риски», в момент про то, что обновление пакета — это отдельный merge request. Полезно показать пальцем, где именно смотреть совместимость: половина падений «после обновления» начинается с того, что эту строку никто не открыл.

    ~~Куда просилась: тот самый слайд из приложения. Там уже стоят панель `packages.yml` и пять буллетов — места под картинку остаётся 0.9 in при нужных 3.5.~~
