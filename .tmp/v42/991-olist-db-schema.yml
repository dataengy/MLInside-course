  notes: |2
    Полная схема БД Olist: девять таблиц, все колонки и связи. Она подробнее той ER-схемы, что стоит на слайде «Olist: сквозной пример лекции», — и именно поэтому не заменяет её, а дополняет.

    **Когда доставать:** если из зала спрашивают про конкретную колонку («а где хранится вес товара?», «чем `order_approved_at` отличается от `order_delivered_carrier_date`?»). На основном слайде такие подробности только мешают, а здесь есть всё.

    ~~Куда просилась: слайд «Olist: от сырых таблиц к витрине признаков» или «sources: контракт входа и freshness». На обоих панель кода занимает всю высоту, и картинка либо не помещается, либо выдавливает текст.~~
