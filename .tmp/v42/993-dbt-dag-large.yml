  - 'Куда просится: компиляция и DAG, либо lineage'
  - 'Почему не встала: там пара исходник/скомпилированное во всю высоту'
  notes: |2
    Граф зависимостей настоящего dbt-проекта — сотни узлов. Показывать её надо !!не для чтения, а для масштаба!!: одного взгляда достаточно, чтобы вопрос «зачем `ref()`, если можно написать имя таблицы» отпал сам.

    **Когда доставать:** на слайде «Что такое dbt: компиляция, ref() и DAG» — сразу после фразы про то, что порядок сборки выводится из графа. И второй раз на «Lineage: два вопроса и один граф», если нужно показать, что селекторы `+модель` / `модель+` — не роскошь, а единственный способ ориентироваться в таком графе.

    ~~Куда просилась: оба этих слайда. На первом панель занята парой «исходник / скомпилированное», на втором уже стоит скриншот lineage из dbt docs.~~
