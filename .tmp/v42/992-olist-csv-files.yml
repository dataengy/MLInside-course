  notes: |2
    Список CSV-файлов датасета в проводнике плюс схема связей. Картинка полезна одним: она показывает, что !!«источник» — это просто файлы!!, которые кто-то положил в хранилище, и dbt их не создаёт.

    **Когда доставать:** на слайде про `sources`, если по залу видно, что граница «dbt объявляет, а не грузит» не считалась. Одного взгляда на папку с CSV обычно достаточно.

    ~~Куда просилась: «sources: контракт входа и freshness». Там YAML-панель занимает всю высоту слайда — для картинки не остаётся ни колонки, ни места под буллетами.~~
