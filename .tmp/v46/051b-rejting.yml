- kind: content
  id: 051b-korotkij-rejting-zapuska
  title: 'Короткий рейтинг: чем запускать dbt из Airflow'
  image: pic-airflow-dbt-rating.png
  bullets:
  - 'Cosmos — 9.5: гранулярность на модель при средней сложности'
  - 'Cosmos + Watcher/K8s — 9.3: то же плюс изоляция исполнения'
  - 'BashOperator — 7.0: просто и популярно, но граф не виден'
  - 'custom manifest.json → DAG — 4.5: полный контроль дорого стоит'
  - 'Cosmos и Kubernetes не конкурируют — это разные слои'
  materials:
  - label: Cosmos docs
    url: https://astronomer.github.io/astronomer-cosmos/
  notes: |2
    [~1 мин] **Главное:** это !!субъективный рейтинг лектора!!, а не отраслевой бенчмарк — колонка так и называется, «Мой балл». Ценность не в цифрах, а в том, что восемь способов разложены по одним и тем же осям.

    **Рассказ:** таблица читается по колонкам: сложность внедрения, популярность, тренд, контроль над dbt-графом, изоляция исполнения — и итоговый балл.

    Верх таблицы: **Astronomer Cosmos** 9.5 и **Cosmos + Watcher/K8s** 9.3 — оба дают контроль над графом на пять звёзд, различаются изоляцией. **dbt Cloud Provider** 8.4 — просто, но управление уезжает в подписку. **KubernetesPod / ECS / Cloud Run + dbt CLI** 8.0 — отличная изоляция ценой того, что граф снова становится одной задачей.

    Низ: **BashOperator + dbt CLI** 7.0 — честный первый шаг, мы про него говорили; **airflow-dbt-python** 6.5; **custom manifest.json → DAG** 4.5 — полный контроль при сложности 9/10, то есть свой Cosmos, который потом сопровождать вам; **legacy airflow-dbt** 3.0 — не брать.

    **Практический смысл:** нижняя строка картинки — то, ради чего слайд стоит показывать. !!Cosmos и Kubernetes не взаимоисключающи.!! Cosmos — слой интеграции и рендеринга графа в задачи Airflow; Local, Kubernetes, ECS и Cloud Run — слой исполнения. Их выбирают независимо, и именно поэтому строка «Cosmos + Watcher/K8s» стоит так высоко.

    **Осторожно:** цифры — оценка одного человека на конкретном опыте, а «Тренд 2026» тем более. Показывать как повод для разговора, а не как результат замеров.

    **Переход:** ~~«Начнём с Cosmos — это основной рекомендуемый вариант для нашего примера».~~
