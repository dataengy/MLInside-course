     ЧТО ВЫ УНОСИТЕ

     1. Подготовка признаков — инженерный слой, а не набор скриптов
     2. Тест — предусловие обучения, а не отчёт о качестве
     3. Point-in-time correctness SQL за вас не проверит
     4. Граница dbt проходит по training dataset
  notes: |2
    [~1.5 мин] **Главное:** финальный тезис лекции, произнести его вслух целиком.

    **Рассказ:** !!dbt — не инструмент «для аналитиков» и не замена ML-пайплайна.!! Это способ превратить слой трансформаций и признаков в software-engineered компонент production data/ML-системы: версионируемый, модульный, тестируемый, документированный, инкрементальный, наблюдаемый и оркеструемый.

    Семь свойств в середине схемы — это ровно те восемь пунктов, с которых мы начинали, только теперь за каждым стоит конкретный механизм, который мы разобрали.

    Обратить внимание на развилку под слоем: одна и та же витрина кормит !!три разных потребителя!! — обучающую выборку, батч-инференс и обычную аналитику. Это и есть главный аргумент в пользу того, чтобы держать её общей, а не заводить свою в каждом ноутбуке.

    **Для MLE:** четыре пункта внизу — то, что стоит унести, если всё остальное забудется. Третий проговорить отдельно: !!point-in-time correctness — единственное свойство из этого списка, которое ни один тест не проверит за вас!!.

    **Переход:** ~~«Проверим себя вопросами».~~
