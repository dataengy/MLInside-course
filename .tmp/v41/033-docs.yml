- kind: content
  id: 033-docs-i-lineage-pasport-priznaka
  title: 'docs: паспорт признака рядом с кодом'
  image: pic-dbt-docs-model.png
  bullets:
  - 'description у модели и у колонки — рядом с кодом, в одном PR с ним'
  - 'docs-блок переиспользуется, чтобы определение не разъехалось'
  - 'meta — владелец, тип признака, список потребителей'
  - 'dbt docs generate → сайт с описаниями, типами и тестами каждой колонки'
  code_caption: models/marts/_marts__models.yml
  code_lang: yaml
  code: |2
    models:
      - name: mart_delivery_features
        description: '{{ doc("delivery_features") }}'
        meta:
          owner: ml-platform
          layer: feature_mart
          consumers: [delivery_delay_model]
        columns:
          - name: seller_avg_delay_90d
            description: >
              Средняя просрочка продавца
              за 90 дней ДО момента покупки.
              Считается point-in-time.
            meta: {feature_type: numeric}
  notes: |2
    [~2 мин] **Главное:** документация в dbt лежит !!в том же PR, что и SQL!!, — и поэтому она не устаревает так же быстро, как вики.

    **Разбор кода:** обратить внимание на описание `seller_avg_delay_90d`. Это не «средняя просрочка продавца». Это определение с оговоркой про point-in-time — то есть !!в описании зафиксировано ML-свойство признака!!.

    Картинка справа — то, во что это превращается: страница модели в `dbt docs` с описанием, списком колонок, их типами, ограничениями и тестами. Всё, что вы написали в YAML, стало навигируемым справочником.

    Не разбирать: синтаксис `doc()`-блоков.

    **Для MLE:** `meta` — недооценённое поле. Владелец, тип признака, список моделей-потребителей. Когда через полгода кто-то захочет поменять эту колонку, эти три строки скажут, кого предупредить.

    **Осторожно:** `dbt docs` — это сайт по метаданным проекта, а не корпоративный data catalog. Не продавайте его как замену каталогу.

    **Переход:** ~~«Вторая половина той же истории — граф».~~
