    [~2 мин] **Главное:** Analytics Engineering — это не должность, придуманная вендором, а !!инженерный ответ на то, что трансформации стали production-кодом!!.

    **Рассказ:** сначала картинка справа — она делит путь данных на три ответственности. **Data Engineering** приносит данные в хранилище: это E и L из ELT. **Analytics Engineering** отвечает за **T** — трансформации, модель данных, качество. **Analytics / Data Science** работает уже поверх готового слоя.

    Дальше схема слева — три эпохи. В **ETL** трансформации жили вне хранилища: отдельный движок, отдельный compute, логика в Python или Spark. Потом появились дешёвые облачные DWH — Snowflake, BigQuery, Redshift, а у нас чаще ClickHouse — и стало выгоднее грузить сырьё как есть и считать внутри базы. Это **ELT**.

    И тут вылезла проблема: SQL-трансформаций стало много, писали их аналитики, а инженерных практик вокруг SQL не было никаких. Ни git-ревью, ни тестов, ни документации, ни зависимостей. __Analytics Engineering = ELT + практики разработки ПО.__ dbt появился именно как инструмент для этого (2016, Fishtown Analytics, ныне dbt Labs).

    **Для MLE:** запомните формулу — она понадобится через два слайда, когда мы применим её к признакам.

    **Осторожно:** это не «история компании dbt Labs». Если студент спросит про раунды и продукты — отправить в Part 3.

    **Переход:** ~~«Разберём отдельно, почему трансформации переехали внутрь хранилища».~~
