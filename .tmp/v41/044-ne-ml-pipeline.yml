      ГДЕ ГРАНИЦА:    dbt отвечает за ТАБЛИЦЫ, ML-стек — за МОДЕЛЬ
      ЧАСТАЯ ОШИБКА:  тащить обучение в dbt · и наоборот — считать dbt SQL-раннером
