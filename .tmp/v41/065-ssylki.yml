    [~1 мин] **Главное:** список проверенных материалов, все ссылки рабочие на момент подготовки лекции.

    **Рассказ:** перечислить по группам, не зачитывая URL.

    **dbt** — документация docs.getdbt.com, каталог пакетов hub.getdbt.com и Viewpoint, с которого всё начиналось. Отдельно стоит гайд «How we structure our dbt projects» — это лучший короткий текст про слои.

    **Эксплуатация** — синтаксис селекторов, страница про логи и события, разделы про exposures и contracts. Это три места, куда возвращаются чаще всего.

    **Cosmos** — официальный гайд Astronomer, документация проекта и книга «Orchestrating dbt with Apache Airflow using Cosmos». Из видео — ролик Astronomer «Get started with dbt and Airflow using Cosmos».

    **dmp-af** — github.com/dmp-labs/dmp-af, README и примеры в каталоге examples. ~~Отдельного официального видеокурса найти не удалось — если знаете, поделитесь.~~

    **Dagster** — раздел интеграции с dbt в официальной документации; подробнее в отдельной лекции курса.

    **OpenDBT и dlt** — расширение dbt-core без форка и загрузка данных внутри моделей.

    **Качество** — dbt_project_evaluator и dbt-score.

    **AI** — dbt MCP (официальный сервер) и dbt Copilot.

    **Осторожно:** ссылки живут своей жизнью. Перед тем как рекомендовать пакет или проект студентам, проверяйте текущий статус репозитория.

