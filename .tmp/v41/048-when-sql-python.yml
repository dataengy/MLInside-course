  notes: |2
    [~2 мин] **Главное:** таблица для выбора инструмента, а не для запоминания. Читать её надо по третьей колонке — там сформулирован !!распознаваемый сигнал!!, а не абстрактный критерий.

    **Рассказ:** проговорить критерий каждой строки.

    **SQL** — по умолчанию. Сигнал простой: вы можете описать нужный результат как SELECT, не рассуждая о порядке обработки строк. Если можете — пишите SQL, он дешевле, переносимее и попадает в граф.

    **Python** — когда в SQL пришлось бы эмулировать то, чего в нём нет: обучение, итеративный алгоритм, вызов внешней функции. Сигнал — вы ловите себя на попытке написать цикл. Цена ошибки здесь конкретная: код будет работать на выборке и упадёт на объёме, потому что данные едут в память.

    **Не dbt** — когда задача не про создание таблицы в хранилище. Это самая дорогая ошибка из трёх: !!попытка затащить обучение или сервинг в dbt!! превращает его в плохой оркестратор и плохой сервер одновременно. Обучение живёт в оркестраторе рядом с dbt, а не внутри него.

    **Для MLE:** практическая проверка перед тем, как писать Python-модель — два вопроса. Сколько строк приедет в память и что произойдёт с этим числом через год. Если ответ «столько же» — можно; если «в двадцать раз больше» — ищите SQL-формулировку.

    **Осторожно:** граница между строками подвижна и зависит от платформы. На ClickHouse вторая строка пока пустая — Python-моделей нет, и остаётся либо OpenDBT с локальным исполнением, либо шаг в оркестраторе.

    **Переход:** ~~«Раз обучение живёт снаружи — нужен тот, кто соединит dbt и обучение. Переходим к оркестрации».~~
