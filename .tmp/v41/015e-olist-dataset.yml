  notes: |2
    [~1.5 мин] **Главное:** один пример пройдёт через всю лекцию. Стоит потратить полторы минуты, чтобы дальше не объяснять, что такое `order_items`.

    **Рассказ:** показать ER-схему справа. Центр — `orders`. От него отходят позиции заказа, клиент и, через позиции, продавцы и товары. Отдельно стоит `geolocation`, связанная не по id, а по !!zip-префиксу!! — это пригодится, когда будем считать расстояние.

    Отдельно проговорить цифру на схеме слева: !!99 441 заказ против 112 650 позиций!!. Это два разных уровня гранулярности в одном датасете, и почти все ошибки в этой лекции будут именно про них.

    **Для MLE:** целевая задача — `is_late_delivery`: приехал ли заказ позже обещанной даты. Признаки собираем из размера и стоимости заказа, географии, времени покупки и истории продавца.

    **Осторожно:** датасет статический и историчный. Всё, что мы будем говорить про freshness и late arrivals, придётся представлять — в самих данных этого нет.

    **Переход:** ~~«Посмотрим, как эти таблицы превращаются в витрину признаков».~~
