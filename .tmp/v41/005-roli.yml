  title: 'Кто делает трансформации: стык, на котором стоит MLE'
  image: pic-roles-de-ae-da.png
  bullets:
  - 'Между DE и потребителем данных всегда есть слой трансформаций'
  - 'Исторически его вели Analytics Engineer и Data Analyst'
  - 'У ML Engineer тот же слой — только потребитель не дашборд, а обучение'
  - 'LLM и агенты удешевили работу через границу ролей, но не убрали её'
  - 'Значит выигрывает тот, кто может закрыть этот слой сам, инженерно'
  code_lang: diagram
  code: |2
      DevOps ─→ DE ─→ AE ─→ DA / BI
                       │
                       └──→ MLE / MLOps
                             признаки
                             обучение
  notes: |2
    [~1.5 мин] **Главное:** трансформации — это !!общий стык!!, а не чужая зона. Аналитик и ML-инженер стоят на одном и том же слое, просто с разных сторон.

    **Рассказ:** показать картинку справа: три роли вокруг одних данных — Data Engineer тащит данные, Analytics Engineer их превращает в пригодные, Data Analyst делает из них выводы. Дальше показать схему слева и добавить четвёртую ветку: от того же слоя трансформаций отходит !!MLE!!, и ему нужно ровно то же самое — чистые, названные, проверенные таблицы.

    **Для MLE:** практический вывод один. Ждать, пока витрину сделает соседняя команда, — это очередь, а очередь превращается в теневой pandas-скрипт. Уметь закрыть этот слой самому дешевле, чем кажется, если брать готовый инструмент, а не строить платформу.

    **Осторожно:** не подавать это как «роли отмирают». Разделение труда в крупных системах остаётся необходимым; меняется только стоимость перехода через границу.

    **Переход:** ~~«У аналитиков эта же боль случилась на десять лет раньше. Посмотрим, чем они её вылечили».~~
