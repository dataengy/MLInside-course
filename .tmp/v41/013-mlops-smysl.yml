- kind: content
  id: 013-mlops-smysl-konceptov-dbt
  title: 'MLOps-смысл ключевых концепций dbt'
  code_lang: diagram
  code: |2
     МЕХАНИЗМ dbt          ВОПРОС ML-ЭКСПЛУАТАЦИИ, НА КОТОРЫЙ ОН ОТВЕЧАЕТ
     ─────────────────     ────────────────────────────────────────────────────────────

     source()          ──→ откуда пришли данные для признака и кто за них отвечает
     freshness         ──→ данные за сегодня вообще доехали или витрина пересчиталась зря
     ref()             ──→ граф зависимостей: что сломается, если я поправлю stg_orders
     test              ──→ можно ли сегодня учиться на этой таблице — да или нет
     unit test         ──→ верна ли САМА логика признака, а не только данные под ней
     docs / meta       ──→ что означает delivery_delay_days, кто владелец, кто потребитель
     incremental       ──→ сколько стоит обновить признаки за вчера, а не за три года
     snapshot          ──→ каким был статус заказа на дату, если источник хранит только «сейчас»
     exposure          ──→ какие модели и дашборды сломаются, если я удалю эту витрину
     state:modified    ──→ что именно я тронул в этом PR и что надо пересобрать
     CI                ──→ кто проверил, что новый признак не сломал обучающую выборку
     orchestrator      ──→ когда можно запускать training: после зелёного dbt build

     ─────────────────────────────────────────────────────────────────────────────────
     ИТОГ:  «фича dbt» = машинный ответ на вопрос, который раньше решался перепиской
  notes: |2
    [~3 мин] **Главное:** каждая «фича dbt» — это ответ на конкретный вопрос MLOps. Если студент унесёт из лекции один слайд, пусть это будет этот.

    **Рассказ:** идти по строкам медленно, на каждой давать один вопрос из практики. Полностью зачитывать не нужно — возьмите шесть строк, отмеченных ниже, остальные студент прочитает сам.

    `source()` — «откуда взялась эта колонка?». Объявленный источник даёт ответ в коде, а не в переписке.

    `ref()` — «что сломается, если я изменю stg_orders?». Граф отвечает за секунды: `dbt build --select stg_orders+`.

    `test` — «можно ли учиться на этой таблице сегодня?». Тест — это !!предусловие обучения!!, а не отчёт о качестве.

    `docs` — «что означает delivery_delay_days и кто владелец?». Определение лежит рядом с кодом и не расходится с ним.

    `incremental` — «сколько стоит обновить признаки за вчера?». Разница между полным сканом истории и одним днём — это ваш счёт за compute.

    `orchestrator` — «когда можно запускать обучение?». Ответ: !!когда dbt build прошёл вместе с тестами!!, и никак иначе.

    **Для MLE:** это переводная таблица между двумя словарями. Держите её под рукой, когда будете объяснять коллегам, зачем вам dbt. Строки `exposure` и `snapshot` разберём отдельно — они реже на слуху, но закрывают частые вопросы.

    **Осторожно:** не превращать в перечисление возможностей. Каждая строка — это вопрос, на который раньше не было машинного ответа.

    **Переход:** ~~«Дальше — как это работает изнутри: что dbt на самом деле делает с вашим SQL».~~
