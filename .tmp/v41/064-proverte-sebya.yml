    [~1.5 мин] **Главное:** тринадцать вопросов — это карта лекции. Если студент отвечает на все, цель достигнута.

    **Рассказ:** не читать список вслух целиком. Выбрать три вопроса и задать их залу: девятый (point-in-time), тринадцатый (граница dbt и ML) и четвёртый (SQL или Python). Это те три, где чаще всего остаются пробелы.

    **Для MLE:** предложить сохранить слайд как чек-лист перед собеседованием — вопросы сформулированы ровно так, как их задают.

