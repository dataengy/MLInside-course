- kind: content
  id: 061f-kachestvo-proekta
  title: 'dbt_project_evaluator и соседи: качество самого проекта'
  bullets:
  - 'Шесть групп правил: граф, тесты, документация, структура, производительность, governance'
  - 'Ловит нарушения слоёв — join в source мимо staging, rejoin, fanout, модели без потомков'
  - 'Результат — не отчёт в консоли, а fct_-модели и тесты: их можно завалить в CI'
  - 'int_all_dag_relationships отдаёт весь DAG таблицей — свои правила пишутся SQL-ом'
  - 'Исключения оформляются seed-ом, правило остаётся включённым для остальных'
  - 'Рядом: dbt-score (балл 0–10 за метаданные), elementary (аномалии), audit_helper (диффы витрин)'
  materials:
  - label: dbt-project-evaluator
    url: https://github.com/dbt-labs/dbt-project-evaluator
  - label: dbt-score (Picnic)
    url: https://github.com/PicnicSupermarket/dbt-score
  - label: elementary
    url: https://github.com/elementary-data/elementary
  code_caption: подключение и прогон как part of CI
  code_lang: yaml
  code: |2
    # packages.yml
    packages:
      - package: dbt-labs/dbt_project_evaluator
        version: [">=0.14.0", "<0.15.0"]

    # dbt_project.yml — ClickHouse и ряд адаптеров
    # требуют явного dispatch
    dispatch:
      - macro_namespace: dbt
        search_order: ['dbt_project_evaluator', 'dbt']

    # осознанное исключение — seed, а не отключение правила
    # seeds/dbt_project_evaluator_exceptions.csv
    #   fct_name,column_name,id_to_exclude
    #   fct_source_fanout,child,stg_order_items

    # в CI
    #   dbt build --select package:dbt_project_evaluator
  notes: |2
    [~2 мин] **Главное:** слои и правила из начала лекции держатся ровно до первого дедлайна. **dbt_project_evaluator** — это !!автоматическая проверка тех самых договорённостей!!.

    **Рассказ:** он проверяет шесть групп правил: **устройство графа** (join в source мимо staging, rejoin уже соединённых сущностей, fanout, модели без потомков), **покрытие тестами и документацией**, **структуру** (именование и раскладка по каталогам), **производительность** (цепочки вьюх там, где нужна таблица) и **governance**.

    Ключевая деталь — !!формат результата!!. Это не текстовый отчёт, который прочитают один раз: пакет собирает `fct_`-модели с нарушениями и обычные dbt-тесты поверх них, поэтому его можно поставить в CI и __завалить сборку__. Таблица `int_all_dag_relationships` отдаёт весь граф строками, и по ней пишутся собственные правила обычным SQL.

    Про исключения — важно. Если нарушение осознанное, оно оформляется строкой в seed-е, и правило !!продолжает действовать для всех остальных моделей!!, а не отключается целиком.

    **Для MLE:** рядом стоят ещё три инструмента, и они закрывают разное. **dbt-score** (pip, не dbt-пакет) оценивает метаданные модели по правилам и выдаёт балл 0–10 — на этом строят гейт «описания и владельцы обязательны». **elementary** ловит аномалии объёма и свежести и держит историю прогонов. **audit_helper** сравнивает старую и новую версию витрины — это ровно то, что нужно после рефакторинга признака.

    **Осторожно:** ставить evaluator на зрелый проект без подготовки — значит получить триста нарушений и закрыть вкладку. Правильный ход — включить одну группу правил, починить, включить следующую.

    **Переход:** ~~«Ещё один инструмент отладки, про который вспоминают в три часа ночи, — логи».~~
