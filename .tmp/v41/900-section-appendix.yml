  title: PART 3 · ADVANCED / APPENDIX
  notes: |2
    **Не входит в хронометраж лекции.** Здесь собран материал, который не нужен для базовой ментальной модели ML Engineer, но регулярно всплывает на практике.

    Что дальше: продукты и редакции dbt (Core, Cloud, Fusion), инструментарий и редакторы, кросс-СУБД макросы и `adapter.dispatch`, Data Vault и AutomateDV, гранты и права, управление пакетами, снапшоты, ClickHouse-специфика (materialized view, микробатчинг), потоковые данные, Semantic Layer, куда идёт сам dbt, а также альтернативы — SQLMesh и другие декларативные подходы.

    Что из прежнего приложения переехало в основную часть: команды dbt, `dbt_project_evaluator`, слои и подходы к моделированию, dbt и AI.

    Использовать как справочник или как материал для второй части курса.
