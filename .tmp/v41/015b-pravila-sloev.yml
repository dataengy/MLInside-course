  title: 'Правила слоёв: что ломается и чем это ловится'
  image: pic-model-layers-principles.jpg
  bullets:
  - 'Витрина читает source мимо staging — источник меняется, ломается витрина'
  - 'Джойн в staging — гранулярность поехала там, где её никто не проверяет'
  - 'Rejoin уже соединённых сущностей — дубли, которые не видно глазами'
  - 'Модель без потомков — мёртвый код, который всё равно считается каждую ночь'
