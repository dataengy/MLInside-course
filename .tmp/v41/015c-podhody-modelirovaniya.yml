    rows:
    - - Medallion
      - Три уровня зрелости данных
      - bronze → silver → gold
      - 'sources → staging/intermediate → marts: словарь другой, слои те же'
      - Ничего не говорит про моделирование внутри уровня
    - - Классический EDW (Kimball)
      - Факты и измерения вокруг бизнес-процесса
      - raw → stg → core/DDS → rep
      - 'intermediate строит dim_/fct_, marts — витрины поверх них'
      - Изменение источника требует переделки измерений
    - - Data Vault 2.0
      - 'Ключ, связь и атрибуты — раздельно'
      - raw vault (hub/link/sat) → business vault → marts
      - Модели генерирует AutomateDV по метаданным, сателлиты incremental
      - Таблиц в разы больше, читать напрямую нельзя
    - - Activity Schema
      - Одна таблица событий «кто · когда · что сделал»
      - stream (одна широкая таблица) → features
      - 'Одна incremental-модель + макросы на оконные срезы; в ClickHouse ложится очень хорошо'
      - Плохо подходит для классической BI-отчётности
