- kind: content
  id: 058-a-esli-dagster
  title: 'А если мы используем Dagster?'
  image: pic-lineage-model-monitor.png
  bullets:
  - 'Другая ментальная модель: не задачи, а data assets'
  - 'Модель dbt = asset; манифест разворачивается в набор ассетов'
  - 'Lineage общий для dbt-моделей и downstream ML-ассетов'
  - 'Витрина признаков и обученная модель — узлы одного графа'
  - 'Запускается селекцией ассетов, а не перебором задач'
  materials:
  - label: Dagster + dbt
    url: https://docs.dagster.io/integrations/libraries/dbt
  code_lang: diagram
  code: |2
     Airflow        Dagster
     ──────────     ──────────────
     задача         ассет
     «что делать»   «что должно
                     существовать»

     dbt-модель     dbt-модель
       = task         = asset
                        ↓
                   training dataset
                        ↓
                   trained model
  notes: |2
    [~1.5 мин] **Главное:** Dagster мыслит !!ассетами!!, а не задачами, и для ML-графа это ложится естественно.

    **Рассказ:** объяснить разницу одной фразой: в Airflow вы описываете, что нужно сделать; в Dagster — что должно существовать и из чего оно получается. Для dbt это подходит идеально: модель и есть ассет.

    Картинка справа — как это выглядит на практике: слева обычные staging-модели, дальше витрины, а справа граф !!не заканчивается на таблицах!!. `model_monitor`, `prediction`, метрики — это тоже узлы, и они стоят в том же lineage, что и `stg_*`. Ровно за это Dagster и любят в ML-командах: граница между «данными» и «моделью» в интерфейсе исчезает.

    **Для MLE:** практическое следствие — вопрос «что пересчитать, если поменялась одна колонка» получает ответ, который включает модель, а не обрывается на витрине.

    **Осторожно:** не углубляться. !!Dagster подробно разбираем в отдельной лекции курса!! — сейчас цель дать карту, а не научить.

    **Переход:** ~~«Последний кусок инженерной дисциплины — CI/CD».~~
