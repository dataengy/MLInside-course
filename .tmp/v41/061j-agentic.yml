- kind: content
  id: 061j-agentic-data-pipelines
  title: 'Agentic data pipelines: где в них место dbt'
  code_lang: diagram
  code: |2
      ЧЕЛОВЕК: «добавь признак — доля отменённых заказов продавца за 30 дней»
                                      │
                                      ↓
     ┌────────────────────────────────────────────────────────────────────────┐
     │                            А Г Е Н Т                                   │
     │                                                                        │
     │  1. ЧИТАЕТ контекст   ──→  dbt MCP: модели, колонки, lineage, метрики   │
     │  2. ПИШЕТ изменение   ──→  правка .sql + запись теста в schema.yml      │
     │  3. ПРОВЕРЯЕТ себя    ──→  dbt compile · dbt build -s <модель>+         │
     │  4. ЧИТАЕТ результат  ──→  json-логи, run_results.json, тесты           │
     │  5. ЧИНИТ и повторяет ──→  цикл, пока тесты не зелёные                  │
     └────────────────────────────────────┬───────────────────────────────────┘
                                          ↓
                                    Pull Request
                                          │
     ┌────────────────────────────────────┴───────────────────────────────────┐
     │  БАРЬЕРЫ, КОТОРЫЕ АГЕНТ НЕ ПРОХОДИТ САМ                                 │
     │  · code review человеком        · Slim CI: state:modified+ --defer      │
     │  · contract витрины (enforced)  · quality gate перед обучением          │
     └────────────────────────────────────────────────────────────────────────┘

      ПОЧЕМУ ЭТО РАБОТАЕТ ИМЕННО С dbt:  у агента есть ОБРАТНАЯ СВЯЗЬ —
      компиляция, тесты и граф дают проверяемый ответ «получилось / нет»
  notes: |2
    [~2 мин] **Главное:** dbt оказался !!удобной средой для агента!! не из-за AI-функций, а из-за свойства, которое было у него всегда: у каждого действия есть машинно проверяемый результат.

    **Рассказ:** пройти по циклу на схеме. Агент читает контекст через MCP — не гадает, а спрашивает про модели и колонки. Пишет правку. Дальше !!ключевой шаг!!: он сам себя проверяет — `dbt compile` скажет, рендерится ли шаблон, `dbt build -s модель+` соберёт изменённое с тестами, json-логи и `run_results.json` дадут структурированный ответ, что именно упало. Не «кажется, работает», а красное или зелёное.

    Именно поэтому агентные сценарии в dbt получаются лучше, чем в произвольном ETL-коде: там нет ни компиляции без запуска, ни графа, ни тестов как первого класса.

    **Для MLE:** нижний блок — самое важное на слайде. Агент проходит цикл до PR, но !!не проходит барьеры!!: ревью человеком, Slim CI в чистом окружении, контракт витрины и quality gate перед обучением. Эти четыре вещи вы строили всю лекцию — и они же оказываются тем, что делает агента безопасным. Пайплайн без них не станет «агентным», он станет непредсказуемым.

    **Пример:** практическая формулировка задачи агенту, которая работает: не «сделай витрину», а «добавь признак X, напиши на него тест, убедись, что `dbt build -s mart_delivery_features+` зелёный, покажи диффом, что изменилось только в этой колонке».

    **Осторожно:** отдельный риск — !!тесты, написанные тем же агентом, что и код!!. Он честно сделает их зелёными. Контракт признака (что в нём допустимо, а что нет) должен приходить от человека — из описания задачи, а не выводиться из данных.

    **Переход:** ~~«Соберём итоговую картину признаков Olist».~~
