    [~1.5 мин] **Главное:** dbt начался не с кода, а с текста. **Viewpoint** — это список практик, а инструмент был написан, чтобы их стало возможно соблюдать.

    **Рассказ:** прочитать вслух главный тезис: !!«аналитическая работа — это разработка ПО»!!. Из него выводится всё остальное: раз это разработка, значит нужны версии, ревью, окружения, тесты, документация и переиспользование. В 2016-м это звучало непривычно: SQL-запросы жили в BI-инструменте, в почте и в головах.

    Показать таблицу слева — она переводит каждый пункт манифеста в конкретный механизм dbt, который мы сегодня разберём. Картинка справа напоминает, между кем этот слой стоит.

    **Для MLE:** та же логика применима к признакам дословно. Замените «аналитическая работа» на «подготовка признаков» — и получите список того, чего вашему feature layer сегодня не хватает.

    **Осторожно:** Viewpoint — исторический документ, а не спецификация продукта. Часть формулировок про «данные доступны всем» плохо стыкуется с требованиями к персональным данным; читать его стоит как манифест, а не как политику доступа.

    **Переход:** ~~«А теперь узнайте в этом описании себя».~~
