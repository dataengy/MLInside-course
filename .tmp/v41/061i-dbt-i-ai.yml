  code_caption: dbt MCP — подключение агента к проекту
  code_lang: json
  code: |2
    {
      "mcpServers": {
        "dbt": {
          "command": "uvx",
          "args": ["--from", "dbt-mcp", "dbt-mcp"],
          "env": {
            "DBT_PROJECT_DIR": "/repo/olist_dbt",
            "DBT_PATH": "/usr/local/bin/dbt",
            "DISABLE_SEMANTIC_LAYER": "true"
          }
        }
      }
    }

    # что получает агент: список моделей и колонок,
    # компиляцию, lineage, запуск dbt build/test,
    # метрики Semantic Layer — вместо угадывания схемы
  notes: |2
    [~2 мин] **Главное:** полезен не «ИИ, который пишет SQL», а !!ИИ, у которого есть контекст проекта!!. Разница между этими двумя вещами — MCP.

    **Рассказ:** три уровня.

    **dbt Copilot** — встроенный ассистент dbt Cloud: генерирует модели, тесты, описания и определения метрик, опираясь на ваш проект. Полезен на рутине — описать сорок колонок руками никто не хочет.

    **dbt MCP** — официальный сервер от dbt Labs, и для нас самое практичное. Он отдаёт агенту !!структурированный доступ!!: список моделей и колонок, скомпилированный SQL, граф зависимостей, запуск `dbt build` и `dbt test`, метрики Semantic Layer. Без него ассистент угадывает схему по обрывкам файлов; с ним — спрашивает.

    **dbt Wizard** — агент, заточенный не под «напиши SQL», а под весь цикл аналитической инженерии: разобраться в чужом проекте, внести правку, проверить результат. Для измерения dbt Labs сделали **ADE-bench** — бенчмарк задач дата-инженерии; по их публикации Wizard берёт около 76 % на наборе из 75 задач. Цифра вендорская, относиться к ней стоит соответственно, но сам бенчмарк — полезная попытка мерить агентов на реальной работе.

    Техническая деталь, которая связывает всё: **Parquet-артефакты** dbt Core v2 агент читает запросом. Именно поэтому «дать модели контекст проекта» перестало означать «скормить гигантский manifest.json».

    **Для MLE:** самый окупаемый сценарий — не генерация витрины с нуля, а !!рутина вокруг неё!!: описания колонок, черновики тестов, разбор чужой модели, поиск того, что сломается от правки.

    **Осторожно:** сгенерированный SQL — это !!код!!, и он проходит ревью, тесты и CI наравне с написанным руками. Особенно тесты: ассистент охотно пишет `not_null` там, где NULL допустим по смыслу.

    **Переход:** ~~«И следующий шаг: агент не как ассистент, а как участник пайплайна».~~
