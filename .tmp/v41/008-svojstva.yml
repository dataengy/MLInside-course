  title: 'dbt: восемь инженерных свойств слоя трансформаций'
  image: pic-dbt-overview.png
  bullets:
  - 'Version control — SQL-модель лежит в git, как и код обучения'
  - 'Modularity — модель ссылается на модель, а не копирует её текст'
  - 'Testing — данные проверяются контрактом до того, как их увидит модель'
  - 'Documentation — определение признака, владелец, семантика поля'
  - 'Lineage — виден граф: от source до training dataset'
  - 'Incremental — не пересчитываем всю историю признаков'
  - 'CI — изменение SQL проходит ревью и автотесты'
  - 'Orchestration — сборка встраивается в общий production-пайплайн'
  materials:
  - label: What is dbt
    url: https://docs.getdbt.com/docs/introduction
  notes: |2
    [~1.5 мин] **Главное:** это ровно тот список практик, который у Python-кода считается нормой, а у SQL-трансформаций почему-то нет.

    **Рассказ:** быстро, по строке. Ключевая мысль: !!ни одно из свойств не уникально для dbt!! — уникально то, что все восемь получаешь из коробки, без сборки своей платформы.

    Картинка справа — та же мысль одной схемой: слева загрузчики и сырьё, справа потребители (Data Science и BI), а между ними прямоугольник dbt, внутри которого перечислено то же самое — snapshot, transform, test, deploy, document, плюс сквозные version control, alerting и logging.

    **Для MLE:** именно этот список делает dbt интересным ML-инженеру. Он позволяет одному человеку держать слой трансформаций инженерным способом, не строя вокруг него отдельную команду.

    **Осторожно:** не превращать в маркетинг. Сказать честно: за это платят вхождением в новую модель мышления и дисциплиной слоёв.

    **Переход:** ~~«И сразу самый частый вопрос: а зачем SQL, если у меня есть pandas?»~~
