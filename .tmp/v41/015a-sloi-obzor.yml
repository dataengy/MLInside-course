  title: 'Слои dbt-проекта: четыре уровня и одно правило'
  image: pic-dbt-layers-flow.png
  bullets:
  - 'sources — объявленные внешние таблицы, dbt их не строит'
  - 'staging — чистка и типы, одна модель на один источник, без джойнов'
  - 'intermediate — соединения и явно названная гранулярность'
  - 'marts — витрины под потребителя: BI-витрины и feature marts'
  - 'Правило одного направления: слой читает только нижний'
  - 'Ни соседа сбоку, ни самого себя сверху — иначе граф перестаёт быть графом'
