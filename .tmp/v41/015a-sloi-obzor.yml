  notes: |2
    [~1.5 мин] **Главное:** слои — это не папки для красоты, а !!договор об ответственности!!: где можно джойнить, а где нельзя.

    **Рассказ:** показать картинку справа — она читается за десять секунд: staging готовит строительные блоки, intermediate делает основную работу по соединению, marts отдают результат потребителю. Схема слева — то же самое вертикально, с подписью, что добавляет каждый переход.

    Проговорить главное правило вслух: !!слой читает только то, что ниже!!. Не соседа сбоку и не самого себя сверху. Как только витрина сходила join-ом прямо в source мимо staging, порядок сборки перестаёт быть выводимым, а любое изменение источника начинает бить в случайные места.

    **Для MLE:** feature mart — это marts, а не отдельная вселенная. Правила для него ровно те же, что для BI-витрины; отличается только потребитель.

    **Осторожно:** не заводить intermediate ради интермедиата. Если между stg и mart нечего делать — слой не нужен.

    **Переход:** ~~«Разберём каждый слой по ответственности и гранулярности».~~
