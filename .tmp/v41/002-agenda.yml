- kind: agenda
  id: 002-plan-lekcii
  title: План лекции
  bullets:
  - 'Роли вокруг данных и откуда взялся Analytics Engineering'
  - 'dbt как feature layer: слои, моделирование, сквозной пример Olist'
  - 'Jinja, макросы и пакеты: исходник и скомпилированный SQL'
  - 'Тесты, документация, lineage: контракт feature-таблицы'
  - 'Инкрементальность, ClickHouse и point-in-time correctness'
  - 'Границы dbt: Python-модели, OpenDBT, когда не dbt'
  - 'Оркестрация: Airflow + Cosmos, dmp-af, Dagster'
  - 'CI/CD, команды, качество проекта, логи и dbt + AI'
  - 'Дальше в деке: DS/MLE нюансы и расширенный справочник'
  notes: |2
    [~1.5 мин] **Главное:** у лекции сквозная линия — один пример Olist проходит через все блоки.

    **Рассказ:** пройтись по плану за минуту. Подчеркнуть три опорные точки: !!MLOps-смысл концепций dbt!! (второй блок), !!point-in-time correctness!! (пятый) и !!Airflow + Cosmos!! (седьмой). Остальное — обвязка вокруг них.

    **Для MLE:** предупредить, что домашнего задания в лекции нет — вместо него сквозной production-пример, который можно повторить у себя.

    **Осторожно:** не обещать «полный справочник по dbt». За основной частью в деке идут ещё две: !!PART 2 «DS/MLE нюансы»!! — теория про признаки, которая нужна вам, но не привязана к dbt, и !!PART 3 «Advanced»!! — справочник по возможностям, до которых на лекции не доходят руки.

    **Переход:** ~~«Начнём не с dbt, а с вопроса, кто вообще сегодня делает эту работу».~~
